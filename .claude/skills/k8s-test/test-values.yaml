# Values for a cluster test of the chart — the smallest overlay that produces a
# SERVING deployment, and nothing that weakens the security posture.
#
# Why each key is here:
#   database.existingSecret  the chart never ships a database; postgres.yaml
#                            creates this Secret
#   config.auth.basic.users  the chart's own default is auth on with NO mechanism,
#                            so every request 401s and no openEHR call can be
#                            proven. This is the published quickstart credential
#                            (ferroehr/ferroehr, Argon2id) — dev only.
#
# The password HASH goes in `secrets:`, never in `config:` — the chart mounts it at
# /etc/ferroehr-secrets/auth.basic.users.<username>.password_hash and injects the
# matching `password_hash_file`, so it reaches neither the ConfigMap nor the
# environment. Setting it under `config:` is REFUSED at render time. This overlay
# is therefore the live exercise of the mounted-secret path (step 5 asserts it).
replicaCount: 2

database:
  existingSecret: ferroehr-db
  # The key inside that Secret. The chart PROJECTS it as a file and passes only
  # FERROEHR__DB__URL_FILE, so the DSN never enters the pod's environment.
  existingSecretKey: FERROEHR__DB__URL

secrets:
  basicUserPasswordHashes:
    ferroehr: '$argon2id$v=19$m=19456,t=2,p=1$ZmVycm9laHJEZXZTYWx0$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8'

config:
  # No version-skew block: the deploy probe proved the published appVersion
  # image boots on the chart's stock config: defaults (P-K8S-BOOT, run of
  # 2026-08-14). If a future chart introduces keys the published image
  # predates, re-add per-key nulls HERE with the deletion condition stated —
  # a null omits the key, so a stale block quietly narrows what the run tests.
  auth:
    enabled: true
    basic:
      users:
        # Identity and roles only; the hash is in `secrets:` above.
        - username: ferroehr
          roles: [ADMIN, USER]

# A test cluster is not an installation; it sends no usage report (#3623).
usageReport:
  enabled: false
