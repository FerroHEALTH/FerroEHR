# yaml-language-server: $schema=https://api.fossabot.fossa.com/schemas/fossabot-config.v1.json
#
# Fossabot — automated dependency-upgrade pull requests.
# Reference: https://docs.fossa.com/docs/fossabot/continuous-integration
#
# The settings below are chosen for what this repository actually is: a
# clinical data repository whose dependency set is pinned in one workspace
# table, gated by `cargo deny`, and verified by a conformance suite that takes
# the better part of an hour. That makes upgrade PRs valuable but expensive, so
# they are rationed and given a cooling-off period.
version: 1

defaults:
  # Three at once. Every upgrade PR runs the full CI matrix — clippy at
  # `-D warnings` across the workspace, the 4400-test suite against a real
  # PostgreSQL 18, the codegen drift check, and the deployment probe — so a
  # wider queue costs runner time without being read any faster.
  maxOpenPRs: 3

  # Seven days before a release is eligible. A freshly published crate that is
  # yanked or immediately patched is a routine event, and this project pins
  # `--locked` builds precisely so that registry movement is never a surprise;
  # waiting a week means the common case is already resolved upstream when the
  # PR opens. It does NOT delay security work — that is what the threshold
  # below is for.
  minimumReleaseAge: 7

  # CVSS 7.0 (HIGH) and above is treated as security-critical and prioritised.
  # This is deliberately the same floor the container image scan acts on
  # (`image-scan.yml` files an issue on fixable HIGH/CRITICAL and stays green,
  # #2778), so a vulnerability does not count as urgent in one lane and
  # routine in another.
  securityCvssThreshold: 7.0
