name: Task
description: Maintenance, research, tooling or process work that is neither a defect nor a feature
type: Task
labels: ["chore"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What and why
      description: The goal of the task and what changes once it is done.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: The checklist that defines done.
      value: |
        - [ ] …
        - [ ] …
    validations:
      required: true
  - type: textarea
    id: further-information
    attributes:
      label: Further information
