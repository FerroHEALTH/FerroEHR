# .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    # Dependency bumps default to the changelog-guard escape (the triage
    # discipline adds a real entry when a bump is user-visible, which also
    # satisfies the guard with the label present).
    labels:
      - "dependencies"
      - "no-changelog"
    schedule:
      interval: "weekly"
    # A delay between a release being published and this bot proposing it, so a
    # compromised or yanked release has a window to be caught before it reaches a
    # pull request (the OWASP CI/CD Security Cheat Sheet's third-party-code
    # control). Longer for cargo than for actions: a compromised crate executes
    # in the build AND ships in the binary, which is the higher-consequence case.
    #
    # SECURITY updates are exempt by design — Dependabot applies no cooldown to
    # advisory-driven bumps, so an advisory still arrives immediately. That is
    # what makes a cooldown safe rather than a delay on getting fixes.
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    groups:
      # ONE weekly PR for every minor/patch bump (#2434 — thirteen open
      # single-crate PRs at once is review theatre, not review). Lockstep
      # families (opentelemetry, serde, axum/tower, utoipa, sea-query) bump
      # together inside it by construction. MAJORS stay individual: a semver
      # major in shipped code is a real review, and burying one in a batch
      # is how it gets rubber-stamped.
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"          # plain conventional prefix; no attribution
  # The fuzz harnesses are their OWN Cargo workspace with their own lock file
  # (`fuzz/Cargo.toml` opens with an empty `[workspace]` table precisely so the
  # root workspace never sees them). A `cargo` entry at `/` therefore reaches
  # none of it — Dependabot resolves the manifest at the directory it is given
  # and nothing above or below. The harnesses compile on the pull-request path,
  # so an unbumped dependency there breaks CI rather than rotting quietly, but
  # it would still never receive a security bump.
  #
  # Separate entries for one ecosystem are supported as long as the directories
  # do not overlap, which `/` and `/fuzz` do not:
  # https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    # Dependency bumps default to the changelog-guard escape (the triage
    # discipline adds a real entry when a bump is user-visible, which also
    # satisfies the guard with the label present).
    labels:
      - "dependencies"
      - "no-changelog"
    schedule:
      interval: "weekly"
    # The same window as the root cargo entry: these dependencies execute in a
    # build, and the harnesses link the crates under test.
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 5
    groups:
      # The harnesses are dev-only tooling in their own workspace: every
      # update class rides one weekly PR (#2434) — the harnesses compile on
      # the PR path, so a breaking bump fails that one PR visibly.
      fuzz-all:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
  # The three container base images are pinned by digest, which is what earns
  # the Scorecard `Pinned-Dependencies` score — and is also why they never
  # receive a patch unless something proposes one. Without this entry the
  # weekly published-image scan keeps FINDING base-layer CVEs in the clinical
  # images while nothing offers the fix.
  #
  # `directories` (plural) takes a list and supports globbing; `directory`
  # (singular) takes one path and does not. Each entry points at the directory
  # holding a Dockerfile, per the options reference above.
  - package-ecosystem: "docker"
    directories:
      - "/docker"
      - "/docker/postgres"
      - "/docker/viewer"
    # Dependency bumps default to the changelog-guard escape (the triage
    # discipline adds a real entry when a bump is user-visible, which also
    # satisfies the guard with the label present).
    labels:
      - "dependencies"
      - "no-changelog"
    schedule:
      interval: "weekly"
    # Between the cargo and actions windows. A base image ships in the product,
    # like a crate — but a base-image digest bump is reviewed against a build
    # and a Trivy scan before it can merge, which a crate bump is not.
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    groups:
      # The three base images move together in one weekly PR (#2434); each
      # bump is still reviewed against a build and a Trivy scan before merge.
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    # Dependency bumps default to the changelog-guard escape (the triage
    # discipline adds a real entry when a bump is user-visible, which also
    # satisfies the guard with the label present).
    labels:
      - "dependencies"
      - "no-changelog"
    schedule:
      interval: "weekly"
    # Shorter than cargo: an action runs in CI but does not ship in the product,
    # and these are digest-pinned, so a bump is a reviewed change of digest.
    cooldown:
      default-days: 3
    groups:
      # One weekly PR for every action bump (#2434 — one codeql-action release
      # alone used to open three PRs, one per sub-action). A breaking action
      # major fails the lanes on that one PR, visibly.
      actions-all:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
