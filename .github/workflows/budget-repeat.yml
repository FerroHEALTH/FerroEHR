# .github/workflows/budget-repeat.yml
#
# Runs both hot-path budget tests twenty times on one commit, four times on
# each of five runners beside a full run of the package, so the spread of
# every path's figure can be read from the logs (#6387). Temporary: the pull
# request that brings it removes it before it merges.
name: Budget repeat

on:
  pull_request:

permissions: {}

env:
  FERROEHR__USAGE_REPORT__ENABLED: "false"

jobs:
  postgres-image:
    name: postgres image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      postgres_image: ${{ steps.postgres.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: postgres
        run: |
          set -euo pipefail
          image="$(bash scripts/lib/base-image.sh ref docker/postgres/Dockerfile)"
          [[ "$image" =~ ^[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::docker/postgres/Dockerfile resolves to '$image', not name@sha256:<digest>"
            exit 1
          }
          echo "image=$image" >> "$GITHUB_OUTPUT"

  repeat:
    name: budget repeat ${{ matrix.runner }}
    needs: postgres-image
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    services:
      postgres:
        image: ${{ needs.postgres-image.outputs.postgres_image }} # zizmor: ignore[unpinned-images] the digest-pinned FROM of docker/postgres, checked name@sha256 where it is read
        env:
          POSTGRES_USER: openehr
          POSTGRES_PASSWORD: openehr
          POSTGRES_DB: openehr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U openehr"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openehr:openehr@localhost:5432/openehr_test
      FERROEHR_TEST_PG_URL: postgres://openehr:openehr@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-save-if: false
      - name: Non-durable test tuning
        env:
          PG_SERVICE: ${{ job.services.postgres.id }}
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client libxml2-utils
          PGPASSWORD=openehr bash scripts/lib/test-postgres.sh "$PG_SERVICE"
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest
      - name: Build the test binary
        run: cargo nextest run --locked -p ferroehr-rest --all-features --no-run
      - name: Run both budget tests four times beside a full run of the package
        env:
          RUNNER: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          mkdir -p repeat-out
          cargo nextest run --locked -p ferroehr-rest --all-features --no-tests=pass --no-fail-fast \
            > "repeat-out/load-$RUNNER.log" 2>&1 &
          load="$!"
          for i in 1 2 3 4; do
            cargo nextest run --locked -p ferroehr-rest --all-features --no-fail-fast \
              --success-output final --failure-output final \
              -E 'test(=statement_budget::paths::every_hot_path_stays_within_its_budget) | test(=statement_budget::paths::every_hot_path_stays_within_its_wire_budget)' \
              > "repeat-out/run-$RUNNER-$i.log" 2>&1 || echo "run $i: a budget test failed" >&2
          done
          wait "$load" || echo "the load run exited non-zero" >&2
      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: budget-repeat-${{ matrix.runner }}
          path: repeat-out/
          if-no-files-found: ignore
