# The chart package + publish, as a REUSABLE workflow — the SLSA Build
# Level 3 lane for the Helm chart (the mirror of release-build.yml and
# build-image.yml; #2140). A caller carries only triggers and passes the
# data inputs below — it cannot add steps beside the packaging and the
# signing, which is the whole property
# (https://slsa.dev/spec/v1.2/build-requirements §Provenance is
# Unforgeable; GitHub's reusable-workflow construction).
#
# TWO callers, and `release-tag` is what tells them apart (#2776):
#   * release.yml — the release pipeline's `chart` leg, `needs: scan-and-tag`,
#     so the appVersion image this chart is judged against is PULLABLE by
#     construction. It passes the released tag and the pipeline's pinned SHA.
#   * publish-chart.yml — a manual dispatch for a chart-only fix between
#     releases (dry run by default). It passes no tag, so this lane takes its
#     between-releases decisions: judge against an image built from the tree,
#     and report rather than refuse an already-published version on a dry run.
#
# A consumer pins:
#
#   gh attestation verify oci://ghcr.io/ferrohealth/charts/ferroehr@<digest> \
#     -R FerroHEALTH/FerroEHR \
#     --signer-workflow FerroHEALTH/FerroEHR/.github/workflows/build-chart.yml
name: Build chart (reusable)

on:
  workflow_call:
    inputs:
      publish:
        description: Actually push, sign and attest (false = dry run, package only).
        required: false
        type: boolean
        default: false
      release-tag:
        description: >-
          The `vX.Y.Z` tag being released, when this call is the release
          pipeline's chart leg. Non-empty means: the package is given THIS
          version as its appVersion and image annotations, it is judged against
          that version's image, and the push happens. Empty means a
          between-releases dispatch, which packages the committed default.
        required: false
        type: string
        default: ""
      sha:
        description: >-
          The commit to check out. Empty (a dispatch) takes the event's own ref;
          the release pipeline passes the SHA it pinned in `plan`, so every leg
          of a release reads one commit even if the tag moves.
        required: false
        type: string
        default: ""

permissions: {}

env:
  CHART_DIR: deploy/helm/ferroehr
  # `helm push` appends the chart name, so the chart lands at
  # ghcr.io/<owner>/charts/ferroehr.
  OCI_NAMESPACE: oci://ghcr.io/ferrohealth/charts
  CHART_REF: ghcr.io/ferrohealth/charts/ferroehr
  APP_IMAGE: ghcr.io/ferrohealth/ferroehr

jobs:
  build:
    name: package + publish
    runs-on: ubuntu-latest
    # This lane's own work only: it no longer waits for another workflow to
    # publish the image the acceptance step judges against (that ordering is a
    # `needs` edge in the release pipeline now), so the 75 minutes sized for
    # someone else's cold compile are gone.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the chart + the artifacthub.io tag to GHCR
      id-token: write # Sigstore, for the keyless attestation
      attestations: write # store it against this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.sha || github.ref }}

      # The same helm the golden renders are pinned to, from the same file. The
      # read-and-install pair lives in the composite (#2775), which is also where
      # the `version` vs `version-file` trap is recorded.
      - uses: ./.github/actions/helm-pinned
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # No build cache is restored anywhere in this lane (#2011): everything it
      # publishes is built from this checkout and nothing else.

      # TWO app versions, and the difference is the whole of #2779.
      #
      # `app` is what Chart.yaml COMMITS: the default image tag for a chart
      # packaged outside a release, which may legitimately lag the newest
      # release now that a cut no longer hand-edits it (scripts/checks/
      # chart-appversion.sh is what still holds it to a released version).
      #
      # `effective` is what this package will CARRY. On a release it is the tag
      # being released, injected below — `helm package --app-version` for the
      # field and deploy/helm/release-facts.sh for the annotation's tags,
      # the same treatment `artifacthub.io/changes` already gets and for the same
      # reason: they are facts about a release, and a committed copy is stale
      # from the next merge onwards. On a dispatch it is the committed value,
      # because a chart-only republish between releases must not invent a version
      # nobody released.
      - name: Read the chart's own versions
        id: chart
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          version=$(helm show chart "$CHART_DIR" | sed -nE 's/^version: *"?([^"]+)"?/\1/p')
          app=$(helm show chart "$CHART_DIR" | sed -nE 's/^appVersion: *"?([^"]+)"?/\1/p')
          [ -n "$version" ] && [ -n "$app" ] || { echo "::error::could not read version/appVersion from $CHART_DIR/Chart.yaml"; exit 1; }
          if [ -n "$RELEASE_TAG" ]; then
            effective="${RELEASE_TAG#v}"
            why="the released version, injected at package time"
          else
            effective="$app"
            why="the committed default (a between-releases dispatch invents no version)"
          fi
          {
            echo "version=$version"
            echo "app=$app"
            echo "effective=$effective"
          } >> "$GITHUB_OUTPUT"
          echo "chart version $version; committed appVersion $app; packaging appVersion $effective — $why"

      # The committed release facts still have to be internally coherent, and
      # `plan` runs this same script at the tagged commit before anything is
      # built. It no longer asserts equality with the workspace version: that
      # assertion is what forced the hand edit this lane now performs.
      - name: The committed chart release facts are coherent
        run: bash scripts/checks/chart-appversion.sh

      # The chart gates read the rendered YAML structurally (yq -o=json | jq),
      # because a grep over a manifest passes as soon as ONE container carries a
      # field. Pinned by version and verified by checksum: this step runs before
      # the security gates, so a substituted binary would decide whether they
      # pass.
      - name: Install yq
        env:
          YQ_VERSION: v4.53.3
          YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
        run: |
          set -euo pipefail
          # An idempotent read, retried inside curl (scripts/gh/retry-net.sh):
          # a publishing lane must not die on one transient download.
          source scripts/gh/retry-net.sh
          retry_read "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /tmp/yq
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version
      # validate.sh FAILS in CI when helm-docs is absent (#2806) — the README
      # drift check is load-bearing here, since this lane packages what it
      # validated. The v4.0.6 chart leg failed on exactly this: #2806 gave the
      # tool to ci.yml's helm-golden job and missed this second caller.
      - name: Install the pinned helm-docs
        env:
          VERSION_FILE: deploy/helm/.tool-versions
          HELM_DOCS_SHA256: a8cf72ada34fad93285ba2a452b38bdc5bd52cc9a571236244ec31022928d6cc
        run: |
          set -euo pipefail
          source scripts/gh/retry-net.sh
          version="$(awk '$1 == "helm-docs" { print $2 }' "$VERSION_FILE")"
          [ -n "$version" ] || { echo "::error::no helm-docs line in $VERSION_FILE"; exit 1; }
          retry_read "https://github.com/norwoodj/helm-docs/releases/download/v${version}/helm-docs_${version}_Linux_x86_64.tar.gz" \
            -o /tmp/helm-docs.tar.gz
          echo "${HELM_DOCS_SHA256}  /tmp/helm-docs.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm-docs.tar.gz -C /tmp helm-docs
          sudo install -m 0755 /tmp/helm-docs /usr/local/bin/helm-docs
          helm-docs --version
      - name: Chart validation + golden renders
        run: bash deploy/helm/validate.sh

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A published chart version is taken, exactly like a crates.io version —
      # except the registry will happily overwrite it, so the refusal has to live
      # here. `helm show chart` exits 0 when the version resolves and 1 when it
      # does not (verified against a local registry).
      #
      # It is a REFUSAL only on a path that actually pushes. On a dry run it
      # reports and continues: the tree's chart version is already published for
      # the whole cycle after a release, so the unconditional refusal made a dry
      # run impossible exactly when it is most useful — validating a change to
      # this lane without publishing anything (measured on run 32960523630,
      # where the guard fired before the dry-run branch was ever reached).
      - name: Refuse to overwrite an already-published chart version
        env:
          VERSION: ${{ steps.chart.outputs.version }}
          PUBLISHES: ${{ inputs.release-tag != '' || inputs.publish }}
        run: |
          set -euo pipefail
          if ! helm show chart "oci://${CHART_REF}" --version "$VERSION" >/dev/null 2>&1; then
            echo "chart version $VERSION is unpublished — proceeding."
            exit 0
          fi
          if [ "$PUBLISHES" != "true" ]; then
            echo "::notice::chart version $VERSION is already published at ${CHART_REF}; a real publish would be refused. This is a dry run, so it continues."
            exit 0
          fi
          echo "::error::chart version $VERSION is already published at ${CHART_REF} — a published version is immutable; bump Chart.yaml version."
          exit 1

      # WHICH image the chart is judged against is a per-trigger decision,
      # because the packaged appVersion and the chart's `config` defaults move on
      # different clocks (#2144). It is the PACKAGING appVersion that decides —
      # `steps.chart.outputs.effective`, not the committed one (#2779).
      #
      # On a release that is the version being released, so the image a `helm
      # install` of the published chart will actually pull is the one this cut
      # publishes — judging against it is exactly right, and it is the only
      # judgement that gates a push. That image exists BY CONSTRUCTION: this lane
      # is a `needs: scan-and-tag` job of the release pipeline, so the tags were
      # applied before it started.
      #
      # Between releases the packaged appVersion is a past release, while
      # values.yaml and the server's configuration vocabulary advance together
      # in-tree. Judging a mid-cycle dry run against it therefore fails from
      # the first commit that adds a configuration key until the release PR —
      # a fact about the clock, not about the artifact. A dispatch is judged
      # against an image built from THIS tree instead: containers.yml's
      # exact-commit `sha-` tag when it published one, otherwise `main`.
      # `main` is a sound fallback rather than a guess: every path that can
      # move the server's configuration vocabulary sits inside that workflow's
      # `app` filter, so the `main` tag carries this tree's vocabulary even
      # when the head commit built no image of its own.
      - name: Select the image the chart is judged against
        id: judge
        env:
          APP: ${{ steps.chart.outputs.effective }}
          IS_RELEASE: ${{ inputs.release-tag != '' }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$IS_RELEASE" = "true" ]; then
            image="${APP_IMAGE}:${APP}"
            why="the appVersion image — this is the release being cut"
          else
            candidate="${APP_IMAGE}:sha-${SHA:0:7}"
            if docker manifest inspect "$candidate" >/dev/null 2>&1; then
              image="$candidate"
              why="the image built from this commit; appVersion ${APP} predates this tree's configuration vocabulary"
            else
              image="${APP_IMAGE}:main"
              why="the main image (containers.yml published none for ${SHA:0:7}); appVersion ${APP} predates this tree's configuration vocabulary"
            fi
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "why=$why" >> "$GITHUB_OUTPUT"
          echo "judging the chart against ${image} — ${why}"

      # The check that catches the failure nobody could see from a rendered
      # manifest: `helm install` with no `image.tag` pins `appVersion`, and the
      # chart's `config` defaults track development between releases, so the
      # image can REJECT a key the chart ships and every pod crash-loops with
      # `unknown configuration key …`. Measured against ghcr.io/…/ferroehr:3.17.3:
      # the rendered defaults carry `server.limits` and `db.statement_timeout_ms`,
      # and that image's own `config check` refuses the file. A chart that cannot
      # deploy the image it selects is not published.
      # The last gate before a chart is published: the image it selects must
      # actually boot on what the chart renders. `deploy/helm/ci/boot-check.sh`
      # is the single implementation (the `chart-boot` CI lane runs the same
      # script against the tree-built image). This step used to carry a second,
      # hand-rolled copy of that replay, and the two drifted: the copy wrote a
      # placeholder into every file-borne secret, so a value-shaped boot rule —
      # the RFC 8725 32-byte HMAC floor, an Argon2id PHC password hash — was
      # judged against `x` rather than the configured secret, it skipped
      # `valueFrom.secretKeyRef` environment entirely, and it rendered only
      # `default-values.yaml` while the chart publishes three overlays. The
      # script mounts each secret at its REAL rendered value, resolves
      # secretKeyRef, and enumerates every committed overlay.
      - name: The selected image must accept every committed values overlay
        env:
          FERROEHR_IMAGE: ${{ steps.judge.outputs.image }}
          WHY: ${{ steps.judge.outputs.why }}
        run: |
          set -euo pipefail
          echo "judging against ${FERROEHR_IMAGE} — ${WHY}"
          if ! docker pull -q "$FERROEHR_IMAGE" >/dev/null; then
            echo "::error::${FERROEHR_IMAGE} could not be pulled, so the chart could not be judged against anything. It was selected as ${WHY}."
            exit 1
          fi
          if ! bash deploy/helm/ci/boot-check.sh; then
            echo "::error::${FERROEHR_IMAGE} (${WHY}) does not accept a committed values overlay — that install would crash-loop."
            exit 1
          fi

      # THE prerelease rule, one definition (#2775/#2776): any `-` suffix. This
      # lane used to spell it as `*-rc*|*-alpha*|*-beta*`, which is NARROWER —
      # a `v4.1.0-pre.1` tag published a pre-release GitHub Release and moved no
      # `:latest`, while its chart was annotated as a normal release. The
      # owner's 2026-07-31 sign-off is the any-dash rule, so the narrow list was
      # the defect; an exotic suffix now annotates as a pre-release too.
      - id: kind
        if: inputs.release-tag != ''
        uses: ./.github/actions/release-kind
        with:
          tag: ${{ inputs.release-tag }}

      # Everything about this package that is a fact about A RELEASE rather than
      # about the chart, injected here rather than committed — the argument
      # `artifacthub.io/changes` has carried since #2107, now applied to the two
      # sites that were still hand-edited at every cut (#2779):
      #
      #   * `artifacthub.io/changes` (+ containsSecurityUpdates) from CHANGELOG.md,
      #     so there is one changelog rather than two;
      #   * `artifacthub.io/prerelease` for an `-rc`-style tag;
      #   * the `artifacthub.io/images` TAGS, which `helm package --app-version`
      #     does not touch — it sets the appVersion field and nothing else, so
      #     without this the listing would advertise the previous release's
      #     images beside a correct appVersion.
      #
      # It runs AFTER `deploy/helm/validate.sh` on purpose: the golden renders
      # are byte-compared against the COMMITTED chart, and a rewritten Chart.yaml
      # would read as chart drift.
      - name: Inject the release's Artifact Hub annotations
        env:
          APP: ${{ steps.chart.outputs.effective }}
          IS_RELEASE_CUT: ${{ inputs.release-tag != '' }}
          IS_PRERELEASE: ${{ steps.kind.outputs.is-prerelease }}
        run: |
          set -euo pipefail
          # A release publishes that release's section. A dispatch between
          # releases publishes what is currently unreleased — and when
          # Unreleased is EMPTY (the recover-a-failed-tag-publish case, twice
          # live: 6.0.13 and 6.0.14), it falls back to the packaged appVersion's
          # own released section, which is what the chart being recovered ships.
          if [ "$IS_RELEASE_CUT" = "true" ]; then
            section="$APP"
          elif awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{exit} f && (/^- /||/^### /){found=1} END{exit !found}' CHANGELOG.md; then
            section="Unreleased"
          else
            echo "Unreleased is empty — falling back to the ${APP} section (tag-publish recovery)"
            section="$APP"
          fi
          bash deploy/helm/artifacthub-changes.sh "$section" --inject
          bash deploy/helm/release-facts.sh "$APP"
          if [ "$IS_PRERELEASE" = "true" ]; then
            printf '  artifacthub.io/prerelease: "true"\n' >> "$CHART_DIR/Chart.yaml"
          fi
          echo "--- annotations as packaged ---"
          sed -n '/^annotations:/,$p' "$CHART_DIR/Chart.yaml"

      # `--app-version` is passed unconditionally, because `effective` already IS
      # the committed value on a dispatch — one code path, and the flag is helm's
      # own documented way to set a package's appVersion without editing the
      # source chart.
      - name: Package
        id: package
        env:
          VERSION: ${{ steps.chart.outputs.version }}
          APP: ${{ steps.chart.outputs.effective }}
        run: |
          set -euo pipefail
          helm package "$CHART_DIR" --app-version "$APP" --destination dist
          ls -l dist
          echo "path=dist/ferroehr-${VERSION}.tgz" >> "$GITHUB_OUTPUT"

      # The injection is READ BACK from the packaged tarball, not assumed. Every
      # other publishing assertion in this lane is a read-back for the same
      # reason: a silent miss here publishes a listing that advertises the
      # previous release's images, and Artifact Hub would show it for a whole
      # cycle before anyone noticed.
      - name: The package carries the appVersion and image tags it should
        env:
          PACKAGE: ${{ steps.package.outputs.path }}
          APP: ${{ steps.chart.outputs.effective }}
        run: |
          set -euo pipefail
          packaged=$(helm show chart "$PACKAGE" | sed -nE 's/^appVersion: *"?([^"]+)"?/\1/p')
          if [ "$packaged" != "$APP" ]; then
            echo "::error::${PACKAGE} carries appVersion ${packaged}, expected ${APP} — 'helm package --app-version' did not take."
            exit 1
          fi
          # Only the FIRST-PARTY entries carry appVersion; a sibling image such as
          # FerroTERM rides its own version line and is marked `# party: third`
          # in the chart, the same marker scripts/checks/chart-appversion.sh reads.
          wrong=$(helm show chart "$PACKAGE" | grep -F '# party: first' | grep -oE 'image: ghcr\.io/[^:]+:[^ @]+' | grep -v ":${APP}\$" || true)
          if [ -n "$wrong" ]; then
            echo "::error::${PACKAGE} advertises first-party artifacthub.io/images tags that are not ${APP}:"
            echo "$wrong"
            exit 1
          fi
          # The README travels inside the package and is what Artifact Hub
          # renders as the front page, so its install example has to name the
          # same version the chart carries.
          readme=$(tar -xzOf "$PACKAGE" ferroehr/README.md)
          # A herestring, never `printf | grep -q`: -q closes the pipe at the
          # first match, printf takes SIGPIPE once the payload tops the 64K
          # pipe buffer, and pipefail turns the successful match into a red
          # leg (the v4.0.9 cut, when the regenerated README outgrew the
          # buffer).
          if ! grep -qF -- "--set image.tag=${APP}" <<<"$readme"; then
            echo "::error::the README inside ${PACKAGE} does not teach 'image.tag=${APP}' — the packaged front page would advertise a different version from the chart."
            printf '%s' "$readme" | grep -nE 'AppVersion|image\.tag=' || true
            exit 1
          fi
          echo "packaged appVersion ${packaged}; every artifacthub.io/images tag and the packaged README at ${APP}"

      - name: Dry run — everything but the push
        if: inputs.release-tag == '' && !inputs.publish
        env:
          PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          echo "DRY RUN: would push $PACKAGE to ${OCI_NAMESPACE}"
          helm show chart "$PACKAGE"

      - name: Push the chart
        id: push
        if: inputs.release-tag != '' || inputs.publish
        env:
          PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          helm push "$PACKAGE" "$OCI_NAMESPACE" 2>&1 | tee push.log
          digest=$(sed -nE 's/^Digest: (sha256:[0-9a-f]+)$/\1/p' push.log)
          [ -n "$digest" ] || { echo "::error::could not read the pushed digest from helm push output"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # A keyless cosign SIGNATURE over the pushed digest. Distinct from the
      # attestation below and not redundant with it: the attestation answers
      # "built from this source, this way", the signature answers "signed by this
      # workflow" — and the signature is what a Helm consumer's tooling and
      # Artifact Hub's listing actually look for.
      #
      # NO format flag, deliberately. cosign 3 signs in the protobuf bundle
      # format and there is no supported way to opt out here: measured against
      # cosign v3.1.3, `--new-bundle-format=false` is refused outright —
      # "must provide --new-bundle-format or --bundle where applicable with
      # --signing-config or --use-signing-config" — because `--use-signing-config`
      # defaults to true, and the flag is deprecated besides ("this will be the
      # only supported format in future versions").
      #
      # That the hub can still SEE it was checked rather than assumed, and the
      # chain is: GHCR serves no referrers API (`GET /v2/…/referrers/<digest>`
      # answers 404 MANIFEST_UNKNOWN, measured), so the signature is written to
      # the OCI fallback tag `sha256-<hex>`; the hub reads referrers through
      # cosign's `remote.Referrers`, which delegates to go-containerregistry,
      # which falls back to that same tag when the API is absent
      # (`WithReferrersTagFallback` — "The default is true"). Same layout, both
      # directions.
      - name: Sign the chart with keyless cosign
        id: sign
        if: steps.push.outputs.digest != ''
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # Retried: the chart is already pushed and immutable by this point, so
          # a transient Sigstore outage must not strand a published-but-unsigned
          # version (chart 6.0.14 was lost to a single Fulcio connection reset).
          for attempt in 1 2 3; do
            if cosign sign --yes "${CHART_REF}@${DIGEST}"; then
              exit 0
            fi
            echo "cosign sign attempt ${attempt} failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::cosign sign failed after 3 attempts"
          exit 1

      # Keyless provenance for the chart artifact, the same mechanism the images
      # use — see the header for why neither of these is a PGP `.prov`.
      #
      # Ordered AFTER the signature deliberately. GHCR serves no referrers API
      # (`GET /v2/…/referrers/<digest>` answers 404 MANIFEST_UNKNOWN, measured),
      # so BOTH artifacts reach the registry through the same OCI fallback tag,
      # `sha256-<hex>` — two writers to one index. Nothing in either tool
      # promises the second writer appends rather than replaces, so this lane
      # does not assume it: the step below reads both back and fails if either
      # went missing.
      - name: Attest build provenance
        id: attest
        if: steps.push.outputs.digest != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.CHART_REF }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Read both artifacts back, after both writers have run, because every
      # failure here is otherwise silent for weeks: a signature that does not
      # verify against this workflow's identity is worse than none; a signature
      # Artifact Hub cannot locate presents as a listing that still says "not
      # signed"; and an attestation the second writer dropped presents as
      # nothing at all until someone runs `gh attestation verify` and gets a 404.
      #
      # `cosign verify` is the consumer's own command, so this is the check a
      # user would run, not a proxy for it. The fallback-tag assertion is the
      # hub's view: it lists what the shared index actually holds and requires
      # the cosign signature and the SLSA provenance to BOTH still be there.
      - name: Verify the signature and the attestation both survived
        id: verify
        if: steps.sign.outcome == 'success' && steps.attest.outcome == 'success'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cosign verify "${CHART_REF}@${DIGEST}" \
            --certificate-identity-regexp "^https://github\.com/${REPO}/\.github/workflows/build-chart\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
          echo "the signature verifies against ${REPO}/.github/workflows/build-chart.yml"

          # The OCI fallback tag for a subject digest: `sha256:<hex>` → `sha256-<hex>`.
          fallback="${CHART_REF}:${DIGEST/:/-}"
          if ! manifest=$(oras manifest fetch "$fallback" 2>&1); then
            echo "::error::${fallback} is not fetchable, so neither the signature nor the attestation is discoverable from the registry: ${manifest}"
            exit 1
          fi
          echo "--- ${fallback} ---"
          printf '%s' "$manifest" | jq '{mediaType, manifests: [.manifests[] | {artifactType, digest, annotations}]}'
          # The signature half is already proven by `cosign verify` above, so
          # this only has to establish that the ATTESTATION entry is still in the
          # shared index. It is matched on the SLSA predicate or the in-toto
          # media type rather than on cosign's own media type, which differs
          # between cosign's bundle formats and is not ours to predict.
          # Herestring for the same SIGPIPE-under-pipefail reason as the
          # README check above.
          if ! grep -qE 'slsa\.dev/provenance|application/vnd\.in-toto' <<<"$manifest"; then
            echo "::error::${fallback} no longer carries the SLSA provenance entry — both the signature and the attestation write this one index (GHCR serves no referrers API), so one writer replaced the other's entry. The index is printed above."
            exit 1
          fi
          echo "sig=${fallback}" >> "$GITHUB_OUTPUT"
          echo "::notice::signature + provenance both readable at ${fallback}; Artifact Hub reports the signature on its next processing cycle."

      # Artifact Hub ownership (#2106). For an OCI repository there is no
      # `index.yaml`, so there is nowhere to commit this file as a sibling: it is
      # pushed as a special `artifacthub.io` TAG on the chart's own repository,
      # with the media types Artifact Hub looks for
      # (https://artifacthub.io/docs/topics/repositories/helm-charts/). Following
      # the HTTP instructions instead produces a committed file nothing reads and
      # silently no Verified Publisher badge, with no error anywhere — which is
      # why this runs on EVERY publish rather than once by hand.
      #
      # The config media type ends `+yaml`; the layer media type ends `.v1.yaml`
      # with no `+`. They are not the same shape and a swap is silent.
      - name: Push the Artifact Hub ownership metadata
        if: steps.push.outputs.digest != ''
        run: |
          set -euo pipefail
          if grep -q 'REPLACE_WITH_ARTIFACT_HUB_REPOSITORY_ID' deploy/helm/artifacthub-repo.yml; then
            echo "::error::artifacthub-repo.yml still carries the placeholder repositoryID — the listing would be unowned and the Verified Publisher badge unobtainable. Register the repository and fill the id in (deploy/helm/artifacthub-repo.yml)."
            exit 1
          fi
          cd deploy/helm
          oras push "${CHART_REF}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      # Read the ownership claim back the way Artifact Hub reads it — by LAYER
      # MEDIA TYPE, not by position — and confirm the id it carries is the one in
      # the tree. Without this the whole mechanism fails silently: a mistyped media
      # type (the config one ends `+yaml`, the layer one ends `.v1.yaml`), a
      # mistyped tag, or a registry that dropped the artifact all present as
      # "no Verified Publisher badge" weeks later, with no error anywhere.
      - name: Verify the ownership claim is readable and correct
        if: steps.push.outputs.digest != ''
        run: |
          set -euo pipefail
          layer="application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"
          manifest=$(oras manifest fetch "${CHART_REF}:artifacthub.io")
          count=$(printf '%s' "$manifest" | jq --arg t "$layer" '[.layers[] | select(.mediaType == $t)] | length')
          if [ "$count" != "1" ]; then
            echo "::error::the artifacthub.io tag carries $count layers of $layer (expected exactly 1) — Artifact Hub locates the metadata by this media type and will not find it."
            printf '%s\n' "$manifest"
            exit 1
          fi
          fetched=$(oras blob fetch --output - \
            "${CHART_REF}@$(printf '%s' "$manifest" | jq -r --arg t "$layer" '.layers[] | select(.mediaType == $t) | .digest')")
          want=$(sed -nE 's/^repositoryID: *(.+)$/\1/p' deploy/helm/artifacthub-repo.yml)
          got=$(printf '%s' "$fetched" | sed -nE 's/^repositoryID: *(.+)$/\1/p')
          if [ "$got" != "$want" ]; then
            echo "::error::the published ownership claim carries repositoryID '$got' but the tree says '$want'."
            exit 1
          fi
          echo "ownership claim readable at ${CHART_REF}:artifacthub.io, repositoryID $got"
          echo "::notice::Verified Publisher applies on Artifact Hub's next processing cycle. The GHCR package must be PUBLIC for the hub to read it at all."

      # Everything after `helm push` operates on an artifact that is already
      # PUBLIC and, by this lane's own refusal, immutable — so a failure there
      # consumes the chart version rather than leaving the tree where it was. It
      # happened on 5.0.0: the signing step failed, the chart stayed published
      # unsigned and un-attested, and the obvious next move — re-run the lane —
      # then failed on the immutability guard with a message about bumping
      # Chart.yaml that read like a mistake in the branch rather than the
      # consequence of the first failure. This says it at the point of the first
      # failure instead.
      - name: What the failure left behind
        if: failure() && steps.push.outputs.digest != ''
        env:
          VERSION: ${{ steps.chart.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            printf '## Chart %s is published, and this run failed after that\n\n' "$VERSION"
            printf 'The chart was pushed (`%s`) before the failing step, so it is public and\n' "$DIGEST"
            printf 'immutable: re-running this lane will be refused by the overwrite guard, and\n'
            printf 're-pushing the tag would silently replace a version consumers may already have.\n\n'
            printf 'It may be missing its signature, its attestation, or the Artifact Hub ownership\n'
            printf 'tag, depending on where this run stopped — check the steps above.\n\n'
            printf 'Fix the cause and ship it as the NEXT chart version. Leave %s as it is.\n' "$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::chart ${VERSION} is already published; fix the cause and ship the next version — do not re-run this lane for ${VERSION}."

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.chart.outputs.version }}
          APP: ${{ steps.chart.outputs.effective }}
          COMMITTED_APP: ${{ steps.chart.outputs.app }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SIGNATURE: ${{ steps.verify.outputs.sig }}
          JUDGED: ${{ steps.judge.outputs.image }}
          WHY: ${{ steps.judge.outputs.why }}
        run: |
          {
            printf '## Chart publish\n\n'
            printf '| | |\n|---|---|\n'
            printf '| chart version | `%s` |\n' "$VERSION"
            printf '| appVersion (packaged) | `%s` |\n' "$APP"
            printf '| appVersion (committed default) | `%s` |\n' "$COMMITTED_APP"
            printf '| judged against | `%s` (%s) |\n' "${JUDGED:-not selected}" "${WHY:-—}"
            printf '| repository | `%s` |\n' "$CHART_REF"
            printf '| digest | `%s` |\n' "${DIGEST:-not pushed}"
            printf '| signature | `%s` |\n' "${SIGNATURE:-not signed}"
            printf '\nInstall:\n\n```shell\nhelm install ferroehr oci://%s/ferroehr --version %s\n```\n' \
              "${CHART_REF%/ferroehr}" "$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
