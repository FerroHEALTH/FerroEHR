#
# The pipeline's wall clock, watched (#3131).
#
# A fixed shard count fits the suite it was sized for, and tests only grow.
#
# scripts/watch/ci-budget.sh reads the recent successful main runs, takes per
# lane the median job time of its slowest job, and when one crosses its budget
# files or updates ONE tracking issue naming the lane, the figure and the
# remedy. It measures job time, not wall clock, since the wall clock also
# counts runner queueing, which no shard count shortens. The run stays GREEN;
# it goes RED only when the probe fails (the API unreachable, or an answer jq
# cannot read).
#
# The budgets are loose: the line past which someone should look, about twice
# each lane's median (#3490).
name: CI budget watcher

on:
  schedule:
    # Mondays 09:47 UTC — a slot of its own; read the estate's with
    # `grep -rE '^ +- cron:' .github/workflows/`.
    - cron: "47 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-budget-watcher
  cancel-in-progress: false

jobs:
  watch:
    name: watch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # list main's runs and their jobs
      issues: write # file/update the one tracking issue below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Measure the recent main runs of each sharded lane
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/watch/ci-budget.sh --repo "$REPO" --out details.md
          if [ -s details.md ]; then over=1; else over=0; fi
          echo "over=$over" >> "$GITHUB_OUTPUT"

      - name: Compose the issue body
        if: steps.check.outputs.over == '1'
        run: |
          set -euo pipefail
          {
            echo 'The weekly budget watcher found a CI lane past its budget on main.'
            echo
            cat details.md
            echo
            echo 'The figure is job time, not the run wall clock, so runner queueing is not in'
            echo 'it. A sharded lane carries its shard count as ONE constant, so raising it is'
            echo 'a single line: the matrix, the job name and the partition divisor all follow it.'
            echo
            echo 'Raising the count is not automatically the answer. Check what actually grew: a'
            echo 'lane can cross its budget because the suite grew, because one test got slow'
            echo 'enough to dominate its shard, or because a cache stopped hitting. The first'
            echo 'wants more shards; the other two want fixing.'
          } > body.md

      - name: File or update the tracking issue
        if: steps.check.outputs.over == '1'
        uses: ./.github/actions/file-watcher-issue # zizmor: ignore[self-repository] actionlint 1.7.12 refuses the $/ form (rhysd/actionlint#711)
        with:
          title: "ci: a sharded lane is past its wall-clock budget on main"
          body-file: body.md
          type: Task
          labels: ci
