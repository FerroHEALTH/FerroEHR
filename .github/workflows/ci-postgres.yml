# .github/workflows/ci-postgres.yml: builds and pushes the PostgreSQL image
# the CI database jobs run (docker/ci-postgres, #6520) when its recipe
# changes on main. The jobs pin it by the digest this run prints, in
# docker/ci-postgres/image.ref. A pull request builds it without pushing.
name: CI PostgreSQL image

on:
  push:
    branches: [main]
    paths:
      - docker/ci-postgres/Dockerfile
      - docker/postgres/Dockerfile
      - .github/workflows/ci-postgres.yml
  pull_request:
    paths:
      - docker/ci-postgres/Dockerfile
      - docker/postgres/Dockerfile
      - .github/workflows/ci-postgres.yml
  workflow_dispatch:

concurrency:
  group: ci-postgres-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  image:
    name: build and push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push to ghcr.io on main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The CI image builds on docker/postgres's base
        run: |
          set -euo pipefail
          ours="$(bash scripts/lib/base-image.sh ref docker/ci-postgres/Dockerfile)"
          theirs="$(bash scripts/lib/base-image.sh ref docker/postgres/Dockerfile)"
          if [ "$ours" != "$theirs" ]; then
            echo "::error::docker/ci-postgres builds on $ours, docker/postgres on $theirs"
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/ci-postgres
          file: docker/ci-postgres/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/ferrohealth/ferroehr-ci-postgres:main
            ghcr.io/ferrohealth/ferroehr-ci-postgres:sha-${{ github.sha }}
      - name: The image starts with its settings
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          id="$(docker run -d -e POSTGRES_PASSWORD=ci ghcr.io/ferrohealth/ferroehr-ci-postgres:main)"
          for _ in $(seq 1 30); do
            docker exec "$id" pg_isready -U postgres -q && break
            sleep 1
          done
          docker exec "$id" psql -U postgres -Atc "SHOW shared_preload_libraries" | grep -q pg_stat_statements
          [ "$(docker exec "$id" psql -U postgres -Atc "SHOW max_connections")" = 400 ]
          [ "$(docker exec "$id" psql -U postgres -Atc "SHOW fsync")" = off ]
          docker rm -f -v "$id" >/dev/null
      - name: The digest to pin
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/ferrohealth/ferroehr-ci-postgres@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
