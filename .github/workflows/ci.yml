# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  # The types are spelled out (#2777) because the implicit default is
  # `[opened, synchronize, reopened]` only: applying an escape-hatch label
  # (`no-changelog`, `no-chart-bump`, `no-crate-bump`, `no-ui-visual-change`)
  # re-ran nothing, so the documented remedy was to close and reopen the pull
  # request to manufacture a fresh event. Every guard reads its label from the
  # event payload (`github.event.pull_request.labels`), which the
  # labeled/unlabeled payload carries CURRENT, so the label now takes effect on
  # the run it triggers.
  #
  # `labeled`/`unlabeled` fire once PER LABEL, so editing three labels queues
  # three runs — the concurrency group below collapses them, because PR runs
  # supersede within the pull request.
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  # Declared before any merge queue exists, because a queue reports its checks
  # on this event alone: "you need to update the workflows to include the
  # merge_group event as an additional trigger. Otherwise, status checks will
  # not be triggered when you add a pull request to a merge queue"
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#merge_group).
  # Enabling a queue is then a repository-settings change, not a workflow one.
  merge_group:

concurrency:
  # PR runs supersede within their own pull request (`github.ref` is
  # `refs/pull/N/merge`); every other event gets a group of its own COMMIT.
  #
  # Pending cancellation is not governed by `cancel-in-progress`: "By default,
  # any existing pending job or workflow in the same concurrency group will be
  # canceled and the new queued job or workflow will take its place"
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency).
  # With a per-ref group every main push shared one group, so a push that
  # queued behind a running one was cancelled by the next push and its guard
  # tier never reported at all — which is what happened to the v4.0.5 release
  # merge commit (run 32951162038). Keying non-PR runs by SHA gives each push
  # and each merge-group entry a group of its own, so nothing can pend behind a
  # sibling (#2777).
  #
  # `case(pred, value, default)` is the documented conditional-value function —
  # "Evaluates predicates in order and returns the value corresponding to the
  # first predicate that evaluates to true. If no predicate matches, it returns
  # the last argument as the default value"
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/expressions)
  # — used in preference to the `a && b || c` idiom, which the operator table
  # does not define.
  group: ci-${{ case(github.event_name == 'pull_request', github.ref, github.sha) }}
  # Cancel superseded PR runs, NEVER a main run. The change filter below
  # compares only THIS push's delta, so a main run cancelled mid-flight is
  # never re-evaluated by the next push if that push touches no code — a
  # defect can then land permanently with every job reported green-or-skipped.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permissions by default; every job grants itself the minimum it needs
# (job-level permissions override workflow-level ones —
# docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions).
# A job added without a `permissions:` block therefore gets a token that can do
# nothing, which fails loudly at its checkout rather than running over-privileged.
permissions: {}

env:
  # The ONE place each sharded lane's count lives. Raising one is that line: the
  # matrix, the job name and the `--partition` divisor are all derived from it,
  # so they cannot drift apart. When one needs raising, the pipeline-budget
  # watcher says so rather than someone noticing a slow pull request (#3131).
  TEST_SHARDS: "3"
  UI_E2E_SHARDS: "3"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CI builds are closer to from-scratch builds; incremental compilation only
  # adds dependency-tracking overhead and bloats the caches — and sccache
  # cannot cache incrementally-compiled crates at all
  # (github.com/mozilla/sccache#known-caveats).
  CARGO_INCREMENTAL: "0"
  # No debuginfo in CI test builds: linking is the one cost no compile cache
  # can remove (sccache never caches linker invocations), and debuginfo is
  # most of the link weight and most of ./target's cache size. Backtraces
  # keep symbol names, only source lines are lost (the bevy/polars pattern:
  # bevy sets exactly these two vars; polars uses `-C debuginfo=0`).
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Every job here is REQUIRED — there is no advisory tier.
  #
  # Event gating (#2777), the rule behind every `if:` in this file that names
  # an event: a job reading `pull_request` OR `merge_group` is a WHOLE-TREE
  # check, and it must report inside a merge queue too, because a queue runs
  # the required checks on the merge_group event alone. A job gated on
  # `pull_request` ALONE reads pull-request context the merge_group payload
  # does not carry — a `base..head` diff of the pull request, or one of the
  # escape-hatch labels — and it has already gated that pull request before
  # the queue ever builds a group. Everything else is ungated by event and
  # runs on all three.
  #
  # Cache policy (the ruff/polars `save-if` idiom): only main writes the
  # per-job rust-cache entries and the sccache entries; PR branches restore
  # main's warm cache and never publish their own. PR-branch caches are read by nothing else (GHA
  # cache scoping), so letting every PR save would only thrash the shared
  # 10 GB repo quota and evict the caches that matter — including the ui-e2e
  # exact-key binary caches below.

jobs:
  # ── Change detection: cargo jobs run ONLY when build-relevant paths change ──
  # Allowlist (owner ruling 2026-07-17: no Rust-affecting change → no cargo
  # jobs, workflow-only and docs-only PRs included): app/, crates/, tools/,
  # scripts/, .cargo/, .config/, Cargo.toml, Cargo.lock, rust-toolchain.toml,
  # rustfmt.toml, clippy.toml, deny.toml. Everything else (docs/, website/,
  # .claude/, .github/, markdown, compose files, assets) skips the cargo
  # jobs. GitHub treats a skipped required check as satisfied, so branch
  # protection is unaffected; a workflow-gating bug surfaces on the next
  # code-touching PR, which is acceptable.
  #
  # TWO NARROW EXCEPTIONS to "not build-relevant" (#2373), both instances of
  # the rule the viewer/helm/chart_boot filters below already state — a
  # change to a job's own recipe exercises the job it changes:
  #   * `workflows` — this file. A workflow-only PR skipped EVERY cargo lane,
  #     including the lane whose recipe it was editing, so a narrowed clippy
  #     invocation or a dropped feature combination went in unexercised. It
  #     re-triggers the four RECIPE-BEARING cargo lanes (clippy,
  #     feature-combos, deny, test) rather than every cargo lane: those four
  #     encode WHICH surface is verified — which crates, which features, which
  #     flags, which extra guard scripts — so an edit there can NARROW what CI
  #     checks while every lane still reports green. The single-command lanes
  #     (fmt, doc, msrv, codegen-drift, unused-deps) run one canonical
  #     whole-workspace command with no surface to narrow; a broken edit there
  #     fails that lane outright on the next code-touching PR, which is the
  #     same trade-off the paragraph above already accepts.
  #   * `vex` — the VEX gates that run inside the `deny` job
  #     (`vex-reachability.sh` reads the generated OpenVEX document,
  #     `advisory-exceptions.sh` reads `deny.toml`) plus the two check scripts
  #     themselves. `deny.toml` is already in the code allowlist; the VEX
  #     documents and those scripts are not, so a `security/vex/**`-only PR
  #     skipped the job that enforces them (#2370).
  changes:
    name: change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      viewer: ${{ steps.filter.outputs.viewer }}
      server_dockerfile: ${{ steps.filter.outputs.server_dockerfile }}
      helm: ${{ steps.filter.outputs.helm }}
      chart_boot: ${{ steps.filter.outputs.chart_boot }}
      deploy: ${{ steps.filter.outputs.deploy }}
      workflows: ${{ steps.filter.outputs.workflows }}
      vex: ${{ steps.filter.outputs.vex }}
      msrv: ${{ steps.filter.outputs.msrv }}
      test_shards: ${{ steps.shards.outputs.test_list }}
      test_shard_count: ${{ steps.shards.outputs.test_count }}
      ui_e2e_shards: ${{ steps.shards.outputs.ui_list }}
      ui_e2e_shard_count: ${{ steps.shards.outputs.ui_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Each lane's shard list and its divisor, both from the one constant, so a
      # matrix and its `--partition n/N` can never disagree.
      - id: shards
        env:
          TEST_COUNT: ${{ env.TEST_SHARDS }}
          UI_COUNT: ${{ env.UI_E2E_SHARDS }}
        run: |
          set -euo pipefail
          {
            echo "test_count=$TEST_COUNT"
            echo "test_list=[$(seq 1 "$TEST_COUNT" | paste -sd, -)]"
            echo "ui_count=$UI_COUNT"
            echo "ui_list=[$(seq 1 "$UI_COUNT" | paste -sd, -)]"
          } >> "$GITHUB_OUTPUT"
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            # A merge group is checked out as the queue ref, whose head is
            # `github.sha` ("GITHUB_SHA: SHA of the merge group" — the
            # events-that-trigger-workflows reference), sitting on top of the
            # base-branch tip the group was built from. The delta is therefore
            # base_sha..github.sha. If that base does not resolve, the fallback
            # below runs every job rather than gating nothing (#2777).
            base="$QUEUE_BASE"; head="$PUSH_SHA"
          else
            base="$PUSH_BEFORE"; head="$PUSH_SHA"
          fi
          # First push / unknown base: run everything. Every output must be set
          # here — an unset output reads as `false` downstream, and a skipped job
          # counts as satisfied in `conclusion`, so omitting one turns "run
          # everything" into "silently gate nothing".
          if ! git rev-parse --verify --quiet "$base" >/dev/null; then
            echo "Base $base unavailable — treating as a change to everything."
            {
              echo "code=true"
              echo "viewer=true"
              echo "msrv=true"
              echo "server_dockerfile=true"
              echo "helm=true"
              echo "chart_boot=true"
              echo "deploy=true"
              echo "workflows=true"
              echo "vex=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$head")
          echo "Changed files:"; echo "$changed"
          # Every output is written here for the reason the fallback above
          # states: an unset output reads as `false` downstream and a skipped
          # job counts as satisfied, so writing only `code` would leave the
          # other gates unset rather than deliberately false.
          if [ -z "$changed" ]; then
            {
              echo "code=false"
              echo "viewer=false"
              echo "server_dockerfile=false"
              echo "helm=false"
              echo "chart_boot=false"
              echo "deploy=false"
              echo "workflows=false"
              echo "vex=false"
              echo "msrv=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # scripts/ is NOT build-relevant by default: the cargo jobs never
          # execute repo scripts, so a new watcher/site/release script must
          # not cost a Rust run. Allowlist the ONLY scripts a code-gated CI
          # job actually executes (the drift check, the e2e harness, and the
          # frozen-lockfile cargo-leptos wrapper the viewer build runs).
          # The deployment harness drives the composed stack, so it is relevant
          # to its own scripts, the compose files, and the server image — and to
          # the code, since what it probes IS the server.
          if echo "$changed" | grep -qE '^(scripts/deploy-probe|docker-compose|docker/)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
          code_relevant=$(echo "$changed" | grep -vE '^scripts/' || true)
          if echo "$changed" | grep -qE '^scripts/(checks/codegen-drift|ui-e2e|cargo-leptos)\.sh$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          # `corpus/` is the shared vendored breadth corpus the crate and
          # application suites read (it moved out of `tools/` with the
          # conformance instrument, #2811) — a corpus change is a change to what
          # the test job exercises, so it must not skip the cargo jobs.
          elif echo "$code_relevant" | grep -qE '^(app/|crates/|tools/|corpus/|\.cargo/|\.config/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|rustfmt\.toml$|clippy\.toml$|deny\.toml$)' ; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "No build-relevant paths touched — cargo jobs will be skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # MSRV trigger: `cargo hack check --rust-version` compiles the whole
          # workspace under every feature permutation to verify one manifest
          # field, and it cost 556 s on every pull request (#3120). The property
          # it checks — that no crate needs more than the declared
          # `rust-version` — can only change when a manifest declares a
          # different floor, a dependency arrives or moves, or the toolchain
          # itself does. Source edits cannot change it: the compiler that
          # accepts them is the same one either way, and a source-level MSRV
          # violation is `clippy::incompatible_msrv`, which is deny-tier on
          # every cargo lane.
          if echo "$changed" | grep -qE '(^|/)Cargo\.toml$|^Cargo\.lock$|^rust-toolchain\.toml$|^clippy\.toml$|^\.github/workflows/ci\.yml$'; then
            echo "msrv=true" >> "$GITHUB_OUTPUT"
          else
            echo "msrv=false" >> "$GITHUB_OUTPUT"
          fi
          # Viewer E2E trigger: the viewer crate, its harness, the
          # composed stack it drives — AND the inputs to the CDR artifact the
          # battery runs against. `Cargo.lock`, `docker/Dockerfile` and this
          # workflow itself were missing (issue #335): a dependency bump, a
          # Dockerfile change, or a change to the job's own build recipe each
          # alter what is under test, and without them a build/caching-only PR
          # could not even run the job it changes.
          # The boot-installed POLICY inputs are here for the same reason
          # (issue #3190): the battery is the only lane that runs the real
          # binary on the real shipped configuration, and the unit suites
          # cannot see a default posture at all — they build the service with
          # `FerroEhrService::new()`, which installs no policy. A privacy
          # default that refused the server's own example composition reached
          # main because both PRs that produced it missed this filter.
          if echo "$changed" | grep -qE '^(app/ferroehr-viewer/|app/ferroehr-server/src/|app/ferroehr/src/privacy/|app/ferroehr/src/config/|app/ferroehr/assets/ferroehr\.default\.toml$|scripts/ui-e2e\.sh$|scripts/cargo-leptos\.sh$|docker-compose\.yml$|docker-compose\.override\.yml$|docker-compose\.dev\.yml$|docker-compose\.keycloak\.yml$|docker/Dockerfile$|docker/viewer/|docker/keycloak/|docker/postgres/|Cargo\.lock$|\.github/workflows/ci\.yml$)' ; then
            echo "viewer=true" >> "$GITHUB_OUTPUT"
          else
            echo "viewer=false" >> "$GITHUB_OUTPUT"
          fi
          # The compose/local image target (docker/Dockerfile
          # `runtime-from-source`) is not built by ui-e2e, which packages
          # the shipped `runtime-prebuilt` target instead — so that target gets
          # its own job, gated on the files whose change can break it: the
          # Dockerfile and the build-context ignore list, which decides what the
          # builder stage can even see.
          if echo "$changed" | grep -qE '^(docker/Dockerfile|\.dockerignore)$' ; then
            echo "server_dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "server_dockerfile=false" >> "$GITHUB_OUTPUT"
          fi
          # Helm chart gate (#2110): the chart, its CI value overlays, the golden
          # renders, the validator, the helm pin — and this workflow itself, so a
          # change to the job's own recipe exercises the job it changes.
          if echo "$changed" | grep -qE '^(deploy/helm/|\.github/workflows/ci\.yml$)' ; then
            echo "helm=true" >> "$GITHUB_OUTPUT"
          else
            echo "helm=false" >> "$GITHUB_OUTPUT"
          fi
          # Chart BOOT gate (#2159), a strict superset of the helm filter: the
          # overlays are only half of the pair under test, the other half being
          # the configuration vocabulary they are written against. Both sides
          # can break it — the overlays went un-bootable because the SERVER
          # tightened validation (an auth mechanism became mandatory, the HMAC
          # floor arrived, a password hash started being parsed at boot) while
          # the values files stood still and every render stayed green. So a
          # change to the config tree, its validators or the annotated template
          # that is the schema of record re-boots the overlays too. The
          # Dockerfile is in because it decides what the binary is packaged into,
          # and report.rs because a production overlay's posture is read from
          # `ferroehr report`.
          if echo "$changed" | grep -qE '^(deploy/helm/|\.github/workflows/ci\.yml$|docker/Dockerfile$|app/ferroehr/src/config/|app/ferroehr/assets/ferroehr\.default\.toml$|app/ferroehr-rest/src/config\.rs$|app/ferroehr/src/report\.rs$)' ; then
            echo "chart_boot=true" >> "$GITHUB_OUTPUT"
          else
            echo "chart_boot=false" >> "$GITHUB_OUTPUT"
          fi
          # Recipe gate (#2373): this workflow itself. Consumed by the four
          # cargo lanes whose recipe decides WHAT is verified — clippy,
          # feature-combos, deny and test — each of which ORs it into its
          # `if:` beside `code`. Deliberately narrower than adding this file to
          # the `code` allowlist, which would re-run every cargo job on a
          # comment fix; deliberately wider than nothing, which is what let a
          # workflow-only PR edit a lane's recipe without ever running it.
          if echo "$changed" | grep -qE '^\.github/workflows/ci\.yml$' ; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
          else
            echo "workflows=false" >> "$GITHUB_OUTPUT"
          fi
          # VEX gate (#2370): the published OpenVEX documents and the two
          # checks that read them, all enforced INSIDE the `deny` job. Only
          # `deny.toml` is in the code allowlist, so without this a PR editing
          # a VEX justification or its check script skipped the job that would
          # have refused it.
          if echo "$changed" | grep -qE '^(security/vex/|scripts/checks/(vex-reachability|advisory-exceptions)\.sh$)' ; then
            echo "vex=true" >> "$GITHUB_OUTPUT"
          else
            echo "vex=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Required for code changes: formatting ───────────────────────────────────
  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt
          # rustfmt compiles nothing — a restored target/registry cache is
          # pure download time here.
          cache: false
      - run: cargo fmt --all --check

  # ── Always required: no AI/Claude attribution in commit messages ────────────
  no-attribution:
    name: no attribution in commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan commit messages for attribution
        shell: bash
        # Context reaches the shell through env, never `${{ }}`-inline: the
        # expression is substituted into the script BEFORE bash parses it, so an
        # inline expansion is executable text (the `changes` job above is the
        # pattern). Same discipline as the other guards in this workflow.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
            base="$PR_BASE"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            # The queued commits, resolved the same way the change filter does
            # it (#2777). `github.event.before` is absent on this event, so
            # falling through to the push branch would build the range
            # `..<sha>` — which git reads as `HEAD..<sha>`, i.e. nothing — and
            # this guard would pass vacuously on every queued pull request.
            range="$QUEUE_BASE..$PUSH_SHA"
            base="$QUEUE_BASE"
          else
            range="$PUSH_BEFORE..$PUSH_SHA"
            base="$PUSH_BEFORE"
          fi
          # Handle first-push / shallow edge cases.
          git rev-parse "${base:-HEAD~1}" >/dev/null 2>&1 || range="HEAD"
          echo "Scanning range: $range"
          # `[bot]` catches an automation co-author, with one exception:
          # GitHub's squash merge of a Dependabot pull request writes
          # `Co-authored-by: dependabot[bot] <…>`, which names a dependency
          # updater, not an AI author. The hook in .githooks/commit-msg keeps
          # that same line, so the two guards agree.
          if git log --format='%B' "$range" 2>/dev/null | grep -iEn \
             'co-authored-by:.*(claude|anthropic|\[bot\])|generated[[:space:]]+(with|by)[[:space:]]+.*claude|claude[[:space:]]+code|🤖|assisted-by:.*claude' \
             | grep -viE '^[0-9]+:[[:space:]]*co-authored-by: dependabot\[bot\] <[0-9]+\+dependabot\[bot\]@users\.noreply\.github\.com>[[:space:]]*$'; then
            echo "::error::Commit message contains AI/Claude attribution. Remove it (see project hard rules)."
            exit 1
          fi
          echo "OK: no attribution found."

  # ── Always required: the workflows audit themselves ─────────────────────────
  # zizmor (docs.zizmor.sh) is static analysis for GitHub Actions, named by the
  # OWASP GitHub Actions Security Cheat Sheet as the defence-in-depth tool for
  # this layer. It is the machine check behind three hard properties here: every
  # `uses:` hash-pinned (unpinned-uses, blanket policy by default), no checkout
  # persisting credentials without a recorded exception (artipacked), and no
  # context value spliced into a shell (template-injection).
  #
  # Ungated on the `changes` filter on purpose: that filter excludes `.github/`,
  # so a workflow-only pull request would otherwise skip the one check that reads
  # workflows.
  workflow-audit:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: zizmor@1.29.0
      - name: Audit .github/workflows + .github/actions
        # GH_TOKEN enables the ONLINE audits, which is the point of running this
        # beside SHA pinning: impostor-commit verifies that a pinned commit
        # really belongs to the repository named in front of it, and it cannot
        # do that offline. --min-severity=low gates on every actionable tier
        # (artipacked is Low) and leaves the informational tier advisory; zizmor
        # exits non-zero when anything at or above the floor is found.
        #
        # The composite actions are audited too (#2775): they carry `uses:` of
        # their own, so a pin only they declare would otherwise be the one
        # `uses:` in the estate nothing checks.
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=low .github/workflows/ .github/actions/

  # actionlint (github.com/rhysd/actionlint) is the CORRECTNESS half of the pair
  # above: zizmor audits security posture, actionlint checks that the workflow
  # is well-formed at all — `${{ }}` expressions that cannot evaluate, `needs:`
  # naming a job that does not exist, unknown runner labels, and shellcheck over
  # every embedded `run:` block. A committed `.github/actionlint.yaml` (the
  # runner-label roster) existed here long before this job did, so the tool was
  # being run by hand and never gated.
  #
  # Ungated on the `changes` filter for the same reason zizmor is: that filter
  # excludes `.github/`.
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint .github/workflows
        # The OFFICIAL image, digest-pinned. actionlint is a Go binary, so
        # `taiki-e/install-action` does not carry it and its cargo-binstall
        # fallback cannot ("actionlint is not found" — it is not a crate). The
        # upstream alternative is `curl | bash` off `main`, which is exactly the
        # unpinned fetch this repository's pinning rule exists to forbid. The
        # image is also the only distribution that BUNDLES shellcheck, which
        # half of actionlint's value depends on: "The image contains actionlint
        # executable and all dependencies (shellcheck and pyflakes)"
        # (https://github.com/rhysd/actionlint/blob/main/docs/usage.md).
        #
        # SC2016 ("expressions don't expand in single quotes") is excluded, and
        # only it: every occurrence in this repo is a `printf` format string or a
        # `jq` filter, where single quotes are the CORRECT idiom precisely
        # because the shell must not expand `%s` or `$`. Nothing else is
        # suppressed — the run is clean at actionlint's own default severity.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            -e SHELLCHECK_OPTS='-e SC2016' \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      # actionlint validates each job in isolation and cannot know that this
      # repository routes branch protection through a single `conclusion` check,
      # which makes a job missing from its `needs` list run without gating
      # anything.
      - name: Every CI job gates the merge
        run: bash scripts/checks/ci-conclusion-complete.sh

  # The other half of the pair above. actionlint shellchecks the `run:` blocks
  # EMBEDDED in workflows; the scripts those blocks call — every CI guard, every
  # vendor fetcher, every deploy probe, the release machinery, the git hooks —
  # had no static check at all until #2785. `--severity=style` is ShellCheck's
  # lowest floor, so everything gates: a finding is fixed, or carries a per-line
  # `# shellcheck disable=SCnnnn` directive with its reason. There is no
  # .shellcheckrc, deliberately — nothing may turn a code off tree-wide.
  #
  # The lane is a committed script so local and CI run the identical check.
  shellcheck:
    name: shellcheck
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The upstream RELEASE binary, pinned by version — not the runner's distro
      # package, which is whatever Ubuntu froze for that image and moves under us
      # at every runner-image refresh. Every disable directive in this repository
      # was adjudicated against 0.11.0's diagnostics, so the analyzer version is
      # part of what the gate means. Fetched by the same SHA-pinned installer the
      # zizmor job uses, which resolves
      # github.com/koalaman/shellcheck/releases and verifies the checksum.
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: shellcheck@0.11.0
      - name: Every shell program is clean at severity=style
        run: bash scripts/checks/shellcheck-lane.sh
      - name: The dangerous-command hook refuses and allows the shapes it documents
        run: bash .claude/hooks/block_dangerous_test.sh
      - name: The crate-version hook refuses a packaged change without a bump
        run: bash .claude/hooks/crate_version_bump_guard_test.sh
      - name: The GHCR prune deletes nothing on a dry run and keeps young and retagged manifests
        run: bash scripts/watch/ghcr-prune-orphans.sh --self-test
      - name: The release withdrawal refuses unregistered versions and moves only the floating tags
        run: bash scripts/release/withdraw.sh --self-test
      - name: The release-notes check refuses notes without the CRA user information or the support period
        run: bash scripts/checks/release-notes.sh --self-test

  # The tracker helpers set the native issue type and the Priority and Effort
  # fields, and declare the label taxonomy (.claude/rules/issue-workflow.md).
  # Each carries a --self-test against a stub gh, so a change to the mapping
  # or to the GraphQL it speaks is caught without touching the live tracker.
  tracker-helpers:
    name: tracker-helpers
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fields.sh files and sets type, priority and effort
        run: bash scripts/gh/fields.sh --self-test
      - name: migrate-fields.sh maps the retired labels
        run: bash scripts/gh/migrate-fields.sh --self-test
      - name: labels.sh declares the taxonomy and retires the old labels
        run: bash scripts/gh/labels.sh --self-test

  # The FerroTERM the sandbox pins must read the terminology index the box
  # carries (#3520): the v4.3.2 release's sandbox leg failed on a pin bump that
  # moved the artifact layout. The check reads LAYOUT_VERSION at the pinned
  # FerroTERM tag and compares it with deploy/hosted/ferroterm-index.env.
  ferroterm-index-layout:
    name: ferroterm-index-layout
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The check refuses a differing and an unreadable layout
        run: bash scripts/checks/ferroterm-index-layout.sh --self-test
      - name: The pinned FerroTERM reads the box's index layout
        run: bash scripts/checks/ferroterm-index-layout.sh

  # The hosted box's deploy script lives inside deploy/hosted/cloud-init.yaml
  # as a write_files block, where no other gate reads shell (#2974); this
  # extracts and shellchecks it, and checks that docker/Dockerfile bakes every
  # posture path the script reads out of the image.
  hosted-deploy-script:
    name: hosted-deploy-script
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: shellcheck@0.11.0
      - name: The embedded deploy script is clean and its posture paths are baked
        run: bash scripts/checks/hosted-deploy-script.sh

  # Comment-style guard (.claude/rules/comments.md, RFC 505/1574): block
  # comments, TODO(#N) form, NOTE/essay line budgets — over the WHOLE tree
  # hand-written .rs files (the legacy essay sweep #1870 closed; the step runs
  # --all).
  comment-style:
    name: comment-style
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Comment style on changed Rust files
        run: bash scripts/checks/comment-style.sh --all

  spec-citations:
    name: spec-citations
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Every cited openEHR spec file exists
        run: bash scripts/checks/spec-citations.sh --all
      - name: The migration-citation detector catches what it claims to
        run: bash scripts/checks/migration-citations.sh --self-test
      - name: Every cited migration file exists
        run: bash scripts/checks/migration-citations.sh --all
      - name: The application-path detector catches what it claims to
        run: bash scripts/checks/crate-tests-read-no-app.sh --self-test
      - name: No test in a published crate reads the application tree
        run: bash scripts/checks/crate-tests-read-no-app.sh

  # No Python anywhere (.claude/rules/rust-style.md §No Python): the tooling
  # languages are bash and Rust. Embedded Python is the worst case — a heredoc
  # inside a command substitution makes bash scan the Python for quote pairs,
  # so one apostrophe in a comment breaks the script.
  no-python:
    name: no-python
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No Python invocations or sources
        run: bash scripts/checks/no-python.sh

  # This project's own code is BUSL-1.1, so a GPL-family or SSPL grant inside a file
  # we wrote is a licence conflict. It lives here rather than in `.fossa.yml`
  # because FOSSA's customLicenseSearch could not upload on this org's plan and
  # did not honour that file's path exclusions (measured 2026-08-12).
  # LICENSE, REUSE.toml and the codegen header constant must agree on the
  # copyright holder. They did not, and nothing compared them (#2325).
  # Shell, SQL and YAML carry their licence in the file too, so a copied
  # migration or script travels with it (#2326).
  spdx-headers-text:
    name: spdx-headers-text
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell, SQL and YAML state their licensing
        run: bash scripts/checks/spdx-headers-text.sh

  # The vendored legal texts are only worth carrying while their recorded
  # digests are true: docs/law/ exists so a compliance claim resolves to a
  # fixed referent instead of to whatever a publisher's page says today, and a
  # hand edit or a partial re-fetch is otherwise invisible.
  law-corpus:
    name: law-corpus
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vendored legal texts match their recorded digests
        run: bash scripts/checks/law-corpus.sh

  copyright-holder:
    name: copyright-holder
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: One copyright holder, stated identically everywhere
        run: bash scripts/checks/copyright-holder.sh

  license-text:
    name: license-text
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No copyleft licence text in first-party source
        run: bash scripts/checks/first-party-license-text.sh

  # REUSE 3.3 compliance: every file in the tree has machine-readable licensing
  # that SURVIVES the file being copied out of it — which is the expected case
  # for a repository whose premise is that people build on it and ship it, and
  # which redistributes material under six distinct licences.
  #
  # The per-tree `PROVENANCE.md` arrangement is accurate but travels with the
  # tree, not with the file. `REUSE.toml` closes that gap by glob, touching no
  # vendored file — which matters, because hand-editing vendored material is
  # forbidden here.
  licensing:
    name: licensing
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: reuse lint
        # The OFFICIAL image, digest-pinned — the same construction the
        # actionlint job uses and for the same reasons: `reuse` is distributed
        # as a Python package, which this repository does not install, and the
        # published container is the one distribution that needs neither a
        # Python toolchain in CI nor an unpinned installer script.
        run: |
          docker run --rm \
            -v "$PWD:/data" --workdir /data \
            fsfe/reuse:6.2.0@sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e \
            lint
      # `reuse lint` proves the declarations are COMPLETE. It cannot know that
      # this project also publishes a human-readable licensing chapter, which is
      # what a procurement reviewer actually reads and what drifts.
      - name: Install yq
        env:
          YQ_VERSION: v4.53.3
          YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version
      - name: The declarations, the texts and the chapter agree
        run: bash scripts/checks/licensing-declarations.sh
      # The six Apache-2.0 crates publish so any project can take them; a
      # normal or build dependency on one of the three BUSL-1.1 crates would
      # make every consumer compile BUSL code. The self-test runs first, so a
      # detector that stopped matching fails here instead of passing vacuously.
      - name: The licence-boundary detector refuses every crossing
        run: bash scripts/checks/licence-boundary.sh --self-test
      - name: No Apache-2.0 crate depends on a BUSL-1.1 crate
        run: bash scripts/checks/licence-boundary.sh
      # `reuse lint` is satisfied by the glob declaration alone, so it cannot
      # see a first-party file losing the header that makes its licensing
      # travel. This is the check that can.
      - name: First-party Rust source carries its SPDX header
        run: bash scripts/checks/spdx-headers.sh
      # A vendored tree's PROVENANCE.md is the repository's record and does not
      # travel with the package built from it. This is the check that the
      # attribution INSIDE a published crate still names the revision the
      # repository vendors.
      - name: Packaged third-party bytes carry a pinned attribution
        run: bash scripts/checks/packaged-attribution.sh
      # `cargo package --list` needs the pinned toolchain; the two packaging
      # guards are the only cargo consumers in this job.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # A packaged src file embedding a path its own package does not carry
      # compiles in this repository and breaks inside the published .crate.
      - name: Packaged sources embed only packaged files
        run: bash scripts/checks/packaged-includes.sh

  # The compose hardening properties (cap_drop ALL, no-new-privileges, no
  # privileged, no seccomp=unconfined, loopback-only publishing). This gate
  # existed and ran nowhere, while `docker-compose.yml` and the operations
  # chapter both told readers it "enforces that on every compose artifact" — a
  # documented guard that does not fire is worse than none, because the docs and
  # the reviewer both believe it did.
  compose-hardening:
    name: compose-hardening
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose artifacts stay hardened
        run: bash scripts/checks/compose-hardening.sh
      - name: The overlay's inline dashboard matches the chart's canonical copy
        run: bash scripts/checks/dashboard-drift.sh
      # The shipped default sends a usage report; a test instance must not.
      - name: The launcher detector catches an unswitched launcher
        run: bash scripts/checks/usage-report-off.sh --self-test
      - name: Every test launcher switches the usage report off
        run: bash scripts/checks/usage-report-off.sh
      - name: The EUR-Lex watcher's detector reports a new act and fails on a silent source
        run: bash scripts/watch/eu-acts.sh --self-test
      - name: The watcher issue engine dedups by whole key and files the rest
        run: bash .github/actions/file-watcher-issue/file-issue.sh self-test

  # The shaped terminology seed has one canonical directory and one copy inside
  # the Helm chart (a chart's `.Files` reaches only what is packaged with it),
  # so the two are held byte-identical the way the dashboard's two copies are.
  terminology-seed-drift:
    name: terminology-seed-drift
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The chart's terminology seed matches the canonical one
        run: bash scripts/checks/terminology-seed-drift.sh

  # RFC 0201: an error carries its cause. No clippy lint covers this, so the
  # gate is a per-tree ratchet — the flattened-site counts may only fall while
  # the #2034 sweep runs.
  error-source-chain:
    name: error-source-chain
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Error cause chains have not regressed
        run: bash scripts/checks/error-source-chain.sh

  # Default-value style (.claude/rules/rust-style.md §Default values): a field's
  # default lives inline in its struct's `Default` impl — the RFC 3681 shape,
  # hand-written because that syntax is nightly-only.
  #
  # CHANGED-FILES mode until the pre-existing set is swept (#2033): the rule
  # arrived after the tree, so a `--all` gate would fail every PR for violations
  # it did not introduce. This blocks NEW ones from the moment it lands, and the
  # sweep issue flips the argument to `--all` (which additionally enables the
  # single-reader `const` check — that one counts readers tree-wide).
  default-style:
    name: default-style
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # `--all` since #2033 swept the pre-existing sites: the tree is clean, so
      # the guard covers the whole of it rather than only the changed files.
      - name: Default values live in the struct's Default impl
        run: bash scripts/checks/default-style.sh --all
      # Typed-status guard: an HTTP status is compared as a `StatusCode`, never
      # as a number. `--all` from the start — the tree has no violations.
      - name: HTTP statuses are compared as types
        run: bash scripts/checks/typed-status.sh --all
      # Access-layer provenance (#1963): every rationale in the authn/authz layer
      # cites an RFC, a standards publication, or the vendored openEHR text —
      # never another product, a plan-phase marker, or internal markdown.
      - name: Access-layer rationale cites durable sources
        run: bash scripts/checks/access-provenance.sh

  # E2E wait guard (#3296): a browser journey holds the bounded
  # `common::Element`, never a raw `WebElement`/`SelectElement`, and waits on a
  # condition rather than on a timer. The guard's scope is fixed (every journey
  # file, always) — the migration that landed it swept all 26, so the tree is
  # clean. The detector is mutation-proven by its own `--self-test`, which runs
  # first, so a pattern that silently matched nothing would fail the job rather
  # than report OK.
  e2e-waits:
    name: e2e-waits
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The detector catches what it claims to catch
        run: bash scripts/checks/e2e-waits.sh --self-test
      - name: E2E journeys wait on conditions through the bounded harness
        run: bash scripts/checks/e2e-waits.sh

  # Docs-claim guard (#1984): a documented KEY must exist in the thing it
  # documents. `mdbook-lint` checks style and `lychee` checks links; both pass on
  # a page whose every technical claim is false, which is how a fabricated Helm
  # values table reached the published site. `--all` from the start: the three
  # defects this found on its first run are fixed in the same change, so the
  # corpus is clean. What it deliberately does NOT check is recorded in the
  # script's header and in `.claude/rules/docs-website.md`.
  docs-claims:
    name: docs-claims
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Documented keys resolve in their source
        run: bash scripts/checks/docs-claims.sh --all
      # Image metadata (#2146): the OCI keys are declared in two places — the
      # Dockerfile, so a direct build is labelled correctly, and the publishing
      # workflow, whose repo-derived defaults are wrong for a repo shipping three
      # images. Two declarations of one fact drift; this fails instead. It also
      # holds base.name/base.digest to the runtime stage's actual FROM pin, and
      # checks that annotations reach the INDEX (the only place GHCR reads a
      # package description from).
      - name: Image metadata is declared once and agrees
        run: bash scripts/checks/image-labels.sh

  # The published compliance control matrix is GENERATED from the tracker
  # (scripts/render/control-matrix.sh), the same way the conformance pages
  # regenerate from the committed artifacts: a control's status lives on its
  # issue, never in the page. This job re-renders and diffs, so a control that
  # shipped since the last render fails the build instead of sitting on the
  # public site as "planned".
  #
  # The page reads nothing but the tracker: open controls render as Planned
  # and the roadmap board is linked for the live column, so the repository
  # token is enough to render and to check it (#3236). A board read would need
  # a Projects (v2) scope, which only a standing personal access token carries.
  control-matrix:
    name: control-matrix
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The published control matrix matches the tracker
        env:
          GH_TOKEN: ${{ github.token }}
          # The pull request under check: the issues it closes render as
          # Shipped with it, so the PR that closes a control commits the page
          # main will carry after the merge (#3253). Empty in a merge group.
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            bash scripts/render/control-matrix.sh --check --closing "$PR_NUMBER"
          else
            bash scripts/render/control-matrix.sh --check
          fi

  # The prose AROUND the generated pages can go stale where the pages cannot:
  # after the v4.2.0 cut the compliance overview still said "guidance planned,
  # #3161" about pages that release had published (#3289). This job reads every
  # issue reference on the book's pages and in the EHDS status source, fetches
  # the states in one call, and fails when a status word beside a reference
  # contradicts the tracker. Same token footprint as control-matrix.
  tracker-status:
    name: tracker-status
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No book page says planned about a closed issue, or shipped about an open one
        env:
          GH_TOKEN: ${{ github.token }}
          # The issues this PR closes count as closed; context reaches the shell
          # through env, never `${{ }}`-inline (the template-injection rule).
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/checks/tracker-status.sh

  # The two EHDS pages are GENERATED from website/book/ehds.yaml
  # (scripts/render/ehds-pages.sh), for the reason the control matrix is: a
  # readiness table typed by hand is wrong the first time a requirement's
  # status changes, and a stale "shipped" beside a requirement nothing
  # implements is a false compliance claim on a public site. This job
  # re-renders and diffs. It needs no token: the source is a committed file,
  # not the tracker.
  ehds-pages:
    name: ehds-pages
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The published EHDS pages match their source
        run: bash scripts/render/ehds-pages.sh --check

  # String-built-SQL guard: the AQL engine composes SQL from attacker-supplied
  # query text, so a `format!`/`push_str`-assembled clause in `app/ferroehr/src/
  # aql/` or `app/ferroehr/src/storage/` is refused — the OWASP SQL Injection
  # Prevention Cheat Sheet's "validated data is not necessarily safe to insert
  # into SQL queries via string building". `--all` from the start: the tree is
  # clean, and the one legitimate site is a named exemption in the script.
  sql-string-building:
    name: sql-string-building
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The exemption list honours a needle with spaces
        run: bash scripts/checks/sql-string-building.sh --self-test
      - name: No string-built SQL in the query engine
        run: bash scripts/checks/sql-string-building.sh --all

  error-hygiene:
    name: error-hygiene
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: No internal detail in a 5xx body or a health detail
        run: bash scripts/checks/error-hygiene.sh

  # ── Always required: supply-chain policy ────────────────────────────────────
  # cargo-deny alone: `cargo deny check` reads the SAME RustSec advisory DB as
  # cargo-audit and additionally enforces yanked = "deny" (deny.toml
  # [advisories]), licenses, bans, and sources — a separate cargo-audit job
  # would be a strict subset run twice (embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html).
  # Cargo.lock IS committed (workspace ships a binary); deny checks the real pins.
  deny:
    name: cargo-deny
    needs: changes
    # `vex` because this job is where the two VEX gates run (#2370);
    # `workflows` because its recipe — those two extra steps — is authored
    # here (#2373).
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.vex == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny
      - run: cargo deny check
      # The mirror of the check above: an `ignore` entry that outlived its
      # finding. cargo-deny reports it as a WARNING, so the step above stays
      # green on one; this promotes it to an error. It runs HERE because
      # cargo-deny and the toolchain are already installed in this job.
      - name: No exception for an advisory that no longer fires
        run: bash scripts/checks/advisory-exceptions.sh
      # The third failure mode, which neither of the two above can see: an
      # exception whose PUBLISHED ARGUMENT names the wrong dependency path (the
      # `rsa` statement claimed the crate was reached only through
      # openidconnect, with `pgp` in the graph all along). Also here because the
      # graph is only resolvable where cargo is installed — and it needs no TOML
      # reader, reading the generated document the `vex` job pins to the prose.
      - name: Every VEX statement names the real dependency path
        run: bash scripts/checks/vex-reachability.sh

  # The published VEX document must be exactly what `deny.toml` plus the prose
  # file generate. Every advisory the gate ACCEPTS carries a machine-readable
  # justification a downstream scanner can ingest — otherwise the argument
  # exists only in a TOML comment nobody downstream reads, and a hospital's
  # scanner sees unexplained findings on a clinical artifact.
  #
  # Ungated on `changes.code`: `deny.toml` is in the code allowlist, but the
  # prose file and the generator are not, and a prose-only edit must still be
  # checked.
  vex:
    name: vex
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `deny.toml` and the prose file are TOML, which jq cannot read. Pinned by
      # version and verified by checksum, like the chart lane's copy: this
      # binary decides whether the gate passes.
      - name: Install yq
        env:
          YQ_VERSION: v4.53.3
          YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version
      - name: Every accepted advisory has a published VEX justification
        run: bash scripts/checks/vex-advisories.sh
      # The release pipeline's exploitability-record gate, proven on synthetic
      # input here so a broken detector is caught before a release depends on it.
      - name: The exploitability-record detector refuses what it claims to
        run: bash scripts/checks/vex-coverage.sh --self-test

  clippy:
    name: clippy
    needs: changes
    # The three lanes below (workspace-minus-viewer, viewer ssr, viewer
    # wasm hydrate) are this file's own recipe, so a change to it runs them
    # (#2373).
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-cache (not sccache) is load-bearing here: sccache cannot cache
      # clippy-driver invocations (mozilla/sccache#539), so the restored
      # target dir is the only compile cache clippy gets.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # The viewer's `hydrate`/`ssr` features are mutually exclusive (a
      # compile_error! guard per the Cargo book §Mutually exclusive features),
      # so the workspace lane excludes it and the crate gets its own two
      # per-feature lanes — the same split as /ui-gates. `--locked` everywhere:
      # CI must fail on new commits only, never on registry drift
      # (https://doc.rust-lang.org/cargo/faq.html#why-have-cargolock-in-version-control).
      - run: cargo clippy --locked --workspace --exclude ferroehr-viewer --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked -p ferroehr-viewer --all-targets --features ssr -- -D warnings
      - run: cargo clippy --locked -p ferroehr-viewer --target wasm32-unknown-unknown --features hydrate -- -D warnings

  # ── The slim server: the optional-integration features, subtracted ──────────
  # The clippy job above compiles the workspace with --all-features, so nothing
  # in CI ever built the server WITHOUT the optional integrations: every
  # `require_disabled` refusal path, every `#[cfg(not(feature = …))]` block and
  # the additive feature wiring of #1890 were compiled by no lane at all. That
  # is how a wrong feature gate stayed latent until #2358, where
  # `--features events` without `fhir` did not compile.
  #
  # Three feature sets, each a real deployment shape: the slim CDR, and the
  # `events` and the `fhir` integration each enabled on top of it. Neither
  # implies the other, so each lane proves the gates are not silently coupled.
  # clippy, not check: the deny-tier lints must cover the gated code too. No
  # tests — the feature graphs are compile properties, and the test job owns
  # behaviour.
  feature-combos:
    name: clippy (slim server feature combos)
    needs: changes
    # The three feature sets ARE the test, and they are declared here (#2373).
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-cache, for the reason the clippy job states: sccache cannot cache
      # clippy-driver invocations (mozilla/sccache#539). This job's cache entry
      # is its own (rust-cache keys on the job), which is what it must be — the
      # target dir here holds a different feature graph than the clippy job's.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked -p ferroehr-server --no-default-features --all-targets -- -D warnings
      - run: cargo clippy --locked -p ferroehr-server --no-default-features --features events --all-targets -- -D warnings
      - run: cargo clippy --locked -p ferroehr-server --no-default-features --features fhir --all-targets -- -D warnings

  # ── openehr-its + openehr-sdt on wasm32: the browser-consumer selection ────
  # `openehr-its` publishes a feature graph whose openEHR content layers
  # (`json` → `xml` → `opt14`) are meant to compile for a browser client, while
  # `schema-validation` (jsonschema) and the three ITS-REST features (`rest`,
  # `rest-server` with axum, `rest-client` with reqwest) are not part of that
  # selection (the lane after this one clippies them natively); `openehr-sdt`
  # adds the Simplified Formats (`flat`) on top and keeps the dependency-free
  # `smart_scopes` island under `default-features = false`.
  # Nothing else in CI compiles those selections: the clippy job runs
  # --all-features, and the viewer's wasm lane takes the crates with
  # default-features = false, which reaches only the scope-grammar island. So
  # the property was claimed by the manifests and checked by no lane at all.
  #
  # Library target only, no --all-targets: the crates' dev-dependencies
  # (testkit -> sqlx, tokio -> mio) are native by construction and cannot build
  # for wasm32-unknown-unknown. The features are spelled out rather than left to
  # the implication chains, so a change to a chain cannot silently narrow what
  # this lane covers.
  its-wasm:
    name: clippy (openehr-its + openehr-sdt on wasm32)
    needs: changes
    # The feature selection IS the test, and it is declared here (#2373).
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-cache, for the reason the clippy job states: sccache cannot cache
      # clippy-driver invocations (mozilla/sccache#539). Its own cache entry:
      # this target dir holds a wasm32 build of a different feature graph.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked -p openehr-its --target wasm32-unknown-unknown --no-default-features --features opt14,xml,json -- -D warnings
      - run: cargo clippy --locked -p openehr-sdt --target wasm32-unknown-unknown --no-default-features --features flat -- -D warnings
      # The island the manifest promises a scope-parsing client: no feature, no
      # dependency, and it must still compile for the browser on its own.
      - run: cargo clippy --locked -p openehr-sdt --target wasm32-unknown-unknown --no-default-features -- -D warnings

  # ── openehr-its: the three ITS-REST features, each on its own ──────────────
  # `rest` is the contract both halves share (DTOs, param structs, route tables,
  # `ApiError`) over serde and `http`; `rest-server` adds the server traits and
  # `axum`; `rest-client` adds the generated clients and `reqwest`. The clippy
  # job compiles them only together (--all-features), where a gate missing from
  # one half is masked by the other, and the wasm lane compiles none of them. So
  # each feature is clippied alone, and the dependency split the manifest
  # promises is read back from `cargo tree`: a contract-only consumer builds
  # neither HTTP engine, and a client builds no server framework.
  #
  # Library target only, no --all-targets: the crate's dev-dependencies pull
  # every feature in through the test suite and would hide the property.
  its-rest-features:
    name: clippy (openehr-its REST features)
    needs: changes
    # The feature selections ARE the test, and they are declared here (#2373).
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-cache, for the reason the clippy job states: sccache cannot cache
      # clippy-driver invocations (mozilla/sccache#539). Its own cache entry:
      # this target dir holds three single-feature builds of one crate.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked -p openehr-its --no-default-features --features rest -- -D warnings
      - run: cargo clippy --locked -p openehr-its --no-default-features --features rest-client -- -D warnings
      - run: cargo clippy --locked -p openehr-its --no-default-features --features rest-server -- -D warnings
      - name: The contract pulls no HTTP engine, the client no server framework
        shell: bash
        # A tree line names a package as `<name> v<version>`, so the leading
        # space and the trailing ` v` keep `axum-core` and the like from
        # matching a banned name.
        env:
          CONTRACT_BANNED: axum|reqwest
          CLIENT_BANNED: axum
        run: |
          set -euo pipefail
          refuse() {
            local feature="$1" banned="$2" tree found
            tree="$(cargo tree --locked -p openehr-its --no-default-features --features "$feature" -e normal)"
            if found="$(grep -E "[[:space:]]($banned) v[0-9]" <<<"$tree")"; then
              echo "::error::openehr-its --features $feature depends on a package it must not pull:"
              printf '%s\n' "$found"
              return 1
            fi
            echo "OK: --features $feature pulls none of: $banned"
          }
          refuse rest "$CONTRACT_BANNED"
          refuse rest-client "$CLIENT_BANNED"

  # ── Rustdoc: intra-doc links + doc lints are inert unless rustdoc runs ──────
  # [workspace.lints.rustdoc] levels apply to every `cargo doc`; the -D
  # warnings env additionally promotes the warn-tier doc lints in CI
  # (https://doc.rust-lang.org/rustdoc/lints.html).
  doc:
    name: rustdoc
    needs: changes
    # Path-filtered on PRs (a PR touching no Rust cannot introduce a doc
    # defect), but ALWAYS run on a main push: the filter is a per-push
    # DELTA, so a code commit whose run was cancelled or whose successor push
    # is docs-only would otherwise never have its docs evaluated at all. This
    # job is ~1/10 the length of the test job, so re-evaluating the whole tree
    # on every main push is cheap insurance.
    if: needs.changes.outputs.code == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # --document-private-items: stale intra-doc links can hide behind
      # non-pub items the public build never evaluates (#1838; measured
      # cost ~10s incremental over the public-only run).
      - run: cargo doc --locked --workspace --exclude ferroehr-viewer --all-features --no-deps --document-private-items
      - run: cargo doc --locked -p ferroehr-viewer --features ssr --no-deps
      # Doc tests live HERE, not in the pg18 test job: nextest cannot run
      # doctests, so `cargo test --doc` is its own compile (default features —
      # doctests document what a default consumer gets), and this job is ~1/10
      # the length of the test job, so the extra configuration rides the short
      # lane instead of the critical path. No DB: doctests are examples, never
      # integration tests.
      - run: cargo test --locked --workspace --doc

  # ── MSRV verification: the declared rust-version must actually build ────────
  # The Cargo book names cargo-hack as the verification tool — a pinned stable
  # toolchain plus clippy::incompatible_msrv is not verification
  # (https://doc.rust-lang.org/cargo/guide/continuous-integration.html#verifying-rust-version).
  msrv:
    name: msrv (cargo-hack)
    needs: changes
    if: needs.changes.outputs.msrv == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-hack
      - run: cargo hack check --rust-version --workspace --locked --all-targets

  # ── Generated code must stay in sync with the vendored specs ──
  codegen-drift:
    name: codegen drift
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Regenerate and diff
        run: bash scripts/checks/codegen-drift.sh

  # ── Build + tests against PostgreSQL 18.6 ──────────────────────────────────
  # The catalogue's own artifact validation is no longer here: the instrument is
  # the separate Veredictum project (pinned in scripts/lib/veredictum.sh), and
  # its catalogue is validated by its own CI. The e2e CNF run stays where it
  # was: the Docker compose stack (scripts/conformance.sh) at phase gates.
  # The critical-path job, split three ways because the single job it replaced
  # ran 21.75 minutes and was the pipeline's whole wall clock (#3120). Measured
  # there: 276 s linking every bin, 197 s + 164 s compiling the viewer under
  # `ssr` to run 2.3 s of viewer tests, 186 s compiling the workspace's test
  # targets and 427 s running 4614 of them. Splitting lets the four costs run
  # beside each other instead of end to end; sharding the 427 s divides the one
  # cost that no cache can remove.
  test:
    name: build & test (pg18) ${{ matrix.shard }}/${{ needs.changes.outputs.test_shard_count }}
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        # Three shards, hash-partitioned by nextest so a slow suite cannot land
        # them all in one shard (https://nexte.st/docs/ci-features/partitioning/).
        # Each shard gets its own PostgreSQL service, which is what makes the
        # split safe: the testkit harness clones a template database per test,
        # so two shards never share one.
        shard: ${{ fromJSON(needs.changes.outputs.test_shards) }}
    # The service container, its pinned image and the env the suite runs
    # against are all this file's recipe (#2373).
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: openehr
          POSTGRES_PASSWORD: openehr
          POSTGRES_DB: openehr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openehr"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openehr:openehr@localhost:5432/openehr_test
      # The shared test-database harness (tools/testkit) uses this server
      # directly — no per-test containers in CI at all.
      FERROEHR_TEST_PG_URL: postgres://openehr:openehr@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Non-durable test tuning
        # libxml2-utils provides xmllint — the C14N XML parity gate shells out
        # to it (serialization.md); the runner image does not ship it.
        # The ALTER SYSTEM block applies the non-durable settings the
        # PostgreSQL docs recommend for throwaway data (all three are
        # reloadable — no restart); this server only ever holds test databases.
        # No extension is installed here: the schema needs btree_gist alone and
        # the server installs it itself, into each template database testkit
        # builds.
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client libxml2-utils
          PGPASSWORD=openehr psql -h localhost -U openehr -d postgres \
            -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest
      # The viewer is excluded from --all-features lanes (mutually exclusive
      # hydrate/ssr, compile_error!-guarded) and has its own job below.
      # --no-tests=pass: empty crates are expected until P17 (nextest exits 4 otherwise)
      # The shard index reaches the command through `env:`, never interpolated
      # into the script (the workflow-security rule in reliability.md).
      - run: cargo nextest run --locked --workspace --exclude ferroehr-viewer --all-features --no-tests=pass --profile ci --partition "hash:${SHARD}/${SHARD_COUNT}"
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.changes.outputs.test_shard_count }}
      # Doc tests moved to the rustdoc job: `cargo test --doc` is a third
      # feature configuration (default features) and compiled the whole
      # workspace again at the tail of THE critical-path job.

  # ── Every workspace BIN actually links here ────────────────────────────────
  # `cargo clippy` type-checks but never links, and `nextest` compiles test
  # targets only, so without this step a broken bin reaches main. It was the
  # first 276 s of the old test job and needs no database, so it runs beside
  # the shards instead of in front of them.
  build:
    name: build (link every bin)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --workspace --exclude ferroehr-viewer --all-features

  # ── The viewer's own build + unit tests ────────────────────────────────────
  # The viewer compiles under `ssr`, a different feature configuration from the
  # rest of the workspace, so it shares no build cache with them. In the old
  # test job that cost 361 s of the critical path to run 551 tests in 2.3 s.
  # It needs no database.
  test-viewer:
    name: build & test (viewer, ssr)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest
      - run: cargo build --locked -p ferroehr-viewer --features ssr
      - run: cargo nextest run --locked -p ferroehr-viewer --features ssr --no-tests=pass --profile ci

  # ── The Helm chart's lint + golden renders (issue #2110) ────────────────────
  # deploy/helm/validate.sh is the only check in the repository that pins the
  # chart's security posture — runAsNonRoot, readOnlyRootFilesystem,
  # allowPrivilegeEscalation:false, seccomp RuntimeDefault, drop ALL,
  # enableServiceLinks:false, the default-deny NetworkPolicy — and it ran in no
  # workflow at all, so the goldens went stale on main and nothing failed.
  #
  # helm is INSTALLED, never taken from the runner image: `helm template` output
  # is not byte-stable across helm releases (4.2.3 emits blank lines 4.1.3 does
  # not), so a drifting preinstalled helm would fail the golden compare with a
  # whitespace diff. The version comes from deploy/helm/.tool-versions, the same
  # file validate.sh checks itself against.
  helm-golden:
    name: helm-golden
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned helm, read from deploy/helm/.tool-versions and installed by the
      # composite (#2775) — which is also where the `version` vs `version-file`
      # trap that silently installed the latest helm is recorded.
      - uses: ./.github/actions/helm-pinned
      - name: helm lint (default + all-features value sets)
        run: |
          helm lint deploy/helm/ferroehr -f deploy/helm/ci/default-values.yaml
          helm lint deploy/helm/ferroehr -f deploy/helm/ci/all-features-values.yaml
      # The chart gates read the rendered YAML structurally (yq -o=json | jq),
      # because a grep over a manifest passes as soon as ONE container carries a
      # field. Pinned by version and verified by checksum: this step runs before
      # the security gates, so a substituted binary would decide whether they
      # pass.
      - name: Install yq
        env:
          YQ_VERSION: v4.53.3
          YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version
      # The README drift check needs helm-docs, and validate.sh's self-skip when
      # it is absent is how the v4.0.5 README shipped a release stale through a
      # green lane (#2806) — so the tool is installed here (pinned in
      # deploy/helm/.tool-versions beside helm, checksum-verified like yq) and
      # validate.sh now FAILS in CI instead of skipping when it is missing.
      - name: Install the pinned helm-docs
        env:
          VERSION_FILE: deploy/helm/.tool-versions
          HELM_DOCS_SHA256: a8cf72ada34fad93285ba2a452b38bdc5bd52cc9a571236244ec31022928d6cc
        run: |
          set -euo pipefail
          version="$(awk '$1 == "helm-docs" { print $2 }' "$VERSION_FILE")"
          [ -n "$version" ] || { echo "::error::no helm-docs line in $VERSION_FILE"; exit 1; }
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o /tmp/helm-docs.tar.gz \
            "https://github.com/norwoodj/helm-docs/releases/download/v${version}/helm-docs_${version}_Linux_x86_64.tar.gz"
          echo "${HELM_DOCS_SHA256}  /tmp/helm-docs.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm-docs.tar.gz -C /tmp helm-docs
          sudo install -m 0755 /tmp/helm-docs /usr/local/bin/helm-docs
          helm-docs --version
      # No --update: the goldens in the tree must already match this render.
      - name: Chart validation + golden renders
        run: bash deploy/helm/validate.sh

  # ── Every committed values overlay must BOOT, not merely render (#2159) ─────
  # helm-golden above proves the manifests are well-formed, hardened and
  # unchanged. It proved exactly that while all three overlays carried
  # configurations the server refuses to start on: `auth.enabled` with no
  # mechanism, a placeholder that is not an Argon2id PHC string, a 15-byte HMAC
  # secret under a 32-byte floor, SMART enabled with no public base URL. Four
  # boot failures, four green renders. Nothing but the server can tell the
  # difference, so this job runs it.
  #
  # It runs on every PR that can break the pair (see the `chart_boot` filter),
  # NOT only on a tag — the tag lane's identical check is the last line of
  # defence, and by then the release cut is already failing.
  #
  # The image is packaged from THIS TREE's server binary rather than pulled from
  # GHCR, which is the difference between a gate and a trap: `appVersion` and the
  # chart's config defaults advance on different clocks, so judging a PR against
  # a published image would fail every PR that adds a configuration key, from the
  # commit that adds it until the next release. The binary comes from the
  # ui-e2e-binary job, whose exact-key cache makes a chart-only PR pay nothing
  # for it, and packaging is the COPY-only `runtime-prebuilt` target — seconds.
  chart-boot:
    name: chart-boot
    needs: [changes, ui-e2e-binary]
    if: needs.changes.outputs.chart_boot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same pin as the goldens, from the same file and the same composite.
      - uses: ./.github/actions/helm-pinned
      # The artifact download loses the executable bit; the Dockerfile COPYs the
      # binary with `--chmod=0755`, which is why that does not matter here.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-e2e-server-binary
          path: bin/amd64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Package the app image (COPY-only, seconds)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr:chart-boot
      - name: Boot every committed values overlay
        env:
          FERROEHR_IMAGE: ferroehr:chart-boot
        run: bash deploy/helm/ci/boot-check.sh

  # ── The deployment harness, on a real composed stack (#2178) ─────────────────
  # The instrument that found ten defects a green 4447-test suite did not: every
  # one lived between "the code is correct" and "the thing an operator runs
  # works". It is worth nothing if it only runs when someone remembers.
  #
  # It reuses the binary the ui-e2e lane already builds, packaged COPY-only in
  # seconds — building the image again here would double a long lane to prove
  # the same bytes.
  #
  # Families needing a dependency the harness composes itself (Keycloak, the
  # broker, the collector) run here; terminology does NOT — it needs a licensed
  # SNOMED release that may not be fetched onto a shared runner, and its own
  # opt-in local lane covers it.
  deploy-probe:
    name: deploy-probe
    needs: [changes, ui-e2e-binary]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-e2e-server-binary
          path: bin/amd64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Package the app image (COPY-only, seconds)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr:deploy-probe
      # The database image THIS TREE defines, packaged like the app image —
      # the compose fallback names the RELEASE tag, which a release PR flips
      # before that tag's images exist (found on the v3.17.8 cut: every
      # posture's stack sat on a manifest-unknown postgres pull until the
      # probe timed out). Native amd64 build; the Dockerfile's security
      # upgrade runs in minutes.
      - name: Package the postgres image (base + security updates)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/postgres
          file: docker/postgres/Dockerfile
          load: true
          tags: ferroehr-postgres:deploy-probe
      - name: Probe the deployment
        env:
          FERROEHR_IMAGE: ferroehr:deploy-probe
          FERROEHR_POSTGRES_IMAGE: ferroehr-postgres:deploy-probe
        run: bash scripts/deploy-probe.sh
      # The RECORD, always — a failed run is exactly when the per-probe layer
      # attribution and the not-exercised ledger are worth reading.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: deploy-probe-record
          path: docs/conformance/deployment/compose.json
          if-no-files-found: warn

  # ── Unused dependencies ──────────────────────────────────────────────────────
  unused-deps:
    name: cargo-machete
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-machete
      - run: cargo machete

  # ── The CDR binary the ui-e2e battery runs against (issue #335) ─────────────
  # It used to be compiled INSIDE the image: `docker/Dockerfile --target
  # runtime-from-source` runs `cargo build --release` in the layer after
  # `COPY . .`. No layer cache can serve that layer — every ui-e2e trigger path
  # lives in the build context, so the COPY is invalidated by construction, and
  # the then-used cargo-chef cook layer cached THIRD-PARTY dependencies only
  # (since replaced by a persistent target cache mount, #2530 — which a fresh
  # CI runner never has warm anyway). The ~190 kLoC
  # first-party release build therefore ran cold on EVERY run (measured locally
  # on an isolated buildx builder: 714 s cold; 6 s with nothing changed; 407 s
  # after touching ONE viewer source file, with the cook layer reported
  # CACHED and the whole first-party graph recompiling behind it).
  #
  # So the binary is compiled here the way containers.yml compiles the
  # PUBLISHED one — natively, in the pinned rust:*-slim-trixie image, never
  # inside a Dockerfile — except under the `e2e` profile, which is the release
  # profile without LTO (#3490) — and ui-e2e then PACKAGES it with `runtime-prebuilt`,
  # the very final target containers.yml ships. Both final targets inherit ONE
  # shared runtime-base stage, so the battery drives the same distroless base,
  # the same non-root user, EXPOSE, HEALTHCHECK and ENTRYPOINT as before.
  #
  # Two caches, strongest first:
  #   1. the finished binary, keyed on the exact content of every input the
  #      server build reads. A viewer-only PR touches none of them, so
  #      the key hits and no compile runs at all.
  #   2. sccache (per compilation unit) for the miss case — a lockfile bump or
  #      a server-side change then recompiles only what actually changed
  #      instead of collapsing back to a cold build.
  #
  # SOURCE_DATE_EPOCH is pinned and REVISION is deliberately NOT passed in this
  # lane: app/ferroehr/build.rs bakes both into the `ferroehr` crate through
  # `cargo:rustc-env`, and sccache tracks `env!` values in its cache key
  # ("Values from `env!` require Rust >= 1.46 to be tracked in caching" —
  # github.com/mozilla/sccache docs/Rust.md), so a per-run value makes the three
  # largest first-party crates uncacheable by construction. Without REVISION,
  # build.rs degrades to SHA=unknown BY DESIGN, and the battery asserts
  # behaviour, never provenance. The PUBLISHED images are untouched:
  # containers.yml still stamps github.sha into them.
  #
  # Two consumers now (#2159): the ui-e2e battery below, and the `chart-boot`
  # job, which boots the chart's values overlays against an image packaged from
  # this same binary. Hence the widened condition — the job id and name are
  # unchanged on purpose, because they are branch-protection check names.
  ui-e2e-binary:
    name: ui-e2e server binary
    needs: changes
    if: needs.changes.outputs.viewer == 'true' || needs.changes.outputs.chart_boot == 'true'
    runs-on: ubuntu-latest
    # Generous: a binary-cache miss with a cold sccache is a full release
    # build of the ~190 kLoC first-party graph (714 s measured cold, plus
    # dependency compiles on a lockfile bump).
    timeout-minutes: 60
    permissions:
      contents: read
    # Debian 13 (trixie) container so the binary targets glibc 2.41, matching
    # gcr.io/distroless/cc-debian13 exactly — the same pin and the same reason
    # as containers.yml's `binary` job. It must NOT be compiled on the bare
    # runner: glibc compatibility runs forward only, so a runner image with a
    # newer glibc than the runtime image ships yields a binary that image
    # cannot load.
    container: rust:1.98.1-slim-trixie@sha256:ce84a5edd80c5f91e05c5533b1e53eb1da54028f33734dc06aa6b49fa190462d
    env:
      # Fixed build timestamp — reproducible, and the precondition for the
      # compile to be cacheable at all (see the block above; build.rs honours
      # SOURCE_DATE_EPOCH per reproducible-builds.org/docs/source-date-epoch).
      SOURCE_DATE_EPOCH: "1700000000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify toolchain pins (container == rust-toolchain.toml == Dockerfile)
        shell: bash
        run: |
          set -euo pipefail
          channel=$(grep -E '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')
          have=$(rustc --version | awk '{print $2}')
          arg=$(grep -E '^ARG RUST_VERSION=' docker/Dockerfile | head -1 | cut -d= -f2)
          echo "rust-toolchain=$channel  container-rustc=$have  Dockerfile ARG=$arg"
          if [ "$channel" != "$have" ]; then
            echo "::error::Job container rustc ($have) != rust-toolchain.toml ($channel). Bump the container: tag."
            exit 1
          fi
          if [ "$channel" != "$arg" ]; then
            echo "::error::docker/Dockerfile RUST_VERSION ($arg) != rust-toolchain.toml ($channel)."
            exit 1
          fi
      # Cache 1 — the binary itself. The key covers every path the server build
      # reads and nothing else; app/ferroehr-viewer/ is deliberately absent
      # because the viewer is not in ferroehr-server's dependency graph (that is
      # ferroehr + ferroehr-rest), which is exactly why a viewer PR can
      # reuse the binary. Exact key, NO restore-keys: a near-match would package
      # a binary that does not correspond to this tree
      # (docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching).
      - id: binary-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/amd64/ferroehr
          key: ui-e2e-server-bin-1.98.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'crates/**', 'app/ferroehr/**', 'app/ferroehr-rest/**', 'app/ferroehr-server/**', 'tools/**') }}
      # Registry cache only, for the reason the ui-e2e job spells out below:
      # rust-cache's key hashes every manifest, so a lockfile bump rotates a
      # whole target archive and pays a cold build, while sccache degrades to
      # partial hits (github.com/Swatinem/rust-cache — with `cache-targets:
      # false`, "only the cargo registry will be cached").
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.binary-cache.outputs.cache-hit != 'true'
        with:
          shared-key: ui-e2e-server-binary
          cache-targets: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.binary-cache.outputs.cache-hit != 'true'
      - name: Build the server binary (e2e profile, native)
        if: steps.binary-cache.outputs.cache-hit != 'true'
        env:
          SCCACHE_GHA_ENABLED: "true"
          # Only main writes (the cache policy above, #3490): a pull-request
          # entry is readable by that pull request alone, and its writes evicted
          # main's from the full 10 GB quota (github.com/mozilla/sccache,
          # docs/Configuration.md, SCCACHE_GHA_RW_MODE).
          SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
          RUSTC_WRAPPER: sccache
          # "Incrementally compiled crates cannot be cached"
          # (github.com/mozilla/sccache#known-caveats).
          CARGO_INCREMENTAL: "0"
        shell: bash
        run: |
          set -euo pipefail
          cargo build --profile e2e --locked -p ferroehr-server
          strip target/e2e/ferroehr
          mkdir -p bin/amd64
          install -m0755 target/e2e/ferroehr bin/amd64/ferroehr
      # Cache-hit visibility in the job log, the same as the battery job below.
      - name: sccache statistics
        if: always() && steps.binary-cache.outputs.cache-hit != 'true'
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: ${SCCACHE_PATH} --show-stats
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-e2e-server-binary
          path: bin/amd64/ferroehr
          if-no-files-found: error
          retention-days: 1

  # ── Viewer + e2e test binaries, prebuilt in parallel (issue #335) ──────────
  # The second half of the compile-nothing-in-the-battery split: the host
  # cargo-leptos build and the nextest test-binary compile were 8m32s of the
  # measured battery step, all of it parallelizable with ui-e2e-binary. This
  # job builds both and ships them as one artifact; the battery job then only
  # composes, seeds, and drives the browser.
  #
  # Runs on the BARE runner (not a container) deliberately: the viewer binary
  # executes on the battery job's host, and the e2e binaries bake
  # env!("CARGO_MANIFEST_DIR") paths at compile time — both jobs being
  # ubuntu-latest gives them the same glibc AND the same workspace path
  # (/home/runner/work/<repo>/<repo>), so the baked paths resolve. Keep this
  # job and ui-e2e on the same runner image always.
  ui-e2e-viewer:
    name: ui-e2e viewer + test binaries
    needs: changes
    if: needs.changes.outputs.viewer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Cache 1 — the built outputs themselves, exact key, no restore-keys
      # (the ui-e2e-binary pattern above): the key covers everything the
      # viewer + its e2e binaries read. app/ferroehr, app/ferroehr-rest,
      # app/ferroehr-server are deliberately absent — the viewer consumes the
      # CDR strictly over ITS-REST and never links those crates, so a
      # server-only PR reuses the viewer artifact.
      # NOTE: `ui-e2e-console-*` here is a cache/artifact IDENTITY string, not
      # prose — renaming it would strand every stored entry, so it stays.
      - id: viewer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ui-e2e-console-stage
          key: ui-e2e-console-1.98.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'crates/**', 'app/ferroehr-viewer/**', 'scripts/cargo-leptos.sh') }}
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        if: steps.viewer-cache.outputs.cache-hit != 'true'
        with:
          target: wasm32-unknown-unknown
          # Registry-only cache; sccache owns compilation caching (the same
          # split, for the same lockfile-rotation reason, as the jobs above).
          cache-targets: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.viewer-cache.outputs.cache-hit != 'true'
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        if: steps.viewer-cache.outputs.cache-hit != 'true'
        with:
          # wasm-bindgen pinned to the workspace's wasm-bindgen version;
          # cargo-leptos resolves its external tools from PATH before its
          # own downloader (which failed opaque on a runner), so both it
          # and Tailwind are preinstalled deterministically.
          tool: cargo-nextest,cargo-leptos@0.3.7,wasm-bindgen@0.2.128
      - name: Install the Tailwind v4 standalone binary
        if: steps.viewer-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o /usr/local/bin/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          chmod +x /usr/local/bin/tailwindcss
          tailwindcss --help | head -1
      - name: Build the viewer + archive the e2e test binaries
        if: steps.viewer-cache.outputs.cache-hit != 'true'
        env:
          SCCACHE_GHA_ENABLED: "true"
          # Only main writes (the cache policy above, #3490): a pull-request
          # entry is readable by that pull request alone, and its writes evicted
          # main's from the full 10 GB quota (github.com/mozilla/sccache,
          # docs/Configuration.md, SCCACHE_GHA_RW_MODE).
          SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
          RUSTC_WRAPPER: sccache
          # "Incrementally compiled crates cannot be cached"
          # (github.com/mozilla/sccache#known-caveats).
          CARGO_INCREMENTAL: "0"
          LEPTOS_TAILWIND_VERSION: v4.3.3
        run: |
          set -euo pipefail
          # ORDER IS LOAD-BEARING: the nextest archive step compiles the
          # crate (tests + bin) under plain cargo, WITHOUT the LEPTOS_*
          # compile-time env cargo-leptos sets — and leptos picks the served
          # wasm FILENAME at compile time (leptos 0.8 hydration/mod.rs:
          # `option_env!("LEPTOS_OUTPUT_NAME")` absent ⇒ it appends `_bg` to
          # the preload path). An archive-after-leptos order clobbers the
          # viewer binary with a `_bg.wasm`-referencing build while the site
          # tree holds `<name>.wasm`, and every page 404s its wasm. Archive
          # FIRST, cargo-leptos LAST, stage immediately.
          cargo nextest archive -p ferroehr-viewer --features ssr \
            --archive-file ui-e2e-tests.tar.zst
          bash scripts/cargo-leptos.sh build
          # One staging tree = one artifact = one cache path. The viewer
          # binary's executable bit is restored by the battery job (GitHub
          # artifacts do not preserve file permissions). hash.txt is the
          # content-hash manifest the renderer reads the /pkg filenames back
          # from; without it the viewer 404s its own hashed wasm.
          mkdir -p ui-e2e-console-stage/site
          cp target/debug/ferroehr-viewer ui-e2e-console-stage/
          cp target/debug/hash.txt ui-e2e-console-stage/
          cp ui-e2e-tests.tar.zst ui-e2e-console-stage/
          cp -R target/site/. ui-e2e-console-stage/site/
      - name: sccache statistics
        if: always() && steps.viewer-cache.outputs.cache-hit != 'true'
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: ${SCCACHE_PATH} --show-stats
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-e2e-console
          path: ui-e2e-console-stage
          if-no-files-found: error
          retention-days: 1

  # ── Viewer E2E (merge gate for viewer-touching changes) ────────────────────
  # Runs the full composed journey battery (scripts/ui-e2e.sh): postgres +
  # ferroehr + Keycloak via compose, the viewer + e2e binaries prebuilt by the
  # jobs above, chromedriver journeys with the browser-console gate. Screenshots
  # upload on success AND failure (human review — no pixel-diff assertions).
  # The pipeline's critical path (#3120): this job cannot start until the
  # binaries it downloads exist, so the wall clock is `ui-e2e-binary` plus this.
  # The journeys run `-j 1` because all 139 share one composed stack and one
  # browser; sharding gives each shard its own stack, so the serialization holds
  # inside a shard and the shards divide the wall clock. That sidesteps the
  # question of which journeys are order-dependent rather than answering it —
  # the answer is worth having, and it is not this file's to give.
  ui-e2e:
    name: ui-e2e ${{ matrix.shard }}/${{ needs.changes.outputs.ui_e2e_shard_count }}
    needs: [changes, ui-e2e-binary, ui-e2e-viewer]
    if: needs.changes.outputs.viewer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.ui_e2e_shards) }}
    # `contents: read` (now also the workflow-level default) is all it needs:
    # nothing here writes to a registry any more (the GHCR buildx layer cache
    # was removed, and the image is now packaged locally from a job artifact).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # NOTHING compiles in this job any more (issue #335): the server binary,
      # the viewer, and the e2e test binaries all arrive as artifacts from
      # the two parallel jobs above. The toolchain stays only because
      # `cargo nextest run --archive-file` is a cargo subcommand; rust-cache
      # keeps just the registry (nextest resolves no dependencies here, but
      # setup-rust-toolchain's default cache would archive an empty target).
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        # This workflow publishes nothing releasable — the artifacts here are
        # screenshots and short-lived test inputs, so the restored registry
        # cache is not release input.
        with: # zizmor: ignore[cache-poisoning]
          cache-targets: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest
      # The CDR image is PACKAGED here, never compiled here (issue #335 — the
      # rationale is on the ui-e2e-binary job above). `runtime-prebuilt` is
      # COPY-only, so this is a seconds-long step with no layer-cache backend
      # involved at all — which is why GHCR stays product-images-only
      # (ferroehr, ferroehr-postgres, ferroehr-viewer) and no
      # `build-cache` package is published beside them (owner call 2026-07-26).
      # `load: true` puts the result in the docker store so the compose
      # `--no-build` below finds it.
      #
      # The artifact download loses the executable bit (GitHub artifacts do not
      # preserve file permissions), which is exactly why the Dockerfile COPYs
      # the binary with `--chmod=0755`
      # (docs.docker.com/reference/dockerfile — COPY --chmod).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-e2e-server-binary
          path: bin/amd64
      # The prebuilt viewer + e2e binaries from the ui-e2e-viewer job. The
      # artifact download strips the executable bit (GitHub artifacts do not
      # preserve file permissions) — restored here for the viewer binary; the
      # binaries inside the nextest archive keep theirs (tar preserves modes).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui-e2e-console
          path: ui-e2e-console-stage
      - name: Place the prebuilt viewer where the harness expects it
        run: |
          set -euo pipefail
          mkdir -p target/debug target/site
          install -m0755 ui-e2e-console-stage/ferroehr-viewer target/debug/ferroehr-viewer
          # leptos resolves the hash manifest as current_exe().parent()/hash.txt.
          cp ui-e2e-console-stage/hash.txt target/debug/hash.txt
          cp -R ui-e2e-console-stage/site/. target/site/
          test -f ui-e2e-console-stage/ui-e2e-tests.tar.zst
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Package the app image (COPY-only, seconds)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr:ui-e2e
      - name: Build the postgres image (COPY-only, seconds)
        run: docker buildx build --load -t ferroehr-postgres:ui-e2e docker/postgres
      - name: Run the E2E journey battery
        # UI_E2E_NO_BUILD makes ui-e2e.sh `up --no-build` the pre-built
        # images; the two PREBUILT vars make it run the viewer + e2e
        # binaries the ui-e2e-viewer job compiled — zero rustc here.
        env:
          UI_E2E_NO_BUILD: "1"
          UI_E2E_PREBUILT_VIEWER: "1"
          UI_E2E_NEXTEST_ARCHIVE: ${{ github.workspace }}/ui-e2e-console-stage/ui-e2e-tests.tar.zst
          FERROEHR_IMAGE: ferroehr:ui-e2e
          FERROEHR_POSTGRES_IMAGE: ferroehr-postgres:ui-e2e
          UI_E2E_PARTITION: hash:${{ matrix.shard }}/${{ needs.changes.outputs.ui_e2e_shard_count }}
        run: bash scripts/ui-e2e.sh
      - name: Upload journey screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-e2e-screenshots-${{ matrix.shard }}
          path: target/ui-e2e/screenshots/
          if-no-files-found: ignore

  # ── The compose/local image target (docker/Dockerfile runtime-from-source) ──
  # ui-e2e packages the shipped `runtime-prebuilt` target now (issue #335), so
  # the in-image source build that docker-compose.dev.yml (the repo-dev
  # `up --build` posture) and docker/sut-ferroehr.yml (the conformance SUT
  # stack) rely on would otherwise have no CI exercise at all.
  # It is built here instead — but ONLY when its own recipe changes, which is
  # the one moment the full cold compile buys something. Nothing is exported:
  # the build succeeding IS the assertion.
  server-image-from-source:
    name: server image (from source)
    needs: changes
    if: needs.changes.outputs.server_dockerfile == 'true'
    runs-on: ubuntu-latest
    # A deliberate full cold in-image compile (no cache backend at all).
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-from-source
          push: false

  # Screenshot-freshness guard (the changelog-guard pattern): a PR that
  # changes the viewer UI must re-capture the published book screenshots in
  # the same PR (freshness, not pixels — owner decision). Escape hatch: the
  # `no-ui-visual-change` label for BFF-only/comment/test changes.
  #
  # PULL-REQUEST ONLY, deliberately (#2777): both halves — the base..head diff
  # and the label — are pull-request payload, and neither exists on a
  # merge_group event. It has already gated this pull request by then.
  ui-screenshot-guard:
    name: ui-screenshot-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require refreshed screenshots for UI changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-ui-visual-change') }}
        run: |
          set -euo pipefail
          if [ "$HAS_LABEL" = "true" ]; then
            echo "no-ui-visual-change label set — guard skipped."; exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          if ! echo "$changed" | grep -qE '^app/ferroehr-viewer/(src|style)/'; then
            echo "No viewer UI paths touched — guard not required."; exit 0
          fi
          if echo "$changed" | grep -qE '^website/book/src/viewer/img/'; then
            echo "Screenshots refreshed — OK."; exit 0
          fi
          echo "::error::This PR changes the viewer UI but does not refresh website/book/src/viewer/img/ (run scripts/ui-e2e.sh with UI_E2E_DOCS_SHOTS=1 and commit the captures), and does not carry the 'no-ui-visual-change' label." >&2
          exit 1

  # Crate-version guard (the changelog-guard pattern): a PR that changes
  # PACKAGED content of the published crates/* members must bump the lockstep
  # 0.0.x crate version in the same PR — published versions are immutable
  # (.claude/rules/crates-publishing.md; local twin:
  # .claude/hooks/crate_version_bump_guard.sh). Escape hatch: the
  # `no-crate-bump` label for diffs that provably do not alter packaged bytes.
  #
  # PULL-REQUEST ONLY, deliberately (#2777): it compares the pull request's
  # base and head trees and reads a pull-request label, neither of which a
  # merge_group event carries. It has already gated this pull request by then.
  crate-version:
    name: crate-version-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a lockstep version bump for packaged-content changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-crate-bump') }}
        run: |
          set -euo pipefail
          if [ "$HAS_LABEL" = "true" ]; then
            echo "no-crate-bump label set — guard skipped."; exit 0
          fi
          bash scripts/checks/crate-packaged-paths.sh --self-test
          changed=$(git diff --name-only "$BASE" "$HEAD")
          packaged=0
          # The packaged-path scope is the script the local hook also calls,
          # so the two guards cannot drift (#3573: the bare LICENSE of the
          # BUSL crates passed both inline copies).
          verdict=0
          echo "$changed" | bash scripts/checks/crate-packaged-paths.sh || verdict=$?
          case "$verdict" in
            0) packaged=1 ;;
            1) ;;
            *) echo "::error::scripts/checks/crate-packaged-paths.sh failed (exit $verdict)." >&2; exit 1 ;;
          esac
          # A ROOT [workspace.dependencies] version change alters the PACKAGED
          # manifest of every crates/* member consuming the entry with
          # `workspace = true` (cargo package renders the concrete
          # requirement) without touching any crates/* file — the path scope
          # alone let PR #3021 through (#3036).
          if [ "$packaged" -eq 0 ] && echo "$changed" | grep -qx 'Cargo.toml'; then
            table=$(git show "$HEAD:Cargo.toml" | awk '/^\[workspace\.dependencies\]/{f=1;next} /^\[/{f=0} f && /^[A-Za-z0-9_-]+[. =]/{print $1}' | sed 's/\.workspace$//' | sort -u)
            # `|| true`: a Cargo.toml diff touching no entry (a comment) matches
            # nothing, and grep's exit 1 would end the job silently under pipefail.
            names=$(git diff "$BASE" "$HEAD" -- Cargo.toml | { grep -E '^[+-][A-Za-z0-9_-]+(\.workspace)?[[:space:]]*=' || true; } | sed -E 's/^[+-]//; s/[[:space:]]*=.*//; s/\.workspace$//' | sort -u)
            for name in $names; do
              echo "$table" | grep -qx "$name" || continue
              if git grep -lE "^${name}(\.workspace)?[[:space:]]*=" "$HEAD" -- 'crates/openehr-*/Cargo.toml' >/dev/null 2>&1; then
                echo "workspace dependency '$name' changed and crates/* members consume it — packaged requirements move."
                packaged=1
                break
              fi
            done
          fi
          if [ "$packaged" -eq 0 ]; then
            echo "No packaged crate content touched — guard not required."; exit 0
          fi
          old=$(git show "$BASE:crates/openehr-base/Cargo.toml" | grep -m1 '^version = ')
          new=$(git show "$HEAD:crates/openehr-base/Cargo.toml" | grep -m1 '^version = ')
          if [ "$old" = "$new" ]; then
            echo "::error::This PR changes packaged content of the published crates/* members but does not bump the lockstep 0.0.x crate version (bump all nine 'version' fields + the internal version requirements — .claude/rules/crates-publishing.md), and does not carry the 'no-crate-bump' label." >&2
            exit 1
          fi
          # Lockstep: all nine crates carry ONE version, and every internal
          # dependency requirement names exactly that version.
          #
          # fuzz/ is its OWN workspace (never a root member), so its lock records
          # the nine by path dependency and goes stale silently when the bump
          # lands — the fuzz lane then builds against manifests the lock
          # contradicts, and `--locked` there means nothing (issue #2762).
          ver=$(echo "$new" | sed -E 's/version = "([^"]+)".*/\1/')
          fuzz_lock=$(git show "$HEAD:fuzz/Cargo.lock")
          for c in base rm am adl term lang query its sdt; do
            v=$(git show "$HEAD:crates/openehr-$c/Cargo.toml" | grep -m1 '^version = ' | sed -E 's/version = "([^"]+)".*/\1/')
            if [ "$v" != "$ver" ]; then
              echo "::error::crates/openehr-$c is at $v but the lockstep version is $ver — bump all nine together." >&2
              exit 1
            fi
            locked=$(awk -v n="\"openehr-$c\"" '$1 == "name" && $3 == n { hit = 1; next } hit && $1 == "version" { gsub(/"/, "", $3); print $3; exit }' <<< "$fuzz_lock")
            if [ "$locked" != "$ver" ]; then
              echo "::error::fuzz/Cargo.lock records openehr-$c ${locked:-nothing} but the lockstep version is $ver — refresh it with 'cargo update --manifest-path fuzz/Cargo.toml --workspace' and commit the lock in this PR." >&2
              exit 1
            fi
          done
          reqs=$(git grep -hoE 'path = "\.\./openehr-[a-z]+", version = "[0-9.]+"' "$HEAD" -- 'crates/*/Cargo.toml' | grep -oE 'version = "[0-9.]+"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u)
          if [ "$reqs" != "$ver" ]; then
            echo "::error::internal openehr-* version requirements ($reqs) do not all match the lockstep version $ver — update every 'version =' on the path dependencies too." >&2
            exit 1
          fi
          echo "Lockstep crate version bumped to $ver — OK."

  # Chart-version guard (the crate-version-guard pattern, issue #2108): a PR that
  # changes PACKAGED chart content must bump `Chart.yaml` version in the same PR.
  #
  # The immutability this protects is NOT the registry's own: an OCI tag is
  # mutable, and a second `helm push` of the same chart version silently replaces
  # the manifest (measured against a local registry — the digest changed with no
  # warning). So the publish lane refuses to overwrite a published version, and
  # this guard makes sure a change carries a version to publish under. Artifact
  # Hub indexes versions, so a re-used one is a listing that misdescribes itself.
  #
  # PACKAGED content is `deploy/helm/ferroehr/**` only. The value overlays, the
  # golden renders, the validator, the helm pin and the Artifact Hub metadata live
  # one level up and ship in nothing — a change to those needs no bump.
  # Escape hatch: the `no-chart-bump` label, for a packaged diff that provably
  # cannot alter what a consumer gets. A comment in `values.yaml` does not
  # qualify: values.yaml ships.
  #
  # PULL-REQUEST ONLY, deliberately (#2777): same shape as crate-version — a
  # base..head diff plus a label, neither carried by a merge_group event, and
  # already gated on the pull request.
  chart-version:
    name: chart-version-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a Chart.yaml version bump for packaged chart changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-chart-bump') }}
        run: |
          set -euo pipefail
          if [ "$HAS_LABEL" = "true" ]; then
            echo "no-chart-bump label set — guard skipped."; exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          if ! echo "$changed" | grep -qE '^deploy/helm/ferroehr/'; then
            echo "No packaged chart content touched — guard not required."; exit 0
          fi
          old=$(git show "$BASE:deploy/helm/ferroehr/Chart.yaml" | sed -nE 's/^version: *(.+)$/\1/p')
          new=$(git show "$HEAD:deploy/helm/ferroehr/Chart.yaml" | sed -nE 's/^version: *(.+)$/\1/p')
          if [ "$old" = "$new" ]; then
            echo "::error::This PR changes packaged chart content (deploy/helm/ferroehr/) but leaves Chart.yaml version at $new. A published chart version is taken — bump it (SemVer over the chart's values schema and rendered output), or apply 'no-chart-bump' if the diff provably cannot change what a consumer gets." >&2
            exit 1
          fi
          echo "Chart version bumped $old -> $new — OK."

  # appVersion guard (issue #2108, narrowed by #2779). It used to hold
  # `appVersion` and the `artifacthub.io/images` tags equal to the WORKSPACE
  # version, which made both of them per-release facts a human had to hand-edit
  # at every cut. They are injected now: `build-chart.yml` packages with
  # `helm package --app-version <released version>` and rewrites the annotation's
  # tags in the same step, so the published chart is right by construction and a
  # cut edits neither.
  #
  # What is left in the tree is a DEFAULT — for a chart-only dispatch between
  # releases, and for anyone running `helm template`/`helm install` against this
  # directory — and the properties that default still has to have are in
  # scripts/checks/chart-appversion.sh, which `plan` runs against the tagged
  # commit too. One script rather than two copies of one check.
  #
  # What no version guard catches, stated because it was measured rather than
  # imagined: an appVersion naming a real release does not mean that release's
  # image ACCEPTS the chart's current `config` defaults. Values track development
  # between releases, so the rendered default configuration carries
  # `server.limits` and `db.statement_timeout_ms`, which 3.17.3 does not know — its
  # own `config check` refuses the file, and a plain `helm install` crash-loops.
  # Only an image can answer that: the `chart-boot` job below replays it against
  # the tree-built image, and build-chart.yml refuses to publish a chart that
  # cannot deploy the image it selects.
  chart-appversion:
    name: chart-appversion-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The chart release-facts guard refuses its own mutations
        run: bash scripts/checks/chart-appversion.sh --self-test
      - name: The committed chart release facts are coherent
        run: bash scripts/checks/chart-appversion.sh

  # Veredictum-pin guard (#2867, #3593): scripts/lib/veredictum.sh promises every
  # pin bump is re-proven by a full `scripts/conformance.sh` run against the
  # committed baseline, and this job is the failing check behind that promise
  # (a rule without one is a wish — reliability.md). A PR that changes
  # VEREDICTUM_VERSION passes when the `artifacts/`, `specs/`, `schemas/` and
  # runner (`app/veredictum/src/`) git trees are all identical at the old and
  # new tag (read from the GitHub API, failing closed), and otherwise must
  # refresh docs/conformance/ferroehr/ (the
  # run's committed record) or carry the `no-conformance-run` label as an
  # explicit, visible deferral. scripts/checks/veredictum-pin.sh holds the logic;
  # its --self-test drives it against a stub gh first.
  #
  # PULL-REQUEST ONLY, deliberately (the crate-version pattern, #2777): it
  # compares the pull request's base and head trees and reads a pull-request
  # label, neither of which a merge_group event carries.
  veredictum-pin:
    name: veredictum-pin-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The pin guard passes and fails its stub-gh cases
        run: bash scripts/checks/veredictum-pin.sh --self-test
      - name: A pin bump carries its acceptance run or moves no catalogue content
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-conformance-run') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          label=()
          if [ "$HAS_LABEL" = "true" ]; then
            label=(--no-conformance-run)
          fi
          bash scripts/checks/veredictum-pin.sh "${label[@]}" "$BASE" "$HEAD"

  # Every per-instance ixit parameter the PINNED instrument defines is declared
  # on every instance of our party set, or its absence is adjudicated in the
  # register beside the ixit (#3041). The parameter set comes from the pinned
  # tag's own schema, fetched here, so a pin bump that introduces one fails this
  # job until the party declares or adjudicates it — before the pipeline would
  # silently guard its cases out.
  ixit-declarations:
    name: ixit-declarations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The party ixit declares every instance parameter the pinned schema defines
        run: |
          set -euo pipefail
          version=$(grep -m1 '^VEREDICTUM_VERSION=' scripts/lib/veredictum.sh | cut -d'"' -f2)
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/rubentalstra/Veredictum/v${version}/schemas/ixit.schema.json" \
            -o /tmp/ixit.schema.json
          bash scripts/checks/ixit-declarations.sh --schema /tmp/ixit.schema.json docs/conformance/party/ferroehr

  # Changelog guard (Keep a Changelog discipline): a PR that changes
  # user-visible surfaces must update CHANGELOG.md's [Unreleased] section in
  # the same PR. Escape hatch: the `no-changelog` label for genuinely
  # invisible changes (internal refactors, CI, docs).
  #
  # PULL-REQUEST ONLY, deliberately (#2777): the entry requirement is a
  # base..head diff plus a label, neither carried by a merge_group event, and
  # already gated on the pull request. The structure half is a whole-file
  # check, but it is not worth splitting into a second job for a queue that
  # cannot change the file between the pull request and the merge.
  # A person's pull request records acceptance of the contribution licensing
  # terms (CONTRIBUTING.md § Licensing of contributions) through the template's
  # checkbox; this gate is what makes the checkbox binding. Bot authors are
  # skipped: a bot cannot accept terms and its bumps carry no expression of its
  # own. `edited` is in the pull_request trigger so ticking the box re-runs it.
  contribution-licence:
    name: contribution-licence-guard
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pull request body accepts the contribution licensing terms
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/checks/contribution-licence.sh

  migration-immutability:
    name: migration-immutability
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # The guard judges only files present at the latest release tag.
          fetch-tags: true
      # The detector runs against a scratch repository of its own first, so the
      # data this job acts on is produced by a filter that was just proven to
      # catch a modified and a deleted migration and to let an added one pass.
      - name: The guard's own detector
        run: bash scripts/checks/migration-immutability.sh --self-test
      # Context reaches the shell through env, never `${{ }}`-inline.
      - name: No migration that already exists on the base branch was changed
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/checks/migration-immutability.sh --diff "$PR_BASE" "$PR_HEAD"

  # A change that moves the pseudonymisation boundary is reviewed as one: the
  # template's 'Privacy boundary' checklist has to be ticked, and no added line
  # may carry a value shaped like a real Dutch identifier (CONTRIBUTING.md
  # § Personal data). `edited` is in the pull_request trigger, so ticking a box
  # re-runs this. Bot authors are skipped for the reason the licence gate skips
  # them: a bot cannot make the claims the checklist records, and its bumps
  # touch none of the boundary paths.
  privacy-boundary:
    name: privacy-boundary-guard
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The BSN and postcode detectors are the whole value of this job, so they
      # are proven against passing and failing fixtures before they judge a
      # diff. A data check nobody exercises is a check nobody can trust.
      - name: The guard's own detectors
        run: bash scripts/checks/privacy-boundary.sh --self-test
      # Context reaches the shell through env, never `${{ }}`-inline.
      - name: The privacy boundary is reviewed and the diff carries no personal data
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/checks/privacy-boundary.sh --diff "$PR_BASE" "$PR_HEAD"

  changelog:
    name: changelog-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Structure check runs UNCONDITIONALLY — the no-changelog label waives
      # the entry requirement below, never the file's Keep-a-Changelog
      # validity (duplicate '### Added'/'### Fixed' headers in one release
      # section shipped into release notes twice before this guard).
      - name: Changelog structure (no duplicate subsections, canonical types)
        run: bash scripts/checks/changelog-structure.sh
      - name: Require a CHANGELOG entry for user-visible changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          set -euo pipefail
          if [ "$HAS_LABEL" = "true" ]; then
            echo "no-changelog label set — guard skipped."; exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          if ! echo "$changed" | grep -qE '^(app/|crates/|deploy/|docker/|docker-compose|Cargo\.toml|Cargo\.lock)'; then
            echo "No user-visible surface touched — guard not required."; exit 0
          fi
          # grep -c, never grep -q: -q exits at the first match, git diff then
          # dies of SIGPIPE, and `pipefail` turns that into a failed pipeline —
          # so a LARGE changelog diff was reported as "no entry" (this PR).
          # -c reads the whole diff, so the pipeline always exits cleanly.
          if echo "$changed" | grep -qx 'CHANGELOG.md'; then
            added=$(git diff "$BASE" "$HEAD" -- CHANGELOG.md | grep -c '^+.*[^[:space:]]' || true)
            if [ "${added:-0}" -gt 0 ]; then
              echo "CHANGELOG.md updated ($added added lines) — OK."; exit 0
            fi
          fi
          echo "::error::This PR changes user-visible surfaces (app/, crates/, deploy/, docker/, manifests) but does not add a CHANGELOG.md [Unreleased] entry (Keep a Changelog 1.1.0). Add one, or apply the 'no-changelog' label if truly invisible." >&2
          exit 1

  # Citation guard: CITATION.cff must stay CFF-1.2.0-schema-valid and
  # version-consistent with the workspace — a malformed file silently breaks
  # GitHub's "Cite this repository" button, and a stale version misquotes the
  # release in research citations. The release cut bumps version +
  # date-released (.claude/rules/changelog.md §Cutting a release).
  citation:
    name: citation-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No Python (#2791): this step replaced `pipx run cffconvert --validate`,
      # which contradicted the no-Python hard rule (rust-style.md §No Python —
      # the no-python guard now catches pipx/pip too). Same contract, different
      # validator: cffconvert validates against the SAME schema file, vendored
      # at .github/cff-schema/ (scripts/vendor/cff-schema.sh), and the pinned
      # Rust jsonschema-cli validates the yq-converted document against it.
      # yq is pinned + checksum-verified like the helm-golden job's copy.
      - name: Install yq + the pinned jsonschema-cli
        env:
          YQ_VERSION: v4.53.3
          YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
          JSONSCHEMA_CLI_VERSION: 0.52.0
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          cargo install jsonschema-cli --version "${JSONSCHEMA_CLI_VERSION}" --locked
      - name: Validate CITATION.cff (CFF 1.2.0 schema)
        run: |
          set -euo pipefail
          yq -o=json CITATION.cff > "${RUNNER_TEMP}/citation.json"
          jsonschema-cli validate .github/cff-schema/schema.json -i "${RUNNER_TEMP}/citation.json"
      # The ferroehr party statement is the published conformance claim for
      # THE product this repo ships; its product version sat at 3.6.0 while
      # the record reached 3.20.0 with nothing failing (#2576). Same
      # version-agreement family as the CITATION check below; the ehrbase
      # party statement deliberately stays unchecked (another vendor's
      # product).
      - name: The ferroehr party statement's product version matches the workspace
        run: bash scripts/checks/statement-version.sh
      - name: CITATION.cff version matches the workspace version
        run: |
          set -euo pipefail
          cff_ver=$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' CITATION.cff)
          ws_ver=$(sed -nE 's/^version = "(.*)"$/\1/p' Cargo.toml | head -1)
          if [ -z "$cff_ver" ] || [ -z "$ws_ver" ]; then
            echo "::error::could not extract versions (CITATION.cff: '$cff_ver', Cargo.toml: '$ws_ver')." >&2
            exit 1
          fi
          if [ "$cff_ver" != "$ws_ver" ]; then
            echo "::error::CITATION.cff version ($cff_ver) != workspace version ($ws_ver) — the release cut bumps CITATION.cff version/date-released (.claude/rules/changelog.md)." >&2
            exit 1
          fi
          echo "CITATION.cff version $cff_ver matches the workspace version."
      # `.zenodo.json` is GENERATED from CITATION.cff, because Zenodo ignores
      # CITATION.cff entirely whenever a .zenodo.json is present
      # (https://help.zenodo.org/docs/github/describe-software/zenodo-json/).
      # A hand-edited copy would therefore silently override the file this job
      # guards, and the disagreement would be archived under a DOI that cannot
      # be edited afterwards.
      - name: .zenodo.json is in sync with CITATION.cff
        run: bash scripts/render/zenodo-json.sh --check

  # Compose version guard: the standalone quickstart docker-compose.yml pins
  # the published images by tag, so a release cut that forgets those defaults
  # ships a quickstart running the PREVIOUS release. The release cut bumps them
  # with the workspace version (.claude/rules/changelog.md §Cutting a release).
  compose-version-guard:
    name: compose-version-guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker-compose.yml image tags match the workspace version
        run: bash scripts/checks/compose-image-tags.sh

  # ── The one-check aggregate gate (the rust-analyzer/ruff pattern) ───────────
  # A single job that needs everything and passes iff nothing failed — skipped
  # jobs count as satisfied, exactly like branch protection treats them. Point
  # branch protection at THIS check alone, so adding, renaming, or path-gating
  # jobs never requires touching repository settings. It reports on the
  # merge_group event too (#2777), so enabling a merge queue needs no change
  # here either — the jobs that skip in a queue count as satisfied, exactly as
  # the path-gated ones already do.
  conclusion:
    name: conclusion
    if: always()
    needs:
      - changes
      - fmt
      - no-attribution
      - workflow-audit
      - workflow-lint
      - shellcheck
      - tracker-helpers
      - ferroterm-index-layout
      - hosted-deploy-script
      - comment-style
      - default-style
      - e2e-waits
      - docs-claims
      - control-matrix
      - tracker-status
      - ehds-pages
      - sql-string-building
      - error-hygiene
      - error-source-chain
      - no-python
      - license-text
      - copyright-holder
      - spdx-headers-text
      - law-corpus
      - licensing
      - spec-citations
      - compose-hardening
      - terminology-seed-drift
      - deny
      - vex
      - clippy
      - feature-combos
      - its-wasm
      - its-rest-features
      - doc
      - msrv
      - codegen-drift
      - build
      - test
      - test-viewer
      - helm-golden
      - unused-deps
      - ui-e2e-binary
      - ui-e2e-viewer
      - ui-e2e
      - deploy-probe
      - server-image-from-source
      - ui-screenshot-guard
      - contribution-licence
      - privacy-boundary
      - migration-immutability
      - ixit-declarations
      - changelog
      - citation
      - compose-version-guard
      - crate-version
      - chart-version
      - chart-appversion
      - veredictum-pin
      - chart-boot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[] | .result; . == "success" or . == "skipped")' >/dev/null
