# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  # One run per commit under test: only the activity types that change the
  # code start CI. `edited`, `labeled` and `unlabeled` each start a run of
  # their own on the SAME head commit ("By default, a workflow only runs when
  # a pull_request event's activity type is opened, synchronize, or reopened",
  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request),
  # the concurrency group below then cancels the run in flight, and that run's
  # `conclusion` reported a failure on the head commit (#3948).
  #
  # The guards that read an escape label or the description read it from the
  # REST API when they run, because a re-run replays the original event
  # payload; pr-guards.yml re-runs the guard a changed label or description
  # affects in this run once it completes.
  pull_request:
    types: [opened, synchronize, reopened]
  # Declared before any merge queue exists, because a queue reports its checks
  # on this event alone: "you need to update the workflows to include the
  # merge_group event as an additional trigger. Otherwise, status checks will
  # not be triggered when you add a pull request to a merge queue"
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#merge_group).
  # Enabling a queue is then a repository-settings change, not a workflow one.
  merge_group:
  # The nightly full run (docs/ci-cd.md, #6518): a schedule has no base to
  # diff against, so `changes` selects every lane, the browser lanes in full
  # included. nightly-report.yml files an issue when it fails.
  schedule:
    - cron: "37 1 * * *" # daily 01:37 UTC, off the hour

concurrency:
  # A pull request's runs share its ref; every push to main shares one group;
  # each merge-group entry gets a group of its own commit, which the queue
  # alone cancels. A newer push to main cancels the older push run: a verified
  # push only writes caches, and a cancelled bypass push is covered by the next
  # queue group built on it and by the nightly full run. Pending runs in one
  # group give way to the newest one
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency).
  group: ci-${{ case(github.event_name == 'pull_request', github.ref, github.event_name == 'push', 'main-push', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

# No permissions by default; every job grants itself the minimum it needs
# (job-level permissions override workflow-level ones —
# docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions).
# A job added without a `permissions:` block therefore gets a token that can do
# nothing, which fails loudly at its checkout rather than running over-privileged.
permissions: {}

env:
  # A FerroEHR started by any step of this workflow sends no usage report to
  # FerroPULSE: compose interpolates this into every server it brings up, and
  # scripts/checks/usage-report-off.sh holds each `docker run` and Helm install
  # to its own explicit switch.
  FERROEHR__USAGE_REPORT__ENABLED: "false"
  # The ONE place each sharded lane's count lives. Raising one is that line: the
  # matrix, the job name and the `--partition` divisor are all derived from it,
  # so they cannot drift apart. When one needs raising, the pipeline-budget
  # watcher says so rather than someone noticing a slow pull request (#3131).
  TEST_SHARDS: "6"
  UI_E2E_SHARDS: "3"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CI builds are closer to from-scratch builds; incremental compilation only
  # adds dependency-tracking overhead and bloats the caches — and sccache
  # cannot cache incrementally-compiled crates at all
  # (github.com/mozilla/sccache#known-caveats).
  CARGO_INCREMENTAL: "0"
  # No debuginfo in CI test builds: linking is the one cost no compile cache
  # can remove (sccache never caches linker invocations), and debuginfo is
  # most of the link weight and most of ./target's cache size. Backtraces
  # keep symbol names, only source lines are lost (the bevy/polars pattern:
  # bevy sets exactly these two vars; polars uses `-C debuginfo=0`).
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Every job here gates the merge through `conclusion`.
  #
  # Event gating (#2777), the rule behind every `if:` in this file that names
  # an event: the pull request runs the full set. A merge group runs the light
  # set (owner ruling 2026-11-25): change detection, rustfmt, lint, the
  # guards, cargo-deny, the bin link, the test archive and its smoke set,
  # release-fragments and conflict-markers. The pull request already ran the
  # rest on its own tree, and the nightly full run checks main. A job gated
  # on `pull_request` alone reads pull-request context the merge_group
  # payload does not carry (a `base..head` diff, an escape-hatch label).
  #
  # The verified push, the rule behind every `queue_verified` in this file
  # (#4546, #6515): the `changes` job sets it when a `merge_group` run of this
  # workflow passed `conclusion` on the pushed tree. Such a push only writes
  # the caches pull requests read: each rust-cache lane `cache_refresh` names
  # (its key's inputs moved, or main holds no entry) builds without running
  # its tests, and ui-e2e-binary and ui-e2e-viewer write the exact-key binary
  # caches and main's sccache entries. A push no queue run passed runs every
  # lane.
  #
  # perf and the browser lanes (ui-e2e, ui-docs-shots, viewer-login-smoke)
  # run on the pull request when the viewer changed, and in full on the
  # schedule. Perf A/B and the CPU budget read a clock, so they run in
  # nightly.yml and never gate a merge (docs/ci-cd.md, #6517).
  # No lane reads anything a queue run cannot: the conformance catalogue runs
  # for a push in containers.yml, against the images it pushes.
  #
  # Cache policy (the ruff/polars `save-if` idiom): only main writes the
  # per-job rust-cache entries and the sccache entries; PR branches restore
  # main's warm cache and never publish their own. PR-branch caches are read by nothing else (GHA
  # cache scoping), so letting every PR save would only thrash the shared
  # 10 GB repo quota and evict the caches that matter — including the ui-e2e
  # exact-key binary caches below. actions-cache-prune.yml deletes what main
  # replaced and every entry outside main (#6388).

jobs:
  # ── Change detection: cargo jobs run ONLY when build-relevant paths change ──
  # Allowlist (owner ruling 2026-07-17: no Rust-affecting change → no cargo
  # jobs, workflow-only and docs-only PRs included): app/, crates/, tools/,
  # scripts/, .cargo/, .config/, Cargo.toml, Cargo.lock, rust-toolchain.toml,
  # rustfmt.toml, clippy.toml, deny.toml. Everything else (docs/, website/,
  # .claude/, .github/, markdown, compose files, assets) skips the cargo
  # jobs. GitHub treats a skipped required check as satisfied, so branch
  # protection is unaffected; a workflow-gating bug surfaces on the next
  # code-touching PR, which is acceptable.
  #
  # TWO NARROW EXCEPTIONS to "not build-relevant" (#2373), both instances of
  # the rule the viewer/helm/chart_boot filters below already state — a
  # change to a job's own recipe exercises the job it changes:
  #   * `workflows` — this file. A workflow-only PR skipped EVERY cargo lane,
  #     including the lane whose recipe it was editing, so a narrowed clippy
  #     invocation or a dropped feature combination went in unexercised. It
  #     re-triggers the three RECIPE-BEARING cargo lanes (clippy, deny,
  #     test) rather than every cargo lane: those three
  #     encode WHICH surface is verified — which crates, which features, which
  #     flags, which extra guard scripts — so an edit there can NARROW what CI
  #     checks while every lane still reports green. The single-command lanes
  #     (fmt, doc, codegen-drift, unused-deps) run one canonical
  #     whole-workspace command with no surface to narrow; a broken edit there
  #     fails that lane outright on the next code-touching PR, which is the
  #     same trade-off the paragraph above already accepts.
  #   * `vex` — the VEX gates that run inside the `deny` job
  #     (`vex-reachability.sh` reads the generated OpenVEX document,
  #     `advisory-exceptions.sh` reads `deny.toml`) plus the two check scripts
  #     themselves. `deny.toml` is already in the code allowlist; the VEX
  #     documents and those scripts are not, so a `security/vex/**`-only PR
  #     skipped the job that enforces them (#2370).
  changes:
    name: change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The merge-queue runs of the pushed commit and main's cache entries,
      # read by the `push` step below (#4546).
      actions: read
    outputs:
      postgres_image: ${{ steps.postgres.outputs.image }}
      code: ${{ steps.filter.outputs.code }}
      code_runs: ${{ steps.filter.outputs.code_runs }}
      viewer: ${{ steps.filter.outputs.viewer }}
      server_dockerfile: ${{ steps.filter.outputs.server_dockerfile }}
      viewer_dockerfile: ${{ steps.filter.outputs.viewer_dockerfile }}
      helm: ${{ steps.filter.outputs.helm }}
      chart_boot: ${{ steps.filter.outputs.chart_boot }}
      perf: ${{ steps.filter.outputs.perf }}
      deploy: ${{ steps.filter.outputs.deploy }}
      workflows: ${{ steps.filter.outputs.workflows }}
      vex: ${{ steps.filter.outputs.vex }}
      conformance: ${{ steps.filter.outputs.conformance }}
      fuzz: ${{ steps.filter.outputs.fuzz }}
      semver: ${{ steps.filter.outputs.semver }}
      queue_verified: ${{ steps.push.outputs.queue_verified }}
      rust: ${{ steps.affected.outputs.rust }}
      packages: ${{ steps.affected.outputs.packages }}
      runs: ${{ steps.affected.outputs.runs }}
      instructions: ${{ steps.filter.outputs.instructions }}
      server: ${{ steps.affected.outputs.server }}
      viewer_crate: ${{ steps.affected.outputs.viewer }}
      cargo_args: ${{ steps.affected.outputs.cargo_args }}
      all_args: ${{ steps.affected.outputs.all_args }}
      cache_refresh: ${{ steps.push.outputs.cache_refresh }}
      test_shards: ${{ steps.shards.outputs.test_list }}
      test_shard_count: ${{ steps.shards.outputs.test_count }}
      ui_e2e_shards: ${{ steps.shards.outputs.ui_list }}
      ui_e2e_shard_count: ${{ steps.shards.outputs.ui_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The CI PostgreSQL image, pinned by digest in docker/ci-postgres/image.ref
      # (#6520): non-durable, pg_stat_statements preloaded, 400 connections.
      - id: postgres
        run: |
          set -euo pipefail
          image="$(tr -d '[:space:]' < docker/ci-postgres/image.ref)"
          [[ "$image" =~ ^ghcr\.io/ferrohealth/ferroehr-ci-postgres@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::docker/ci-postgres/image.ref holds '$image', not ghcr.io/ferrohealth/ferroehr-ci-postgres@sha256:<digest>"
            exit 1
          }
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: The path classifier finds a match first and last in a 2000-path list
        run: bash scripts/lib/change-lanes.sh --self-test
      - name: A push finds the merge-queue run of its tree, never of its SHA
        run: bash scripts/lib/queue-runs.sh --self-test
      - name: Every lane that starts a consumer of the server binary builds it
        run: |
          set -euo pipefail
          bash scripts/checks/binary-consumers.sh --self-test
          bash scripts/checks/binary-consumers.sh
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE_REF: ${{ github.event.merge_group.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            # A merge group is checked out as the queue ref, whose head is
            # `github.sha` ("GITHUB_SHA: SHA of the merge group"). Its
            # `base_sha` is the head of the entry queued ahead of it, not the
            # base branch, so a diff from it reads only the last entry, and a
            # group whose last entry touches no code gates every earlier
            # entry's code out (#5741). The base is where the group forked
            # from the base branch, so the group is tested as a whole. If it
            # does not resolve, the fallback below runs every job (#2777).
            base="$(git merge-base "origin/${QUEUE_BASE_REF#refs/heads/}" "$PUSH_SHA" 2>/dev/null || true)"
            head="$PUSH_SHA"
          else
            base="$PUSH_BEFORE"; head="$PUSH_SHA"
          fi
          # First push / unknown base / no merge base: run everything. Every
          # output must be set here — an unset output reads as `false`
          # downstream, and a skipped job counts as satisfied in `conclusion`,
          # so omitting one turns "run everything" into "silently gate nothing".
          # The paths are the change's own, read from its merge base with the
          # base (#4129), so a branch behind main is not gated on main's paths.
          if ! git rev-parse --verify --quiet "$base" >/dev/null \
            || ! changed=$(bash scripts/lib/changed-paths.sh "$base" "$head"); then
            echo "Base $base unavailable or unrelated — treating as a change to everything."
            {
              echo "code=true"
              echo "code_runs=true"
              echo "viewer=true"
              echo "server_dockerfile=true"
              echo "viewer_dockerfile=true"
              echo "helm=true"
              echo "chart_boot=true"
              echo "perf=true"
              echo "deploy=true"
              echo "workflows=true"
              echo "vex=true"
              echo "cache=true"
              echo "conformance=true"
              echo "fuzz=true"
              echo "semver=true"
              echo "instructions=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"; echo "$changed"
          # One line per lane, false included: an unset output reads as
          # `false` downstream and a skipped job counts as satisfied, so every
          # gate is written deliberately. The lanes and their reasons are in
          # the script, which matches from a here-string (#4208).
          # A Rust source whose changed lines are all comments still reaches
          # `code` (fmt, clippy, rustdoc read comments) and no lane that runs
          # code (scripts/lib/comment-only.sh, #6519).
          runs="$(bash scripts/lib/comment-only.sh "$base" "$head" <<<"$changed")"
          full="$(bash scripts/lib/change-lanes.sh ci <<<"$changed")"
          ran="$(bash scripts/lib/change-lanes.sh ci <<<"$runs")"
          {
            sed -n '/^code=/p' <<<"$full"
            sed -n 's/^code=/code_runs=/p' <<<"$ran"
            sed '/^code=/d' <<<"$ran"
            # The conformance lane (#4539): the catalogue runs in this workflow
            # on a pull request.
            bash scripts/lib/change-lanes.sh conformance <<<"$runs"
          } | tee -a "$GITHUB_OUTPUT"
      # A push to main whose tree the merge queue already passed (#4546). The
      # commit GitHub lands on main carries the tree the `merge_group` run checked
      # and never that run's SHA, so the run is found by tree
      # (scripts/lib/queue-runs.sh, #5834). A push the queue did not check (an
      # administrator's bypass, or an answer this step cannot read) runs every lane.
      #
      # The push stays the only writer of main's cargo caches, which pull
      # requests restore: a cache a queue run writes is scoped to its
      # `gh-readonly-queue/` ref, which nothing else reads. So a verified push
      # still runs each rust-cache lane whose entry it must write, every one
      # when the key's inputs moved (the `cache` lane), and otherwise the ones
      # whose entry main no longer holds (the 10 GB quota evicts them).
      - id: push
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          CACHE_INPUTS: ${{ steps.filter.outputs.cache }}
          # The jobs that save a rust-cache entry on main. rust-cache names it
          # `v0-rust-<job id>-<os>-<arch>-…`, or after its `shared-key` when a
          # job sets one (github.com/Swatinem/rust-cache).
          CACHE_JOBS: deny clippy codegen-drift build build-tests test-viewer
        run: |
          set -euo pipefail
          verified=false
          stale=()
          if [ "$EVENT_NAME" = "push" ]; then
            # shellcheck source=scripts/lib/queue-runs.sh
            . scripts/lib/queue-runs.sh
            if run=$(queue_verified "$PUSH_SHA"); then
              verified=true
              echo "Merge-queue run $run passed this tree."
            elif [ $? -eq 2 ]; then
              echo "::warning::could not read the merge-queue runs of $PUSH_SHA's tree, so every lane runs"
            fi
          fi
          if [ "$verified" = true ]; then
            read -r -a jobs <<<"$CACHE_JOBS"
            for job in "${jobs[@]}"; do
              if [ "$CACHE_INPUTS" = true ]; then
                stale+=("$job")
              elif ! held=$(gh api "repos/$REPO/actions/caches?ref=refs/heads/main&key=v0-rust-$job-Linux-x64-&per_page=1" --jq '.total_count'); then
                echo "::warning::could not read main's cache entry for $job, so it is written again"
                stale+=("$job")
              elif [ "$held" -eq 0 ]; then
                stale+=("$job")
              fi
            done
          fi
          refresh=$(printf '%s\n' "${stale[@]}" | jq -Rnc '[inputs | select(length > 0)]')
          echo "queue verified: $verified; cache lanes to run: $refresh"
          {
            echo "queue_verified=$verified"
            echo "cache_refresh=$refresh"
          } >> "$GITHUB_OUTPUT"
      # The packages the cargo lanes build, from the cargo metadata graph
      # (#6519). A pull request measures its own change; a merge group the
      # whole group, from where it forked from the base branch, since GitHub
      # merges every entry of a group once its last entry passes (#5741). A
      # push, a schedule and an unresolvable base select every package. The
      # runner's stable cargo reads the metadata, so no toolchain downloads.
      - id: affected
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE_REF: ${{ github.event.merge_group.base_ref }}
          HEAD_SHA: ${{ github.sha }}
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          bash scripts/lib/affected.sh --self-test
          base=""; head=""
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          elif [ "$EVENT_NAME" = merge_group ]; then
            base="$(git merge-base "origin/${QUEUE_BASE_REF#refs/heads/}" "$HEAD_SHA" 2>/dev/null || true)"
            head="$HEAD_SHA"
          fi
          if [ -n "$base" ] && git rev-parse --verify --quiet "$base" >/dev/null \
            && out="$(bash scripts/lib/affected.sh "$base" "$head")"; then
            :
          else
            out="$(bash scripts/lib/affected.sh --all)"
          fi
          echo "$out" | tee -a "$GITHUB_OUTPUT"
      # Each lane's shard list and its divisor, both from the one constant, so a
      # matrix and its `--partition n/N` can never disagree.
      - id: shards
        env:
          TEST_COUNT: ${{ env.TEST_SHARDS }}
          UI_COUNT: ${{ env.UI_E2E_SHARDS }}
        run: |
          set -euo pipefail
          {
            echo "test_count=$TEST_COUNT"
            echo "test_list=[$(seq 1 "$TEST_COUNT" | paste -sd, -)]"
            echo "ui_count=$UI_COUNT"
            echo "ui_list=[$(seq 1 "$UI_COUNT" | paste -sd, -)]"
          } >> "$GITHUB_OUTPUT"

  # ── Required for code changes: formatting ───────────────────────────────────
  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.queue_verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: rustfmt
          # rustfmt compiles nothing — a restored target/registry cache is
          # pure download time here.
          cache: false
      - run: cargo fmt --all --check

  # The workflow linters and the guards a queue-verified push skips, in one
  # job: each check is a step that runs whatever the step before it
  # concluded, so one run reports every finding, and the job takes one
  # runner where it took twelve (#5286). No specification governs this: our
  # own design.
  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.queue_verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # no-attribution reads the commits of the change.
          fetch-depth: 0

      # ---- zizmor ------------------------------------------------------
      # ── Always required: the workflows audit themselves ─────────────────────────
      # zizmor (docs.zizmor.sh) is static analysis for GitHub Actions, named by the
      # OWASP GitHub Actions Security Cheat Sheet as the defence-in-depth tool for
      # this layer. It is the machine check behind three hard properties here: every
      # `uses:` hash-pinned (unpinned-uses, blanket policy by default), no checkout
      # persisting credentials without a recorded exception (artipacked), and no
      # context value spliced into a shell (template-injection).
      #
      # Ungated on the `changes` filter's paths on purpose: that filter excludes
      # `.github/`, so a workflow-only pull request would otherwise skip the one
      # check that reads workflows. It needs `changes` for the verified push alone.
      - name: zizmor
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: zizmor@1.31.1
      - name: zizmor / Audit .github/workflows + .github/actions
        if: ${{ !cancelled() }}
        # GH_TOKEN enables the ONLINE audits, which is the point of running this
        # beside SHA pinning: impostor-commit verifies that a pinned commit
        # really belongs to the repository named in front of it, and it cannot
        # do that offline. --min-severity=low gates on every actionable tier
        # (artipacked is Low) and leaves the informational tier advisory; zizmor
        # exits non-zero when anything at or above the floor is found.
        #
        # The composite actions are audited too (#2775): they carry `uses:` of
        # their own, so a pin only they declare would otherwise be the one
        # `uses:` in the estate nothing checks.
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=low .github/workflows/ .github/actions/

      # ---- actionlint --------------------------------------------------
      # actionlint (github.com/rhysd/actionlint) is the CORRECTNESS half of the pair
      # above: zizmor audits security posture, actionlint checks that the workflow
      # is well-formed at all — `${{ }}` expressions that cannot evaluate, `needs:`
      # naming a job that does not exist, unknown runner labels, and shellcheck over
      # every embedded `run:` block. A committed `.github/actionlint.yaml` (the
      # runner-label roster) existed here long before this job did, so the tool was
      # being run by hand and never gated.
      #
      # Ungated on the `changes` filter for the same reason zizmor is: that filter
      # excludes `.github/`.
      - name: actionlint / Lint .github/workflows
        if: ${{ !cancelled() }}
        # The OFFICIAL image, digest-pinned. actionlint is a Go binary, so
        # `taiki-e/install-action` does not carry it and its cargo-binstall
        # fallback cannot ("actionlint is not found" — it is not a crate). The
        # upstream alternative is `curl | bash` off `main`, which is exactly the
        # unpinned fetch this repository's pinning rule exists to forbid. The
        # image is also the only distribution that BUNDLES shellcheck, which
        # half of actionlint's value depends on: "The image contains actionlint
        # executable and all dependencies (shellcheck and pyflakes)"
        # (https://github.com/rhysd/actionlint/blob/main/docs/usage.md).
        #
        # SC2016 ("expressions don't expand in single quotes") is excluded, and
        # only it: every occurrence in this repo is a `printf` format string or a
        # `jq` filter, where single quotes are the CORRECT idiom precisely
        # because the shell must not expand `%s` or `$`. Nothing else is
        # suppressed — the run is clean at actionlint's own default severity.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            -e SHELLCHECK_OPTS='-e SC2016' \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      # actionlint validates each job in isolation and cannot know that this
      # repository routes branch protection through a single `conclusion` check,
      # which makes a job missing from its `needs` list run without gating
      # anything.
      - name: actionlint / Every CI job gates the merge
        if: ${{ !cancelled() }}
        run: bash scripts/checks/ci-conclusion-complete.sh

      # ---- no attribution in commits -----------------------------------
      # ── Always required: no AI/Claude attribution in commit messages ────────────
      - name: no attribution in commits / Scan commit messages for attribution
        if: ${{ !cancelled() }}
        shell: bash
        # Context reaches the shell through env, never `${{ }}`-inline: the
        # expression is substituted into the script BEFORE bash parses it, so an
        # inline expansion is executable text (the `changes` job above is the
        # pattern). Same discipline as the other guards in this workflow.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE_REF: ${{ github.event.merge_group.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
            base="$PR_BASE"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            # Every queued commit, from where the group forked from the base
            # branch, as the change filter reads it (#2777, #5741): `base_sha`
            # is the head of the entry ahead, which would scan the last entry
            # alone. `github.event.before` is absent on this event, so falling
            # through to the push branch would scan nothing.
            base="$(git merge-base "origin/${QUEUE_BASE_REF#refs/heads/}" "$PUSH_SHA" 2>/dev/null || true)"
            if [ -z "$base" ]; then
              echo "::error::the merge group shares no history with ${QUEUE_BASE_REF}; nothing to scan against" >&2
              exit 1
            fi
            range="$base..$PUSH_SHA"
          else
            range="$PUSH_BEFORE..$PUSH_SHA"
            base="$PUSH_BEFORE"
          fi
          # Handle first-push / shallow edge cases.
          git rev-parse "${base:-HEAD~1}" >/dev/null 2>&1 || range="HEAD"
          echo "Scanning range: $range"
          # `[bot]` catches an automation co-author, with two exceptions:
          # GitHub's squash merge writes `Co-authored-by: dependabot[bot] <…>`
          # or `github-actions[bot] <…>` for a commit Dependabot or a workflow
          # made, which names GitHub's own automation, not an AI author (owner
          # ruling 2026-11-02). The hook in .githooks/commit-msg keeps the same
          # lines, so the two guards agree.
          if git log --format='%B' "$range" 2>/dev/null | grep -iEn \
             'co-authored-by:.*(claude|anthropic|\[bot\])|generated[[:space:]]+(with|by)[[:space:]]+.*claude|claude[[:space:]]+code|🤖|assisted-by:.*claude' \
             | grep -viE '^[0-9]+:[[:space:]]*co-authored-by: (dependabot|github-actions)\[bot\] <[0-9]+\+(dependabot|github-actions)\[bot\]@users\.noreply\.github\.com>[[:space:]]*$'; then
            echo "::error::Commit message contains AI/Claude attribution. Remove it (see project hard rules)."
            exit 1
          fi
          echo "OK: no attribution found."

      # ---- stray-literals ----------------------------------------------
      # No viewer string a reader sees outside its catalog under
      # app/ferroehr-viewer/locales/, beyond the per-file baseline the remaining
      # strings hold while they move (#300). A fall passes, and
      # ratchet-tighten.yml lowers the baseline on main.
      - name: stray-literals / Stray-literal ratchet self-test
        if: ${{ !cancelled() }}
        run: bash scripts/checks/stray-literals.sh --self-test
      - name: stray-literals / Stray literals in the viewer
        if: ${{ !cancelled() }}
        run: bash scripts/checks/stray-literals.sh app/ferroehr-viewer/src

      # ---- duplication -------------------------------------------------
      # Code is written once (.claude/rules/rust-style.md, #4454): the duplicated
      # lines jscpd measures in app/*/src, crates/*/src and tools/*/src may fall
      # and never rise. jscpd runs from its official image, pinned by digest in
      # docs/VERSIONS.md, and the count and the key of every counted block are
      # committed beside the guard. A rise fails and names the new blocks by both
      # places; a fall passes, and ratchet-tighten.yml lowers the count on main.
      - name: duplication / Duplication ratchet self-test
        if: ${{ !cancelled() }}
        run: bash scripts/checks/duplication.sh --self-test
      - name: duplication / The duplicated lines have not risen
        if: ${{ !cancelled() }}
        run: bash scripts/checks/duplication.sh

      # ---- file-size ---------------------------------------------------
      # A hand-written source file carries at most 800 lines, its inline tests
      # included (#4454). A file over it on the day the guard landed stands in
      # scripts/checks/file-size.list with its length and may shrink and never
      # grow; a shrink passes, and ratchet-tighten.yml lowers the entry on main.
      - name: file-size / File-size ratchet self-test
        if: ${{ !cancelled() }}
        run: bash scripts/checks/file-size.sh --self-test
      - name: file-size / No file over the budget or past its entry
        if: ${{ !cancelled() }}
        run: bash scripts/checks/file-size.sh

      # ---- forwarders --------------------------------------------------
      # No function only forwards to another (.claude/rules/rust-style.md,
      # #4663): the forwarders tools/forwarders finds in app/*/src, crates/*/src
      # and tools/*/src may fall and never rise. The count and the key of every
      # counted forwarder are committed beside the guard. A rise fails and names
      # each new forwarder with its target; a fall passes, and
      # ratchet-tighten.yml lowers the count on main. No rust-cache: the tool
      # builds proc-macro2, quote and syn alone.
      - name: forwarders
        if: ${{ !cancelled() }}
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
      - name: forwarders / Forwarder ratchet self-test
        if: ${{ !cancelled() }}
        run: bash scripts/checks/forwarders.sh --self-test
      - name: forwarders / The forwarders have not risen
        if: ${{ !cancelled() }}
        run: bash scripts/checks/forwarders.sh

      # ---- test-modules ------------------------------------------------
      # Every file under a tests/it/ directory is a module its main.rs
      # reaches: an undeclared file compiles nowhere and its tests never run
      # (#5765).
      - name: test-modules / The unreached-module detector catches what it claims to
        if: ${{ !cancelled() }}
        run: bash scripts/checks/test-modules.sh --self-test
      - name: test-modules / Every integration-test file is reachable from its main.rs
        if: ${{ !cancelled() }}
        run: bash scripts/checks/test-modules.sh

      # ---- chart-appversion-guard --------------------------------------
      # appVersion guard (#2108, #2779). `build-chart.yml` packages with `helm
      # package --app-version <released version>` and rewrites the annotation's
      # tags, so a cut edits neither. What is left in the tree is a DEFAULT, for a
      # chart-only dispatch and for `helm template`/`helm install` against this
      # directory; scripts/checks/chart-appversion.sh, which `plan` runs at the
      # tagged commit too, holds its properties.
      #
      # No version guard catches an image that refuses the chart's current `config`
      # defaults: the `chart-boot` job replays them against the tree-built image,
      # and build-chart.yml refuses to publish a chart that cannot deploy its image.
      - name: chart-appversion-guard / The chart release-facts guard refuses its own mutations
        if: ${{ !cancelled() }}
        run: bash scripts/checks/chart-appversion.sh --self-test
      - name: chart-appversion-guard / The committed chart release facts are coherent
        if: ${{ !cancelled() }}
        run: bash scripts/checks/chart-appversion.sh

      # ---- citation-guard ----------------------------------------------
      # Citation guard: CITATION.cff must stay CFF-1.2.0-schema-valid and
      # version-consistent with the workspace — a malformed file silently breaks
      # GitHub's "Cite this repository" button, and a stale version misquotes the
      # release in research citations. The release cut bumps version +
      # date-released (.claude/rules/changelog.md §Cutting a release).
      - name: citation-guard / The runner's yq is 4.53.3 or newer
        if: ${{ !cancelled() }}
        env:
          YQ_MIN_VERSION: 4.53.3
        run: bash scripts/checks/runner-yq.sh
      - name: citation-guard / Install the pinned jsonschema-cli
        if: ${{ !cancelled() }}
        env:
          JSONSCHEMA_CLI_VERSION: 0.52.0
        run: |
          set -euo pipefail
          cargo install jsonschema-cli --version "${JSONSCHEMA_CLI_VERSION}" --locked
      - name: citation-guard / Validate CITATION.cff (CFF 1.2.0 schema)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          yq -o=json CITATION.cff > "${RUNNER_TEMP}/citation.json"
          jsonschema-cli validate .github/cff-schema/schema.json -i "${RUNNER_TEMP}/citation.json"
      # The ferroehr party statement is the published conformance claim for
      # THE product this repo ships; its product version sat at 3.6.0 while
      # the record reached 3.20.0 with nothing failing (#2576). Same
      # version-agreement family as the CITATION check below.
      - name: citation-guard / The ferroehr party statement's product version matches the workspace
        if: ${{ !cancelled() }}
        run: bash scripts/checks/statement-version.sh
      - name: citation-guard / CITATION.cff version matches the workspace version
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cff_ver=$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' CITATION.cff)
          ws_ver=$(sed -nE 's/^version = "(.*)"$/\1/p' Cargo.toml | sed -n 1p)
          if [ -z "$cff_ver" ] || [ -z "$ws_ver" ]; then
            echo "::error::could not extract versions (CITATION.cff: '$cff_ver', Cargo.toml: '$ws_ver')." >&2
            exit 1
          fi
          if [ "$cff_ver" != "$ws_ver" ]; then
            echo "::error::CITATION.cff version ($cff_ver) != workspace version ($ws_ver) — the release cut bumps CITATION.cff version/date-released (.claude/rules/changelog.md)." >&2
            exit 1
          fi
          echo "CITATION.cff version $cff_ver matches the workspace version."
      # `.zenodo.json` is GENERATED from CITATION.cff, because Zenodo ignores
      # CITATION.cff entirely whenever a .zenodo.json is present
      # (https://help.zenodo.org/docs/github/describe-software/zenodo-json/).
      # A hand-edited copy would therefore silently override the file this job
      # guards, and the disagreement would be archived under a DOI that cannot
      # be edited afterwards.
      - name: citation-guard / .zenodo.json is in sync with CITATION.cff
        if: ${{ !cancelled() }}
        run: bash scripts/render/zenodo-json.sh --check

      # The class partials of the draft openEHR modules under docs/specifications/*/antora/
      # are rendered from their BMM schemas, so a hand edit of a class table, or a
      # BMM change without its partials, fails here.
      - name: bmm-partials / The draft class partials match their BMM schemas
        if: ${{ !cancelled() }}
        run: bash scripts/render/bmm-partials.sh --check

      # ---- compose-version-guard ---------------------------------------
      # Compose version guard: the standalone quickstart docker-compose.yml pins
      # the published images by tag, so a release cut that forgets those defaults
      # ships a quickstart running the PREVIOUS release. The release cut bumps them
      # with the workspace version (.claude/rules/changelog.md §Cutting a release).
      - name: compose-version-guard / compose image-tag guard self-test
        if: ${{ !cancelled() }}
        run: bash scripts/checks/compose-image-tags.sh --self-test
      - name: compose-version-guard / compose image tags match the workspace version
        if: ${{ !cancelled() }}
        run: bash scripts/checks/compose-image-tags.sh

      # ---- ferropix-pins -----------------------------------------------
      # FerroPIX pin guard (#4392): the quickstart, the Helm chart and the hosted
      # sandbox pin one FerroPIX release by digest, and the sandbox's
      # configuration and each chart golden's ferropix.toml read under it. The
      # Dependabot entry for the quickstart pin then moves all three together.
      - name: ferropix-pins / FerroPIX pin guard self-test
        if: ${{ !cancelled() }}
        run: bash scripts/checks/ferropix-pins.sh --self-test
      - name: ferropix-pins / Every FerroPIX pin is one release, and its configurations read under it
        if: ${{ !cancelled() }}
        run: bash scripts/checks/ferropix-pins.sh

      # ---- pin-freshness -----------------------------------------------
      # The product image freshness readers over fixtures, with no network;
      # the weekly pin-freshness.yml runs them against the releases.
      - name: pin-freshness / product image freshness self-test
        if: ${{ !cancelled() }}
        run: bash scripts/checks/pin-freshness.sh --self-test

      # ---- veredictum-action -------------------------------------------
      - name: veredictum-action / Veredictum pin guard self-test
        if: ${{ !cancelled() }}
        run: bash scripts/checks/veredictum-action.sh --self-test
      - name: veredictum-action / The Action SHA, its version comment, the image digest and VEREDICTUM_VERSION agree
        if: ${{ !cancelled() }}
        run: bash scripts/checks/veredictum-action.sh

  # The whole-tree guards in one job: each guard is a step that runs
  # whatever the step before it concluded, so one run reports every
  # finding, and the job takes one runner where it took twenty-three
  # (#5286). No specification governs this: our own design.
  guards:
    name: guards
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # comment-style, control-matrix, tracker-status and error-hygiene read
          # history.
          fetch-depth: 0

      # ---- shellcheck --------------------------------------------------
      # The other half of the pair above. actionlint shellchecks the `run:` blocks
      # embedded in workflows; this lane checks the scripts they call (#2785).
      # `--severity=style` is ShellCheck's lowest floor, so everything gates: a
      # finding is fixed, or carries a per-line `# shellcheck disable=SCnnnn` with
      # its reason. There is no .shellcheckrc: nothing may turn a code off tree-wide.
      #
      # The lane is a committed script so local and CI run the identical check.
      - name: shellcheck
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: shellcheck@0.11.0
      - name: shellcheck / Every shell program is clean at severity=style
        if: ${{ !cancelled() }}
        run: bash scripts/checks/shellcheck-lane.sh
      - name: shellcheck / The guards' changed-path helper reads a branch's own change from the merge base
        if: ${{ !cancelled() }}
        run: bash scripts/lib/changed-paths.sh --self-test
      - name: shellcheck / The conformance image check compares an image's inputs with the tree's, and its lists match containers.yml
        if: ${{ !cancelled() }}
        run: bash scripts/lib/image-inputs.sh --self-test
      - name: shellcheck / The base image of each Dockerfile is read from its runtime stage's digest-pinned FROM
        if: ${{ !cancelled() }}
        run: bash scripts/lib/base-image.sh --self-test
      - name: shellcheck / The early-reader check refuses head and grep -q, -m or -l on a pipe, and allows the here-string forms
        if: ${{ !cancelled() }}
        run: bash scripts/checks/pipe-early-exit.sh --self-test
      - name: shellcheck / No workflow or shell program feeds a reader that stops early from a pipe
        if: ${{ !cancelled() }}
        run: bash scripts/checks/pipe-early-exit.sh
      - name: shellcheck / The GitHub API retry rides out a 5xx burst, blames the API when it gives up and refuses a 4xx at once
        if: ${{ !cancelled() }}
        run: bash scripts/lib/gh-retry.sh --self-test
      - name: shellcheck / The dangerous-command hook refuses and allows the shapes it documents
        if: ${{ !cancelled() }}
        run: bash .claude/hooks/block_dangerous_test.sh
      - name: shellcheck / The crate-version hook refuses a hand edit of the lockstep crate version
        if: ${{ !cancelled() }}
        run: bash .claude/hooks/crate_version_bump_guard_test.sh
      - name: shellcheck / The GHCR prune deletes nothing on a dry run and keeps young and retagged manifests
        if: ${{ !cancelled() }}
        run: bash scripts/watch/ghcr-prune-orphans.sh --self-test
      - name: shellcheck / The cache prune keeps main's newest entry of each family and expires the rest
        if: ${{ !cancelled() }}
        run: bash scripts/watch/actions-cache-prune.sh --self-test
      - name: shellcheck
        if: ${{ !cancelled() }}
        run: bash scripts/watch/spec-update.sh --self-test
      - name: shellcheck
        if: ${{ !cancelled() }}
        run: bash scripts/watch/spec-release.sh --self-test
      - name: shellcheck / The CI budget watcher's lane patterns match every form of their job names
        if: ${{ !cancelled() }}
        run: bash scripts/watch/ci-budget.sh --self-test
      - name: shellcheck / The release withdrawal refuses unregistered versions and moves only the floating tags
        if: ${{ !cancelled() }}
        run: bash scripts/release/withdraw.sh --self-test
      - name: shellcheck / The release-notes check refuses notes without the CRA user information, the support period or the pinned EHDS system documents
        if: ${{ !cancelled() }}
        run: bash scripts/checks/release-notes.sh --self-test
      - name: shellcheck / The EHDS system documents' pin reads, and a page at another revision is refused
        if: ${{ !cancelled() }}
        run: bash scripts/release/system-documents.sh --self-test
      - name: shellcheck / The attached information sheet and instructions for use carry the stamp, the frozen links and the release's facts
        if: ${{ !cancelled() }}
        run: bash scripts/release/accompanying-documents.sh --self-test
      - name: shellcheck / The EHDS system documents are refused when they name a configuration key this release refuses
        if: ${{ !cancelled() }}
        run: bash scripts/checks/ifu-config-keys.sh --self-test
      - name: shellcheck / The release milestone check refuses open items and closes only after every leg
        if: ${{ !cancelled() }}
        run: bash scripts/release/milestone.sh --self-test
      - name: shellcheck / The release rewrite of the quickstart passes its check
        if: ${{ !cancelled() }}
        run: bash scripts/release/quickstart-compose.sh --self-test
      - name: shellcheck / The release stages each default demographic definition with a checksum that verifies
        if: ${{ !cancelled() }}
        run: bash scripts/release/definition-assets.sh --self-test
      - name: shellcheck / The crate stamp writes one version into the nine manifests, their internal requirements and both locks, with or without git, and refuses an unknown crate set
        if: ${{ !cancelled() }}
        run: bash scripts/release/publish-crates.sh --self-test
      - name: shellcheck / The release plan orders tags by version and counts the support period as GNU date does
        if: ${{ !cancelled() }}
        run: bash scripts/release/plan.sh --self-test
      - name: shellcheck / The chart comparison matches a repackaged chart and refuses a changed, added or removed file
        if: ${{ !cancelled() }}
        run: bash scripts/release/chart-published.sh --self-test
      - name: shellcheck / The performance guard refuses a throughput or a p95 latency outside its budget
        if: ${{ !cancelled() }}
        run: bash scripts/perf/compare.sh --self-test
      - name: shellcheck / The perf verdict passes a breach only as a cost the owner accepted on a named issue
        if: ${{ !cancelled() }}
        run: bash scripts/perf/accepted.sh --self-test
      - name: shellcheck / The storage sizing driver reports bytes per create, update, delete and read in the shape the book's sizing section cites
        if: ${{ !cancelled() }}
        run: bash scripts/perf/storage-sizing.sh --self-test
      - name: shellcheck / The storage-bench verdict judges latency between two builds on one runner and refuses a rise the rounds separate
        if: ${{ !cancelled() }}
        run: bash scripts/render/storage-bench-compare.sh --self-test

      # ---- tracker-helpers ---------------------------------------------
      # The tracker helpers set the native issue type and the Priority and Effort
      # fields, and declare the label taxonomy (.claude/rules/issue-workflow.md).
      # Each carries a --self-test against a stub gh, so a change to the mapping
      # or to the GraphQL it speaks is caught without touching the live tracker.
      - name: tracker-helpers / fields.sh files and sets type, priority and effort
        if: ${{ !cancelled() }}
        run: bash scripts/gh/fields.sh --self-test
      - name: tracker-helpers / migrate-fields.sh maps the retired labels
        if: ${{ !cancelled() }}
        run: bash scripts/gh/migrate-fields.sh --self-test
      - name: tracker-helpers / labels.sh declares the taxonomy and retires the old labels
        if: ${{ !cancelled() }}
        run: bash scripts/gh/labels.sh --self-test

      # ---- ferroterm-index-layout --------------------------------------
      # The FerroTERM the sandbox pins must read the terminology index the box
      # carries (#3520): the v4.3.2 release's sandbox leg failed on a pin bump that
      # moved the artifact layout. The check reads LAYOUT_VERSION at the pinned
      # FerroTERM tag and compares it with deploy/hosted/ferroterm-index.env.
      - name: ferroterm-index-layout / The check refuses a differing and an unreadable layout
        if: ${{ !cancelled() }}
        run: bash scripts/checks/ferroterm-index-layout.sh --self-test
      - name: ferroterm-index-layout / The pinned FerroTERM reads the box's index layout
        if: ${{ !cancelled() }}
        run: bash scripts/checks/ferroterm-index-layout.sh

      # ---- hosted-deploy-script ----------------------------------------
      # The hosted box's deploy script lives inside deploy/hosted/cloud-init.yaml
      # as a write_files block, where no other gate reads shell (#2974); this
      # extracts and shellchecks it, and checks that docker/Dockerfile bakes every
      # posture path the script reads out of the image.
      - name: hosted-deploy-script
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: shellcheck@0.11.0
      # The seed-subject check reads privacy.subject_namespaces with the runner's
      # yq (#5409), held to the version the other yq readers are verified on.
      - name: hosted-deploy-script / The runner's yq is 4.53.3 or newer
        if: ${{ !cancelled() }}
        env:
          YQ_MIN_VERSION: 4.53.3
        run: bash scripts/checks/runner-yq.sh
      - name: hosted-deploy-script / The embedded deploy script is clean, its posture paths are baked and its seed names pseudonyms the sandbox declares
        if: ${{ !cancelled() }}
        run: bash scripts/checks/hosted-deploy-script.sh
      - name: hosted-deploy-script / The embedded deploy script's verb contract refuses a caller of a verb it lacks
        if: ${{ !cancelled() }}
        run: bash scripts/checks/hosted-deploy-script.sh --self-test
      - name: hosted-deploy-script / The FerroPIX rollout's --check pulls no image onto the app box, and it runs only at the release the sandbox serves
        if: ${{ !cancelled() }}
        run: bash deploy/hosted/sandbox-ferropix-rollout.sh --self-test
      - name: hosted-deploy-script / The verb reader reads both deploy script generations and refuses a verb the box lacks
        if: ${{ !cancelled() }}
        run: bash .github/actions/deploy-verbs/verbs.sh --self-test

      # ---- comment-style -----------------------------------------------
      # Comment-style guard (.claude/rules/comments.md, RFC 505/1574): block
      # comments, TODO(#N) form, NOTE/essay line budgets — over the WHOLE tree
      # hand-written .rs files (the legacy essay sweep #1870 closed; the step runs
      # --all).
      - name: comment-style / Comment style on changed Rust files
        if: ${{ !cancelled() }}
        run: bash scripts/checks/comment-style.sh --all

      # ---- spec-citations ----------------------------------------------
      - name: spec-citations / Every cited openEHR spec file exists
        if: ${{ !cancelled() }}
        run: bash scripts/checks/spec-citations.sh --all
      - name: spec-citations / The migration-citation detector catches what it claims to
        if: ${{ !cancelled() }}
        run: bash scripts/checks/migration-citations.sh --self-test
      - name: spec-citations / Every cited migration file exists
        if: ${{ !cancelled() }}
        run: bash scripts/checks/migration-citations.sh --all

      # ---- migration-numbering -----------------------------------------
      # Each domain's migrations are numbered 0001 to N, each number once:
      # two pull requests that each add the next number pass alone, and only
      # their merge group holds both (#5741).
      - name: migration-numbering / The numbering detector catches what it claims to
        if: ${{ !cancelled() }}
        run: bash scripts/checks/migration-numbering.sh --self-test
      - name: migration-numbering / No domain shares a migration number or skips one
        if: ${{ !cancelled() }}
        run: bash scripts/checks/migration-numbering.sh
      - name: spec-citations / The application-path detector catches what it claims to
        if: ${{ !cancelled() }}
        run: bash scripts/checks/crate-tests-read-no-app.sh --self-test
      - name: spec-citations / No test in a published crate reads the application tree
        if: ${{ !cancelled() }}
        run: bash scripts/checks/crate-tests-read-no-app.sh
      - name: spec-citations / The server-SQL detector catches what it claims to
        if: ${{ !cancelled() }}
        run: bash scripts/checks/server-holds-no-sql.sh --self-test
      - name: spec-citations / The wiring binary runs no SQL of its own
        if: ${{ !cancelled() }}
        run: bash scripts/checks/server-holds-no-sql.sh
      - name: spec-citations / The request-commit detector catches what it claims to
        if: ${{ !cancelled() }}
        run: bash scripts/checks/request-commits.sh --self-test
      - name: spec-citations / A request-scoped write commits only through the choke point
        if: ${{ !cancelled() }}
        run: bash scripts/checks/request-commits.sh
      - name: spec-citations / The country detector catches what it claims to
        if: ${{ !cancelled() }}
        run: bash scripts/checks/access-decides-no-country.sh --self-test
      - name: spec-citations / The access decision holds no rule of one country
        if: ${{ !cancelled() }}
        run: bash scripts/checks/access-decides-no-country.sh
      - name: spec-citations / The neutral-identifier detector catches what it claims to
        if: ${{ !cancelled() }}
        run: bash scripts/checks/neutral-identifiers.sh --self-test
      - name: spec-citations / Nothing FerroEHR writes or sends is named after the product
        if: ${{ !cancelled() }}
        run: bash scripts/checks/neutral-identifiers.sh

      # ---- no-python ---------------------------------------------------
      # No Python anywhere (.claude/rules/rust-style.md §No Python): the tooling
      # languages are bash and Rust. Embedded Python is the worst case — a heredoc
      # inside a command substitution makes bash scan the Python for quote pairs,
      # so one apostrophe in a comment breaks the script.
      - name: no-python / No Python invocations or sources
        if: ${{ !cancelled() }}
        run: bash scripts/checks/no-python.sh

      # ---- spdx-headers-text -------------------------------------------
      # This project's own code is BUSL-1.1, so a GPL-family or SSPL grant inside a file
      # we wrote is a licence conflict.
      # LICENSE, REUSE.toml and the codegen header constant must agree on the
      # copyright holder. They did not, and nothing compared them (#2325).
      # Shell, SQL and YAML carry their licence in the file too, so a copied
      # migration or script travels with it (#2326).
      - name: spdx-headers-text / Shell, SQL and YAML state their licensing
        if: ${{ !cancelled() }}
        run: bash scripts/checks/spdx-headers-text.sh

      # ---- law-corpus --------------------------------------------------
      # The vendored legal texts are only worth carrying while their recorded
      # digests are true: docs/law/ exists so a compliance claim resolves to a
      # fixed referent instead of to whatever a publisher's page says today, and a
      # hand edit or a partial re-fetch is otherwise invisible.
      - name: law-corpus / Vendored legal texts match their recorded digests
        if: ${{ !cancelled() }}
        run: bash scripts/checks/law-corpus.sh
      # The identity and provisioning documents under docs/specs/ are pinned by
      # sha256 per file in the same way, so the same job holds them to it.
      - name: law-corpus / Vendored identity documents match their recorded digests
        if: ${{ !cancelled() }}
        run: bash scripts/checks/pinned-docs.sh
      # A FHIR package manifest has the npm package.json shape, and the FHIR
      # packages it depends on are squatted on npm (GHSA-qg8x-2hq5-hwf3,
      # #5337), so no committed package.json may be one or name one.
      - name: law-corpus / No committed package.json names a FHIR package
        if: ${{ !cancelled() }}
        run: |
          bash scripts/checks/fhir-package-manifests.sh --self-test
          bash scripts/checks/fhir-package-manifests.sh

      # ---- copyright-holder --------------------------------------------
      - name: copyright-holder / One copyright holder, stated identically everywhere
        if: ${{ !cancelled() }}
        run: bash scripts/checks/copyright-holder.sh

      # ---- license-text ------------------------------------------------
      - name: license-text / No copyleft licence text in first-party source
        if: ${{ !cancelled() }}
        run: bash scripts/checks/first-party-license-text.sh

      # ---- licensing ---------------------------------------------------
      # REUSE 3.3 compliance: every file in the tree has machine-readable licensing
      # that SURVIVES the file being copied out of it — which is the expected case
      # for a repository whose premise is that people build on it and ship it, and
      # which redistributes material under six distinct licences.
      #
      # The per-tree `PROVENANCE.md` arrangement is accurate but travels with the
      # tree, not with the file. `REUSE.toml` closes that gap by glob, touching no
      # vendored file — which matters, because hand-editing vendored material is
      # forbidden here.
      - name: licensing / reuse lint
        if: ${{ !cancelled() }}
        # The OFFICIAL image, digest-pinned — the same construction the
        # actionlint job uses and for the same reasons: `reuse` is distributed
        # as a Python package, which this repository does not install, and the
        # published container is the one distribution that needs neither a
        # Python toolchain in CI nor an unpinned installer script.
        run: |
          docker run --rm \
            -v "$PWD:/data" --workdir /data \
            fsfe/reuse:6.2.0@sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e \
            lint
      # `reuse lint` proves the declarations are COMPLETE. It cannot know that
      # this project also publishes a human-readable licensing chapter, which is
      # what a procurement reviewer actually reads and what drifts.
      # The runner image's yq, held to the oldest version the scripts are
      # verified on; no per-run download (#5256).
      - name: licensing / The runner's yq is 4.53.3 or newer
        if: ${{ !cancelled() }}
        env:
          YQ_MIN_VERSION: 4.53.3
        run: bash scripts/checks/runner-yq.sh
      - name: licensing / The declarations, the texts and the chapter agree
        if: ${{ !cancelled() }}
        run: bash scripts/checks/licensing-declarations.sh
      # The six Apache-2.0 crates publish so any project can take them; a
      # normal or build dependency on one of the three BUSL-1.1 crates would
      # make every consumer compile BUSL code. The self-test runs first, so a
      # detector that stopped matching fails here instead of passing vacuously.
      - name: licensing / The licence-boundary detector refuses every crossing
        if: ${{ !cancelled() }}
        run: bash scripts/checks/licence-boundary.sh --self-test
      - name: licensing / No Apache-2.0 crate depends on a BUSL-1.1 crate
        if: ${{ !cancelled() }}
        run: bash scripts/checks/licence-boundary.sh
      # `reuse lint` is satisfied by the glob declaration alone, so it cannot
      # see a first-party file losing the header that makes its licensing
      # travel. This is the check that can.
      - name: licensing / First-party Rust source carries its SPDX header
        if: ${{ !cancelled() }}
        run: bash scripts/checks/spdx-headers.sh
      # A vendored tree's PROVENANCE.md is the repository's record and does not
      # travel with the package built from it. This is the check that the
      # attribution INSIDE a published crate still names the revision the
      # repository vendors.
      - name: licensing / Packaged third-party bytes carry a pinned attribution
        if: ${{ !cancelled() }}
        run: bash scripts/checks/packaged-attribution.sh
      # `cargo package --list` needs the pinned toolchain; the two packaging
      # guards are the only cargo consumers in this job. No rust-cache: its
      # entries are keyed by job and only main may save one, and this job never
      # runs on main, so there is no entry to restore (#4601).
      - name: licensing / Packaged sources embed only packaged files
        if: ${{ !cancelled() }}
        run: bash scripts/checks/packaged-includes.sh

      # ---- compose-hardening -------------------------------------------
      # The compose hardening properties (cap_drop ALL, no-new-privileges, no
      # privileged, no seccomp=unconfined, loopback-only publishing). This gate
      # existed and ran nowhere, while `docker-compose.yml` and the operations
      # chapter both told readers it "enforces that on every compose artifact" — a
      # documented guard that does not fire is worse than none, because the docs and
      # the reviewer both believe it did.
      - name: compose-hardening / Compose artifacts stay hardened
        if: ${{ !cancelled() }}
        run: bash scripts/checks/compose-hardening.sh
      - name: compose-hardening / Compose drops no !reset key the guard depends on, and the check refuses a merged model that holds one
        if: ${{ !cancelled() }}
        run: bash scripts/checks/compose-reset.sh --self-test
      - name: compose-hardening / Every key a compose overlay resets is absent from the stack its launcher merges
        if: ${{ !cancelled() }}
        run: bash scripts/checks/compose-reset.sh
      - name: compose-hardening / The overlay's inline dashboard matches the chart's canonical copy
        if: ${{ !cancelled() }}
        run: bash scripts/checks/dashboard-drift.sh
      # The shipped default sends a usage report; a test instance must not.
      - name: compose-hardening / The launcher detector catches an unswitched launcher
        if: ${{ !cancelled() }}
        run: bash scripts/checks/usage-report-off.sh --self-test
      - name: compose-hardening / Every test launcher switches the usage report off
        if: ${{ !cancelled() }}
        run: bash scripts/checks/usage-report-off.sh
      - name: compose-hardening / The EUR-Lex watcher's detector reports a new act and fails on a silent source
        if: ${{ !cancelled() }}
        run: bash scripts/watch/eu-acts.sh --self-test
      - name: compose-hardening / The watcher issue engine dedups by whole key and files the rest
        if: ${{ !cancelled() }}
        run: bash .github/actions/file-watcher-issue/file-issue.sh self-test

      # ---- terminology-seed-drift --------------------------------------
      # The shaped terminology seed has one canonical directory and one copy inside
      # the Helm chart (a chart's `.Files` reaches only what is packaged with it),
      # so the two are held byte-identical the way the dashboard's two copies are.
      - name: terminology-seed-drift / The chart's terminology seed matches the canonical one
        if: ${{ !cancelled() }}
        run: bash scripts/checks/terminology-seed-drift.sh

      # ---- error-source-chain ------------------------------------------
      # RFC 0201: an error carries its cause, and prints it once. No clippy lint
      # covers either, so the gate is a per-tree ratchet on flattened causes (the
      # counts may only fall) and a hard zero on variants that print their source
      # in their own message (that detector proves itself with a self-test first).
      - name: error-source-chain / Error cause chains have not regressed
        if: ${{ !cancelled() }}
        run: bash scripts/checks/error-source-chain.sh

      # ---- default-style -----------------------------------------------
      # Default-value style (.claude/rules/rust-style.md §Default values): a field's
      # default lives inline in its struct's `Default` impl — the RFC 3681 shape,
      # hand-written because that syntax is nightly-only.
      #
      # CHANGED-FILES mode until the pre-existing set is swept (#2033): the rule
      # arrived after the tree, so a `--all` gate would fail every PR for violations
      # it did not introduce. This blocks NEW ones from the moment it lands, and the
      # sweep issue flips the argument to `--all` (which additionally enables the
      # single-reader `const` check — that one counts readers tree-wide).
      - name: default-style / Default values live in the struct's Default impl
        if: ${{ !cancelled() }}
        run: bash scripts/checks/default-style.sh --all
      # Typed-status guard: an HTTP status is compared as a `StatusCode`, never
      # as a number. `--all` from the start — the tree has no violations.
      - name: default-style / HTTP statuses are compared as types
        if: ${{ !cancelled() }}
        run: bash scripts/checks/typed-status.sh --all
      # Access-layer provenance (#1963): every rationale in the authn/authz layer
      # cites an RFC, a standards publication, or the vendored openEHR text —
      # never another product, a plan-phase marker, or internal markdown.
      - name: default-style / Access-layer rationale cites durable sources
        if: ${{ !cancelled() }}
        run: bash scripts/checks/access-provenance.sh

      # ---- e2e-waits ---------------------------------------------------
      # E2E wait guard (#3296): a browser journey holds the bounded
      # `common::Element`, never a raw `WebElement`/`SelectElement`, and waits on a
      # condition rather than on a timer. The guard's scope is fixed (every journey
      # file, always) — the migration that landed it swept all 26, so the tree is
      # clean. The detector is mutation-proven by its own `--self-test`, which runs
      # first, so a pattern that silently matched nothing would fail the job rather
      # than report OK.
      - name: e2e-waits / The detector catches what it claims to catch
        if: ${{ !cancelled() }}
        run: bash scripts/checks/e2e-waits.sh --self-test
      - name: e2e-waits / E2E journeys wait on conditions through the bounded harness
        if: ${{ !cancelled() }}
        run: bash scripts/checks/e2e-waits.sh

      # ---- docs-claims -------------------------------------------------
      # Docs-claim guard (#1984): a documented KEY must exist in the thing it
      # documents. `mdbook-lint` checks style and `lychee` checks links; both pass on
      # a page whose every technical claim is false, which is how a fabricated Helm
      # values table reached the published site. `--all` from the start: the three
      # defects this found on its first run are fixed in the same change, so the
      # corpus is clean. What it deliberately does NOT check is recorded in the
      # script's header and in `.claude/rules/docs-website.md`.
      - name: docs-claims / Documented keys resolve in their source
        if: ${{ !cancelled() }}
        run: bash scripts/checks/docs-claims.sh --all

      # ---- readme-quickstart -------------------------------------------
      # The README's quick start is the anchored steps of docker/smoke-test.sh,
      # which the containers workflow runs against the standalone
      # docker-compose.yml; the guard refuses a README copy that drifts.
      - name: readme-quickstart / The guard refuses each drift it claims to
        if: ${{ !cancelled() }}
        run: bash scripts/checks/readme-quickstart.sh --self-test
      - name: readme-quickstart / The README shows the quick start CI runs
        if: ${{ !cancelled() }}
        run: bash scripts/checks/readme-quickstart.sh
      # Image metadata (#2146): the OCI keys are declared in two places — the
      # Dockerfile, so a direct build is labelled correctly, and the publishing
      # workflow, whose repo-derived defaults are wrong for a repo shipping three
      # images. Two declarations of one fact drift; this fails instead. It also
      # refuses a written base.name/base.digest, which build-image.yml reads
      # from the runtime stage's FROM pin (#4953), and checks that annotations
      # reach the INDEX (the only place GHCR reads a
      # package description from).
      - name: docs-claims / Image metadata is declared once and agrees
        if: ${{ !cancelled() }}
        run: bash scripts/checks/image-labels.sh

      # ---- ehds-badges -------------------------------------------------
      # The README's EHDS badges are endpoint documents counted from the
      # book's evidence tables (#6537): a table that moves without its
      # document, or a badge that claims certification, fails here.
      - name: ehds-badges / The counting and the word guard hold on their fixtures
        if: ${{ !cancelled() }}
        run: bash scripts/render/ehds-badges.sh --self-test
      - name: ehds-badges / Each EHDS badge matches its table and claims no certification
        if: ${{ !cancelled() }}
        run: bash scripts/render/ehds-badges.sh --check

      # ---- post-quantum ------------------------------------------------
      # The post-quantum inventory (#6602): conformance/post-quantum.tsv in its
      # five columns with every location it names in the tree, the table of
      # docs/post-quantum.md and the README badge counted from it.
      - name: post-quantum / The inventory rules hold on their fixtures
        if: ${{ !cancelled() }}
        run: bash scripts/render/post-quantum.sh --self-test
      - name: post-quantum / The table and the badge match the inventory, and the badge claims no certification
        if: ${{ !cancelled() }}
        run: bash scripts/render/post-quantum.sh --check

      # ---- control-matrix ----------------------------------------------
      # The published compliance control matrix is GENERATED from the tracker
      # (scripts/render/control-matrix.sh), the same way the conformance pages
      # regenerate from the committed artifacts: a control's status lives on its
      # issue, never in the page.
      #
      # The job judges the change under check alone (#4130). The tracker moves
      # without a commit, so a full re-render would fail every open pull request
      # on rows none of them caused. `--base HEAD^1` renders the page from one
      # tracker read without and with the pull request and holds the change from
      # the first parent to the rows it owns: the issues it closes, and any line
      # it adds or removes. The first parent of the checked-out commit is main
      # for a pull request (its merge ref) and the queue entry ahead of it in a
      # merge group, so fetch-depth 2 reaches it. Main's drift reaches the site
      # through the docs deploy, which renders the page from the tracker.
      #
      # The page reads nothing but the tracker: open controls render as Planned
      # and the roadmap board is linked for the live column, so the repository
      # token is enough to render and to check it (#3236). A board read would need
      # a Projects (v2) scope, which only a standing personal access token carries.
      - name: control-matrix / The delta rules hold on their fixtures
        if: ${{ !cancelled() }}
        run: bash scripts/render/control-matrix.sh --self-test
      - name: control-matrix / The control matrix carries this change's own rows
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          # The pull request under check: the issues it closes render as
          # Shipped with it, so the PR that closes a control commits the page
          # main will carry after the merge (#3253). A merge group names its
          # pull request in its head ref, `gh-readonly-queue/<base>/pr-<n>-<sha>`.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          pr="$PR_NUMBER"
          if [ -z "$pr" ]; then
            pr="$(printf '%s\n' "$QUEUE_REF" | sed -n 's|.*/pr-\([0-9][0-9]*\)-[0-9a-f]*$|\1|p')"
          fi
          if [ -z "$pr" ]; then
            echo "::error::No pull request number in the event (merge group head ref: '$QUEUE_REF')"
            exit 1
          fi
          bash scripts/render/control-matrix.sh --check --closing "$pr" --base HEAD^1

      # ---- tracker-status ----------------------------------------------
      # The prose AROUND the generated pages can go stale where the pages cannot:
      # after the v4.2.0 cut the compliance overview still said "guidance planned,
      # #3161" about pages that release had published (#3289). This job reads every
      # issue reference on the book's pages and in the EHDS status source, fetches
      # the states in one call, and fails when a status word beside a reference
      # contradicts the tracker. Same token footprint as control-matrix.
      - name: tracker-status / No book page says planned about a closed issue, or shipped about an open one
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # The issues this PR closes count as closed. `--closing` reads the
          # body through the API, so a re-run by pr-guards.yml sees the
          # description as it is then (#3948). A merge group has no body of
          # its own: the issues every pull request in the group closes count
          # as closed, read from the squash commits' `(#N)` between main and
          # its head. A queued entry's base_sha is the head of the entry ahead
          # of it, so main (where the group forked) is the base, which also
          # counts the pull requests queued ahead.
          PR: ${{ github.event.pull_request.number }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR}" ]; then
            bash scripts/checks/tracker-status.sh --closing "${PR}"
          elif [ -n "${GROUP_BASE}" ] && [ -n "${GROUP_HEAD}" ]; then
            base="$(git merge-base origin/main "${GROUP_HEAD}" 2>/dev/null || printf '%s' "${GROUP_BASE}")"
            prs="$(git log --format=%s "${base}..${GROUP_HEAD}" | grep -oE '[(]#[0-9]+[)]$' | grep -oE '[0-9]+' | sort -u || true)"
            PR_BODY=""
            for n in $prs; do
              PR_BODY+="$(gh pr view "$n" --json body --jq .body)"$'\n'
            done
            echo "tracker-status: the merge group lands $(printf '%s' "${prs}" | tr '\n' ',')"
            PR_BODY="$PR_BODY" bash scripts/checks/tracker-status.sh
          else
            bash scripts/checks/tracker-status.sh
          fi

      # ---- sql-string-building -----------------------------------------
      # String-built-SQL guard: the AQL engine composes SQL from attacker-supplied
      # query text, so a `format!`/`push_str`-assembled clause in `app/ferroehr/src/
      # aql/` or `app/ferroehr/src/storage/` is refused — the OWASP SQL Injection
      # Prevention Cheat Sheet's "validated data is not necessarily safe to insert
      # into SQL queries via string building". `--all` from the start: the tree is
      # clean, and the one legitimate site is a named exemption in the script.
      - name: sql-string-building / The exemption list honours a needle with spaces
        if: ${{ !cancelled() }}
        run: bash scripts/checks/sql-string-building.sh --self-test
      - name: sql-string-building / No string-built SQL in the query engine
        if: ${{ !cancelled() }}
        run: bash scripts/checks/sql-string-building.sh --all

      # ---- error-hygiene -----------------------------------------------
      - name: error-hygiene / No internal detail in a 5xx body or a health detail
        if: ${{ !cancelled() }}
        run: bash scripts/checks/error-hygiene.sh

      # ---- vex ---------------------------------------------------------
      # The published VEX document must be exactly what `deny.toml` plus the prose
      # file generate. Every advisory the gate ACCEPTS carries a machine-readable
      # justification a downstream scanner can ingest — otherwise the argument
      # exists only in a TOML comment nobody downstream reads, and a hospital's
      # scanner sees unexplained findings on a clinical artifact.
      #
      # Ungated on `changes.code`: `deny.toml` is in the code allowlist, but the
      # prose file and the generator are not, and a prose-only edit must still be
      # checked.
      - name: vex / The runner's yq is 4.53.3 or newer
        if: ${{ !cancelled() }}
        env:
          YQ_MIN_VERSION: 4.53.3
        run: bash scripts/checks/runner-yq.sh
      - name: vex / Every accepted advisory has a published VEX justification
        if: ${{ !cancelled() }}
        run: bash scripts/checks/vex-advisories.sh
      # The release pipeline's exploitability-record gate, proven on synthetic
      # input here so a broken detector is caught before a release depends on it.
      - name: vex / The exploitability-record detector refuses what it claims to
        if: ${{ !cancelled() }}
        run: bash scripts/checks/vex-coverage.sh --self-test
      - name: vex / OS VEX linkage detector self-test
        if: ${{ !cancelled() }}
        run: bash scripts/checks/vex-linkage.sh --self-test
      # The check that trivy applies each judgement (#5153), on a planted statement.
      - name: vex / The applied-judgement detector names a judgement trivy left in place
        if: ${{ !cancelled() }}
        run: bash scripts/security/vex-applied.sh --self-test

  # ── Always required: supply-chain policy ────────────────────────────────────
  # cargo-deny alone: `cargo deny check` reads the SAME RustSec advisory DB as
  # cargo-audit and additionally enforces yanked = "deny" (deny.toml
  # [advisories]), licenses, bans, and sources — a separate cargo-audit job
  # would be a strict subset run twice (embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html).
  # Cargo.lock IS committed (workspace ships a binary); deny checks the real pins.
  deny:
    name: cargo-deny
    needs: changes
    # `vex` because this job is where the two VEX gates run (#2370);
    # `workflows` because its recipe — those two extra steps — is authored
    # here (#2373).
    if: (needs.changes.outputs.code == 'true' || needs.changes.outputs.vex == 'true' || needs.changes.outputs.workflows == 'true') && (needs.changes.outputs.queue_verified != 'true' || contains(fromJSON(needs.changes.outputs.cache_refresh), 'deny'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny
      - run: cargo deny check
      # The mirror of the check above: an `ignore` entry that outlived its
      # finding. cargo-deny reports it as a WARNING, so the step above stays
      # green on one; this promotes it to an error. It runs HERE because
      # cargo-deny and the toolchain are already installed in this job.
      - name: No exception for an advisory that no longer fires
        run: bash scripts/checks/advisory-exceptions.sh
      # The third failure mode, which neither of the two above can see: an
      # exception whose PUBLISHED ARGUMENT names the wrong dependency path (the
      # `rsa` statement claimed the crate was reached only through
      # openidconnect, with `pgp` in the graph all along). Also here because the
      # graph is only resolvable where cargo is installed — and it needs no TOML
      # reader, reading the generated document the `vex` job pins to the prose.
      - name: Every VEX statement names the real dependency path
        run: bash scripts/checks/vex-reachability.sh

  clippy:
    name: clippy
    needs: changes
    # The lane below is this file's own recipe, so a change to it runs it
    # (#2373).
    if: github.event_name != 'merge_group' && (needs.changes.outputs.rust == 'true' && (needs.changes.outputs.queue_verified != 'true' || contains(fromJSON(needs.changes.outputs.cache_refresh), 'clippy')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-cache (not sccache) is load-bearing here: sccache cannot cache
      # clippy-driver invocations (mozilla/sccache#539), so the restored
      # target dir is the only compile cache clippy gets.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # The viewer is one server-rendered crate with no feature of its own
      # (FerroUI 0.6), so the workspace lane covers it. `--locked`: CI must
      # fail on new commits only, never on registry drift
      # (https://doc.rust-lang.org/cargo/faq.html#why-have-cargolock-in-version-control).
      - name: clippy over the reached packages
        env:
          PACKAGES: ${{ needs.changes.outputs.all_args }}
        run: |
          set -euo pipefail
          read -r -a packages <<<"$PACKAGES"
          cargo clippy --locked "${packages[@]}" --all-targets --all-features -- -D warnings

  # ── Rustdoc: intra-doc links + doc lints are inert unless rustdoc runs ──────
  # [workspace.lints.rustdoc] levels apply to every `cargo doc`; the -D
  # warnings env additionally promotes the warn-tier doc lints in CI
  # (https://doc.rust-lang.org/rustdoc/lints.html).
  doc:
    name: rustdoc
    needs: changes
    # The reached packages (#6519); a push the merge queue verified skips it.
    if: github.event_name != 'merge_group' && (needs.changes.outputs.rust == 'true' && needs.changes.outputs.queue_verified != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache of its own: it restores clippy's entry read-only, whose
      # dependency metadata rustdoc reads (#6388). RUSTDOCFLAGS stays on the
      # steps, since rust-cache hashes every RUST* variable into its key.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-shared-key: clippy
          cache-save-if: false
      # --document-private-items on both runs: stale intra-doc links can hide
      # behind non-pub items the public build never evaluates (#1838).
      - name: rustdoc over the reached packages
        env:
          RUSTDOCFLAGS: -D warnings
          PACKAGES: ${{ needs.changes.outputs.all_args }}
        run: |
          set -euo pipefail
          read -r -a packages <<<"$PACKAGES"
          cargo doc --locked "${packages[@]}" --all-features --no-deps --document-private-items
      # Doc tests live HERE, not in the pg19 test job: nextest cannot run
      # doctests, so `cargo test --doc` is its own compile (default features —
      # doctests document what a default consumer gets), and this job is ~1/10
      # the length of the test job, so the extra configuration rides the short
      # lane instead of the critical path. No DB: doctests are examples, never
      # integration tests.
      - name: doc tests of the reached packages
        env:
          RUSTDOCFLAGS: -D warnings
          PACKAGES: ${{ needs.changes.outputs.all_args }}
        run: |
          set -euo pipefail
          read -r -a packages <<<"$PACKAGES"
          cargo test --locked "${packages[@]}" --doc

  # ── Generated code must stay in sync with the vendored specs ──
  codegen-drift:
    name: codegen drift
    needs: changes
    if: github.event_name != 'merge_group' && (needs.changes.outputs.code == 'true' && (needs.changes.outputs.queue_verified != 'true' || contains(fromJSON(needs.changes.outputs.cache_refresh), 'codegen-drift')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          # sccache holds the compiled crates when its bucket exists (#6521).
          cache-targets: ${{ vars.SCCACHE_BUCKET == '' }}
          components: rustfmt
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/sccache # zizmor: ignore[self-repository] actionlint 1.7.12 refuses the $/ form (rhysd/actionlint#711)
        with:
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key-id: ${{ github.event_name == 'pull_request' && secrets.SCCACHE_RO_ACCESS_KEY_ID || secrets.SCCACHE_RW_ACCESS_KEY_ID }}
          secret-access-key: ${{ github.event_name == 'pull_request' && secrets.SCCACHE_RO_SECRET_ACCESS_KEY || secrets.SCCACHE_RW_SECRET_ACCESS_KEY }}
          read-only: ${{ github.event_name == 'pull_request' }}
      - name: The drift check reads exactly the generated files, hand-written siblings excluded
        run: bash scripts/checks/codegen-drift.sh --self-test
      - name: Regenerate and diff
        run: bash scripts/checks/codegen-drift.sh
      # The configuration reference page, the reference TOML and the shipped
      # default ferroehr.toml are generated from the configuration types (#5316).
      - name: The configuration reference matches the configuration types
        run: bash scripts/checks/config-reference.sh
      # The committed codegen inputs reproduce byte-identically from their
      # pinned upstream commits (vendored-corpora.md; fetched over https).
      - name: Codegen inputs match their pins
        run: bash scripts/vendor/codegen-inputs.sh --check

  # The RM readers' one nesting limit read at the limit on the smallest
  # RM-reading stack in a RELEASE build (#5997); the `test` lane runs the same
  # test in a debug build. One test, so the release compile stays small.
  nesting-release:
    name: nesting limit (release)
    needs: changes
    if: github.event_name != 'merge_group' && ((contains(format(' {0} ', needs.changes.outputs.runs), ' openehr-its ') || needs.changes.outputs.workflows == 'true') && needs.changes.outputs.queue_verified != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        # A release-profile lane keeps no cache of its own: it restores main's
        # `build-tests` entry for the registry and writes nothing (#6388).
        with:
          # sccache holds the compiled crates when its bucket exists (#6521).
          cache-targets: ${{ vars.SCCACHE_BUCKET == '' }}
          cache-shared-key: build-tests
          cache-save-if: false
      - uses: ./.github/actions/sccache # zizmor: ignore[self-repository] actionlint 1.7.12 refuses the $/ form (rhysd/actionlint#711)
        with:
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key-id: ${{ github.event_name == 'pull_request' && secrets.SCCACHE_RO_ACCESS_KEY_ID || secrets.SCCACHE_RW_ACCESS_KEY_ID }}
          secret-access-key: ${{ github.event_name == 'pull_request' && secrets.SCCACHE_RO_SECRET_ACCESS_KEY || secrets.SCCACHE_RW_SECRET_ACCESS_KEY }}
          read-only: ${{ github.event_name == 'pull_request' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - name: Read a document at the nesting limit on the smallest stack, release
        run: cargo nextest run --locked --release -p openehr-its --all-features -E 'test(nesting_limit)'

  # ── One test build, then the tests against PostgreSQL 19.0 in shards ────────
  # build-tests compiles the workspace's tests once, the viewer excluded (it
  # has its own job), and writes their nextest archive. Each shard runs its
  # partition of that archive and compiles nothing
  # (https://nexte.st/docs/ci-features/archiving/, #6516), so the shard count
  # buys wall clock at about a minute of setup a shard. A verified push builds
  # alone, for main's cache.
  build-tests:
    name: build tests
    needs: changes
    if: needs.changes.outputs.server == 'true' && (needs.changes.outputs.queue_verified != 'true' || contains(fromJSON(needs.changes.outputs.cache_refresh), 'build-tests'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          # sccache holds the compiled crates when its bucket exists (#6521).
          cache-targets: ${{ vars.SCCACHE_BUCKET == '' }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/sccache # zizmor: ignore[self-repository] actionlint 1.7.12 refuses the $/ form (rhysd/actionlint#711)
        with:
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key-id: ${{ github.event_name == 'pull_request' && secrets.SCCACHE_RO_ACCESS_KEY_ID || secrets.SCCACHE_RW_ACCESS_KEY_ID }}
          secret-access-key: ${{ github.event_name == 'pull_request' && secrets.SCCACHE_RO_SECRET_ACCESS_KEY || secrets.SCCACHE_RW_SECRET_ACCESS_KEY }}
          read-only: ${{ github.event_name == 'pull_request' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - name: The vendor cache uses a held file at its pin with no download and refuses one off it
        run: bash scripts/vendor/lib/pinned.sh --self-test
      - name: Build the tests (a verified push writes the cache alone)
        if: needs.changes.outputs.queue_verified == 'true'
        env:
          PACKAGES: ${{ needs.changes.outputs.cargo_args }}
        run: |
          set -euo pipefail
          read -r -a packages <<<"$PACKAGES"
          cargo nextest run --locked "${packages[@]}" --all-features --no-run
      - name: Archive the tests
        if: needs.changes.outputs.queue_verified != 'true'
        env:
          PACKAGES: ${{ needs.changes.outputs.cargo_args }}
        run: |
          set -euo pipefail
          read -r -a packages <<<"$PACKAGES"
          cargo nextest archive --locked "${packages[@]}" --all-features --archive-file "$RUNNER_TEMP/tests.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.queue_verified != 'true'
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/tests.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Each shard gets its own PostgreSQL service, which makes the split safe: the
  # testkit harness clones a template database per test. Hash partitioning keeps
  # a slow suite from landing in one shard
  # (https://nexte.st/docs/ci-features/partitioning/). The archive extracts
  # into the checkout, so the bin paths `env!("CARGO_BIN_EXE_…")` baked at the
  # build resolve.
  test:
    name: test (pg19) ${{ matrix.shard }}/${{ needs.changes.outputs.test_shard_count }}
    needs: [changes, build-tests]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.test_shards) }}
    if: github.event_name != 'merge_group' && (needs.changes.outputs.server == 'true' && needs.changes.outputs.queue_verified != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # the CI PostgreSQL image on GHCR
    services:
      postgres:
        image: ${{ needs.changes.outputs.postgres_image }} # zizmor: ignore[unpinned-images] docker/ci-postgres/image.ref, checked name@sha256 where it is read
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: openehr
          POSTGRES_PASSWORD: openehr
          POSTGRES_DB: openehr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U openehr"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openehr:openehr@localhost:5432/openehr_test
      # The shared test-database harness (tools/testkit) uses this server
      # directly, with no per-test containers in CI.
      FERROEHR_TEST_PG_URL: postgres://openehr:openehr@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # xmllint is what the C14N XML parity gate shells out to (serialization.md).
      - name: xmllint
        run: command -v xmllint >/dev/null || { sudo apt-get update && sudo apt-get install -y libxml2-utils; }
      # The toolchain without a cache: the codegen drift tests run rustfmt.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: rustfmt
          cache: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      # The shard index reaches the command through `env:`, never interpolated
      # into the script (the workflow-security rule in reliability.md).
      - run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/tests.tar.zst" --workspace-remap "$GITHUB_WORKSPACE" --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --no-tests=pass --profile ci --partition "hash:${SHARD}/${SHARD_COUNT}"
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.changes.outputs.test_shard_count }}

  # ── The merge group's smoke set (owner ruling 2026-11-25, #6516) ──────────────
  # The pull request ran the whole suite, so a merge group proves only that the
  # merged tree builds, links and passes its unit tests and the server's wiring
  # tests: every library and bin test target, and ferroehr-server's, from the
  # same archive, about a minute of tests. The full shards, perf, the CPU
  # budget, the browser lanes, conformance and the deployment harness run on
  # the pull request and nightly (docs/ci-cd.md).
  smoke:
    name: smoke (merge group)
    needs: [changes, build-tests]
    if: github.event_name == 'merge_group' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # the CI PostgreSQL image on GHCR
    services:
      postgres:
        image: ${{ needs.changes.outputs.postgres_image }} # zizmor: ignore[unpinned-images] docker/ci-postgres/image.ref, checked name@sha256 where it is read
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: openehr
          POSTGRES_PASSWORD: openehr
          POSTGRES_DB: openehr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U openehr"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openehr:openehr@localhost:5432/openehr_test
      # The shared test-database harness (tools/testkit) uses this server
      # directly, with no per-test containers in CI.
      FERROEHR_TEST_PG_URL: postgres://openehr:openehr@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # xmllint is what the C14N XML parity gate shells out to (serialization.md).
      - name: xmllint
        run: command -v xmllint >/dev/null || { sudo apt-get update && sudo apt-get install -y libxml2-utils; }
      # The toolchain without a cache: the codegen drift tests run rustfmt.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: rustfmt
          cache: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      - run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/tests.tar.zst" --workspace-remap "$GITHUB_WORKSPACE" --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --no-tests=pass --profile ci -E 'kind(lib) | kind(bin) | package(ferroehr-server)'



  # ── Every workspace BIN links here ──────────────────────────────────────────
  # `cargo clippy` type-checks but never links, and nextest compiles test
  # targets only, so without this a broken bin reaches main. Beside
  # build-tests, so the shards wait on the test build alone.
  build:
    name: build (link every bin)
    needs: changes
    if: needs.changes.outputs.server == 'true' && (needs.changes.outputs.queue_verified != 'true' || contains(fromJSON(needs.changes.outputs.cache_refresh), 'build'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          # sccache holds the compiled crates when its bucket exists (#6521).
          cache-targets: ${{ vars.SCCACHE_BUCKET == '' }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/sccache # zizmor: ignore[self-repository] actionlint 1.7.12 refuses the $/ form (rhysd/actionlint#711)
        with:
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key-id: ${{ github.event_name == 'pull_request' && secrets.SCCACHE_RO_ACCESS_KEY_ID || secrets.SCCACHE_RW_ACCESS_KEY_ID }}
          secret-access-key: ${{ github.event_name == 'pull_request' && secrets.SCCACHE_RO_SECRET_ACCESS_KEY || secrets.SCCACHE_RW_SECRET_ACCESS_KEY }}
          read-only: ${{ github.event_name == 'pull_request' }}
      - name: Link the reached packages' bins
        env:
          PACKAGES: ${{ needs.changes.outputs.cargo_args }}
        run: |
          set -euo pipefail
          read -r -a packages <<<"$PACKAGES"
          cargo build --locked "${packages[@]}" --all-features

  # ── CPU instructions of the codec micro-paths ──────────────────────────────
  # The canonical JSON and XML parse and render of the lab and IPS
  # compositions, each counted by callgrind (deterministic, unlike a timing)
  # and held to perf/instructions.ceilings (#6007). Its own job, beside the
  # shards, so the release build and valgrind never slow the main lanes.
  instructions:
    name: codec instructions (callgrind)
    needs: changes
    if: github.event_name != 'merge_group' && ((contains(format(' {0} ', needs.changes.outputs.runs), ' openehr-its ') || needs.changes.outputs.instructions == 'true' || needs.changes.outputs.workflows == 'true') && needs.changes.outputs.queue_verified != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        # A release-profile lane keeps no cache of its own: it restores main's
        # `build-tests` entry for the registry and writes nothing (#6388).
        with:
          # sccache holds the compiled crates when its bucket exists (#6521).
          cache-targets: ${{ vars.SCCACHE_BUCKET == '' }}
          cache-shared-key: build-tests
          cache-save-if: false
      - uses: ./.github/actions/sccache # zizmor: ignore[self-repository] actionlint 1.7.12 refuses the $/ form (rhysd/actionlint#711)
        with:
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key-id: ${{ github.event_name == 'pull_request' && secrets.SCCACHE_RO_ACCESS_KEY_ID || secrets.SCCACHE_RW_ACCESS_KEY_ID }}
          secret-access-key: ${{ github.event_name == 'pull_request' && secrets.SCCACHE_RO_SECRET_ACCESS_KEY || secrets.SCCACHE_RW_SECRET_ACCESS_KEY }}
          read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: bash scripts/perf/instructions.sh

  # ── The viewer's own build + unit tests ────────────────────────────────────
  # The viewer links none of the CDR's application crates, so it shares
  # little build cache with them. It needs no database.
  test-viewer:
    name: build & test (viewer)
    needs: changes
    if: github.event_name != 'merge_group' && (needs.changes.outputs.viewer_crate == 'true' && (needs.changes.outputs.queue_verified != 'true' || contains(fromJSON(needs.changes.outputs.cache_refresh), 'test-viewer')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          # sccache holds the compiled crates when its bucket exists (#6521).
          cache-targets: ${{ vars.SCCACHE_BUCKET == '' }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/sccache # zizmor: ignore[self-repository] actionlint 1.7.12 refuses the $/ form (rhysd/actionlint#711)
        with:
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key-id: ${{ github.event_name == 'pull_request' && secrets.SCCACHE_RO_ACCESS_KEY_ID || secrets.SCCACHE_RW_ACCESS_KEY_ID }}
          secret-access-key: ${{ github.event_name == 'pull_request' && secrets.SCCACHE_RO_SECRET_ACCESS_KEY || secrets.SCCACHE_RW_SECRET_ACCESS_KEY }}
          read-only: ${{ github.event_name == 'pull_request' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - run: cargo build --locked -p ferroehr-viewer
      - if: needs.changes.outputs.queue_verified != 'true'
        run: cargo nextest run --locked -p ferroehr-viewer --no-tests=pass --profile ci

  # ── The Helm chart's lint + golden renders (issue #2110) ────────────────────
  # deploy/helm/validate.sh is the only check in the repository that pins the
  # chart's security posture — runAsNonRoot, readOnlyRootFilesystem,
  # allowPrivilegeEscalation:false, seccomp RuntimeDefault, drop ALL,
  # enableServiceLinks:false, the default-deny NetworkPolicy — and it ran in no
  # workflow at all, so the goldens went stale on main and nothing failed.
  #
  # helm is INSTALLED, never taken from the runner image: `helm template` output
  # is not byte-stable across helm releases (4.2.3 emits blank lines 4.1.3 does
  # not), so a drifting preinstalled helm would fail the golden compare with a
  # whitespace diff. The version comes from deploy/helm/.tool-versions, the same
  # file validate.sh checks itself against.
  helm-golden:
    name: helm-golden
    needs: changes
    if: github.event_name != 'merge_group' && (needs.changes.outputs.helm == 'true' && needs.changes.outputs.queue_verified != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned helm, read from deploy/helm/.tool-versions and installed by the
      # composite (#2775) — which is also where the `version` vs `version-file`
      # trap that silently installed the latest helm is recorded.
      - uses: ./.github/actions/helm-pinned # zizmor: ignore[self-repository] actionlint 1.7.12 refuses the $/ form (rhysd/actionlint#711)
      - name: helm lint (default + all-features value sets)
        run: |
          helm dependency build deploy/helm/ferroehr
          helm lint deploy/helm/ferroehr -f deploy/helm/ci/default-values.yaml
          helm lint deploy/helm/ferroehr -f deploy/helm/ci/all-features-values.yaml
      # The chart gates read the rendered YAML structurally (yq -o=json | jq),
      # because a grep over a manifest passes as soon as ONE container carries a
      # field. The yq is the runner image's, trusted as its jq and bash are, and
      # held to the oldest version the gates are verified on; a per-run release
      # download turned pull requests red on 2026-11-09 (#5256).
      - name: The runner's yq is 4.53.3 or newer
        env:
          YQ_MIN_VERSION: 4.53.3
        run: bash scripts/checks/runner-yq.sh
      # The README drift check needs helm-docs (pinned in
      # deploy/helm/.tool-versions, checksum-verified like yq), and validate.sh
      # fails in CI when it is missing (#2806).
      - name: Install the pinned helm-docs
        env:
          VERSION_FILE: deploy/helm/.tool-versions
          HELM_DOCS_SHA256: a8cf72ada34fad93285ba2a452b38bdc5bd52cc9a571236244ec31022928d6cc
        run: |
          set -euo pipefail
          version="$(awk '$1 == "helm-docs" { print $2 }' "$VERSION_FILE")"
          [ -n "$version" ] || { echo "::error::no helm-docs line in $VERSION_FILE"; exit 1; }
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o /tmp/helm-docs.tar.gz \
            "https://github.com/norwoodj/helm-docs/releases/download/v${version}/helm-docs_${version}_Linux_x86_64.tar.gz"
          echo "${HELM_DOCS_SHA256}  /tmp/helm-docs.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm-docs.tar.gz -C /tmp helm-docs
          sudo install -m 0755 /tmp/helm-docs /usr/local/bin/helm-docs
          helm-docs --version
      # No --update: the goldens in the tree must already match this render.
      - name: Chart validation + golden renders
        run: bash deploy/helm/validate.sh

  # ── Every committed values overlay must BOOT, not merely render (#2159) ─────
  # helm-golden above proves the manifests are well-formed, hardened and
  # unchanged. It proved exactly that while all three overlays carried
  # configurations the server refuses to start on: `auth.enabled` with no
  # mechanism, a placeholder that is not an Argon2id PHC string, a 15-byte HMAC
  # secret under a 32-byte floor, SMART enabled with no public base URL. Four
  # boot failures, four green renders. Nothing but the server can tell the
  # difference, so this job runs it.
  #
  # It runs on every PR that can break the pair (see the `chart_boot` filter),
  # NOT only on a tag — the tag lane's identical check is the last line of
  # defence, and by then the release cut is already failing.
  #
  # The image is packaged from THIS TREE's server binary rather than pulled from
  # GHCR, which is the difference between a gate and a trap: `appVersion` and the
  # chart's config defaults advance on different clocks, so judging a PR against
  # a published image would fail every PR that adds a configuration key, from the
  # commit that adds it until the next release. The binary comes from the
  # ui-e2e-binary job, whose exact-key cache makes a chart-only PR pay nothing
  # for it, and packaging is the COPY-only `runtime-prebuilt` target — seconds.
  chart-boot:
    name: chart-boot
    needs: [changes, ui-e2e-binary]
    if: github.event_name != 'merge_group' && (needs.changes.outputs.chart_boot == 'true' && needs.changes.outputs.queue_verified != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same pin as the goldens, from the same file and the same composite.
      - uses: ./.github/actions/helm-pinned # zizmor: ignore[self-repository] actionlint 1.7.12 refuses the $/ form (rhysd/actionlint#711)
      # The artifact download loses the executable bit; the Dockerfile COPYs the
      # binary with `--chmod=0755`, which is why that does not matter here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-e2e-server-binary
          path: bin/amd64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Package the app image (COPY-only, seconds)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr:chart-boot
      - name: Boot every committed values overlay
        env:
          FERROEHR_IMAGE: ferroehr:chart-boot
        run: bash deploy/helm/ci/boot-check.sh

  # ── The deployment harness, on a real composed stack (#2178) ─────────────────
  # The instrument for what lives between "the code is correct" and "the
  # thing an operator runs works".
  #
  # It reuses the binary the ui-e2e lane already builds, packaged COPY-only in
  # seconds — building the image again here would double a long lane to prove
  # the same bytes.
  #
  # Families needing a dependency the harness composes itself (Keycloak, the
  # broker, the collector) run here; terminology does NOT — it needs a licensed
  # SNOMED release that may not be fetched onto a shared runner, and its own
  # opt-in local lane covers it. The hospital scenario runs behind FerroSMART
  # in its own job, deploy-probe-hospital, once per upstream provider (#5833),
  # and deploy-probe-scheduled.yml runs the same default run daily and against
  # each published image.
  #
  # The job runs about 17 minutes, so 45 leaves a slow runner more than
  # twice that.
  deploy-probe:
    name: deploy-probe
    needs: [changes, ui-e2e-binary]
    if: github.event_name != 'merge_group' && ((needs.changes.outputs.code_runs == 'true' || needs.changes.outputs.deploy == 'true') && needs.changes.outputs.queue_verified != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-e2e-server-binary
          path: bin/amd64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Package the app image (COPY-only, seconds)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr:deploy-probe
      # The database image THIS TREE defines, packaged like the app image —
      # the compose fallback names the RELEASE tag, which a release PR flips
      # before that tag's images exist (found on the v3.17.8 cut: every
      # posture's stack sat on a manifest-unknown postgres pull until the
      # probe timed out). Native amd64 build; the Dockerfile's security
      # upgrade runs in minutes.
      - name: Package the postgres image (base + security updates)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/postgres
          file: docker/postgres/Dockerfile
          load: true
          tags: ferroehr-postgres:deploy-probe
      - name: Probe the deployment
        env:
          FERROEHR_IMAGE: ferroehr:deploy-probe
          FERROEHR_POSTGRES_IMAGE: ferroehr-postgres:deploy-probe
        run: bash scripts/deploy-probe.sh
      # The RECORD, always — a failed run is exactly when the per-probe layer
      # attribution and the not-exercised ledger are worth reading.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deploy-probe-record
          path: docs/conformance/deployment/compose.json
          if-no-files-found: warn

  # ── The hospital scenario behind FerroSMART (#5832, #5833) ───────────────────
  # The hospital family of the deployment harness, once per upstream identity
  # provider of FerroSMART, the SMART authorization server that issues every
  # token the scenario presents: Keycloak and ZITADEL, each pinned by digest in
  # the overlays docs/VERSIONS.md names. It packages the server binary the
  # ui-e2e lane builds and the viewer binary of ui-e2e-viewer, whose Launch
  # button starts the scenario's EHR launch. The merge queue skips it: the pull
  # request's run of the same tree proved it.
  deploy-probe-hospital:
    name: deploy-probe hospital (${{ matrix.upstream }})
    needs: [changes, ui-e2e-binary, ui-e2e-viewer]
    if: >-
      github.event_name != 'merge_group' &&
      (needs.changes.outputs.code_runs == 'true' || needs.changes.outputs.deploy == 'true') &&
      needs.changes.outputs.queue_verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        upstream: [keycloak, zitadel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-e2e-server-binary
          path: bin/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-e2e-console
          path: ui-e2e-console-stage
      - name: Place the prebuilt viewer in the image context
        run: install -m0755 ui-e2e-console-stage/ferroehr-viewer bin/amd64/ferroehr-viewer
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Package the app image (COPY-only, seconds)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr:deploy-probe
      - name: Package the viewer image (COPY-only, seconds)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/viewer/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr-viewer:deploy-probe
      - name: Package the postgres image (base + security updates)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/postgres
          file: docker/postgres/Dockerfile
          load: true
          tags: ferroehr-postgres:deploy-probe
      - name: Probe the hospital scenario
        env:
          FERROEHR_IMAGE: ferroehr:deploy-probe
          FERROEHR_VIEWER_IMAGE: ferroehr-viewer:deploy-probe
          FERROEHR_POSTGRES_IMAGE: ferroehr-postgres:deploy-probe
          PROBE_ONLY: hospital
          PROBE_HOSPITAL_UPSTREAM: ${{ matrix.upstream }}
          PROBE_OUT: docs/conformance/deployment/hospital-${{ matrix.upstream }}.json
        run: bash scripts/deploy-probe.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deploy-probe-hospital-${{ matrix.upstream }}
          path: docs/conformance/deployment/hospital-${{ matrix.upstream }}.json
          if-no-files-found: warn

  # ── Unused dependencies ──────────────────────────────────────────────────────
  unused-deps:
    name: cargo-machete
    needs: changes
    if: github.event_name != 'merge_group' && (needs.changes.outputs.code == 'true' && needs.changes.outputs.queue_verified != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-machete
      # The binary itself, not the `cargo` proxy: through the proxy,
      # rust-toolchain.toml makes rustup download the pinned toolchain first,
      # and a stalled download ate the whole timeout (#4924). Machete reads
      # the manifests and sources and needs no toolchain.
      - run: cargo-machete

  # ── The CDR binary the ui-e2e battery runs against (#335) ─────────────────
  # The server binary is compiled here natively, in the pinned
  # rust:*-slim-trixie image and never inside a Dockerfile, under the `e2e`
  # profile (the release profile without LTO, #3490), and ui-e2e PACKAGES it
  # with `runtime-prebuilt`, the final target containers.yml ships. No layer
  # cache can serve an in-image build: every ui-e2e trigger path is in the
  # build context.
  #
  # Two caches, strongest first:
  #   1. the finished binary, keyed on the exact content of every input the
  #      server build reads, so a viewer-only PR compiles nothing;
  #   2. sccache (per compilation unit) for the miss case.
  #
  # SOURCE_DATE_EPOCH is pinned and REVISION is not passed: app/ferroehr/build.rs
  # bakes both through `cargo:rustc-env`, and sccache keys on `env!` values
  # (github.com/mozilla/sccache docs/Rust.md), so a per-run value would make
  # the largest first-party crates uncacheable. build.rs then reads
  # SHA=unknown; the battery asserts behaviour, never provenance, and
  # containers.yml stamps github.sha into the published images.
  #
  # Consumers: the ui-e2e battery, the `chart-boot` job, the `conformance` job
  # (#4539) and `deploy-probe` (#5271); scripts/checks/binary-consumers.sh
  # holds every consumer's lanes here. The job id and name are
  # branch-protection check names. The steps are .github/actions/server-binary,
  # shared with nightly.yml's perf binaries and the scheduled deploy probe under one cache
  # key (#5673). A push the merge queue verified keeps this job as main's
  # writer of the binary cache and the sccache entries (#4546).
  ui-e2e-binary:
    name: ui-e2e server binary
    needs: changes
    if: >-
      github.event_name != 'merge_group' && (
      needs.changes.outputs.viewer == 'true' ||
      needs.changes.outputs.chart_boot == 'true' ||
      (needs.changes.outputs.perf == 'true' && github.event_name == 'push') ||
      (needs.changes.outputs.conformance == 'true' && github.event_name != 'push') ||
      ((needs.changes.outputs.code_runs == 'true' || needs.changes.outputs.deploy == 'true') && needs.changes.outputs.queue_verified != 'true'))
    runs-on: ubuntu-latest
    # Generous: a binary-cache miss with a cold sccache is a full release
    # build of the first-party graph.
    timeout-minutes: 60
    permissions:
      contents: read
    # Debian 13 (trixie) container so the binary targets glibc 2.41, matching
    # gcr.io/distroless/cc-debian13 exactly — the same pin and the same reason
    # as containers.yml's `binary` job. It must NOT be compiled on the bare
    # runner: glibc compatibility runs forward only, so a runner image with a
    # newer glibc than the runtime image ships yields a binary that image
    # cannot load.
    container: rust:1.99.1-slim-trixie@sha256:00544ccc9431a2fe93e65185d21381b0a039342f5cefcf84fbddac273c9e573d
    env:
      # Fixed build timestamp — reproducible, and the precondition for the
      # compile to be cacheable at all (see the block above; build.rs honours
      # SOURCE_DATE_EPOCH per reproducible-builds.org/docs/source-date-epoch).
      SOURCE_DATE_EPOCH: "1700000000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/server-binary # zizmor: ignore[self-repository] actionlint 1.7.12 refuses the $/ form (rhysd/actionlint#711)
        with:
          artifact-name: ui-e2e-server-binary

  # ── Viewer + e2e test binaries, prebuilt in parallel (issue #335) ──────────
  # The second half of the compile-nothing-in-the-battery split (#335): this
  # job builds the host viewer and the nextest test binaries beside
  # ui-e2e-binary and ships them as one artifact; the battery job then only
  # composes, seeds, and drives the browser.
  #
  # Runs on the BARE runner (not a container) deliberately: the viewer binary
  # executes on the battery job's host, and the e2e binaries bake
  # env!("CARGO_MANIFEST_DIR") paths at compile time — both jobs being
  # ubuntu-latest gives them the same glibc AND the same workspace path
  # (/home/runner/work/<repo>/<repo>), so the baked paths resolve. Keep this
  # job and ui-e2e on the same runner image always. Kept on a verified push,
  # like ui-e2e-binary, as main's writer of its exact-key cache (#4546).
  ui-e2e-viewer:
    name: ui-e2e viewer + test binaries
    needs: changes
    # The hospital scenario launches an app through the viewer (#5880), so the
    # deploy-probe-hospital job packages this binary too.
    if: >-
      github.event_name != 'merge_group' && (needs.changes.outputs.viewer == 'true' ||
      ((needs.changes.outputs.code_runs == 'true' || needs.changes.outputs.deploy == 'true') && needs.changes.outputs.queue_verified != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Cache 1 — the built outputs themselves, exact key, no restore-keys
      # (the ui-e2e-binary pattern above): the key covers everything the
      # viewer + its e2e binaries read. app/ferroehr, app/ferroehr-rest,
      # app/ferroehr-server are deliberately absent — the viewer consumes the
      # CDR strictly over ITS-REST and never links those crates, so a
      # server-only PR reuses the viewer artifact.
      # NOTE: `ui-e2e-console-*` here is a cache/artifact IDENTITY string, not
      # prose — renaming it would strand every stored entry, so it stays.
      - id: viewer-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ui-e2e-console-stage
          key: ui-e2e-console-1.99.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'crates/**', 'app/ferroehr-viewer/**') }}
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        if: steps.viewer-cache.outputs.cache-hit != 'true'
        with:
          # Registry-only cache; sccache owns compilation caching (the same
          # split, for the same lockfile-rotation reason, as the jobs above).
          cache-targets: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.viewer-cache.outputs.cache-hit != 'true'
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        if: steps.viewer-cache.outputs.cache-hit != 'true'
        with:
          tool: cargo-nextest
      - name: Build the viewer + archive the e2e test binaries
        if: steps.viewer-cache.outputs.cache-hit != 'true'
        env:
          SCCACHE_GHA_ENABLED: "true"
          # Only main writes (the cache policy above, #3490): a pull-request
          # entry is readable by that pull request alone, and its writes evicted
          # main's from the full 10 GB quota (github.com/mozilla/sccache,
          # docs/Configuration.md, SCCACHE_GHA_RW_MODE).
          SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
          RUSTC_WRAPPER: sccache
          # "Incrementally compiled crates cannot be cached"
          # (github.com/mozilla/sccache#known-caveats).
          CARGO_INCREMENTAL: "0"
          # A throttled cache backend (Azure 503 ServerBusy) failed sccache's
          # startup probe and with it the build (#5556); skip the probe and use
          # the configured mode, so a busy cache only costs misses
          # (github.com/mozilla/sccache, docs/Configuration.md,
          # SCCACHE_SKIP_CACHE_CHECK).
          SCCACHE_SKIP_CACHE_CHECK: "true"
        run: |
          set -euo pipefail
          cargo nextest archive -p ferroehr-viewer \
            --archive-file ui-e2e-tests.tar.zst
          cargo build --locked -p ferroehr-viewer --bin ferroehr-viewer
          # One staging tree = one artifact = one cache path. The viewer
          # binary's executable bit is restored by the battery job (GitHub
          # artifacts do not preserve file permissions).
          mkdir -p ui-e2e-console-stage
          cp target/debug/ferroehr-viewer ui-e2e-console-stage/
          cp ui-e2e-tests.tar.zst ui-e2e-console-stage/
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.viewer-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: ui-e2e-console-stage
          key: ${{ steps.viewer-cache.outputs.cache-primary-key }}
      - name: sccache statistics
        if: always() && steps.viewer-cache.outputs.cache-hit != 'true'
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: ${SCCACHE_PATH} --show-stats
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-e2e-console
          path: ui-e2e-console-stage
          if-no-files-found: error
          retention-days: 1

  # ── Viewer E2E (merge gate for viewer-touching changes) ────────────────────
  # Runs the full composed journey battery (scripts/ui-e2e.sh): postgres +
  # ferroehr + Keycloak via compose, the viewer + e2e binaries prebuilt by the
  # jobs above, chromedriver journeys with the browser-console gate. Screenshots
  # upload on success AND failure (human review — no pixel-diff assertions).
  # The pipeline's critical path (#3120): this job cannot start until the
  # binaries it downloads exist, so the wall clock is `ui-e2e-binary` plus this.
  # The journeys run `-j 1` because all 139 share one composed stack and one
  # browser; sharding gives each shard its own stack, so the serialization holds
  # inside a shard and the shards divide the wall clock. That sidesteps the
  # question of which journeys are order-dependent rather than answering it —
  # the answer is worth having, and it is not this file's to give.
  ui-e2e:
    name: ui-e2e ${{ matrix.viewport }} ${{ matrix.shard }}/${{ needs.changes.outputs.ui_e2e_shard_count }}
    needs: [changes, ui-e2e-binary, ui-e2e-viewer]
    if: needs.changes.outputs.viewer == 'true' && (github.event_name == 'pull_request' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The battery runs once at the desktop width and once at a phone's 390 px,
    # by device emulation in the harness (UI_E2E_VIEWPORT, #3910).
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.ui_e2e_shards) }}
        viewport: [desktop, phone]
    # `contents: read` is all it needs: nothing here writes to a registry.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nothing compiles in this job (#335): the server binary,
      # the viewer, and the e2e test binaries all arrive as artifacts from
      # the two parallel jobs above. The toolchain stays only because
      # `cargo nextest run --archive-file` is a cargo subcommand; nextest
      # resolves no dependencies here, so the job restores and writes no cache
      # (#6388).
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      # The CDR image is PACKAGED here, never compiled here (issue #335 — the
      # rationale is on the ui-e2e-binary job above). `runtime-prebuilt` is
      # COPY-only, so this is a seconds-long step with no layer-cache backend
      # involved at all — which is why GHCR stays product-images-only
      # (ferroehr, ferroehr-postgres, ferroehr-viewer) and no
      # `build-cache` package is published beside them (owner call 2026-07-26).
      # `load: true` puts the result in the docker store so the compose
      # `--no-build` below finds it.
      #
      # The artifact download loses the executable bit (GitHub artifacts do not
      # preserve file permissions), which is exactly why the Dockerfile COPYs
      # the binary with `--chmod=0755`
      # (docs.docker.com/reference/dockerfile — COPY --chmod).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-e2e-server-binary
          path: bin/amd64
      # The prebuilt viewer + e2e binaries from the ui-e2e-viewer job. The
      # artifact download strips the executable bit (GitHub artifacts do not
      # preserve file permissions) — restored here for the viewer binary; the
      # binaries inside the nextest archive keep theirs (tar preserves modes).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-e2e-console
          path: ui-e2e-console-stage
      - name: Place the prebuilt viewer where the harness expects it
        run: |
          set -euo pipefail
          mkdir -p target/debug
          install -m0755 ui-e2e-console-stage/ferroehr-viewer target/debug/ferroehr-viewer
          test -f ui-e2e-console-stage/ui-e2e-tests.tar.zst
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Package the app image (COPY-only, seconds)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr:ui-e2e
      - name: Build the postgres image (COPY-only, seconds)
        run: docker buildx build --load -t ferroehr-postgres:ui-e2e docker/postgres
      - name: Run the E2E journey battery
        # UI_E2E_NO_BUILD makes ui-e2e.sh `up --no-build` the pre-built
        # images; the two PREBUILT vars make it run the viewer + e2e
        # binaries the ui-e2e-viewer job compiled — zero rustc here.
        env:
          UI_E2E_NO_BUILD: "1"
          UI_E2E_PREBUILT_VIEWER: "1"
          UI_E2E_NEXTEST_ARCHIVE: ${{ github.workspace }}/ui-e2e-console-stage/ui-e2e-tests.tar.zst
          FERROEHR_IMAGE: ferroehr:ui-e2e
          FERROEHR_POSTGRES_IMAGE: ferroehr-postgres:ui-e2e
          UI_E2E_PARTITION: hash:${{ matrix.shard }}/${{ needs.changes.outputs.ui_e2e_shard_count }}
          UI_E2E_VIEWPORT: ${{ matrix.viewport }}
        run: bash scripts/ui-e2e.sh
      - name: Upload journey screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-e2e-screenshots-${{ matrix.viewport }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: target/ui-e2e/screenshots/
          if-no-files-found: ignore

  # The book's viewer screenshots (website/book/src/viewer/img), captured by
  # the `e2e_docs_shots` pass against the same composed stack and prebuilt
  # binaries the journeys use, and uploaded as `ui-docs-shots` (#3634). The
  # development machines run no compose stack, so this is where a viewer PR
  # gets the captures `ui-screenshot-guard` asks it to commit: download the
  # artifact, read every image, commit the ones the change moved.
  ui-docs-shots:
    name: ui-docs-shots
    needs: [changes, ui-e2e-binary, ui-e2e-viewer]
    if: needs.changes.outputs.viewer == 'true' && (github.event_name == 'pull_request' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache, as in ui-e2e: nothing compiles here.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-e2e-server-binary
          path: bin/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-e2e-console
          path: ui-e2e-console-stage
      - name: Place the prebuilt viewer where the harness expects it
        run: |
          set -euo pipefail
          mkdir -p target/debug
          install -m0755 ui-e2e-console-stage/ferroehr-viewer target/debug/ferroehr-viewer
          test -f ui-e2e-console-stage/ui-e2e-tests.tar.zst
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Package the app image (COPY-only, seconds)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr:ui-e2e
      - name: Build the postgres image (COPY-only, seconds)
        run: docker buildx build --load -t ferroehr-postgres:ui-e2e docker/postgres
      - name: Capture the documentation screenshots
        env:
          UI_E2E_NO_BUILD: "1"
          UI_E2E_PREBUILT_VIEWER: "1"
          UI_E2E_NEXTEST_ARCHIVE: ${{ github.workspace }}/ui-e2e-console-stage/ui-e2e-tests.tar.zst
          FERROEHR_IMAGE: ferroehr:ui-e2e
          FERROEHR_POSTGRES_IMAGE: ferroehr-postgres:ui-e2e
          UI_E2E_SHOTS_ONLY: "1"
          UI_E2E_DOCS_SHOTS: "1"
        run: bash scripts/ui-e2e.sh
      - name: Upload the documentation screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-docs-shots
          path: website/book/src/viewer/img/
          if-no-files-found: error
      # Every route at 1440 and 390 px, light and dark, for the family
      # screenshot review (#3910); not committed.
      - name: Upload the route screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-route-shots
          path: target/ui-e2e/screenshots/routes/
          if-no-files-found: error

  # ── The viewer login smoke on a pull request (#3982) ───────────────────────
  # docker/viewer/login-smoke.sh drives a real browser through the sign-in of
  # a viewer IMAGE. It ran only in containers.yml on main and in the release,
  # so the islands rebuild's broken sign-in surfaced first in the v5.4.0
  # release (#3980, #3981). Here the viewer and CDR images are packaged
  # COPY-only from the binaries ui-e2e-binary and ui-e2e-viewer already built
  # (the `runtime-prebuilt` targets the published images use), and nothing is
  # pushed. The asset chain of the RELEASE build stays containers.yml's check.
  viewer-login-smoke:
    name: viewer login smoke
    needs: [changes, ui-e2e-binary, ui-e2e-viewer]
    if: needs.changes.outputs.viewer == 'true' && (github.event_name == 'pull_request' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-e2e-server-binary
          path: bin/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-e2e-console
          path: ui-e2e-console-stage
      # docker/viewer/Dockerfile `runtime-prebuilt` COPYs
      # bin/<arch>/ferroehr-viewer, the layout build-image.yml stages.
      - name: Stage the viewer binary
        run: |
          set -euo pipefail
          install -m0755 ui-e2e-console-stage/ferroehr-viewer bin/amd64/ferroehr-viewer
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Package the CDR image (COPY-only, seconds)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr:login-smoke
      - name: Package the viewer image (COPY-only, seconds)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/viewer/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr-viewer:login-smoke
      - name: Build the postgres image (COPY-only, seconds)
        run: docker buildx build --load -t ferroehr-postgres:login-smoke docker/postgres
      - name: Browser-driven login against the packaged viewer image
        env:
          FERROEHR_VIEWER_IMAGE: ferroehr-viewer:login-smoke
          FERROEHR_IMAGE: ferroehr:login-smoke
          FERROEHR_POSTGRES_IMAGE: ferroehr-postgres:login-smoke
        run: bash docker/viewer/login-smoke.sh

  # ── The compose/local image target (docker/Dockerfile runtime-from-source) ──
  # ui-e2e packages the shipped `runtime-prebuilt` target (#335), so
  # the in-image source build that docker-compose.dev.yml (the repo-dev
  # `up --build` posture) and docker/sut-ferroehr.yml (the conformance SUT
  # stack) rely on would otherwise have no CI exercise at all.
  # It is built here instead — but ONLY when its own recipe changes, which is
  # the one moment the full cold compile buys something. Nothing is exported:
  # the build succeeding IS the assertion.
  server-image-from-source:
    name: server image (from source)
    needs: changes
    if: github.event_name != 'merge_group' && (needs.changes.outputs.server_dockerfile == 'true' && needs.changes.outputs.queue_verified != 'true')
    runs-on: ubuntu-latest
    # A deliberate full cold in-image compile (no cache backend at all).
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-from-source
          push: false

  # The viewer's compose/local target (docker/viewer/Dockerfile
  # runtime-from-source), on the same terms as the server's above: the
  # published viewer image packages `runtime-prebuilt`, so a broken in-image
  # build shipped unnoticed until a compose user built it (#4222).
  viewer-image-from-source:
    name: viewer image (from source)
    needs: changes
    if: github.event_name != 'merge_group' && (needs.changes.outputs.viewer_dockerfile == 'true' && needs.changes.outputs.queue_verified != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/viewer/Dockerfile
          target: runtime-from-source
          push: false

  # Screenshot-freshness guard (the changelog-guard pattern): a PR that
  # changes the viewer UI must re-capture the published book screenshots in
  # the same PR (freshness, not pixels — owner decision). Escape hatch: the
  # `no-ui-visual-change` label for BFF-only/comment/test changes.
  #
  # PULL-REQUEST ONLY, deliberately (#2777): both halves — the merge-base diff
  # and the label — are pull-request payload, and neither exists on a
  # merge_group event. It has already gated this pull request by then.
  ui-screenshot-guard:
    name: ui-screenshot-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the labels when the step runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require refreshed screenshots for UI changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Read when the step runs: a re-run replays the event payload (#3948).
          HAS_LABEL=$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq 'any(.labels[].name; . == "no-ui-visual-change")')
          if [ "$HAS_LABEL" = "true" ]; then
            echo "no-ui-visual-change label set — guard skipped."; exit 0
          fi
          bash scripts/checks/ui-screenshot.sh --self-test
          bash scripts/checks/ui-screenshot.sh "$BASE" "$HEAD"

  # Crate-version guard: a PR never edits the lockstep version of the
  # published crates/* members or their internal requirements, because the
  # publish step stamps it from crates.io (#4555,
  # .claude/rules/crates-publishing.md; local twin:
  # .claude/hooks/crate_version_bump_guard.sh). The check is
  # scripts/checks/crate-version-guard.sh, which runs locally too and reports
  # whether packaged content changed. Escape hatch: the `no-crate-bump` label
  # for a PR that must set the version by hand.
  #
  # PULL-REQUEST ONLY, deliberately (#2777): it compares the pull request's
  # base and head trees and reads a pull-request label, neither of which a
  # merge_group event carries. It has already gated this pull request by then.
  crate-version:
    name: crate-version-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the labels when the step runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse a hand edit of the lockstep crate version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Read when the step runs: a re-run replays the event payload (#3948).
          HAS_LABEL=$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq 'any(.labels[].name; . == "no-crate-bump")')
          if [ "$HAS_LABEL" = "true" ]; then
            echo "no-crate-bump label set — guard skipped."; exit 0
          fi
          bash scripts/checks/crate-packaged-paths.sh --self-test
          bash scripts/checks/crate-version-guard.sh --self-test
          # The guard reads the pull request's own change, from its merge base
          # with main (#4129).
          bash scripts/checks/crate-version-guard.sh "$BASE" "$HEAD"

  # The SemVer judge of the nine openehr-* crates (#5353,
  # .claude/rules/crates-publishing.md): cargo-semver-checks compares each
  # crate's public API with its newest release on crates.io, the baseline,
  # since main holds the manifests at a floor below the published line
  # (#4555). The judge says which release the change needs (The Cargo Book,
  # "SemVer Compatibility") and refuses nothing the publish step's stamp can
  # still answer; it fails only when it cannot judge a crate. It runs on a
  # pull request and again in the merge queue, over the merged tree.
  crate-semver:
    name: crate-semver (cargo-semver-checks)
    needs: changes
    if: github.event_name != 'merge_group' && ((github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.semver == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The judge builds rustdoc JSON in its own target directory, which no
      # other lane shares, so it restores and writes no cache.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
      - id: semver-pin
        name: Read the cargo-semver-checks pin
        run: echo "version=$(bash scripts/checks/semver.sh --pin)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-semver-checks@${{ steps.semver-pin.outputs.version }}
      - name: The judge's own arithmetic
        run: bash scripts/checks/semver.sh --self-test
      - name: The release the change needs (cargo-semver-checks against crates.io)
        run: bash scripts/checks/semver.sh report

  # Chart-version guard (the crate-version-guard pattern, issue #2108): a PR that
  # changes PACKAGED chart content must bump `Chart.yaml` version in the same PR.
  #
  # The immutability this protects is NOT the registry's own: an OCI tag is
  # mutable, and a second `helm push` of the same chart version silently replaces
  # the manifest (measured against a local registry — the digest changed with no
  # warning). So the publish lane refuses to overwrite a published version, and
  # this guard makes sure a change carries a version to publish under. Artifact
  # Hub indexes versions, so a re-used one is a listing that misdescribes itself.
  #
  # PACKAGED content is `deploy/helm/ferroehr/**` only. The value overlays, the
  # golden renders, the validator, the helm pin and the Artifact Hub metadata live
  # one level up and ship in nothing — a change to those needs no bump.
  # Escape hatch: the `no-chart-bump` label, for a packaged diff that provably
  # cannot alter what a consumer gets. A comment in `values.yaml` does not
  # qualify: values.yaml ships.
  #
  # PULL-REQUEST ONLY, deliberately (#2777): same shape as crate-version — a
  # base..head diff plus a label, neither carried by a merge_group event, and
  # already gated on the pull request.
  chart-version:
    name: chart-version-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the labels when the step runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a Chart.yaml version bump for packaged chart changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Read when the step runs: a re-run replays the event payload (#3948).
          HAS_LABEL=$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq 'any(.labels[].name; . == "no-chart-bump")')
          if [ "$HAS_LABEL" = "true" ]; then
            echo "no-chart-bump label set — guard skipped."; exit 0
          fi
          # From the merge base, as crate-version-guard (#4129).
          . scripts/lib/changed-paths.sh
          FORK=$(change_fork "$BASE" "$HEAD")
          changed=$(change_paths "$BASE" "$HEAD")
          if ! grep -qE '^deploy/helm/ferroehr/' <<<"$changed"; then
            echo "No packaged chart content touched — guard not required."; exit 0
          fi
          old=$(git show "$FORK:deploy/helm/ferroehr/Chart.yaml" | sed -nE 's/^version: *(.+)$/\1/p')
          new=$(git show "$HEAD:deploy/helm/ferroehr/Chart.yaml" | sed -nE 's/^version: *(.+)$/\1/p')
          if [ "$old" = "$new" ]; then
            echo "::error::This PR changes packaged chart content (deploy/helm/ferroehr/) but leaves Chart.yaml version at $new. A published chart version is taken — bump it (SemVer over the chart's values schema and rendered output), or apply 'no-chart-bump' if the diff provably cannot change what a consumer gets." >&2
            exit 1
          fi
          echo "Chart version bumped $old -> $new — OK."

  migration-immutability:
    name: migration-immutability
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # The guard judges only files present at the latest release tag or a
          # pre-release tag above it.
          fetch-tags: true
      # The detector runs against a scratch repository of its own first, so the
      # data this job acts on is produced by a filter that was just proven to
      # catch a modified and a deleted migration and to let an added one pass.
      - name: The guard's own detector
        run: bash scripts/checks/migration-immutability.sh --self-test
      # Context reaches the shell through env, never `${{ }}`-inline.
      - name: No migration that already exists on the base branch was changed
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/checks/migration-immutability.sh --diff "$PR_BASE" "$PR_HEAD"

  # A change that moves the pseudonymisation boundary is reviewed as one: the
  # template's 'Privacy boundary' checklist has to be ticked, and no added line
  # may carry a value shaped like a real Dutch identifier (CONTRIBUTING.md
  # § Personal data). The body is read when the step runs, and pr-guards.yml
  # re-runs this job when the description changes (#3948). Bot authors are
  # skipped for the reason the licence gate skips them: a bot cannot make the
  # claims the checklist records, and its bumps touch none of the boundary
  # paths.
  privacy-boundary:
    name: privacy-boundary-guard
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the description when the step runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The BSN and postcode detectors are the whole value of this job, so they
      # are proven against passing and failing fixtures before they judge a
      # diff. A data check nobody exercises is a check nobody can trust.
      - name: The guard's own detectors
        run: bash scripts/checks/privacy-boundary.sh --self-test
      # Context reaches the shell through env, never `${{ }}`-inline.
      - name: The privacy boundary is reviewed and the diff carries no personal data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PR_BODY=$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq '.body // ""')
          export PR_BODY
          bash scripts/checks/privacy-boundary.sh --diff "$PR_BASE" "$PR_HEAD"

  # Changelog guard (Keep a Changelog 1.1.0; the fragments are our own design,
  # no specification governs them): a PR that changes a user-visible surface
  # adds a fragment under changelog.d/ (changelog.d/README.md), and no PR
  # writes under CHANGELOG.md's [Unreleased]. Escape hatch: the `no-changelog`
  # label for invisible changes (internal refactors, CI, docs); it waives the
  # entry, never the [Unreleased] refusal or the checks before it.
  #
  # PULL-REQUEST ONLY, deliberately (#2777): the entry requirement is a
  # base..head diff plus a label, neither carried by a merge_group event, and
  # already gated on the pull request. The fragment and structure checks are
  # whole-tree checks, but they are not worth a second job for a queue that
  # cannot change the files between the pull request and the merge.
  # A release PR is checked against the tree it merges into (#4361): on a
  # change that moves the workspace version this job runs the plan's own
  # fragment check at the merge ref or the merge group. It runs on a push to
  # main too (#4803), so a release commit merged past the queue turns main red
  # and names the missing fragments before anyone tags.
  release-fragments:
    name: release-fragments
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: The plan proves its fragment check
        run: bash scripts/release/plan.sh --self-test
      - name: A release change carries every fragment of the tree it merges into
        run: |
          set -euo pipefail
          version() { git show "$1:Cargo.toml" | sed -nE 's/^version = "(.*)"$/\1/p' | sed -n 1p; }
          old="$(version HEAD^1)"
          new="$(version HEAD)"
          if [ "$old" = "$new" ]; then
            echo "the workspace version stays $new: no release cut to check."
            exit 0
          fi
          echo "the workspace version moves from $old to $new"
          bash scripts/release/plan.sh fragments "v$new"

  changelog:
    name: changelog-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the labels when the step runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The self-tests prove the assembler, this guard and the Security check.
      - name: The changelog scripts prove themselves
        run: |
          set -euo pipefail
          bash scripts/release/changelog.sh --self-test
          bash scripts/checks/changelog-guard.sh --self-test
          bash scripts/checks/changelog-security.sh --self-test
      # Runs UNCONDITIONALLY: the no-changelog label waives the entry
      # requirement below, never the fragments' form or the file's Keep a
      # Changelog validity (duplicate '### Added'/'### Fixed' headers in one
      # release section shipped into release notes twice before this guard).
      - name: Every fragment is well formed and CHANGELOG.md keeps its structure
        run: |
          set -euo pipefail
          bash scripts/release/changelog.sh --check
          bash scripts/checks/changelog-structure.sh
      # CRA Annex I Part II(2), (4) and (8): a Security entry names its GHSA
      # advisory or VEX statement, and a Security section beside other changes
      # says why. Checked over [Unreleased] with every fragment folded in, as
      # the next cut writes it; the release plan runs the same check over the
      # section it cuts.
      - name: The next release section keeps its structure and names its advisories and its reason
        run: bash scripts/release/changelog.sh --check-preview
      - name: Require a changelog fragment for user-visible changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Read when the step runs: a re-run replays the event payload (#3948).
          HAS_LABEL=$(gh api "repos/${GH_REPO}/pulls/${PR}" --jq 'any(.labels[].name; . == "no-changelog")')
          if [ "$HAS_LABEL" = "true" ]; then
            echo "no-changelog label set: the entry is waived, an [Unreleased] edit is still refused."
            bash scripts/checks/changelog-guard.sh --waived "$BASE" "$HEAD"
            exit 0
          fi
          bash scripts/checks/changelog-guard.sh "$BASE" "$HEAD"

  # Quickstart config guard (#4380, #5003): the inline configurations of
  # docker-compose.yml must be readable by the server that runs them, or a
  # downloader gets a server that refuses its own configuration. On main the
  # file pins the `:main` FerroEHR image and carries main's configuration, so
  # the FerroEHR blocks are checked by the image this change builds: the
  # ui-e2e-binary server packaged COPY-only, as chart-boot packages it.
  # FerroPIX's block is checked by the image the file pins. Each `config
  # check` runs on no network. The binary is built for every change to the
  # server's code or to the compose files (the conformance and viewer lanes).
  quickstart-config:
    name: quickstart-config
    needs: [changes, ui-e2e-binary]
    if: github.event_name != 'merge_group' && (needs.changes.outputs.queue_verified != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The artifact download loses the executable bit; the Dockerfile COPYs the
      # binary with `--chmod=0755`, which is why that does not matter here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-e2e-server-binary
          path: bin/amd64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Package this change's server image (COPY-only, seconds)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr:quickstart-config
      - name: The quickstart's inline configurations read under this change's server and the pinned FerroPIX
        env:
          FERROEHR_CONFIG_IMAGE: ferroehr:quickstart-config
        run: bash scripts/checks/quickstart-config-image.sh
      - name: Every other server configuration the repository ships reads under this change's server (#5396)
        env:
          FERROEHR_CONFIG_IMAGE: ferroehr:quickstart-config
        run: bash scripts/checks/shipped-configs.sh

  # Veredictum pin guard (#4449): the conformance workflow runs the Veredictum
  # Action at the commit of the tag VEREDICTUM_VERSION names, on the image
  # digest VEREDICTUM_IMAGE names, both in scripts/lib/veredictum.sh. The tag
  # and the digest are read from GitHub and ghcr.io, failing closed.
  # ── openEHR conformance: the Veredictum catalogue (#4449, #4539) ─────────────
  # The reusable conformance.yml against the binary `ui-e2e-binary` compiled,
  # so a change compiles the server once. A pull request and the merge queue
  # only: a push to main judges the image containers.yml pushes for that
  # commit, by digest. The reusable job asks for `contents: write`, which the
  # Action uses only to push badges from a run on main that is not a pull
  # request, so it never pushes from here; a fork's token is read-only anyway.
  # While `advisory` is set the job ends green and hands its verdict to
  # `conclusion` as an output: a failed job fails the run, and a merge-queue
  # run that ends `failure` fails its entry even while `conclusion` passed
  # (#4600).
  # The viewer half of the shipped-configuration guard (#5396): the viewer's
  # hosted file, its environment on the quickstart and every overlay, and the
  # viewer Deployment of every chart render, read by `ferroehr-viewer config
  # check` built from this change. The server half runs in quickstart-config.
  shipped-viewer-configs:
    name: shipped-viewer-configs
    needs: changes
    if: github.event_name != 'merge_group' && ((needs.changes.outputs.viewer == 'true' || needs.changes.outputs.deploy == 'true' || needs.changes.outputs.helm == 'true') && needs.changes.outputs.queue_verified != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The runner's yq
        env:
          YQ_MIN_VERSION: 4.53.3
        run: bash scripts/checks/runner-yq.sh
      - name: Build the viewer
        run: cargo build --locked -p ferroehr-viewer --bin ferroehr-viewer
      - name: Every viewer configuration the repository ships reads under this change's viewer
        env:
          FERROEHR_VIEWER_BIN: target/debug/ferroehr-viewer
        run: bash scripts/checks/shipped-configs.sh

  conformance:
    name: conformance
    needs: [changes, ui-e2e-binary]
    if: github.event_name != 'merge_group' && (needs.changes.outputs.conformance == 'true' && github.event_name != 'push')
    permissions:
      contents: write # the reusable job's badge push, which never happens off main
      packages: read # the reusable job's GHCR pulls, unused beside an artifact
    uses: ./.github/workflows/conformance.yml # zizmor: ignore[self-repository] actionlint 1.7.12 refuses the $/ form (rhysd/actionlint#711)
    with:
      server-binary-artifact: ui-e2e-server-binary

  # The fuzz harnesses still compile (#4740): fuzz.yml's `build`, on a pull
  # request and in the merge queue whenever the change reaches fuzz/ or a crate
  # the harnesses build, and counted by `conclusion`. A push the queue already
  # passed does not build them again.
  harnesses:
    name: harnesses
    needs: changes
    if: github.event_name != 'merge_group' && (needs.changes.outputs.fuzz == 'true' && needs.changes.outputs.queue_verified != 'true')
    permissions:
      contents: read
    uses: ./.github/workflows/fuzz.yml # zizmor: ignore[self-repository] actionlint 1.7.12 refuses the $/ form (rhysd/actionlint#711)

  # The release's vulnerability record, before the tag (#4795). release.yml
  # refuses a finding without an OpenVEX judgement only after the tag, and a
  # tag cannot move, so each such finding cost a release candidate. A pull
  # request from a `release/v*` branch runs the same script over main's
  # newest images (the `:main` tag containers.yml applies, resolved to its
  # digest) and the server binary the app image carries, against the
  # branch's own security/vex/. Skipped on every other pull request.
  vulnerability-record:
    name: vulnerability-record
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # pull main's images
    env:
      TRIVY_VERSION: "0.73.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The coverage check refuses what it claims to refuse
        run: bash scripts/checks/vex-coverage.sh --self-test
      - name: The record scans what it claims to scan
        run: bash scripts/security/vulnerability-record.sh --self-test
      - name: Install Trivy from its GitHub release, checked by sha256
        run: bash scripts/security/install-trivy.sh "$TRIVY_VERSION" "$RUNNER_TEMP/trivy-bin"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Every finding on main's images carries an exploitability judgement
        run: |
          set -euo pipefail
          args=()
          for image in ferroehr ferroehr-viewer ferroehr-postgres; do
            digest="$(docker buildx imagetools inspect "ghcr.io/ferrohealth/${image}:main" --format '{{.Manifest.Digest}}')"
            echo "${image}:main is ${digest}"
            args+=(--image "${image}=ghcr.io/ferrohealth/${image}@${digest}")
            if [ "$image" = ferroehr ]; then
              app="ghcr.io/ferrohealth/ferroehr@${digest}"
            fi
          done
          bash scripts/security/vulnerability-record.sh \
            --reports reports --record vulnerability-record.json \
            "${args[@]}" --binaries-from "$app"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vulnerability-record
          path: |
            reports/
            vulnerability-record.json
          if-no-files-found: warn
          retention-days: 30

  # No tracked file keeps an unresolved merge conflict (#4900; no
  # specification governs the guard: our own design).
  conflict-markers:
    name: conflict-markers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The guard refuses each marker and skips the vendored trees
        run: bash scripts/checks/conflict-markers.sh --self-test
      - run: bash scripts/checks/conflict-markers.sh

  # ── The one-check aggregate gate (the rust-analyzer/ruff pattern) ───────────
  # A single job that needs everything and passes iff nothing failed — skipped
  # jobs count as satisfied, exactly like branch protection treats them. Point
  # branch protection at THIS check alone, so adding, renaming, or path-gating
  # jobs never requires touching repository settings. It reports on the
  # merge_group event too (#2777), so enabling a merge queue needs no change
  # here either — the jobs that skip in a queue count as satisfied, exactly as
  # the path-gated ones already do.
  conclusion:
    name: conclusion
    if: always()
    needs:
      - changes
      - fmt
      - lint
      - guards
      - deny
      - clippy
      - doc
      - codegen-drift
      - nesting-release
      - build
      - build-tests
      - instructions
      - test
      - smoke
      - test-viewer
      - helm-golden
      - unused-deps
      - ui-e2e-binary
      - ui-e2e-viewer
      - ui-e2e
      - ui-docs-shots
      - viewer-login-smoke
      - deploy-probe
      - deploy-probe-hospital
      - server-image-from-source
      - viewer-image-from-source
      - ui-screenshot-guard
      - privacy-boundary
      - migration-immutability
      - changelog
      - release-fragments
      - quickstart-config
      - shipped-viewer-configs
      - harnesses
      - vulnerability-record
      - conformance
      - crate-version
      - crate-semver
      - chart-version
      - chart-boot
      - conflict-markers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: A merge group runs the light set
        if: github.event_name == 'merge_group'
        run: |
          set -euo pipefail
          {
            echo "### The merge group's light set"
            echo
            echo "The pull request ran the full suite. A merge group runs change detection, rustfmt, the lint and guard jobs, cargo-deny, the bin link, the test archive and its smoke set (unit tests and the server's wiring tests); every other lane is skipped here and runs on the pull request and nightly (docs/ci-cd.md)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # A job that reports a verdict output (the advisory `conformance`)
          # shows it beside its result.
          echo "$NEEDS" | jq -r \
            'to_entries[] | "\(.key): \(.value.result)\(if (.value.outputs.verdict // "") != "" then " (verdict: \(.value.outputs.verdict))" else "" end)"'
          echo "$NEEDS" | jq -e 'all(.[] | .result; . == "success" or . == "skipped")' >/dev/null
