# CodeQL code scanning (security analysis).
#
# Enables GitHub code scanning so security alerts exist — the prerequisite for
# the issue "Security alerts" relationship (link an alert to a tracked issue;
# see .claude/rules/issue-relationships.md §4, which is UI-only by design).
#
# Two languages are analysed, both with build-mode "none" — no cargo build
# required, so this stays cheap and never contends for the shared ./target tree:
#   - rust    — the product source (a generally-available language, GA 2025-10-14)
#   - actions — the workflows in this directory, treated as source rather than
#               configuration, because that is what they are: code holding tokens
#               that can publish releases, images and crates.
#
# Docs: https://docs.github.com/en/code-security/code-scanning
name: CodeQL

# Pull-request runs are path-filtered to what the two analyzers read, and each
# matrix leg is then scoped by the in-workflow `changes` gate (#2798): the rust
# leg runs when Rust inputs changed, the actions leg when workflow or action
# files changed. The daily run on main analyses both, so main's alert set is at
# most a day old; a push to main starts nothing, because the pull request was
# analysed (#6515). CodeQL is not a required check, so a skipped leg blocks no
# merge.
on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
      - ".github/actions/**"
  schedule:
    - cron: "23 5 * * *" # daily 05:23 UTC, off the hour
  workflow_dispatch:

concurrency:
  group: codeql-${{ case(github.event_name == 'pull_request', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permissions by default — the analyse job grants its own; without this the
# workflow would inherit the repository default.
permissions: {}

jobs:
  # The per-leg scope (#2798): the workflow-level paths filter decides whether
  # CodeQL runs AT ALL; this job decides WHICH leg has anything to read. On
  # a schedule, a dispatch and an unresolvable base it answers
  # true/true — a gate that cannot decide runs everything, never nothing.
  changes:
    name: change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.filter.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The pull request's own paths, from its merge base (#4129).
          if [ "$EVENT_NAME" != "pull_request" ] \
            || ! git rev-parse --verify --quiet "$PR_BASE" >/dev/null \
            || ! changed="$(bash scripts/lib/changed-paths.sh "$PR_BASE" "$PR_HEAD")"; then
            echo "No diff to scope (schedule, dispatch, or base unavailable): both legs run."
            echo 'languages=["rust","actions"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          langs=()
          grep -qE '(\.rs$|(^|/)Cargo\.(toml|lock)$)' <<<"$changed" && langs+=('"rust"')
          grep -qE '^\.github/(workflows|actions)/' <<<"$changed" && langs+=('"actions"')
          joined=$(IFS=,; printf '%s' "${langs[*]-}")
          echo "languages=[${joined}]" >> "$GITHUB_OUTPUT"
          echo "languages=[${joined}]"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    # The workflow-level paths filter already required SOME relevant change, so
    # an empty language list happens only in corner diffs (e.g. a delete-only
    # rename the filters no longer match) — skipping is correct there.
    if: needs.changes.outputs.languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write # upload the SARIF results / alerts
      contents: read
      actions: read
    strategy:
      # One language must not hide the other's results.
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
