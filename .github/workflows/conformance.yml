# openEHR conformance: the Veredictum catalogue against one FerroEHR, through
# the Veredictum GitHub Action (#4449). This file compiles no server: it judges
# a server another lane built (#4539).
#
#   pull request, merge queue  ci.yml calls it with `server-binary-artifact`,
#                              the e2e-profile binary its `ui-e2e-binary` job
#                              uploaded, packaged here COPY-only with the
#                              postgres image this tree defines.
#   push to main               containers.yml calls it with the server and
#                              postgres images it pushed for that commit, by
#                              digest (`:main` for an image the push did not
#                              rebuild, judged only when its revision label
#                              names a commit with this tree's inputs, #4547).
#   release tag                release.yml calls it with the digests of its own
#                              cold-built images.
#   schedule, dispatch         ghcr.io/ferrohealth/ferroehr:main, the scanned
#                              and tagged image, unless a dispatch names one.
#
# The deployment is the one scripts/conformance.sh composes locally:
# docker/sut-ferroehr.yml with the SMART and terminology overlays, on fresh
# volumes, with FerroTERM beside FerroEHR (the `terminology` profile, pinned by
# digest) and `[terminology.server]` pointed at it (#4476). The instrument logs
# in with the Basic users of docker/ferroehr.dev.toml.
#
# The Action runs the catalogue twice, each time on fresh volumes. The
# `released` profile reads every citation against the frozen openEHR release:
# it is the record of record and the verdict of this job. The `development`
# profile reads them against the pinned master of each openEHR repository,
# which FerroEHR builds on; it is published beside the record under a heading
# and an artifact of its own and is never counted toward it. Each run covers
# the `smart` documents: the Action passes the SMART Platform base URL and
# hands the committed test issuer's key to the container by name (#4503).
#
# The Action is pinned by full commit SHA with its version in a trailing
# comment and runs the release image by digest; scripts/checks/veredictum-action.sh
# (the `veredictum-action` job in ci.yml) fails while either disagrees with
# VEREDICTUM_VERSION and VEREDICTUM_IMAGE in scripts/lib/veredictum.sh. The
# job reads the paths and the exit status from the Action's outputs, writes
# both Markdown summaries to the job summary, and uploads the JUnit, CTRF and
# results views of each profile as its own artifact. recording.har holds the
# server's response bodies and is never uploaded.
#
# Each run draws its Veredictum badges and, from a run on main that is not a
# pull request, pushes them to a branch of its own the README reads: the
# released run to veredictum-badges, the development run to
# veredictum-badges-development (Veredictum book, Badges). A caller grants
# `contents: write` for that push and `packages: read` for the pulls.
#
# No openEHR specification governs how CI runs the instrument: our own design.
name: Conformance

on:
  workflow_call:
    inputs:
      server-binary-artifact:
        description: >-
          A run artifact holding the server binary at its root, packaged with
          docker/Dockerfile's runtime-prebuilt target. Exclusive with
          server-image.
        required: false
        type: string
        default: ""
      server-image:
        description: >-
          The FerroEHR image to judge, ghcr.io/ferrohealth/ferroehr by digest
          or tag. Empty with no artifact: the `:main` tag.
        required: false
        type: string
        default: ""
      postgres-image:
        description: >-
          The database image, ghcr.io/ferrohealth/ferroehr-postgres by digest
          or tag. Empty: built from docker/postgres beside an artifact, the
          `:main` tag beside an image.
        required: false
        type: string
        default: ""
      advisory:
        description: >-
          Report the verdict without failing: the job ends green with the
          verdict in the `verdict` output, the job summary and an annotation,
          and a pipeline defect fails the job without failing the caller's run.
        required: false
        type: boolean
        default: false
    outputs:
      verdict:
        description: >-
          `passed` when the released-profile run passed, `failed` when it did
          not or the run could not be judged; empty when the job ended before
          its verdict.
        value: ${{ jobs.conformance.outputs.verdict }}
  schedule:
    # Tue + Fri 04:37 UTC, off the hour and in a slot of its own (read the
    # estate's slots with `grep -rE '^ +- cron:' .github/workflows/`).
    - cron: "37 4 * * 2,5"
  workflow_dispatch:
    inputs:
      server-image:
        description: "FerroEHR image by digest or tag (empty: ghcr.io/ferrohealth/ferroehr:main)"
        required: false
        type: string
        default: ""
      postgres-image:
        description: "Database image by digest or tag (empty: ghcr.io/ferrohealth/ferroehr-postgres:main)"
        required: false
        type: string
        default: ""

# No workflow-level concurrency: the callers own it (ci.yml cancels a
# superseded pull-request run, containers.yml and release.yml queue), and a
# group here would be shared between callers and pending-cancel one of them.
permissions: {}

jobs:
  # `veredictum validate --statement` in the pinned image: the party statement
  # against the catalogue, before any server is started.
  statement:
    name: conformance statement review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review the party statement against the pinned catalogue (released)
        run: bash scripts/conformance.sh review
      - name: Review the party statement against the pinned catalogue (development)
        env:
          CONF_PROFILE: development
        run: bash scripts/conformance.sh review

  conformance:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # An advisory caller's run must not fail on this job (#4600): a merge
    # queue run that ends `failure` fails its queue entry even while the
    # required check passed. Only an earlier step can still fail it here.
    continue-on-error: ${{ inputs.advisory == true }}
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    permissions:
      # Each run pushes its badges to its own branch: veredictum-badges and
      # veredictum-badges-development.
      # The Action pushes only from a run on main that is not a pull request.
      contents: write
      packages: read # pull the images under test from GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Which server and database this run judges. An image reference must name
      # this repository's GHCR images by digest or tag, so an input cannot point
      # the run at anything else.
      - id: images
        name: Resolve the images under test
        env:
          SERVER_ARTIFACT: ${{ inputs.server-binary-artifact }}
          SERVER_IMAGE: ${{ inputs.server-image }}
          POSTGRES_IMAGE: ${{ inputs.postgres-image }}
        shell: bash
        run: |
          set -euo pipefail
          ref_re='^ghcr\.io/ferrohealth/%s(@sha256:[0-9a-f]{64}|:[A-Za-z0-9_][A-Za-z0-9._-]{0,127})$'
          # shellcheck disable=SC2059 # the pattern is the format on purpose
          server_re=$(printf "$ref_re" ferroehr)
          # shellcheck disable=SC2059 # the pattern is the format on purpose
          postgres_re=$(printf "$ref_re" ferroehr-postgres)
          if [ -n "$SERVER_ARTIFACT" ] && [ -n "$SERVER_IMAGE" ]; then
            echo "::error::server-binary-artifact and server-image name two servers; pass one" >&2
            exit 1
          fi
          if [ -n "$SERVER_ARTIFACT" ]; then
            echo "server=artifact" >> "$GITHUB_OUTPUT"
            postgres_default=build
          else
            SERVER_IMAGE="${SERVER_IMAGE:-ghcr.io/ferrohealth/ferroehr:main}"
            [[ "$SERVER_IMAGE" =~ $server_re ]] || { echo "::error::server-image '$SERVER_IMAGE' is not ghcr.io/ferrohealth/ferroehr by digest or tag" >&2; exit 1; }
            { echo "server=image"; echo "server-ref=$SERVER_IMAGE"; } >> "$GITHUB_OUTPUT"
            postgres_default=ghcr.io/ferrohealth/ferroehr-postgres:main
          fi
          POSTGRES_IMAGE="${POSTGRES_IMAGE:-$postgres_default}"
          if [ "$POSTGRES_IMAGE" = build ]; then
            echo "postgres=build" >> "$GITHUB_OUTPUT"
          else
            [[ "$POSTGRES_IMAGE" =~ $postgres_re ]] || { echo "::error::postgres-image '$POSTGRES_IMAGE' is not ghcr.io/ferrohealth/ferroehr-postgres by digest or tag" >&2; exit 1; }
            { echo "postgres=image"; echo "postgres-ref=$POSTGRES_IMAGE"; } >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.images.outputs.server == 'image' || steps.images.outputs.postgres == 'image'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The images a lane pushed, pulled as they were pushed: nothing is
      # compiled or rebuilt, so the run judges what ships.
      - name: Pull the images under test
        if: steps.images.outputs.server == 'image' || steps.images.outputs.postgres == 'image'
        env:
          SERVER_REF: ${{ steps.images.outputs.server-ref }}
          POSTGRES_REF: ${{ steps.images.outputs.postgres-ref }}
        shell: bash
        run: |
          set -euo pipefail
          pull() {
            docker pull "$1"
            docker tag "$1" "$2"
            printf -- '- %s: %s\n' "$2" "$(docker inspect --format '{{index .RepoDigests 0}}' "$1")" >> "$GITHUB_STEP_SUMMARY"
          }
          printf '## The images under test\n\n' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$SERVER_REF" ]; then pull "$SERVER_REF" ferroehr:conformance; fi
          if [ -n "$POSTGRES_REF" ]; then pull "$POSTGRES_REF" ferroehr-postgres:conformance; fi
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
      # A tag can name an image older than this tree: `:main` moves only when
      # scan-and-tag.yml passes its scan (#4547). An image is judged only when
      # its org.opencontainers.image.revision label names a commit whose inputs
      # equal this tree's (scripts/lib/image-inputs.sh), and the summary names
      # the commit. A dispatch that names an image judges it at any revision
      # and says so.
      - name: Refuse an image built from other inputs than this tree's
        if: steps.images.outputs.server == 'image' || steps.images.outputs.postgres == 'image'
        env:
          SERVER_REF: ${{ steps.images.outputs.server-ref }}
          POSTGRES_REF: ${{ steps.images.outputs.postgres-ref }}
          SERVER_NAMED: ${{ github.event_name == 'workflow_dispatch' && inputs.server-image != '' }}
          POSTGRES_NAMED: ${{ github.event_name == 'workflow_dispatch' && inputs.postgres-image != '' }}
          TREE: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          # judge <kind> <reference> <local tag> <named by a dispatch>
          judge() {
            local revision changed status=0 line
            revision=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$3")
            changed=$(bash scripts/lib/image-inputs.sh same "$1" "$revision" "$TREE") || status=$?
            case "$status" in
              0)
                if [ "$revision" = "$TREE" ]; then
                  line="built from $revision, the tree under test"
                else
                  line="built from $revision, whose $1 inputs equal those of the tree under test ($TREE)"
                fi
                ;;
              1)
                printf '%s\n' "$changed"
                line="built from $revision, whose $1 inputs differ from the tree under test ($TREE) in $(grep -c . <<<"$changed") file(s)"
                ;;
              *) line="its revision label '$revision' names no commit this run can compare with $TREE" ;;
            esac
            if [ "$status" -ne 0 ] && [ "$4" != true ]; then
              echo "::error::$2 is $line; this run judges no image built from other inputs than the tree's"
              printf -- '- %s: refused, %s\n' "$2" "$line" >> "$GITHUB_STEP_SUMMARY"
              bad=1
            else
              printf -- '- %s: %s\n' "$2" "$line" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          printf '## The revisions under test\n\n' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$SERVER_REF" ]; then judge server "$SERVER_REF" ferroehr:conformance "$SERVER_NAMED"; fi
          if [ -n "$POSTGRES_REF" ]; then judge postgres "$POSTGRES_REF" ferroehr-postgres:conformance "$POSTGRES_NAMED"; fi
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          exit "$bad"
      # The binary the caller's run compiled, packaged COPY-only.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.images.outputs.server == 'artifact'
        with:
          name: ${{ inputs.server-binary-artifact }}
          path: bin/amd64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.images.outputs.server == 'artifact' || steps.images.outputs.postgres == 'build'
      - name: Package the server image (COPY-only)
        if: steps.images.outputs.server == 'artifact'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr:conformance
      # The database image this tree defines: the compose fallback names a tag
      # no registry serves.
      - name: Package the postgres image
        if: steps.images.outputs.postgres == 'build'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/postgres
          file: docker/postgres/Dockerfile
          load: true
          tags: ferroehr-postgres:conformance
      - id: compose
        name: Compose FerroEHR and FerroTERM on fresh volumes
        env:
          FERROEHR_IMAGE: ferroehr:conformance
          FERROEHR_POSTGRES_IMAGE: ferroehr-postgres:conformance
          SKIP_BUILD: "1"
        run: bash scripts/conformance.sh up
      # The Basic users of docker/ferroehr.dev.toml and the SMART test issuer
      # under docs/conformance/party/smart/ are committed test material: they
      # guard nothing but this runner's throwaway stack. The IXIT's
      # `scoped_tokens.mint` signs each SMART token with that key, which the
      # Action mounts into the container by name; no token is written to the
      # workspace.
      - name: Head the released run's job summary
        if: ${{ !cancelled() && steps.compose.outcome == 'success' }}
        run: |
          printf '## Released profile: the record of record\n\nThe catalogue read against the frozen openEHR release. This run is the verdict of this job.\n\n' >> "$GITHUB_STEP_SUMMARY"
      - id: released
        if: ${{ !cancelled() && steps.compose.outcome == 'success' }}
        uses: Vernum-Projecten/Veredictum@bfcb62d0514eb065396f3786a8476de306fd13b3 # v0.3.3
        # The verdict step below fails the job on this run's exit-code output,
        # after the views of both runs are uploaded.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VEREDICTUM_CDR_USER: ferroehr
          VEREDICTUM_CDR_PASSWORD: ferroehr
          VEREDICTUM_CDR_ADMIN_USER: ferroehr-admin
          VEREDICTUM_CDR_ADMIN_PASSWORD: ferroehr
          VEREDICTUM_SCOPED_TOKEN_KEY_FILE: docs/conformance/party/smart/cnf-smart-test.key.pem
        with:
          base-url: http://127.0.0.1:8080/ferroehr/rest/openehr/v1
          platform-url: http://127.0.0.1:8080/ferroehr/rest
          statement: docs/conformance/party/ferroehr/statement.json
          ixit: docs/conformance/party/ferroehr/ixit.json
          auth: basic
          admin-auth: basic
          profile: released
          out-dir: conformance-results/released
          badge-branch: veredictum-badges
          image: ghcr.io/vernum-projecten/veredictum@sha256:df50feb4df9de262be64502ff999d0bbe784ba623ffbfa32313b52769a594efd
      # Fresh volumes again, so the development run starts on the ground the
      # released run had.
      - id: recompose
        name: Recompose FerroEHR and FerroTERM on fresh volumes
        if: ${{ !cancelled() && steps.compose.outcome == 'success' }}
        env:
          FERROEHR_IMAGE: ferroehr:conformance
          FERROEHR_POSTGRES_IMAGE: ferroehr-postgres:conformance
          SKIP_BUILD: "1"
        run: bash scripts/conformance.sh up
      - name: Head the development run's job summary
        if: ${{ !cancelled() && steps.recompose.outcome == 'success' }}
        run: |
          printf '## Development profile: published beside the record\n\nThe same catalogue read against the pinned master of each openEHR repository. It is never counted toward the released record and is no verdict of this job.\n\n' >> "$GITHUB_STEP_SUMMARY"
      - id: development
        if: ${{ !cancelled() && steps.recompose.outcome == 'success' }}
        uses: Vernum-Projecten/Veredictum@bfcb62d0514eb065396f3786a8476de306fd13b3 # v0.3.3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VEREDICTUM_CDR_USER: ferroehr
          VEREDICTUM_CDR_PASSWORD: ferroehr
          VEREDICTUM_CDR_ADMIN_USER: ferroehr-admin
          VEREDICTUM_CDR_ADMIN_PASSWORD: ferroehr
          VEREDICTUM_SCOPED_TOKEN_KEY_FILE: docs/conformance/party/smart/cnf-smart-test.key.pem
        with:
          base-url: http://127.0.0.1:8080/ferroehr/rest/openehr/v1
          platform-url: http://127.0.0.1:8080/ferroehr/rest
          statement: docs/conformance/party/ferroehr/statement.json
          ixit: docs/conformance/party/ferroehr/ixit.json
          auth: basic
          admin-auth: basic
          profile: development
          out-dir: conformance-results/development
          badge-branch: veredictum-badges-development
          image: ghcr.io/vernum-projecten/veredictum@sha256:df50feb4df9de262be64502ff999d0bbe784ba623ffbfa32313b52769a594efd
      # The views each run's outputs name, one directory per profile, so the
      # two are never mixed. recording.har is never among them.
      - name: Collect the views the Action wrote
        if: ${{ !cancelled() }}
        env:
          RELEASED_RESULTS: ${{ steps.released.outputs.results }}
          RELEASED_JUNIT: ${{ steps.released.outputs.junit }}
          RELEASED_CTRF: ${{ steps.released.outputs.ctrf }}
          RELEASED_SUMMARY: ${{ steps.released.outputs.summary }}
          DEVELOPMENT_RESULTS: ${{ steps.development.outputs.results }}
          DEVELOPMENT_JUNIT: ${{ steps.development.outputs.junit }}
          DEVELOPMENT_CTRF: ${{ steps.development.outputs.ctrf }}
          DEVELOPMENT_SUMMARY: ${{ steps.development.outputs.summary }}
        shell: bash
        run: |
          set -euo pipefail
          for profile in released development; do
            prefix="${profile^^}"
            mkdir -p "conformance-views/$profile"
            for view in RESULTS JUNIT CTRF SUMMARY; do
              var="${prefix}_${view}"
              path="${!var}"
              if [ -n "$path" ] && [ -f "$path" ]; then
                cp "$path" "conformance-views/$profile/"
              fi
            done
          done
          ls -lR conformance-views
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: conformance-views-released
          path: conformance-views/released
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: conformance-views-development
          path: conformance-views/development
          if-no-files-found: warn
      # The released run decides the job. The development run fails it only
      # when it could not run at all, which is a defect of this pipeline. An
      # advisory caller gets the same verdict as an output, a summary line and
      # a warning, and a green job.
      - id: verdict
        name: The verdict of the released run
        if: ${{ !cancelled() }}
        env:
          RELEASED_EXIT: ${{ steps.released.outputs.exit-code }}
          DEVELOPMENT_EXIT: ${{ steps.development.outputs.exit-code }}
          ADVISORY: ${{ inputs.advisory == true }}
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          problems=()
          case "$DEVELOPMENT_EXIT" in
            0) echo "the development-profile run passed" ;;
            1) echo "::warning::the development-profile run has failed or errored rows; it is published beside the record and is no verdict" ;;
            3) echo "::warning::the development-profile run has inconclusive rows; it is published beside the record and is no verdict" ;;
            *) problems+=("the development-profile run could not run (exit status ${DEVELOPMENT_EXIT:-none})"); bad=1 ;;
          esac
          if [ "$RELEASED_EXIT" != 0 ]; then
            problems+=("the released-profile run exited ${RELEASED_EXIT:-without a status}")
            bad=1
          fi
          if [ "$bad" = 0 ]; then verdict=passed; else verdict=failed; fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          if [ "$ADVISORY" = true ]; then
            level=warning
            printf '## Verdict: %s (advisory, not gating)\n\n' "$verdict" >> "$GITHUB_STEP_SUMMARY"
          else
            level=error
            printf '## Verdict: %s\n\n' "$verdict" >> "$GITHUB_STEP_SUMMARY"
          fi
          for problem in ${problems[@]+"${problems[@]}"}; do
            echo "::$level::$problem"
            printf -- '- %s\n' "$problem" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$ADVISORY" = true ]; then
            exit 0
          fi
          exit "$bad"
      - name: The deployment's state, when the run did not pass
        if: ${{ failure() }}
        run: docker compose -p ferroehr-cnf ps --all
      - name: Tear the deployment down
        if: ${{ always() }}
        run: bash scripts/conformance.sh down
