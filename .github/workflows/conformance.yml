# openEHR conformance: the Veredictum catalogue against FerroEHR built from
# this commit, through the Veredictum GitHub Action (#4449).
#
# The deployment is the one scripts/conformance.sh composes locally:
# docker/sut-ferroehr.yml with the SMART and terminology overlays, on fresh
# volumes, with FerroTERM beside FerroEHR (the `terminology` profile, pinned by
# digest) and `[terminology.server]` pointed at it (#4476). The server image
# packages the binary compiled natively below (`runtime-prebuilt`), and the
# instrument logs in with the Basic users of docker/ferroehr.dev.toml.
#
# The Action is pinned by full commit SHA with its version in a trailing
# comment and runs the release image by digest; scripts/checks/veredictum-action.sh
# (the `veredictum-action` job in ci.yml) fails while either disagrees with
# VEREDICTUM_VERSION and VEREDICTUM_IMAGE in scripts/lib/veredictum.sh. The
# job fails on a failed or errored row, writes the Markdown summary to the job
# summary, and uploads the JUnit, CTRF and results views. recording.har holds
# the server's response bodies and is never uploaded.
#
# The Action forwards no SMART Platform base URL and no scoped tokens, so the
# `smart` documents run in a step of their own after it (#4450): the same
# pinned image drives them against the same deployment through
# `scripts/conformance.sh smart`, minting each token in memory from the
# committed test issuer docker/sut-smart.yml trusts. Their views are uploaded
# beside the Action's and follow them in the job summary under a heading of
# their own; Veredictum 0.3.0 merges no two results documents.
#
# Runs on a pull request whose paths scripts/lib/change-lanes.sh classifies
# into the `conformance` lane (server code, the party set, the conformance
# compose files, this workflow), on main, on a release tag and on a schedule.
# A release is published by the release workflow's own token, which starts no
# workflow, so the tag push is the release trigger here.
#
# No openEHR specification governs how CI runs the instrument: our own design.
name: Conformance

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Tue + Fri 04:37 UTC, off the hour and in a slot of its own (read the
    # estate's slots with `grep -rE '^ +- cron:' .github/workflows/`).
    - cron: "37 4 * * 2,5"
  workflow_dispatch:

concurrency:
  group: conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  changes:
    name: change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      conformance: ${{ steps.filter.outputs.conformance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Every event but a pull request runs the catalogue; so does a pull
          # request whose base cannot be diffed against.
          if [ "$EVENT_NAME" != "pull_request" ] \
            || ! git rev-parse --verify --quiet "$PR_BASE" >/dev/null \
            || ! changed=$(bash scripts/lib/changed-paths.sh "$PR_BASE" "$PR_HEAD"); then
            echo "conformance=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/lib/change-lanes.sh conformance <<<"$changed" | tee -a "$GITHUB_OUTPUT"

  # `veredictum validate --statement` in the pinned image: the party statement
  # against the catalogue, before any server is built.
  statement:
    name: conformance statement review
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review the party statement against the pinned catalogue
        run: bash scripts/conformance.sh review

  # The server binary, compiled as ci.yml's `ui-e2e-binary` compiles it: in
  # the pinned rust:*-slim-trixie image (glibc of the distroless runtime), e2e
  # profile, behind the same exact-key binary cache, so a commit CI has
  # already built reuses that binary.
  binary:
    name: conformance server binary
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    container: rust:1.99.1-slim-trixie@sha256:00544ccc9431a2fe93e65185d21381b0a039342f5cefcf84fbddac273c9e573d
    env:
      SOURCE_DATE_EPOCH: "1700000000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify toolchain pins (container == rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          channel=$(grep -E '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')
          have=$(rustc --version | awk '{print $2}')
          if [ "$channel" != "$have" ]; then
            echo "::error::Job container rustc ($have) != rust-toolchain.toml ($channel). Bump the container: tag."
            exit 1
          fi
      # The release-tag run builds cold: no cache is restored on a tag, so the
      # verdict on a release never rests on bytes a cache handed it. The other
      # runs publish nothing and read the caches ci.yml writes.
      - id: binary-cache
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: # zizmor: ignore[cache-poisoning]
          path: bin/amd64/ferroehr
          key: ui-e2e-server-bin-1.99.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'crates/**', 'app/ferroehr/**', 'app/ferroehr-rest/**', 'app/ferroehr-server/**', 'tools/**') }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.ref_type != 'tag' && steps.binary-cache.outputs.cache-hit != 'true'
        with: # zizmor: ignore[cache-poisoning]
          shared-key: ui-e2e-server-binary
          cache-targets: false
          save-if: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11 # zizmor: ignore[cache-poisoning]
        if: github.ref_type != 'tag' && steps.binary-cache.outputs.cache-hit != 'true'
      - name: Build the server binary (e2e profile, native)
        if: steps.binary-cache.outputs.cache-hit != 'true'
        env:
          SCCACHE_GHA_ENABLED: ${{ github.ref_type != 'tag' }}
          # ci.yml's binary job is the writer; this lane only reads.
          SCCACHE_GHA_RW_MODE: READ_ONLY
          RUSTC_WRAPPER: ${{ github.ref_type != 'tag' && 'sccache' || '' }}
          CARGO_INCREMENTAL: "0"
        shell: bash
        run: |
          set -euo pipefail
          cargo build --profile e2e --locked -p ferroehr-server
          strip target/e2e/ferroehr
          mkdir -p bin/amd64
          install -m0755 target/e2e/ferroehr bin/amd64/ferroehr
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-server-binary
          path: bin/amd64/ferroehr
          if-no-files-found: error
          retention-days: 1

  conformance:
    name: conformance
    needs: [changes, binary]
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-server-binary
          path: bin/amd64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Package the server image (COPY-only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr:conformance
      # The database image this tree defines: the compose fallback names a tag
      # no registry serves.
      - name: Package the postgres image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/postgres
          file: docker/postgres/Dockerfile
          load: true
          tags: ferroehr-postgres:conformance
      - id: compose
        name: Compose FerroEHR and FerroTERM on fresh volumes
        env:
          FERROEHR_IMAGE: ferroehr:conformance
          FERROEHR_POSTGRES_IMAGE: ferroehr-postgres:conformance
          SKIP_BUILD: "1"
        run: bash scripts/conformance.sh up
      - name: Head the catalogue's job summary
        run: printf '## The catalogue (the Veredictum Action)\n\n' >> "$GITHUB_STEP_SUMMARY"
      # The Basic users of docker/ferroehr.dev.toml, committed test material:
      # the dev password guards nothing but this runner's throwaway stack.
      - id: veredictum
        uses: Vernum-Projecten/Veredictum@f6e99c97b322e0846ae62f28969a2b092d5cb167 # v0.3.0
        env:
          VEREDICTUM_CDR_USER: ferroehr
          VEREDICTUM_CDR_PASSWORD: ferroehr
          VEREDICTUM_CDR_ADMIN_USER: ferroehr-admin
          VEREDICTUM_CDR_ADMIN_PASSWORD: ferroehr
        with:
          base-url: http://127.0.0.1:8080/ferroehr/rest/openehr/v1
          statement: docs/conformance/party/ferroehr/statement.json
          ixit: docs/conformance/party/ferroehr/ixit.json
          auth: basic
          admin-auth: basic
          out-dir: conformance-results
          image: ghcr.io/vernum-projecten/veredictum@sha256:64ab6ee89db9efa093630d65e6f878b1b62c66193129fd3128d49291e28b4d8c
      # The image is VEREDICTUM_IMAGE of scripts/lib/veredictum.sh, the digest
      # the Action step above is held to. The key it mints with is committed
      # test material (docs/conformance/party/smart/README.md); no token is
      # written to the workspace, and the recording is never uploaded.
      - id: smart
        name: Drive the SMART documents beside the Action
        if: ${{ !cancelled() && steps.compose.outcome == 'success' }}
        env:
          CONF_BASE_URL: http://127.0.0.1:8080/ferroehr/rest/openehr/v1
          CONF_PLATFORM_URL: http://127.0.0.1:8080
          CONF_SMART_OUT: conformance-results-smart
        run: |
          set -euo pipefail
          rc=0
          bash scripts/conformance.sh smart || rc=$?
          if [ -f conformance-results-smart/summary.md ]; then
            {
              printf '## The SMART on openEHR documents (the step beside the Action)\n\n'
              cat conformance-results-smart/summary.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: conformance-views
          path: |
            conformance-results/results.json
            conformance-results/junit.xml
            conformance-results/ctrf.json
            conformance-results/summary.md
            conformance-results-smart/results.json
            conformance-results-smart/junit.xml
            conformance-results-smart/ctrf.json
            conformance-results-smart/summary.md
          if-no-files-found: warn
      - name: The deployment's state, when the run did not pass
        if: ${{ failure() }}
        run: docker compose -p ferroehr-cnf ps --all
      - name: Tear the deployment down
        if: ${{ always() }}
        run: bash scripts/conformance.sh down
