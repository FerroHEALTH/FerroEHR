# .github/workflows/containers.yml
#
# Container images, built for speed:
#
#   1. The `ferroehr` binary is compiled OUTSIDE Docker, natively per
#      architecture (amd64 on ubuntu-26.04, arm64 on ubuntu-26.04-arm — no
#      QEMU emulation anywhere), inside a rust:*-slim-trixie job container
#      so the binary links against the same glibc (Debian 13 / 2.41) as the
#      distroless cc-debian13 runtime image. Swatinem/rust-cache makes warm
#      builds incremental.
#   2. The image build itself is a COPY-only packaging step — `docker/Dockerfile`
#      built with `--target runtime-prebuilt` (the same file compose builds with
#      `--target runtime-from-source`; ONE runtime stage, zero drift — issue #282
#      D5). A multi-arch buildx push takes seconds because no code runs inside.
#   3. The smoke test pulls the pushed image by digest instead of rebuilding.
#   4. The openEHR conformance run (the reusable conformance.yml) judges the
#      pushed server and postgres images by digest and publishes the Veredictum
#      badges, so main compiles no server for conformance (#4539).
#
# DEVELOP PUSHES AND MANUAL DISPATCHES ONLY (#2776). A `v*` tag is owned end to
# end by release.yml — THE release pipeline — which runs these same lanes with
# every ordering expressed as a `needs` edge. Nothing else triggers on a tag, so
# nothing has to poll or guess whether an image exists yet.
name: Containers

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queued, never cancelled: a run pushes its images by digest before
# scan-and-tag applies their tags, so a run cancelled in between leaves
# manifests nothing reaches (the GHCR orphans of #3731). A newer push waits for
# the running build; GitHub keeps only the newest pending run.
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false

# The image names the STEPS in this file read, derived from the repository owner
# — the same derivation build-chart.yml and image-scan.yml use. The `uses:` lanes
# (build-image.yml, scan-and-tag.yml) repeat the derivation inline because the
# `env` context does not exist at job level, which is a documented context
# restriction and not a choice
# (https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability).
# They used to repeat the OWNER as a literal instead (#2775). The postgres name
# was declared here too until the tagging steps that read it moved into the
# reusable lane (#2776) — a constant nothing reads is drift waiting to happen.
env:
  # A FerroEHR started by any step of this workflow sends no usage report to
  # FerroPULSE: compose interpolates this into every server it brings up, and
  # scripts/checks/usage-report-off.sh holds each `docker run` and Helm install
  # to its own explicit switch.
  FERROEHR__USAGE_REPORT__ENABLED: "false"
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/ferrohealth/ferroehr
  VIEWER_IMAGE: ghcr.io/ferrohealth/ferroehr-viewer

permissions: {}

jobs:
  # ── Detect which images need (re)building ───────────────────────────────────
  # The ci.yml owner ruling (2026-07-17) applied to images: a push that touches
  # none of an image's build inputs must not recompile and republish it. A
  # docs-only main push used to run FOUR native release compiles (two
  # binaries × two arches) for byte-identical
  # images. A manual dispatch always builds everything (the per-job conditions
  # below); a release builds everything in release.yml, which has no filter at
  # all, so a release can never miss an image.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # A manual dispatch builds everything BY DECLARATION rather than by the
      # filter degrading (dispatch payloads carry no `before`, so paths-filter
      # used to warn and diff the whole tree — same outcome, accidental
      # mechanism).
      app: ${{ steps.everything.outputs.all || steps.filter.outputs.app }}
      viewer: ${{ steps.everything.outputs.all || steps.filter.outputs.viewer }}
      postgres: ${{ steps.everything.outputs.all || steps.filter.outputs.postgres }}
    steps:
      - name: A dispatch builds everything
        id: everything
        if: github.event_name == 'workflow_dispatch'
        run: echo "all=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: steps.everything.outcome == 'skipped'
        with:
          # The app filter mirrors the ui-e2e-binary cache key in ci.yml (the
          # inputs the server build reads); viewer mirrors the ui-e2e-console
          # key plus its own Dockerfile and the compose file its smoke lane
          # drives. Shared workspace manifests appear in both — a lockfile bump
          # rebuilds both images, correctly.
          filters: |
            app:
              - 'crates/**'
              - 'app/ferroehr/**'
              - 'app/ferroehr-rest/**'
              - 'app/ferroehr-server/**'
              - 'tools/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'docker/Dockerfile'
              - 'docker/smoke-test.sh'
              - 'docker-compose.yml'
              - '.github/workflows/containers.yml'
            viewer:
              - 'crates/**'
              - 'app/ferroehr-viewer/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'docker/viewer/**'
              - 'docker-compose.yml'
              # The battery its smoke lane drives.
              - 'scripts/ui-e2e.sh'
              - '.github/workflows/containers.yml'
            postgres:
              - 'docker/postgres/**'
              - '.github/workflows/containers.yml'

  # ── Compile the server binary natively per arch (no QEMU, no in-Docker cargo) ─
  dockerfile-lint:
    name: Dockerfile lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - docker/Dockerfile
          - docker/postgres/Dockerfile
          - docker/viewer/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # hadolint over each Dockerfile. Configuration lives in `.hadolint.yaml`,
      # where any rule we deliberately violate is named with its reason — never
      # a blanket disable (OWASP Docker Security Cheat Sheet rule 9).
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: .hadolint.yaml
          failure-threshold: warning

  # Secret detection + Docker misconfiguration over the tree, in one tool.
  # Trivy's `config` scanner covers the misconfiguration half of rule 9 and its
  # `secret` scanner the credential half, so this replaces a separate gitleaks
  # lane rather than sitting beside one. Deliberate fixtures (the quickstart's
  # Argon2 hash, the development JWT secrets) are allow-listed by path in
  # `.trivyignore.yaml` with their reasons.
  tree-scan:
    name: secret + misconfiguration scan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          exit-code: '1'
          severity: HIGH,CRITICAL
          trivy-config: trivy.yaml

  binary:
    name: binary (${{ matrix.platform }})
    needs: changes
    # Skip cascades: app-image needs this job, smoke needs app-image — a
    # skipped need skips the dependent automatically, so the whole app lane
    # turns off together.
    if: >-
      needs.changes.outputs.app == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-26.04-arm
    # Debian 13 (trixie) container so the produced binary targets glibc 2.41,
    # matching gcr.io/distroless/cc-debian13 exactly. The tag must equal the
    # rust-toolchain.toml channel — verified below, never assumed.
    # Digest-pinned, not tag-pinned: a tag is mutable, so a re-run of an
    # already-reviewed commit could build against different bytes. The index
    # digest (not a per-platform one) so both runner architectures resolve.
    container: rust:1.99.1-slim-trixie@sha256:00544ccc9431a2fe93e65185d21381b0a039342f5cefcf84fbddac273c9e573d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify toolchain pins (container + Dockerfile == rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          channel=$(grep -E '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')
          have=$(rustc --version | awk '{print $2}')
          arg=$(grep -E '^ARG RUST_VERSION=' docker/Dockerfile | sed -n 1p | cut -d= -f2)
          echo "rust-toolchain=$channel  container-rustc=$have  Dockerfile ARG=$arg"
          if [ "$channel" != "$have" ]; then
            echo "::error::Job container rustc ($have) != rust-toolchain.toml ($channel). Bump the container: tag in containers.yml."
            exit 1
          fi
          if [ "$channel" != "$arg" ]; then
            echo "::error::docker/Dockerfile RUST_VERSION ($arg) != rust-toolchain.toml ($channel)."
            exit 1
          fi

      # This lane publishes images, so a restored cache is release input — kept
      # only because no untrusted run can write these keys: the workflow has no
      # `pull_request` trigger at all, and a cache created on a child branch is
      # unreadable from the default branch anyway
      # (docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching
      # — "Workflow runs cannot restore caches created for child branches or
      # sibling branches"). The tag/publish lanes that lack that property
      # (release.yml, publish-crates.yml) build cold instead.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: # zizmor: ignore[cache-poisoning]
          shared-key: containers-${{ matrix.platform }}

      # `cargo auditable` embeds the compressed dependency list in the binary's
      # own `.dep-v0` section, which survives the strip below, so a scan of the
      # image this binary lands in sees its Rust dependencies (#3675;
      # https://github.com/rust-secure-code/cargo-auditable). The pin matches
      # docker/Dockerfile and release-build.yml; the action fetches the
      # prebuilt binary and installs curl and jq into the slim container itself.
      - name: Install cargo-auditable
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-auditable@0.7.5

      - name: Build (release, native)
        # The binary is produced by the ferroehr-server package (bin name
        # `ferroehr`) since the crate consolidation; `-p ferroehr` is the
        # platform LIBRARY and yields no binary to strip.
        # build.rs stamps the REVISION value into /management/info; passing
        # github.sha here (an env, never interpolated into a shell) makes the
        # provenance explicit and does not depend on git being present in the
        # slim job container (it is not). Empty/absent degrades to `unknown`.
        env:
          REVISION: ${{ github.sha }}
        run: cargo auditable build --release --locked -p ferroehr-server

      - name: Strip
        run: strip target/release/ferroehr

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferroehr-${{ matrix.platform }}
          path: target/release/ferroehr
          if-no-files-found: error
          retention-days: 1

  # ── Package + push the multi-arch app image (COPY-only; seconds) ────────────
  # This job's NAME used to be load-bearing: the chart lane polled another run
  # for a job called `app image / build` before pulling the image it judged the
  # chart against. That coupling is gone (#2776) — the chart is a `needs`-ordered
  # job of the release pipeline, so nothing outside this workflow reads this name.
  app-image:
    name: app image
    needs: binary
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # Sigstore, for the signed attestations
      attestations: write # store them against this repository
    # The build + its attestation live in the reusable build-image.yml — the
    # SLSA Build L3 construction (#2140): this caller passes data-only inputs
    # and cannot add steps beside the signing. Labels mirror the Dockerfile's;
    # scripts/checks/image-labels.sh fails if the two ever disagree.
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/ferrohealth/ferroehr
      defer-tags: true
      dockerfile: docker/Dockerfile
      target: runtime-prebuilt
      binary-artifact-prefix: ferroehr
      labels: |
        org.opencontainers.image.title=FerroEHR
        org.opencontainers.image.description=Pure-Rust, openEHR-conformant clinical data repository (ITS-REST 1.1.0 + AQL 1.1)
        org.opencontainers.image.source=https://github.com/FerroHEALTH/FerroEHR
        org.opencontainers.image.url=https://ferroehr.eu/
        org.opencontainers.image.documentation=https://ferroehr.eu/docs/latest/
        org.opencontainers.image.vendor=Cadasto B.V.
        org.opencontainers.image.authors=Cadasto B.V. <https://www.cadasto.com/contact/>
        org.opencontainers.image.licenses=BUSL-1.1
        org.opencontainers.image.base.name=gcr.io/distroless/cc-debian13:nonroot
        org.opencontainers.image.base.digest=sha256:3ee00291cf386ec52a552e6a858d555debd74776eb4bfa53fa3df2cd6677515e

  # ── Viewer: server binary per arch ──────────────────────────────────────────
  # The binary carries the FerroUI stylesheet, theme and scripts it serves, so
  # it is the whole viewer. Same glibc rationale as the app binary job.
  viewer-binary:
    name: viewer binary (${{ matrix.platform }})
    needs: changes
    # Same cascade as the app lane: viewer-image skips with this job.
    if: >-
      needs.changes.outputs.viewer == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-26.04-arm
    # Digest-pinned, not tag-pinned: a tag is mutable, so a re-run of an
    # already-reviewed commit could build against different bytes. The index
    # digest (not a per-platform one) so both runner architectures resolve.
    container: rust:1.99.1-slim-trixie@sha256:00544ccc9431a2fe93e65185d21381b0a039342f5cefcf84fbddac273c9e573d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify toolchain pin (container == rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          channel=$(grep -E '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')
          have=$(rustc --version | awk '{print $2}')
          if [ "$channel" != "$have" ]; then
            echo "::error::Job container rustc ($have) != rust-toolchain.toml ($channel)."
            exit 1
          fi

      # Same publishing-lane reasoning as the app binary job above.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: # zizmor: ignore[cache-poisoning]
          shared-key: containers-viewer-${{ matrix.platform }}

      # The viewer binary carries its dependency list too (#3675): the same
      # pinned `cargo auditable` as the app binary job above.
      - name: Install cargo-auditable
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-auditable@0.7.5

      - name: Build the viewer binary (release, native)
        run: cargo auditable build --release --locked -p ferroehr-viewer

      - name: Strip
        run: strip target/release/ferroehr-viewer

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferroehr-viewer-${{ matrix.platform }}
          path: target/release/ferroehr-viewer
          if-no-files-found: error
          retention-days: 1

  # ── Package + push the multi-arch viewer image (COPY-only) ──────────────────
  viewer-image:
    name: viewer image
    needs: viewer-binary
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # Sigstore, for the signed attestations
      attestations: write # store them against this repository
    # The reusable SLSA Build L3 lane; see the app image above.
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/ferrohealth/ferroehr-viewer
      defer-tags: true
      dockerfile: docker/viewer/Dockerfile
      target: runtime-prebuilt
      binary-artifact-prefix: ferroehr-viewer
      labels: |
        org.opencontainers.image.title=FerroEHR Viewer
        org.opencontainers.image.description=Viewer for openEHR ITS-REST CDRs — pure-Rust server-rendered web app (template manager, visual AQL query builder, EHR browser)
        org.opencontainers.image.source=https://github.com/FerroHEALTH/FerroEHR
        org.opencontainers.image.url=https://ferroehr.eu/
        org.opencontainers.image.documentation=https://ferroehr.eu/docs/latest/
        org.opencontainers.image.vendor=Cadasto B.V.
        org.opencontainers.image.authors=Cadasto B.V. <https://www.cadasto.com/contact/>
        org.opencontainers.image.licenses=BUSL-1.1
        org.opencontainers.image.base.name=gcr.io/distroless/cc-debian13:nonroot
        org.opencontainers.image.base.digest=sha256:3ee00291cf386ec52a552e6a858d555debd74776eb4bfa53fa3df2cd6677515e

  # ── PostgreSQL image (only on docker/postgres changes or tags; multi-arch) ──
  # One RUN layer (the Debian security upgrade, #2408, and the GnuPG purge,
  # #3673) on top of postgres:18.6, so the non-native platform needs QEMU —
  # set up below.
  postgres-image:
    name: postgres image
    needs: changes
    if: >-
      needs.changes.outputs.postgres == 'true' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # Sigstore, for the signed attestations
      attestations: write # store them against this repository
    # The reusable SLSA Build L3 lane. QEMU: the one RUN layer (the Debian
    # security upgrade, #2408) executes on the non-native platform.
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/ferrohealth/ferroehr-postgres
      defer-tags: true
      dockerfile: docker/postgres/Dockerfile
      context: docker/postgres
      qemu: true
      version-build-args: false
      labels: |
        org.opencontainers.image.title=FerroEHR PostgreSQL
        org.opencontainers.image.description=PostgreSQL 18 preconfigured (role/db/schemas/extensions) for ferroehr
        org.opencontainers.image.source=https://github.com/FerroHEALTH/FerroEHR
        org.opencontainers.image.url=https://ferroehr.eu/
        org.opencontainers.image.documentation=https://ferroehr.eu/docs/latest/
        org.opencontainers.image.vendor=Cadasto B.V.
        org.opencontainers.image.authors=Cadasto B.V. <https://www.cadasto.com/contact/>
        org.opencontainers.image.licenses=BUSL-1.1 AND PostgreSQL
        org.opencontainers.image.base.name=postgres:18.6
        org.opencontainers.image.base.digest=sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6

  # ── Scan the pushed digests, then make them referencable ────────────────────
  # Both halves live in the reusable scan-and-tag.yml (#2776), which the release
  # pipeline calls with the same inputs — a security gate is not a thing to keep
  # two copies of. An image whose build skipped or failed produces no `digest`
  # output, and an empty digest is how the called workflow knows to sit out
  # tagging it (postgres legitimately skips on most pushes).
  #
  # The condition is the one this pair carried when it lived here: run whenever
  # the app image was actually pushed, whatever the other two lanes did.
  scan-and-tag:
    name: scan + tag
    needs: [app-image, viewer-image, postgres-image]
    if: >-
      !cancelled() && needs.app-image.result == 'success'
    permissions:
      contents: read
      packages: write # pull the pushed digests, then tag them
    uses: ./.github/workflows/scan-and-tag.yml
    with:
      app-image: ghcr.io/ferrohealth/ferroehr
      app-digest: ${{ needs.app-image.outputs.digest }}
      app-tags: ${{ needs.app-image.outputs.tags }}
      viewer-image: ghcr.io/ferrohealth/ferroehr-viewer
      viewer-digest: ${{ needs.viewer-image.outputs.digest }}
      viewer-tags: ${{ needs.viewer-image.outputs.tags }}
      postgres-image: ghcr.io/ferrohealth/ferroehr-postgres
      postgres-digest: ${{ needs.postgres-image.outputs.digest }}
      postgres-tags: ${{ needs.postgres-image.outputs.tags }}

  # ── openEHR conformance against the images this push shipped (#4539) ───────
  # The reusable conformance.yml on the digests app-image and postgres-image
  # pushed for this commit, so nothing is compiled for it and the run judges
  # what users pull. An image this push did not rebuild is judged at `:main`:
  # its inputs did not change, and this workflow's queued concurrency means the
  # previous run has tagged it. Every push runs it, the badges included, as
  # conformance.yml did on main before. A failed or cancelled build sits it out.
  conformance:
    name: conformance
    needs: [binary, app-image, postgres-image]
    if: >-
      !cancelled() &&
      contains(fromJSON('["success", "skipped"]'), needs.binary.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.app-image.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.postgres-image.result)
    permissions:
      contents: write # each run pushes its badges to its own branch, from main only
      packages: read # pull the digests this run pushed
    uses: ./.github/workflows/conformance.yml
    with:
      server-image: ${{ case(needs.app-image.result == 'success', format('ghcr.io/ferrohealth/ferroehr@{0}', needs.app-image.outputs.digest), 'ghcr.io/ferrohealth/ferroehr:main') }}
      postgres-image: ${{ case(needs.postgres-image.result == 'success', format('ghcr.io/ferrohealth/ferroehr-postgres@{0}', needs.postgres-image.outputs.digest), 'ghcr.io/ferrohealth/ferroehr-postgres:main') }}

  # The pushed VIEWER artifact was once assembled from two jobs (the per-arch
  # binary and a separately built site bundle), and an assembly that
  # disagreed published green. The from-source e2e
  # battery (ci.yml) never sees the assembled artifact — which is exactly how
  # a viewer whose pages 404 their own wasm published green (issue #2550,
  # found live on the 3.20.0 image during #2164). This smoke drives the very
  # image this run pushed: every asset the served page references must exist
  # in the artifact that serves it, AND a real browser must log in through
  # them — the second half exists because 4.0.8 shipped a viewer nobody had
  # ever driven in a browser (#2871).
  viewer-smoke:
    name: viewer smoke (amd64)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # pull the image this run just pushed
    # The browser-login step pulls the CDR fixture by its `:main` tag, and
    # `scan-and-tag` is what APPLIES that tag — without the edge the smoke
    # raced it and pulled a tag that did not exist yet (#2904). `skipped` is
    # accepted so a viewer-only run keeps driving the last published
    # fixture (the designed behaviour); a failed tag application refuses.
    needs: [viewer-image, scan-and-tag]
    if: >-
      !cancelled() && needs.viewer-image.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.scan-and-tag.result)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pushed viewer image (by digest)
        env:
          DIGEST: ${{ needs.viewer-image.outputs.digest }}
        run: |
          docker pull "${VIEWER_IMAGE}@${DIGEST}"
          docker tag  "${VIEWER_IMAGE}@${DIGEST}" ferroehr-viewer:smoke

      - name: Serve and verify the asset chain
        shell: bash
        run: |
          set -euo pipefail
          # A dummy CDR base URL: the login page renders without a CDR.
          docker run -d --rm --name viewer-smoke -p 127.0.0.1:3000:3000 \
            -e FERROEHR_VIEWER__CDR__BASE_URL=http://127.0.0.1:9 \
            ferroehr-viewer:smoke
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/login && break
            sleep 1
            [ "$i" = 30 ] && { echo "viewer never served /login"; docker logs viewer-smoke; exit 1; }
          done
          html=$(curl -sf http://127.0.0.1:3000/login)
          # Every FerroUI asset the page references (the stylesheet, the
          # theme and the script loader) must be served by the artifact
          # serving the page.
          assets=$(printf '%s' "$html" | grep -oE '(href|src)="/ferrohealth-ui/[^"]+"' | sed -E 's/^(href|src)="//; s/"$//' | sort -u)
          [ -n "$assets" ] || { echo "the served page references no /ferrohealth-ui/ assets: the shell changed shape; update this smoke"; exit 1; }
          echo "$assets"
          fail=0
          while IFS= read -r a; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$a")
            echo "$a -> $code"
            [ "$code" = "200" ] || fail=1
          done <<< "$assets"
          docker stop viewer-smoke >/dev/null
          [ "$fail" = 0 ] || { echo "the pushed viewer image references assets it does not ship (#2550)"; exit 1; }

      - name: Build the postgres image (amd64; COPY-only, seconds)
        run: docker build -t ferroehr-postgres:smoke docker/postgres

      # The asset-chain step proves the image SERVES its assets; nothing proved
      # a browser can log in THROUGH them, and 4.0.8 shipped with this lane
      # green (#2871). The CDR and its database are FIXTURES — the last main
      # build of the server image, which this lane never re-tags — while the
      # viewer is the artifact under test.
      - name: Browser-driven login against the pushed viewer image
        shell: bash
        run: |
          FERROEHR_VIEWER_IMAGE=ferroehr-viewer:smoke \
          FERROEHR_IMAGE="${APP_IMAGE}:main" \
          FERROEHR_POSTGRES_IMAGE=ferroehr-postgres:smoke \
            bash docker/viewer/login-smoke.sh

  # ── Smoke test (amd64): pull the pushed image, compose up, exercise the API ──
  smoke:
    name: compose smoke (amd64)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # pull the image this run just pushed
    needs: app-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pushed app image (by digest)
        env:
          DIGEST: ${{ needs.app-image.outputs.digest }}
        run: |
          docker pull "${APP_IMAGE}@${DIGEST}"
          docker tag  "${APP_IMAGE}@${DIGEST}" ferroehr:smoke

      - name: Build postgres image (amd64; COPY-only, seconds)
        run: docker build -t ferroehr-postgres:smoke docker/postgres

      - name: Smoke test
        shell: bash
        env:
          FERROEHR_IMAGE: ferroehr:smoke
          FERROEHR_POSTGRES_IMAGE: ferroehr-postgres:smoke
        run: bash docker/smoke-test.sh
