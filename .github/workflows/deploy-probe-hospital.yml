# The hospital scenario (#5610).
#
# It runs the `hospital` deploy-probe family alone: SCIM, RBAC, the access
# evaluator, AQL, the access log and SMART discovery on two instances with
# Keycloak, the quickstart's machines issuer and a patient portal's issuer.
#
# WHAT IT PROBES (#5673). A pull request, a push, the schedule and a dispatch
# probe the server built from the tree they check out, packaged the way
# ci.yml's deploy-probe job packages it, so the scripts and the server are one
# generation. A completed Containers run on main probes the server image that
# run published, pinned by digest. The mutable `:main` tag named whatever was
# last published, and a probe of an image older than its tree read the tree's
# new grant terminology as no grant (#5673).
#
# RUN COLOUR. Red while any finding of #5610 is open, and gating nothing: each
# failing probe names the issue it is tracked by, in the record and the job
# summary. The summary step refuses a failing probe whose tracking issues are
# all closed, or one that names none, so a fix that did not hold, or a finding
# nobody filed, says so. When the tracked issues land, the family moves into
# ci.yml's required deploy-probe job (#5642).
name: deploy-probe (hospital)

on:
  push:
    branches: [main]
    paths:
      - scripts/deploy-probe.sh
      - scripts/deploy-probes/**
      - docker-compose.yml
      - docker-compose.keycloak.yml
      - docker-compose.replicas.yml
      - .github/workflows/deploy-probe-hospital.yml
  pull_request:
    paths:
      - scripts/deploy-probe.sh
      - scripts/deploy-probes/**
      - docker-compose.yml
      - docker-compose.keycloak.yml
      - docker-compose.replicas.yml
      - .github/workflows/deploy-probe-hospital.yml
  # Containers runs on main pushes and dispatches only, so the commit checked
  # out here is main's; the jobs hold read permissions alone.
  workflow_run: # zizmor: ignore[dangerous-triggers] main's commits only, read permissions only
    workflows: [Containers]
    types: [completed]
    branches: [main]
  schedule:
    # Daily at 04:41 UTC. Off the hour: GitHub documents that runs scheduled
    # on the hour are delayed by load spikes
    # (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule).
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions: {}

# Per event: a Containers completion on main does not cancel the probe of the
# push that started it, nor the other way round.
concurrency:
  group: deploy-probe-hospital-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A FerroEHR the harness starts sends no usage report to FerroPULSE.
  FERROEHR__USAGE_REPORT__ENABLED: "false"

jobs:
  # The server binary of the tree under probe, built as ci.yml's ui-e2e-binary
  # builds it: the same container, profile and binary cache key, so a tree CI
  # already built is restored and not compiled.
  binary:
    name: hospital server binary
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    container: rust:1.99.1-slim-trixie@sha256:00544ccc9431a2fe93e65185d21381b0a039342f5cefcf84fbddac273c9e573d
    env:
      SOURCE_DATE_EPOCH: "1700000000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: binary-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/amd64/ferroehr
          key: ui-e2e-server-bin-1.99.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'crates/**', 'app/ferroehr/**', 'app/ferroehr-rest/**', 'app/ferroehr-server/**', 'tools/**') }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.binary-cache.outputs.cache-hit != 'true'
        with:
          shared-key: ui-e2e-server-binary
          cache-targets: false
          save-if: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.binary-cache.outputs.cache-hit != 'true'
      - name: Build the server binary (e2e profile, native)
        if: steps.binary-cache.outputs.cache-hit != 'true'
        env:
          SCCACHE_GHA_ENABLED: "true"
          # ci.yml's ui-e2e-binary writes the compile cache; this lane reads it.
          SCCACHE_GHA_RW_MODE: READ_ONLY
          RUSTC_WRAPPER: sccache
          CARGO_INCREMENTAL: "0"
          SCCACHE_SKIP_CACHE_CHECK: "true"
        shell: bash
        run: |
          set -euo pipefail
          cargo build --profile e2e --locked -p ferroehr-server
          strip target/e2e/ferroehr
          mkdir -p bin/amd64
          install -m0755 target/e2e/ferroehr bin/amd64/ferroehr
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hospital-server-binary
          path: bin/amd64/ferroehr
          if-no-files-found: error
          retention-days: 1

  # The server image a successful Containers run on main published, as its
  # digest. The run tags each image it pushes `sha-<short commit>`
  # (build-image.yml); a run that built no server image leaves the digest
  # empty and the probe sits out, since there is nothing new to probe.
  published-image:
    name: published server image
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
    steps:
      - id: resolve
        name: Resolve the digest the run published
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          ref="ghcr.io/ferrohealth/ferroehr:sha-${HEAD_SHA:0:7}"
          if ! manifest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null)"; then
            echo "::notice::the Containers run of $HEAD_SHA published no server image ($ref); nothing to probe"
            exit 0
          fi
          digest="$(jq -r '.digest // empty' <<<"$manifest")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::$ref resolved to no digest: $manifest"
            exit 1
          fi
          echo "Probing ghcr.io/ferrohealth/ferroehr@$digest ($ref)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  hospital:
    name: deploy-probe (hospital)
    needs: [binary, published-image]
    if: >-
      !cancelled() &&
      (needs.binary.result == 'success' || needs.published-image.outputs.digest != '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read # the states of the tracking issues the summary reads
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'workflow_run'
        with:
          persist-credentials: false
      # The scripts of the commit whose image is probed, so the two are one
      # generation; the trigger admits main's Containers runs alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_run'
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.binary.result == 'success'
        with:
          name: hospital-server-binary
          path: bin/amd64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Package the app image (COPY-only, seconds)
        if: needs.binary.result == 'success'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr:deploy-probe
      # The database image of the tree checked out, since its initdb
      # provisions the roles the tree expects.
      - name: Package the postgres image (base + security updates)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/postgres
          file: docker/postgres/Dockerfile
          load: true
          tags: ferroehr-postgres:deploy-probe
      - name: Probe the hospital scenario
        env:
          PROBE_ONLY: hospital
          PROBE_OUT: docs/conformance/deployment/hospital.json
          FERROEHR_IMAGE: ${{ needs.published-image.outputs.digest != '' && format('ghcr.io/ferrohealth/ferroehr@{0}', needs.published-image.outputs.digest) || 'ferroehr:deploy-probe' }}
          FERROEHR_POSTGRES_IMAGE: ferroehr-postgres:deploy-probe
        run: bash scripts/deploy-probe.sh
      - name: Summarise the record and check its tracking issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/deploy-probes/hospital_summary.sh docs/conformance/deployment/hospital.json "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deploy-probe-hospital-record
          path: docs/conformance/deployment/hospital.json
          if-no-files-found: warn
