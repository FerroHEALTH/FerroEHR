# The deployment harness on a schedule and after each published image (#5642).
#
# ci.yml's required deploy-probe job runs every family, the hospital scenario
# included, on the tree of a change. This workflow runs the same default run
# where no change starts one: daily, on a dispatch, and after a completed
# Containers run on main.
#
# WHAT IT PROBES (#5673). The schedule and a dispatch probe the server and
# database images built from the tree they check out, packaged the way ci.yml's
# deploy-probe job packages them, so the scripts and the images are one
# generation. A completed Containers run on main probes the server and
# generation. A completed Containers run on main probes the server and
# postgres images that run published, each pinned by digest (#5673).
#
# WHAT IT CHECKS OUT. Every event checks out the commit GitHub hands the run,
# which for a `workflow_run` is main's newest commit, and never a ref read
# from the event payload. A Containers run probes only while its commit is
# still that newest commit; once main has moved on, the Containers run of the
# newer commit probes its own images.
name: deploy-probe (scheduled)

on:
  # Containers runs on main pushes and dispatches only, so the commit checked
  # out here is main's; the jobs hold read permissions alone.
  workflow_run: # zizmor: ignore[dangerous-triggers] main's commits only, read permissions only
    workflows: [Containers]
    types: [completed]
    branches: [main]
  schedule:
    # Daily at 04:41 UTC. Off the hour: GitHub documents that runs scheduled
    # on the hour are delayed by load spikes
    # (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule).
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions: {}

# Per event: a Containers completion on main does not cancel a scheduled or
# dispatched run, nor the other way round.
concurrency:
  group: deploy-probe-scheduled-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A FerroEHR the harness starts sends no usage report to FerroPULSE.
  FERROEHR__USAGE_REPORT__ENABLED: "false"

jobs:
  # The server binary of the tree under probe, from the action ci.yml's
  # ui-e2e-binary runs: the same container, profile and binary cache key, so a
  # tree CI already built is restored and not compiled.
  binary:
    name: deploy-probe server binary
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    container: rust:1.99.1-slim-trixie@sha256:00544ccc9431a2fe93e65185d21381b0a039342f5cefcf84fbddac273c9e573d
    env:
      SOURCE_DATE_EPOCH: "1700000000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/server-binary # zizmor: ignore[self-repository] actionlint 1.7.12 refuses the $/ form (rhysd/actionlint#711)
        with:
          artifact-name: deploy-probe-server-binary

  # The images a successful Containers run on main published, as digests. The
  # run tags each image it pushes `sha-<short commit>` (build-image.yml). An
  # image the run did not rebuild is the one `:main` names at this moment,
  # pinned by its digest, and the Containers filter rebuilds an image whenever
  # the tree changes its inputs, so that image is the one the commit builds. A
  # run that rebuilt neither still probes: a skipped probe reported the lane
  # green on main while the scenario failed.
  published-images:
    name: published images
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      server: ${{ steps.resolve.outputs.server }}
      postgres: ${{ steps.resolve.outputs.postgres }}
    steps:
      - id: resolve
        name: Resolve the digests the run published
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # digest_of <ref>: the digest <ref> names, or nothing when it names none.
          digest_of() {
            local manifest digest
            manifest="$(docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null)" || return 0
            digest="$(jq -r '.digest // empty' <<<"$manifest")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::$1 resolved to no digest: $manifest" >&2
              return 1
            fi
            printf '%s' "$digest"
          }
          resolved=""
          for pair in server:ferroehr postgres:ferroehr-postgres; do
            key="${pair%%:*}" image="${pair#*:}"
            ref="ghcr.io/ferrohealth/$image"
            digest="$(digest_of "$ref:sha-${HEAD_SHA:0:7}")"
            if [[ -n "$digest" ]]; then
              echo "$image: ghcr.io/ferrohealth/$image@$digest, pushed by the Containers run of $HEAD_SHA"
            else
              digest="$(digest_of "$ref:main")"
              [[ -n "$digest" ]] || { echo "::error::$ref:main names no image"; exit 1; }
              echo "$image: ghcr.io/ferrohealth/$image@$digest, which :main names (the run did not rebuild it)"
            fi
            resolved+="$key=$ref@$digest"$'\n'
          done
          printf '%s' "$resolved" >> "$GITHUB_OUTPUT"

  deploy-probe:
    name: deploy-probe (scheduled)
    needs: [binary, published-images]
    if: >-
      !cancelled() &&
      (needs.binary.result == 'success' || needs.published-images.outputs.server != '')
    runs-on: ubuntu-latest
    # The required deploy-probe job runs about 17 minutes (ci.yml, #5642); a
    # pull of the published images adds a few.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # The commit of the run. After a Containers run that is the commit whose
      # images are probed (published-images), so the scripts and the images
      # are one generation.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.binary.result == 'success'
        with:
          name: deploy-probe-server-binary
          path: bin/amd64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: needs.binary.result == 'success'
      - name: Package the app image (COPY-only, seconds)
        if: needs.binary.result == 'success'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr:deploy-probe
      # The database image of the tree checked out, since its initdb
      # provisions the roles the tree expects.
      - name: Package the postgres image (base + security updates)
        if: needs.binary.result == 'success'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/postgres
          file: docker/postgres/Dockerfile
          load: true
          tags: ferroehr-postgres:deploy-probe
      - name: Install the pinned ferrohealth-sop, which generates the probes' signing keys
        run: bash scripts/sop.sh install
      - name: Probe the deployment, every family of the default run
        env:
          FERROEHR_IMAGE: ${{ needs.published-images.outputs.server || 'ferroehr:deploy-probe' }}
          FERROEHR_POSTGRES_IMAGE: ${{ needs.published-images.outputs.postgres || 'ferroehr-postgres:deploy-probe' }}
        run: bash scripts/deploy-probe.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deploy-probe-scheduled-record
          path: docs/conformance/deployment/compose.json
          if-no-files-found: warn
