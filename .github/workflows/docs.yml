# .github/workflows/docs.yml — build + deploy the documentation website.
# Rust-only toolchain, vendored static assets, no Node/Python build step for
# the site render.
#
# The per-release `/docs/vX.Y.Z/` FREEZE is not here: it is a leg of the release
# pipeline (release.yml, #2776), which owns the `v*` tag end to end and can
# therefore guard the cut on the release being a real release rather than a
# pre-release. That leg dispatches this workflow once it has pushed a new frozen
# version, which is what redeploys the site with it.
name: Docs

on:
  push:
    branches: [main]     # redeploy dev docs + landing
  pull_request:             # PR: build + lint + link-check ONLY (no deploy),
                            # and only when a site input changed (the `changes`
                            # gate below)
  workflow_dispatch:

# The pinned toolchain lives in .github/actions/docs-toolchain (#2775) — it was
# declared verbatim here and in link-check-external.yml.
env:
  # Custom domain (ferroehr.eu): the site is served at the apex root, so the
  # base path is empty. Set explicitly so CI and scripts/site/build.sh agree.
  SITE_ORIGIN: "https://ferroehr.eu"
  SITE_BASE: ""

# Cancel only PR runs (#2845). Push and dispatch runs QUEUE instead: at every
# release cut the merge push starts a Docs run and the pipeline's docs-freeze
# leg dispatches a second one ~90s later — with blanket cancellation the push
# run died as a scary-looking "Cancelled" row on every healthy cut (three in a
# row before this was adjudicated). Queuing costs one ~3-minute redundant
# build per cut; the deploy job's own `pages` group already serializes the
# actual deploys, and the dispatch run lands last with the frozen version.
# Residual: GitHub still displaces a QUEUED run when a third arrives for the
# same group (pending-displacement ignores this setting), so a rapid burst of
# 3+ main pushes can still show one Cancelled row — rare, and equally
# benign.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # ── Change detection (pull requests only) ───────────────────────────────────
  # The site build renders the conformance assets, regenerates the derived
  # party documents (which installs the pinned `veredictum`), lints the book and
  # link-checks the assembled tree — 30 minutes of work that a pull request
  # touching none of its inputs has no reason to pay (#2777).
  #
  # It is an IN-WORKFLOW gate, not a workflow-level `paths:` filter, for the
  # documented reason `ci.yml` uses the same shape: a workflow skipped by path
  # filtering leaves its checks in a pending state forever if one is ever
  # required, whereas a job skipped by `if:` reports as skipped and satisfies
  # branch protection
  # (https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks).
  #
  # Any non-pull-request event answers `true` unconditionally: a main push
  # deploys the site and a manual dispatch is an explicit request to rebuild
  # it, so neither is ever gated on a delta.
  changes:
    name: change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        shell: bash
        # Context reaches the shell through env, never `${{ }}`-inline (the
        # template-injection rule; `ci.yml`'s filter is the pattern).
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "$EVENT_NAME is not a pull request — building the site unconditionally."
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify --quiet "$PR_BASE" >/dev/null; then
            echo "Base $PR_BASE unavailable — treating as a docs change."
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$PR_BASE" "$PR_HEAD")
          echo "Changed files:"; echo "$changed"
          # The site's sources, plus every INPUT the build's own gates read:
          # the committed conformance artifacts and party statements that
          # `scripts/render/conformance-docs.sh` regenerates from, the pin that
          # decides WHICH instrument and catalogue it regenerates them with, the
          # render/assemble scripts, the stale-numbers gate's script, and the
          # job's own recipe — this workflow and the toolchain action — so a
          # change to what the job DOES exercises the job it changes.
          if echo "$changed" | grep -qE '^(website/|docs/conformance/|scripts/(render|site)/|scripts/lib/veredictum\.sh$|scripts/checks/(docs-claims|conformance-numbers)\.sh$|\.github/workflows/docs\.yml$|\.github/actions/docs-toolchain/)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "No site-relevant paths touched — the docs build will be skipped."
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Build + verify (no deploy) ──────────────────────────────────────────────
  build:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the party-documents drift gate regenerates
          # COMPARISON.md, whose run dates derive from the conformance
          # artifacts' AUTHOR dates (scripts/render/comparison.sh). On a
          # shallow checkout that git log is empty and the mtime fallback
          # stamps the CHECKOUT day — green only on the baseline's own UTC
          # day, red every day after (#2402; it failed both the v3.17.6 and
          # v3.17.7 tag runs).
          fetch-depth: 0
      # The deployed site is rebuilt in the deploy job, which restores no build
      # cache; this job publishes only a pull-request diagnostic artifact.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0 # zizmor: ignore[cache-poisoning]
      - uses: ./.github/actions/docs-toolchain
      - name: Stale-numbers gate (no hand-typed conformance claims in site sources)
        run: bash scripts/checks/conformance-numbers.sh
      - name: Render conformance stats + comparison + perf assets (the generated includes must exist before lint)
        run: |
          bash scripts/render/conformance-stats.sh includes
          bash scripts/render/comparison.sh
          bash scripts/render/perf-assets.sh
          bash scripts/render/cohort-bench.sh
          bash scripts/render/storage-bench.sh
          bash scripts/render/conformance-assets.sh
          CONF_SUT=ehrbase bash scripts/render/conformance-assets.sh
      - name: Regenerate the derived party documents (verdicts + renders + badges)
        # The published statements/reports/certificates are DERIVED from the
        # committed statement + results + catalogue by the same pure pipeline
        # a campaign ends with. Regenerating them here, beside the SVGs, is
        # what stops a catalogue or statement change from leaving a published
        # document silently stale (#2377). results.json is an input only.
        run: bash scripts/render/conformance-docs.sh
      - name: Party-documents drift gate (regenerated documents match the committed ones)
        # COMPARISON.md is written by comparison.sh in the render step above and
        # was the one regenerated record no gate diffed — a stale committed copy
        # passed CI silently.
        run: git diff --exit-code docs/conformance/ferroehr docs/conformance/ehrbase docs/conformance/COMPARISON.md
      - name: Perf-assets drift gate (regenerated SVGs match the committed assets)
        run: git diff --exit-code website/book/src/perf-assets
      - name: Conformance-assets drift gate (regenerated SVGs match the committed assets)
        # comparison-assets/ is gitignored build output (regenerated above);
        # the committed, drift-guarded copies are the product's own.
        run: git diff --exit-code website/book/src/conformance-assets website/book/src/comparison-assets/conformance-heat-grid-ehrbase.svg website/book/src/comparison-assets/conformance-chapter-bars-ehrbase.svg
      - name: Markdown lint gate
        run: mdbook-lint lint website/book/src
      - name: Assemble _site (landing + /docs/dev/)
        run: bash scripts/site/build.sh --dev-only       # writes ./_site
      - name: Link-check gate (internal links only — blocking)
        # `--offline` blocks network requests, so this checks exactly the
        # property this repository controls: that every relative and absolute
        # in-site link resolves inside the built tree. A broken cross-reference
        # is a real defect and this is the only thing that catches it.
        #
        # External reachability is NOT checked here, deliberately. A remote host
        # rate-limiting or resetting a CI runner's connection says nothing about
        # the change under review, and it failed two consecutive unrelated pull
        # requests on links that return 200 when fetched directly (#2287). A
        # gate that goes red for reasons the author cannot fix or influence
        # teaches people to merge past red, which costs more than the check is
        # worth. External links move to link-check-external.yml, which reports
        # somewhere a human reads instead of blocking a merge.
        #
        # The deployed site is served at the ferroehr.eu apex ROOT, so absolute
        # /docs/... links resolve against _site itself — no prefixed check tree
        # is needed.
        run: |
          lychee --offline --no-progress --exclude-loopback \
            --root-dir "$PWD/_site" \
            './_site/**/*.html'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: _site

  # ── Deploy the full site (main push or manual dispatch) ──────────────────
  deploy:
    needs: build
    # Deploy on any non-PR event. The release pipeline's docs-freeze leg
    # dispatches this workflow after it pushes a frozen version, so a release
    # reaches the site through this same job.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # Keeps its credential for the docs-dist fetch below (a git read, not the
      # API): the job's token grants contents: read only, so what stays in
      # .git/config cannot write anything.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked]
      - name: Fetch docs-dist (frozen versions)
        run: git fetch origin docs-dist && git worktree add docs-dist origin/docs-dist || true
      # Assembly only: the lint and link-check gates ran in `build`.
      - uses: ./.github/actions/docs-toolchain
        with:
          lint: "false"
          link-check: "false"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble full _site (landing + dev + frozen versions + latest + sitemap)
        run: bash scripts/site/build.sh --full
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
