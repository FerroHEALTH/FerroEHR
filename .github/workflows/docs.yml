# .github/workflows/docs.yml: build and deploy the documentation website on a
# push to main or a dispatch. A pull request builds the site in ci.yml, through
# the same docs-build.yml (#6733).
# Rust-only toolchain, vendored static assets, no Node/Python build step for
# the site render.
#
# The per-release `/docs/vX.Y.Z/` FREEZE is not here: it is a leg of the release
# pipeline (release.yml, #2776), which owns the `v*` tag end to end and can
# therefore guard the cut on the release being a real release rather than a
# pre-release. That leg dispatches this workflow once it has pushed a new frozen
# version, which is what redeploys the site with it.
name: Docs

on:
  push:
    branches: [main]     # redeploy dev docs + landing
  workflow_dispatch:

# The pinned toolchain lives in .github/actions/docs-toolchain (#2775) — it was
# declared verbatim here and in link-check-external.yml.
env:
  # Custom domain (ferroehr.eu): the site is served at the apex root, so the
  # base path is empty. Set explicitly so CI and scripts/site/build.sh agree.
  SITE_ORIGIN: "https://ferroehr.eu"
  SITE_BASE: ""

# Push and dispatch runs QUEUE (#2845): at every
# release cut the merge push starts a Docs run and the pipeline's docs-freeze
# leg dispatches a second one ~90s later — with blanket cancellation the push
# run died as a scary-looking "Cancelled" row on every healthy cut (three in a
# row before this was adjudicated). Queuing costs one ~3-minute redundant
# build per cut; the deploy job's own `pages` group already serializes the
# actual deploys, and the dispatch run lands last with the frozen version.
# Residual: GitHub still displaces a QUEUED run when a third arrives for the
# same group (pending-displacement ignores this setting), so a rapid burst of
# 3+ main pushes can still show one Cancelled row — rare, and equally
# benign.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # ── Build + verify (no deploy) ──────────────────────────────────────────────
  # The build and its gates are docs-build.yml, which ci.yml also calls on a
  # pull request that changes a site input (#6733).
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/docs-build.yml # zizmor: ignore[self-repository] actionlint 1.7.12 refuses the $/ form (rhysd/actionlint#711)

  # ── Deploy the full site (main push or manual dispatch) ──────────────────
  deploy:
    needs: build
    # The release pipeline's docs-freeze leg dispatches this workflow after it
    # pushes a frozen version, so a release reaches the site through this job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
      issues: read # the control matrix renders from the tracker
      pull-requests: read # and links each control's merged closing pull request
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # Keeps its credential for the docs-dist fetch below (a git read, not the
      # API): the job's token grants contents: read only, so what stays in
      # .git/config cannot write anything.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked]
      - name: Fetch docs-dist (frozen versions)
        run: git fetch origin docs-dist && git worktree add docs-dist origin/docs-dist || true
      # Assembly only: the lint and link-check gates ran in `build`.
      - uses: ./.github/actions/docs-toolchain # zizmor: ignore[self-repository] actionlint 1.7.12 refuses the $/ form (rhysd/actionlint#711)
        with:
          lint: "false"
          link-check: "false"
      # The committed control matrix may lag the tracker: pull requests are
      # judged only on their own rows (#4130), and an issue body or state
      # changes without a commit. Rendering it here publishes the tracker as
      # it reads at this push.
      - name: Render the control matrix from the tracker
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/render/control-matrix.sh
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble full _site (landing + dev + frozen versions + latest + sitemap)
        run: bash scripts/site/build.sh --full
      # One artifact name per attempt: a re-run of this job uploads into the
      # same run, and deploy-pages refuses a run holding two artifacts of the
      # name it deploys, so a fixed name made every re-run fail.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
