# Scheduled libFuzzer campaigns over the parsers that read attacker-controlled
# bytes off the REST wire (the harnesses live in `fuzz/`).
#
# The CAMPAIGN is deliberately not on the pull-request path: a fuzz job that
# makes every PR slow gets disabled within a month, and a bounded run finds
# regressions just as well on a nightly cadence. Long campaigns are a local
# activity — `fuzz/README.md` carries the command.
#
# The BUILD is, though, and that gap is why this lane sat broken for nights
# without anyone noticing: nothing on the PR path ever compiled the harnesses,
# so neither a build break nor a renamed API in a fuzzed crate could surface
# until the campaign tried to run. `build` below is seconds, not minutes, and
# only fires when the harnesses or the crates they read are touched.
#
# Each target keeps its corpus in the Actions cache between runs, so coverage
# accumulates instead of restarting from the seed set every night. A crash is
# uploaded as an artifact and fails the job; the fix belongs in the crate,
# pinned by a regression test, never by widening a bound here.
#
# cargo-fuzz needs a nightly toolchain (libFuzzer wants `-Zsanitizer`), which is
# why `fuzz/` is its own workspace: the CDR workspace stays on pinned stable.
# Docs: https://rust-fuzz.github.io/book/cargo-fuzz.html
name: Fuzz

on:
  pull_request:
    # This list IS the harnesses' dependency set — every `path =` entry in
    # fuzz/Cargo.toml — so adding a dependency there means adding a line here.
    # An omission does not fail; it silently stops guarding, which is the shape
    # of failure this whole lane exists to stop repeating.
    paths:
      - "fuzz/**"
      - "crates/openehr-adl/**"
      - "crates/openehr-base/**"
      - "crates/openehr-its/**"
      - "crates/openehr-sdt/**"
      - "crates/openehr-query/**"
      - "crates/openehr-rm/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "41 2 * * *" # daily 02:41 UTC (off-the-hour to dodge load spikes)
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to fuzz each target (default 300)"
        required: false
        default: "300"

concurrency:
  # Never cancel a running campaign: a cancelled run loses the corpus it grew.
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

# No permissions by default — the job grants its own; without this the workflow
# would inherit the repository default.
permissions: {}

jobs:
  # Do the harnesses still COMPILE? That is the whole question on a PR, and it
  # is the one the campaign schedule cannot answer in time to be useful.
  build:
    name: harnesses build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: nightly
          # The action's default is `deny`, and on nightly cargo that also
          # denies MANIFEST lints: it asks for kebab-case binary names, while a
          # cargo-fuzz target is named after its `fuzz_targets/*.rs` file and
          # that tool writes them snake_case. Renaming them would throw away
          # every accumulated corpus. Harness code was never held to -D
          # warnings here either — `cargo fuzz` replaces RUSTFLAGS with its own
          # sanitizer set — so this states what the lane already did.
          build-warnings: warn
          cache: false

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-fuzz@0.13.2

      - name: Cache the fuzz build tree
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          key: build

      # The trigger list above claims to be the harnesses' dependency set. A
      # claim with no check is a wish, and this particular wish going stale is
      # invisible: the job simply stops running on the crate that broke it.
      - name: The trigger paths still cover every harness dependency
        run: |
          deps=$(grep -oE '^openehr-[a-z0-9-]+ = \{ path' fuzz/Cargo.toml \
                 | cut -d' ' -f1 | sort)
          paths=$(grep -oE 'crates/openehr-[a-z0-9-]+/\*\*' .github/workflows/fuzz.yml \
                 | sed -E 's|crates/([^/]*)/\*\*|\1|' | sort -u)
          if [ "$deps" != "$paths" ]; then
            echo "the pull_request paths filter and fuzz/Cargo.toml disagree:"
            diff <(echo "$deps") <(echo "$paths") || true
            echo "add the missing crate to the paths filter in this workflow"
            exit 1
          fi
          echo "trigger paths cover every harness dependency"

      # Same explicit `--target` as the campaign, and for the same reason:
      # cargo-fuzz otherwise builds for the triple IT was built for (musl),
      # whose static libc cannot carry a sanitizer.
      - name: Build every harness
        run: cargo fuzz build --target x86_64-unknown-linux-gnu

  fuzz:
    name: ${{ matrix.target }}
    # A campaign on a pull request would be the slow job the header refuses to
    # ship; the build above is the PR-path guard.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      # One failing target must not hide the other five.
      fail-fast: false
      matrix:
        include:
          # `max_len` is per-target: it bounds the inputs libFuzzer GENERATES,
          # and an input far larger than a realistic request body only spends
          # execution budget. AQL is a query string; an operational template is
          # the largest legitimate body of the six.
          - target: canonical_json
            max_len: 16384
          - target: canonical_xml
            max_len: 32768
          - target: aql_query
            max_len: 4096
          - target: simplified_formats
            max_len: 16384
          - target: adl2_source
            max_len: 16384
          - target: opt14_template
            max_len: 65536
          # Identifiers are short by construction — an OBJECT_VERSION_ID is
          # three parts and a handful of separators — so a large max_len would
          # spend the budget on inputs no reader will ever see off a URL.
          - target: identifiers
            max_len: 256
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: nightly
          # The action's default is `deny`, and on nightly cargo that also
          # denies MANIFEST lints: it asks for kebab-case binary names, while a
          # cargo-fuzz target is named after its `fuzz_targets/*.rs` file and
          # that tool writes them snake_case. Renaming them would throw away
          # every accumulated corpus. Harness code was never held to -D
          # warnings here either — `cargo fuzz` replaces RUSTFLAGS with its own
          # sanitizer set — so this states what the lane already did.
          build-warnings: warn
          # The fuzz build tree is cached below, keyed on the fuzz lockfile.
          cache: false

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          # Not in install-action's managed manifest set, so this resolves
          # through its cargo-binstall fallback against the upstream release
          # assets (cargo-fuzz publishes an x86_64-unknown-linux-musl build).
          tool: cargo-fuzz@0.13.2

      - name: Cache the fuzz build tree
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}

      - name: Restore the accumulated corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          # A run always saves under a fresh key and restores the newest prefix
          # match, which is how a cache entry can keep growing (GitHub cache
          # entries are immutable once written).
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Wire the seed corpus
        env:
          TARGET: ${{ matrix.target }}
        run: bash fuzz/seeds.sh "$TARGET"

      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          MAX_LEN: ${{ matrix.max_len }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
        # The seed directory is passed as a SECOND corpus: libFuzzer writes only
        # to the first one, so the committed corpora stay read-only inputs.
        #
        # `--target` is MANDATORY here and is the reason this lane was dead.
        # cargo-fuzz defaults the build target to the triple IT was built for,
        # not the runner's — and install-action resolves cargo-fuzz through its
        # binstall fallback to the musl asset. So every build went to
        # x86_64-unknown-linux-musl, musl links libc statically, and a static
        # libc cannot carry a sanitizer:
        #
        #   error: sanitizer is incompatible with statically linked libc,
        #          disable it using `-C target-feature=-crt-static`
        #   error[E0463]: can't find crate for `core`
        #
        # Naming the gnu triple is the documented way out and keeps the choice
        # visible, rather than depending on which asset the installer picked.
        run: |
          cargo fuzz run --target x86_64-unknown-linux-gnu "$TARGET" \
            "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" \
            -- \
            -max_total_time="$SECONDS_PER_TARGET" \
            -max_len="$MAX_LEN" \
            -timeout=25 \
            -rss_limit_mb=4096 \
            -print_final_stats=1

      - name: Upload the crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

      - name: Save the accumulated corpus
        # Runs even when the target crashed: the corpus grown up to the crash is
        # the coverage the next run should start from.
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
