# .github/workflows/image-scan.yml
#
# Scheduled vulnerability scan of the PUBLISHED container images (issue #2086;
# OWASP Kubernetes Security Cheat Sheet §4.3 "Implement continuous security
# vulnerability scanning").
#
# WHY this is not the same as the scan in containers.yml. That one scans an image
# the run just BUILT, which catches what was known at build time and nothing
# after. A CVE published the week after a release applies to the image people are
# actually running, and until this lane existed nothing in the repository looked
# again. The three images are scanned where a user pulls them — at their released
# tag on GHCR — not from a local build.
#
# `ferroehr-postgres` is the image this will actually fire on: it is built on the
# upstream `postgres` image, so its OS package set is not ours and its CVEs arrive
# on someone else's schedule. The distroless app and viewer images carry almost
# no OS surface by comparison.
#
# The adjudicated exceptions carry over rather than being re-argued: `trivy.yaml`
# brings `.trivyignore.yaml`, `ignore-unfixed` and the HIGH/CRITICAL floor, and
# `--vex` applies the OpenVEX documents under `security/vex/`.
#
# NOTE: the VEX documents bind here even though `.trivyignore.yaml` records that
# they do not bind in the build-time lane — measured 2026-08-06: the `pkg:oci/…`
# products match a PUBLISHED reference (by tag and by digest), and the build lane
# scans `ferroehr-postgres` under a local tag, which is what fails to match.
#
# THE RECORD (#4795). Beside that gate the lane runs the release's
# vulnerability record (scripts/security/vulnerability-record.sh) over the
# published (`latest`) and main images: every severity, unfixed findings
# included, each needing an OpenVEX judgement. A finding without one files
# or updates its own tracking issue within a day, so it is judged before the
# next release candidate is tagged rather than after.
#
# RUN COLOUR (the watcher family's uniform rule, #2778). The run is RED only when
# the PROBE fails — an image that cannot be resolved or pulled, a trivy crash,
# output jq cannot read. A FINDING files or updates the tracking issue and the
# run stays GREEN: THE ISSUE IS THE ALERT. Until #2778 this lane also exited
# non-zero on a finding, which made the red Monday run the signal; a red
# scheduled run is invisible to anyone not watching the Actions tab, and the
# issue (created or commented, a `Bug`) reaches the tracker instead.
name: Published image scan

on:
  schedule:
    # Daily 07:13 UTC (#4795), off the hour (GitHub delays on-the-hour runs
    # under load) and in a slot of its own; read the estate's slots with
    # `grep -rE '^ +- cron:' .github/workflows/`.
    - cron: "13 7 * * *"
  workflow_dispatch:
    inputs:
      report_only:
        description: "Report findings without filing or updating an issue"
        required: false
        default: false
        type: boolean

concurrency:
  group: image-scan
  cancel-in-progress: false

permissions: {}

env:
  # `latest` is set only on a `v*` tag push (containers.yml), so it tracks
  # releases and is what an operator following the quickstart pulls. The resolved
  # digest is recorded in the run summary so a finding is attributable to exact
  # bytes rather than to a moving tag.
  SCAN_TAG: latest
  TRIVY_VERSION: "0.73.0"

jobs:
  scan:
    name: scan published images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # pull the published images
      issues: write # file/update the one tracking issue below
      security-events: write # the per-architecture SARIF uploads (#3033)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No build cache is restored in this lane at all: it decides whether
      # published artifacts are safe, so nothing a run could have poisoned
      # should influence its answer.
      - name: Install Trivy from its GitHub release, checked by sha256
        run: bash scripts/security/install-trivy.sh "$TRIVY_VERSION" "$RUNNER_TEMP/trivy-bin"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan every published image
        id: scan
        env:
          OWNER: ferrohealth
        run: |
          set -euo pipefail
          # Every VEX document under security/vex/, passed as repeated --vex flags.
          vex_args=()
          for doc in security/vex/*.json; do
            [ -e "$doc" ] || continue
            vex_args+=(--vex "$doc")
          done
          echo "VEX documents applied: ${#vex_args[@]} (2 args per document)"

          # One platform per trivy invocation (the container-image guide's
          # `--platform`, default linux/amd64) while the published index is
          # dual-arch — so every variant is scanned explicitly (#2412).
          total=0
          : > findings.md
          for image in ferroehr ferroehr-postgres ferroehr-viewer; do
            ref="ghcr.io/${OWNER}/${image}:${SCAN_TAG}"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            for platform in linux/amd64 linux/arm64; do
              arch=${platform##*/}
              echo "::group::${image} ${platform} (${digest})"
              trivy image --config trivy.yaml --scanners vuln --platform "$platform" \
                "${vex_args[@]}" -f json -o "${image}.${arch}.json" "$ref"
              count=$(jq '[.Results[]?.Vulnerabilities // [] | .[]] | length' "${image}.${arch}.json")
              trivy image --config trivy.yaml --scanners vuln --platform "$platform" \
                "${vex_args[@]}" -f table "$ref" || true
              echo "::endgroup::"
              echo "| \`${image}\` | \`${platform}\` | \`${digest}\` | ${count} |" >> findings.md
              total=$((total + count))
            done
          done
          echo "total=$total" >> "$GITHUB_OUTPUT"
          {
            printf '## Published image scan\n\n'
            printf 'Tag `%s`, Trivy %s, HIGH/CRITICAL with a fix available, VEX applied.\n\n' \
              "$SCAN_TAG" "$TRIVY_VERSION"
            printf '| image | platform | digest | findings |\n|---|---|---|---|\n'
            cat findings.md
          } >> "$GITHUB_STEP_SUMMARY"
          echo "total findings: $total"

      # The record over the published and the main images. The script exits
      # 1 for a finding without a judgement, which files the issue below;
      # any other failure is the probe's and turns the run red.
      - name: Every finding on the published and main images carries a judgement
        id: record
        env:
          OWNER: ferrohealth
        run: |
          set -euo pipefail
          uncovered=0
          : > uncovered.md
          for tag in latest main; do
            args=()
            app=""
            for image in ferroehr ferroehr-viewer ferroehr-postgres; do
              digest="$(docker buildx imagetools inspect "ghcr.io/${OWNER}/${image}:${tag}" --format '{{.Manifest.Digest}}')"
              args+=(--image "${image}=ghcr.io/${OWNER}/${image}@${digest}")
              if [ "$image" = ferroehr ]; then
                app="ghcr.io/${OWNER}/ferroehr@${digest}"
              fi
            done
            rc=0
            bash scripts/security/vulnerability-record.sh \
              --reports "record-${tag}" --record "record-${tag}/vulnerability-record.json" \
              "${args[@]}" --binaries-from "$app" > "record-${tag}.log" 2>&1 || rc=$?
            cat "record-${tag}.log"
            case "$rc" in
              0) ;;
              1)
                uncovered=1
                {
                  printf '\n### `%s`\n\n```\n' "$tag"
                  grep -E '^ +UNCOVERED ' "record-${tag}.log" || true
                  printf '```\n'
                } >> uncovered.md
                ;;
              *) exit "$rc" ;;
            esac
          done
          echo "uncovered=$uncovered" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-scan-reports
          path: |
            *.json
            record-latest/
            record-main/
          if-no-files-found: warn
          retention-days: 30

      # The findings mirror into GitHub code scanning (#3033): the JSON
      # reports the scan already wrote convert locally (`trivy convert` — no
      # second registry read) and merge into one SARIF per architecture, so a
      # CVE in a published image is an alert that closes when a later scan of
      # a re-released image stops reporting it. Runs only after a successful
      # scan (a failed probe uploads nothing); zero findings upload an empty
      # run, which is what keeps the tools page listing Trivy. The mirror
      # gates nothing — the run-colour rule above is unchanged.
      #
      # Each image's run carries its own category in
      # `runs[].automationDetails.id` (`trivy-image/<image>/<arch>/`): code
      # scanning keys an analysis by tool and category, and the upload action
      # refuses a file whose runs share one (#3877). The id in the file takes
      # precedence over the action's `category` input, so the steps set none.
      - name: Convert the reports to one SARIF per architecture
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            for image in ferroehr ferroehr-postgres ferroehr-viewer; do
              trivy convert --format sarif --output "${image}.${arch}.raw.sarif" "${image}.${arch}.json"
              jq --arg id "trivy-image/${image}/${arch}/" \
                '.runs |= map(.automationDetails = { id: $id })' \
                "${image}.${arch}.raw.sarif" > "${image}.${arch}.sarif"
            done
            jq -s '{ "$schema": .[0]."$schema", version: .[0].version, runs: [.[].runs[]] }' \
              ferroehr."${arch}".sarif ferroehr-postgres."${arch}".sarif ferroehr-viewer."${arch}".sarif \
              > "trivy-${arch}.sarif"
            # A probe, not a report: two runs under one category would be refused
            # at upload, so the run goes red here, where the cause is named.
            jq -e '[.runs[].automationDetails.id] | length == (unique | length)' "trivy-${arch}.sarif" > /dev/null
            jq -r --arg arch "$arch" '"trivy-\($arch): \([.runs[].results | length] | add) result(s) across \(.runs | length) run(s), one category each"' "trivy-${arch}.sarif"
          done
      - name: Upload the amd64 findings to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-amd64.sarif
      - name: Upload the arm64 findings to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-arm64.sarif

      # An issue with no failing check can be closed without the finding being
      # addressed, so the issue says what the remedy is and the remediation law
      # (.claude/rules/image-security.md) says who may VEX instead of fixing.
      - name: Write the tracking-issue body
        if: steps.scan.outputs.total != '0' && !inputs.report_only
        env:
          TOTAL: ${{ steps.scan.outputs.total }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            printf 'A scheduled scan of the PUBLISHED images found **%s** fixable HIGH/CRITICAL findings.\n\n' "$TOTAL"
            printf '| image | platform | digest | findings |\n|---|---|---|---|\n'
            cat findings.md
            printf '\nFull reports are attached to the run as `image-scan-reports`: %s\n' "$RUN_URL"
            printf '\nThese are findings **with a fix available**, so the remedy is a rebuild and'
            printf ' re-release of the affected image — not a VEX statement. A finding that is'
            printf ' genuinely unreachable in our usage belongs in `security/vex/` with its'
            printf ' argument, per `security/vex/README.md`.\n'
          } > body.md

      - name: File or update the tracking issue
        if: steps.scan.outputs.total != '0' && !inputs.report_only
        uses: ./.github/actions/file-watcher-issue # zizmor: ignore[self-repository] actionlint 1.7.12 refuses the $/ form (rhysd/actionlint#711)
        with:
          title: "security(images): published images carry fixable HIGH/CRITICAL findings"
          body-file: body.md
          type: Bug

      - name: Write the record issue body
        if: steps.record.outputs.uncovered == '1' && !inputs.report_only
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            printf 'The daily vulnerability record found findings without an OpenVEX judgement'
            printf ' on the published (`latest`) or main images. The release record refuses'
            printf ' a release candidate while one is open, so judge or fix each before the next tag.\n'
            cat uncovered.md
            printf '\nReports and records are attached to the run as `image-scan-reports`: %s\n' "$RUN_URL"
            printf '\nA finding with a fix is fixed by a rebuild; one without a fix gets a statement'
            printf ' in `security/vex/` with its argument, per `security/vex/README.md`.\n'
          } > record-body.md

      - name: File or update the record issue
        if: steps.record.outputs.uncovered == '1' && !inputs.report_only
        uses: ./.github/actions/file-watcher-issue # zizmor: ignore[self-repository] actionlint 1.7.12 refuses the $/ form (rhysd/actionlint#711)
        with:
          title: "security(images): image findings without an exploitability judgement"
          body-file: record-body.md
          type: Bug
