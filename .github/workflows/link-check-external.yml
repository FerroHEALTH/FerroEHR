# External link reachability — reported, never a merge gate (issue #2287).
#
# WHY THIS IS NOT IN THE PR PATH. Whether a third-party host answers a CI
# runner is not a property of the change under review. The docs `build` job's
# link-check failed two consecutive, unrelated pull requests on links that
# return 200 when fetched directly — one of which touched only a CI workflow —
# and lychee's caching turned each single reset into three reported failures.
# A gate that goes red for reasons the author cannot fix or influence teaches
# people to merge past red, which costs more than the check is worth.
#
# Internal links keep gating, in docs.yml, under `lychee --offline`. That is
# the property this repository actually controls, and a broken cross-reference
# is a real defect.
#
# A check nobody reads is not a check, so a genuine failure here opens an
# issue rather than writing to a log that closes with the run.
#
# RUN COLOUR (the watcher family's uniform rule, #2778). An unreachable link is a
# FINDING: it files or updates the report issue through
# .github/actions/file-watcher-issue and the run stays GREEN. The run goes RED
# only when the PROBE fails — lychee exiting non-zero without producing a summary
# at all, which is a broken invocation rather than an answer about any host.
name: External links

on:
  schedule:
    # Weekly, Monday 06:11 UTC. Off the hour: GitHub documents that runs
    # scheduled on the hour are delayed by load spikes
    # (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule).
    - cron: "11 6 * * 1"
  workflow_dispatch:

# The toolchain pins live in .github/actions/docs-toolchain (#2775); these two
# are site configuration, not tool pins.
env:
  SITE_ORIGIN: "https://ferroehr.eu"
  SITE_BASE: ""

permissions: {}

concurrency:
  group: link-check-external
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write        # file the report; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0 # zizmor: ignore[cache-poisoning]
      - uses: ./.github/actions/docs-toolchain

      - name: Render the generated includes the book expects
        run: |
          bash scripts/render/conformance-stats.sh includes
          bash scripts/render/comparison.sh
          bash scripts/render/perf-assets.sh
          bash scripts/render/conformance-assets.sh
          CONF_SUT=ehrbase bash scripts/render/conformance-assets.sh

      - name: Assemble the site
        run: bash scripts/site/build.sh --dev-only

      # The full check, external links included. Retries and a long timeout are
      # affordable here in a way they are not on the PR path: nobody is waiting
      # on this run, so a slow host gets the benefit of the doubt rather than
      # producing a false report. Hosts that need their own treatment are in
      # .github/lychee-external.toml, each with its reason. 429 is accepted outright — being rate-limited
      # is evidence the host is UP, which is the only thing being measured.
      # A non-zero lychee exit is a FINDING when it came with a summary, and a
      # PROBE FAILURE when it did not: the summary is the answer, and without one
      # there is nothing to report about any host. The exit codes themselves are
      # deliberately not read — the artifact is the evidence.
      - name: Check external links
        id: lychee
        run: |
          set -uo pipefail
          status=0
          lychee --no-progress --max-retries 5 --retry-wait-time 10 --timeout 45 \
            --config .github/lychee-external.toml \
            --accept '200..=299,429' --exclude-loopback \
            --root-dir "$PWD/_site" \
            --exclude '^https://ferroehr\.eu' \
            --output summary.md --format markdown \
            './_site/**/*.html' || status=$?
          finding=0
          if [ "$status" -ne 0 ]; then
            if [ -s summary.md ]; then
              finding=1
            else
              echo "::error::lychee exited ${status} without writing a summary — the probe itself failed"
              exit 1
            fi
          fi
          echo "finding=${finding}" >> "$GITHUB_OUTPUT"

      # Report through a file, never interpolated into the shell: every line of
      # that summary is remote content (URLs and server messages from
      # third-party hosts) and must not be parsed as script.
      - name: Write the report-issue body
        if: steps.lychee.outputs.finding == '1'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            printf 'The weekly external link check found unreachable links.\n\n'
            printf 'This is a REPORT, not a gate: a transient host failure must never block a\n'
            printf 'pull request (#2287). Confirm each one by hand before changing a link —\n'
            printf 'this check runs once a week and a host can simply have been down.\n\n'
            printf 'Run: %s\n\n' "$RUN_URL"
            cat summary.md
          } > body.md

      - name: Open or update the report issue
        if: steps.lychee.outputs.finding == '1'
        uses: ./.github/actions/file-watcher-issue
        with:
          title: "docs: external links are failing the scheduled reachability check"
          body-file: body.md
          labels: documentation,P3

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: external-link-summary
          path: summary.md
          if-no-files-found: ignore
