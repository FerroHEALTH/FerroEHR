# .github/workflows/nightly.yml: the lanes that read a clock or re-prove what
# the required set proves at a finer grain (owner decision D-4, 2026-11-24,
# #6517, #6518). None is in ci.yml's `conclusion`, so none blocks a merge: a
# required check is exact (docs/ci-cd.md). They run nightly on main, on a
# dispatch, and on a pull request labelled `ci:perf` (the timing lanes) or
# `ci:heavy` (every lane here). nightly-report.yml files one issue for a red
# scheduled run.
name: Nightly

on:
  schedule:
    - cron: "7 2 * * *" # daily 02:07 UTC, off the hour
  workflow_dispatch:
  # `labeled` starts a run when a label is added; a pull request without
  # either label skips every job.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: nightly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  # A FerroEHR started by any step of this workflow sends no usage report to
  # FerroPULSE (scripts/checks/usage-report-off.sh).
  FERROEHR__USAGE_REPORT__ENABLED: "false"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Which lanes this run takes. The labels come from the event payload, which
  # holds the pull request's labels at the time of the event.
  lanes:
    name: lanes
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci:heavy') ||
      contains(github.event.pull_request.labels.*.name, 'ci:perf')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the previous scheduled run and the CI runs base-rev.sh reads
    outputs:
      postgres_image: ${{ steps.postgres.outputs.image }}
      perf: ${{ steps.lanes.outputs.perf }}
      heavy: ${{ steps.lanes.outputs.heavy }}
      perf_base: ${{ steps.perf_base.outputs.rev }}
      perf_base_reason: ${{ steps.perf_base.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The CI PostgreSQL image, pinned by digest in docker/ci-postgres/image.ref
      # (#6520): non-durable, pg_stat_statements preloaded, 400 connections.
      - id: postgres
        run: |
          set -euo pipefail
          image="$(tr -d '[:space:]' < docker/ci-postgres/image.ref)"
          [[ "$image" =~ ^ghcr\.io/ferrohealth/ferroehr-ci-postgres@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::docker/ci-postgres/image.ref holds '$image', not ghcr.io/ferrohealth/ferroehr-ci-postgres@sha256:<digest>"
            exit 1
          }
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - id: lanes
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAVY_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:heavy') }}
          PERF_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:perf') }}
        run: |
          set -euo pipefail
          heavy=false
          if [ "$EVENT_NAME" != pull_request ] || [ "$HEAVY_LABEL" = true ]; then
            heavy=true
          fi
          perf="$heavy"
          [ "$PERF_LABEL" = true ] && perf=true
          echo "heavy=$heavy perf=$perf"
          {
            echo "heavy=$heavy"
            echo "perf=$perf"
          } >> "$GITHUB_OUTPUT"

      # The perf A/B base arm (#5741, #5956): on a pull request the base
      # branch's head, the first parent of the merge under test; on a schedule
      # or a dispatch the commit the previous scheduled run measured, so a
      # nightly judges the day's merges together. base-rev.sh passes over a
      # commit only when CI proved its database suite broken.
      - id: perf_base
        if: steps.lanes.outputs.perf == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/perf/base-rev.sh --self-test
          start="$(git rev-parse HEAD^1)"
          if [ "$EVENT_NAME" != pull_request ]; then
            head="$(git rev-parse HEAD)"
            previous="$(gh api "repos/$REPO/actions/workflows/nightly.yml/runs?event=schedule&branch=main&status=completed&per_page=5" \
              | jq -r --arg head "$head" '[.workflow_runs[] | select(.head_sha != $head)][0].head_sha // ""')"
            if [ -n "$previous" ] && git merge-base --is-ancestor "$previous" "$head"; then
              start="$previous"
            fi
          fi
          bash scripts/perf/base-rev.sh "$start" 30 | tee -a "$GITHUB_OUTPUT"

  # ── The slim server: the optional-integration features, subtracted ──────────
  # The clippy job above compiles with --all-features, so this job builds the
  # server without the optional integrations: every `require_disabled` refusal
  # path and `#[cfg(not(feature = …))]` block (#1890, #2358).
  #
  # Three feature sets, each a real deployment shape: the slim CDR, and the
  # `fhir` and `multimedia` integrations each enabled on top of it.
  # None implies another, so each lane proves the gates are not silently coupled.
  # clippy, not check: the deny-tier lints must cover the gated code too. No
  # tests — the feature graphs are compile properties, and the test job owns
  # behaviour.
  feature-combos:
    name: clippy (slim server feature combos)
    needs: lanes
    # The feature sets ARE the test, and they are declared here (#2373).
    if: needs.lanes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-cache, for the reason the clippy job states: sccache cannot cache
      # clippy-driver invocations (mozilla/sccache#539). This job's cache entry
      # is its own (rust-cache keys on the job), which is what it must be — the
      # target dir here holds a different feature graph than the clippy job's.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked -p ferroehr-server --no-default-features --all-targets -- -D warnings
      - run: cargo clippy --locked -p ferroehr-server --no-default-features --features fhir --all-targets -- -D warnings
      - run: cargo clippy --locked -p ferroehr-server --no-default-features --features multimedia --all-targets -- -D warnings
      # ferroehr-ext alone, per integration: its tests carry feature-scoped
      # expectations the server lanes never compile (#3703).
      - run: cargo clippy --locked -p ferroehr-ext --no-default-features --all-targets -- -D warnings
      - run: cargo clippy --locked -p ferroehr-ext --no-default-features --features multimedia --all-targets -- -D warnings
      # ferroehr alone: the workspace lanes unify its spec-crate features with
      # ferroehr-rest's, so a feature it uses and never declares stays hidden
      # there (#4820).
      - run: cargo clippy --locked -p ferroehr --all-features --all-targets -- -D warnings

  # ── openehr-its + openehr-sdt on wasm32: the browser-consumer selection ────
  # `openehr-its` publishes a feature graph whose openEHR content layers
  # (`json` → `xml` → `opt14`) are meant to compile for a browser client, while
  # `schema-validation` (jsonschema) and the three ITS-REST features (`rest`,
  # `rest-server` with axum, `rest-client` with reqwest) are not part of that
  # selection (the lane after this one clippies them natively); `openehr-sdt`
  # adds the Simplified Formats (`flat`) on top.
  # Nothing else in CI compiles those selections: the clippy job runs
  # --all-features. So the property was claimed by the manifests and checked
  # by no lane at all.
  #
  # Library target only, no --all-targets: the crates' dev-dependencies
  # (testkit -> sqlx, tokio -> mio) are native by construction and cannot build
  # for wasm32-unknown-unknown. The features are spelled out rather than left to
  # the implication chains, so a change to a chain cannot silently narrow what
  # this lane covers.
  its-wasm:
    name: clippy (openehr-its + openehr-sdt on wasm32)
    needs: lanes
    # The feature selection IS the test, and it is declared here (#2373).
    if: needs.lanes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-cache, for the reason the clippy job states: sccache cannot cache
      # clippy-driver invocations (mozilla/sccache#539). Its own cache entry:
      # this target dir holds a wasm32 build of a different feature graph.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: clippy
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked -p openehr-its --target wasm32-unknown-unknown --no-default-features --features opt14,xml,json -- -D warnings
      - run: cargo clippy --locked -p openehr-sdt --target wasm32-unknown-unknown --no-default-features --features flat -- -D warnings

  # ── openehr-its: the three ITS-REST features, each on its own ──────────────
  # `rest` is the contract both halves share (DTOs, param structs, route tables,
  # `ApiError`) over serde and `http`; `rest-server` adds the server traits and
  # `axum`; `rest-client` adds the generated clients and `reqwest`. The clippy
  # job compiles them only together (--all-features), where a gate missing from
  # one half is masked by the other, and the wasm lane compiles none of them. So
  # each feature is clippied alone, and the dependency split the manifest
  # promises is read back from `cargo tree`: a contract-only consumer builds
  # neither HTTP engine, and a client builds no server framework.
  #
  # Library target only, no --all-targets: the crate's dev-dependencies pull
  # every feature in through the test suite and would hide the property.
  its-rest-features:
    name: clippy (openehr-its REST features)
    needs: lanes
    # The feature selections ARE the test, and they are declared here (#2373).
    if: needs.lanes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-cache, for the reason the clippy job states: sccache cannot cache
      # clippy-driver invocations (mozilla/sccache#539). Its own cache entry:
      # this target dir holds three single-feature builds of one crate.
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked -p openehr-its --no-default-features --features rest -- -D warnings
      - run: cargo clippy --locked -p openehr-its --no-default-features --features rest-client -- -D warnings
      - run: cargo clippy --locked -p openehr-its --no-default-features --features rest-server -- -D warnings
      - name: The contract pulls no HTTP engine, the client no server framework
        shell: bash
        # A tree line names a package as `<name> v<version>`, so the leading
        # space and the trailing ` v` keep `axum-core` and the like from
        # matching a banned name.
        env:
          CONTRACT_BANNED: axum|reqwest
          CLIENT_BANNED: axum
        run: |
          set -euo pipefail
          refuse() {
            local feature="$1" banned="$2" tree found
            tree="$(cargo tree --locked -p openehr-its --no-default-features --features "$feature" -e normal)"
            if found="$(grep -E "[[:space:]]($banned) v[0-9]" <<<"$tree")"; then
              echo "::error::openehr-its --features $feature depends on a package it must not pull:"
              printf '%s\n' "$found"
              return 1
            fi
            echo "OK: --features $feature pulls none of: $banned"
          }
          refuse rest "$CONTRACT_BANNED"
          refuse rest-client "$CLIENT_BANNED"

  # ── MSRV verification: the declared rust-version must actually build ────────
  # The Cargo book names cargo-hack as the verification tool — a pinned stable
  # toolchain plus clippy::incompatible_msrv is not verification
  # (https://doc.rust-lang.org/cargo/guide/continuous-integration.html#verifying-rust-version).
  msrv:
    name: msrv (cargo-hack) ${{ matrix.shard }}
    needs: lanes
    if: needs.lanes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Each member is checked alone, with its own feature resolution, so the
    # members share few dependency builds (#6306). The shards split the members
    # by cost, each list beside the members whose builds it reuses; `others`
    # excludes what the two lists name, so a new member lands in a shard
    # without an edit here.
    strategy:
      fail-fast: false
      matrix:
        shard: [core, server, others]
    env:
      MSRV_CORE: openehr-adl openehr-am openehr-base openehr-its openehr-lang openehr-rm openehr-term testkit
      MSRV_SERVER: ferroehr ferroehr-rest ferroehr-server openehr-query
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-shared-key: msrv-${{ matrix.shard }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-hack
      - name: Check the shard's members on the declared rust-version
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          read -r -a core <<<"$MSRV_CORE"
          read -r -a server <<<"$MSRV_SERVER"
          args=()
          case "$SHARD" in
            core) for p in "${core[@]}"; do args+=(--package "$p"); done ;;
            server) for p in "${server[@]}"; do args+=(--package "$p"); done ;;
            others)
              args+=(--workspace)
              for p in "${core[@]}" "${server[@]}"; do args+=(--exclude "$p"); done
              ;;
            *) echo "::error::unknown msrv shard '$SHARD'"; exit 1 ;;
          esac
          cargo hack check --rust-version --locked --all-targets "${args[@]}"

  # The thread-CPU budget of the hot paths (#6321), judged on optimised code:
  # the `budget` profile is the release profile without LTO. ci.yml's test
  # lane runs the same test in a debug build, where it judges nothing. A
  # small write's share moves with the runner host up to twice over (#6477),
  # so three rounds run on three runners and cpu-budget-verdict fails only
  # when two of them breach.
  cpu-budget:
    name: hot-path CPU budget (optimised) ${{ matrix.round }}/3
    needs: lanes
    if: needs.lanes.outputs.perf == 'true'
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3]
    runs-on: ubuntu-latest
    # Room for the optimised test binary built on a cold cache on a busy runner
    # (#6321).
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read # the CI PostgreSQL image on GHCR
    services:
      postgres:
        image: ${{ needs.lanes.outputs.postgres_image }} # zizmor: ignore[unpinned-images] docker/ci-postgres/image.ref, checked name@sha256 where it is read
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: openehr
          POSTGRES_PASSWORD: openehr
          POSTGRES_DB: openehr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U openehr"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openehr:openehr@localhost:5432/openehr_test
      FERROEHR_TEST_PG_URL: postgres://openehr:openehr@localhost:5432/postgres
    steps:
      # The optimised build lost its runner with no log three times (#6497):
      # free the preinstalled toolchains it never uses, and record the disk
      # after the restore, the build and the test.
      - name: Free the runner's disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        # Its own entry, written on main: the optimised test binary built cold
        # outlasts the runner (#6388).
        with:
          # sccache holds the compiled crates when its bucket exists (#6521).
          cache-targets: ${{ vars.SCCACHE_BUCKET == '' }}
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/sccache # zizmor: ignore[self-repository] actionlint 1.7.12 refuses the $/ form (rhysd/actionlint#711)
        with:
          bucket: ${{ vars.SCCACHE_BUCKET }}
          endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          access-key-id: ${{ github.event_name == 'pull_request' && secrets.SCCACHE_RO_ACCESS_KEY_ID || secrets.SCCACHE_RW_ACCESS_KEY_ID }}
          secret-access-key: ${{ github.event_name == 'pull_request' && secrets.SCCACHE_RO_SECRET_ACCESS_KEY || secrets.SCCACHE_RW_SECRET_ACCESS_KEY }}
          read-only: ${{ github.event_name == 'pull_request' }}
      - name: Disk after the cache restore
        run: df -h / && du -sh target 2>/dev/null || true
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - name: Build the optimised test binary
        run: cargo nextest run --locked --cargo-profile budget -p ferroehr-rest --all-features --no-run
      - name: Disk after the build
        if: ${{ !cancelled() }}
        run: df -h / && du -sh target/budget 2>/dev/null || true
      - name: Every hot path within its CPU budget, optimised
        id: budget
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo nextest run --locked --cargo-profile budget -p ferroehr-rest --all-features --no-capture \
            -E 'test(every_hot_path_stays_within_its_cpu_budget)' 2>&1 | tee "$RUNNER_TEMP/cpu-budget.log"
      # A round is `success`, `unjudged` (the test refused a runner too noisy
      # to judge, which it checks only once every path passed, #6569), or
      # `breach` (any other failure).
      - name: The round's outcome
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.budget.outcome }}
          ROUND: ${{ matrix.round }}
        run: |
          set -euo pipefail
          mkdir -p cpu-round
          verdict=breach
          if [ "$OUTCOME" = success ]; then
            verdict=success
          elif grep -Fq 'the runner was too noisy to judge' "$RUNNER_TEMP/cpu-budget.log" 2>/dev/null \
            && ! grep -Fq 'a hot path exceeds its CPU budget' "$RUNNER_TEMP/cpu-budget.log"; then
            verdict=unjudged
          fi
          echo "round $ROUND: $verdict"
          echo "$verdict" > "cpu-round/round-$ROUND"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: cpu-round-${{ matrix.round }}
          path: cpu-round/
          retention-days: 7
      - name: Disk after the test
        if: ${{ !cancelled() }}
        run: df -h / && du -sh target/budget 2>/dev/null || true
  # The CPU budget's verdict over its three rounds (#6477): a breach on one
  # runner is the host, a breach on two is the code, and a round too noisy to
  # judge is no breach (#6569).
  cpu-budget-verdict:
    name: hot-path CPU budget verdict
    needs: cpu-budget
    if: ${{ !cancelled() && needs.cpu-budget.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cpu-round-*
          merge-multiple: true
          path: cpu-round
      - name: Two rounds of three breach, or none fails
        run: |
          set -euo pipefail
          rounds=0; breached=0; unjudged=0
          for f in cpu-round/round-*; do
            rounds=$((rounds + 1))
            outcome="$(cat "$f")"
            echo "${f##*/}: $outcome"
            case "$outcome" in
            success) ;;
            unjudged) unjudged=$((unjudged + 1)) ;;
            *) breached=$((breached + 1)) ;;
            esac
          done
          echo "$breached of $rounds rounds breached, $unjudged too noisy to judge" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$rounds" -eq 3 ] || { echo "::error::$rounds of 3 rounds reported"; exit 1; }
          [ "$breached" -lt 2 ]

  # The head arm's server binary, through the action ci.yml's ui-e2e-binary
  # runs: the same container, profile and binary cache key, so a tree CI
  # already built is restored and not compiled.
  server-binary:
    name: perf server binary
    needs: lanes
    if: needs.lanes.outputs.perf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    container: rust:1.99.1-slim-trixie@sha256:00544ccc9431a2fe93e65185d21381b0a039342f5cefcf84fbddac273c9e573d
    env:
      SOURCE_DATE_EPOCH: "1700000000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/server-binary # zizmor: ignore[self-repository] actionlint 1.7.12 refuses the $/ form (rhysd/actionlint#711)
        with:
          artifact-name: ui-e2e-server-binary

  # The base arm of the performance gate (#5326): the server binary of the
  # base commit `lanes` chose (#5741, #5956), built exactly as server-binary builds
  # the head: the same container, toolchain and e2e profile, so the A/B run
  # compares the change and not two build profiles. The binary cache keys on
  # the base tree's files the way ui-e2e-binary keys on the head's, so a base
  # that main already built is restored, not compiled.
  perf-base-binary:
    name: perf base server binary
    needs: lanes
    if: needs.lanes.outputs.perf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    container: rust:1.99.1-slim-trixie@sha256:00544ccc9431a2fe93e65185d21381b0a039342f5cefcf84fbddac273c9e573d
    env:
      SOURCE_DATE_EPOCH: "1700000000"
    outputs:
      rev: ${{ steps.base.outputs.rev }}
    steps:
      # The slim image carries no git, and without it the checkout is a
      # tarball with no history to take the base from.
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The green base can lie behind the base branch's head.
          fetch-depth: 0
      - id: base
        name: The base commit's tree
        shell: bash
        env:
          PERF_BASE: ${{ needs.lanes.outputs.perf_base }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rev="$PERF_BASE"
          [ -n "$rev" ] || { echo "::error::changes chose no perf base" >&2; exit 1; }
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          mkdir -p perf-base
          git archive "$rev" | tar -x -C perf-base
      - uses: ./.github/actions/server-binary # zizmor: ignore[self-repository] actionlint 1.7.12 refuses the $/ form (rhysd/actionlint#711)
        with:
          root: perf-base
          write-cache: "false"
          artifact-name: perf-base-server-binary

  # ── The performance gate (#5081, #5326) ──────────────────────────────────────
  # FerroPIX #490 shipped an outbox sender that ran about 8,000 PostgreSQL
  # transactions a second while idle, and no gate saw it. This one starts the
  # server this tree builds and the server of its base commit side by side,
  # both built with the e2e profile, each with its own PostgreSQL and under its
  # own tree's gate configuration, holds the head
  # to absolute idle limits, and judges the head's load phases against the
  # base's on the same runner (`ferrohealth-perf ab` through
  # scripts/perf/gate.sh, pinned in docs/VERSIONS.md): runners of one CPU model
  # differ by 25 to 45 %, so a stored baseline cannot judge a change. The
  # self-test runs first: an idle busy-loop must fail it. docs/release.md says
  # how to read the report.
  perf:
    name: perf
    needs: [lanes, server-binary, perf-base-binary]
    if: needs.lanes.outputs.perf == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      # 0 the head passed, 1 a breach for perf-verdict to judge.
      status: ${{ steps.gate.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base arm runs under its own commit's tree, archived from history.
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: false
      - name: Install the pinned ferrohealth-perf and ferrohealth-sop
        run: bash scripts/perf/gate.sh install
      # The artifact download loses the executable bit; the Dockerfile COPYs the
      # binary with `--chmod=0755`.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-e2e-server-binary
          path: bin/amd64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Package the app image (COPY-only, seconds)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr:perf
      - name: Build the postgres image (COPY-only, seconds)
        run: docker buildx build --load -t ferroehr-postgres:perf docker/postgres
      - name: An idle busy-loop fails the gate
        run: bash scripts/perf/gate.sh self-test ferroehr:perf ferroehr-postgres:perf
      # The base is the change's base commit, built by perf-base-binary with the
      # same profile and toolchain as the head, and packaged from its own tree
      # with its own Dockerfile and PostgreSQL image, so the two arms differ in
      # the change alone.
      - name: The base commit's tree
        env:
          BASE_REV: ${{ needs.perf-base-binary.outputs.rev }}
        run: |
          set -euo pipefail
          mkdir -p target/perf-base-context
          git archive "$BASE_REV" | tar -x -C target/perf-base-context
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perf-base-server-binary
          path: target/perf-base-context/bin/amd64
      - name: Package the base image (COPY-only, seconds)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: target/perf-base-context
          file: target/perf-base-context/docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr:perf-base
      - name: Build the base postgres image (COPY-only, seconds)
        run: docker buildx build --load -t ferroehr-postgres:perf-base target/perf-base-context/docker/postgres
      - name: The base the gate measures against, and why
        env:
          BASE_REV: ${{ needs.perf-base-binary.outputs.rev }}
          BASE_REASON: ${{ needs.lanes.outputs.perf_base_reason }}
        run: |
          set -euo pipefail
          mkdir -p target/perf
          printf '# Perf base\n\n%s\n\n%s\n' "$BASE_REV" "$BASE_REASON" | tee target/perf/base.md >> "$GITHUB_STEP_SUMMARY"
      # A breach is judged by perf-verdict, which reads the perf-accepted label
      # and the description; a run that could not be judged fails here.
      - name: The gate, the head against the base
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Eight pairs, so one low base sample cannot carry a breach: a
          # metric breaches in most of the pairs or not at all (#6458).
          PERF_PAIRS: "8"
          BASE_REV: ${{ needs.perf-base-binary.outputs.rev }}
        run: |
          set -euo pipefail
          status=0
          bash scripts/perf/gate.sh ab ferroehr:perf ferroehr-postgres:perf \
            ferroehr:perf-base ferroehr-postgres:perf-base "$BASE_REV" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = 1 ] && [ "$EVENT_NAME" = pull_request ]; then
            echo "::warning::perf gate: the head breached the base; perf-verdict judges whether the owner accepted it"
          fi
          # A scheduled breach fails here, and nightly-report.yml files it.
          [ "$status" = 0 ] || { [ "$status" = 1 ] && [ "$EVENT_NAME" = pull_request ]; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-report
          path: target/perf/
          if-no-files-found: warn

  # ── The perf verdict (#5924) ─────────────────────────────────────────────────
  # The gate's breach on a labelled pull request, judged apart from the
  # 30-minute measurement. A breach passes only when the owner accepted every
  # breached metric on the issue a `Perf-accepted:` line names, and it is
  # then reported as accepted beside the full report (docs/release.md).
  perf-verdict:
    name: perf-verdict
    needs: [perf]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # CODEOWNERS on the base branch
      issues: read # the acceptance on the named issue
      pull-requests: read # the label and the description when the job runs
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/lib
            scripts/perf
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perf-report
          path: target/perf
      - name: A breach passes only as a cost the owner accepted
        run: bash scripts/perf/accepted.sh --self-test
      # Context reaches the shell through env, never `${{ }}`-inline.
      - name: The gate's verdict, with the owner's accepted costs
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATUS: ${{ needs.perf.outputs.status }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          verdict=0
          bash scripts/perf/accepted.sh judge "$STATUS" target/perf/summary.md || verdict=$?
          case "$verdict:$STATUS" in
            0:1) echo "verdict=accepted" >> "$GITHUB_OUTPUT" ;;
            0:*) echo "verdict=pass" >> "$GITHUB_OUTPUT" ;;
            *) echo "verdict=fail" >> "$GITHUB_OUTPUT" ;;
          esac
          exit "$verdict"
