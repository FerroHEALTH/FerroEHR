# .github/workflows/perf-baseline.yml
#
# Writes the performance gate's load baseline, one entry per host shape (CPU
# model and memory size) of the `ubuntu-26.04` runner pool the `perf` job in
# ci.yml runs on (#5095). A load metric is comparable only on a like host, and
# the pool mixes shapes, so perf/baseline.toml holds one `[[baseline]]` entry
# per shape (ferrohealth-perf, pinned in docs/VERSIONS.md).
#
# Run it by hand. It builds the server binary the `perf` job gates, with the
# same profile in the same container, then measures it in `legs` jobs at once.
# Each job lands on whatever host the pool gives it and runs
# `scripts/perf/gate.sh update` over the committed file, which writes the entry
# of its own shape from the median of five load phases. The `merge` job folds
# the jobs into the committed file with `ferrohealth-perf merge`: per shape the
# median over the jobs, and as the noise floor the spread between the jobs, so
# the floor holds the spread between runners and not only within one. The
# merged file leaves as the `perf-baseline` artifact, and its summary lists the
# shapes it holds. Commit it in a reviewed change; run the workflow again until
# every shape the pool serves has its entry (docs/release.md, "Writing the
# baseline").
#
# No openEHR specification governs this: our own design.
name: Performance baseline

on:
  workflow_dispatch:
    inputs:
      legs:
        description: How many measuring jobs to run at once, each on the host the pool gives it.
        type: choice
        options: ["2", "4", "8", "12", "16"]
        default: "12"

permissions: {}

concurrency:
  group: perf-baseline
  cancel-in-progress: false

env:
  # The gate's server sends no usage report: gate.sh passes this switch to the
  # container it starts, and scripts/checks/usage-report-off.sh holds every
  # launcher to its own.
  FERROEHR__USAGE_REPORT__ENABLED: "false"

jobs:
  binary:
    name: server binary (e2e profile)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # The same container and profile as ci.yml's ui-e2e-binary job, whose
    # binary the `perf` job gates: a baseline of another build would judge
    # every pull request against the wrong figures.
    container: rust:1.99.1-slim-trixie@sha256:00544ccc9431a2fe93e65185d21381b0a039342f5cefcf84fbddac273c9e573d
    env:
      SOURCE_DATE_EPOCH: "1700000000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ci.yml's binary cache, read only: the exact key of the main build, so
      # a run on a commit main already built compiles nothing.
      - id: binary-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin/amd64/ferroehr
          key: ui-e2e-server-bin-1.99.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/**', 'crates/**', 'app/ferroehr/**', 'app/ferroehr-rest/**', 'app/ferroehr-server/**', 'tools/**') }}
      - name: Build the server binary (e2e profile, native)
        if: steps.binary-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --profile e2e --locked -p ferroehr-server
          strip target/e2e/ferroehr
          mkdir -p bin/amd64
          install -m0755 target/e2e/ferroehr bin/amd64/ferroehr
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-baseline-server-binary
          path: bin/amd64/ferroehr
          if-no-files-found: error
          retention-days: 1

  legs:
    name: legs
    needs: binary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        env:
          LEGS: ${{ inputs.legs }}
        run: echo "list=$(seq -s, 1 "$LEGS" | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"

  measure:
    name: measure (leg ${{ matrix.leg }})
    needs: [binary, legs]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    # Every leg at once, each from the committed file, so the merge sees the
    # spread between runners of one shape. A leg that cannot write its entry
    # uploads nothing, and the merge goes on with the others.
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.legs.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: Install the pinned ferrohealth-perf
        run: bash scripts/perf/gate.sh install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perf-baseline-server-binary
          path: bin/amd64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Package the app image (COPY-only, seconds)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-prebuilt
          load: true
          tags: ferroehr:perf
      - name: Build the postgres image (COPY-only, seconds)
        run: docker buildx build --load -t ferroehr-postgres:perf docker/postgres
      - name: Write this host shape's entry
        run: bash scripts/perf/gate.sh update ferroehr:perf ferroehr-postgres:perf
      - name: The host this leg ran on
        if: always()
        env:
          LEG: ${{ matrix.leg }}
        run: |
          set -euo pipefail
          model="$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')"
          memory="$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)"
          echo "### Leg ${LEG}: ${model}, MemTotal ${memory} kB" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: perf-baseline-leg-${{ matrix.leg }}
          path: perf/baseline.toml
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-report-leg-${{ matrix.leg }}
          path: target/perf/
          if-no-files-found: warn

  merge:
    name: merge the legs
    needs: measure
    if: always() && needs.measure.result != 'cancelled'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: Install the pinned ferrohealth-perf
        run: bash scripts/perf/gate.sh install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perf-baseline-leg-*
          path: legs
      # Per shape the median over the legs and the committed entry, and as the
      # noise floor the larger of their spread and every leg's own floor.
      - name: Merge the legs into the committed file
        run: |
          set -euo pipefail
          shopt -s nullglob
          jobs=(legs/*/baseline.toml)
          if [ "${#jobs[@]}" -eq 0 ]; then
            echo "::error::no leg wrote an entry"
            exit 1
          fi
          target/tools/perf/bin/ferrohealth-perf merge --baseline perf/baseline.toml "${jobs[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-baseline
          path: perf/baseline.toml
          if-no-files-found: error
