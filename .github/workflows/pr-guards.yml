# .github/workflows/pr-guards.yml
#
# Re-runs a pull-request guard of ci.yml when the label or the description it
# reads changes (#3948), without holding a runner while CI runs (#5380).
#
# ci.yml runs on `opened`, `synchronize` and `reopened` only. A label or
# description event would start a second run on the same commit, the
# concurrency group would cancel the first, and that run's `conclusion`, the
# required check, would report a failure. The guards read their escape labels
# and the description from the API when they run instead, and this workflow
# re-runs a guard whose verdict a later change may have flipped. Re-running a
# job re-runs its dependent jobs ("Re-run a job and its dependent jobs in a
# workflow run", https://docs.github.com/en/rest/actions/workflow-runs#re-run-a-job-from-a-workflow-run),
# so `conclusion` reports again in the same run.
#
# Two events start the one job, and neither waits for anything:
# - the label or description event, which acts when the CI run on the head
#   has already completed;
# - the completion of a CI run (`workflow_run`), which acts on a change made
#   while that run was in flight, and on the next stale guard after a re-run.
# The job judges from the state of the pull request, never from the event: a
# guard is stale when its label, or the description, changed after the guard
# job started and the change can flip its verdict. It re-runs the first stale
# guard and exits; the completion of that re-run brings the next. A re-run
# guard started after the change, so nothing loops.
#
# Nothing a merge depends on is decided here: each guard reads the pull
# request itself, and `conclusion` fails until a re-run passes. The
# `workflow_run` job runs main's copy of this file with a write token, so it
# reads pull-request data through the API only and runs no pull-request code.
# A pull request from a fork gets a read-only token on its label event, so a
# label changed on a fork after its CI run completed needs a maintainer to
# re-run the guard by hand. No specification governs this: our own design.
name: PR guards

on:
  pull_request:
    types: [labeled, unlabeled, edited]
  # The job below reads run and pull-request state through the API and
  # re-runs a job; it checks out only main's scripts/lib and runs no
  # pull-request code.
  workflow_run: # zizmor: ignore[dangerous-triggers] API reads and a job re-run only, no pull-request code
    workflows: [CI]
    types: [completed]

concurrency:
  # One check at a time per head commit, each reading the state it finds; a
  # newer pending check replaces an older one, which judged nothing yet.
  group: pr-guards-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  rerun:
    name: pr-guards
    if: >-
      (github.event_name == 'pull_request'
        && (contains(fromJSON('["no-changelog", "no-crate-bump", "no-chart-bump", "no-ui-visual-change"]'), github.event.label.name)
          || (github.event.action == 'edited' && github.event.changes.body != null)))
      || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write # read the CI run and re-run its guard jobs
      pull-requests: read # the head, the labels and the description of the pull request
    steps:
      # Only for scripts/lib/gh-retry.sh, the API retry the step below sources;
      # under `workflow_run` this is main's copy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/lib
      - name: Re-run the first guard a later change made stale
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # Each guard job and what it reads: an escape label, or the
          # description (tracker-status and control-matrix are steps of
          # `guards`).
          guards=(
            "changelog-guard no-changelog"
            "crate-version-guard no-crate-bump"
            "chart-version-guard no-chart-bump"
            "ui-screenshot-guard no-ui-visual-change"
            "privacy-boundary-guard description"
            "guards description"
          )

          # Every API read goes through gh_retry: GitHub answers 5xx bursts of
          # several minutes, so it backs off for fifteen before failing the job,
          # and says the API failed rather than a guard (#4173).
          # shellcheck source=scripts/lib/gh-retry.sh
          . scripts/lib/gh-retry.sh

          if [ -z "${PR}" ]; then
            # A CI run from a fork names no pull request; its head commit does.
            open=$(gh_retry gh pr list --state open --search "${HEAD}" --json number,headRefOid) || exit 1
            PR=$(jq -r --arg h "${HEAD}" '[.[] | select(.headRefOid == $h)][0].number // empty' <<<"${open}")
            if [ -z "${PR}" ]; then
              echo "no open pull request has ${HEAD} as its head"
              exit 0
            fi
          fi
          if [ -z "${RUN}" ]; then
            RUN=$(gh_retry gh run list --workflow ci.yml --commit "${HEAD}" --event pull_request \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty') || exit 1
            if [ -z "${RUN}" ]; then
              echo "no CI run on ${HEAD} yet; the run that starts on it reads the pull request itself"
              exit 0
            fi
          fi

          state=$(gh_retry gh run view "${RUN}" --json status,conclusion --jq '"\(.status) \(.conclusion)"') || exit 1
          read -r status conclusion <<<"${state}"
          if [ "${status}" != completed ]; then
            echo "CI run ${RUN} is ${status}; its completion checks the guards again"
            exit 0
          fi
          if [ "${conclusion}" = cancelled ]; then
            echo "CI run ${RUN} was cancelled; the run that replaced it reads the pull request itself"
            exit 0
          fi

          # The head, the labels now, the label changes and the last edit of
          # the description, in one read. The query's variables are GraphQL's.
          # shellcheck disable=SC2016
          pull=$(gh_retry gh api graphql -F owner="${GH_REPO%%/*}" -F name="${GH_REPO#*/}" -F number="${PR}" \
            --jq '.data.repository.pullRequest' -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  headRefOid
                  lastEditedAt
                  labels(first: 100) { nodes { name } }
                  timelineItems(last: 100, itemTypes: [LABELED_EVENT, UNLABELED_EVENT]) {
                    nodes {
                      ... on LabeledEvent { createdAt label { name } }
                      ... on UnlabeledEvent { createdAt label { name } }
                    }
                  }
                }
              }
            }') || exit 1
          # Re-running an older commit's run would cancel the newer commit's
          # run, which shares its concurrency group.
          if [ "$(jq -r .headRefOid <<<"${pull}")" != "${HEAD}" ]; then
            echo "the pull request moved past ${HEAD}; the run of its new head reads the pull request itself"
            exit 0
          fi

          # A failed read is retried, never taken for a missing guard (#3951).
          jobs=$(gh_retry gh run view "${RUN}" --json jobs) || exit 1
          for entry in "${guards[@]}"; do
            read -r guard reads <<<"${entry}"
            job=$(jq -c --arg g "${guard}" '[.jobs[] | select(.name == $g)][0] // empty' <<<"${jobs}")
            if [ -z "${job}" ]; then
              echo "${guard} is not a job of CI run ${RUN}"
              continue
            fi
            id=$(jq -r .databaseId <<<"${job}")
            outcome=$(jq -r .conclusion <<<"${job}")
            started=$(jq -r .startedAt <<<"${job}")
            # Both sides are UTC instants of one ISO 8601 shape, so they
            # compare as strings.
            if [ "${reads}" = description ]; then
              changed=$(jq -r --arg s "${started}" '(.lastEditedAt // "") > $s' <<<"${pull}")
              case "${outcome}" in success | failure) flips=true ;; *) flips=false ;; esac
            else
              changed=$(jq -r --arg s "${started}" --arg l "${reads}" \
                'any(.timelineItems.nodes[]; .label.name? == $l and .createdAt > $s)' <<<"${pull}")
              present=$(jq -r --arg l "${reads}" 'any(.labels.nodes[]; .name == $l)' <<<"${pull}")
              # A label added can only turn a failure into a pass and a label
              # removed only a pass into a failure.
              case "${present}:${outcome}" in true:failure | false:success) flips=true ;; *) flips=false ;; esac
            fi
            if [ "${changed}" != true ]; then
              echo "${guard} read the pull request as it is now"
            elif [ "${flips}" != true ]; then
              echo "${guard} reported ${outcome}, which still holds"
            elif gh run rerun --job "${id}"; then
              echo "re-ran ${guard} and its dependents in CI run ${RUN}; that run's completion checks the rest"
              exit 0
            else
              echo "::error::could not re-run ${guard} in CI run ${RUN}; a fork's label event has a read-only token, so re-run it by hand"
              exit 1
            fi
          done
