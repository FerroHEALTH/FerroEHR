# .github/workflows/publish-chart.yml
#
# Publishes the Helm chart to GHCR as an OCI artifact (issues #2104–#2106).
#
# OCI ONLY — no HTTP chart repository, no `index.yaml`, no chart branch (owner
# ruling on #2105). The chart lands beside the images it deploys, under the same
# owner, authentication and retention, and Artifact Hub consumes an OCI
# repository directly. The cost, stated rather than hidden: `helm repo add` does
# not work for this chart, so consumers older than Helm 3.8 (which made OCI a
# first-class registry) are excluded.
#
# DISPATCH ONLY (#2776). A release publishes the chart as a `needs`-ordered leg
# of release.yml, which owns the `v*` tag end to end — that is what makes the
# appVersion image the chart is judged against pullable by construction instead
# of polled for. This file remains the BETWEEN-RELEASES lane: a chart-only fix
# does not wait for an unrelated application release, and it is also the
# recovery path when a release's chart leg fails after the push (bump the chart
# version and publish it from here).
#
# The default dispatch is a DRY RUN — it packages and runs every pre-flight
# check but pushes nothing — mirroring publish-crates.yml. Two pre-flights read
# differently on this path than on a release, and the reasoning sits at each of
# them in build-chart.yml: the image-acceptance check judges against an image
# built from the current tree, and the already-published refusal reports instead
# of failing (the tree's chart version is normally published for the whole cycle
# after a release, which made dry runs impossible).
#
# WHY there is no `helm package --sign` / `.prov` provenance: PGP signing needs a
# long-lived private key in CI, which is the exact thing the crates.io lane was
# built to avoid (Trusted Publishing via OIDC, no long-lived token anywhere), and
# a key in a repository secret is a worse posture than no key at all. The chart
# instead carries two KEYLESS Sigstore artifacts, which answer different
# questions and are both produced below:
#   * a cosign SIGNATURE — "this artifact was signed by this workflow". The
#     signer is the REUSABLE workflow, which is what a Fulcio certificate names
#     and what this lane's own read-back asserts — never this caller.
#       cosign verify ghcr.io/ferrohealth/charts/ferroehr@sha256:… \
#         --certificate-identity-regexp '^https://github\.com/FerroHEALTH/FerroEHR/\.github/workflows/build-chart\.yml@' \
#         --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   * a SLSA build PROVENANCE attestation — "it was built from this source, this way"
#       gh attestation verify oci://ghcr.io/ferrohealth/charts/ferroehr:X.Y.Z -R FerroHEALTH/FerroEHR
# The consequence for consumers is honest: `helm install --verify` (which only
# understands a `.prov`) does not apply; the two commands above do.
name: Publish chart

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Really push the chart to GHCR (false = dry run)"
        required: false
        default: false
        type: boolean

# An OCI tag is MUTABLE — verified against a local registry: a second
# `helm push` of the same chart version silently replaced the manifest and
# returned a different digest, with no warning. So a published chart version is
# only immutable because this lane refuses to overwrite one, and two concurrent
# runs must never race that check. Queue, never cancel — and the release
# pipeline's chart leg declares the SAME group, so a dispatch cannot race a
# release either.
concurrency:
  group: publish-chart
  cancel-in-progress: false

permissions: {}

env:
  CHART_DIR: deploy/helm/ferroehr
  # `helm push` appends the chart name, so the chart lands at
  # ghcr.io/<owner>/charts/ferroehr.
  OCI_NAMESPACE: oci://ghcr.io/ferrohealth/charts
  CHART_REF: ghcr.io/ferrohealth/charts/ferroehr
  APP_IMAGE: ghcr.io/ferrohealth/ferroehr

jobs:
  publish:
    name: package + publish
    permissions:
      contents: read
      packages: write # push the chart + the artifacthub.io tag to GHCR
      id-token: write # Sigstore, for the keyless attestation
      attestations: write # store it against this repository
    # The whole build lives in the reusable build-chart.yml — the SLSA Build
    # L3 construction (#2140): this caller has no steps at all. No
    # `release-tag`: that input is what marks a call as a release cut, and this
    # lane is deliberately never one.
    uses: ./.github/workflows/build-chart.yml
    with:
      publish: ${{ inputs.publish }}
