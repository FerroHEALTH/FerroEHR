# .github/workflows/publish-crates.yml
#
# Publishes the nine `crates/*` openEHR spec crates to crates.io
# (issue #1886; procedure: .claude/rules/changelog.md §Publishing the
# openehr-* crates).
#
# DISPATCH ONLY, and no longer the primary path (#2836). A release publishes the
# crates as an approval-gated `needs`-ordered leg of release.yml, which owns the
# `v*` tag end to end — that is what stops a cut from shipping with the spec
# crates stepped and unpublished, which is what happened to v4.0.6 while this
# lane was the only route. This file remains the BETWEEN-RELEASES lane: the
# dry run that rehearses a publish against the current tree, and the recovery
# path when a release's crates leg fails (re-running it here finishes the set,
# because "already exists" counts as done).
#
#   - The lockstep version is set HERE, never in a pull request (#4555):
#     `publish-crates.sh plan` reads crates.io and the commit its newest
#     archive was packaged from, and `stamp` writes the result into this
#     checkout only (manifests, internal requirements, both lockfiles). The
#     publish refuses changed content under a version crates.io already holds.
#   - The default dispatch is a DRY RUN (`cargo publish --workspace --dry-run` —
#     package + verify, no upload), mirroring publish-chart.yml; a real publish
#     requires the `publish` input set to `true`.
#   - Authentication is crates.io Trusted Publishing (OIDC): the
#     `rust-lang/crates-io-auth-action` step exchanges this workflow's OIDC
#     identity for a 30-minute publish token. No long-lived crates.io token
#     exists in the repository. Trusted Publishing matches the TOP-LEVEL
#     workflow filename, so each crate carries two publisher entries — one
#     naming this file and one naming `release.yml` — both under this repository
#     and the `crates-io` environment. A crate's FIRST-ever release cannot use
#     OIDC and is pushed manually with a scoped token.
#   - The real publish walks the crates one at a time in dependency order via
#     scripts/release/publish-crates.sh, the one implementation this lane and
#     the release leg share (a reusable workflow cannot be shared here: the OIDC
#     identity would name the caller either way — the script's header carries
#     the citations). `cargo publish --workspace` is kept for the DRY RUN alone,
#     where its all-or-nothing behaviour costs nothing and every member is
#     verified together.
name: Publish crates

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Really publish to crates.io (false = dry run)"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  dry-run:
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # The full history: the plan compares HEAD with the commit crates.io's
      # newest archive was packaged from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # No cache in a publishing lane: the dry run must verify the same bytes
      # the real publish will upload (setup-rust-toolchain caches by default).
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: Plan and stamp the lockstep version
        run: |
          set -euo pipefail
          version="$(bash scripts/release/publish-crates.sh plan)"
          bash scripts/release/publish-crates.sh stamp "$version"
      - name: Package + verify every publishable crate (no upload)
        run: cargo publish --workspace --dry-run --locked --allow-dirty

  publish:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The protected environment is part of each crate's Trusted Publisher
    # configuration on crates.io — a publish outside it is refused. It also
    # carries the required reviewer the release leg pauses on, so a dispatched
    # publish waits for the same approval.
    environment: crates-io
    # Shared with the release pipeline's crates leg — two runs uploading the
    # same immutable versions must never interleave. Job-level and unkeyed on
    # purpose: workflow-level would queue an innocent dry run behind a release's
    # approval pause, and a ref-keyed group would put a tag-triggered release and
    # a main dispatch in different groups, which is no group at all. Queue,
    # never cancel.
    concurrency:
      group: publish-crates
      cancel-in-progress: false
    permissions:
      contents: read
      # OIDC token exchange (rust-lang/crates-io-auth-action).
      id-token: write
    steps:
      # The full history: the plan and the publish compare HEAD with the
      # commits crates.io's archives were packaged from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # No cache in the lane that uploads to crates.io: a published version is
      # immutable, so it must be built from this checkout and nothing else.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: Plan and stamp the lockstep version
        run: |
          set -euo pipefail
          version="$(bash scripts/release/publish-crates.sh plan)"
          bash scripts/release/publish-crates.sh stamp "$version"
      - id: auth
        name: Exchange OIDC identity for a temporary crates.io token
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the nine spec crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash scripts/release/publish-crates.sh publish

      # The registry is the GROUND TRUTH, not the exit code above — hence
      # `always()`. Without it GitHub skips the verification on failure, so a run
      # that actually published everything but misread its own output ends red
      # with nothing to contradict it, and one that genuinely stranded a crate
      # ends red with no record of WHICH one.
      - name: Verify all nine crates resolve at the same version
        if: always() && inputs.publish
        run: bash scripts/release/publish-crates.sh verify
