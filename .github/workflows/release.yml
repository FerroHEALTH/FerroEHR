# .github/workflows/release.yml — THE release pipeline (#2776).
#
# ONE workflow owns the `v*` tag, and every ordering in it is a `needs` edge.
# No job here polls another workflow's runs or jobs: `needs` is the only
# primitive that carries a guarantee (a concurrency group has no queue-order
# guarantee, and a `workflow_run` conclusion is run-level, so an advisory
# scanner in the same run can suppress an unrelated consumer). Three
# consecutive cuts failed on three different faces of that one defect —
# v4.0.3 (an advisory scan suppressed the sandbox deploy), v4.0.4 (a single
# TLS timeout inside a poll loop failed the chart lane), v4.0.5 (the poll
# waited on a job that finishes BEFORE the tag it pulls exists — `manifest
# unknown`, run 32951186365).
#
# The graph:
#
#   plan ─┬─ github-release ── build-binaries ─── finalize-release ── crates
#         ├─ binary ─────────── app-image ──┐
#         ├─ viewer-binary ── viewer-image ─┼─ scan-and-tag ─────┬─ chart
#         ├─ postgres-image ────────────────┘                    └─ sandbox
#         ├─ docs-freeze
#         └─ (smoke hangs off app-image; viewer-smoke off both images —
#             it drives the viewer against this run's own CDR)
#   announce ── needs everything, if: always()
#
# `crates` is the one leg that PAUSES: it runs in the `crates-io` environment,
# which carries a required reviewer, so the pipeline waits for an explicit
# human approval before anything reaches crates.io (#2836 — the publish used to
# be a dispatch someone had to remember, and v4.0.6 shipped with the eight
# spec crates stepped and unpublished). Nothing needs it, so the pause blocks
# no other leg.
#
# `plan` re-runs the ENTIRE release-fact guard tier against the tagged commit
# before anything is built or published. That closes a structural hole rather
# than a slip: those guards ran on pull requests and main pushes only, and
# GitHub cancels a PENDING run in a concurrency group when a newer one queues
# regardless of `cancel-in-progress` (workflow-syntax docs §concurrency), which
# is exactly how the v4.0.5 release commit's main CI run — the whole guard
# tier — was cancelled and never reported.
#
# RE-RUNNING is the recovery for every partial failure, and each leg is
# idempotent by construction: images push by digest and are re-tagged, the
# GitHub release updates its draft until it is published, docs-freeze is a
# green no-op on an already-cut version, the sandbox deploy is a pull-and-
# recreate the box repeats harmlessly, and the crates leg treats an
# already-published version as done.
# The ONE leg that is not is the chart: a published chart version is immutable,
# so a failure after `helm push` means the fix ships as the next chart version
# (that lane says so at the point of failure). A crates.io version is immutable
# too, but it can be YANKED and superseded, so its recovery is a version bump
# rather than a wedged pipeline.
#
# `workflow_dispatch` re-runs the pipeline for an existing tag, and must be
# dispatched AT the tag (`gh workflow run Release --ref vX.Y.Z -f tag=vX.Y.Z`).
# `plan` refuses anything else: the reusable image, chart and docs legs resolve
# the event's own ref, so a dispatch from main would build main's tree and
# label it with the tag's version.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to (re)publish — dispatch this workflow AT that tag"
        required: true
        type: string

# A release must never be cancelled part-way through publishing: a half-created
# release with some assets attached is worse than a queued second run. So a second
# tag push QUEUES behind the first rather than replacing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # ── plan: every release fact, verified before anything is built ─────────────
  # Minutes, and it publishes nothing. A red plan costs seconds and leaves the
  # registry, the release list, the chart repository and the site untouched.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.rev.outputs.sha }}
      is-release: ${{ steps.kind.outputs.is-release }}
      is-prerelease: ${{ steps.kind.outputs.is-prerelease }}
    steps:
      - id: tag
        name: Resolve the release tag
        # The dispatch input reaches the shell via env, never `${{ }}`-inline
        # (workflow-injection hygiene), and must match a full semver tag shape
        # before it is used as a checkout ref below — `case v*` accepted any
        # string starting with "v".
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            if [ "${GITHUB_REF}" != "refs/tags/${tag}" ]; then
              echo "::error::this workflow was dispatched at '${GITHUB_REF}', not at refs/tags/${tag}. The image, chart and docs legs resolve the event's own ref, so a dispatch from a branch would publish that branch's tree under ${tag}. Run: gh workflow run Release --ref ${tag} -f tag=${tag}" >&2
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if ! printf '%s\n' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a vX.Y.Z tag" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"
      # github.sha is the commit the event ref pointed at, fixed for the whole
      # run: the tag-mismatch refusal above guarantees it IS the tag's commit
      # on a dispatch too. Checking it out (rather than the input-derived tag
      # string) keeps workflow_dispatch input out of every checkout, which is
      # also what the CodeQL actions taint model verifies (#2790).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: rev
        name: Record the pinned commit
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # The tag comes from the step above (a dispatch names it, a push carries
      # it), never from the ref alone. THE prerelease rule, one definition.
      - id: kind
        uses: ./.github/actions/release-kind
        with:
          tag: ${{ steps.tag.outputs.tag }}

      - name: Verify the tag matches the workspace version
        run: |
          set -euo pipefail
          manifest=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match workspace version $manifest in Cargo.toml." >&2
            exit 1
          fi
          echo "workspace version $manifest matches $TAG"
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}

      - name: Changelog structure (no duplicate subsections, canonical types)
        run: bash scripts/checks/changelog-structure.sh

      # EHDS Art. 30(2): a release that changes the logging component carries
      # its technical documentation; the previous release is taken by version.
      - name: The technical documentation follows the logging component
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          base="${TAG%%-*}"
          prev="$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "$base" \
            | { cat; echo "$base"; } | sort -V | awk -v t="$base" '$0==t{print p; exit} {p=$0}')"
          [ -n "$prev" ] || { echo "::error::no release tag below $base"; exit 1; }
          git fetch --no-tags --depth=1 origin "+refs/tags/${prev}:refs/tags/${prev}"
          bash scripts/checks/technical-documentation.sh --since "$prev"

      # The release NOTES are produced here, not at publish time: the section
      # existing and being non-empty is a release fact like any other, and the
      # extraction that proves it may as well hand the result on. The artifact
      # is what github-release attaches.
      - name: Extract the changelog section for this tag
        run: |
          set -euo pipefail
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION — releases are changelog-driven (Keep a Changelog). Add '## [$VERSION] - YYYY-MM-DD' first." >&2
            exit 1
          fi
          # Everything between "## [<version>]" and the next "## [" heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::The [$VERSION] changelog section is empty." >&2
            exit 1
          fi
          # CRA Art 13(19) and Annex II point 7: the end of the support
          # period, at least month and year, five years from the release date.
          released="$(sed -n "s/^## \[$VERSION\] - \([0-9-]*\).*/\1/p" CHANGELOG.md)"
          if ! end="$(date -u -d "$released +5 years" '+%B %Y')"; then
            echo "::error::The [$VERSION] heading carries no release date to count the support period from." >&2
            exit 1
          fi
          {
            echo
            echo "### Support period"
            echo
            echo "Cadasto B.V. handles vulnerabilities in this release until the end of $end (Regulation (EU) 2024/2847 Art 13(8) and (19)). The security update for a release in its support period ships in the newest release; see [SECURITY.md](https://github.com/FerroHEALTH/FerroEHR/blob/main/SECURITY.md#supported-versions)."
          } >> release-notes.md
          echo "Release notes for $VERSION:"; cat release-notes.md
        env:
          VERSION: ${{ steps.tag.outputs.version }}

      # The hand-edited pin sites, every one of them, at the commit being
      # released. Each of these guards exists because its site shipped stale
      # once; they ran on pull requests only, so a cut whose main CI run was
      # cancelled re-verified nothing.
      # The committed appVersion equals the workspace version (#2890, the
      # compose treatment), and this plan job has already asserted the tag
      # equals the workspace version above — so re-running the guard here
      # transitively pins appVersion == ${TAG#v}. The chart leg's
      # `helm package --app-version ${TAG#v}` injection stays as belt-and-braces
      # and keeps the between-releases dispatch lane correct. One script, so
      # this and the `chart-appversion` CI job cannot drift apart.
      - name: The committed chart release facts are coherent
        run: bash scripts/checks/chart-appversion.sh

      # Every release publishes a DIFFERENT packaged chart (appVersion, image
      # tags and changes are injected at package time, #2779), so every release
      # needs its own chart version — and since the injection, no diff-guard
      # forces the bump. Refusing here costs seconds; the chart leg refusing
      # after the images published costs a red release (v4.0.6-rc3, #2818).
      - uses: ./.github/actions/helm-pinned
      - name: The chart version is not already published
        env:
          CHART_REF: ghcr.io/ferrohealth/charts/ferroehr
        run: |
          ver=$(awk '$1 == "version:" {print $2; exit}' deploy/helm/ferroehr/Chart.yaml)
          if helm show chart "oci://${CHART_REF}" --version "$ver" >/dev/null 2>&1; then
            echo "::error::chart version ${ver} is already published at ${CHART_REF} — every release ships a distinct packaged chart (injected release facts), so bump deploy/helm/ferroehr/Chart.yaml version in the release PR." >&2
            exit 1
          fi
          echo "chart ${ver} is unpublished — the chart leg can ship it"

      - name: The ferroehr party statement's product version matches the workspace
        run: bash scripts/checks/statement-version.sh

      - name: CITATION.cff version matches the workspace version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          cff_ver=$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/p' CITATION.cff)
          if [ "$cff_ver" != "$VERSION" ]; then
            echo "::error::CITATION.cff version ($cff_ver) != released version ($VERSION) — the release cut bumps CITATION.cff version and date-released together." >&2
            exit 1
          fi
          echo "CITATION.cff version $cff_ver matches the released version."

      # `.zenodo.json` is GENERATED from CITATION.cff, because Zenodo ignores
      # CITATION.cff entirely whenever a .zenodo.json is present
      # (https://help.zenodo.org/docs/github/describe-software/zenodo-json/).
      # The deposit's FILES freeze at publication, so a drifted copy is archived
      # under a DOI nobody can correct — this is the last moment it can be seen.
      - name: .zenodo.json is in sync with CITATION.cff
        run: bash scripts/render/zenodo-json.sh --check

      - name: docker-compose.yml and the hosted compose image tags match their policy
        run: bash scripts/checks/compose-image-tags.sh

      - name: Documented keys resolve in their source
        run: bash scripts/checks/docs-claims.sh --all

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

      - name: Plan
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.rev.outputs.sha }}
          IS_RELEASE: ${{ steps.kind.outputs.is-release }}
          IS_PRERELEASE: ${{ steps.kind.outputs.is-prerelease }}
        run: |
          {
            printf '## Release plan\n\n| | |\n|---|---|\n'
            printf '| tag | `%s` |\n' "$TAG"
            printf '| commit | `%s` |\n' "$SHA"
            printf '| release | `%s` |\n' "$IS_RELEASE"
            printf '| pre-release | `%s` |\n' "$IS_PRERELEASE"
            printf '\nEvery release fact verified at this commit. Nothing published yet.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── The GitHub release, created as a DRAFT ──────────────────────────────────
  github-release:
    name: github release (draft)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create or update the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }} # == plan's pinned commit: the dispatch-at-tag refusal makes them equal (#2790)
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      # An SPDX SBOM of the REPOSITORY, generated from the release commit.
      #
      # This is the third SBOM this project publishes and it is not redundant
      # with the other two — they answer different questions for different
      # readers, and both reviews happen for a clinical deployment:
      #
      #   * the CycloneDX `.cdx.json` per binary (release-build.yml) carries the
      #     cargo dependency GRAPH with direct-versus-transitive edges and purls,
      #     which is what a vulnerability tool consumes;
      #   * the SPDX SBOM BuildKit attaches to each container image index
      #     (build-image.yml) describes the image's OS layer;
      #   * this one is the ATTRIBUTION document for the source tree — the
      #     licence-obligation view a legal or procurement reviewer of a
      #     four-licence redistribution asks for.
      #
      # It existed nowhere a consumer could reach before: the licence-scanning
      # lane deliberately generates no report (its token is push-only), so there
      # was no repository SBOM at all.
      #
      # SPDX also satisfies the CISA/NTIA minimum-element data fields directly:
      # supplier, component name, version, other unique identifiers (purl),
      # dependency relationships, SBOM author and timestamp
      # (https://www.cisa.gov/sbom).
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: syft@1.50.0
      - name: Generate the repository SPDX SBOM
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # `dir:.` catalogues the checked-out release commit, so the document
          # describes the tree the release was cut from rather than a graph
          # resolved afterwards.
          #
          # --source-name/--source-version, or the document names itself after
          # the scanned directory: v3.17.4 shipped an SBOM whose `name` was
          # literally "." (#2335). A consumer ingesting several SBOMs lists them
          # by name, and one called "." is indistinguishable from any other
          # directory scan.
          syft scan "dir:." \
            --source-name ferroehr --source-version "$VERSION" \
            --output "spdx-json=ferroehr-${TAG}.spdx.json"
          # Refuse to attach a document that is not SPDX, or that does not
          # identify itself — either one ships a file that looks like an SBOM
          # and answers no question a consumer can ask of it.
          version="$(jq -r '.spdxVersion' "ferroehr-${TAG}.spdx.json")"
          case "$version" in
            SPDX-*) ;;
            *) echo "::error::generated SBOM is not SPDX (spdxVersion=${version})"; exit 1 ;;
          esac
          name="$(jq -r '.name' "ferroehr-${TAG}.spdx.json")"
          if [ "$name" != "ferroehr" ]; then
            echo "::error::SPDX document names itself '${name}', expected 'ferroehr'"
            exit 1
          fi
          count="$(jq '.packages | length' "ferroehr-${TAG}.spdx.json")"
          [ "$count" -gt 0 ] || { echo "::error::the SPDX SBOM lists no packages"; exit 1; }
          echo "SPDX ${version}, ${count} packages"

      # Created as a DRAFT, and finalized only after every asset is attached.
      #
      # Release immutability is enabled on this repository: once a release is
      # PUBLISHED, its assets and tag can no longer be modified. The binaries,
      # SBOMs and Sigstore bundles are produced by the build-binaries matrix
      # that runs after this job, so publishing here would freeze the release
      # before its most important assets exist — a release carrying the compose
      # files and nothing to verify. A draft is still mutable, which is exactly
      # the window those uploads need.
      # EHDS Art. 30(1)(d): the information sheet and the instructions for use
      # of this tag ride the release.
      - name: Cut the information sheet and the instructions for use
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: bash scripts/release/accompanying-documents.sh "$TAG" .

      - name: Create the GitHub release as a draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: ${{ needs.plan.outputs.tag }}
          # The release TITLE is the bare version (owner rule 2026-08-26): the
          # repository already says whose release it is.
          name: ${{ needs.plan.outputs.version }}
          body_path: release-notes.md
          # The quickstart compose files ride along as release assets: the base
          # file pulls the images this tag published, and the two standalone
          # overlays are downloaded beside it, so a downloader never has to
          # clone the repo to run the release.
          files: |
            docker-compose.yml
            docker-compose.keycloak.yml
            docker-compose.observability.yml
            docker-compose.db-publish.yml
            ferroehr-${{ needs.plan.outputs.tag }}.spdx.json
            ferroehr-${{ needs.plan.outputs.tag }}-information-sheet.md
            ferroehr-${{ needs.plan.outputs.tag }}-instructions-for-use.md
          # Releases publish as OFFICIAL releases (owner sign-off
          # 2026-07-31, superseding the 2026-07-11 always-prerelease rule);
          # only an explicitly suffixed tag (v3.16.0-rc1, ...) is a
          # pre-release. The rule itself lives in .github/actions/release-kind,
          # which `plan` ran.
          prerelease: ${{ needs.plan.outputs.is-prerelease }}

  # Native runner per arch (no cross toolchain, no QEMU) — same strategy as the
  # image lanes below.
  #
  # This job is a CALL AND NOTHING ELSE, deliberately. SLSA Build L3 requires the
  # signing material to be out of reach of user-defined build steps
  # (https://slsa.dev/spec/v1.2/build-requirements), and a job's steps all share one runner
  # VM. Moving the build and its attestation into a reusable workflow puts them on
  # their own VM with a build definition a caller cannot add steps to, which is
  # GitHub's documented construction for Build L3
  # (https://docs.github.com/actions/security-guides/using-artifact-attestations-and-reusable-workflows-to-achieve-slsa-v1-build-level-3).
  #
  # So there must be no `steps:` here — adding one would put caller-defined code
  # back beside the signing and silently drop this lane to L2 while every
  # attestation still looked identical. A reusable-workflow call cannot carry
  # steps at all, which is what makes that regression unrepresentable rather than
  # merely discouraged.
  build-binaries:
    name: binaries
    needs: [plan, github-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
    # Declared on both sides: a reusable workflow receives the caller's token
    # permissions, and GitHub's L3 guide asks for the same set in both places.
    permissions:
      contents: write # attach the per-arch tarballs to the release
      id-token: write # Sigstore, for the provenance + SBOM attestations
      attestations: write # store them against this repository
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      sha: ${{ github.sha }}
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}

  # The moment the release becomes immutable, so it happens LAST and only when
  # every asset is in place. `needs` the matrix rather than just the draft: a
  # draft with no binaries must never be flipped to published, and a failed
  # matrix leaves the draft visible for inspection instead of shipping a
  # release nobody can add to afterwards.
  finalize-release:
    name: github release (publish)
    needs: [plan, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Refuse to publish a release whose assets are missing. After the publish
      # step the set is frozen for good, so this is the last moment the check is
      # worth anything.
      - name: Every expected asset is attached before the release is frozen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "$assets"
          # Every suffix release-build.yml uploads per architecture. The SBOM
          # document and its attestation bundle are checked too: a release
          # publishing without them is unfixable (immutability), and the only
          # remedy would be another version.
          #
          # `grep -Fxq` — fixed string, whole line. A substring match passed as
          # soon as any longer asset name contained the expected one, so
          # ".tar.gz" was satisfied by ".tar.gz.sigstore.json" alone and a
          # missing tarball would have shipped.
          missing=""
          for arch in x86_64 aarch64; do
            for suffix in \
              ".tar.gz" \
              ".tar.gz.sha256sum" \
              ".tar.gz.sigstore.json" \
              ".tar.gz.sbom.sigstore.json" \
              ".tar.gz.intoto.jsonl" \
              ".cdx.json"; do
              printf '%s\n' "$assets" \
                | grep -Fxq "ferroehr-${TAG}-${arch}-unknown-linux-gnu${suffix}" \
                || missing="$missing ferroehr-${TAG}-${arch}-unknown-linux-gnu${suffix}"
            done
          done
          # The release-wide assets the draft job attached: the repository SPDX
          # SBOM and the quickstart compose files a downloader runs without
          # cloning.
          for asset in \
            "ferroehr-${TAG}.spdx.json" \
            "docker-compose.yml" \
            "docker-compose.keycloak.yml" \
            "docker-compose.observability.yml" \
            "docker-compose.db-publish.yml" \
            "ferroehr-${TAG}-information-sheet.md" \
            "ferroehr-${TAG}-instructions-for-use.md"; do
            printf '%s\n' "$assets" | grep -Fxq "$asset" || missing="$missing $asset"
          done
          [ -z "$missing" ] || {
            echo "::error::the draft is missing assets, so it will not be published:$missing"
            exit 1
          }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # ── Compile the server binary natively per arch (no QEMU, no in-Docker cargo) ─
  # A release builds every image unconditionally: there is no change filter
  # here, so a cut can never miss one.
  binary:
    name: image binary (${{ matrix.platform }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-26.04-arm
    # Debian 13 (trixie) container so the produced binary targets glibc 2.41,
    # matching gcr.io/distroless/cc-debian13 exactly. The tag must equal the
    # rust-toolchain.toml channel — verified below, never assumed.
    # Digest-pinned, not tag-pinned: a tag is mutable, so a re-run of an
    # already-reviewed commit could build against different bytes. The index
    # digest (not a per-platform one) so both runner architectures resolve.
    container: rust:1.98.1-slim-trixie@sha256:ce84a5edd80c5f91e05c5533b1e53eb1da54028f33734dc06aa6b49fa190462d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }} # == plan's pinned commit: the dispatch-at-tag refusal makes them equal (#2790)

      - name: Verify toolchain pins (container + Dockerfile == rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          channel=$(grep -E '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')
          have=$(rustc --version | awk '{print $2}')
          arg=$(grep -E '^ARG RUST_VERSION=' docker/Dockerfile | head -1 | cut -d= -f2)
          echo "rust-toolchain=$channel  container-rustc=$have  Dockerfile ARG=$arg"
          if [ "$channel" != "$have" ]; then
            echo "::error::Job container rustc ($have) != rust-toolchain.toml ($channel). Bump the container: tag in release.yml and containers.yml."
            exit 1
          fi
          if [ "$channel" != "$arg" ]; then
            echo "::error::docker/Dockerfile RUST_VERSION ($arg) != rust-toolchain.toml ($channel)."
            exit 1
          fi

      # This lane publishes images, so a restored cache is release input — kept
      # only because no untrusted run can write these keys: neither this
      # workflow nor containers.yml (which writes them) has a `pull_request`
      # trigger at all, and a cache created on a child branch is unreadable
      # from the default branch anyway
      # (docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching
      # — "Workflow runs cannot restore caches created for child branches or
      # sibling branches"). The binary lane that carries no such property
      # (release-build.yml) builds cold instead.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: # zizmor: ignore[cache-poisoning]
          shared-key: containers-${{ matrix.platform }}
          save-if: "false"

      - name: Build (release, native)
        # The binary is produced by the ferroehr-server package (bin name
        # `ferroehr`) since the crate consolidation; `-p ferroehr` is the
        # platform LIBRARY and yields no binary to strip.
        # build.rs stamps the REVISION value into /management/info; passing the
        # release commit here (an env, never interpolated into a shell) makes the
        # provenance explicit and does not depend on git being present in the
        # slim job container (it is not). Empty/absent degrades to `unknown`.
        env:
          REVISION: ${{ github.sha }}
        run: cargo build --release --locked -p ferroehr-server

      - name: Strip
        run: strip target/release/ferroehr

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ferroehr-${{ matrix.platform }}
          path: target/release/ferroehr
          if-no-files-found: error
          retention-days: 1

  # ── Package + push the multi-arch app image (COPY-only; seconds) ────────────
  app-image:
    name: app image
    needs: binary
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # Sigstore, for the signed attestations
      attestations: write # store them against this repository
    # The build + its attestation live in the reusable build-image.yml — the
    # SLSA Build L3 construction (#2140): this caller passes data-only inputs
    # and cannot add steps beside the signing. Labels mirror the Dockerfile's;
    # scripts/checks/image-labels.sh fails if the two ever disagree.
    #
    # `defer-tags` pushes BY DIGEST: the tags are applied by scan-and-tag once
    # the vulnerability gate passes, so a HIGH finding can never already be
    # `latest` by the time the lane turns red (#2747).
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/ferrohealth/ferroehr
      defer-tags: true
      dockerfile: docker/Dockerfile
      target: runtime-prebuilt
      binary-artifact-prefix: ferroehr
      labels: |
        org.opencontainers.image.title=FerroEHR
        org.opencontainers.image.description=Pure-Rust, openEHR-conformant clinical data repository (ITS-REST 1.1.0 + AQL 1.1)
        org.opencontainers.image.source=https://github.com/FerroHEALTH/FerroEHR
        org.opencontainers.image.url=https://ferroehr.eu/
        org.opencontainers.image.documentation=https://ferroehr.eu/docs/latest/
        org.opencontainers.image.vendor=Cadasto B.V.
        org.opencontainers.image.authors=Cadasto B.V. <https://www.cadasto.com/contact/>
        org.opencontainers.image.licenses=BUSL-1.1
        org.opencontainers.image.base.name=gcr.io/distroless/cc-debian13:nonroot
        org.opencontainers.image.base.digest=sha256:e792ab3d241a468a4fd7519ddbbebe66b49b5f365771716ea688ad40b6c6f1c2

  # ── Viewer: server binary per arch + the arch-independent site ──────────────
  # The WASM/JS/CSS site bundle is architecture-independent, so cargo-leptos
  # runs ONCE (amd64: bin + site); the arm64 job builds only the ssr binary
  # with plain cargo. Same glibc rationale as the app binary job.
  viewer-binary:
    name: viewer binary (${{ matrix.platform }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-26.04
          - platform: arm64
            runner: ubuntu-26.04-arm
    # Digest-pinned, not tag-pinned: a tag is mutable, so a re-run of an
    # already-reviewed commit could build against different bytes. The index
    # digest (not a per-platform one) so both runner architectures resolve.
    container: rust:1.98.1-slim-trixie@sha256:ce84a5edd80c5f91e05c5533b1e53eb1da54028f33734dc06aa6b49fa190462d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }} # == plan's pinned commit: the dispatch-at-tag refusal makes them equal (#2790)

      - name: Verify toolchain pin (container == rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          channel=$(grep -E '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')
          have=$(rustc --version | awk '{print $2}')
          if [ "$channel" != "$have" ]; then
            echo "::error::Job container rustc ($have) != rust-toolchain.toml ($channel)."
            exit 1
          fi

      # Same publishing-lane reasoning as the app binary job above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: # zizmor: ignore[cache-poisoning]
          shared-key: containers-viewer-${{ matrix.platform }}
          save-if: "false"

      - name: Build the ssr server binary (release, native)
        # LEPTOS_OUTPUT_NAME must be in the COMPILER's environment: leptos's
        # HydrationScripts reads it via option_env! and appends `_bg` to the
        # wasm file name it renders when absent (leptos-0.8 hydration/mod.rs),
        # while cargo-leptos names the shipped file `<output>.wasm` — a binary
        # built without it 404s its own wasm and never hydrates (found live on
        # the published 3.20.0 image, #2164). cargo-leptos exports it for the
        # from-source Dockerfile path; this plain cargo build must match.
        env:
          LEPTOS_OUTPUT_NAME: ferroehr-viewer
        run: cargo build --release --locked --no-default-features --features ssr -p ferroehr-viewer

      - name: Strip
        run: strip target/release/ferroehr-viewer

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ferroehr-viewer-${{ matrix.platform }}
          path: target/release/ferroehr-viewer
          if-no-files-found: error
          retention-days: 1

      # The site bundle (wasm32 + Tailwind CSS + JS glue) — built once, on
      # amd64 only; it is byte-identical regardless of the server arch.
      # NEVER `cargo install cargo-leptos` here: it unconditionally builds
      # OpenSSL from vendored C source (its cargo-generate dependency pins
      # `vendored-openssl`), which needs perl/make and failed inside the slim
      # image. Prebuilt release binaries keep the pipeline Rust-toolchain-only
      # — the same taiki-e path the ci.yml ui-e2e job uses.
      - name: Install curl for the tool downloads (amd64 only)
        if: matrix.platform == 'amd64'
        run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        if: matrix.platform == 'amd64'
        with:
          tool: cargo-leptos@0.3.7,wasm-bindgen@0.2.128

      - name: Build the site bundle (amd64 only)
        if: matrix.platform == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          source scripts/gh/retry-net.sh
          rustup target add wasm32-unknown-unknown
          retry_read \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64 \
            -o /usr/local/bin/tailwindcss
          chmod +x /usr/local/bin/tailwindcss
          LEPTOS_TAILWIND_VERSION=v4.3.3 bash scripts/cargo-leptos.sh build --release
          # hash.txt names the content hashes of the files in this bundle, so
          # it travels WITH the bundle; the image COPYs it beside the binary,
          # which is where leptos reads it from.
          cp target/release/hash.txt target/site/hash.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.platform == 'amd64'
        with:
          name: ferroehr-viewer-site
          path: target/site
          if-no-files-found: error
          retention-days: 1

  # ── Package + push the multi-arch viewer image (COPY-only) ──────────────────
  viewer-image:
    name: viewer image
    needs: viewer-binary
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # Sigstore, for the signed attestations
      attestations: write # store them against this repository
    # The reusable SLSA Build L3 lane; see the app image above.
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/ferrohealth/ferroehr-viewer
      defer-tags: true
      dockerfile: docker/viewer/Dockerfile
      target: runtime-prebuilt
      binary-artifact-prefix: ferroehr-viewer
      site-artifact: ferroehr-viewer-site
      labels: |
        org.opencontainers.image.title=FerroEHR Viewer
        org.opencontainers.image.description=Viewer for openEHR ITS-REST CDRs — pure-Rust Leptos web app (template manager, visual AQL query builder, EHR browser)
        org.opencontainers.image.source=https://github.com/FerroHEALTH/FerroEHR
        org.opencontainers.image.url=https://ferroehr.eu/
        org.opencontainers.image.documentation=https://ferroehr.eu/docs/latest/
        org.opencontainers.image.vendor=Cadasto B.V.
        org.opencontainers.image.authors=Cadasto B.V. <https://www.cadasto.com/contact/>
        org.opencontainers.image.licenses=BUSL-1.1
        org.opencontainers.image.base.name=gcr.io/distroless/cc-debian13:nonroot
        org.opencontainers.image.base.digest=sha256:e792ab3d241a468a4fd7519ddbbebe66b49b5f365771716ea688ad40b6c6f1c2

  # ── PostgreSQL image (multi-arch) ───────────────────────────────────────────
  # One RUN layer (the Debian security upgrade, #2408) on top of postgres:18.6,
  # so the non-native platform needs QEMU — the reusable lane sets it up.
  postgres-image:
    name: postgres image
    needs: plan
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # Sigstore, for the signed attestations
      attestations: write # store them against this repository
    # The reusable SLSA Build L3 lane. QEMU: the one RUN layer (the Debian
    # security upgrade, #2408) executes on the non-native platform.
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/ferrohealth/ferroehr-postgres
      defer-tags: true
      dockerfile: docker/postgres/Dockerfile
      context: docker/postgres
      qemu: true
      version-build-args: false
      labels: |
        org.opencontainers.image.title=FerroEHR PostgreSQL
        org.opencontainers.image.description=PostgreSQL 18 preconfigured (role/db/schemas/extensions) for ferroehr
        org.opencontainers.image.source=https://github.com/FerroHEALTH/FerroEHR
        org.opencontainers.image.url=https://ferroehr.eu/
        org.opencontainers.image.documentation=https://ferroehr.eu/docs/latest/
        org.opencontainers.image.vendor=Cadasto B.V.
        org.opencontainers.image.authors=Cadasto B.V. <https://www.cadasto.com/contact/>
        org.opencontainers.image.licenses=BUSL-1.1 AND PostgreSQL
        org.opencontainers.image.base.name=postgres:18.6
        org.opencontainers.image.base.digest=sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722

  # ── The gate that makes the pushed digests referencable ─────────────────────
  # The same reusable pair containers.yml uses, so the main lane and the
  # release lane cannot drift on a security gate. Its completion is what every
  # consumer of a PUBLISHED image tag hangs off: the chart pulls the appVersion
  # image, the sandbox tracks `:latest`, and both exist by construction here.
  scan-and-tag:
    name: scan + tag
    needs: [app-image, viewer-image, postgres-image]
    permissions:
      contents: read
      packages: write # pull the pushed digests, then tag them
    uses: ./.github/workflows/scan-and-tag.yml
    with:
      app-image: ghcr.io/ferrohealth/ferroehr
      app-digest: ${{ needs.app-image.outputs.digest }}
      app-tags: ${{ needs.app-image.outputs.tags }}
      viewer-image: ghcr.io/ferrohealth/ferroehr-viewer
      viewer-digest: ${{ needs.viewer-image.outputs.digest }}
      viewer-tags: ${{ needs.viewer-image.outputs.tags }}
      postgres-image: ghcr.io/ferrohealth/ferroehr-postgres
      postgres-digest: ${{ needs.postgres-image.outputs.digest }}
      postgres-tags: ${{ needs.postgres-image.outputs.tags }}

  # The pushed VIEWER artifact is assembled from two jobs (the per-arch ssr
  # binary + the once-built site bundle), so its one novel failure class is
  # ASSEMBLY: a binary and a site tree that disagree. The from-source e2e
  # battery (ci.yml) never sees the assembled artifact — which is exactly how
  # a viewer whose pages 404 their own wasm published green (issue #2550,
  # found live on the 3.20.0 image during #2164). This smoke drives the very
  # image this run pushed: every asset the served page references must exist
  # in the artifact that serves it, AND a real browser must log in through
  # them — the second half exists because 4.0.8 shipped a viewer nobody had
  # ever driven in a browser (#2871).
  viewer-smoke:
    name: viewer smoke (amd64)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # pull the image this run just pushed
    needs: [viewer-image, app-image]
    env:
      VIEWER_IMAGE: ghcr.io/ferrohealth/ferroehr-viewer
      APP_IMAGE: ghcr.io/ferrohealth/ferroehr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }} # == plan's pinned commit: the dispatch-at-tag refusal makes them equal (#2790)

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pushed viewer image (by digest)
        env:
          DIGEST: ${{ needs.viewer-image.outputs.digest }}
        run: |
          docker pull "${VIEWER_IMAGE}@${DIGEST}"
          docker tag  "${VIEWER_IMAGE}@${DIGEST}" ferroehr-viewer:smoke

      - name: Serve and verify the asset chain
        shell: bash
        run: |
          set -euo pipefail
          # A dummy CDR base URL: the login page renders without a CDR.
          docker run -d --rm --name viewer-smoke -p 127.0.0.1:3000:3000 \
            -e FERROEHR_VIEWER__CDR__BASE_URL=http://127.0.0.1:9 \
            ferroehr-viewer:smoke
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/login && break
            sleep 1
            [ "$i" = 30 ] && { echo "viewer never served /login"; docker logs viewer-smoke; exit 1; }
          done
          html=$(curl -sf http://127.0.0.1:3000/login)
          # Every /pkg/ asset the page references (script srcs, stylesheet and
          # preload hrefs — the wasm preload among them) must exist in the
          # artifact serving the page.
          assets=$(printf '%s' "$html" | grep -oE '(href|src)="/pkg/[^"]+"' | sed -E 's/^(href|src)="//; s/"$//' | sort -u)
          [ -n "$assets" ] || { echo "the served page references no /pkg/ assets — the shell changed shape; update this smoke"; exit 1; }
          echo "$assets"
          fail=0
          while IFS= read -r a; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$a")
            echo "$a -> $code"
            [ "$code" = "200" ] || fail=1
          done <<< "$assets"
          docker stop viewer-smoke >/dev/null
          [ "$fail" = 0 ] || { echo "the pushed viewer image references assets it does not ship (#2550)"; exit 1; }

      - name: Pull pushed app image (by digest)
        env:
          DIGEST: ${{ needs.app-image.outputs.digest }}
        run: |
          docker pull "${APP_IMAGE}@${DIGEST}"
          docker tag  "${APP_IMAGE}@${DIGEST}" ferroehr:smoke

      - name: Build the postgres image (amd64; COPY-only, seconds)
        run: docker build -t ferroehr-postgres:smoke docker/postgres

      # The asset-chain step proves the image SERVES its assets; nothing proved
      # a browser can log in THROUGH them, and 4.0.8 shipped with this lane
      # green (#2871). Both CDR images are this run's own, so the release that
      # ships the viewer proves the viewer it ships.
      - name: Browser-driven login against the pushed viewer image
        shell: bash
        run: |
          FERROEHR_VIEWER_IMAGE=ferroehr-viewer:smoke \
          FERROEHR_IMAGE=ferroehr:smoke \
          FERROEHR_POSTGRES_IMAGE=ferroehr-postgres:smoke \
            bash docker/viewer/login-smoke.sh

  # ── Smoke test (amd64): pull the pushed image, compose up, exercise the API ──
  smoke:
    name: compose smoke (amd64)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # pull the image this run just pushed
    needs: [plan, app-image]
    env:
      APP_IMAGE: ghcr.io/ferrohealth/ferroehr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }} # == plan's pinned commit: the dispatch-at-tag refusal makes them equal (#2790)

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pushed app image (by digest)
        env:
          DIGEST: ${{ needs.app-image.outputs.digest }}
        run: |
          docker pull "${APP_IMAGE}@${DIGEST}"
          docker tag  "${APP_IMAGE}@${DIGEST}" ferroehr:smoke

      - name: Build postgres image (amd64; COPY-only, seconds)
        run: docker build -t ferroehr-postgres:smoke docker/postgres

      - name: Smoke test
        shell: bash
        env:
          FERROEHR_IMAGE: ferroehr:smoke
          FERROEHR_POSTGRES_IMAGE: ferroehr-postgres:smoke
        run: bash docker/smoke-test.sh

  # ── The Helm chart ──────────────────────────────────────────────────────────
  # `needs: scan-and-tag` is the whole fix for the defect class this pipeline
  # was built around: the chart is judged against the appVersion image, and
  # that image is PULLABLE by construction when this job starts. The 60-minute
  # poll loop, its coupling to another workflow's job name, and its three
  # distinct failure modes across v4.0.3–v4.0.5 are gone.
  chart:
    name: chart
    needs: [plan, scan-and-tag]
    permissions:
      contents: read
      packages: write # push the chart + the artifacthub.io tag to GHCR
      id-token: write # Sigstore, for the keyless attestation
      attestations: write # store it against this repository
    # Shared with publish-chart.yml's dispatch lane: a published chart version
    # is immutable only because that lane refuses to overwrite one, and two
    # concurrent runs must never race that check.
    concurrency:
      group: publish-chart
      cancel-in-progress: false
    uses: ./.github/workflows/build-chart.yml
    with:
      release-tag: ${{ needs.plan.outputs.tag }}
      sha: ${{ github.sha }}

  # ── The hosted sandbox (#2974: the Hetzner box) ─────────────────────────────
  # Keyed on apply-tags, never on a run conclusion: the box pulls
  # `ghcr.io/ferrohealth/ferroehr:latest`, which scan-and-tag has just moved,
  # and an advisory scanner elsewhere in this run can no longer suppress the
  # deploy (v4.0.3). A prerelease moves no `:latest`, so there is nothing to
  # deploy — hence the release-only condition.
  #
  # An ordinary job rather than a workflow call, because the deploy key lives
  # in the `hosted` environment and the caller of a reusable workflow cannot
  # name one (actions/runner#1490 — the same reason Veredictum's release
  # pipeline calls its action from an ordinary job). Every deploy step lives
  # in .github/actions/hosted-deploy, shared with the manual dispatch lane.
  sandbox:
    name: sandbox
    needs: [plan, scan-and-tag]
    if: needs.plan.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: hosted
    concurrency:
      group: hosted-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The wipe comes BEFORE the deploy (#3467). The sandbox is demo data,
      # reset every night, and a release may change the storage generation:
      # the v4.3.1 image refused the box's first-generation database at boot,
      # served 502 for the whole verify window, and the reseed that would have
      # wiped it sat behind the failed deploy. Wiped first, the deploy's own
      # recreate is the fresh boot that migrates the empty database, and the
      # verify below reads the release it just deployed.
      - name: Wipe the sandbox schemas (the deploy migrates a fresh database)
        uses: ./.github/actions/hosted-deploy
        with:
          verb: wipe
          ssh-key: ${{ secrets.HOSTED_SSH_KEY }}
          known-hosts: ${{ secrets.HOSTED_KNOWN_HOSTS }}
      - name: Deploy the hosted sandbox
        uses: ./.github/actions/hosted-deploy
        with:
          expected-version: ${{ needs.plan.outputs.version }}
          ssh-key: ${{ secrets.HOSTED_SSH_KEY }}
          known-hosts: ${{ secrets.HOSTED_KNOWN_HOSTS }}

  # After the deploy, the seed. The wipe and the fresh boot happened in the
  # `sandbox` job above, so the reseed workflow is called seed-only; the
  # nightly schedule keeps its own wipe and restart. Environment secrets
  # reach the called workflow's own environment-naming jobs here (measured:
  # the v4.0.13 release's reseed succeeded through two call hops).
  #
  # The permissions block is load-bearing: a called workflow's jobs can never
  # exceed the caller JOB's grant, and under the workflow-level
  # `permissions: {}` an ungranted call-job allows nothing — the reseed's own
  # jobs request `contents: read`, so omitting this fails the ENTIRE pipeline
  # at startup, before any job runs (#2991, the v4.0.14 first cut).
  sandbox-reseed:
    name: sandbox reseed
    needs: sandbox
    permissions:
      contents: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: ./.github/workflows/sandbox-reseed.yml
    with:
      seed-only: true

  # ── Freeze /docs/vX.Y.Z/ ────────────────────────────────────────────────────
  # Moved out of docs.yml (#2776), which had no prerelease guard: an `-rc1` tag
  # re-pointed `/docs/latest/` while the image lane correctly refused to move
  # `:latest`. It needs `plan` only — it publishes documentation, not images.
  #
  # cut-version.sh is IDEMPOTENT: an already-cut version prints what it found
  # and exits 0, so re-running the pipeline after a mid-run failure can never
  # wedge here (it used to exit 1 and no re-run could ever succeed).
  docs-freeze:
    name: docs freeze
    needs: plan
    if: needs.plan.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push to docs-dist
      actions: write # dispatch the site rebuild after a real cut
    steps:
      # The ONE checkout that keeps its credential: cut-version.sh commits and
      # pushes the frozen render to the docs-dist branch, which needs the token
      # in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked]
          fetch-depth: 0
          ref: ${{ github.sha }} # == plan's pinned commit: the dispatch-at-tag refusal makes them equal (#2790)
      # This job renders the book and pushes it; it lints and link-checks
      # nothing, so neither link-check tool is installed.
      - uses: ./.github/actions/docs-toolchain
        with:
          lint: "false"
          link-check: "false"
      - id: cut
        name: Build frozen vX.Y.Z + push to docs-dist
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        # site-url, rsync into docs-dist, update versions.json, commit+push.
        # The script reports `cut=true|false` on $GITHUB_OUTPUT.
        run: bash scripts/site/cut-version.sh "$TAG"
      # The frozen tree lives on docs-dist and the deployed site assembles from
      # it, so the site has to be rebuilt for the new version to appear. A
      # `workflow_dispatch` fired with GITHUB_TOKEN is the documented exception
      # to the anti-recursion rule — the one event type it does create runs for
      # (docs.github.com/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow).
      - name: Rebuild and deploy the site
        if: steps.cut.outputs.cut == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml

  # ── crates.io ───────────────────────────────────────────────────────────────
  # LAST on purpose, and gated on a human. A crates.io version is immutable — it
  # can be yanked, never replaced — so it is the one artifact this pipeline
  # publishes that must not go out before the cut has proven itself: it `needs`
  # finalize-release, which runs only once every expected asset is attached and
  # the GitHub release is frozen. It deliberately does NOT need the image, chart
  # or sandbox legs: they publish nothing the crates consume, so waiting on them
  # would add no guarantee and would turn an unrelated image-scan failure into a
  # skipped publish.
  #
  # The `crates-io` environment carries a required reviewer, so this leg PAUSES
  # until someone approves it. Nothing needs the job, so that pause blocks no
  # other leg — only `announce`, which is precisely the outstanding-approval
  # reminder this leg exists to be (#2836: the publish was a dispatch someone
  # had to remember, and v4.0.6 shipped with the eight crates stepped to 0.0.42
  # and unpublished). Until the reviewer is configured the environment simply
  # does not pause and the leg publishes straight through.
  #
  # Idempotent: the shared script treats "already exists on the crates.io index"
  # as done, so a release whose cycle changed no packaged crate content approves
  # through as a green no-op, and a re-run after a partial publish finishes the
  # set instead of being refused.
  #
  # Real releases only. A prerelease is a rehearsal of a cut, and an immutable
  # public artifact is not something a rehearsal should produce — an `-rc` tree
  # that is then abandoned would leave crate versions published that no release
  # ever carried. Rehearsing the publish itself is what the dispatch lane's dry
  # run is for.
  #
  # The steps are INLINE rather than in a reusable workflow shared with
  # publish-crates.yml, and that is not duplication by oversight: crates.io
  # Trusted Publishing matches the OIDC `workflow_ref` claim, which for a job
  # inside a reusable workflow names the CALLING workflow
  # (https://docs.github.com/en/actions/concepts/security/openid-connect,
  # https://crates.io/docs/trusted-publishing) — so a reusable workflow would
  # present this file as the identity anyway, and the only thing moving the job
  # there would achieve is hiding which workflow file each publisher entry has to
  # name. The shared implementation is scripts/release/publish-crates.sh, which
  # both lanes call.
  #
  # Consequence, stated where it bites: each of the nine crates needs a Trusted
  # Publisher entry for THIS workflow file (repository `FerroHEALTH/FerroEHR`,
  # workflow `release.yml`, environment `crates-io`) beside the one naming
  # `publish-crates.yml`. Without it the token exchange below is refused, and
  # `announce` names that as the cause.
  crates:
    name: crates.io
    needs: [plan, finalize-release]
    if: needs.plan.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: crates-io
    # Shared with publish-crates.yml's dispatch lane, and deliberately not
    # ref-keyed: a tag-triggered release and a main dispatch would otherwise
    # sit in different groups and could interleave uploads of the same immutable
    # versions. Queue, never cancel.
    concurrency:
      group: publish-crates
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token exchange (rust-lang/crates-io-auth-action)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }} # == plan's pinned commit: the dispatch-at-tag refusal makes them equal (#2790)
      # No cache in the lane that uploads to crates.io: a published version is
      # immutable, so it is built from this checkout and nothing else
      # (setup-rust-toolchain caches by default).
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - id: auth
        name: Exchange the OIDC identity for a temporary crates.io token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish the nine spec crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: bash scripts/release/publish-crates.sh publish
      # The registry is the GROUND TRUTH, not the exit code above — hence
      # `always()`. This step matters most exactly when the publish went red: a
      # run that uploaded everything but misread its own output would otherwise
      # end red with nothing to contradict it, and one that genuinely stranded a
      # crate would end red without naming which.
      - name: Verify all nine crates resolve at the same version
        if: always()
        run: bash scripts/release/publish-crates.sh verify

  # ── announce: the one summary a human reads ─────────────────────────────────
  # Asserts every leg landed — a skipped leg is accepted only where a skip is
  # the correct outcome — and on any failure names the exact recovery instead of
  # leaving it tribal.
  announce:
    name: announce
    if: always()
    needs:
      - plan
      - github-release
      - build-binaries
      - finalize-release
      - binary
      - app-image
      - viewer-binary
      - viewer-image
      - postgres-image
      - scan-and-tag
      - smoke
      - viewer-smoke
      - chart
      - sandbox
      - sandbox-reseed
      - docs-freeze
      - crates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }} # == plan's pinned commit: the dispatch-at-tag refusal makes them equal (#2790)

      - name: Assert every leg landed, and say what published where
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          IS_RELEASE: ${{ needs.plan.outputs.is-release }}
          APP_DIGEST: ${{ needs.app-image.outputs.digest }}
          VIEWER_DIGEST: ${{ needs.viewer-image.outputs.digest }}
          POSTGRES_DIGEST: ${{ needs.postgres-image.outputs.digest }}
          R_PLAN: ${{ needs.plan.result }}
          R_GITHUB_RELEASE: ${{ needs.github-release.result }}
          R_BUILD_BINARIES: ${{ needs.build-binaries.result }}
          R_FINALIZE: ${{ needs.finalize-release.result }}
          R_BINARY: ${{ needs.binary.result }}
          R_APP_IMAGE: ${{ needs.app-image.result }}
          R_VIEWER_BINARY: ${{ needs.viewer-binary.result }}
          R_VIEWER_IMAGE: ${{ needs.viewer-image.result }}
          R_POSTGRES_IMAGE: ${{ needs.postgres-image.result }}
          R_SCAN_AND_TAG: ${{ needs.scan-and-tag.result }}
          R_SMOKE: ${{ needs.smoke.result }}
          R_VIEWER_SMOKE: ${{ needs.viewer-smoke.result }}
          R_CHART: ${{ needs.chart.result }}
          R_SANDBOX: ${{ needs.sandbox.result }}
          R_SANDBOX_RESEED: ${{ needs.sandbox-reseed.result }}
          R_DOCS_FREEZE: ${{ needs.docs-freeze.result }}
          R_CRATES: ${{ needs.crates.result }}
        run: |
          set -uo pipefail
          fail=0
          rows=""
          # A leg is either successful, or skipped where the skip is correct: on
          # a prerelease the sandbox and the docs freeze do not run, because a
          # prerelease moves neither `:latest` nor /docs/latest/, and the crates
          # leg does not publish an immutable artifact from a rehearsal. A
          # DECLINED crates approval is not in that class: GitHub fails a
          # rejected deployment ("If a job is rejected, the workflow will fail"),
          # so a refusal to publish reports red on purpose.
          check() {
            local leg="$1" result="$2" skip_ok="${3:-no}"
            if [ "$result" = "success" ]; then
              rows="${rows}| ${leg} | ok |"$'\n'
              return
            fi
            if [ "$skip_ok" = "prerelease" ] && [ "$result" = "skipped" ] && [ "$IS_RELEASE" != "true" ]; then
              rows="${rows}| ${leg} | skipped — pre-release |"$'\n'
              return
            fi
            rows="${rows}| ${leg} | **${result}** |"$'\n'
            fail=1
          }
          check "plan" "$R_PLAN"
          check "github release (draft)" "$R_GITHUB_RELEASE"
          check "binaries" "$R_BUILD_BINARIES"
          check "github release (published)" "$R_FINALIZE"
          check "image binaries" "$R_BINARY"
          check "app image" "$R_APP_IMAGE"
          check "viewer binaries" "$R_VIEWER_BINARY"
          check "viewer image" "$R_VIEWER_IMAGE"
          check "postgres image" "$R_POSTGRES_IMAGE"
          check "scan + tag" "$R_SCAN_AND_TAG"
          check "compose smoke" "$R_SMOKE"
          check "viewer smoke" "$R_VIEWER_SMOKE"
          check "chart" "$R_CHART"
          check "sandbox" "$R_SANDBOX" prerelease
          check "sandbox reseed" "$R_SANDBOX_RESEED" prerelease
          check "docs freeze" "$R_DOCS_FREEZE" prerelease
          check "crates.io" "$R_CRATES" prerelease

          chart_version="$(sed -nE 's/^version: *"?([^"]+)"?$/\1/p' deploy/helm/ferroehr/Chart.yaml | head -1)"
          crates_version="$(bash scripts/release/publish-crates.sh version || echo unknown)"
          repo_url="https://github.com/${GITHUB_REPOSITORY}"
          {
            printf '## %s\n\n' "$TAG"
            printf '| leg | outcome |\n|---|---|\n%s\n' "$rows"
            printf '### What published where\n\n| | |\n|---|---|\n'
            printf '| release | %s/releases/tag/%s |\n' "$repo_url" "$TAG"
            printf '| app image | `ghcr.io/%s/ferroehr:%s` `@%s` |\n' \
              "$GITHUB_REPOSITORY_OWNER" "$VERSION" "${APP_DIGEST:-not pushed}"
            printf '| viewer image | `ghcr.io/%s/ferroehr-viewer:%s` `@%s` |\n' \
              "$GITHUB_REPOSITORY_OWNER" "$VERSION" "${VIEWER_DIGEST:-not pushed}"
            printf '| postgres image | `ghcr.io/%s/ferroehr-postgres:%s` `@%s` |\n' \
              "$GITHUB_REPOSITORY_OWNER" "$VERSION" "${POSTGRES_DIGEST:-not pushed}"
            printf '| `:latest` moved | %s |\n' "$([ "$IS_RELEASE" = "true" ] && echo yes || echo 'no — pre-release')"
            printf '| chart | `oci://ghcr.io/%s/charts/ferroehr` version `%s` |\n' \
              "$GITHUB_REPOSITORY_OWNER" "${chart_version:-unknown}"
            printf '| sandbox | %s |\n' \
              "$([ "$R_SANDBOX" = "success" ] && echo "serving ${VERSION}" || echo "$R_SANDBOX")"
            printf '| docs | %s |\n' \
              "$([ "$R_DOCS_FREEZE" = "success" ] && echo "/docs/${TAG}/ frozen, /docs/latest/ -> ${TAG}" || echo "$R_DOCS_FREEZE")"
            # The nine spec crates publish on their own lockstep SemVer line,
            # unrelated to $VERSION — an unchanged cycle re-approves the same
            # version as a no-op.
            printf '| crates.io | %s |\n' \
              "$([ "$R_CRATES" = "success" ] && echo "8 \`openehr-*\` crates at \`${crates_version}\`" || echo "$R_CRATES")"
            printf '\n'
            if [ "$fail" != 0 ]; then
              printf '### Recovery\n\n'
              printf 'Re-run this pipeline for `%s`. Every leg is idempotent, so a re-run\n' "$TAG"
              printf 'finishes what the failed run started — except where named below:\n\n'
              # `printf '%s\n' '<line>'` for every line that STARTS with `-`: as
              # a format string it would be read as an option and the step dies
              # with "printf: - : invalid option" (caught by running this step's
              # body against simulated results before it ever saw a release).
              printf '%s\n' \
                '- **plan failed**: nothing was published at all. Fix the pin it named and cut' \
                '  the next patch version; a tag is never re-pointed.' \
                '- **chart failed AFTER the push**: that chart version is public and immutable.' \
                '  Do NOT re-run the leg — bump `Chart.yaml` version and publish the next one' \
                '  from publish-chart.yml (dispatch with `publish: true`). That lane says the' \
                '  same thing at the point of failure.' \
                '- **crates.io refused the token exchange**: each of the nine crates needs a' \
                '  Trusted Publisher entry naming `release.yml` (repository, workflow file,' \
                '  environment `crates-io`) beside the one naming `publish-crates.yml` —' \
                '  Trusted Publishing matches the top-level workflow filename. Add the entries' \
                '  on crates.io, then re-run this leg.' \
                '- **crates.io was DECLINED at the approval gate**: nothing was published, and a' \
                '  rejected deployment fails the run by design. Publish from publish-crates.yml' \
                '  if the decision changes.' \
                '- **crates.io published and the read-back failed**: the uploaded versions are' \
                '  public and immutable. Re-run the leg first — a split set finishes, an index' \
                '  lag resolves. Wrong CONTENT is never replaced: yank and bump.' \
                ''
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$rows"
          [ "$fail" = 0 ] || { echo "::error::the release pipeline for ${TAG} did not land every leg — see the run summary for the recovery"; exit 1; }
