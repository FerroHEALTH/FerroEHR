# SonarQube Cloud analysis — the machine opinion beside CodeQL (#2630;
# CodeRabbit removed in #2638), under the standing law of
# .claude/rules/ai-code-review.md: findings are advisory, never outrank
# the vendored specs, the rules, or the local gates, and gate no merge.
#
# Rust is analyzed first-party (announced 2025-04-17,
# https://www.sonarsource.com/blog/introducing-rust-in-sonarqube/): the
# analyzer runs Clippy itself from the root Cargo.toml — 85 Clippy rules
# managed as quality-profile rules, plus complexity metrics. That run uses
# the workspace DEFAULT features (the viewer compiles as an empty shell
# with neither ssr nor hydrate), so it sees less than our own deny-tier
# clippy lanes; it is a second, independent configuration on purpose.
# Scope (what is scanned vs excluded) lives in sonar-project.properties.
#
# Rust is not in SonarQube Cloud's Automatic Analysis — CI-based analysis
# is the documented path. SONAR_HOST_URL is not needed for Cloud
# (SonarSource/sonarqube-scan-action README, v8.2.1).
name: SonarQube Cloud

# On a push to main and weekly, never on a pull request or a merge group
# (owner decision 2026-11-25, #6574): the analysis and its coverage run are advisory
# (ai-code-review.md) and gate nothing. A newer push cancels the older
# analysis on its ref, so main is analysed at its latest commit.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * 1" # Mondays 01:17 UTC, off the hour
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # A FerroEHR started by any step of this workflow sends no usage report to
  # FerroPULSE: compose interpolates this into every server it brings up, and
  # scripts/checks/usage-report-off.sh holds each `docker run` and Helm install
  # to its own explicit switch.
  FERROEHR__USAGE_REPORT__ENABLED: "false"
  # The ONE place this lane's shard count lives. Raising it is this line: the
  # matrix and the `--partition` divisor are both derived from it below, so they
  # cannot drift apart. When it needs raising, the pipeline-budget watcher says
  # so rather than someone noticing a slow pull request (#3131).
  COVERAGE_SHARDS: "3"

jobs:
  # The database image and the shard list the coverage jobs read.
  changes:
    name: change detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      postgres_image: ${{ steps.postgres.outputs.image }}
      shards: ${{ steps.shards.outputs.list }}
      shard_count: ${{ steps.shards.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The CI PostgreSQL image, pinned by digest in docker/ci-postgres/image.ref
      # (#6520): non-durable, pg_stat_statements preloaded, 400 connections.
      - id: postgres
        run: |
          set -euo pipefail
          image="$(tr -d '[:space:]' < docker/ci-postgres/image.ref)"
          [[ "$image" =~ ^ghcr\.io/ferrohealth/ferroehr-ci-postgres@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::docker/ci-postgres/image.ref holds '$image', not ghcr.io/ferrohealth/ferroehr-ci-postgres@sha256:<digest>"
            exit 1
          }
          echo "image=$image" >> "$GITHUB_OUTPUT"
      # The shard list and its divisor, both from COVERAGE_SHARDS, so the matrix
      # and the `--partition n/N` can never disagree.
      - id: shards
        env:
          COUNT: ${{ env.COVERAGE_SHARDS }}
        run: |
          set -euo pipefail
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "list=[$(seq 1 "$COUNT" | paste -sd, -)]" >> "$GITHUB_OUTPUT"

  # ── Coverage, sharded (#3131) ──────────────────────────────────────────────
  # Coverage rides this lane by owner directive (2026-08-24), sharded (#3123).
  #
  # Each shard reports its OWN lcov and `scan` merges them. It has to be a
  # merge that SUMS hit counts: `cargo llvm-cov report` emits every instrumented
  # line in every report, so a shard's file lists the lines only its siblings
  # covered, with zero hits; `lcov -a` of the shards gives the unpartitioned
  # figure. Handing Sonar the shard
  # files directly is what must not happen: `sonar.rust.lcov.reportPaths` takes
  # a list, but the SonarQube Cloud coverage documentation says multiple reports
  # are "consumed sequentially without a defined strategy for handling
  # conflicts", and the README badge is this number.
  coverage:
    name: coverage ${{ matrix.shard }}/${{ needs.changes.outputs.shard_count }}
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read # the CI PostgreSQL image on GHCR
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    services:
      postgres:
        image: ${{ needs.changes.outputs.postgres_image }} # zizmor: ignore[unpinned-images] docker/ci-postgres/image.ref, checked name@sha256 where it is read
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: openehr
          POSTGRES_PASSWORD: openehr
          POSTGRES_DB: openehr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U openehr"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openehr:openehr@localhost:5432/openehr_test
      FERROEHR_TEST_PG_URL: postgres://openehr:openehr@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # xmllint is what the C14N XML parity gate shells out to (serialization.md).
      - name: xmllint
        run: command -v xmllint >/dev/null || { sudo apt-get update && sudo apt-get install -y libxml2-utils; }
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: llvm-tools-preview
          cache-shared-key: sonar
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # The shard index reaches the command through `env:`, never interpolated
      # into the script (the workflow-security rule in reliability.md).
      - run: cargo llvm-cov --no-report nextest --locked --workspace --exclude ferroehr-viewer --all-features --no-tests=pass --profile ci --partition "hash:${SHARD}/${SHARD_COUNT}"
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.changes.outputs.shard_count }}
      - run: cargo llvm-cov report --lcov --output-path "lcov-shard-${SHARD}.info"
        env:
          SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov-${{ matrix.shard }}
          path: lcov-shard-${{ matrix.shard }}.info

  # The viewer measured in its own job: it shares little build cache with the
  # CDR's crates, and it needs no database.
  coverage-viewer:
    name: coverage (viewer)
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: llvm-tools-preview
          cache-shared-key: sonar-viewer
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov --no-report nextest --locked -p ferroehr-viewer --no-tests=pass --profile ci
      - run: cargo llvm-cov report --lcov --output-path lcov-viewer.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov-viewer
          path: lcov-viewer.info

  scan:
    name: analyze
    needs: [changes, coverage, coverage-viewer]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write # the SARIF mirror below (#3032)
    # Coverage rides this lane (owner directive 2026-08-24): the `coverage`
    # shards and `coverage-viewer` above produce the lcov this scan imports
    # (sonar.rust.lcov.reportPaths,
    # docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/
    # test-coverage-parameters), so no database is needed here. The README's
    # coverage badge is Sonar's own.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: Sonar assigns issues and new-code status by blame.
          fetch-depth: 0
          persist-credentials: false

      # Build cache for the analyzer's own Clippy run. This lane publishes
      # nothing, so restoring a cache is inside the reliability.md rule
      # (only publishing lanes must run cache-free).
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-shared-key: sonar
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-lcov-*
          merge-multiple: true
          path: coverage
      # `lcov -a` SUMS hit counts across tracefiles, which is the whole reason
      # the shards are merged here rather than listed in
      # sonar.rust.lcov.reportPaths: every shard's report carries every
      # instrumented line, so a report chosen rather than summed understates the
      # published number (#3131). The merge is asserted, not assumed — a missing
      # shard file must fail the scan rather than quietly shrink coverage.
      - name: Merge the shard coverage reports into one lcov
        env:
          SHARD_COUNT: ${{ needs.changes.outputs.shard_count }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y lcov
          shards=(coverage/lcov-viewer.info)
          for i in $(seq 1 "$SHARD_COUNT"); do shards+=("coverage/lcov-shard-$i.info"); done
          for f in "${shards[@]}"; do
            [ -s "$f" ] || { echo "::error::missing or empty coverage report $f" >&2; exit 1; }
          done
          args=()
          for f in "${shards[@]}"; do args+=(-a "$f"); done
          lcov "${args[@]}" -o lcov.info
          lcov --summary lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info

      # sonar.projectVersion anchors the "Previous version" New Code window
      # (docs.sonarsource.com/sonarqube-cloud/standards/about-new-code): the
      # workspace version bumps at every release cut, so "new code" means
      # "since the last release" — the milestones-are-releases model as the
      # analysis window. Read from the root Cargo.toml at scan time (never a
      # second hand-maintained copy) and appended to the properties file the
      # scanner reads, so no context value reaches a shell or the action args.
      - name: Derive sonar.projectVersion from the workspace version
        run: |
          v="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          echo "sonar.projectVersion=$v" >> sonar-project.properties
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # The findings mirror into GitHub code scanning (#3032): Sonar's own
      # GitHub App uploads security-only analyses that arrive empty. The script
      # waits on this run's compute task and leaves out ACCEPTED and
      # FALSE_POSITIVE, so a disposition in the dashboard closes its alert on
      # the next analysis. The mirror gates nothing (ai-code-review.md).
      - name: Export the analysis' open findings as SARIF
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          project_key=$(sed -n 's/^sonar\.projectKey=//p' sonar-project.properties)
          test -n "$project_key"
          bash scripts/sonar/issues-to-sarif.sh "$project_key" sonar-findings.sarif
      - name: Upload the findings to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sonar-findings.sarif
          category: sonarcloud
