# Scheduled openEHR spec-update watcher (tracker issue #137; the full
# live-verified design dossier is recorded on that issue — the mechanism
# notes live in scripts/watch/spec-update.sh itself).
#
# Twice weekly it polls the public openEHR Jira for newly COMPLETED SPEC*
# changes and diffs the upstream amendment records against the vendored spec
# mirror, opening ONE `spec-update` issue per change for conformance-impact
# triage. Filing goes through the watcher family's one engine
# (.github/actions/file-watcher-issue/file-issue.sh, #2778), called from the
# script because this lane files N issues per run; dedup/watermark is the issue
# board itself (--state all, by the Jira key in the title) — no state file.
#
# RUN COLOUR (the family's uniform rule, #2778): a transport or shape failure is
# a RED run — the probe could not answer. A change FOUND files work and the run
# stays GREEN, as does a successful poll matching nothing.
#
# NOTE: GitHub disables scheduled workflows after 60 days without repo
# activity — a non-issue for an active repo, re-enable from the Actions tab
# if it ever happens.
name: Spec-update watcher

on:
  schedule:
    - cron: "17 6 * * 1,4" # Mon + Thu 06:17 UTC (off-the-hour to dodge load spikes)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report candidates without creating issues"
        type: boolean
        default: false
      window_days:
        description: "Jira resolutiondate window in days (14 = scheduled default; use e.g. 365 for a manual backlog sweep — dedup makes wide windows safe)"
        type: string
        default: "14"

permissions: {}

concurrency:
  group: spec-update-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # file one spec-update issue per completed Jira change
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Poll Jira + amendment records, open spec-update issues
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          WINDOW_DAYS: ${{ inputs.window_days || '14' }}
        run: bash scripts/watch/spec-update.sh
