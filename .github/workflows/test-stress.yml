# .github/workflows/test-stress.yml
#
# Runs one nextest filter many times over, optionally while other suites load
# the same PostgreSQL server, to reproduce a test that failed once in a full
# run (#3533). The test job in ci.yml runs each test once per shard, so a flake
# that needs parallel load to appear is never seen twice there, and the
# development machines do not run the suites locally.
#
# DISPATCH ONLY. It reports, and writes nothing back: the nextest output and
# the load runs' logs leave as a run artifact, and the issue the run serves
# records the verdict.
name: Test stress

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Cargo package whose tests the filter selects"
        required: false
        default: ferroehr
        type: string
      filter:
        description: "nextest filterset of the tests to repeat"
        required: true
        type: string
      count:
        description: "How many times the filtered set runs"
        required: false
        default: "50"
        type: string
      load_runs:
        description: "Full runs of the package started beside the stress run, to load the shared server (0 for none)"
        required: false
        default: "2"
        type: string

permissions: {}

env:
  FERROEHR__USAGE_REPORT__ENABLED: "false"

jobs:
  # The image docker/postgres builds on, read from its FROM, the one place a
  # Dependabot bump changes; the service below runs it (#5112).
  postgres-image:
    name: postgres image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      postgres_image: ${{ steps.postgres.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: postgres
        run: |
          set -euo pipefail
          image="$(bash scripts/lib/base-image.sh ref docker/postgres/Dockerfile)"
          [[ "$image" =~ ^[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::docker/postgres/Dockerfile resolves to '$image', not name@sha256:<digest>"
            exit 1
          }
          echo "image=$image" >> "$GITHUB_OUTPUT"

  stress:
    name: stress ${{ inputs.package }}
    needs: postgres-image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    services:
      postgres:
        image: ${{ needs.postgres-image.outputs.postgres_image }} # zizmor: ignore[unpinned-images] the digest-pinned FROM of docker/postgres, checked name@sha256 where it is read
        env:
          POSTGRES_USER: openehr
          POSTGRES_PASSWORD: openehr
          POSTGRES_DB: openehr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U openehr"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openehr:openehr@localhost:5432/openehr_test
      FERROEHR_TEST_PG_URL: postgres://openehr:openehr@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-save-if: false
      - name: Non-durable test tuning
        # The same tuning and tools as the test job in ci.yml, so a failure here
        # is a failure of the suite that job runs.
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client libxml2-utils
          PGPASSWORD=openehr psql -h localhost -U openehr -d postgres \
            -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-nextest
      - id: nl-role-codes
        name: The pin the cache-only test inputs are kept under
        run: echo "key=$(bash scripts/vendor/nl-role-codes.sh --cache-key)" >> "$GITHUB_OUTPUT"
      # The package comes from the cache on a hit, so a registry outage costs
      # nothing; the script checks every file against its pin either way and
      # downloads, with retries, only what the cache lacks (#5398).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vendor-cache/nl-role-codes
          key: ${{ steps.nl-role-codes.outputs.key }}
      - name: Fetch the cache-only test inputs
        # The UZI role code CodeSystem is cache only (CIBG copyright), so the
        # Wabvpz tests read it from .vendor-cache/, which this fetches by pin.
        run: bash scripts/vendor/nl-role-codes.sh --test-inputs
      - name: Build the test binaries
        run: cargo nextest run --locked -p "$PACKAGE" --all-features --no-run
        env:
          PACKAGE: ${{ inputs.package }}
      - name: Stress the filter under load
        env:
          PACKAGE: ${{ inputs.package }}
          FILTER: ${{ inputs.filter }}
          COUNT: ${{ inputs.count }}
          LOAD_RUNS: ${{ inputs.load_runs }}
        run: |
          set -euo pipefail
          [[ "$COUNT" =~ ^[1-9][0-9]*$ ]] || { echo "count must be a positive integer" >&2; exit 2; }
          [[ "$LOAD_RUNS" =~ ^[0-9]+$ ]] || { echo "load_runs must be a non-negative integer" >&2; exit 2; }
          mkdir -p stress-out
          load_pids=()
          for i in $(seq 1 "$LOAD_RUNS"); do
            cargo nextest run --locked -p "$PACKAGE" --all-features --no-tests=pass --no-fail-fast \
              > "stress-out/load-$i.log" 2>&1 &
            load_pids+=("$!")
          done
          status=0
          cargo nextest run --locked -p "$PACKAGE" --all-features --profile ci \
            --stress-count "$COUNT" -E "$FILTER" 2>&1 | tee stress-out/stress.log || status=$?
          for pid in "${load_pids[@]}"; do
            wait "$pid" || echo "a load run exited non-zero (see its log)" >&2
          done
          {
            echo "### Stress: \`$FILTER\` x $COUNT in \`$PACKAGE\`, $LOAD_RUNS load run(s)"
            echo
            if [[ "$status" -eq 0 ]]; then echo "Every iteration passed."; else echo "The stress run failed (exit $status); the artifact holds the output."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-stress-output
          path: stress-out/
          if-no-files-found: ignore
