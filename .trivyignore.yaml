# Adjudicated scanner exceptions (Trivy ignore file).
#
# Every entry states WHAT is exempt and WHY. There is no blanket suppression and
# no lowered severity threshold standing in for one.

misconfigurations:
  # AVD-DS-0002 "specify at least 1 USER command with a non-root user".
  #
  # The app and viewer images state `USER 65532:65532` explicitly, so this
  # exception is for the PostgreSQL image alone — where satisfying the check
  # would break the container. The upstream `postgres` entrypoint must start as
  # root: it initializes or chowns the data directory and only then drops to the
  # `postgres` user itself. A `USER postgres` line would make initialization fail
  # on a fresh volume, so the check's advice is simply wrong for this image.
  #
  # The privilege is constrained where it actually can be: every deployment path
  # runs this container with `cap_drop: [ALL]` plus only the five capabilities
  # its privilege drop needs (CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID) and
  # `no-new-privileges:true` — verified on the running container, not just
  # asserted in a file.
  - id: AVD-DS-0002
    paths:
      - docker/postgres/Dockerfile
    statement: >-
      The upstream postgres entrypoint requires root to initialize the data
      directory and drops privileges itself; capabilities are dropped at the
      deployment layer instead.

  # KSV-0014 (readOnlyRootFilesystem) and KSV-0118 (default security context) on
  # the k8s-test skill's THROWAWAY manifests: a scratch PostgreSQL and a
  # Prometheus/Grafana/OTel-collector stack, both stood up in a disposable local
  # cluster to exercise the chart and deleted with it.
  #
  # Scoped to those two files and to those two rules — never a directory skip, so
  # the SECRET scanner still reads everything under `.claude/`, and a genuinely
  # new misconfiguration class in these files still fails.
  #
  # Why exempt rather than harden: neither file is deployed by anything. They are
  # the *instrument*, and the subject they measure — the chart — is held to the
  # opposite standard by `deploy/helm/validate.sh`, which fails if the rendered
  # Deployment loses `runAsNonRoot`, `readOnlyRootFilesystem`, the seccomp
  # profile, `drop: [ALL]` or the NetworkPolicy. Hardening a scratch Prometheus
  # would secure nothing and would put upstream data-directory quirks between an
  # engineer and the chart test they are actually running. The k8s-test skill's
  # own first ground rule is the load-bearing one and is unaffected: "Never relax
  # a security setting to make something start" — that governs the CHART, and
  # this exception cannot reach it.
  - id: KSV-0014
    paths:
      - .claude/skills/k8s-test/postgres.yaml
      - .claude/skills/k8s-test/observability.yaml
    statement: >-
      Throwaway test-harness manifests for a disposable local cluster, deployed
      by nothing; the chart they exercise is gated on the opposite standard by
      deploy/helm/validate.sh.
  - id: KSV-0118
    paths:
      - .claude/skills/k8s-test/postgres.yaml
      - .claude/skills/k8s-test/observability.yaml
    statement: >-
      Throwaway test-harness manifests for a disposable local cluster, deployed
      by nothing; the chart they exercise is gated on the opposite standard by
      deploy/helm/validate.sh.

# No secret exceptions. The deliberate development credentials (the quickstart's
# Argon2id hash, the development HMAC secrets) were checked against the secret
# scanner and are NOT flagged, so listing them here would be inventing
# exceptions for findings that do not exist.
secrets: []

# No vulnerability exceptions. This gate reports only findings that have a fix,
# and those are fixed by a rebuild or a base bump. A finding without a fix gets
# its argument as an OpenVEX statement in `security/vex/*.json`, which the
# release record and the weekly published-image scan read.
vulnerabilities: []
