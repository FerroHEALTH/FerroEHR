# REUSE Specification 3.3 — https://reuse.software/spec-3.3/
#
# WHAT THIS ADDS that the existing arrangement did not. Licensing here has
# always been recorded per vendored tree, by a `PROVENANCE.md` naming the
# upstream source, the pinned revision and the licence, with the upstream
# `LICENSE` vendored alongside. That is accurate and it stays. What it does not
# do is SURVIVE A FILE LEAVING THIS REPOSITORY — the property REUSE exists for,
# that licensing "is preserved when the file is copied and reused by third
# parties". Someone who lifts one archetype out of a test corpus takes a
# CC-BY-SA file; someone who vendors one generated crate source file takes a
# file whose dual-licence position is stated only in a manifest they did not
# copy. This repository redistributes material under six distinct licences and
# its stated premise is that people build on it and ship it, so downstream
# file-level redistribution is the expected case, not the edge case.
#
# WHY THE DECLARATIONS ARE HERE RATHER THAN IN THE FILES. `REUSE.toml`
# expresses licensing in bulk by glob, which is what makes this tractable
# without touching a single vendored file — and hand-editing vendored material
# is forbidden by this project's own corpus discipline, so a header sweep over
# the third-party trees was never an option.
#
# HOW THE TABLES COMPOSE, because the ordering below is load-bearing: "If a
# Covered File is covered by multiple [[annotations]] tables in the same
# REUSE.toml file, then exclusively the LAST matching table in the file is used"
# (spec 3.3). So the first table is the catch-all and every later table narrows
# it. Move one and you change what it declares.
#
# PRECEDENCE, likewise from the spec: `closest` associates licensing found
# INSIDE the file (a comment header or a `.license` sidecar) and falls back to
# the table only when the file carries none; `override` ignores anything closer.
# First-party globs use `closest`, so adding a real SPDX header to a source file
# is an improvement that takes effect immediately and never contradicts this
# file. Vendored globs use `override` where the upstream tree's terms are
# settled by its `PROVENANCE.md` rather than by any per-file marking.

version = 1

# ── Catch-all: everything in this repository is the project's own, BUSL-1.1 ──
# The Business Source License 1.1 (owner decision 2026-09-03; the parameters are
# in the root LICENSE). Narrowed by every table below. `closest` means a file carrying its own SPDX
# header wins over this declaration.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "Cadasto B.V."
SPDX-License-Identifier = "BUSL-1.1"

# ── The five generated model crates: Apache-2.0 ────────────────────────────
# Owner decision 2026-09-03: the crates generated from openEHR's own
# machine-readable artifacts stay Apache-2.0, the licence of those inputs, so
# any Rust project can consume the model. They embed openEHR specification
# text, terminology XML or JSON Schema and name the openEHR Foundation as a
# second holder. The vendored inputs and assets INSIDE these crates are narrowed
# further below.
[[annotations]]
path = [
  "crates/openehr-base/**",
  "crates/openehr-rm/**",
  "crates/openehr-am/**",
  "crates/openehr-lang/**",
  "crates/openehr-term/**",
  "crates/openehr-its/**",
]
precedence = "closest"
SPDX-FileCopyrightText = ["Cadasto B.V.", "openEHR Foundation"]
SPDX-License-Identifier = "Apache-2.0"

# ── The three hand-written spec engines: BUSL-1.1 ──────────────────────────
# Owner decisions 2026-09-04 and 2026-09-24 (#3482): the ADL engine, the AQL
# parser and the Simplified Data Template engine are the project's own
# engineering and carry the Business Source License like the application (the
# parameters are in each crate's LICENSE). None of them embeds openEHR
# material, so each has one holder. openehr-its, the ITS wire layer generated
# from the Apache-2.0 XSD/OpenAPI/BMM artifacts with the ITS-JSON schema
# embedded, is Apache-2.0 with the generated model crates above.
[[annotations]]
path = [
  "crates/openehr-query/**",
  "crates/openehr-adl/**",
  "crates/openehr-sdt/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "Cadasto B.V."
SPDX-License-Identifier = "BUSL-1.1"

# ── openEHR machine-readable artifacts — Apache-2.0 ─────────────────────────
# The BMM meta-models, XML Schemas, OpenAPI documents, JSON Schemas and ANTLR
# grammars the code generator and the codecs consume. Vendored verbatim by a
# committed script; each tree's PROVENANCE.md names the exact upstream commit.
[[annotations]]
path = [
  "tools/openehr-codegen/vendor/**",
  "crates/openehr-its/schemas/**",
  "crates/openehr-its/vendor/**",
  "crates/openehr-adl/vendor/**",
  "crates/openehr-lang/vendor/**",
]
precedence = "override"
SPDX-FileCopyrightText = "openEHR Foundation"
SPDX-License-Identifier = "Apache-2.0"

# ── openEHR specification TEXT — CC-BY-SA-3.0 ───────────────────────────────
# The conformance oracle: the normative documentation, redistributed verbatim
# with attribution. Reference and test material, never part of the compiled
# server.
[[annotations]]
path = "docs/specs/openehr/**"
precedence = "override"
SPDX-FileCopyrightText = "openEHR Foundation"
SPDX-License-Identifier = "CC-BY-SA-3.0"

# The AQL grammar and the TERM computable assets come from the same
# specification repositories under the same terms.
[[annotations]]
path = [
  "crates/openehr-query/vendor/**",
  "crates/openehr-term/assets/**",
]
precedence = "override"
SPDX-FileCopyrightText = "openEHR Foundation"
SPDX-License-Identifier = "CC-BY-SA-3.0"

# One file inside that tree contradicts its own repository. `PropertyUnitData.xsd`
# carries an ADL Designer / ADL2-tools header offering it under the GNU Affero
# General Public License, inside an upstream repository whose LICENSE is
# CC-BY-SA-3.0. The contradiction is upstream's and is not ours to resolve, so
# it is declared here at the MORE RESTRICTIVE of the two readings — the one the
# file's own text asserts — rather than quietly absorbed into the tree
# declaration above. No obligation propagates to anything shipped: the file is
# excluded from the published crate by that crate's `include`, so it reaches no
# consumer.
[[annotations]]
path = "crates/openehr-term/assets/schema/PropertyUnitData.xsd"
precedence = "override"
SPDX-FileCopyrightText = "2013-2014 Marand d.o.o."
SPDX-License-Identifier = "AGPL-3.0-only"

# ── Third-party test corpora — Apache-2.0 ───────────────────────────────────
# archie fixtures (Nedap), Better `web-template-tests`, EHRbase SDK
# canonical-JSON data (vitasystems), and the openEHR reference-model BMM set
# archie ships. Each tree's PROVENANCE.md names its upstream and licence.
[[annotations]]
path = [
  "crates/openehr-its/tests/vendor/**",
  "crates/openehr-its/tests/fixtures/**",
  "crates/openehr-sdt/tests/fixtures/**",
  "crates/openehr-lang/tests/vendor/**",
  "crates/openehr-adl/tests/corpus/rm/**",
]
precedence = "override"
SPDX-FileCopyrightText = ["Nedap Healthcare", "Better Ltd", "vitasystems GmbH", "openEHR Foundation"]
SPDX-License-Identifier = "Apache-2.0"

# One fixture under that tree is NOT third-party: it is a repo-authored
# derivative of an openEHR CNF Robot template (CC-BY-SA 3.0), so it carries
# that licence and both copyright holders. Its own PROVENANCE.md records the
# upstream commit and every edit.
[[annotations]]
path = "crates/openehr-sdt/tests/fixtures/named_event/**"
precedence = "override"
SPDX-FileCopyrightText = ["openEHR Foundation", "Cadasto B.V."]
SPDX-License-Identifier = "CC-BY-SA-3.0"

# Three BMM reference models inside that set are offered by their authors under
# a Mozilla Public License 1.1 / GPL 2.0 / LGPL 2.1 TRI-LICENCE. This project
# TAKES THEM UNDER MPL-1.1 — the election is recorded in that corpus's
# PROVENANCE.md — so no GPL or LGPL obligation attaches to anything here.
# Declaring the tri-licence as a disjunction would misrepresent a choice that
# has already been made and recorded.
[[annotations]]
path = [
  "crates/openehr-adl/tests/corpus/rm/referencemodels/bmm/ISO_13606/2008/BMM/cen_EN13606_0.95.bmm",
  "crates/openehr-adl/tests/corpus/rm/referencemodels/bmm/ISO_13606/2008/BMM/cen_ts14796_0.90.bmm",
  "crates/openehr-adl/tests/corpus/rm/referencemodels/bmm/openEHR/components/RM/rejected/openehr_ehr_extract_999.bmm",
]
precedence = "override"
SPDX-FileCopyrightText = "the respective model authors"
SPDX-License-Identifier = "MPL-1.1"

# ── Clinical models (archetypes, templates) ─────────────────────────────────
# The CKM-derived clinical models. Most of this material carries its licence
# INSIDE itself — the archetype's own `description` block has a `licence`
# field — so for those files licensing already survives copying, and these
# declarations exist to make the same fact machine-readable at the tree level.
# The ADL2 library is the exception and is declared separately below.
#
# The corpora are MIXED at file level and the SPDX expression says so rather
# than picking a winner: a first-hand count over the CKM corpus finds both
# CC-BY-SA-4.0 (the majority) and CC-BY-SA-3.0 (several hundred files) — so
# neither version alone is a true statement about the tree, and `AND` names
# both sets of obligations a redistributor takes on. The per-file `licence`
# metadata remains the authority for any individual file.
[[annotations]]
path = [
  "corpus/**",
  "crates/openehr-adl/tests/corpus/**",
]
precedence = "override"
SPDX-FileCopyrightText = ["openEHR Foundation", "the respective archetype authors"]
SPDX-License-Identifier = "CC-BY-SA-3.0 AND CC-BY-SA-4.0"

# The ADL2 archetype library states NO licence, and this declaration says so
# rather than inheriting the CC-BY-SA expression above (#3150). Measured over
# the vendored tree: of 652 archetypes, ONE carries a `licence` field and it
# reads CC-BY 4.0 unported; the other 651 carry `copyright = <"© openEHR
# Foundation">` and nothing else. Upstream states nothing either — no LICENSE
# file at the pinned commit, and a four-line README.
#
# `LicenseRef-openEHR-unstated` is the REUSE-sanctioned way to say this — a
# LicenseRef with its own text in LICENSES/, which spells out what was
# measured. It is NOT a licence. Declaring CC-BY-SA over a tree whose files
# never mention it would manufacture a grant out of a glob; the copyright
# holder is named because that IS what the files say. The subtree's own
# PROVENANCE.md carries the same measurement and its date.
[[annotations]]
path = "corpus/archetypes/adl2/**"
precedence = "override"
SPDX-FileCopyrightText = "openEHR Foundation"
SPDX-License-Identifier = "LicenseRef-openEHR-unstated"

# The service fixture corpus is not clinical-model material under CKM terms at
# all, so the broad glob above would state the wrong licence over it (#3408).
# 106 of its 108 files came verbatim from EHRbase's own
# `service/src/test/resources/` with the fork import at v2.33.0, whose
# repository LICENSE is Apache-2.0; the other two were written here. Measured
# over the tree on 2026-09-16: 91 of the 92 OPT files carry an
# `other_details id="Copyright"` element and all 91 are EMPTY, the one `licence`
# element in the set is empty too, and no archetype states a licence — so the upstream repository's grant is
# the only one there is, which is why this is Apache-2.0 and not a LicenseRef.
# The subtree's PROVENANCE.md carries the measurement and the two-file table.
[[annotations]]
path = "corpus/fixtures/service/**"
precedence = "override"
SPDX-FileCopyrightText = ["openEHR Foundation", "the EHRbase contributors", "Cadasto B.V."]
SPDX-License-Identifier = "Apache-2.0"

# FerroPULSE's report v1 schemas are not clinical-model material either, so the
# broad glob above would state the wrong licence over them. They come from
# Cadasto B.V.'s private FerroPULSE repository, whose manifest declares
# LicenseRef-Proprietary; Cadasto B.V. holds this repository too, and the copy
# here is declared under this repository's licence. The subtree's PROVENANCE.md
# records the pin.
[[annotations]]
path = "corpus/ferropulse/**"
precedence = "override"
SPDX-FileCopyrightText = "Cadasto B.V."
SPDX-License-Identifier = "BUSL-1.1"

# The ADL2 regression library inside the openehr-adl corpus is the same
# upstream repository as the tree above but a different subtree, and it was
# measured separately (#3150): of 302 archetypes, 111 state a licence and 191
# state none. Where one IS stated it is predominantly CC-BY-SA 3.0 (100 of the
# 111 — 93 by URL, 5 in prose, 2 spelled `CC-SA-BY`), with 10 CC-BY 4.0 and 1
# CC-BY 3.0. No file in it states CC-BY-SA 4.0, which the broad clinical-model
# glob above would otherwise have asserted over the whole tree.
#
# The expression names every obligation a redistributor of this subtree takes
# on, and `LicenseRef-openEHR-unstated` names the majority that grant nothing.
[[annotations]]
path = "crates/openehr-adl/tests/corpus/adl2-reference/**"
precedence = "override"
SPDX-FileCopyrightText = ["openEHR Foundation", "the respective archetype authors"]
SPDX-License-Identifier = "LicenseRef-openEHR-unstated AND CC-BY-SA-3.0 AND CC-BY-4.0 AND CC-BY-3.0"

# The BMM reference-model subtree inside the ADL2 corpus is code-adjacent
# material under different terms, so the two tables above are re-applied after
# the broad clinical-model glob that would otherwise have swallowed them —
# the last matching table wins, so these must come last.
[[annotations]]
path = "crates/openehr-adl/tests/corpus/rm/**"
precedence = "override"
SPDX-FileCopyrightText = ["Nedap Healthcare", "openEHR Foundation"]
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  "crates/openehr-adl/tests/corpus/rm/referencemodels/bmm/ISO_13606/2008/BMM/cen_EN13606_0.95.bmm",
  "crates/openehr-adl/tests/corpus/rm/referencemodels/bmm/ISO_13606/2008/BMM/cen_ts14796_0.90.bmm",
  "crates/openehr-adl/tests/corpus/rm/referencemodels/bmm/openEHR/components/RM/rejected/openehr_ehr_extract_999.bmm",
]
precedence = "override"
SPDX-FileCopyrightText = "the respective model authors"
SPDX-License-Identifier = "MPL-1.1"

# ── Recorded fuzz regressions ───────────────────────────────────────────────
# The inputs that reproduced a finding, tracked so every run re-checks them.
# They are first-party: mutations this project's own harnesses produced, or
# short literals written here. A header cannot go inside them — the bytes ARE
# the input under test.
[[annotations]]
path = "fuzz/regressions/**"
precedence = "override"
SPDX-FileCopyrightText = "Cadasto B.V."
SPDX-License-Identifier = "BUSL-1.1"

# ── Self-hosted KaTeX assets — MIT ──────────────────────────────────────────
# The documentation site pre-renders maths at build time and self-hosts the
# stylesheet and fonts; provenance is in website/book/KATEX-PROVENANCE.md.
[[annotations]]
path = "website/book/src/katex/**"
precedence = "override"
SPDX-FileCopyrightText = "KaTeX contributors"
SPDX-License-Identifier = "MIT"

# ── The Citation File Format 1.2.0 JSON Schema — CC-BY-4.0 ──────────────────
# Vendored by scripts/vendor/cff-schema.sh (#2791) for the citation-guard CI
# job's no-Python CFF validation; provenance in the tree's PROVENANCE.md. The
# PROVENANCE.md itself is first-party and covered by the record block below.
[[annotations]]
path = [".github/cff-schema/schema.json", ".github/cff-schema/LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = "The Citation File Format contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# ── One vendored file whose NAME contains a newline character ───────────────
# `docs/specs/openehr/CNF/.../I_EHR_COMPOSITION.get_composition_version-bad_ehr\n.robot`
# is tracked with a literal U+000A inside its filename — an upstream defect in
# the vendored CNF suite, not something this repository may rename (hand-editing
# a vendored tree is forbidden; the fix belongs upstream). Glob matching over a
# newline-bearing path does not reach it, so it is named explicitly.
[[annotations]]
path = "docs/specs/openehr/CNF/tests/platform/robot/I_EHR_COMPOSITION/get_composition/I_EHR_COMPOSITION.get_composition_version-bad_ehr\n.robot"
precedence = "override"
SPDX-FileCopyrightText = "openEHR Foundation"
SPDX-License-Identifier = "CC-BY-SA-3.0"

# ── Our own provenance records inside the vendored trees ────────────────────
# The PROVENANCE.md files are FIRST-PARTY prose about the upstream material,
# not upstream bytes; the tree globs above would mis-attribute them to the
# openEHR Foundation (`override` means no in-file header could correct it,
# and openehr-term ships its record in the published package under that
# declaration). Placed LAST: a later matching annotation wins.
[[annotations]]
path = [
  "crates/openehr-its/schemas/json/PROVENANCE.md",
  "crates/openehr-its/schemas/xml/PROVENANCE.md",
  "crates/openehr-term/assets/PROVENANCE.md",
  "corpus/fixtures/service/PROVENANCE.md",
  ".github/cff-schema/PROVENANCE.md",
  "corpus/PROVENANCE.md",
  "corpus/archetypes/adl2/PROVENANCE.md",
  "corpus/archetypes/ckm/PROVENANCE.md",
  "corpus/templates/ckm/PROVENANCE.md",
  "corpus/templates/ckm/full/PROVENANCE.md",
]
precedence = "override"
SPDX-FileCopyrightText = "Cadasto B.V."
SPDX-License-Identifier = "BUSL-1.1"

# ── The vendored regulation corpus ──────────────────────────────────────────
# docs/law/ carries the legal texts the compliance documentation cites, fetched
# verbatim by scripts/vendor/law-{eu,nl,de,ch}.sh. Each act
# directory's PROVENANCE.md names the identifier, the consolidation date, the
# source and the licence; the terms themselves are quoted in LICENSES/. These
# are the publisher's bytes, so `override`: no in-file marking could correct
# them and hand-editing a vendored act is forbidden.
#
# The EU legal documents come under the Commission's reuse policy, Decision
# 2011/833/EU, which the EUR-Lex legal notice states for them.
[[annotations]]
path = "docs/law/eu/**"
precedence = "override"
SPDX-FileCopyrightText = "European Union"
SPDX-License-Identifier = "LicenseRef-EUR-Lex-Reuse"

# Five of those acts are pinned at a CONSOLIDATED text, and consolidation is
# the EU's own editorial work: the same legal notice licenses "the editorial
# content of this website, the summaries of EU legislation and the consolidated
# texts" under CC BY 4.0. Both sets of obligations are named rather than one
# being picked. Only the consolidation itself (`text.html`) is named: the OJ
# documents vendored beside it in the GDPR and ePrivacy directories (the
# recitals, a corrigendum, an amending directive) are not consolidated texts
# and stay under the block above alone, as do the CRA corrigenda beside the
# CRA's OJ text and the NIS2 corrigendum beside the NIS2 OJ text.
[[annotations]]
path = [
  "docs/law/eu/gdpr/text.html",
  "docs/law/eu/mdr/text.html",
  "docs/law/eu/eprivacy/text.html",
  "docs/law/eu/market-surveillance-2019-1020/text.html",
  "docs/law/eu/accreditation-765-2008/text.html",
]
precedence = "override"
SPDX-FileCopyrightText = "European Union"
SPDX-License-Identifier = "LicenseRef-EUR-Lex-Reuse AND CC-BY-4.0"

# The EDPB is not the Commission and states its own reuse terms on its own
# copyright page: reuse for any purpose, on condition that the source is
# acknowledged and the meaning is not distorted.
[[annotations]]
path = [
  "docs/law/eu/edpb-guidelines-01-2025-pseudonymisation/**",
  "docs/law/eu/edpb-guidelines-02-2023-eprivacy-5-3/**",
]
precedence = "override"
SPDX-FileCopyrightText = "European Data Protection Board"
SPDX-License-Identifier = "LicenseRef-EDPB-Reuse"

# Dutch acts and decrees are outside copyright by statute — Auteurswet Art. 11
# — so this declares a legal fact rather than a grant. The copyright field
# names the issuing authority because REUSE requires one, and the LicenseRef
# text says in full that no copyright subsists. The NEN standards cited by the
# same pages are NOT here: they are sold under copyright, and their directories
# hold a record and no text (covered by the first-party block below).
[[annotations]]
path = "docs/law/nl/**"
precedence = "override"
SPDX-FileCopyrightText = "the State of the Netherlands (no copyright subsists, Auteurswet Art. 11)"
SPDX-License-Identifier = "LicenseRef-Auteurswet-Art11-Public-Domain"

# German federal law is outside copyright protection by statute — § 5 Abs. 1
# UrhG (amtliche Werke) — so this too declares a legal fact rather than a
# grant. The copyright field names the issuing authority because REUSE
# requires one; the LicenseRef text quotes the paragraph in full. Covers the
# consolidated XML from gesetze-im-internet.de and the Bundesgesetzblatt PDF
# from recht.bund.de alike: the paragraph reaches the act in every edition.
[[annotations]]
path = "docs/law/de/**"
precedence = "override"
SPDX-FileCopyrightText = "the Federal Republic of Germany (no copyright protection, § 5 Abs. 1 UrhG)"
SPDX-License-Identifier = "LicenseRef-UrhG-Para5-Amtliche-Werke"

# Swiss federal law is not protected by copyright — Art. 5 Abs. 1 lit. a URG
# — and Art. 5 Abs. 2 extends that to the official translations, which is
# what covers the non-binding English texts Fedlex publishes beside the
# authentic German ones. Same shape as the two blocks above: a legal fact,
# an issuing authority in the copyright field, the article quoted in the
# LicenseRef text.
[[annotations]]
path = "docs/law/ch/**"
precedence = "override"
SPDX-FileCopyrightText = "the Swiss Confederation (not protected by copyright, Art. 5 URG)"
SPDX-License-Identifier = "LicenseRef-URG-Art5-Nicht-Geschuetzte-Werke"

# The corpus index, the provenance records and the digest files are FIRST-PARTY
# prose and first-party output about the vendored material, not the material.
# The tree globs above would otherwise attribute them to the publishers.
# Placed LAST: a later matching annotation wins.
[[annotations]]
path = [
  "docs/law/README.md",
  "docs/law/**/PROVENANCE.md",
  "docs/law/**/SHA256SUMS",
]
precedence = "override"
SPDX-FileCopyrightText = "Cadasto B.V."
SPDX-License-Identifier = "BUSL-1.1"
