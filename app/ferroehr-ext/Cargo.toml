[package]
name = "ferroehr-ext"
description = "FerroEHR optional-integration extensions (multimedia), feature-gated"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# One additive feature per integration (#1890).
multimedia = [
    "dep:base64",
    "dep:bytes",
    "dep:object_store",
    "dep:openehr-base",
    "dep:openehr-its",
    "dep:openehr-rm",
    "dep:secrecy",
    "dep:serde_json",
    "dep:sha2",
    "dep:thiserror",
    "dep:url",
]

[lints]
workspace = true

[dependencies]
openehr-base = { path = "../../crates/openehr-base", optional = true }
openehr-its = { path = "../../crates/openehr-its", optional = true }
openehr-rm = { path = "../../crates/openehr-rm", optional = true }

base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
# The behaviour tests over the public seams (tests/it): the in-memory
# object_store backend standing in for S3.
base64 = { workspace = true }
object_store = { workspace = true }
serde_json = { workspace = true }
