[package]
name = "ferroehr-ext"
description = "FerroEHR optional-integration extensions (FHIR audit and terminology, events, multimedia), feature-gated"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# One additive feature per integration (#1890). `fhir` covers the typed FHIR
# surface the platform keeps: the ATNA AuditEvent renderer and the
# terminology-response decoder.
fhir = [
    "dep:fhir-model",
    "dep:jiff",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
]
events = [
    "dep:async-trait",
    "dep:lapin",
    "dep:serde_json",
    "dep:thiserror",
    "dep:tokio",
]
multimedia = [
    "dep:base64",
    "dep:bytes",
    "dep:object_store",
    "dep:openehr-base",
    "dep:openehr-its",
    "dep:openehr-sdt",
    "dep:openehr-rm",
    "dep:secrecy",
    "dep:serde_json",
    "dep:sha2",
    "dep:thiserror",
    "dep:url",
]

[lints]
workspace = true

[dependencies]
openehr-base = { path = "../../crates/openehr-base", optional = true }
openehr-its = { path = "../../crates/openehr-its", optional = true }
openehr-sdt = { path = "../../crates/openehr-sdt", optional = true }
openehr-rm = { path = "../../crates/openehr-rm", optional = true }

async-trait = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
fhir-model = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
lapin = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
# The behaviour tests over the public seams (tests/it): a test double for the
# EventPublisher trait, fixture bodies for the terminology decoders, and the
# in-memory object_store backend standing in for S3.
async-trait = { workspace = true }
base64 = { workspace = true }
object_store = { workspace = true }
serde_json = { workspace = true }
