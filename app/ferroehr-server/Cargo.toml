[package]
name = "ferroehr-server"
version.workspace = true
description = "FerroEHR server binary: boots the ITS-REST server over the platform library"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "ferroehr"
path = "src/main.rs"

[features]
# Forward the optional-integration gates (#1890); default mirrors ferroehr's.
default = ["fhir", "events", "multimedia"]
fhir = ["ferroehr/fhir", "ferroehr-rest/fhir"]
events = ["ferroehr/events", "ferroehr-rest/events"]
multimedia = ["ferroehr/multimedia", "ferroehr-rest/multimedia"]

[dependencies]
ferroehr = { path = "../ferroehr", default-features = false }
ferroehr-rest = { path = "../ferroehr-rest", default-features = false }

anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
# The wiring-seam tests (`tests/it/`) drive `Cli` parsing, the pure-stdout
# `config default` dispatch and the `[privacy]` policy the run path compiles
# out of the shipped defaults: the CLI derive, the async `run` entry point,
# its `anyhow` result, a temp file for the shipped template, and `openehr-its`
# for the example COMPOSITION that policy has to accept. Everything past that
# seam is tested in the crate that owns it (`app/ferroehr/tests/it/`,
# `app/ferroehr-rest/tests/it/`), so no database, HTTP, or container harness
# is needed here.
anyhow.workspace = true
assert_fs.workspace = true
clap.workspace = true
openehr-its = { path = "../../crates/openehr-its" }
openehr-sdt = { path = "../../crates/openehr-sdt" }
tokio.workspace = true
