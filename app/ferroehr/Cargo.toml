[package]
name = "ferroehr"
version.workspace = true
description = "FerroEHR platform library: persistence, AQL execution engine (ASL), versioning, contributions"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[features]
# The optional-integration gates (#1890): default = all on, so the shipped
# binary and every existing consumer keep today's surface; a
# --no-default-features build is the slim CDR. Additive only.
# `fhir` covers the FHIR the CDR keeps: the ATNA `AuditEvent` rendering (the
# local store, the ATX:FHIR Feed, the ITI-81 retrieval) and the FHIR R4B
# terminology client. FHIR R4 resource mapping is FerroBRIDGE's, outside this
# workspace.
default = ["fhir", "multimedia"]
fhir = ["dep:ferrobridge-term", "dep:fhir-types", "ehds-logging/balp", "ihe-atna/balp", "ihe-atna/feed"]
multimedia = ["dep:ferroehr-ext", "ferroehr-ext/multimedia"]
# The stage spans the hot-path budget times with the thread's CPU clock
# (#6321): only ferroehr-rest's tests turn it on, so a server build carries
# no stage mark.
stage-cpu = []
# `schemars::JsonSchema` on the configuration tree and every type it reaches,
# which tools/config-reference renders into the reference page and the default
# ferroehr.toml (#5316). No server build turns it on.
schema = [
  "dep:schemars",
  "ehds-logging/schema",
  "ferrohealth-config/schema",
  "ferrohealth-secret/schema",
  "ferrohealth-server/schema",
  "ferrohealth-smart/schema",
  "ferrohealth-telemetry/schema",
  "ferrohealth-usage-report/schema",
]

[dependencies]
futures.workspace = true
ferrohealth-secret = { workspace = true }
schemars = { workspace = true, optional = true }
ferrohealth-server = { workspace = true, features = ["otlp", "platform-verifier", "reqwest"] }
ferrohealth-health = { workspace = true, features = ["registry"] }
ferroehr-ext = { path = "../ferroehr-ext", optional = true }
# A stored body and an archived blob travel as shared slices.
bytes = { workspace = true }
http.workspace = true
secrecy.workspace = true
urlencoding.workspace = true
unicode-normalization.workspace = true
# `[auth]` is the `ferrohealth-smart` section (`config::auth`), and the
# terminology lane's client credentials grant runs on its client.
ferrohealth-smart = { workspace = true, features = ["server-tls"] }
# The client of the one FHIR terminology server (`service::terminology::fhir`),
# behind `fhir`: a slim build refuses a configured server at boot.
ferrobridge-term = { workspace = true, optional = true }
url.workspace = true
async-trait.workspace = true
ferrohealth-config.workspace = true
ferrohealth-telemetry.workspace = true
ferrohealth-usage-report.workspace = true
jiff.workspace = true
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# FerroEHR's own instruments on the shared meter (the provider, the OTLP
# export and the Prometheus reader are ferrohealth-telemetry's) and the
# span-timing capture behind `[management] flame_file`.
tracing-flame.workspace = true
opentelemetry.workspace = true
jiff-sqlx.workspace = true
# FHIR reverse-mapping: `openehr_sdt::flat` FLAT conversion returns an
# `IndexMap` FLAT map the reverse transform reads leaf-by-leaf.
indexmap.workspace = true
# The audit forwarder's retry/backoff (`system_log::sender`).
sea-query.workspace = true
sea-query-sqlx.workspace = true
# `EHR_ACCESS` scheme-settings cache (per-ehr, invalidated on EHR_ACCESS commit).
moka.workspace = true
# The commit audit shared parts this process has seen (#6395).
arc-swap.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
# OPT 1.4 upload structure validation (`service::template`): a depth-aware scan
# of the template XML that rejects foreign / duplicated top-level elements the
# tolerant opt14 codec would otherwise accept (CNF master04 upload_opt-invalid_opt).
quick-xml.workspace = true
# ADL 1.4 / OPT / stored-query id-pattern matching (`list_matching_*`):
# RE2-class regexes for the definition service's regex-pattern list calls.
regex.workspace = true
# The ITS-REST `version` path parameter is "a SEMVER version number", judged
# by the Semantic Versioning 2.0.0 grammar this crate implements.
semver.workspace = true
sqlx.workspace = true
thiserror.workspace = true
# One-config-tree loader (`config` module): serialize the effective config to
# redacted TOML for `config check` / `/management/env`. No openEHR spec governs
# configuration — our own design (no openEHR spec governs the config tree).
toml.workspace = true
uuid = { workspace = true, features = ["v7", "fast-rng"] }   # ids are uuidv7 (docs/postgres-features.md pins the DB side)

# `signing` module (RM common §Digital Signature; moved from the former
# ferroehr-signing crate): OpenPGP detached signatures, RFC 9980 ML-DSA-65+Ed25519
# through ferrohealth-openpgp-pq, and the SHA-256 digest mode.
pgp.workspace = true
ferrohealth-openpgp-pq.workspace = true
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
# `service::admin::dump_load`: the `zip` compression format of our own dump/load
# extension, the dump archive packed as one ZIP container instead of loose
# segment files.
zip.workspace = true
# ... and the `7z` member (owner-approved 2026-07-29).
sevenz-rust2.workspace = true
# NOTE: rPGP 0.20's `DetachedSignature::sign_binary_data` takes an
# `rng: Rng + CryptoRng` from rand 0.8's rand_core 0.6; the workspace `rand`
# pin (0.10) is a trait-incompatible major, so the `signing` module pins the
# rand version pgp itself requires purely to name `OsRng` for that one call.
# Pinned to pgp's rand generation ON PURPOSE, not stale: `versioning::signature`
# hands `rand::rngs::OsRng` to `pgp`'s DetachedSignature signing call, so the
# types must come from the same rand major. `pgp 0.20` requires rand 0.8.7.
rand = "0.8"
# `system_log` module (IHE ATNA audit trail): the shared
# FerroAUDIT crates write it. `ihe-atna` (`atna`) builds the DICOM audit
# message and sends it as RFC 5424 syslog over RFC 5425 TLS; `ehds-logging`
# classifies each access by the Art 14(1) categories and holds the Art 9(2)
# floor. The `fhir` feature adds their `balp` features: the access record and
# the other audit records written as the BALP `AuditEvent`, and the ATX: FHIR
# Feed.
ihe-atna = { workspace = true, features = ["atna"] }
ehds-logging.workspace = true
# The FHIR R4 `AuditEvent` the ITI-81 retrieval serves, typed as `ihe-atna`
# writes it, so a page is never read back from JSON (`fhir`).
fhir-types = { workspace = true, optional = true }
# The IHE patient identity source of the EHR index (`service::ehr_index::ihe`):
# the PIXm Patient Identifier Cross-reference Consumer (ITI-83), authenticated by
# the `smart` token authorizer under `[ehr_index.oauth]`; and the PMIR Patient
# Identity Subscriber and Consumer (`service::demographic::identity_feed`,
# ITI-94 and ITI-93).
ihe-iti = { workspace = true, features = ["pixm", "pmir"] }

openehr-base = { path = "../../crates/openehr-base" }
openehr-term = { path = "../../crates/openehr-term" }
openehr-rm = { path = "../../crates/openehr-rm", features = ["draft"] }
openehr-its = { path = "../../crates/openehr-its", features = ["tracing"] }
openehr-sdt = { path = "../../crates/openehr-sdt", features = ["draft"] }
openehr-am = { path = "../../crates/openehr-am" }
openehr-adl = { path = "../../crates/openehr-adl" }
openehr-query = { path = "../../crates/openehr-query" }

[dev-dependencies]
# Every feature the integration modules USE, named here rather than left to
# unification (#3207). The `multimedia` modules reach `ferroehr_ext`
# directly. The modules that import the library's `fhir`-gated
# `system_log::fhir` and `service::terminology::fhir` take that feature from
# the library's defaults; there is deliberately NO lane building these
# targets with it off.
ferroehr-ext = { path = "../ferroehr-ext", features = ["multimedia"] }
testkit = { path = "../../tools/testkit" }
# The key exchange tests name the groups a peer offers (`testkit::kx`).
rustls = { workspace = true }
# The access-record tests read what `ehds-logging` writes by its names.
ehds-logging = { workspace = true, features = ["balp"] }
serde_norway.workspace = true
# The generated corpora of the canonical-form differential tests (#5849).
proptest.workspace = true
# Temp config files for the pure-loader (`config` module) tests.
assert_fs.workspace = true
# Hermetic FHIR terminology-server mock for the external-terminology provider
# tests (B4): canned `$validate-code`/`$expand`/`$subsumes`/`$lookup` responses
# + fault injection (timeout, 5xx, malformed) — no network in CI.
wiremock.workspace = true
# The PMIR consumer suite builds its ITI-93 messages with the Registry's own
# notification writer, so each holds to the PMIR profiles as a Supplier sends
# it, over the generated FHIR R4 `Patient`.
ihe-iti = { workspace = true, features = ["pmir-server"] }
fhir-types.workspace = true
# The usage report suite validates every payload against FerroPULSE's vendored
# report v2 JSON Schema (`corpus/ferropulse/`).
jsonschema.workspace = true
testcontainers.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
http.workspace = true
http-body-util.workspace = true
insta.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
# The in-memory OTLP exporters for the export-pipeline smoke tests.
opentelemetry_sdk = { workspace = true, features = ["rt-tokio", "testing"] }
# The AQL bench harness (`benches/aql.rs`): criterion drives the measurements,
# pprof renders per-bench flamegraphs under `--profile-time` (pprof's own
# `criterion` feature is pinned to criterion ^0.5, so the bench implements
# criterion's `Profiler` trait over pprof directly — see the bench file).
criterion.workspace = true
pprof.workspace = true
inferno.workspace = true

[[bench]]
name = "aql"
harness = false

[[bench]]
name = "validation"
harness = false

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "access_classes"
harness = false

[[bench]]
name = "access_decision"
harness = false

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = []
