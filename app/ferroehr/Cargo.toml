[package]
name = "ferroehr"
version.workspace = true
description = "FerroEHR platform library: persistence, AQL execution engine (ASL), versioning, contributions"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[features]
# The optional-integration gates (#1890): default = all on, so the shipped
# binary and every existing consumer keep today's surface; a
# --no-default-features build is the slim CDR. Additive only.
# `fhir` covers the FHIR the CDR keeps: the ATNA `AuditEvent` rendering (the
# local store, the ATX:FHIR Feed, the ITI-81 retrieval) and the FHIR R4B
# terminology client. FHIR R4 resource mapping is FerroBRIDGE's, outside this
# workspace.
default = ["fhir", "events", "multimedia"]
fhir = ["dep:ferroehr-ext", "ferroehr-ext/fhir"]
events = ["dep:ferroehr-ext", "ferroehr-ext/events"]
multimedia = ["dep:ferroehr-ext", "ferroehr-ext/multimedia"]

[dependencies]
ferroehr-ext = { path = "../ferroehr-ext", optional = true }
http.workspace = true
secrecy.workspace = true
urlencoding.workspace = true
# `config::auth` boot validation: the OWASP Argon2id cost floor is judged by
# parsing each configured PHC string through the same `argon2` seam the Basic
# verifier uses, and `url` judges the `[auth.oidc] issuer` against the RFC 8414
# §2 issuer-identifier rules.
argon2.workspace = true
url.workspace = true
async-trait.workspace = true
config.workspace = true
jiff.workspace = true
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Observability (telemetry init): the OTLP export layer + metrics facade +
# Prometheus recorder. The single `tracing` API fans out to stdout logs and
# (opt-in) OTLP spans; `metrics` is pulled via the Prometheus recorder.
tracing-opentelemetry.workspace = true
tracing-flame.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-prometheus.workspace = true
prometheus.workspace = true
jiff-sqlx.workspace = true
# FHIR reverse-mapping: `openehr_sdt::flat` FLAT conversion returns an
# `IndexMap` FLAT map the reverse transform reads leaf-by-leaf.
indexmap.workspace = true
# `events` module (contribution-outbox eventing — no openEHR spec governs
# eventing; our own extension): AMQP 0.9.1 publisher (RabbitMQ) draining the
# transactional outbox at-least-once, with `backon` retry/backoff.
lapin.workspace = true
backon.workspace = true
sea-query.workspace = true
sea-query-sqlx.workspace = true
# `EHR_ACCESS` scheme-settings cache (per-ehr, invalidated on EHR_ACCESS commit).
moka.workspace = true
# Terminology-server authentication (`service::terminology::oauth2`): the
# OAuth2 client-credentials grant (RFC 6749 §4.4) to a terminology server's
# token endpoint. HTTP-client agnostic — the request rides the pinned reqwest.
oauth2.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
# OPT 1.4 upload structure validation (`service::template`): a depth-aware scan
# of the template XML that rejects foreign / duplicated top-level elements the
# tolerant opt14 codec would otherwise accept (CNF master04 upload_opt-invalid_opt).
quick-xml.workspace = true
# ADL 1.4 / OPT / stored-query id-pattern matching (SM-2 `list_matching_*`):
# RE2-class regexes for the `I_DEFINITION_*` regex-pattern list calls.
regex.workspace = true
sqlx.workspace = true
thiserror.workspace = true
# One-config-tree loader (`config` module): serialize the effective config to
# redacted TOML for `config check` / `/management/env`. No openEHR spec governs
# configuration — our own design (no openEHR spec governs the config tree).
toml.workspace = true
uuid = { workspace = true, features = ["v7", "fast-rng"] }   # ids are uuidv7 (docs/postgres-features.md pins the DB side)

# `signing` module (RM common §Digital Signature; moved from the former
# ferroehr-signing crate): OpenPGP (rPGP) detached signatures + SHA-256 digest mode.
pgp.workspace = true
sha2.workspace = true
aes-gcm.workspace = true
hmac.workspace = true
base64.workspace = true
# `multimedia` module (DV_MULTIMEDIA externalization to S3-compatible object
# storage — no openEHR spec governs blob storage mechanics; our own design):
# `object_store` is the backend abstraction (SeaweedFS in dev/test via its S3
# gateway, any S3 endpoint in prod); the blob payload plumbing (`bytes`)
# lives in `ferroehr-ext`.
object_store.workspace = true
# `service::admin::dump_load`: the SM COMPRESSION_FORMAT member `zip`
# (docs/specs/openehr/SM/docs/UML/classes/compression_format.adoc) — the dump
# archive packed as one ZIP container instead of loose segment files.
zip.workspace = true
# ... and the `7z` member (owner-approved 2026-07-29).
sevenz-rust2.workspace = true
# NOTE: rPGP 0.20's `DetachedSignature::sign_binary_data` takes an
# `rng: Rng + CryptoRng` from rand 0.8's rand_core 0.6; the workspace `rand`
# pin (0.10) is a trait-incompatible major, so the `signing` module pins the
# rand version pgp itself requires purely to name `OsRng` for that one call.
# Pinned to pgp's rand generation ON PURPOSE, not stale: `versioning::signature`
# hands `rand::rngs::OsRng` to `pgp`'s DetachedSignature signing call, so the
# types must come from the same rand major. `pgp 0.20` requires rand 0.8.7.
rand = "0.8"
# `system_log` module (IHE ATNA audit trail, SM `I_SYSTEM_LOG`; moved from the
# former ferroehr-audit crate): TLS syslog transport.
tokio-rustls.workspace = true
rustls.workspace = true

openehr-base = { path = "../../crates/openehr-base" }
openehr-term = { path = "../../crates/openehr-term" }
openehr-rm = { path = "../../crates/openehr-rm" }
openehr-its = { path = "../../crates/openehr-its" }
openehr-sdt = { path = "../../crates/openehr-sdt" }
openehr-lang = { path = "../../crates/openehr-lang" }
openehr-am = { path = "../../crates/openehr-am" }
openehr-adl = { path = "../../crates/openehr-adl" }
openehr-query = { path = "../../crates/openehr-query" }

[dev-dependencies]
# Every feature the integration modules USE, named here rather than left to
# unification (#3207). The `multimedia` and `events` modules reach
# `ferroehr_ext` directly; `fhir` is named because four modules import
# `ferroehr::system_log::fhir`, a LIBRARY module that feature gates, so the
# integration binary genuinely requires it. There is deliberately NO lane
# building these targets with the library's `fhir` feature off.
ferroehr-ext = { path = "../ferroehr-ext", features = ["multimedia", "events", "fhir"] }
testkit = { path = "../../tools/testkit" }
serde_norway.workspace = true
# Temp config files for the pure-loader (`config` module) tests.
assert_fs.workspace = true
# Hermetic FHIR terminology-server mock for the external-terminology provider
# tests (B4): canned `$validate-code`/`$expand`/`$subsumes`/`$lookup` responses
# + fault injection (timeout, 5xx, malformed) — no network in CI.
wiremock.workspace = true
# The usage report suite validates every payload against FerroPULSE's vendored
# report v1 JSON Schemas (`corpus/ferropulse/`).
jsonschema.workspace = true
testcontainers.workspace = true
# testcontainers-modules `rabbitmq` feature (workspace) drives the end-to-end
# eventing tests against a real broker. `futures` gives the lapin Consumer its
# `StreamExt::next` in those tests.
testcontainers-modules.workspace = true
futures.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
http.workspace = true
http-body-util.workspace = true
insta.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
# The in-memory OTLP exporters for the export-pipeline smoke tests.
opentelemetry_sdk = { workspace = true, features = ["rt-tokio", "testing"] }
# The AQL bench harness (`benches/aql.rs`): criterion drives the measurements,
# pprof renders per-bench flamegraphs under `--profile-time` (pprof's own
# `criterion` feature is pinned to criterion ^0.5, so the bench implements
# criterion's `Profiler` trait over pprof directly — see the bench file).
criterion.workspace = true
pprof.workspace = true
inferno.workspace = true

[[bench]]
name = "aql"
harness = false

[[bench]]
name = "validation"
harness = false

[[bench]]
name = "storage"
harness = false

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = []
