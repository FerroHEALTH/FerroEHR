# ferroehr.toml — the complete FerroEHR server configuration.
#
# No openEHR spec governs configuration — this is our own design. Copy this
# file to ferroehr.toml, then edit. Every key below
# shows its built-in default; delete anything you do not override. Keys marked
# `#?` are optional/derived/secret and are shown commented for reference.
# Lines marked `# PROD:` MUST be reviewed before a production deployment.
#
# Env overrides use `FERROEHR` + the TOML path, `__` between every segment
# (including after the prefix), e.g. `[db] max_connections` ⇔
# FERROEHR__DB__MAX_CONNECTIONS. `--set key=value` wins over env. `DATABASE_URL`
# and `RUST_LOG` are recognized (lower-priority) aliases.

# The openEHR specification generation set this server runs:
#   "development" — RM 1.2.0 + BASE 1.3.0 + LANG 1.1.0 (the default)
#   "stable"      — RM 1.1.0 + BASE 1.2.0 + LANG 1.0.0 (the released generations)
# One coupled choice — the components' generations are modelled against each
# other, so they never vary independently. stable → development is always a
# safe change (openEHR minor releases are additive); development → stable is
# supported only for data that never used development-only constructs. The
# profile is the ACCEPTANCE boundary: ingress and AQL planning refuse
# constructs outside the active generation set, and stored content is never
# silently down-converted — every commit records whether the released
# generations can express its body, and under "stable" a stored version they
# cannot is refused with 409 naming this key rather than served. AQL is not
# covered by that stamp: the planning gate refuses development-only constructs
# in the QUERY, while a generic projection over stored development content
# still returns rows.
spec_profile = "development"

# The declared deployment posture. `sandbox` (the default) must not hold real
# patient data and says which separations are missing on the banner, in the
# log and on GET /management/status; `production` refuses to start while one is
# missing and not named in deployment_accepts (shared_credential,
# shared_cluster, open_subject_namespace, audit_off, audit_fails_open,
# no_category_map, open_ehr_access_default, migrate_on_runtime_credential,
# auth_off, rbac_off, plaintext_listener, plaintext_audit_feed,
# plaintext_object_store; accept plaintext_listener
# behind a TLS-terminating ingress; a [management] port opens it too, since that
# listener is plain HTTP on every interface;
# plaintext_audit_feed on an enabled [audit.fhir_feed] http:// url,
# plaintext_object_store on an enabled [multimedia] with allow_http). Our own
# posture; auth_off and rbac_off follow CRA Annex I Part I(2)(d), the plaintext_* gaps (e).
deployment_profile = "sandbox"   # sandbox | production
#? deployment_accepts = ["shared_cluster"]

# ── [server] — the HTTP listener ─────────────────────────────────────────────
# The FerroHEALTH family's listener section, the same keys in every product.
[server]
# The address and port the listener binds: an IP address, never a host name.
# Every interface by default, the port the container image exposes; PORT alone
# sets 0.0.0.0:<PORT>.
listen = "0.0.0.0:8080"
# The path every route is served under, the health routes included. Empty
# serves them at the process root; the openEHR API path is [rest] base_path.
base_path = ""
request_timeout_ms = 30000     # a request still running then is answered 408
# How long a client may take to send its request head, counted from accept for
# the first request and from the first byte of each later one; a client still
# sending then is disconnected.
header_read_timeout_ms = 30000
# How long a kept-alive connection may wait for its next request before the
# server closes it. Keep it longer than the idle timeout of your clients (90 s
# for a Go client) and of any load balancer in front, so they close first.
idle_timeout_ms = 120000
# The largest request body any route reads, refused 413 above it. The bulk
# routes (template upload, /message/import) take up to this;
# [rest] body_limit_bytes narrows the clinical surface below it. 64 MiB; the
# largest operational template in the vendored CKM corpus is 5.4 MB.
body_limit_bytes = 67108864
drain_delay_ms = 0             # on SIGTERM, readiness is 503 this long before the listener closes
shutdown_timeout_ms = 10000    # then the requests in flight get this long to finish
# The requests served at once; past it a request is answered 503 with
# Retry-After, and the health routes are never refused. Unset, no bound.
#? max_concurrent_requests = 256
retry_after_s = 1              # the Retry-After of a 503 or 429 the listener writes
# The reverse proxies whose forwarded client address is believed (addresses or
# CIDR blocks), and the header they name the client in.
trusted_proxies = []
forwarded_header = "forwarded" # forwarded | x-forwarded-for
compression = true             # gzip or Brotli when the client accepts one
compression_min_bytes = 1024

# [server.caller_rate] — the requests one authenticated caller may send,
# refused 429 + Retry-After past it, keyed on the authenticated subject.
# Distinct from max_concurrent_requests above: that refuses 503 when too many
# requests are in flight AT ONCE (capacity); this refuses one caller asking too
# often OVER TIME (fairness). Unset, no caller is limited.
#? [server.caller_rate]
#? requests_per_second = 1024
#? burst = 2048

# [server.tls] — native TLS + client-certificate (mutual-TLS) authentication
# on the main listener (the IHE ATNA ITI-19 node-authentication posture). Unset
# by default: deployments commonly terminate TLS at an ingress. The
# separate-port management listener stays plain HTTP (internal surface). The
# files are read again on SIGHUP and every reload_interval_s.
#? [server.tls]
#? certificate_file = "/etc/ferroehr/server.pem"
#? key_file = "/etc/ferroehr/server.key"
# client_auth: "none" (the default) asks no client certificate and takes no
# client_ca_file; "optional" verifies a certificate against client_ca_file when
# one is presented and admits a client without one; "required" admits only a
# client presenting a certificate that chains to client_ca_file (IHE mTLS). A
# client_ca_file under "none" is refused at load.
#? client_auth = "required"
#? client_ca_file = "/etc/ferroehr/client-ca.pem"
# TLS 1.3 by default; "1.2" admits 1.2 alongside it, and 1.0 and 1.1 are
# refused at load (RFC 8996).
#? min_version = "1.3"             # 1.3 | 1.2
#? reload_interval_s = 60
# The client chain and key, in one PEM, `ferroehr healthcheck` presents to a
# listener that requires a client certificate.
#? healthcheck_identity_file = "/etc/ferroehr/healthcheck.pem"

# ── [rest] — the openEHR REST surface ────────────────────────────────────────
[rest]
# Shortening is supported (e.g. "/ferroehr/v1" behind a path-prefixed proxy);
# the first segment must be /ferroehr and the last must be v1.
base_path = "/ferroehr/rest/openehr/v1"
swagger_ui = "private"       # off | admin_only | private | public — "public" discloses the whole operation surface anonymously
cors_permissive = false      # PROD: keep false; configure explicit origins
# This CDR's own openEHR system identifier: stamped into EHR.system_id, the
# AUDIT_DETAILS.system_id server default, and every
# OBJECT_VERSION_ID.creating_system_id. It MUST be a legal openEHR `uid` —
# an internet id (a DNS-style host name, the common convention), an ISO OID or
# a UUID — and the server refuses to boot otherwise. PROD: set a stable,
# deployment-unique name. Changing it never rewrites identifiers already
# committed. Distinct from [rest.identity], which is only the OPTIONS
# manifest's display identity.
system_id = "ferroehr.local"
# The largest body the clinical surface accepts, below [server]
# body_limit_bytes, which the bulk routes keep. Unset, every route takes the
# listener's limit. The largest example composition in the vendored corpus is
# 526 KB; raise it if your compositions embed large DV_MULTIMEDIA data.
#? body_limit_bytes = 16777216

# [rest.identity] — the OPTIONS / System-Options manifest. Defaults are the
# measured build/provenance identity; override only to rebrand.
#? [rest.identity]
#? solution = "FerroEHR"
#? solution_version = "<build version>"
#? vendor = "Cadasto B.V."
#? restapi_specs_version = "<tested contract identity>"

# ── [db] — PostgreSQL ────────────────────────────────────────────────────────
[db]
url = "postgres://ferroehr:ferroehr@localhost:5432/ferroehr"  # PROD: real DSN via env/secret
#? url_file = "/run/secrets/db-dsn"   # or point at a mounted file instead of passing the DSN as env
# The credential that PREPARES the schema, used for that one boot step and
# then closed. Preparing spans every schema of a database — the DDL of each
# resident migration set under migrate = "apply", their bookkeeping tables
# under "verify" — so a deployment whose runtime DSNs each hold one domain
# names the credential that can reach them all here. Unset, it falls back to
# the url above, which is what every single-credential deployment runs. It
# prepares every domain whose DSN reaches the same DATABASE it does; a domain
# relocated to another database is prepared on its own DSN.
#? migrate_url = "postgres://ferroehr_migrator:...@localhost:5432/ferroehr"
#? migrate_url_file = "/run/secrets/db-migrate-dsn"
# Whether the server issues DDL at boot. "apply" runs the embedded migrations
# then verifies, which is what makes an empty configuration boot against an
# empty database; "verify" never issues DDL and refuses to serve unless the
# database already carries exactly this build's migrations, so the runtime role
# needs no schema rights.
migrate = "apply"            # apply | verify — PROD: verify
max_connections = 20
min_connections = 2
acquire_timeout_secs = 30
# statement_timeout on every pooled connection — the backstop the HTTP request
# timeout cannot be, because dropping a handler future does not cancel the
# statement PostgreSQL is running. Set ABOVE query.timeout_ms so the engine's
# typed refusal fires first and this only catches what the engine does not
# govern. 0 leaves the server default (usually unlimited).
statement_timeout_ms = 60000

# ── [storage] — one DSN per storage domain ───────────────────────────────────
# Each domain always lives in its own schema (clinical, party, audit)
# and every pool carries only its own on its search_path. Set a url here to give
# a domain its own database ROLE as well — and, if the DSN names another host, a
# database or cluster of its own: a schema separates a domain inside one
# database, but a base backup, WAL archiving and physical replication carry every
# schema of that database together. Unset, the domain connects on [db] url, which
# is what the compose quickstart and every single-credential deployment run.
#
# The server refuses to boot when a runtime role can read across a boundary, when
# two separately-configured domains turn out to authenticate as one role, and —
# under deployment_profile = "production" — when a domain role is missing.
#
# Schema preparation runs per DATABASE: [db] migrate_url prepares the one it
# reaches, and a domain in a database of its own is prepared on that database's
# migration credential, [storage.migrate.<domain>] url, for both migrate =
# "apply" and "verify". Unset, it falls back to the domain's own url, which a
# DML-only runtime role cannot use.
#? [storage.clinical]
#? url = "postgres://ferroehr_clinical:...@localhost:5432/ferroehr"
#? url_file = "/run/secrets/db-clinical-dsn"
#? [storage.party]
#? url = "postgres://ferroehr_party:...@localhost:5432/ferroehr"
#? url_file = "/run/secrets/db-party-dsn"
#? [storage.audit]
#? url = "postgres://ferroehr_audit:...@localhost:5432/ferroehr_audit"
#? url_file = "/run/secrets/db-audit-dsn"
#? [storage.migrate.clinical]
#? url = "postgres://ferroehr_migrator:...@clinical-db:5432/ferroehr"
#? url_file = "/run/secrets/db-clinical-migrate-dsn"
#? [storage.migrate.party]
#? url = "postgres://ferroehr_migrator:...@party-db:5432/ferroehr"
#? url_file = "/run/secrets/db-party-migrate-dsn"
#? [storage.migrate.audit]
#? url = "postgres://ferroehr_migrator:...@audit-db:5432/ferroehr_audit"
#? url_file = "/run/secrets/db-audit-migrate-dsn"

# ── [telemetry] — console, request log, OpenTelemetry export ──────────────────
# The FerroHEALTH family's shared section (the ferrohealth-telemetry crate).
# With no [telemetry.otlp] table nothing is exported.
[telemetry]
format = "auto"              # auto | json | pretty ; PROD: json
filter = "info,hyper=warn,tower=warn,h2=warn"
logged_query_parameters = [] # query parameters whose values the request log may carry
#? environment = "production" # deployment.environment.name on every span and metric
#? [telemetry.otlp]
#? endpoint = "http://collector:4317"
#? traces = true
#? metrics = true
#? sample_ratio = 1.0          # PROD: 0.1 is a common starting point
#? trust_roots_file = "/etc/ferroehr/otlp-ca.pem"
#? client_identity_file = "/etc/ferroehr/otlp-client.pem"

# ── [auth] — authentication (PROD: configure a mechanism) ─────────────────────
# The FerroHEALTH family's shared section (the ferrohealth-smart crate): the
# server checks bearer tokens against the trusted issuers' key sets and Basic
# credentials against [[auth.basic.users]]. It never issues a token.
[auth]
enabled = true               # false = all requests pass unauthenticated (dev only)

# With enabled = true at least ONE mechanism MUST be configured, an issuer or a
# Basic user: a server with none could only refuse every request while
# advertising a scheme it does not implement (RFC 9110 §11.6.1), so it refuses
# to start instead.

realm = ""                   # the challenge realm; empty = "ferroehr"
capabilities = []            # SMART capabilities the discovery document adds
scopes_supported = []        # the scopes the discovery document lists; empty = the ones the route table honours
# product_scope: FerroEHR's own scope, which admits the ADMIN API and, beside
# the clients in [smart] demographic_clients, the DEMOGRAPHIC API — the two
# surfaces no SMART on openEHR resource family covers. A full URI or a string
# starting with `__` (SMART App Launch 2.2.0, Scopes and Launch Context,
# §Extensibility). Empty = "__ferroehr.platform".
product_scope = ""
# The `{ issuer, sub }` subjects whose token, when it carries no resource scope
# of either grammar, meets every SMART on openEHR requirement; only a system
# (app-only) caller of that issuer is admitted by an entry.
scopeless_subjects = []      # e.g. [{ issuer = "https://idp.example/realms/staff", sub = "etl-loader" }]
# A PEM bundle of certificate authorities trusted in addition to the platform
# roots, for an issuer behind a private PKI: its metadata and key set, and
# under mode = "introspection" the introspection and token calls too.
#? ca_file = "/run/secrets/issuer-ca.pem"

# The trusted issuers, one [[auth.issuer]] table each (the flat `issuer = "…"`
# form is refused). Every setting of an issuer lives on its own table. `kind`
# is REQUIRED and says whose tokens it signs: "persons" (professionals and the
# deployment's own people), "patients", "machines" (client credentials only)
# or "federation" (another party's issuer). One issuer is one kind, so patients
# and professionals sign in at separate issuers, a realm or tenant each.
# `profile` is the preset of what its tokens look like ("rfc9068", "entra",
# "keycloak", "okta" or "nl"); every profile key may be set on the table over
# it: person_key, tenant_claim, client_claims, app_only, guest,
# impersonation_marker, expect, user_claims, person_equality,
# unstable_claims, first_party_clients, delegates, max_actor_chain,
# representation, token_types, required_claims, scope_claim,
# app_only_scope_claim, adapter and the onward_* keys. A persons token is
# admitted only through a client listed in `first_party_clients` or
# `delegates`. Boot refuses a persons issuer with no [[auth.party]] table, and
# two issuers of this node sharing an audience.
#? [[auth.issuer]]
#? issuer = "https://idp.example/realms/staff"   # https, no query or fragment (RFC 8414 §2)
#? kind = "persons"                # persons | patients | machines | federation
#? profile = "keycloak"            # rfc9068 | entra | keycloak | okta | nl
#? audience = ["ferroehr"]         # REQUIRED, at least one (RFC 9068 §4)
#? first_party_clients = ["ferroehr-viewer"]
#? token_types = ["at+jwt", "application/at+jwt"]   # the accepted `typ` (RFC 9068 §4)
#? required_claims = ["iss", "exp", "aud", "sub", "client_id", "iat", "jti"]
#? algorithms = ["RS256", "RS384", "PS256", "PS384", "ES256", "ES384"]   # asymmetric only (RFC 8725 §3.1)
#? clock_skew_seconds = 60         # at most 300 (RFC 9068 §4)
#? jwks_max_age_seconds = 600      # a key set older than this is read again
#? jwks_refresh_interval_seconds = 60   # at most one read per interval on an unknown `kid`
#? jwks_file = ""                  # a JWK Set of PUBLIC keys handed over out of band
#? timeout_ms = 10000              # one call to the authorization server
#? mode = "jwt"                    # jwt | introspection (RFC 7662)
#? role_claims = ["roles", "groups", "entitlements"]   # RFC 9068 §2.2.3.1
#? sender_constraint = "none"      # none | required: DPoP (RFC 9449) or mTLS (RFC 8705) bound tokens only
# Under mode = "introspection": the endpoint (empty = the metadata's), and the
# client of `client` or the client credentials token of `bearer`.
#? [auth.issuer.introspection]
#? endpoint = "https://idp.example/realms/staff/introspect"
#? [auth.issuer.introspection.client]
#? client_id = "ferroehr-rs"
#? client_secret_file = "/run/secrets/introspection-client"

# The party a persons issuer's logins are bound to: one [[auth.party]] table
# per persons issuer, keyed by the issuer. Its profile's person_key is the
# binding key, matched against the identifiers of `identifier_issuer`.
#? [[auth.party]]
#? issuer = "https://idp.example/realms/staff"
#? identifier_issuer = "urn:example:staff-login"
#? identifier_type = "guid"        # guid and uuid compare in lower case
#? group_claim = "groups"          # set with group_identifier_issuer, or neither
#? group_identifier_issuer = "urn:example:staff-groups"
#? guests = false                  # whether a guest of the issuer is looked up

# What a federation issuer asserts about another party: one [[auth.federation]]
# table per federation issuer (the ferrohealth-smart federation section).
# `fields` maps a field to where the token carries it: `consent.reference`, the
# consent decision reference a consent-conditioned read needs, and
# `correlation_id`, the requester's id a "chained" organisation request needs,
# read from a claim or an attested authorization_details member, never a header.
#? [[auth.federation]]
#? issuer = "https://federation.example"
#? mapping = "iua"
#? fields = { "consent.reference" = [{ claim = "consent_ref" }], "correlation_id" = [{ authorization_details = "correlation_id" }] }

# The DPoP proof check (RFC 9449) of a sender-constrained issuer. Each accepted
# proof is recorded in the database every replica shares, so a proof is
# accepted once across all of them (RFC 9449 §11.1).
#? [auth.dpop]
#? external_url = "https://ehr.example"   # REQUIRED: the base URL clients address
#? max_age_seconds = 60
#? clock_skew_seconds = 10

# The Microsoft Graph access of the idp-entra adapter, which an issuer turns on
# with `adapter = "idp-entra"` to read the groups of an Entra ID groups overage;
# an issuer naming the adapter without this table refuses the start.
#? [auth.idp.entra]
#? base_url = "https://graph.microsoft.com/v1.0"
#? timeout_ms = 2000
#? [auth.idp.entra.credentials]
#? issuer = "https://login.microsoftonline.com/{tenant}/v2.0"
#? client_id = "ferroehr-graph-reader"
#? client_secret_file = "/run/secrets/graph-client-secret"
#? scope = "https://graph.microsoft.com/.default"

# Basic-auth users (file-only; array of tables). Every password_hash must be an
# argon2id PHC string meeting the OWASP Password Storage Cheat Sheet §Argon2id
# floor — m>=19456, t>=2, p>=1 — checked at boot, because the verifier takes its
# cost parameters from the stored hash. `scopes` are the SMART on openEHR
# scopes the user holds, checked on every route like a token's; `roles` are its
# RBAC roles (none = no role, refused wherever the role gate asks for one).
#? [[auth.basic.users]]
#? user = "alice"
#? password_hash = "$argon2id$v=19$m=19456,t=2,p=1$...$..."   # never a plaintext password
#? password_hash_file = "/run/secrets/alice-hash"   # or a mounted file; the Argon2id floor applies either way
#? scopes = ["user/composition-*.cruds", "user/template-*.cruds", "user/aql-*.cruds"]
#? roles = ["ADMIN", "USER"]
# How long a Basic credential that verified is kept, so a repeat request skips
# the Argon2id derivation, which costs 10 to 15 ms of CPU per check. Default
# 300; 0 turns the cache off and checks every request. The entry is a keyed
# hash of the credential, never the password, and only a credential that
# verified is kept; the TTL bounds how long a removed user keeps working.
#? [auth.basic]
#? cache_ttl_seconds = 300

# ── [authz] — RBAC + ABAC ─────────────────────────────────────────────────────
[authz]
# Authentication assurance on patient data (off by default: nothing refused, no
# level recorded). `levels` maps each value the issuer puts in `claim` to an
# eIDAS level of assurance (low | substantial | high). With `minimum` set, a
# patient-data request whose token maps below it, or not at all, is refused
# with 401 and an RFC 9470 step-up challenge naming the accepted values; a
# Basic credential carries no level and is refused too. Boot refuses a
# `minimum` no mapped value reaches. Cross-border exchange asks for
# substantial, high from 26 March 2032 (Implementing Regulation 2026/2099
# Art. 6(3)).
[authz.assurance]
claim = "acr"                 # dotted path into a JSON object allowed
#? minimum = "substantial"    # low | substantial | high; unset = refuse nothing
#? levels = { "http://eidas.europa.eu/LoA/substantial" = "substantial", "http://eidas.europa.eu/LoA/high" = "high" }

# The party binding (no switch: binding is how a person is attributed).
# `provider` is REQUIRED once [auth] admits a credential: the healthcare
# provider this deployment acts for, which every access record of a bound
# person and every version a person commits name (EHDS Art. 13(4), Annex II
# 3.2(a)). A deployment serving several providers declares one
# [[authz.party_binding.provider]] table per value of the issuers'
# tenant_claim instead; boot refuses both forms together.
[authz.party_binding]
# The PARTY_REF.namespace a bound party is written under, held to the
# OBJECT_REF.namespace pattern (BASE base_types).
namespace = "demographic"
#? provider = { issuer = "urn:oid:2.16.528.1.1007.3.3", id = "00000000" }   # issuer and id (in NL the URA)
# The per-tenant form, in place of the line above:
#   provider = [{ tenant = "<tenant_claim value>", issuer = "urn:oid:2.16.528.1.1007.3.3", id = "00000000" }]
# Every Basic user is a person and maps to the PERSON carrying its binding
# key: `key_issuer` is the identifier_issuer of an [[auth.party]] table. Boot
# refuses a Basic user with no mapping, and a mapping naming no Basic user.
#? [[authz.party_binding.basic_user]]
#? user = "alice"
#? key_issuer = "urn:example:staff-login"
#? key = "3f2b0c1e-0000-4000-8000-000000000001"

# The one PERSON mapping SCIM, just-in-time creation and the binding share.
# Each person template names the paths and DV_IDENTIFIER types of the binding
# key, userName and externalId (one path, told apart by type); exactly one is
# the default new persons are created with. Names go in identities and
# identifiers in details. After a change, stop every replica and run
# `ferroehr party-binding refill`: a replica whose mapping differs from the
# one the side table was filled under refuses to start.
#? [[authz.party_binding.person.template]]
#? template_id = "FerroEHR professional"
#? default = true
#? key = { path = "/details[at0001]/items[openEHR-DEMOGRAPHIC-CLUSTER.person_identifier.v2]/items[at0001]", type = "guid" }
#? user_name = { path = "/details[at0001]/items[openEHR-DEMOGRAPHIC-CLUSTER.person_identifier.v2]/items[at0001]", type = "scim_user_name" }
#? external_id = { path = "/details[at0001]/items[openEHR-DEMOGRAPHIC-CLUSTER.person_identifier.v2]/items[at0001]", type = "scim_external_id" }
# Each mapped value: its SCIM attribute, its OpenID Connect claim, whether
# just-in-time creation writes it, whether it is the committer's name, and its
# path per template.
#? [[authz.party_binding.person.attribute]]
#? scim = "name.formatted"
#? oidc = "name"
#? jit = true
#? name = true
#? path = { "FerroEHR professional" = "/identities[openEHR-DEMOGRAPHIC-PARTY_IDENTITY.person_name.v1]/details[at0001]/items[at0002]" }
#? [authz.party_binding.professional_role]
#? template_id = "FerroEHR professional role"
#? [authz.party_binding.group]
#? template_id = "FerroEHR care team"
#? external_id = { path = "/details[at0001]/items[at0001]", type = "scim_external_id" }
#? display_name = "/identities[at0002]/details[at0003]/items[at0004]"
#? [authz.party_binding.membership]
#? archetype_id = "openEHR-DEMOGRAPHIC-PARTY_RELATIONSHIP.membership.v1"
#? [authz.party_binding.representation]
#? archetype_id = "openEHR-DEMOGRAPHIC-PARTY_RELATIONSHIP.representation.v1"
#? relationship_codes = { at0010 = "254", at0011 = "264" }

# The creating_system_id values whose wrapped committers may name a local
# party on import; never this node's own [rest] system_id.
[authz.import]
trusted_systems = []

# Each OAuth client-credentials client that commits, keyed by issuer and
# client_id: the provider it acts for, the facilities it may commit for
# (issuer with id or id_prefix), the template ids it may write (none by
# default), and its origins: "relay" (another system's record of a human act)
# and "device" (a device registers, no human acting; needs
# device_identifier_issuers). A Basic user is never a system client.
#? [[authz.system_client]]
#? issuer = "https://idp.example/realms/machines"
#? client_id = "ferrobridge"
#? provider = { issuer = "urn:oid:2.16.528.1.1007.3.3", id = "00000000" }
#? facilities = [{ issuer = "urn:example:facility", id_prefix = "ward-" }]
#? writes = ["Vital signs.v1"]
#? origins = ["relay"]               # relay | device
#? device_identifier_issuers = []

# The federation agreements, keyed by a federation issuer and its `accessor`
# ("person" or "organisation"); an agreement admits only its own accessor kind.
# `caller_rate` is required. An organisation agreement runs without a named
# person: it needs name, version, legal_ground and access_class, takes no
# writes, no opt_out_override and no consent from mitz, and is logged at warn
# on every boot. A "chained" access class needs chained_log_retention_years at
# least [audit.store]'s and its issuer's [[auth.federation]] table mapping
# correlation_id from the token; a chained request without the id is refused.
# A caller above caller_rate is answered 429 before any patient lookup. An NL
# agreement (a profile = "nl" issuer implies NL) with reads needs a
# consent source, and every NL agreement needs purpose = "care": one for a
# keuring refuses the start (Wabvpz Art. 15f(2)). Under an NL agreement a
# caller whose nl.role is 01.008 or 01.048, or whose nl.organisation_type is
# no care provider type of OrganisatieTypeCodelijst, is refused with 403.
# Every reads entry is a patient/ scope.
#? [[authz.federation.agreement]]
#? issuer = "https://federation.example"
#? accessor = "organisation"        # person | organisation
#? name = "BgZ exchange"
#? version = "1.0"
#? jurisdiction = "NL"
#? exchange = "bgz"
#? purpose = "care"                 # care | keuring (refused under NL)
#? legal_ground = { gdpr_6_1 = "e", gdpr_9_2 = "h", national = "UAVG Art. 30(3)(a)" }
#? consent = "local"                # mitz | local: a condition, never the legal ground
#? reads = ["patient/composition-*.r"]
#? writes = []
#? discard = false
#? discard_window_hours = 24
#? ehdsi_service = "eprescription"  # patient_summary | eprescription | orcd: a contact point's person agreement only
#? caller_rate = { requests_per_second = 5, burst = 10 }
#? opt_out_override = false
#? access_class = "chained"          # automated | chained
#? chained_log_retention_years = 5

[authz.rbac]
# The coarse role gate. Off, every authenticated caller may use every enabled
# surface (the rbac_off deployment gap); ehr_access_default and admin_role
# still apply to the per-EHR gate.
enabled = true
admin_role = "ADMIN"
readonly_role = "READONLY"   # carriers are refused on every write operation
# The role that reads the access log for ONE subject at a time (GET
# /fhir/r4/AuditEvent with `patient` required): what a patient portal holds to
# show a person who accessed their record, instead of an admin credential over
# every patient's log. Unset, the log is admin-only.
#? subject_audit_role = "PORTAL"
# The role that reads data under an EHDS Art. 8 access restriction when the
# caller also declares one of [audit] emergency_purpose_codes (Art. 11(5)).
# Unset, nobody may override a restriction.
#? emergency_access_role = "EMERGENCY"
# The roles of the EHDS Art. 10 access-service callers: the Art. 4 access
# service of persons and the Art. 12 health professional access service. A
# caller holding one reads an EHR whose person opted out (POST
# /admin/access-opt-out) as absent, unless it declares one of [audit]
# emergency_purpose_codes for a vital interest (Art. 10(2)). Empty, the
# default, holds nobody to an opt-out, and recording one is refused.
access_service_roles = []
# The role that may read a party's protected national identifiers through
# GET /admin/party/identifiers, beside admin_role. Every read is an access
# record naming the reader, the party and the scheme. Unset, nobody may.
#? identifier_reader_role = "IDENTIFIER_READER"
# The role that may import an EHR or an EHR extract (message_import_ehr,
# message_import_ehr_extract); role_issuers governs it like admin_role.
#? import_role = "IMPORTER"
# The persons issuers whose role claims may grant admin_role,
# emergency_access_role, import_role and identifier_reader_role; a token of
# any other issuer never holds them. Boot refuses an issuer that is not of
# kind persons. Empty, the default, lets no token grant them.
role_issuers = []
# What an EHR carrying no ACCESS_CONTROL_SETTINGS admits. A new EHR carries
# none, so this governs most records. "restricted" is object-level default-deny:
# only admin_role reaches a setting-less EHR, so an operator can still author
# the settings that open it. It applies with enabled = false too, and is refused
# at boot with [auth] enabled = false, where nothing could enforce it.
ehr_access_default = "open"   # open | restricted
# The management surface is NOT configured here — see [management.endpoints],
# which owns it, one level per endpoint.

[authz.abac]
enabled = false
engine = "cedar"             # cedar | remote
organization_claim = "organization_id"
patient_claim = "patient_id"
#? patient_namespace = "nl.example.patients"  # the subject namespace patient-claim ids
                             # are issued in; unset, an id held under two
                             # namespaces matches no EHR
check_directory = false      # submit DIRECTORY (FOLDER) operations to the PDP;
                             # engine-independent, so it works under cedar too

[authz.abac.cedar]
#? policy_dir = "/etc/ferroehr/policies"   # required when engine = cedar and abac enabled
#? reload_secs = 30

[authz.abac.remote]
#? server = "http://pdp:3001/exec/"       # required when engine = remote; must end '/'
connect_timeout_ms = 2000
request_timeout_ms = 5000

# Per-resource-kind policy bindings (kind ∈ ehr, ehr_status, composition,
# contribution, query, directory):
#? [authz.abac.policy.composition]
#? name = "composition-access"
#? parameters = ["organization", "patient", "template"]

# ── [admin] — the ADMIN API group (physical delete) ──────────────────────────
[admin]
enabled = false

# ── [smart] — SMART on openEHR ────────────────────────────────────────────────
# The SMART on openEHR scopes are enforced on every route whenever [auth] is on
# (master08 §Resource Scopes); this section decides what beside the route
# table: the discovery document, and whose grants count for what.
[smart]
# Serve /.well-known/smart-configuration, built from one [auth] issuer's
# metadata: the issuer issuer_metadata_file names, else the first whose
# metadata is read from it, else the first. A jwks_file issuer carries none,
# so it serves the document only with issuer_metadata_file set.
enabled = false
# The RFC 8414 §2 authorization-server metadata of the [auth] issuer it names,
# whose key set is a jwks_file: a JSON document naming that issuer and at
# least its token_endpoint, read at boot.
#? issuer_metadata_file = "/etc/ferroehr/issuer-metadata.json"
#? platform_base_url = "/gateway/v1"
#? public_base_url = "https://cdr.example.com"   # REQUIRED when enabled: the external origin the absolute services.*.baseUrl values are built from (master04 §Services)
launch_base64_json = false
# The client_ids a system/aql-* grant counts for: it "would grant access to all
# registered and ad-hoc AQL queries system-wide" (master08 §Resource Scopes).
backend_clients = []
# The issuers whose patient/ grants count, each confined to the EHR the
# token's `ehrId` claim names (master07 §Context Selection). Empty = a
# patient/ grant grants nothing.
patient_issuers = []
# The client_ids that reach the DEMOGRAPHIC API, which no SMART scope covers;
# a caller holding [auth] product_scope reaches it too.
demographic_clients = []

[smart.episode]
enabled = false

# ── [management] — ops-introspection surface ───────────────────────────────────
# Introspection (info / prometheus / metrics / env / loggers / flamegraph /
# health / status), off by default. The probes are NOT here: /health,
# /health/liveness and /health/readiness are always mounted and public, whatever
# this section says, and say only whether the server is ready; the detail behind
# that answer is `health`, the licence, posture and support period `status`.
[management]
enabled = false
base_path = "/management"
#? port = 9100                # separate listener on every interface, plain HTTP; production: plaintext_listener
# Span-timing flamegraph capture (tracing-flame): write folded stack samples
# to this file for offline rendering (inferno-flamegraph < file > flame.svg).
# Unset, the layer is not installed. Diagnostic sessions only.
#? flame_file = "/var/log/ferroehr/tracing.folded"

# The single authority for this surface: one level per endpoint, and an
# endpoint left "off" is not mounted at all (404). Levels: off | private |
# admin_only | public. `public` is served OUTSIDE authentication.
[management.endpoints]
info = "off"
metrics = "off"               # one name, two routes: /management/metrics + /management/metrics/{name}
prometheus = "off"
env = "off"
loggers = "off"
flamegraph = "off"            # on-demand CPU flamegraph (pprof sampling)
health = "off"                # every readiness indicator with its detail
status = "off"                # status document with licence, deployment gaps, support period

# Limits for the on-demand CPU profiler (endpoints.flamegraph). A request
# asking beyond a cap is refused with 400, never silently clamped.
[management.profiling]
max_seconds = 30              # longest sample window one request may take
max_frequency = 999           # highest sampling frequency (Hz) a request may ask

# ── [signing] — VERSION signing (RM common master06 §Digital Signature) ───────
[signing]
enabled = true
mode = "digest"              # digest | pgp
#? key_path = "/etc/ferroehr/signing.asc"   # required for mode = pgp
#? key_passphrase = "..."
#? key_passphrase_file = "/run/secrets/pgp-pass"
# PUBLIC keys retired from signing and kept for verification, so versions signed
# before a key rotation keep verifying. A stored signature carries no key id and
# is an immutable committed fact, so retaining the old key is the only way
# history stays verifiable. Public keys: a retired key can never sign again.
retired_key_paths = []       # e.g. ["/etc/ferroehr/signing-2025.pub.asc"]
# Read-time verification of OUR OWN signatures. UNSET (the default) resolves to
# `strict` when signing is enabled — a served version whose stored signature no
# longer recomputes is a 5xx integrity fault. Set explicitly to opt out:
# `warn` (log + meter, still serve) or `off` (never check). Client-supplied
# signatures are always stored verbatim and never re-verified.
#? verify_on_read = "strict" # off | warn | strict (unset ⇒ strict when enabled)

# ── [licence] — the commercial licence token ──────────────────────────────────
# FerroEHR is BUSL-1.1: production use in the course of a business needs a
# commercial licence. The server runs identically with or without the token;
# its state is logged once at boot and reported on GET /management/status.
[licence]
#? file = "/etc/ferroehr/licence.asc"

# ── [query] — AQL execution knobs ─────────────────────────────────────────────
[query]
plan_cache_capacity = 256    # 0 disables the plan cache
# The per-query execution budget, ON by default. It used to be off, which left
# the HTTP request timeout as the only guard — and that answers the CLIENT
# without cancelling the statement, so overrunning queries kept holding pooled
# connections after their callers had been given up on. Kept TIGHTER than
# db.statement_timeout_ms so an overrun surfaces as this engine's typed 408
# rather than a driver error.
timeout_ms = 30000           # 0 disables the per-query budget (408 on overrun)
# The result-row ceiling for a query that neither the AQL nor the request bounds.
# Without it, `SELECT c FROM COMPOSITION c` with no `fetch` generates SQL with no
# LIMIT and materialises every matching row — one request, unbounded allocation.
# ITS-REST leaves the `fetch` default to the implementation, so a ceiling is
# spec-permitted. An explicit AQL LIMIT or a `fetch` parameter is honoured as
# written; this only bounds the case where nothing else does.
max_result_rows = 10000      # 0 = unbounded

# ── [outbox] — the commit-event outbox and its cursor feed ───────────────────
# Each reader pulls the PHI-free commit events over GET /admin/outbox/{reader}
# (scope __ferroehr.outbox) and acknowledges them; FerroBRIDGE delivers them on
# to a message broker. With no reader no commit writes an outbox row. Boot
# registers every reader named here and marks every other one inactive, so a
# removed reader no longer holds the prune back. Our own extension.
[outbox]
readers = []                 # e.g. ["ferrobridge"]; names match ^[a-z][a-z0-9-]{0,62}$
retention_days = 7           # an acknowledged row is kept this long after its commit
prune_interval_secs = 3600

# ── [terminology] — terminology API + the terminology server ──────────────────
[terminology]
api_enabled = false

# The one FHIR R4B terminology server (FerroTERM, or any server speaking the
# FHIR terminology operations). The openEHR terminology is in-process and needs
# none of this.
[terminology.server]
enabled = false              # on: composition ac-code binding resolution, ADL 2
                             # VETDF, AQL TERMINOLOGY() and the /terminology/*
                             # calls the bundled openEHR terminology cannot answer
#? url = "http://ferroterm:8080/r4b"
fail_on_error = false        # unresolvable binding: false = accept the
                             # composition (fail-open), true = reject it (422)
request_timeout_ms = 10000

# OAuth2 client-credentials grant, only when the server sits behind an
# authorization server (the same keys as [audit.fhir_feed.oauth]):
#? [terminology.server.oauth]
#? token_endpoint = "https://idp.example.org/realms/ts/protocol/openid-connect/token"
#? client_id = "ferroehr-cdr"
#? client_secret = "..."
#? client_secret_file = "/run/secrets/ts-client"   # instead of client_secret, a mounted file
#? scope = "system/*.read"
#? client_auth = "client_secret_basic"   # client_secret_basic | client_secret_post | private_key_jwt | tls_client_auth | self_signed_tls_client_auth

# ── [multimedia] — DV_MULTIMEDIA externalization to S3-compatible storage ─────
[multimedia]
enabled = false
threshold_bytes = 262144
#? endpoint = "http://127.0.0.1:8333"   # unset ⇒ AWS default resolution
bucket = "openehr-multimedia"
region = "us-east-1"
#? access_key_id = "..."
#? secret_access_key = "..."
#? secret_access_key_file = "/run/secrets/s3"
allow_http = false           # PROD: false (HTTPS S3)

# ── [audit] — IHE ATNA audit trail / System Log ──────────────────────────────
# ON by default with only the local store active: every deployment gets a
# queryable audit trail (the audit schema; served via the ITI-81 FHIR
# AuditEvent search) with nothing leaving the node. Forwarding to an external
# Audit Record Repository is opt-in per sink.
[audit]
enabled = true
#? enterprise_site_id = "site-42"
source_id = "ferroehr"
value_if_missing = "UNKNOWN"
suppress_login_events = true
fail_mode = "open"           # open | closed (closed: un-auditable ops answer 503)
resolve_subject = true
queue_capacity = 8192
#? server_host = "cdr-01.example"
# Access logging (NEN 7513, EHDS Art. 9): the header a caller declares its
# purpose of use in, the codes this deployment accepts (empty = record whatever
# is declared), and the legal basis recorded on every access.
purpose_header = "x-purpose-of-use"
# The header a secondary-use caller declares the data permit it acts under in
# (EHDS Art. 68), recorded on every access as its identifier.
permit_header = "x-data-permit"
purpose_codes = []
# The purpose codes that mark an access as an emergency access in the vital
# interest of the patient (EHDS Art. 11(5)); each must also be on
# purpose_codes. Empty = nothing is marked. The mark is logged and shown to the
# patient through the access log; it lifts no restriction.
emergency_purpose_codes = []   # e.g. ["ETREAT"]
#? legal_basis = "gdpr-art-9-2-h"

# The local Audit Record Repository (the durability anchor).
[audit.store]
enabled = true
retention_days = 0           # 0 = keep forever; reaped hourly otherwise
                             # Floors and ceilings are jurisdictional, written
                             # in calendar years: three years in every EU
                             # Member State (EHDS Art. 9(2)), five years NL,
                             # one year CH, at most three years DE under
                             # sgb_v_309_controller. Boot refuses a horizon
                             # outside them. A day count is held to the most
                             # (floor) or fewest (ceiling) days the years can
                             # span, e.g. 1096 for the EU floor.
# The horizon in calendar years instead, compared exactly against those bounds
# and reaped with calendar arithmetic. Set it OR retention_days, never both. A
# declared SGB V § 309 controller in Germany sets 3: no day count meets both the
# three-year EHDS floor and the three-year § 309 ceiling.
#? retention_years = 3
# Set this only if the deploying organisation is, or acts for, one of the
# controllers SGB V § 307 names for a German telematics-infrastructure
# application. It caps retention_days at the three-year period of § 309 Abs. 1,
# after which Abs. 3 requires deletion unverzüglich — so a declared controller
# cannot keep records forever.
sgb_v_309_controller = false
# Seconds between two scheduled verifications of the hash chain (one hour by
# default; 0 = off). Each run verifies the records written since the last
# intact link. A finding is logged at ERROR, counted in
# atna_audit_chain_findings and reported by the audit_chain readiness indicator.
verify_interval_seconds = 3600
# Seconds between two scheduled full passes over the hash chain (one week by
# default; 0 = only on demand, SELECT * FROM audit.verify_audit_chain()). A run
# that found damage is always followed by a full pass.
full_verify_interval_seconds = 604800

# The EHDS priority category of every access (Annex II 3.2(c)), classified by
# ehds-logging (FerroAUDIT): which categories each template, and failing that
# each root archetype, holds. A priority category is its code in HL7 Europe's
# EEHRxFDocumentPriorityCategoryCS: Patient-Summaries |
# Electronic-Prescriptions | Electronic-Dispensations | Medical-Imaging |
# Laboratory-Reports | Discharge-Reports, or <system>|<code>; a national
# category is declared under national as <system>|<code> and named the same
# way; a key whose data hold no category maps to the word "none". EMPTY by
# default, and while no template and no archetype is declared the map FerroEHR
# ships applies (app/ferroehr/assets/audit-categories.default.toml: the
# published CKM templates and COMPOSITION archetypes of one priority category);
# declaring any key replaces it whole. shipped_map = false with nothing declared
# leaves no map, which production refuses as the no_category_map gap. An access
# the map in force cannot classify is recorded "unclassified" with its ids,
# never refused. Keys compare
# case-insensitively; an unknown code or an empty list refuses boot. The map's
# digest is on the boot line, on /management/info and on every access record,
# and the map is mirrored into the retention register, so a retention period
# can be keyed on a category.
[audit.categories]
shipped_map = true
national = []                # e.g. ["urn:oid:2.16.840.1.113883.2.4.3.11.60.1|beeld"]
[audit.categories.templates]
#? "International Patient Summary" = ["Patient-Summaries"]
#? "Laboratory Report" = ["Laboratory-Reports"]
[audit.categories.archetypes]
#? "openEHR-EHR-COMPOSITION.report-result.v1" = ["Laboratory-Reports"]
#? "openEHR-EHR-COMPOSITION.encounter.v1" = "none"

# Classic ATNA feed: DICOM PS3.15 audit XML as RFC 5424 syslog over RFC 5425
# TLS (IHE ITI-20), sent through ihe-atna (FerroAUDIT).
[audit.syslog]
enabled = false
host = "localhost"
port = 6514
#? tls_ca_file = "/etc/ferroehr/arr-ca.pem"
#? tls_identity_cert_file = "/etc/ferroehr/client.pem"
#? tls_identity_key_file = "/etc/ferroehr/client.key"
# Every frame is stored in ihe-atna's spool and delivered from it, retried with
# backoff until the repository takes it. The local store keeps no syslog
# frame, so the spool is syslog's outbox: set spool_dir (owner-only) for one
# that survives a restart; unset, it is held in memory.
#? spool_dir = "/var/lib/ferroehr/atna-spool"
spool_max_messages = 100000
spool_max_bytes = 268435456
retry_max_ms = 60000         # the longest wait between two attempts

# RESTful ATNA feed: FHIR R4 AuditEvent POSTs (IHE ITI-20 ATX:FHIR Feed).
[audit.fhir_feed]
enabled = false
url = "http://localhost:8080/fhir"   # POSTs {url}/AuditEvent; URL creds redacted
poll_interval_ms = 2000      # how long the forwarder waits for a new record before reading the store again
retry_max_ms = 60000         # the longest wait between two attempts

# ── [origins] — the origins of data this deployment recognises ───────────────
# EHDS Annex II 3.4: retention periods and access rights that take the origin
# of the data into account. Every version records its origins at commit: each
# FEEDER_AUDIT originating_system_audit system_id the body carries, or, for a
# body with none, the registered origin of the committing client (a Basic user,
# or an access token's client_id, failing that its azp), or this server's
# system_id for any other caller. A retention period
# (PUT /admin/retention/policy, `origin`) and an ABAC rule (the `origin`
# resource attribute) name only a registered id. EMPTY by default. An id or a
# client registered twice, a blank one, or a client in two origins refuses boot.
[origins]
#? [[origins.registered]]
#? id = "lab.example"           # the system_id the origin's data carry, compared exactly
#? clients = ["lab-gateway"]    # whose direct commits come from this origin

# ── [privacy] — the clinical-side data-minimisation policy ────────────────────
# GDPR Art. 4(5) + Art. 25(2); the openEHR RM leaves the subject reference open
# and only advises against identifying party proxies, so these are FerroEHR
# rules over spec-conformant content.
[privacy]
# The pseudonymisation domains this deployment issues subject pseudonyms in.
# EMPTY (the default) leaves the subject-reference rule out of force: a
# namespace name is a deployment fact, not something a server can invent.
# Declaring one turns the rule on under either EHR index, with no mixed mode:
# from then on EHR_STATUS.subject.external_ref must name a listed namespace and
# carry a UUID as its id.value.
subject_namespaces = []
# Accept PARTY_IDENTIFIED / PARTY_RELATED carrying `name` or `identifiers` in
# clinical content (composer, participations, health_care_facility, feeder
# audit). Off by default, and announced at boot when on. OFF still accepts a
# PARTY_IDENTIFIED `name` — the RM class is the proxy for a party "other than
# the subject of the record", "Typically for health care providers", so a
# composer or performer name is provider identity. OFF refuses `identifiers`
# on either class (the national-identifier slot) and `name` on PARTY_RELATED,
# which is defined by its relationship to the subject and may be the subject.
allow_identified_parties_in_ehr = false

# The identifier scanner, run over every string leaf of every clinical write.
# CODE_PHRASE.code_string is skipped — its value space is a terminology code.
# A DV_IDENTIFIER whose `type` names an item (an order, a specimen) is skipped,
# and so is one in a feeder audit's item-id lists unless its type names a person.
[privacy.identifier_scan]
mode = "strict"              # strict (refuse) | warn (accept + record)
# The national personal-identifier rules to scan for, by key. Every rule the
# build ships is active by default: clinical data crosses borders, and a false
# positive is a loud 422 an operator answers by narrowing this list, while a
# false negative is a national identifier stored indefinitely. Each rule
# transcribes the checksum its own issuing register publishes.
rules = ["ch-ahvn13", "ch-epd-pid", "de-kvnr", "fi-hetu", "gb-nhs-number", "nl-bsn", "no-fodselsnummer", "se-personnummer"]
# Extra patterns (Rust regular expressions) for the kinds no build can ship a
# rule for: local medical-record numbers, payer references, national
# postcode-plus-house-number forms. For example, a Dutch deployment adds
#   patterns = ["(^|[^0-9A-Za-z])[1-9][0-9]{3} ?[A-Z]{2}[^0-9A-Za-z]{1,3}[0-9]{1,4}([^0-9A-Za-z]|$)"]
# to refuse a postcode paired with a house number.
patterns = []

# ── [cohort] — cross-domain cohort queries ────────────────────────────────────
# Select a population in the demographic domain, resolve it to the EHRs whose
# EHR_STATUS subject names it, and run AQL over exactly those EHRs. No openEHR spec governs
# this — our own extension. OFF until a predicate is bound below: which
# demographic leaf may be selected on is a deployment fact about the archetypes
# in use, never something the server can infer.
[cohort]
# The distinct-EHR floor a result set must reach to be served; below it the rows
# are withheld and the response says so. 0 disables suppression.
small_cell_threshold = 5
# The largest cohort a predicate may select. A wider one is refused (422) rather
# than truncated: a silently shortened cohort is a wrong denominator.
max_cohort_size = 100000
# Let a cohort name its subjects by identifier, in any identifier domain, each
# resolved through the [ehr_index] provider (under the IHE provider, PIXm
# ITI-83 into this server's clinical domain). It turns the surface on without a
# bound predicate, and it is the one cohort form the IHE provider serves: it
# holds no party-to-EHR map, so a predicate is refused there.
subjects = false

# The allow-list. Only these five keys are bindable; each names the archetype of
# the ELEMENT's nearest archetyped ancestor, the ELEMENT's at-code, and how the
# caller's value is matched (text | text_prefix | coded | birth_date).
# `age_band` is the birth_date predicate and the only one.
#
# The archetype must be one the node model actually decomposes into a row: the
# party root, the CONTACT / ADDRESS / PARTY_IDENTITY / CAPABILITY containers
# nested in it, and any archetyped ITEM_TREE or CLUSTER under any of their
# `details`. The bindings below are EXAMPLES of the shape — a deployment names
# the archetypes and at-codes its own templates produce.
[cohort.predicates]
#? city          = { archetype = "openEHR-DEMOGRAPHIC-ADDRESS.address.v1", node = "at0012", kind = "text" }
#? postcode_area = { archetype = "openEHR-DEMOGRAPHIC-ADDRESS.address.v1", node = "at0014", kind = "text_prefix" }
#? sex           = { archetype = "openEHR-DEMOGRAPHIC-PERSON.person.v1", node = "at0017", kind = "coded" }
#? age_band      = { archetype = "openEHR-DEMOGRAPHIC-PERSON.person.v1", node = "at0010", kind = "birth_date" }
#? organisation  = { archetype = "openEHR-DEMOGRAPHIC-ORGANISATION.organisation.v1", node = "at0003", kind = "text" }

# ── [ehr_index] — who holds the subject-to-EHR cross-reference ───────────────
# Two supported postures, production included:
#   ihe    an IHE patient identity source (the default): FerroEHR asks its PIX
#          Manager over PIXm (ITI-83, the $ihe-pix operation) which identifier
#          the clinical domain holds for a patient, and that identifier is the
#          pseudonym EHR_STATUS.subject carries. Any conformant PIX Manager
#          serves; FerroEHR sends nothing product-specific and does no matching
#          or merging of its own.
#   local  the in-instance map, the subject-id posture: EHR_STATUS.subject
#          names a patient by any namespace and identifier, and
#          GET /ehr?subject_id=&subject_namespace= finds it. With no
#          privacy.subject_namespaces declared no pseudonym namespace is in
#          force, so a subject reference is stored as the client sends it;
#          production accepts the open_subject_namespace gap by name to run it.
# provider alone switches the index (FERROEHR__EHR_INDEX__PROVIDER=local): the
# keys of the provider not chosen are kept, not used, and named at boot; the
# declared privacy.subject_namespaces stay in force. The
# server refuses to start until the endpoint below is set or provider is
# "local". No silent fallback: a configured source that cannot be reached
# refuses boot, and a request it fails is an error.
[ehr_index]
provider = "ihe"             # ihe | local
#? pixm_url = "https://pix.example.org/fhir"   # the PIX Manager's FHIR base URL
#? assigning_authority = "urn:oid:2.999.1"     # the clinical domain; must be one
                             # of privacy.subject_namespaces
invocation = "post"          # post (keeps the identifier out of URLs) | get
                             # (the form ITI-83 prescribes)
request_timeout_ms = 10000

# The TLS material of the PIX Manager client: trust roots beside the
# platform's, for a source behind a private PKI, and a client identity for
# mutual TLS (one PEM holding the chain and its key).
#? [ehr_index.tls]
#? trust_roots_file = "/etc/ferroehr/pix-ca.pem"
#? client_identity_file = "/run/secrets/pix-client.pem"
#? min_version = "1.3"

# OAuth2 client-credentials grant whose token every ITI-83 request carries
# (IUA ITI-72), when the PIX Manager requires one. The client id is the one
# the identity source mints pseudonyms in the clinical domain for, and the
# scope is the one its PIXm Manager takes from a Consumer:
#? [ehr_index.oauth]
#? token_endpoint = "https://idp.example.org/realms/pix/protocol/openid-connect/token"
#? client_id = "ferroehr-cdr"
#? client_secret = "..."
#? client_secret_file = "/run/secrets/pix-client"   # instead of client_secret, a mounted file
#? scope = "system/Patient.rs"

# ── [demographic] — the demographic domain ────────────────────────────────────
# National-identifier protection: the value leaves the versioned body for
# `party.national_identifier`, sealed under a per-domain AES-256-GCM key
# with an HMAC-SHA-256 digest beside it for equality lookup. GDPR Art. 32(1)(a)
# names encryption as an appropriate measure; UAVG Art. 46 and the Wabvpz bound
# what a BSN may be used for at all.
[demographic.identifier_protection]
# OFF by default: turning it on makes the key load-bearing for reading these
# identifiers back, which is a deployment decision with a runbook attached.
enabled = false
# The DV_IDENTIFIER `type` values to protect. Each must be registered in
# `demographic.identifier_scheme`; an unregistered code is a boot error rather
# than an identifier that silently stays in the clear.
schemes = ["nl-bsn"]
# The root key: 64 hex characters (32 bytes). Prefer `key_file`.
#? key = "…64 hex characters…"
#? key_file = "/run/secrets/ferroehr-identifier-key"

# ── [usage_report] — the installation report to FerroPULSE ────────────────────
# ON by default. At each process start and once a day the instance sends one
# small JSON report to FerroPULSE, the Cadasto-operated collector (EU): a random
# instance id, the version and commit, the licence grant type, the deployment
# kind, uptime, database and migration state, coarse CPU/memory buckets and, in
# the daily report, latency histograms per route-template group and a count of
# 4xx answers. Never patient data, request paths, AQL text, licence ids or host
# names; the collector stores the source IP address and the country derived
# from it. One report per instance however many replicas run: the instance id
# and the counts live in the clinical database, so `state_dir` is refused here.
# Every boot logs one line
# saying whether it is on. In CI (GITHUB_ACTIONS or CI set to true or 1) it is
# off whatever `enabled` says. Notice: https://ferroehr.eu/docs/latest/usage-report.html
[usage_report]
enabled = true          # false (FERROEHR__USAGE_REPORT__ENABLED=false) sends nothing
endpoint = "https://report.ferropulse.eu/v1/report"   # https only (http to a loopback host)
# How the instance was deployed (helm | compose | binary | unknown). The Helm
# chart and the compose files set it; leave it unset elsewhere.
deployment = "unknown"

# ── [access_delay] — EHDS Art. 3(3), the delay of the person's own access ─────
# A Member State may delay a person's access to their data "for a limited
# period of time until a health professional is able to properly communicate
# and explain" it (Regulation (EU) 2025/327 Art. 3(3)). OFF by default, so
# Art. 3(1) immediate access holds; turn it on only where your Member State's
# rule provides for the delay. While on, a new COMPOSITION of a listed category
# reads as absent to a patient-context request (a SMART patient/ grant or the
# ABAC patient claim) until a professional releases it through
# POST /admin/access-delay/release or `hours` pass; professionals read it as
# before. A professional also holds one by hand through POST /admin/access-delay.
[access_delay]
enabled = false
# The categories held at creation, named as [audit.categories] names one
# (Laboratory-Reports, Medical-Imaging, …, <system>|<code>, or a national one).
# EMPTY holds nothing at creation.
categories = []
# The limit of a hold, in hours, 1 to 8784; required while enabled.
hours = 0

# ── [versioning] — what a repeated commit answers ─────────────────────────────
# A version whose content equals the current version's is committed like any
# other, with its own commit audit, contribution, version id and ETag, and the
# content is stored once (the new version reads its predecessor's node rows);
# that is not a setting. The one setting is the answer to a repeated send of
# the same content. OFF by default: every committal is recorded (RM common
# master06 §Committal and Audits). ON, a PUT whose content equals the current
# version's commits nothing and answers like a successful update with the
# existing version's ETag and Location; the access log keeps one `resend`
# record naming the version matched and the content digest, and no commit
# audit and no contribution record the send.
[versioning]
skip_identical_resend = false

# [scim] — the SCIM 2.0 service provider at /scim/v2/ (RFC 7644), through which
# an identity provider provisions each professional as a demographic PERSON.
# OFF by default. Each [[scim.client]] is an OAuth client-credentials client of
# the deployment's own authorization server (an [[auth.issuer]] of kind
# machines), acting for nobody, whose tokens must hold `scope`. It owns the
# Users whose binding key its `binding_issuer` (the identifier_issuer of an
# [[auth.party]] table) issues; no two clients share a binding_issuer.
# `public_base_url` is the externally reachable origin every meta.location and
# discovery document names, required when enabled. /scim/v2/ServiceProviderConfig
# is readable without a token; every other path needs a client's token.
[scim]
enabled = false
max_results = 100
#? public_base_url = "https://cdr.example.com"
# [[scim.client]]
# issuer = "https://as.example.com"
# client_id = "entra-provisioning"
# scope = "ferroehr/scim"
# binding_issuer = "urn:example:login"
