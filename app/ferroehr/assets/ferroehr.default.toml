#? method = "post"

# `[pixm.endpoint]`, the family's outbound endpoint: the FHIR base URL of the
# PIX Manager (`url`, the `[base]` of `[base]/Patient/$ihe-pix`, PIXm
# §2:3.83.4.1.2), the timeout of one ITI-83 exchange, its `retry`, the TLS
# (trust roots for a PIX Manager behind a private PKI, a client identity for
# mutual TLS) and the credential, such as the OAuth 2.0 client credentials
# grant whose access token every request carries (IUA ITI-72 §3.72.4.2). Any
# `userinfo` in the URL is masked in every rendering.
#? [pixm.endpoint]
# The service's URL (RFC 3986); required. It renders with its userinfo and its
# query masked, in `Debug` and when serialized. Optional (infrastructure).
#? url = ""
# How long one whole call may take; never zero. Optional (infrastructure).
#? timeout = "10s"
# How long opening the connection may take; unset, only `timeout` bounds it.
# Optional, unset by default (infrastructure).
#? connect_timeout = "500ms"

# How a failed call is tried again.
#? [pixm.endpoint.retry]
# How many times one call is tried in all; 1 tries once. Optional
# (infrastructure).
#? max_attempts = 3
# The wait before the second try. Optional (infrastructure).
#? initial_backoff = "200ms"
# The longest wait between two tries. Optional (infrastructure).
#? max_backoff = "5s"

# The TLS of the connection, built by the product's reader of TLS material.
#? [pixm.endpoint.tls]
# The client certificate chain and its private key, in one PEM. Optional, unset
# by default (infrastructure).
#? client_identity = ""
# A file holding `client_identity`. Optional, unset by default
# (infrastructure).
#? client_identity_file = ""
# A PEM bundle of trust roots beside the platform's. Optional, unset by default
# (infrastructure).
#? trust_roots_file = ""
# The oldest TLS version the client speaks: `"1.3"` unless lowered to `"1.2"`,
# as for the listener. Optional (infrastructure).
#? min_version = "1.3"

# The credential the calls carry: HTTP Basic or the client credentials grant.
#? [pixm.endpoint.credentials]
# The Basic user-id. Optional (infrastructure).
#? user = ""
# The Basic password, rendered redacted. Optional, unset by default
# (infrastructure).
#? password = ""
# The file holding the Basic password. Optional, unset by default
# (infrastructure).
#? password_file = ""

# The client credentials grant.
#? [pixm.endpoint.credentials.oauth]
# The issuer whose metadata names the token endpoint; exclusive with
# `token_endpoint`. It renders with any userinfo masked, as `SecretUrl` renders
# itself. Optional (infrastructure).
#? issuer = ""
# The token endpoint itself; exclusive with `issuer`. It renders with its
# userinfo and its query masked. Optional (infrastructure).
#? token_endpoint = ""
# The client identifier. Optional (infrastructure).
#? client_id = ""
# How the client authenticates. Optional (infrastructure).
#? client_auth = "client_secret_basic"
# The client secret, rendered redacted. Optional, unset by default
# (infrastructure).
#? client_secret = ""
# The file holding the client secret. Optional, unset by default
# (infrastructure).
#? client_secret_file = ""
# The PEM file holding the private key of the client assertion under
# `private_key_jwt`, and of the actor assertion of an onward exchange
# (`credentials.onward.actor_assertion`) whatever the client authentication.
# Optional, unset by default (infrastructure).
#? private_key_file = ""
# The `kid` the assertion names; the RFC 7638 thumbprint when empty. Optional
# (infrastructure).
#? kid = ""
# The algorithm the assertion is signed with; when unset, by key type, an EC
# key by its curve (P-256 ES256, P-384 ES384). Optional, unset by default
# (infrastructure).
#? assertion_alg = ""
# The `scope` request parameter; empty for none. Optional (infrastructure).
#? scope = ""
# The RFC 8707 resource indicator; empty for none. Optional (infrastructure).
#? resource = ""
# The `audience` request parameter; empty for none. Optional (infrastructure).
#? audience = ""
# How long before the token expires a new one is fetched. Optional
# (infrastructure).
#? refresh_margin = "30s"
# How long one call to the authorization server may take. Optional
# (infrastructure).
#? timeout = "10s"
# The `aud` of a `private_key_jwt` assertion: `token_endpoint` (the default) or
# `issuer`, which needs `issuer` set. Optional (infrastructure).
#? assertion_audience = "token_endpoint"
# The PEM file of the `DPoP` key the tokens are bound to (RFC 9449). Optional,
# unset by default (infrastructure).
#? dpop_key_file = ""
# Whether the tokens are bound to the client certificate (RFC 8705 §3).
# Optional (infrastructure).
#? certificate_bound = false
# The security profile: `oauth2` (the default) or `fapi2`. Optional
# (infrastructure).
#? security_profile = "oauth2"
# The hosts a FAPI 2.0 mutual-TLS alias may be on (RFC 8705 §5). Optional
# (infrastructure).
#? mtls_alias_hosts = []
# The PEM file of the previous assertion key, published, never signing.
# Optional, unset by default (infrastructure).
#? previous_private_key_file = ""
# How long the previous key stays published; `0s` for as long as it is set.
# Optional (infrastructure).
#? previous_key_overlap = "0s"
# The PEM file of the next assertion key, published and never signing.
# Optional, unset by default (infrastructure).
#? next_private_key_file = ""
# The RFC 9396 `authorization_details` JSON text; empty for none. Optional
# (infrastructure).
#? authorization_details = ""

# The TLS of the token endpoint connection: trust roots beside the platform's,
# the client identity presented over mutual TLS (RFC 8705 §2) and the minimum
# version. The crate reads none of it: a table that names material resolves
# through the product's `TlsBuilder`.
#? [pixm.endpoint.credentials.oauth.tls]
# The client certificate chain and its private key, in one PEM. Optional, unset
# by default (infrastructure).
#? client_identity = ""
# A file holding `client_identity`. Optional, unset by default
# (infrastructure).
#? client_identity_file = ""
# A PEM bundle of trust roots beside the platform's. Optional, unset by default
# (infrastructure).
#? trust_roots_file = ""
# The oldest TLS version the client speaks: `"1.3"` unless lowered to `"1.2"`,
# as for the listener. Optional (infrastructure).
#? min_version = "1.3"

# The onward target the lane reaches on a caller's behalf, authenticating with
# `oauth`.
#? [pixm.endpoint.credentials.onward]
# The identifier of the issuer of the onward tokens, whose metadata names its
# token endpoint unless `token_endpoint` is set. It renders with any userinfo
# masked, as `SecretUrl` renders itself. Optional (infrastructure).
#? issuer = ""
# Whose tokens the issuer signs: `persons` (a delegated exchange), `patients`
# (a patient's own token) or `federation`; required, with no default. Optional,
# unset by default (infrastructure).
#? kind = "persons"
# The preset the issuer's profile starts from. Optional (infrastructure).
#? profile = "rfc9068"
# The token endpoint itself; empty to discover it from `issuer`. It renders
# with its userinfo and its query masked. Optional (infrastructure).
#? token_endpoint = ""
# The client id at this issuer; empty for the lane's own. Optional
# (infrastructure).
#? client_id = ""
# The audiences an onward token may name, at least one. Optional
# (infrastructure).
#? audiences = []
# The `resource` or `audience` values the request names, as the profile's
# `onward_indicator` says. Optional (infrastructure).
#? indicators = []
# The `scope` the request names; empty for none. Optional (infrastructure).
#? scope = ""
# The claim a chained federation route carries from the subject token to the
# onward token; empty for none. Optional (infrastructure).
#? correlation_claim = ""
# Whether the lane holds the tokens it obtains until they near their `exp`.
# `false` exchanges a token at the issuer on every call, a setting for a
# performance measurement's self-test, never for production. `true` by default.
# Optional (infrastructure).
#? cache = true
# Whether every token exchange sent without an actor token names the lane's
# client as its actor with an assertion signed by the current key of its
# `oauth` table's key ring (RFC 8693 §2.1; `Onward::with_actor_assertion`).
# `false` by default. Optional (infrastructure).
#? actor_assertion = false

# The profile keys set over the preset; `max_onward_lifetime` is required, here
# or in the preset.
#? [pixm.endpoint.credentials.onward.keys]
# `Profile::person_key`. Optional, unset by default (infrastructure).
#? person_key = ""
# `Profile::tenant_claim`. Optional, unset by default (infrastructure).
#? tenant_claim = ""
# `Profile::client_claims`. Optional, unset by default (infrastructure).
#? client_claims = []
# `Profile::impersonation_marker`. Optional, unset by default (infrastructure).
#? impersonation_marker = ""
# `Profile::expect`. Optional, unset by default (infrastructure).
#? expect = {}
# `Profile::user_claims`. Optional, unset by default (infrastructure).
#? user_claims = []
# `Profile::person_equality`. Optional, unset by default (infrastructure).
#? person_equality = []
# `Profile::unstable_claims`. Optional, unset by default (infrastructure).
#? unstable_claims = []
# `Profile::first_party_clients`. Optional, unset by default (infrastructure).
#? first_party_clients = []
# `Profile::max_actor_chain`. Optional, unset by default (infrastructure).
#? max_actor_chain = 0
# `Profile::act_represents_patient`. Optional, unset by default
# (infrastructure).
#? act_represents_patient = false
# `Profile::token_types`. Optional, unset by default (infrastructure).
#? token_types = []
# `Profile::required_claims`. Optional, unset by default (infrastructure).
#? required_claims = []
# `Profile::adapter`. Optional, unset by default (infrastructure).
#? adapter = ""
# `Profile::max_onward_lifetime`, a duration such as `"10min"`. Optional, unset
# by default (infrastructure).
#? max_onward_lifetime = "500ms"
# `Profile::onward_grant`. Optional, unset by default (infrastructure).
#? onward_grant = "token_exchange"
# `Profile::onward_indicator`. Optional, unset by default (infrastructure).
#? onward_indicator = "resource"
# `Profile::onward_parameters`. Optional, unset by default (infrastructure).
#? onward_parameters = {}
# `Profile::onward_client_id`. Optional, unset by default (infrastructure).
#? onward_client_id = false
# `Profile::onward_subject_audience`. Optional, unset by default
# (infrastructure).
#? onward_subject_audience = false
# `Profile::onward_preview`. Optional, unset by default (infrastructure).
#? onward_preview = []

# `Profile::app_only`.
#? [[pixm.endpoint.credentials.onward.keys.app_only]]
# The claim of `{ claim, value }`. Optional, unset by default (infrastructure).
#? claim = ""
# The value of `{ claim, value }`. Optional, unset by default (infrastructure).
#? value = ""
# The claim of `{ absent_claim }`. Optional, unset by default (infrastructure).
#? absent_claim = ""
# The subjects of `{ subjects }`. Optional, unset by default (infrastructure).
#? subjects = []
# The `{ sub_is_client = true }` form. Optional, unset by default
# (infrastructure).
#? sub_is_client = false
# The claim of `{ differs_from_iss }`. Optional, unset by default
# (infrastructure).
#? differs_from_iss = ""

# `Profile::guest`.
#? [[pixm.endpoint.credentials.onward.keys.guest]]
# The claim of `{ claim, value }`. Optional, unset by default (infrastructure).
#? claim = ""
# The value of `{ claim, value }`. Optional, unset by default (infrastructure).
#? value = ""
# The claim of `{ absent_claim }`. Optional, unset by default (infrastructure).
#? absent_claim = ""
# The subjects of `{ subjects }`. Optional, unset by default (infrastructure).
#? subjects = []
# The `{ sub_is_client = true }` form. Optional, unset by default
# (infrastructure).
#? sub_is_client = false
# The claim of `{ differs_from_iss }`. Optional, unset by default
# (infrastructure).
#? differs_from_iss = ""

# `Profile::delegates`.
#? [[pixm.endpoint.credentials.onward.keys.delegates]]
# The actor's issuer. Optional, unset by default (infrastructure).
#? issuer = ""
# The actor's `sub`. Optional, unset by default (infrastructure).
#? sub = ""
# The client. Optional, unset by default (infrastructure).
#? client = ""

# `Profile::representation`.
#? [pixm.endpoint.credentials.onward.keys.representation]
# The claim naming the subject the person represents. Required in its table
# (infrastructure).
#? claim = ""
# The claim carrying the ground of the representation, as asserted. Optional,
# unset by default (infrastructure).
#? ground_claim = ""

# `Profile::scope_claim`.
#? [pixm.endpoint.credentials.onward.keys.scope_claim]
# The claim. Required in its table (infrastructure).
#? claim = ""
# Its JSON form. Optional (infrastructure).
#? form = "string"

# `Profile::app_only_scope_claim`.
#? [pixm.endpoint.credentials.onward.keys.app_only_scope_claim]
# The claim. Required in its table (infrastructure).
#? claim = ""
# Its JSON form. Optional (infrastructure).
#? form = "string"

# What a `federation` issuer asserts, over its preset's defaults;
# `exchanges_from` and `person_mapping` are required.
#? [pixm.endpoint.credentials.onward.federation]
# The `[auth.issuer]` this table describes, of kind `federation`. It renders
# with any userinfo masked, as `SecretUrl` renders itself. Optional
# (infrastructure).
#? issuer = ""
# Whether the issuer is a MyHealth@EU contact point; required, with no default.
# Optional, unset by default (infrastructure).
#? contact_point = false
# The default sources the table starts from. Optional, unset by default
# (infrastructure).
#? mapping = "iua"
# The sources of each field, over the mapping's. Optional (infrastructure).
#? fields = {}
# The country codes a professional may carry. Optional (infrastructure).
#? countries = []
# The issuing authorities a professional or provider may name. Optional
# (infrastructure).
#? issuing_authorities = []
# The prefixes a healthcare provider identifier must start with. Optional
# (infrastructure).
#? provider_identifier_prefixes = []
# Whether the issuer attests the `authorization_details` it puts in a token,
# which RFC 9396 §12 has "sent through the user agent". Optional
# (infrastructure).
#? attests_authorization_details = false
# The `authorization_details` type the attributes are read from. Optional,
# unset by default (infrastructure).
#? authorization_details_type = ""
# The `authorization_details` types that state an organisation's access.
# Optional (infrastructure).
#? organisation_types = []
# The claim holding the Verifiable Presentations of a Nuts RFC021 §6
# introspection response, `vps`. Optional, unset by default (infrastructure).
#? presentations_claim = ""
# The credential types the deployment declares user-authenticated. Optional
# (infrastructure).
#? user_credential_types = []
# The fields every token of the issuer must carry, each with a source. Optional
# (infrastructure).
#? required_fields = []
# Whether the issuer's tokens must be sender-constrained, so the issuer fails
# to load without `sender_constraint = "required"`. Optional (infrastructure).
#? requires_sender_constraint = false
# The subject-token issuers whose persons this issuer is trusted to map to its
# own, when it issues onward tokens (`client::onward`). Optional
# (infrastructure).
#? exchanges_from = []
# The subject-token claim, a dotted path, whose value an onward token of this
# issuer must carry as `professional.hp_identifier`. Optional, unset by default
# (infrastructure).
#? person_mapping = ""

# The assurance level the issuer's tokens carry.
#? [pixm.endpoint.credentials.onward.assurance]
# The claim carrying the authentication context class, a dotted path; `acr` by
# default (OpenID Connect Core 1.0 §2). Optional (infrastructure).
#? claim = "acr"
# The level each claim value the issuer emits stands for; a value the map does
# not name carries none. Optional (infrastructure).
#? levels = {}
# The level a request held to the section must carry; none refuses nothing.
# Optional, unset by default (infrastructure).
#? minimum = "low"
