# ferroehr.toml — the complete FerroEHR server configuration.
#
# No openEHR spec governs configuration — this is our own design. Emit a fresh
# copy with `ferroehr config default > ferroehr.toml`, then edit. Every key below
# shows its built-in default; delete anything you do not override. Keys marked
# `#?` are optional/derived/secret and are shown commented for reference.
# Lines marked `# PROD:` MUST be reviewed before a production deployment.
#
# Env overrides use `FERROEHR` + the TOML path, `__` between every segment
# (including after the prefix), e.g. `[db] max_connections` ⇔
# FERROEHR__DB__MAX_CONNECTIONS. `--set key=value` wins over env. `DATABASE_URL`
# and `RUST_LOG` are recognized (lower-priority) aliases.

# The openEHR specification generation set this server runs:
#   "development" — RM 1.2.0 + BASE 1.3.0 + LANG 1.1.0 (the default)
#   "stable"      — RM 1.1.0 + BASE 1.2.0 + LANG 1.0.0 (the released generations)
# One coupled choice — the components' generations are modelled against each
# other, so they never vary independently. stable → development is always a
# safe change (openEHR minor releases are additive); development → stable is
# supported only for data that never used development-only constructs. The
# profile is the ACCEPTANCE boundary: ingress and AQL planning refuse
# constructs outside the active generation set, and stored content is never
# silently down-converted — every commit records whether the released
# generations can express its body, and under "stable" a stored version they
# cannot is refused with 409 naming this key rather than served. AQL is not
# covered by that stamp: the planning gate refuses development-only constructs
# in the QUERY, while a generic projection over stored development content
# still returns rows.
spec_profile = "development"

# The declared deployment posture. `sandbox` (the default) must not hold real
# patient data and says which separations are missing on the banner, in the
# log and on GET /rest/status; `production` refuses to start while one is
# missing and not named in deployment_accepts (shared_credential,
# shared_cluster, open_subject_namespace, audit_off, audit_fails_open,
# open_ehr_access_default, migrate_on_runtime_credential). Our own posture,
# not a legal requirement.
deployment_profile = "sandbox"   # sandbox | production
#? deployment_accepts = ["shared_cluster"]

# ── [server] — HTTP listener + REST surface ──────────────────────────────────
[server]
bind = "0.0.0.0:8080"
# Shortening is supported (e.g. "/ferroehr/v1" behind a path-prefixed proxy);
# the first segment must be /ferroehr and the last must be v1.
base_path = "/ferroehr/rest/openehr/v1"
max_in_flight = 256          # concurrent-request admission cap; 0 disables shedding
swagger_ui = "private"       # off | admin_only | private | public — "public" discloses the whole operation surface anonymously
cors_permissive = false      # PROD: keep false; configure explicit origins
# This CDR's own openEHR system identifier: stamped into EHR.system_id, the
# AUDIT_DETAILS.system_id server default, and every
# OBJECT_VERSION_ID.creating_system_id. It MUST be a legal openEHR `uid` —
# an internet id (a DNS-style host name, the common convention), an ISO OID or
# a UUID — and the server refuses to boot otherwise. PROD: set a stable,
# deployment-unique name. Changing it never rewrites identifiers already
# committed. Distinct from [server.identity], which is only the OPTIONS
# manifest's display identity.
system_id = "ferroehr.local"

# [server.tls] — native TLS + client-certificate (mutual-TLS) authentication
# on the main listener (the IHE ATNA ITI-19 node-authentication posture;
# protocol floor: TLS 1.3 only by default — min_version = "1.2" admits 1.2
# alongside). Off by
# default: deployments commonly terminate TLS at an ingress. The separate-port
# management listener stays plain HTTP (internal surface).
[server.tls]
enabled = false
#? cert_file = "/etc/ferroehr/server.pem"
#? key_file = "/etc/ferroehr/server.key"
client_auth = "off"          # off | optional | required (required = IHE mTLS)
# The protocol floor. Defaults to 1.3 ONLY: the OWASP Transport Layer Security
# Cheat Sheet §Only Support Strong Protocols — "web applications must default to
# TLS 1.3 and may support TLS 1.2 for compatibility". Set "1.2" only for a client
# that genuinely cannot do 1.3 (an older integration engine, a pinned Java
# runtime); it enables 1.2 ALONGSIDE 1.3, never instead of it. 1.1 and 1.0 are
# not selectable at all — RFC 8996 deprecates them and neither this key nor
# rustls offers them.
min_version = "1.3"          # 1.3 | 1.2
#? client_ca_file = "/etc/ferroehr/client-ca.pem"

# [server.limits] — the largest request body each route family accepts. Two
# tiers: the clinical surface, and the routes that accept bulk by design
# (operational-template upload, /message/import, /message/tdd). Over-limit is
# refused 413. The defaults are sized against measured payloads — the largest
# operational template in the vendored CKM corpus is 5.4 MB and the largest
# example composition 526 KB — not round numbers. Raise body_bytes if your
# compositions embed large DV_MULTIMEDIA data.
[server.limits]
body_bytes = 16777216        # 16 MiB — the ordinary clinical surface
bulk_body_bytes = 67108864   # 64 MiB — template upload + the /message imports

# [server.rate_limit] — per-caller request rates, refused 429 + Retry-After.
# Distinct from max_in_flight above: that sheds 503 when too many requests are
# in flight AT ONCE (capacity); this refuses 429 when one caller asks too often
# OVER TIME (fairness). Two tiers: the address tier sits outside authentication
# so a flood is refused before the server verifies a signature per request, and
# the principal tier sits inside it, keyed on the authenticated subject —
# address-keying a clinical API would throttle a whole hospital behind one NAT.
# The defaults sit above this implementation's own measured whole-server ceiling
# (512 req/s on the reference SUT), so the limiter cannot refuse a caller the
# server could still have served; raise them in proportion for a larger
# deployment class. Our own measurement lanes compose with this disabled
# (docker/sut-measurement.yml) because they push past the knee deliberately.
[server.rate_limit]
enabled = true
principal_per_second = 1024  # per authenticated subject, on the clinical API
principal_burst = 2048
address_per_second = 2048    # per client address, across the whole tree
address_burst = 4096

# [server.connection] — the bounds that apply BEFORE a request exists. Every
# other limit here engages once a request is parsed and dispatched (body size,
# request timeout, rate limit, in-flight shed); a client that opens a socket and
# trickles headers reaches none of them. HTTP/1 and HTTP/2 need different bounds
# because the exposure differs: h1 streams a request head (so it can be
# trickled), h2 multiplexes streams (so the exposure is concurrency — the
# rapid-reset amplification class).
[server.connection]
header_read_timeout_secs = 10   # HTTP/1: time to deliver a complete request head; 0 disables
max_concurrent_streams = 256    # HTTP/2 streams per connection; 0 leaves hyper's default
http2_keep_alive_interval_secs = 30  # PING interval; 0 disables (a vanished peer is then held)
http2_keep_alive_timeout_secs = 10   # PING response deadline before the connection closes

# [server.identity] — the OPTIONS / System-Options manifest. Defaults are the
# measured build/provenance identity; override only to rebrand.
#? [server.identity]
#? solution = "FerroEHR"
#? solution_version = "<build version>"
#? vendor = "Cadasto B.V."
#? restapi_specs_version = "<tested contract identity>"
#? conformance_profile = "<last ECC verdict>"

# ── [db] — PostgreSQL ────────────────────────────────────────────────────────
[db]
url = "postgres://ferroehr:ferroehr@localhost:5432/ferroehr"  # PROD: real DSN via env/secret
#? url_file = "/run/secrets/db-dsn"   # or point at a mounted file instead of passing the DSN as env
# The credential that PREPARES the schema, used for that one boot step and
# then closed. Preparing spans every schema of a database — the DDL of each
# resident migration set under migrate = "apply", their bookkeeping tables
# under "verify" — so a deployment whose runtime DSNs each hold one domain
# names the credential that can reach them all here. Unset, it falls back to
# the url above, which is what every single-credential deployment runs. It
# prepares every domain whose DSN reaches the same DATABASE it does; a domain
# relocated to another database is prepared on its own DSN.
#? migrate_url = "postgres://ferroehr_migrator:...@localhost:5432/ferroehr"
#? migrate_url_file = "/run/secrets/db-migrate-dsn"
# Whether the server issues DDL at boot. "apply" runs the embedded migrations
# then verifies, which is what makes an empty configuration boot against an
# empty database; "verify" never issues DDL and refuses to serve unless the
# database already carries exactly this build's migrations, so the runtime role
# needs no schema rights.
migrate = "apply"            # apply | verify — PROD: verify
max_connections = 20
min_connections = 2
acquire_timeout_secs = 30
# statement_timeout on every pooled connection — the backstop the HTTP request
# timeout cannot be, because dropping a handler future does not cancel the
# statement PostgreSQL is running. Set ABOVE query.timeout_ms so the engine's
# typed refusal fires first and this only catches what the engine does not
# govern. 0 leaves the server default (usually unlimited).
statement_timeout_ms = 60000

# ── [storage] — one DSN per storage domain ───────────────────────────────────
# Each domain always lives in its own schema (clinical, party, linkage, audit)
# and every pool carries only its own on its search_path. Set a url here to give
# a domain its own database ROLE as well — and, if the DSN names another host, a
# database or cluster of its own: a schema separates a domain inside one
# database, but a base backup, WAL archiving and physical replication carry every
# schema of that database together. Unset, the domain connects on [db] url, which
# is what the compose quickstart and every single-credential deployment run.
#
# The server refuses to boot when a runtime role can read across a boundary, when
# two separately-configured domains turn out to authenticate as one role, and —
# under deployment_profile = "production" — when a domain role is missing.
#
# The linkage set names a function the party set creates, so those two are
# prepared in the same database; the server refuses a layout that splits them.
#? [storage.clinical]
#? url = "postgres://ferroehr_clinical:...@localhost:5432/ferroehr"
#? url_file = "/run/secrets/db-clinical-dsn"
#? [storage.party]
#? url = "postgres://ferroehr_party:...@localhost:5432/ferroehr"
#? url_file = "/run/secrets/db-party-dsn"
#? [storage.linkage]
#? url = "postgres://ferroehr_linkage:...@localhost:5432/ferroehr"
#? url_file = "/run/secrets/db-linkage-dsn"
#? [storage.audit]
#? url = "postgres://ferroehr_audit:...@localhost:5432/ferroehr_audit"
#? url_file = "/run/secrets/db-audit-dsn"

# ── [log] — logging ──────────────────────────────────────────────────────────
[log]
format = "auto"              # auto | json | pretty ; PROD: json
filter = "info,ferroehr=info"

# ── [telemetry] — OpenTelemetry export (unset endpoint ⇒ OTel off) ────────────
[telemetry]
#? otlp_endpoint = "http://collector:4317"
service_name = "ferroehr"
environment = "dev"
traces_sample_ratio = 1.0    # PROD: 0.1 is a common starting point
metrics_push = false
# Span-timing flamegraph capture (tracing-flame): write folded stack samples
# to this file for offline rendering (inferno-flamegraph < file > flame.svg).
# Unset ⇒ the layer is not installed (zero overhead). Diagnostic sessions only.
#? flame_file = "/var/log/ferroehr/tracing.folded"

# ── [auth] — authentication (PROD: configure a mechanism) ─────────────────────
[auth]
enabled = true               # false = all requests pass unauthenticated (dev only)
verified_cache_ttl_seconds = 60


# With enabled = true at least ONE mechanism below MUST be configured: a server
# with none could only refuse every request while advertising a scheme it does
# not implement (RFC 9110 §11.6.1), so it refuses to start instead.

# Basic-auth users (file-only; array of tables). Every password_hash must be an
# argon2id PHC string meeting the OWASP Password Storage Cheat Sheet §Argon2id
# floor — m>=19456, t>=2, p>=1 — checked at boot, because the verifier takes its
# cost parameters from the stored hash:
#? [[auth.basic.users]]
#? username = "alice"
#? password_hash = "$argon2id$v=19$m=19456,t=2,p=1$...$..."   # never a plaintext password
#? password_hash_file = "/run/secrets/alice-hash"   # or a mounted file; the Argon2id floor applies either way
#? roles = ["USER"]

# OAuth2/OIDC bearer (absent table ⇒ bearer disabled):
#? [auth.oidc]
# issuer: an RFC 8414 §2 issuer identifier — an https URL with no query and no
# fragment. Boot-validated.
#? issuer = "https://idp.example/realms/ferroehr"
# audiences: REQUIRED, at least one. A resource server that declares no audience
# cannot reject a token minted for a different one, nor tell an OIDC ID token
# apart from an access token (RFC 7519 §4.1.3, RFC 9068 §4 step 4).
#? audiences = ["ferroehr"]
#? algorithms = ["RS256"]
# clock_skew_leeway_seconds: leeway on the time-based claims. Capped at 300 —
# leeway may be "no more than a few minutes" (RFC 9068 §4 step 6), and a large
# value silently extends every token's life.
#? clock_skew_leeway_seconds = 60
# require_at_jwt: refuse a token that does not claim the RFC 9068 access-token
# profile (`typ: at+jwt`). Off by default because §2.1 makes the type a SHOULD
# for the authorization server, so requiring it rejects conforming issuers. A
# token that DOES claim the profile is held to the whole of §2.2 either way —
# `iat`, `jti` and `client_id` become mandatory for it.
#? require_at_jwt = false
# allow_insecure_issuer: accept a non-https issuer. DEVELOPMENT/TEST ONLY — it
# exposes token verification material to the network (RFC 8414 §6.2).
#? allow_insecure_issuer = false
# hmac_secret: a symmetric HS* key, at least 32 bytes of high-entropy material
# and never a memorizable password (RFC 8725 §3.5). A development posture: the
# key is shared with the authorization server, so this server could mint the
# tokens it accepts. Boot warns when it is set.
#? hmac_secret = "..."
#? hmac_secret_file = "/run/secrets/hmac"
#? jwks_json = "{...}"
#? jwks_json_file = "/etc/ferroehr/jwks.json"
# Discovery/JWKS fetch hardening (used only when neither hmac_secret nor
# jwks_json is set, i.e. keys come from the issuer's OIDC discovery document):
#? connect_timeout_ms = 3000
#? request_timeout_ms = 5000
#? negative_cache_ttl_seconds = 10   # remember a FAILED fetch this long (0 = off);
                                     # a down issuer then yields fast 503s (the gate
                                     # cannot DECIDE, so it never answers 401) instead
                                     # of one discovery attempt per bearer request

# ── [authz] — RBAC + ABAC ─────────────────────────────────────────────────────
[authz.rbac]
enabled = true
admin_role = "ADMIN"
user_role = "USER"
readonly_role = "READONLY"   # carriers are refused on every write operation
# The role that reads the access log for ONE subject at a time (GET
# /fhir/r4/AuditEvent with `patient` required): what a patient portal holds to
# show a person who accessed their record, instead of an admin credential over
# every patient's log. Unset, the log is admin-only.
#? subject_audit_role = "PORTAL"
role_claims = ["roles", "groups", "entitlements", "realm_access.roles"]
# What an EHR carrying no ACCESS_CONTROL_SETTINGS admits. A new EHR carries
# none, so this governs most records. "restricted" is object-level default-deny:
# only admin_role reaches a setting-less EHR, so an operator can still author
# the settings that open it.
ehr_access_default = "open"   # open | restricted
# The management surface is NOT configured here — see [management.endpoints],
# which owns it, one level per endpoint.

[authz.abac]
enabled = false
engine = "cedar"             # cedar | remote
organization_claim = "organization_id"
patient_claim = "patient_id"
check_directory = false      # submit DIRECTORY (FOLDER) operations to the PDP;
                             # engine-independent, so it works under cedar too

[authz.abac.cedar]
#? policy_dir = "/etc/ferroehr/policies"   # required when engine = cedar and abac enabled
#? reload_secs = 30

[authz.abac.remote]
#? server = "http://pdp:3001/exec/"       # required when engine = remote; must end '/'
connect_timeout_ms = 2000
request_timeout_ms = 5000

# Per-resource-kind policy bindings (kind ∈ ehr, ehr_status, composition,
# contribution, query, directory):
#? [authz.abac.policy.composition]
#? name = "composition-access"
#? parameters = ["organization", "patient", "template"]

# ── [admin] — the ADMIN API group (physical delete) ──────────────────────────
[admin]
enabled = false

# ── [smart] — SMART App Launch ────────────────────────────────────────────────
[smart]
enabled = false
#? platform_base_url = "/gateway/v1"
#? public_base_url = "https://cdr.example.com"   # REQUIRED when enabled: the external origin the absolute services.*.baseUrl values are built from (master04 §Services)
ehr_id_claim = "ehrId"
patient_claim = "patient"
require_smart_scopes = false
launch_base64_json = false

[smart.episode]
enabled = false

# Everything in this table is PUBLISHED to third-party apps at
# /.well-known/smart-configuration, so an empty list is not silence — it claims
# the authorization server supports none of that thing, and an app that reads it
# complies. With `smart.enabled = true` these are boot-validated: every advertised
# endpoint must be an absolute https URL (allow_insecure_endpoints opts out for
# development), `response_types_supported` must be non-empty (RFC 8414 §2 marks it
# REQUIRED), `token_endpoint_auth_methods_supported` must name at least one
# method, and `code_challenge_methods_supported` must include "S256" — SMART App
# Launch requires PKCE (RFC 7636), and `plain` alone is not sufficient (§7.2).
# `smart.endpoints.issuer` must also equal `auth.oidc.issuer`: one says where apps
# GET tokens, the other says which tokens this server ACCEPTS.
[smart.endpoints]
token_endpoint_auth_methods_supported = []
grant_types_supported = []
response_types_supported = []
code_challenge_methods_supported = []
scopes_supported = []
allow_insecure_endpoints = false   # DEV/TEST ONLY: accept a non-https advertised endpoint
capabilities = []   # extra (HL7 base) capabilities to advertise, e.g. ["launch-ehr", "sso-openid-connect"]
#? issuer = "https://as.example"
#? jwks_uri = "https://as.example/jwks"
#? authorization_endpoint = "https://as.example/authorize"
#? token_endpoint = "https://as.example/token"
#? registration_endpoint = "https://as.example/register"
#? introspection_endpoint = "https://as.example/introspect"
#? revocation_endpoint = "https://as.example/revoke"
#? management_endpoint = "https://as.example/manage"

# ── [management] — ops-introspection surface ───────────────────────────────────
# Introspection only (info / prometheus / metrics / env / loggers / flamegraph),
# off by default. Health probes are NOT here: /health, /health/liveness and
# /health/readiness are always mounted and public, whatever this section says.
[management]
enabled = false
base_path = "/management"
#? port = 9100                # separate listener; must differ from server.bind port

# The single authority for this surface: one level per endpoint, and an
# endpoint left "off" is not mounted at all (404). Levels: off | private |
# admin_only | public. `public` is served OUTSIDE authentication.
[management.endpoints]
info = "off"
metrics = "off"               # one name, two routes: /management/metrics + /management/metrics/{name}
prometheus = "off"
env = "off"
loggers = "off"
flamegraph = "off"            # on-demand CPU flamegraph (pprof sampling)

# Limits for the on-demand CPU profiler (endpoints.flamegraph). A request
# asking beyond a cap is refused with 400, never silently clamped.
[management.profiling]
max_seconds = 30              # longest sample window one request may take
max_frequency = 999           # highest sampling frequency (Hz) a request may ask

# ── [signing] — VERSION signing (RM common master06 §Digital Signature) ───────
[signing]
enabled = true
mode = "digest"              # digest | pgp
#? key_path = "/etc/ferroehr/signing.asc"   # required for mode = pgp
#? key_passphrase = "..."
#? key_passphrase_file = "/run/secrets/pgp-pass"
# PUBLIC keys retired from signing and kept for verification, so versions signed
# before a key rotation keep verifying. A stored signature carries no key id and
# is an immutable committed fact, so retaining the old key is the only way
# history stays verifiable. Public keys: a retired key can never sign again.
retired_key_paths = []       # e.g. ["/etc/ferroehr/signing-2025.pub.asc"]
# Read-time verification of OUR OWN signatures. UNSET (the default) resolves to
# `strict` when signing is enabled — a served version whose stored signature no
# longer recomputes is a 5xx integrity fault. Set explicitly to opt out:
# `warn` (log + meter, still serve) or `off` (never check). Client-supplied
# signatures are always stored verbatim and never re-verified.
#? verify_on_read = "strict" # off | warn | strict (unset ⇒ strict when enabled)

# ── [licence] — the commercial licence token ──────────────────────────────────
# FerroEHR is BUSL-1.1: production use in the course of a business needs a
# commercial licence. The server runs identically with or without the token;
# its state is logged once at boot and reported on GET /rest/status.
[licence]
#? file = "/etc/ferroehr/licence.asc"

# ── [query] — AQL execution knobs ─────────────────────────────────────────────
[query]
plan_cache_capacity = 256    # 0 disables the plan cache
# The per-query execution budget, ON by default. It used to be off, which left
# the HTTP request timeout as the only guard — and that answers the CLIENT
# without cancelling the statement, so overrunning queries kept holding pooled
# connections after their callers had been given up on. Kept TIGHTER than
# db.statement_timeout_ms so an overrun surfaces as this engine's typed 408
# rather than a driver error.
timeout_ms = 30000           # 0 disables the per-query budget (408 on overrun)
# The result-row ceiling for a query that neither the AQL nor the request bounds.
# Without it, `SELECT c FROM COMPOSITION c` with no `fetch` generates SQL with no
# LIMIT and materialises every matching row — one request, unbounded allocation.
# ITS-REST leaves the `fetch` default to the implementation, so a ceiling is
# spec-permitted. An explicit AQL LIMIT or a `fetch` parameter is honoured as
# written; this only bounds the case where nothing else does.
max_result_rows = 10000      # 0 = unbounded

# ── [events] — contribution-outbox eventing (PHI-free envelopes) ──────────────
[events]
enabled = false
url = "amqp://guest:guest@localhost:5672/%2f"   # credentials redacted in every rendering
#? url_file = "/run/secrets/events-amqp"   # or a mounted file instead of env
exchange = "ferroehr.events"
tls = false                  # PROD: true (amqps)
batch_size = 128
poll_interval_ms = 1000
retention_days = 7
prune_interval_secs = 3600
publish_max_retries = 3
admin_api = false            # mount /admin/event_subscription CRUD

# ── [fhir] — FHIR connector (inbound façade + PHI-bearing outbound emitter) ───
[fhir]
api_enabled = false          # mount /fhir/r4/* + /admin/fhir_mapping

[fhir.outbound]
enabled = false              # carries PHI — enabling is an explicit decision
url = "amqp://guest:guest@localhost:5672/%2f"
#? url_file = "/run/secrets/fhir-amqp"   # or a mounted file instead of env
exchange = "ferroehr.fhir"    # distinct from [events].exchange for PHI isolation
tls = false                  # PROD: true (amqps)
batch_size = 128
poll_interval_ms = 1000
publish_max_retries = 3

# ── [terminology] — terminology API + external-server validation ──────────────
[terminology]
api_enabled = false

[terminology.external]
enabled = false              # on: SM lookups, AQL TERMINOLOGY(), and
                             # composition ac-code binding resolution route here
fail_on_error = false        # TS unreachable/erroring: false = accept the
                             # composition (fail-open), true = reject it (422)
# Named FHIR R4B terminology-server providers (map). EVERY entry is materialised
# — a deployment binds SNOMED CT, LOINC, ICD… to different servers at once:
#? [terminology.external.providers.default]
#? type = "fhir"
#? url = "https://r4.ontoserver.csiro.au/fhir"
#? operation = "validate_code"   # validate_code | expand
#? connect_timeout_ms = 2000
#? request_timeout_ms = 10000
#? cache_ttl_secs = 300
#? cache_capacity = 10000
#? oauth2_client = "ts-client"   # must name a [terminology.external.oauth2_clients.*]
# Mutual TLS to THIS server (each TS issues its own client certificate, so the
# identity is per provider). Set the cert and the key together. ca_bundle_path
# REPLACES the default trust anchors for this provider — server-certificate and
# hostname verification are always on; there is no way to disable them:
#? client_cert_path = "/run/secrets/ts-client.crt.pem"
#? client_key_path = "/run/secrets/ts-client.key.pem"
#? ca_bundle_path = "/run/secrets/ts-ca.pem"
#? [terminology.external.providers.snomed]
#? type = "fhir"
#? url = "https://snowstorm.example.org/fhir"

# Terminology → provider routing. Keys are terminology ids or system URIs
# (matched case-insensitively, whole string); values name a provider above.
# An unmatched terminology goes to `default` (or the sole provider):
#? [terminology.external.routes]
#? "SNOMED-CT" = "snomed"
#? "http://snomed.info/sct" = "snomed"
#? "http://loinc.org" = "default"

# OAuth2 client-credentials clients the providers authenticate with:
#? [terminology.external.oauth2_clients.ts-client]
#? token_url = "https://idp.example.org/realms/ts/protocol/openid-connect/token"
#? client_id = "ferroehr-cdr"
#? client_secret = "..."        # or client_secret_file = "/run/secrets/ts-client"
#? scopes = ["system/*.read"]
#? refresh_leeway_secs = 30
#? auth_method = "client_secret_basic"   # client_secret_basic | client_secret_post

# ── [multimedia] — DV_MULTIMEDIA externalization to S3-compatible storage ─────
[multimedia]
enabled = false
threshold_bytes = 262144
#? endpoint = "http://127.0.0.1:8333"   # unset ⇒ AWS default resolution
bucket = "openehr-multimedia"
region = "us-east-1"
#? access_key_id = "..."
#? secret_access_key = "..."
#? secret_access_key_file = "/run/secrets/s3"
allow_http = false           # PROD: false (HTTPS S3)

# ── [audit] — IHE ATNA audit trail / System Log ──────────────────────────────
# ON by default with only the local store active: every deployment gets a
# queryable audit trail (the audit schema; served via the ITI-81 FHIR
# AuditEvent search) with nothing leaving the node. Forwarding to an external
# Audit Record Repository is opt-in per sink.
[audit]
enabled = true
#? enterprise_site_id = "site-42"
source_id = "ferroehr"
value_if_missing = "UNKNOWN"
suppress_login_events = true
fail_mode = "open"           # open | closed (closed: un-auditable ops answer 503)
resolve_subject = true
queue_capacity = 8192
#? server_host = "cdr-01.example"
# Access logging (NEN 7513, EHDS Art. 9): the header a caller declares its
# purpose of use in, the codes this deployment accepts (empty = record whatever
# is declared), and the legal basis recorded on every access.
purpose_header = "x-purpose-of-use"
purpose_codes = []
#? legal_basis = "gdpr-art-9-2-h"

# The local Audit Record Repository (the durability anchor).
[audit.store]
enabled = true
retention_days = 0           # 0 = keep forever; reaped hourly otherwise
                             # Floors and ceilings are jurisdictional, written
                             # in calendar years: three years in every EU
                             # Member State (EHDS Art. 9(2)), five years NL,
                             # one year CH, at most three years DE under
                             # sgb_v_309_controller. Boot refuses a horizon
                             # outside them. A day count is held to the most
                             # (floor) or fewest (ceiling) days the years can
                             # span, e.g. 1096 for the EU floor.
# The horizon in calendar years instead, compared exactly against those bounds
# and reaped with calendar arithmetic. Set it OR retention_days, never both. A
# declared SGB V § 309 controller in Germany sets 3: no day count meets both the
# three-year EHDS floor and the three-year § 309 ceiling.
#? retention_years = 3
# Set this only if the deploying organisation is, or acts for, one of the
# controllers SGB V § 307 names for a German telematics-infrastructure
# application. It caps retention_days at the three-year period of § 309 Abs. 1,
# after which Abs. 3 requires deletion unverzüglich — so a declared controller
# cannot keep records forever.
sgb_v_309_controller = false

# The EHDS priority category of every access (Annex II 3.2(c)): which
# categories each template, and failing that each root archetype, holds.
# Categories: patient-summary | eprescription | edispensation | imaging |
# test-results | discharge-report | national:<code> | none. EMPTY by default:
# FerroEHR ships no map, and an access the map cannot classify is recorded
# "unclassified" with its ids, never refused. Keys compare case-insensitively;
# an unknown spelling or an empty list refuses boot. The map's digest is on the
# boot line, on /management/info and on every access record, and the map is
# mirrored into the retention register, so a retention period can be keyed on
# a category.
[audit.categories.templates]
#? "International Patient Summary" = ["patient-summary"]
#? "Laboratory Report" = ["test-results"]
[audit.categories.archetypes]
#? "openEHR-EHR-COMPOSITION.report-result.v1" = ["test-results"]
#? "openEHR-EHR-COMPOSITION.encounter.v1" = ["none"]

# Classic ATNA feed: DICOM PS3.15 audit XML over syslog (IHE ITI-20).
[audit.syslog]
enabled = false
host = "localhost"
port = 514
transport = "udp"            # udp | tls ; PROD: tls
#? tls_ca_file = "/etc/ferroehr/arr-ca.pem"
#? tls_identity_cert_file = "/etc/ferroehr/client.pem"
#? tls_identity_key_file = "/etc/ferroehr/client.key"

# RESTful ATNA feed: FHIR R4 AuditEvent POSTs (IHE ITI-20 ATX:FHIR Feed).
[audit.fhir_feed]
enabled = false
url = "http://localhost:8080/fhir"   # POSTs {url}/AuditEvent; URL creds redacted
batch_size = 64
poll_interval_ms = 2000
max_retries = 3

# ── [privacy] — the clinical-side data-minimisation policy ────────────────────
# GDPR Art. 4(5) + Art. 25(2); the openEHR RM leaves the subject reference open
# and only advises against identifying party proxies, so these are FerroEHR
# rules over spec-conformant content.
[privacy]
# The pseudonymisation domains this deployment issues subject pseudonyms in.
# EMPTY (the default) leaves the subject-reference rule out of force: a
# namespace name is a deployment fact, not something a server can invent.
# Declaring one turns the rule on — from then on EHR_STATUS.subject.external_ref
# must name a listed namespace and carry a UUID as its id.value.
subject_namespaces = []
# Accept PARTY_IDENTIFIED / PARTY_RELATED carrying `name` or `identifiers` in
# clinical content (composer, participations, health_care_facility, feeder
# audit). Off by default, and announced at boot when on. OFF still accepts a
# PARTY_IDENTIFIED `name` — the RM class is the proxy for a party "other than
# the subject of the record", "Typically for health care providers", so a
# composer or performer name is provider identity. OFF refuses `identifiers`
# on either class (the national-identifier slot) and `name` on PARTY_RELATED,
# which is defined by its relationship to the subject and may be the subject.
allow_identified_parties_in_ehr = false

# The identifier scanner, run over every string leaf of every clinical write.
# CODE_PHRASE.code_string is skipped — its value space is a terminology code.
[privacy.identifier_scan]
mode = "strict"              # strict (refuse) | warn (accept + record)
# The national personal-identifier rules to scan for, by key. Every rule the
# build ships is active by default: clinical data crosses borders, and a false
# positive is a loud 422 an operator answers by narrowing this list, while a
# false negative is a national identifier stored indefinitely. Each rule
# transcribes the checksum its own issuing register publishes.
rules = ["ch-ahvn13", "ch-epd-pid", "de-kvnr", "fi-hetu", "gb-nhs-number", "nl-bsn", "no-fodselsnummer", "se-personnummer"]
# Extra patterns (Rust regular expressions) for the kinds no build can ship a
# rule for: local medical-record numbers, payer references, national
# postcode-plus-house-number forms. For example, a Dutch deployment adds
#   patterns = ["(^|[^0-9A-Za-z])[1-9][0-9]{3} ?[A-Z]{2}[^0-9A-Za-z]{1,3}[0-9]{1,4}([^0-9A-Za-z]|$)"]
# to refuse a postcode paired with a house number.
patterns = []

# ── [cohort] — cross-domain cohort queries ────────────────────────────────────
# Select a population in the demographic domain, resolve it to EHRs through the
# linkage domain, and run AQL over exactly those EHRs. No openEHR spec governs
# this — our own extension. OFF until a predicate is bound below: which
# demographic leaf may be selected on is a deployment fact about the archetypes
# in use, never something the server can infer.
[cohort]
# The distinct-EHR floor a result set must reach to be served; below it the rows
# are withheld and the response says so. 0 disables suppression.
small_cell_threshold = 5
# The largest cohort a predicate may select. A wider one is refused (422) rather
# than truncated: a silently shortened cohort is a wrong denominator.
max_cohort_size = 100000

# The allow-list. Only these five keys are bindable; each names the archetype of
# the ELEMENT's nearest archetyped ancestor, the ELEMENT's at-code, and how the
# caller's value is matched (text | text_prefix | coded | birth_date).
# `age_band` is the birth_date predicate and the only one.
#
# The archetype must be one the node model actually decomposes into a row: the
# party root, the CONTACT / ADDRESS / PARTY_IDENTITY / CAPABILITY containers
# nested in it, and any archetyped ITEM_TREE or CLUSTER under any of their
# `details`. The bindings below are EXAMPLES of the shape — a deployment names
# the archetypes and at-codes its own templates produce.
[cohort.predicates]
#? city          = { archetype = "openEHR-DEMOGRAPHIC-ADDRESS.address.v1", node = "at0012", kind = "text" }
#? postcode_area = { archetype = "openEHR-DEMOGRAPHIC-ADDRESS.address.v1", node = "at0014", kind = "text_prefix" }
#? sex           = { archetype = "openEHR-DEMOGRAPHIC-PERSON.person.v1", node = "at0017", kind = "coded" }
#? age_band      = { archetype = "openEHR-DEMOGRAPHIC-PERSON.person.v1", node = "at0010", kind = "birth_date" }
#? organisation  = { archetype = "openEHR-DEMOGRAPHIC-ORGANISATION.organisation.v1", node = "at0003", kind = "text" }

# ── [demographic] — the demographic domain ────────────────────────────────────
# National-identifier protection: the value leaves the versioned body for
# `party.national_identifier`, sealed under a per-domain AES-256-GCM key
# with an HMAC-SHA-256 digest beside it for equality lookup. GDPR Art. 32(1)(a)
# names encryption as an appropriate measure; UAVG Art. 46 and the Wabvpz bound
# what a BSN may be used for at all.
[demographic.identifier_protection]
# OFF by default: turning it on makes the key load-bearing for reading these
# identifiers back, which is a deployment decision with a runbook attached.
enabled = false
# The DV_IDENTIFIER `type` values to protect. Each must be registered in
# `demographic.identifier_scheme`; an unregistered code is a boot error rather
# than an identifier that silently stays in the clear.
schemes = ["nl-bsn"]
# The root key: 64 hex characters (32 bytes). Prefer `key_file`.
#? key = "…64 hex characters…"
#? key_file = "/run/secrets/ferroehr-identifier-key"

# ── [usage_report] — the installation report to FerroPULSE ────────────────────
# ON by default. At each process start and once a day the instance sends one
# small JSON report to FerroPULSE, the Cadasto-operated collector (EU): a random
# instance id, the version and commit, the licence grant type, the deployment
# kind, uptime, database and migration state, coarse CPU/memory buckets and, in
# the daily report, latency histograms per route-template group and for AQL.
# Never patient data, request paths, AQL text, licence ids or host names; the
# collector stores the source IP address and the country derived from it. One
# report per instance however many replicas run. Every boot logs one line
# saying whether it is on. Notice: https://ferroehr.eu/docs/latest/usage-report.html
[usage_report]
enabled = true          # false (FERROEHR__USAGE_REPORT__ENABLED=false) sends nothing
endpoint = "https://report.ferropulse.eu/v1/report"   # https only (http to a loopback host)
slow_aql_ms = 1000      # AQL executions above this count as slow in the report
# How the instance was deployed (helm | compose | binary | unknown). The Helm
# chart and the compose files set it; leave it unset elsewhere.
deployment = "unknown"
