# Clippy value-configuration (lint LEVELS live in the root Cargo.toml
# [workspace.lints] tables — the only legal home; this file carries behaviour).
# Reference: https://doc.rust-lang.org/clippy/lint_configuration.html
# `msrv` is deliberately NOT set: it defaults to the workspace `rust-version`
# (1.96); duplicating it here invites silent drift.

# ── test scoping: panicking assertion idioms are correct IN TESTS (Book ch11) ─
allow-unwrap-in-tests = true            # clippy::unwrap_used
allow-expect-in-tests = true            # clippy::expect_used
allow-panic-in-tests = true             # clippy::panic
allow-print-in-tests = true             # clippy::print_stdout / print_stderr
allow-indexing-slicing-in-tests = true  # clippy::indexing_slicing
check-incompatible-msrv-in-tests = true # clippy::incompatible_msrv reaches tests too
# allow-dbg-in-tests stays false (default): dbg! is never committed, tests included

# ── the ~15 API-shape lints this option suppresses report real findings here ──
#    The eight `openehr-*` crates DO publish to crates.io, so "no external API"
#    is not the reason. The reason is the line they publish on: `0.0.x`, where
#    cargo treats every patch as its own compatibility set
#    (https://doc.rust-lang.org/cargo/reference/semver.html), so no consumer
#    range spans a break — and any packaged-content change already bumps all
#    eight in the same pull request. The `ferroehr-*` crates are unpublished.
#    Nothing downstream is protected by hiding an API-shape finding, so they
#    stay visible. Re-adjudicate if the line ever graduates past `0.x`.
avoid-breaking-exported-api = false

# ── clippy::doc_markdown domain vocabulary (".." appends to the defaults) ────
doc-valid-idents = [
  "..",
  "openEHR", "EHRbase", "FerroEHR", "OpenAPI", "PostgreSQL", "JSONB",
  "AQL", "cADL", "dADL", "ODIN", "WebTemplate", "GraphQL",
  "FHIR", "SNOMED", "LOINC", "DICOM", "IANA", "OAuth2", "OpenID",
]

# ── type-level enforcement of the jiff time pin (docs/VERSIONS.md; sqlx's
#    chrono feature can leak chrono types into our signatures by accident) ────
disallowed-types = [
  { path = "serde_json::Value", reason = "typed carriers by default (#1694, owner 2026-08-03): an approved Value seam carries a scoped #[expect] naming its adjudicated family; everything else consumes the generated openehr-* types" },
  { path = "serde_json::Map", reason = "typed carriers by default (#1694, owner 2026-08-03): an approved Value seam carries a scoped #[expect] naming its adjudicated family; everything else consumes the generated openehr-* types" },
  { path = "chrono::DateTime", reason = "use jiff — the pinned time library (docs/VERSIONS.md)" },
  { path = "chrono::NaiveDateTime", reason = "use jiff — the pinned time library (docs/VERSIONS.md)" },
  { path = "chrono::NaiveDate", reason = "use jiff — the pinned time library (docs/VERSIONS.md)" },
  { path = "chrono::Utc", reason = "use jiff — the pinned time library (docs/VERSIONS.md)" },
]

# ── owner-ruled method bans (issue #1311, 2026-07-30); a legitimate exception
#    site carries a narrowly-scoped #[expect(clippy::disallowed_methods, reason)] ─
disallowed-methods = [
  { path = "std::time::SystemTime::now", reason = "wall-clock time comes from jiff (Zoned/Timestamp); std::time::Instant stays fine for latency measurement" },
  { path = "std::env::var", reason = "configuration flows through the config tree (ferroehr::config), never ad-hoc env reads" },
  { path = "std::env::var_os", reason = "configuration flows through the config tree (ferroehr::config), never ad-hoc env reads" },
  { path = "uuid::Uuid::new_v4", allow-invalid = true, reason = "DB keys are uuidv7 (Uuid::now_v7) for index locality; v4 only for non-key randomness with a scoped expect" },
  { path = "core::option::Option::as_slice", reason = "on Option<Vec<T>> this yields &[Vec<T>] (0-or-1 vectors), not &[T] — it compiles silently after a container-shape flip; spell it .as_deref().unwrap_or_default() (Vec::as_slice stays fine)" },
  { path = "core::option::Option::as_mut_slice", reason = "on Option<Vec<T>> this yields &mut [Vec<T>] (0-or-1 vectors), not &mut [T] — same shape-flip trap as Option::as_slice; match on the Option instead" },
]
