      Uploads the ADL 2 operational template openEHR-EHR-COMPOSITION.cnf_adl2_dv_count_range.v1.0.0. A server that
      already holds a template with that template_id refuses the upload with
      409, which leaves the same precondition in place.
    x-veredictum-cite:
      source: specs/openehr/ITS-REST/specifications/operations/definition_template_adl2_upload.yaml
      section: "description"
      quote: "Upload a new ADL2 operational template."
      report: 939
    steps:
      - stepId: upload
        description: Upload the template, or find it already there.
        operationId: $sourceDescriptions.definition.definition_template_adl2_upload
        parameters:
          - { name: Content-Type, in: header, value: text/plain }
        requestBody:
          contentType: text/plain
          payload: |-
            operational_template (adl_version=2.0.6; rm_release=1.0.2; build_uid=6EE8F2DC-0241-4ECE-A255-9157E6DB6C32; generated)
                openEHR-EHR-COMPOSITION.cnf_adl2_dv_count_range.v1.0.0

            language
                original_language = <[ISO_639-1::en]>

            description
                original_author = <
                    ["name"] = <"Veredictum contributors">
                >
                lifecycle_state = <"unmanaged">
                details = <
                    ["en"] = <
                        language = <[ISO_639-1::en]>
                        purpose = <"DV_COUNT whose magnitude is constrained to 10..20">
                    >
                >

            definition
                COMPOSITION[id1] matches {
                    category matches {
                        DV_CODED_TEXT[id2] matches {
                            defining_code matches {[at1]}
                        }
                    }
                    content cardinality matches {0..*; unordered} matches {
                        OBSERVATION[id3, openEHR-EHR-OBSERVATION.cnf_minimal.v1.0.0] occurrences matches {0..*} matches {
                            data matches {
                                HISTORY[id2] matches {
                                    events cardinality matches {1..*; unordered} matches {
                                        EVENT[id3] occurrences matches {0..*} matches {
                                            data matches {
                                                ITEM_TREE[id4] matches {
                                                    items cardinality matches {0..*; unordered} matches {
                                                        ELEMENT[id5] occurrences matches {0..*} matches {
                                                            value matches {
                                                                DV_COUNT[id6] matches {
                                                                    magnitude matches {|10..20|}
                                                                }
                                                            }
                                                        }
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
