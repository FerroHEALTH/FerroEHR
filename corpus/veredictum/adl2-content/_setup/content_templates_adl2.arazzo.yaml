# The ADL 2 operational templates the ADL 2 content workflows commit against,
# each uploaded once by its own workflow through the ADL 2 definition
# operation. A content workflow names the one it needs in `dependsOn`
# (Arazzo 1.1.0 Workflow Object). Each is a raw operational template written
# here (AM OPT2 master03-opt_raw.adoc §Artefact Structure): a COMPOSITION of
# category event holding an inlined minimal OBSERVATION down to one ELEMENT,
# with one constraint the content workflows vary. Every quote is copied
# verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: Content templates, ADL 2
  version: 0.1.0
  description: >-
    The ADL 2 operational templates whose constraint every ADL 2 content
    workflow shares.
sourceDescriptions:
  - name: definition
    url: ../../../specs/rest-oas/definition-validation.openapi.yaml
    type: openapi
workflows:
  - workflowId: upload_template-adl2_dv_count_range
