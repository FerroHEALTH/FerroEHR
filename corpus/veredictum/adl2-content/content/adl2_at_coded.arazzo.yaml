# Content committed against an at-coded ADL 2 operational template, as
# Arazzo 1.1.0 workflows over the released ITS-REST `-validation` OAS. The
# template is uploaded through the ADL 2 definition operation by the setup
# the workflows name, and each workflow commits one composition written here
# whose node identifiers are the template's at-codes. The at-code coding
# system is development text, so every workflow here is development-only.
# Every quote is copied verbatim from the named vendored file.
arazzo: 1.1.0
info:
  title: Content validation, at-coded ADL 2
  version: 0.1.0
  x-veredictum-section: structure-and-cardinality
  description: >-
    Commits a COMPOSITION whose archetype_node_id values are at-codes
    against an at-coded ADL 2 operational template, and reads it back with
    the at-codes preserved.
sourceDescriptions:
  - name: ehr
    url: ../../../specs/rest-oas/ehr-validation.openapi.yaml
    type: openapi
  - name: templates
    url: ../_setup/content_templates_adl2.arazzo.yaml
    type: arazzo
workflows:
  - workflowId: adl2-at_coded-accepted
    summary: "A COMPOSITION whose node identifiers are at-codes is created against an at-coded ADL 2 template"
    description: >-
      Commits a COMPOSITION against the at-coded ADL 2 operational template
      openEHR-EHR-COMPOSITION.cnf_adl2_at_coded.v1.0.0, whose HISTORY,
      EVENT, ITEM_TREE and ELEMENT carry the archetype_node_id values at0001
      to at0004 of the template. The template and the RM admit it, so the
      commit is answered 201 Created.
    dependsOn: [$sourceDescriptions.templates.upload_template-adl2_at_coded]
    x-veredictum-cite: &at_coded
      source: specs/openehr-development/specifications-AM/docs/UML/classes/org.openehr.am.aom2.adl_code_definitions.adoc
      section: ADL_CODE_DEFINITIONS Class
      quote: "openEHR systems must support at least the at-coded ADL2 archetypes."
    steps:
      - &create_ehr
        stepId: create-ehr
        description: Create the EHR the composition is committed to.
        operationId: $sourceDescriptions.ehr.ehr_create
        parameters:
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
          - condition: $response.body#/ehr_id/value != null
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "with the full resource in the body when `Prefer` header is `return=representation`"
        outputs:
          ehr_id: $response.body#/ehr_id/value
      - &commit
        stepId: commit
        description: Commit the at-coded composition and keep the version_uid of the full representation.
        operationId: $sourceDescriptions.ehr.composition_create
        parameters:
          - { name: ehr_id, in: path, value: $steps.create-ehr.outputs.ehr_id }
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
          - { name: Content-Type, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: {"_type": "COMPOSITION", "name": {"_type": "DV_TEXT", "value": "CNF ADL 2 at-coded"}, "archetype_node_id": "openEHR-EHR-COMPOSITION.cnf_adl2_at_coded.v1.0.0", "archetype_details": {"_type": "ARCHETYPED", "archetype_id": {"_type": "ARCHETYPE_ID", "value": "openEHR-EHR-COMPOSITION.cnf_adl2_at_coded.v1.0.0"}, "template_id": {"_type": "TEMPLATE_ID", "value": "openEHR-EHR-COMPOSITION.cnf_adl2_at_coded.v1.0.0"}, "rm_version": "1.0.2"}, "language": {"_type": "CODE_PHRASE", "terminology_id": {"_type": "TERMINOLOGY_ID", "value": "ISO_639-1"}, "code_string": "en"}, "territory": {"_type": "CODE_PHRASE", "terminology_id": {"_type": "TERMINOLOGY_ID", "value": "ISO_3166-1"}, "code_string": "NL"}, "category": {"_type": "DV_CODED_TEXT", "value": "event", "defining_code": {"_type": "CODE_PHRASE", "terminology_id": {"_type": "TERMINOLOGY_ID", "value": "openehr"}, "code_string": "433"}}, "composer": {"_type": "PARTY_SELF"}, "context": {"_type": "EVENT_CONTEXT", "start_time": {"_type": "DV_DATE_TIME", "value": "2026-01-01T10:00:00Z"}, "setting": {"_type": "DV_CODED_TEXT", "value": "other care", "defining_code": {"_type": "CODE_PHRASE", "terminology_id": {"_type": "TERMINOLOGY_ID", "value": "openehr"}, "code_string": "238"}}}, "content": [{"_type": "OBSERVATION", "name": {"_type": "DV_TEXT", "value": "Minimal observation"}, "archetype_node_id": "openEHR-EHR-OBSERVATION.cnf_minimal_at_coded.v1.0.0", "archetype_details": {"_type": "ARCHETYPED", "archetype_id": {"_type": "ARCHETYPE_ID", "value": "openEHR-EHR-OBSERVATION.cnf_minimal_at_coded.v1.0.0"}, "rm_version": "1.0.2"}, "language": {"_type": "CODE_PHRASE", "terminology_id": {"_type": "TERMINOLOGY_ID", "value": "ISO_639-1"}, "code_string": "en"}, "encoding": {"_type": "CODE_PHRASE", "terminology_id": {"_type": "TERMINOLOGY_ID", "value": "IANA_character-sets"}, "code_string": "UTF-8"}, "subject": {"_type": "PARTY_SELF"}, "data": {"_type": "HISTORY", "name": {"_type": "DV_TEXT", "value": "History"}, "archetype_node_id": "at0001", "origin": {"_type": "DV_DATE_TIME", "value": "2026-01-01T10:00:00Z"}, "events": [{"_type": "POINT_EVENT", "name": {"_type": "DV_TEXT", "value": "Any event"}, "archetype_node_id": "at0002", "time": {"_type": "DV_DATE_TIME", "value": "2026-01-01T10:00:00Z"}, "data": {"_type": "ITEM_TREE", "name": {"_type": "DV_TEXT", "value": "Tree"}, "archetype_node_id": "at0003", "items": [{"_type": "ELEMENT", "name": {"_type": "DV_TEXT", "value": "Value"}, "archetype_node_id": "at0004", "value": {"_type": "DV_TEXT", "value": "at-coded"}}]}}]}}]}
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_COMPOSITION.yaml
              section: "description"
              quote: "`201 Created` is returned when the COMPOSITION is successfully created."
              report: 945
        outputs:
          version_uid: $response.body#/uid/value

  - workflowId: adl2-at_coded-read_back
    summary: "A COMPOSITION committed against an at-coded ADL 2 template is read back with its at-codes"
    description: >-
      Commits the at-coded COMPOSITION of adl2-at_coded-accepted, then
      retrieves the committed version by its version_uid in canonical JSON.
      The read answers 200, and the HISTORY, EVENT, ITEM_TREE and ELEMENT
      carry the archetype_node_id values at0001 to at0004 they were
      committed with.
    dependsOn: [$sourceDescriptions.templates.upload_template-adl2_at_coded]
    x-veredictum-cite: *at_coded
    steps:
      - *create_ehr
      - *commit
      - stepId: read
        description: Retrieve the committed version by its version_uid in canonical JSON.
        operationId: $sourceDescriptions.ehr.composition_get
        parameters:
          - { name: ehr_id, in: path, value: $steps.create-ehr.outputs.ehr_id }
          - { name: uid_based_id, in: path, value: $steps.commit.outputs.version_uid }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 200
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/200_COMPOSITION_retrieved.yaml
              section: description
              quote: "`200 OK` is returned when the requested COMPOSITION is successfully retrieved."
          - context: $response.body
            type: jsonpath
            condition: "$.content[?@.archetype_node_id == 'openEHR-EHR-OBSERVATION.cnf_minimal_at_coded.v1.0.0' && @.data.archetype_node_id == 'at0001'].data.events[?@.archetype_node_id == 'at0002' && @.data.archetype_node_id == 'at0003'].data.items[?@.archetype_node_id == 'at0004' && @.value.value == 'at-coded']"
