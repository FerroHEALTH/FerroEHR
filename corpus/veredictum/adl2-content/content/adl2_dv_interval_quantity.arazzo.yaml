  - workflowId: adl2-dv_interval_quantity-validate_upper_lower-c_dv_quantity_tuple
    x-veredictum-control: adl2-dv_interval_quantity-validate_upper_lower-accepted
    summary: "DV_INTERVAL<DV_QUANTITY> against an ADL 2 template with limits [units, magnitude] matching [{\"Cel\"}, {|0.0..100.0|}]: a lower limit outside the magnitude interval is refused with 422"
    description: >-
      Commits a DV_INTERVAL<DV_QUANTITY> from -10 Cel to 100 Cel against the
      ADL 2 operational template whose ELEMENT.value is a
      DV_INTERVAL<DV_QUANTITY> with limits [units, magnitude]
      matching [{"Cel"}, {|0.0..100.0|}]. The body passes the published
      ITS-JSON schema and carries a lower limit outside the magnitude
      interval, so the commit is refused with 422 Unprocessable Entity.
    dependsOn: [$sourceDescriptions.templates.upload_template-adl2_dv_interval_quantity_celsius]
    x-veredictum-cite:
      source: specs/openehr/AM/docs/ADL2/master04.4-cadl_second_order.adoc
      section: "Tuple Constraints"
      quote: "The above defines constraints on `_units_` and `_magnitude_` together, as tuples such as `[{\"deg F\"}, {|32.0..212.0|}]` ."
      report: 946
