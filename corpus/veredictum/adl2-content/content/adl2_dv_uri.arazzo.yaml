          contentType: application/json
          payload: {"_type": "COMPOSITION", "name": {"_type": "DV_TEXT", "value": "CNF ADL 2 dv_uri_list"}, "archetype_node_id": "openEHR-EHR-COMPOSITION.cnf_adl2_dv_uri_list.v1.0.0", "archetype_details": {"_type": "ARCHETYPED", "archetype_id": {"_type": "ARCHETYPE_ID", "value": "openEHR-EHR-COMPOSITION.cnf_adl2_dv_uri_list.v1.0.0"}, "template_id": {"_type": "TEMPLATE_ID", "value": "openEHR-EHR-COMPOSITION.cnf_adl2_dv_uri_list.v1.0.0"}, "rm_version": "1.0.2"}, "language": {"_type": "CODE_PHRASE", "terminology_id": {"_type": "TERMINOLOGY_ID", "value": "ISO_639-1"}, "code_string": "en"}, "territory": {"_type": "CODE_PHRASE", "terminology_id": {"_type": "TERMINOLOGY_ID", "value": "ISO_3166-1"}, "code_string": "NL"}, "category": {"_type": "DV_CODED_TEXT", "value": "event", "defining_code": {"_type": "CODE_PHRASE", "terminology_id": {"_type": "TERMINOLOGY_ID", "value": "openehr"}, "code_string": "433"}}, "composer": {"_type": "PARTY_SELF"}, "context": {"_type": "EVENT_CONTEXT", "start_time": {"_type": "DV_DATE_TIME", "value": "2026-01-01T10:00:00Z"}, "setting": {"_type": "DV_CODED_TEXT", "value": "other care", "defining_code": {"_type": "CODE_PHRASE", "terminology_id": {"_type": "TERMINOLOGY_ID", "value": "openehr"}, "code_string": "238"}}}, "content": [{"_type": "OBSERVATION", "name": {"_type": "DV_TEXT", "value": "Minimal observation"}, "archetype_node_id": "openEHR-EHR-OBSERVATION.cnf_minimal.v1.0.0", "archetype_details": {"_type": "ARCHETYPED", "archetype_id": {"_type": "ARCHETYPE_ID", "value": "openEHR-EHR-OBSERVATION.cnf_minimal.v1.0.0"}, "rm_version": "1.0.2"}, "language": {"_type": "CODE_PHRASE", "terminology_id": {"_type": "TERMINOLOGY_ID", "value": "ISO_639-1"}, "code_string": "en"}, "encoding": {"_type": "CODE_PHRASE", "terminology_id": {"_type": "TERMINOLOGY_ID", "value": "IANA_character-sets"}, "code_string": "UTF-8"}, "subject": {"_type": "PARTY_SELF"}, "data": {"_type": "HISTORY", "name": {"_type": "DV_TEXT", "value": "History"}, "archetype_node_id": "id2", "origin": {"_type": "DV_DATE_TIME", "value": "2026-01-01T10:00:00Z"}, "events": [{"_type": "POINT_EVENT", "name": {"_type": "DV_TEXT", "value": "Any event"}, "archetype_node_id": "id3", "time": {"_type": "DV_DATE_TIME", "value": "2026-01-01T10:00:00Z"}, "data": {"_type": "ITEM_TREE", "name": {"_type": "DV_TEXT", "value": "Tree"}, "archetype_node_id": "id4", "items": [{"_type": "ELEMENT", "name": {"_type": "DV_TEXT", "value": "Value"}, "archetype_node_id": "id5", "value": {"_type": "DV_URI", "value": "https://openehr.org"}}]}}]}}]}
        successCriteria:
          - condition: $statusCode == 422
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/422.yaml
              section: "description"
              quote: "`422 Unprocessable Entity` is returned when the content type and syntax is correct, could be converted to a resource, but there are semantic validation errors, such as the underlying template is not known or is not validating the supplied resource."

  - workflowId: adl2-dv_uri-validate_open-accepted
    summary: "DV_URI against an ADL 2 template with any DV_URI: content the template admits is created"
    description: >-
      Commits a DV_URI of https://cabolabs.com against the ADL 2 operational
      template whose ELEMENT.value is a DV_URI with any DV_URI. The template
      and the RM admit it, so the commit is answered 201 Created.
    dependsOn: [$sourceDescriptions.templates.upload_template-adl2_dv_uri_open]
    x-veredictum-cite:
      source: specs/openehr/AM/docs/ADL2/master04.3-cadl_complex_types.adoc
      section: "\"Any\" Constraints"
      quote: "The meaning of this constraint is that in the data at runtime, the `_value_` property of `ELEMENT` must be of type `DV_QUANTITY` , but can have any value internally."
      report: 353
    steps:
      - stepId: create-ehr
        description: Create the EHR the composition is committed to.
        operationId: $sourceDescriptions.ehr.ehr_create
        parameters:
          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
        successCriteria:
          - condition: $statusCode == 201
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "`201 Created` is returned when the EHR has been successfully created,"
          - condition: $response.body#/ehr_id/value != null
            x-veredictum-cite:
              source: specs/openehr/ITS-REST/specifications/responses/201_EHR.yaml
              section: description
              quote: "with the full resource in the body when `Prefer` header is `return=representation`"
        outputs:
          ehr_id: $response.body#/ehr_id/value
