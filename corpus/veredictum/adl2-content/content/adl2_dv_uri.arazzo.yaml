          - { name: Prefer, in: header, value: return=representation }
          - { name: Accept, in: header, value: application/json }
          - { name: Content-Type, in: header, value: application/json }
        requestBody:
          contentType: application/json
          payload: {"_type": "COMPOSITION", "name": {"_type": "DV_TEXT", "value": "CNF ADL 2 dv_uri_open"}, "archetype_node_id": "openEHR-EHR-COMPOSITION.cnf_adl2_dv_uri_open.v1.0.0", "archetype_details": {"_type": "ARCHETYPED", "archetype_id": {"_type": "ARCHETYPE_ID", "value": "openEHR-EHR-COMPOSITION.cnf_adl2_dv_uri_open.v1.0.0"}, "template_id": {"_type": "TEMPLATE_ID", "value": "openEHR-EHR-COMPOSITION.cnf_adl2_dv_uri_open.v1.0.0"}, "rm_version": "1.0.2"}, "language": {"_type": "CODE_PHRASE", "terminology_id": {"_type": "TERMINOLOGY_ID", "value": "ISO_639-1"}, "code_string": "en"}, "territory": {"_type": "CODE_PHRASE", "terminology_id": {"_type": "TERMINOLOGY_ID", "value": "ISO_3166-1"}, "code_string": "NL"}, "category": {"_type": "DV_CODED_TEXT", "value": "event", "defining_code": {"_type": "CODE_PHRASE", "terminology_id": {"_type": "TERMINOLOGY_ID", "value": "openehr"}, "code_string": "433"}}, "composer": {"_type": "PARTY_SELF"}, "context": {"_type": "EVENT_CONTEXT", "start_time": {"_type": "DV_DATE_TIME", "value": "2026-01-01T10:00:00Z"}, "setting": {"_type": "DV_CODED_TEXT", "value": "other care", "defining_code": {"_type": "CODE_PHRASE", "terminology_id": {"_type": "TERMINOLOGY_ID", "value": "openehr"}, "code_string": "238"}}}, "content": [{"_type": "OBSERVATION", "name": {"_type": "DV_TEXT", "value": "Minimal observation"}, "archetype_node_id": "openEHR-EHR-OBSERVATION.cnf_minimal.v1.0.0", "archetype_details": {"_type": "ARCHETYPED", "archetype_id": {"_type": "ARCHETYPE_ID", "value": "openEHR-EHR-OBSERVATION.cnf_minimal.v1.0.0"}, "rm_version": "1.0.2"}, "language": {"_type": "CODE_PHRASE", "terminology_id": {"_type": "TERMINOLOGY_ID", "value": "ISO_639-1"}, "code_string": "en"}, "encoding": {"_type": "CODE_PHRASE", "terminology_id": {"_type": "TERMINOLOGY_ID", "value": "IANA_character-sets"}, "code_string": "UTF-8"}, "subject": {"_type": "PARTY_SELF"}, "data": {"_type": "HISTORY", "name": {"_type": "DV_TEXT", "value": "History"}, "archetype_node_id": "id2", "origin": {"_type": "DV_DATE_TIME", "value": "2026-01-01T10:00:00Z"}, "events": [{"_type": "POINT_EVENT", "name": {"_type": "DV_TEXT", "value": "Any event"}, "archetype_node_id": "id3", "time": {"_type": "DV_DATE_TIME", "value": "2026-01-01T10:00:00Z"}, "data": {"_type": "ITEM_TREE", "name": {"_type": "DV_TEXT", "value": "Tree"}, "archetype_node_id": "id4", "items": [{"_type": "ELEMENT", "name": {"_type": "DV_TEXT", "value": "Value"}, "archetype_node_id": "id5", "value": {"_type": "DV_URI", "value": "https://cabolabs.com"}}]}}]}}]}
