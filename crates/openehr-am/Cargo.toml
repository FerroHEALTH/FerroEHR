[package]
name = "openehr-am"
version = "0.0.75"
description = "openEHR AM Archetype Model, generated from BMM: generations v1_4 (AM 1.4.0, ADL 1.4) and v2_4 (AM 2.4.0, ADL 2; current)"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
documentation = "https://docs.rs/openehr-am"
readme = "README.md"
keywords = ["openehr", "archetype", "adl", "aom", "healthcare"]
categories = ["data-structures", "science"]
include = ["src/**", "README.md", "LICENSE-APACHE-2.0"]

[dependencies]
openehr-base = { path = "../openehr-base", version = "0.0.75" }
openehr-lang = { path = "../openehr-lang", version = "0.0.75" }
# Canonical-JSON (de)serialization is EMITTED manual `serde` impls on the spec
# types (`openehr-codegen -- emit-json`, into `src/json_serde.rs`) — never a
# derive. `serde_json` also carries the untyped `Value` fields the generator
# emits for cross-schema-`Any` slots.
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[lib]
# Generated doc comments are verbatim openEHR spec prose (indented examples,
# fenced snippets), not runnable Rust — behaviour tests live in *_impl.rs.
doctest = false
