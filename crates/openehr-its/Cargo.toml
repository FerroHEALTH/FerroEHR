[package]
name = "openehr-its"
version = "0.0.81"
description = "openEHR ITS (Implementation Technology Specifications): canonical JSON + canonical XML serialization of the RM, the generated ITS-REST 1.1.0 API contract, and the OPT 1.4 and AOM2 archetype XML codecs"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
documentation = "https://docs.rs/openehr-its"
readme = "README.md"
keywords = ["openehr", "serialization", "rest", "healthcare", "json"]
categories = ["encoding", "web-programming"]
include = ["src/**", "schemas/json/openehr_rm_1.1.0_all.json", "README.md", "LICENSE-APACHE-2.0"]

# EVERY dependency is optional and belongs to exactly one layer of the [features]
# graph below, so a browser consumer adds only the layers it reads.
[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# Canonical-JSON reads run through `serde_path_to_error`, so every refusal
# carries the full JSON path to the offending node (the 400-class wire body).
serde_path_to_error = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
# The generated `opt14` model keeps `StringDictionaryItem` groups in
# document order (XSD ordered sequence) — order-preserving map.
indexmap = { workspace = true, optional = true }
# The generated ITS-REST contract: an async_trait server trait + axum-typed DTOs.
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
http = { workspace = true, optional = true }
# The ITS-REST client runtime: the shipped `reqwest` engine, the base URL,
# percent-encoding of path and query parameters, HTTP Basic, and the retry
# budget over idempotent requests.
reqwest = { workspace = true, optional = true }
url = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
backon = { workspace = true, optional = true }
# The credential secret: redacted `Debug`, zeroed on drop.
secrecy = { workspace = true, optional = true }
# The generated XML (de)serializers impl the crate's ToXml/FromXml traits for the
# RM/BASE spec types, so these are real (non-dev) deps.
openehr-base = { path = "../openehr-base", version = "0.0.81", optional = true }
openehr-rm = { path = "../openehr-rm", version = "0.0.81", optional = true }
# The native canonical-JSON codec (`json_codec/generated`, emit-json) implements
# `ToJson` for EVERY generated spec type the `OpenEhrType` derive covers, so it
# spans all five spec crates (not just the RM/BASE the XML codec needs).
openehr-lang = { path = "../openehr-lang", version = "0.0.81", optional = true }
openehr-am = { path = "../openehr-am", version = "0.0.81", optional = true }
openehr-term = { path = "../openehr-term", version = "0.0.81", optional = true }

# The graph is layered so a consumer takes only the surfaces it reads, and so
# the openEHR content layers stay free of anything that needs a native platform.
#
# `default = ["full"]` — every surface.
#
# A `wasm32-unknown-unknown` consumer takes `default-features = false` plus
# `opt14`, which pulls `xml` → `json`: canonical JSON, canonical XML and OPT
# 1.4. The wasm selection is checked, not claimed: CI clippies the crate for
# that target on every code change.
#
# Three layers stay OUT of that selection, each for its dependency:
# `schema-validation` adds `jsonschema` and compiles in the 631 KiB vendored
# ITS-JSON RM schema; `rest-server` adds `axum` — the SERVER half of the
# ITS-REST contract, which a REST client never implements; `rest-client` adds
# `reqwest` — the CLIENT half. Both sit on `rest`, the contract itself (DTOs,
# param structs, route tables) over serde and `http` alone.
[features]
default = ["full"]
full = [
    "opt14",
    "xml",
    "json",
    "schema-validation",
    "rest-server",
    "rest-client",
]

# Canonical JSON (`json`, `json_codec`, `wire_validate`) over the five
# generated spec crates — the base every other layer builds on.
json = [
    "dep:serde",
    "dep:serde_json",
    "dep:serde_path_to_error",
    "dep:thiserror",
    "dep:uuid",
    "dep:indexmap",
    "dep:openehr-base",
    "dep:openehr-rm",
    "dep:openehr-lang",
    "dep:openehr-am",
    "dep:openehr-term",
]
# Canonical XML plus the AOM2 archetype XML codecs (`xml`, `aom2`, `aom2_model`).
xml = ["json", "dep:quick-xml"]
# The OPT 1.4 operational-template reader (`opt14`), an XML codec consumer.
opt14 = ["xml"]
# Validation against the compiled-in vendored ITS-JSON RM schema
# (`json::validate_canonical`) — the crate's only `jsonschema` user.
schema-validation = ["json", "dep:jsonschema"]
# The generated ITS-REST contract shared by both halves (`rest::generated`:
# DTOs, per-operation param structs, response headers structs, route tables),
# the `ApiError` type (`rest::runtime`) and the operation matcher over the
# route tables (`rest::routes`, percent-decoding its path parameters) — serde,
# `http` and `urlencoding`, never an HTTP engine.
rest = ["json", "dep:http", "dep:urlencoding"]
# The SERVER half: the per-group `#[async_trait]` server traits, the generated
# axum routers over them (`rest::generated::<group>::server`) with their
# runtime, and the `ApiError` rendering as the ITS-REST `Error` body.
rest-server = ["rest", "dep:axum", "dep:async-trait"]
# The CLIENT half: the per-group generated clients (`rest::generated::<group>::client`)
# over the hand-written runtime (`rest::client`: the `Transport` seam, the
# `reqwest` engine, credentials, the retry budget, the typed errors).
rest-client = [
    "rest",
    "dep:async-trait",
    "dep:reqwest",
    "dep:url",
    "dep:urlencoding",
    "dep:base64",
    "dep:backon",
    "dep:secrecy",
]

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true }      # the async runtime the client contract tests run on
tower.workspace = true            # `ServiceExt::oneshot`: drives a generated router without a socket
wiremock.workspace = true         # the ITS-REST client contract tests: one mock per documented response shape
insta.workspace = true   # canonical-output determinism snapshots (the contract gate)
testkit = { path = "../../tools/testkit" }   # the shared canonical-json-literals gate scanner (path-only: stripped at packaging)
sha2.workspace = true    # corpus manifest hashing for the determinism gate
[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
