[package]
name = "openehr-query"
version = "0.0.122"
description = "openEHR QUERY (AQL 1.1.0): hand-written lexer, parser, typed AST and canonical printer from the official grammar (no ANTLR runtime)"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
documentation = "https://docs.rs/openehr-query"
readme = "README.md"
keywords = ["openehr", "aql", "query", "parser", "healthcare"]
categories = ["parser-implementations", "science"]
include = ["src/**", "README.md", "LICENSE-APACHE-2.0"]

[dependencies]
logos.workspace = true
chumsky.workspace = true
thiserror.workspace = true

# Additive: the feature adds a module and changes no type the default build exposes.
[features]
default = []
# The `federation` module: the `FROM ENDPOINT` / `ORGANISATION` directive.
federation = []

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
