[package]
name = "openehr-term"
version = "0.0.86"
description = "openEHR TERM terminology data model, generated from BMM (generation v3_1 = TERM 3.1.0), plus the embedded official terminology XML bundle"
edition.workspace = true
rust-version.workspace = true
# The packaged terminology XML under `assets/` is openEHR's, redistributed
# verbatim under the CC-BY-SA 3.0 of its upstream repository
# (<https://github.com/openEHR/specifications-TERM/blob/master/LICENSE>), so the
# expression names it beside Apache-2.0 and the package ships its text.
license = "Apache-2.0 AND CC-BY-SA-3.0"
repository.workspace = true
documentation = "https://docs.rs/openehr-term"
readme = "README.md"
keywords = ["openehr", "terminology", "healthcare", "ehr", "vocabulary"]
categories = ["data-structures", "science"]
# `assets/schema/**` is deliberately absent. Those XSDs are read only by
# `tests/it/xsd_conformance.rs`, which is not packaged, and upstream ships one
# of them (`PropertyUnitData.xsd`) carrying an AGPL-3.0 header attributing it to
# ADL2-tools — inside a repository whose own LICENSE is CC-BY-SA 3.0
# (<https://github.com/openEHR/specifications-TERM/blob/master/LICENSE>).
# We vendor byte-identically by design, so the contradiction cannot be edited
# out; keeping the schemas out of the package removes it from the published
# artifact instead. The data files the crate actually embeds are listed below.
include = [
    "src/**",
    "assets/PROVENANCE.md",
    "assets/*.xml",
    "assets/*/openehr_terminology.xml",
    "README.md",
    "LICENSE-APACHE-2.0",
    "LICENSE-CC-BY-SA-3.0",
]

[dependencies]
openehr-base = { path = "../openehr-base", version = "0.0.86" }
# Canonical-JSON (de)serialization is EMITTED manual `serde` impls on the spec
# types (`openehr-codegen -- emit-json`, into `src/json_serde.rs`) — never a
# derive.
serde.workspace = true
# Hand-written terminology loader (bundle.rs): read-only XML DOM + error type.
roxmltree.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The XSD structural-conformance suite (tests/it) re-parses the vendored
# assets against the vendored schemas' rules.
roxmltree.workspace = true

[lints]
workspace = true

[lib]
# Generated doc comments are verbatim openEHR spec prose (indented examples,
# fenced snippets), not runnable Rust — behaviour tests live in *_impl.rs.
doctest = false
