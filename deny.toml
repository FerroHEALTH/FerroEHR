# cargo-deny configuration. Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# This is the ONLY advisory gate. `cargo deny check advisories` reads the same
# RustSec database `cargo audit` does and adds yanked/licenses/bans/sources, so
# no cargo-audit job exists and no second ignore list should either — one existed
# (`.cargo/audit.toml`), nothing read it, and it had already drifted to a
# different set of ids than this file.
#
# WHY THIS FILE AND AN OSV-BASED SCANNER DISAGREE, and which one to believe.
# `Cargo.lock` records the union of every dependency any feature combination
# COULD pull. Scanners that read the lock file — OSV, and therefore the OpenSSF
# Scorecard `Vulnerabilities` check — report advisories for crates our feature
# set never compiles. `cargo-deny` resolves features and does not, so where the
# two disagree in that direction cargo-deny is the more precise instrument and
# this file needs no entry.
#
# The worked example, kept because the next over-report is then diagnosed in a
# minute: RUSTSEC-2026-0235 (`rkyv` 0.7, out-of-bounds read) was reported by
# lock-file scanners for months. `rust_decimal` 1.42.1 declared BOTH
# `rkyv ^0.8.13` and `rkyv ^0.7.46` as optional dependencies; our features
# enabled neither, `cargo tree --workspace --all-features` found zero rkyv
# nodes, and the lock file still pinned 0.7.46 because `^0.7.46` cannot resolve
# above the vulnerable range. It was deliberately NOT ignored below — an ignore
# for an advisory this tool never raises records nothing and would silently
# start applying if the tool ever became lock-file-based. `rust_decimal` 1.43.0
# dropped the requirement, so rkyv left the lock file and the VEX statement was
# deleted rather than renewed.
#
# In the OTHER direction — an advisory that DOES fire here and is ignored with
# an adjudication — the OSV-based scanners stay red anyway: they consume
# neither this file nor the OpenVEX documents under security/vex/. That
# visibility is a feature, not a false positive to silence (#2406): the public
# warning stands until the advisory is truly ELIMINATED from the graph, which
# is what every ignore's DELETING EVENT below is for.
#
# THAT RULE IS MACHINE-ENFORCED, and so is its mirror — an ignore kept after the
# advisory stopped firing. cargo-deny raises `advisory-not-detected` for an
# `ignore` entry no crate in the graph matches, and
# `scripts/checks/advisory-exceptions.sh` runs the check with that diagnostic
# promoted to an error, so an exception resolved by a dependency upgrade fails
# the build instead of outliving the finding it describes.
[advisories]
version = 2
# Fail on any RustSec advisory. Add exceptions explicitly and dated.
yanked = "deny"
# EVERY ignore names the event that deletes it (#2406: adjudication is not
# elimination — an ignore is a standing liability driven to zero, re-checked
# at every dependency-bump cycle; the scheduled latest-deps lane is the
# reminder). The quick-xml pair (RUSTSEC-2026-0194/0195) was ELIMINATED
# rather than renewed: pprof's `flamegraph` feature (inferno ^0.11,
# quick-xml 0.26) is off and the SVG renders through a direct inferno 0.12.
ignore = [
  # 2026-08-13: Marvin attack timing sidechannel in `rsa`; no fixed release
  # exists upstream (0.9.10 is the latest, re-verified 2026-09-10). The
  # dependency-path argument lives in ONE place — the RUSTSEC-2023-0071
  # statement in security/vex/rust-advisories.toml, whose carrier/root claims
  # scripts/checks/vex-reachability.sh compares against the resolved graph —
  # never restated here, where nothing checks it. DELETING EVENT: the rsa 0.10
  # release (upgrade the day it ships).
  # https://rustsec.org/advisories/RUSTSEC-2023-0071
  { id = "RUSTSEC-2023-0071", reason = "no fix upstream; RSA verification only in the OIDC path, and the pgp signing path is off by default (digest mode) and key-algorithm-agnostic" },
  # 2026-07-15: `paste` (proc-macro) is archived/unmaintained. utoipa-axum 0.3
  # moved to `pastey` (2026-09-30), so the Leptos 0.8 family in the viewer is
  # the only carrier left. Compile-time-only token pasting, no runtime code,
  # no attack surface. DELETING EVENT: the first paste-free Leptos release.
  # https://rustsec.org/advisories/RUSTSEC-2024-0436
  { id = "RUSTSEC-2024-0436", reason = "compile-time proc-macro via the Leptos 0.8 family (viewer); no runtime surface" },
  # 2026-10-24 (#3965): crypto-bigint 0.5.5, timing variability in
  # operations meant to be constant-time; only 0.7.6 and later are fixed and
  # no release of pgp, cx448 or openidconnect leaves 0.5. The path argument
  # is the RUSTSEC-2026-0387 statement in security/vex/rust-advisories.toml.
  # DELETING EVENT: pgp and openidconnect releases on crypto-bigint 0.7.6 or
  # later (upgrade the day both ship).
  # https://rustsec.org/advisories/RUSTSEC-2026-0387
  { id = "RUSTSEC-2026-0387", reason = "ECDSA and Ed448 signing keys are refused at boot (#3965), so crypto-bigint 0.5 runs only over public values in verification" },
]

[licenses]
version = 2
# Permissive licences the project's own Business Source License 1.1 code may
# depend on. BUSL-1.1 itself is NOT in this list: it is the workspace's own
# licence and is admitted per member below, so a BUSL-licensed DEPENDENCY still
# fails the check (its production-use limits would bind our deployments).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # Boost Software License (OSI-approved, permissive): xxhash-rust via
  # leptos server_fn (the viewer, 2026-07-18).
  "BSL-1.0",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  # MIT No Attribution (borrow-or-share, via fluent-uri → sqlx).
  "MIT-0",
  # Community Data License Agreement — Permissive 2.0 (webpki-roots: the
  # Mozilla CA bundle data). Permissive, Apache-2.0-compatible.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
exceptions = [
  # inferno (the flamegraph renderer pprof's `flamegraph` feature uses) is
  # CDDL-1.0 — a file-scoped weak copyleft (like MPL-2.0): obligations attach
  # to inferno's own source files, which we consume unmodified as a build
  # dependency of the profiling instrument; nothing of ours is derivative.
  # Scoped exception, not a blanket allow (2026-08-04, issue #1861).
  { allow = ["CDDL-1.0"], crate = "inferno" },
  # openehr-term redistributes openEHR's terminology XML verbatim (upstream
  # specifications-TERM) beside its Apache-2.0 code, so it declares CC-BY-SA-3.0
  # too; scoped to that one crate. The application and tooling members are the
  # project's own code under the Business Source License 1.1 (owner decision
  # 2026-09-03), admitted one crate at a time so the identifier never becomes a
  # blanket allow for a dependency.
  { allow = ["CC-BY-SA-3.0"], crate = "openehr-term" },
  { allow = ["BUSL-1.1"], crate = "ferroehr" },
  { allow = ["BUSL-1.1"], crate = "ferroehr-rest" },
  { allow = ["BUSL-1.1"], crate = "ferroehr-server" },
  { allow = ["BUSL-1.1"], crate = "ferroehr-ext" },
  { allow = ["BUSL-1.1"], crate = "ferroehr-viewer" },
  { allow = ["BUSL-1.1"], crate = "openehr-codegen" },
  { allow = ["BUSL-1.1"], crate = "testkit" },
  { allow = ["BUSL-1.1"], crate = "docs-meta" },
  # The three hand-written spec engines carry the Business Source License
  # (owner decisions 2026-09-04 and 2026-09-24); the five generated model
  # crates and the openehr-its wire layer stay Apache-2.0.
  { allow = ["BUSL-1.1"], crate = "openehr-adl" },
  { allow = ["BUSL-1.1"], crate = "openehr-query" },
  { allow = ["BUSL-1.1"], crate = "openehr-sdt" },
  # FerroUI, the FerroHEALTH consoles' shared component library, is the same
  # Licensor's code under the same licence (owner decision 2026-10-18), taken
  # by the viewer alone.
  { allow = ["BUSL-1.1"], crate = "ferrohealth-ui" },
  # FerroSMART, the FerroHEALTH products' shared SMART and OAuth 2.0 crate, is
  # the same Licensor's code under the same licence; its client-credentials
  # client authenticates the outbound audit feed and policy service (owner
  # decision 2026-10-20, #3829).
  { allow = ["BUSL-1.1"], crate = "ferrohealth-smart" },
  # FerroAUDIT, the FerroHEALTH products' shared audit library, is the same
  # Licensor's code under the same licence: `ihe-atna` sends the ATNA trail and
  # writes the BALP AuditEvent, `ehds-logging` is the EHDS logging component
  # the access record is written through (owner decision 2026-10-20, #3887).
  { allow = ["BUSL-1.1"], crate = "ihe-atna" },
  { allow = ["BUSL-1.1"], crate = "ehds-logging" },
  # FerroBRIDGE's FHIR terminology client `ferrobridge-term` is the same
  # Licensor's code under the same licence: the CDR's one client of its
  # terminology server (owner decision 2026-10-24, #3085).
  { allow = ["BUSL-1.1"], crate = "ferrobridge-term" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path-only deps carry an implicit "*" version. The `ferroehr-*`
# application crates and the tools are unpublished and depend on the spec
# crates by bare path, which is fine and never reaches a registry. The eight
# PUBLISHED `openehr-*` crates do not rely on this: cargo refuses to package a
# path dependency without a version requirement, so each of their internal deps
# carries an explicit `version = "0.0.x"` bumped in lockstep. External wildcards
# stay denied either way.
allow-wildcard-paths = true
# Deny known-unmaintained or footgun crates here as they surface.
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
