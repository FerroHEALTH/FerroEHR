# All-features-on overlay: every optional integration enabled, autoscaling +
# separate management port + egress network policy + a mounted config file. Used
# as the "all-features" golden render and to exercise every template branch.
database:
  existingSecret: ferroehr-db
  existingSecretKey: FERROEHR__DB__URL
  # One credential per storage domain (#3343): the party pool, and the party
  # backup CronJob, read a secret the clinical side never mounts; the linkage
  # domain holds which party is the subject of which EHR, barred from both
  # domains it joins; the audit domain is the one a deployment most often moves
  # to a server of its own. Exercised here because a branch no overlay renders
  # is a branch no golden and no boot check ever sees.
  party:
    existingSecret: ferroehr-db-party
    existingSecretKey: FERROEHR__STORAGE__PARTY__URL
  linkage:
    existingSecret: ferroehr-db-linkage
    existingSecretKey: FERROEHR__STORAGE__LINKAGE__URL
  audit:
    existingSecret: ferroehr-db-audit
    existingSecretKey: FERROEHR__STORAGE__AUDIT__URL
  # Schema preparation spans every schema of a database, so a pod whose runtime
  # DSNs are domain-scoped roles cannot perform it on any of them. Same reason
  # as above — an unrendered branch is an unchecked one.
  migrateExistingSecret: ferroehr-db-migrate
  migrateExistingSecretKey: FERROEHR__DB__MIGRATE_URL

secrets:
  # 40 bytes of obvious filler. RFC 8725 §3.5 puts a 32-byte floor under a
  # keyed-MAC key and the server enforces it at boot, so a short "dev-hmac-secret"
  # renders fine and refuses to start. Low-entropy on purpose: it must read as a
  # fixture to a human and to a secret scanner alike.
  authOidcHmacSecret: ci-fixture-not-a-secret-0000000000000000
  signingKeyPassphrase: ci-fixture-not-a-secret-passphrase
  eventsUrl: amqps://user:pass@rabbitmq:5671/%2f
  auditFhirFeedUrl: https://arr:arr-password@arr.example.com/fhir
  multimediaAccessKeyId: AKIAEXAMPLE
  multimediaSecretAccessKey: s3-secret
  terminologyOauth2ClientSecrets:
    tx: tx-client-secret

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  grafanaDashboard:
    enabled: true

config:
  server:
    bind: "0.0.0.0:8080"
    base_path: /ferroehr/rest/openehr/v1
    swagger_ui: public
    cors_permissive: false
  db:
    max_connections: 10
    min_connections: 0
    acquire_timeout_secs: 30
  log:
    format: json
    filter: info,ferroehr=debug
  telemetry:
    otlp_endpoint: http://otel-collector:4317
    service_name: ferroehr
    environment: production
    traces_sample_ratio: 0.1
    metrics_push: true
  auth:
    enabled: true
    # No [[auth.basic.users]] here: a Basic user's Argon2id hash has no `*_file`
    # sibling in the server's config tree, so the only way to configure one
    # through this chart would be the ConfigMap — an offline cracking target in a
    # non-sensitive object. The chart refuses to render it; OIDC below is the
    # supported mechanism.
    oidc:
      issuer: https://keycloak.example.com/realms/ferroehr
      audiences: [ferroehr]
      # HS256, not the RS256 default, because this overlay carries
      # secrets.authOidcHmacSecret to exercise that route: the server binds the
      # accepted algorithm set to the key source (RFC 8725 §3.1), so a symmetric
      # key plus RS256 is refused as the algorithm-confusion setup it is.
      algorithms: [HS256]
  authz:
    rbac:
      enabled: true
      admin_role: ADMIN
      user_role: USER
    abac:
      enabled: true
      engine: cedar
      organization_claim: organization_id
      patient_claim: patient_id
      cedar:
        policy_dir: /etc/ferroehr
  admin:
    enabled: true
  smart:
    enabled: true
    # Required whenever SMART is on: the launch context's service URLs are
    # absolute, so the server has to be told the origin clients reach it at —
    # it cannot infer one from a request. Matches the ingress host below.
    public_base_url: https://ferroehr.example.com
    ehr_id_claim: ehrId
    patient_claim: patient
    # Published verbatim at /.well-known/smart-configuration, so these are
    # boot-validated rather than free text: absolute https endpoints, a
    # non-empty response/auth-method set, PKCE S256 (SMART App Launch §7.2),
    # and an `issuer` equal to auth.oidc.issuer above — one says where apps get
    # tokens, the other says which tokens this server accepts.
    endpoints:
      issuer: https://keycloak.example.com/realms/ferroehr
      jwks_uri: https://keycloak.example.com/realms/ferroehr/protocol/openid-connect/certs
      authorization_endpoint: https://keycloak.example.com/realms/ferroehr/protocol/openid-connect/auth
      token_endpoint: https://keycloak.example.com/realms/ferroehr/protocol/openid-connect/token
      token_endpoint_auth_methods_supported: [client_secret_basic, private_key_jwt]
      grant_types_supported: [authorization_code, client_credentials]
      response_types_supported: [code]
      code_challenge_methods_supported: [S256]
      scopes_supported: [openid, fhirUser, launch, "patient/*.rs"]
      capabilities: [launch-ehr, sso-openid-connect]
  management:
    enabled: true
    base_path: /management
    port: 9100
    endpoints:
      info: admin_only
      metrics: admin_only
      prometheus: public
      env: admin_only
      loggers: admin_only
  query:
    plan_cache_capacity: 256
    timeout_ms: 30000
  signing:
    enabled: true
    mode: pgp
    key_path: /etc/ferroehr/signing.asc
    verify_on_read: strict
  audit:
    enabled: true
    source_id: ferroehr-prod
    fail_mode: closed
    enterprise_site_id: site-1
    store:
      enabled: true
      # Five years in days: the default identifier rules name NL, whose
      # access-log floor is five years (Besluit vaststelling bewaartermijn
      # logging), and the server refuses a shorter retention at boot.
      retention_days: 1830
    syslog:
      enabled: true
      host: arr.example.com
      port: 6514
      transport: tls
    fhir_feed:
      enabled: true
      # url is a SecretUrl (its userinfo may carry ARR basic-auth credentials),
      # so it arrives as secrets.auditFhirFeedUrl, never through the ConfigMap.
  events:
    enabled: true
    exchange: ferroehr.events
    tls: true
  terminology:
    api_enabled: true
    external:
      # `enabled`, `fail_on_error` and the `default` provider are INJECTED by
      # the chart from the `terminology:` block below, which is why they are not
      # declared here: declaring the `default` provider beside the in-cluster
      # one is refused at render, because two answers to "which server resolves
      # a binding" is exactly the state that silently points resolution
      # somewhere the operator did not choose.
      providers:
        # A SECOND, operator-declared provider beside the injected default, so
        # the off-cluster provider shape — its own URL, its `operation`, its
        # OAuth2 client — still reaches a golden render.
        tx:
          type: fhir
          url: https://tx.example.com/fhir
          operation: validate_code
      # The route that makes `tx` reachable. Without it the provider is dead
      # configuration: an unmatched terminology falls back to the provider
      # named `default`, which the chart's wiring has taken for the in-cluster
      # FerroTERM, so nothing would ever call `tx`. The chart refuses that
      # combination, and this is the shape that satisfies it.
      routes:
        "http://loinc.org": tx
      # The client secret itself is secrets.terminologyOauth2ClientSecrets.tx;
      # the chart injects client_secret_file pointing at the mounted file.
      oauth2_clients:
        tx:
          token_url: https://idp.example.org/realms/ts/protocol/openid-connect/token
          client_id: ferroehr
          scopes: [tx.read]
  multimedia:
    enabled: true
    threshold_bytes: 262144
    endpoint: https://s3.example.com
    bucket: openehr-multimedia
    region: eu-west-1
    allow_http: false
  files:
    signing.asc: |
      -----BEGIN PGP PRIVATE KEY BLOCK-----
      (dev placeholder)
      -----END PGP PRIVATE KEY BLOCK-----

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: ferroehr.example.com
      paths:
        - path: /ferroehr
          pathType: Prefix
  tls:
    - secretName: ferroehr-tls
      hosts:
        - ferroehr.example.com

networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  # The strict posture: with this false, an ingressFrom that ever goes empty is a
  # refused render rather than a policy that quietly admits every source. This
  # overlay is where that combination is exercised.
  ingressAllowAll: false
  egress:
    enabled: true
    # The mandatory destination, through the typed key.
    database:
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      port: 5432
    # One raw rule per enabled integration — this overlay turns everything on, so
    # it carries the OTLP collector, the AMQP broker and the outbound HTTPS
    # destinations (OIDC issuer, terminology server, S3, the FHIR audit feed).
    rules:
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: otel-collector
        ports:
          - port: 4317
            protocol: TCP
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: rabbitmq
        ports:
          - port: 5671
            protocol: TCP
      - to:
          - ipBlock:
              cidr: 203.0.113.0/24
        ports:
          - port: 443
            protocol: TCP
          - port: 6514
            protocol: TCP

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ferroehr-s3

# The pre-install/pre-upgrade migration hook. Rendered here because a workload
# no value set renders is a workload no golden shows and no gate judges — the
# selector gate could not see this Job's pod at all until it did (#3197).
migrations:
  job:
    enabled: true
    existingSecret: ferroehr-migrator-dsn

# Per-domain logical backups, so every CronJob reaches a golden render and the
# restricted-profile gate — the claims are render fixtures, nothing provisions
# them here. Four DIFFERENT claim names: any two domains sharing a claim is
# refused. The fourth job is the audit one, which this overlay reaches because
# `database.audit.existingSecret` above gives that domain a database of its
# own; the clinical job then stops naming the audit schema.
backup:
  enabled: true
  timeZone: Europe/Amsterdam
  clinical:
    persistentVolumeClaim: ferroehr-backup-clinical
    # A read-only role on the clinical schemas — not the pool's
    # credential, which is revoked from the other domains and would dump only
    # part of the database.
    existingSecret: ferroehr-backup-clinical-dsn
  party:
    persistentVolumeClaim: ferroehr-backup-party
    existingSecret: ferroehr-backup-party-dsn
  linkage:
    # The narrowest of the three: this dump is the map that re-identifies a
    # pseudonymised record, so it gets its own claim and its own role.
    persistentVolumeClaim: ferroehr-backup-linkage
    existingSecret: ferroehr-backup-linkage-dsn
  audit:
    # The trail lives in its own database here, so nothing else would dump it.
    persistentVolumeClaim: ferroehr-backup-audit
    existingSecret: ferroehr-backup-audit-dsn

# FerroTERM beside the CDR — this overlay's contract is every optional
# integration on, and it is where the seed-only branch reaches a golden: no
# index claim, so the shaped seed is served alone and FERROTERM_INDEX is not
# rendered (the terminology overlay covers the claim branch). The CDR's egress
# policy above gains its rule to these pods from the chart rather than from
# `rules`, since the chart chose the destination.
terminology:
  enabled: true
  # Two replicas, so the multi-replica rule in deploy/helm/gates/restricted.jq
  # judges this workload's spread rather than exempting it, and the budget that
  # a drain has to respect reaches a golden render beside it. Both are keys an
  # operator sets together: a budget over one pod blocks its own drain.
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# FerroBRIDGE beside the CDR and FerroTERM, on the branches the bridge overlay
# leaves unrendered: a bearer credential, no mapping set, two replicas under a
# disruption budget, and an extra egress rule. The narrowed CDR policy above
# gains its rule admitting these pods from the chart.
bridge:
  enabled: true
  replicaCount: 2
  cdr:
    existingSecret: ferroehr-bridge-cdr
    auth: bearer
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  networkPolicy:
    ingressFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: integration
    extraEgress:
      - to:
          - ipBlock:
              cidr: 192.0.2.0/24
        ports:
          - protocol: TCP
            port: 443
