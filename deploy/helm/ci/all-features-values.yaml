# All-features-on overlay: every optional integration enabled, autoscaling +
# separate management port + egress network policy + a mounted config file. Used
# as the "all-features" golden render and to exercise every template branch.
database:
  existingSecret: ferroehr-db
  existingSecretKey: FERROEHR__DATABASE__URL
  # One credential per storage domain (#3343): the party pool, and the party
  # backup CronJob, read a secret the clinical side never mounts; the audit
  # domain is the one a deployment most often moves
  # to a server of its own. Exercised here because a branch no overlay renders
  # is a branch no golden and no boot check ever sees.
  party:
    existingSecret: ferroehr-db-party
    existingSecretKey: FERROEHR__DATABASE__PARTY__URL
  audit:
    existingSecret: ferroehr-db-audit
    existingSecretKey: FERROEHR__DATABASE__AUDIT__URL
  # Schema preparation spans every schema of a database, so a pod whose runtime
  # DSNs are domain-scoped roles cannot perform it on any of them. Same reason
  # as above — an unrendered branch is an unchecked one.
  migrateExistingSecret: ferroehr-db-migrate
  migrateExistingSecretKey: FERROEHR__DATABASE__MIGRATE_URL

secrets:
  # 40 bytes of obvious filler. RFC 8725 §3.5 puts a 32-byte floor under a
  # keyed-MAC key and the server enforces it at boot, so a short "dev-hmac-secret"
  # renders fine and refuses to start. Low-entropy on purpose: it must read as a
  # fixture to a human and to a secret scanner alike.
  signingKeyPassphrase: ci-fixture-not-a-secret-passphrase
  auditFhirFeedUrl: https://arr:arr-password@arr.example.com/fhir
  multimediaAccessKeyId: AKIAEXAMPLE
  multimediaSecretAccessKey: s3-secret
  terminologyClientSecret: tx-client-secret
  ehrIndexClientSecret: pix-client-secret

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  grafanaDashboard:
    enabled: true

config:
  # The chart has no default posture and refuses to render without one.
  deployment:
    profile: sandbox
  # The URL clients reach the server at, named once: the SMART baseUrl and
  # every SCIM location hang off it.
  server:
    public_base_url: https://ferroehr.example.com
  # The clinical domain FerroPIX mints pseudonyms in, and the grant the EHR
  # index asks it with; the chart injects the provider and the in-cluster
  # PIXm URL. The client secret is secrets.ehrIndexClientSecret.
  privacy:
    subject_namespaces: [urn:oid:2.999.7.1]
  telemetry:
    format: json
    filter: info,ferroehr=debug
    environment: production
    otlp:
      endpoint: http://otel-collector:4317
      sample_ratio: 0.1
  auth:
    # A token issuer, the mechanism a real deployment supplies; the server reads
    # its metadata and key set at boot and accepts asymmetric algorithms only.
    issuer:
      # One table per issuer: `kind` says whose tokens it signs, and a
      # persons token is admitted only through a client in
      # `first_party_clients`.
      - issuer: https://keycloak.example.com/realms/ferroehr
        kind: persons
        audience: [ferroehr]
        first_party_clients: [ferroehr-viewer]
      # The machines issuer FerroBRIDGE's client credentials tokens come from
      # (RFC 6749 §4.4): the CDR trusts its tokens, and bridge.cdr.oauth
      # names FerroBRIDGE's client at it.
      - issuer: https://machines.example.org/realms/ferroehr
        kind: machines
        audience: [ferroehr-machines]
    # The issuer's logins bind to the PERSON carrying their `sub` under this
    # identifier issuer.
    party:
      - issuer: https://keycloak.example.com/realms/ferroehr
        identifier_issuer: urn:example:ferroehr-login
        identifier_type: uuid
    # FerroEHR's product scope, which admits the ADMIN and DEMOGRAPHIC APIs.
    product_scope: __ferroehr.platform
    smart:
      # Serves the discovery document, built at boot from the [auth] issuer's
      # metadata, so it needs no endpoint list of its own.
      discovery: true
      demographic_clients: [ferroehr-mpi]
      patient_issuers: [https://keycloak.example.com/realms/ferroehr]
    # Who provisions is a scim_provision grant in the CDR, written through the
    # Demographic API; the table only serves the endpoint.
    scim: {}
  authz:
    party_binding:
      # The healthcare provider this deployment acts for (an example id
      # under the OID arc 2.999).
      provider: { issuer: "urn:oid:2.999.7.9", id: "all-features" }
      # The PERSON mapping SCIM provisions through: the binding key, userName
      # and externalId as three identifiers at one path, the name, and the
      # professional ROLE each User performs.
      person:
        template:
          - template_id: FerroEHR professional
            default: true
            key: { path: "/details[at0001]/items[at0001]", type: uuid }
            user_name: { path: "/details[at0001]/items[at0001]", type: scim_user_name }
            external_id: { path: "/details[at0001]/items[at0001]", type: scim_external_id }
        attribute:
          - scim: name.formatted
            oidc: name
            jit: true
            name: true
            path: { "FerroEHR professional": "/identities[at0002]/details[at0003]/items[at0004]" }
          - scim: emails[type eq "work"].value
            path: { "FerroEHR professional": "/contacts[at0005]/addresses[at0006]/details[at0007]/items[at0008]" }
      professional_role:
        template_id: FerroEHR professional role
    # FerroBRIDGE commits what $toopenehr maps, relaying the record of
    # another system, as the healthcare provider this deployment acts for.
    system_client:
      - issuer: https://machines.example.org/realms/ferroehr
        client_id: ferrobridge
        provider: { issuer: "urn:oid:2.999.7.9", id: "all-features" }
        origins: [relay]
    rbac:
      role_issuers: [https://keycloak.example.com/realms/ferroehr]
    # The operations the party store may grant: FerroBRIDGE reads the change
    # feed and Entra ID provisions under grants in the CDR.
    grants:
      allowed: [commit_composition, read_change_feed, scim_provision]
    abac:
      enabled: true
  # Microsoft Entra ID provisions the professionals through SCIM with a
  # token of the machines issuer; the logins of the persons issuer then bind
  # to the PERSON carrying their key under the same identifier issuer.
  management:
    enabled: true
    listen: "0.0.0.0:9100"
    endpoints:
      info: admin_only
      metrics: admin_only
      prometheus: public
      env: admin_only
      loggers: admin_only
  audit:
    source_id: ferroehr-prod
    fail_mode: closed
    enterprise_site_id: site-1
    store:
      # Five years in days: the default identifier rules name NL, whose
      # access-log floor is five years (Besluit vaststelling bewaartermijn
      # logging), and the server refuses a shorter retention at boot.
      retention: P1830D
    syslog:
      url: tls://arr.example.com:6514
    fhir_feed: {}
      # endpoint.url may carry ARR basic-auth credentials in its userinfo,
      # so it arrives as secrets.auditFhirFeedUrl, never through the ConfigMap.
  files:
    signing.asc: |
      -----BEGIN PGP PRIVATE KEY BLOCK-----
      (dev placeholder)
      -----END PGP PRIVATE KEY BLOCK-----
  pixm:
    assigning_authority: urn:oid:2.999.7.1
    endpoint:
      credentials:
        oauth:
          token_endpoint: https://idp.example.com/realms/pix/protocol/openid-connect/token
          client_id: ferroehr
          scope: system/Patient.rs
  api:
    openapi_ui: public
    admin: true
    terminology: true
  database:
    max_connections: 10
    min_connections: 0
  record:
    signing:
      mode: pgp
      key_file: /etc/ferroehr/signing.asc
      verify_on_read: strict
    query:
      timeout: "30000ms"
    multimedia:
      enabled: true
      threshold: "262144B"
      url: https://s3.example.com
      region: eu-west-1
  terminology:
    # `endpoint.url` and `on_error` are INJECTED by the chart from the
    # `terminology:` block below, which is why they are not declared here:
    # declaring the URL beside the in-cluster one is refused at render,
    # because two answers to "which server resolves a binding" is exactly the
    # state that silently points resolution somewhere the operator did not
    # choose. The grant is the operator's, so the OAuth2 shape still reaches
    # a golden render; its client secret is secrets.terminologyClientSecret,
    # and the chart injects client_secret_file pointing at the mounted file.
    endpoint:
      credentials:
        oauth:
          token_endpoint: https://idp.example.org/realms/ts/protocol/openid-connect/token
          client_id: ferroehr
          scope: tx.read

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: ferroehr.example.com
      paths:
        - path: /ferroehr
          pathType: Prefix
  tls:
    - secretName: ferroehr-tls
      hosts:
        - ferroehr.example.com

networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  # The strict posture: with this false, an ingressFrom that ever goes empty is a
  # refused render rather than a policy that quietly admits every source. This
  # overlay is where that combination is exercised.
  ingressAllowAll: false
  egress:
    enabled: true
    # The mandatory destination, through the typed key.
    database:
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      port: 5432
    # One raw rule per enabled integration — this overlay turns everything on, so
    # it carries the OTLP collector and the outbound HTTPS
    # destinations (OIDC issuer, terminology server, S3, the FHIR audit feed).
    rules:
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: otel-collector
        ports:
          - port: 4317
            protocol: TCP
      - to:
          - ipBlock:
              cidr: 203.0.113.0/24
        ports:
          - port: 443
            protocol: TCP
          - port: 6514
            protocol: TCP

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ferroehr-s3

# The pre-install/pre-upgrade migration hook. Rendered here because a workload
# no value set renders is a workload no golden shows and no gate judges — the
# selector gate could not see this Job's pod at all until it did (#3197).
migrations:
  job:
    enabled: true
    existingSecret: ferroehr-migrator-dsn

# Per-domain logical backups, so every CronJob reaches a golden render and the
# restricted-profile gate — the claims are render fixtures, nothing provisions
# them here. Three DIFFERENT claim names: any two domains sharing a claim is
# refused. The third job is the audit one, which this overlay reaches because
# `database.audit.existingSecret` above gives that domain a database of its
# own; the clinical job then stops naming the audit schema.
backup:
  enabled: true
  timeZone: Europe/Amsterdam
  clinical:
    persistentVolumeClaim: ferroehr-backup-clinical
    # A read-only role on the clinical schemas — not the pool's
    # credential, which is revoked from the other domains and would dump only
    # part of the database.
    existingSecret: ferroehr-backup-clinical-dsn
  party:
    persistentVolumeClaim: ferroehr-backup-party
    existingSecret: ferroehr-backup-party-dsn
  audit:
    # The trail lives in its own database here, so nothing else would dump it.
    persistentVolumeClaim: ferroehr-backup-audit
    existingSecret: ferroehr-backup-audit-dsn

# FerroTERM beside the CDR — this overlay's contract is every optional
# integration on, and it is where the seed-only branch reaches a golden: no
# index claim, so the shaped seed is served alone and FERROTERM__TERMINOLOGY__INDEX is not
# rendered (the terminology overlay covers the claim branch). The CDR's egress
# policy above gains its rule to these pods from the chart rather than from
# `rules`, since the chart chose the destination.
terminology:
  enabled: true
  # Two replicas, so the multi-replica rule in deploy/helm/gates/restricted.jq
  # judges this workload's spread rather than exempting it, and the budget that
  # a drain has to respect reaches a golden render beside it. Both are keys an
  # operator sets together: a budget over one pod blocks its own drain.
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# FerroBRIDGE beside the CDR and FerroTERM, on the branches the bridge overlay
# leaves unrendered: no mapping set, two replicas under a
# disruption budget, and an extra egress rule. The narrowed CDR policy above
# gains its rule admitting these pods from the chart.
bridge:
  enabled: true
  replicaCount: 2
  cdr:
    existingSecret: ferroehr-bridge-cdr
    oauth:
      issuer: https://machines.example.org/realms/ferroehr
      clientId: ferrobridge
      scope: system/composition-*.cruds system/template-*.r system/aql-*.rs
      audience: ferroehr-machines
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  networkPolicy:
    ingressFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: integration
    extraEgress:
      - to:
          - ipBlock:
              cidr: 192.0.2.0/24
        ports:
          - protocol: TCP
            port: 443

# FerroPIX, the IHE patient identity source the EHR index asks (the chart's
# default). Its PostgreSQL URL and sealing key come from Secrets the operator
# owns; the issuer carries no key material; the pseudonymisation domain names
# FerroEHR's client as its consumer, so FerroPIX mints the pseudonym on the
# first ask.
ferropix:
  database:
    existingSecret: ferropix-db
  dataKey:
    existingSecret: ferropix-data-key
  config:
    public_base_url: https://pix.example.com
    auth:
      issuer:
        - issuer: https://idp.example.com/realms/pix
          kind: machines
          audience: [https://pix.example.com/fhir]
    # The clients the issuer signs for that may act as a Patient Identity
    # Source.
    trust:
      issuer:
        - issuer: https://idp.example.com/realms/pix
          clients: [hospital-source]
    domain:
      - system: urn:oid:2.999.1.1
        name: Hospital
        kind: local
        source_client_id: hospital-source
    pseudonym_domain:
      - namespace: urn:oid:2.999.7.1
        name: Clinical domain
        consumer_client_id: ferroehr
