# A German deployment that is one of the SGB V § 307 controllers, which is the
# shape that needs the access-log horizon in calendar years: the EHDS floor
# (three years in every Member State) and the SGB V § 309 Abs. 1 ceiling (three
# years) leave no day count that satisfies both, so the horizon is
# `retention_years: 3`. The EHDS priority-category map it once carried is the
# audit category admin register now, written through the admin API once the
# server runs, so no chart value carries it.
#
# The identifier rules are narrowed to the German one on purpose: the shipped
# set names NL as well, whose five-year floor would refuse a three-year horizon.
#
# Otherwise the production-minimal overlay: an external-Secret DSN and an OIDC
# issuer, no key material.
database:
  existingSecret: ferroehr-db
  existingSecretKey: FERROEHR__DATABASE__URL

config:
  # The chart has no default posture and refuses to render without one.
  deployment:
    profile: sandbox
  # The in-instance EHR index, the opt-in of a FerroEHR run on its own:
  # this overlay renders another surface and runs no identity source.
  auth:
    issuer:
      # One table per issuer: `kind` says whose tokens it signs, and a
      # persons token is admitted only through a client the CDR
      # grants `sign_in_persons`.
      - issuer: https://idp.example.com/realms/ferroehr
        kind: persons
        audience: [ferroehr]
    # The issuer's logins bind to the PERSON carrying their `sub` under this
    # identifier issuer.
    party:
      - issuer: https://idp.example.com/realms/ferroehr
        identifier_issuer: urn:example:ferroehr-login
        identifier_type: uuid
  authz:
    rbac:
      role_issuers: [https://idp.example.com/realms/ferroehr]
    party_binding:
      # The healthcare provider this deployment acts for (an example id
      # under the OID arc 2.999).
      provider: { issuer: "urn:oid:2.999.7.9", id: "audit-categories" }
      # The professional PERSON of the default party mapping, its key written
      # under the identifier_type the [[auth.party]] table above looks logins
      # up under, or no login of the issuer binds; the rest of the mapping is
      # the default.
      person:
        template:
          - template_id: openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1.0.0
            default: true
            key: { path: "/details[id2]/items[id3]", type: uuid }
            user_name: { path: "/details[id2]/items[id3]", type: scim_user_name }
            external_id: { path: "/details[id2]/items[id3]", type: scim_external_id }
  privacy:
    identifier_scan:
      rules: [de-kvnr]
  audit:
    store:
      retention: P3Y
      sgb_v_309_controller: true
  record:
    subject_index: local

# No FerroPIX beside it: the local EHR index above.
ferropix:
  enabled: false
