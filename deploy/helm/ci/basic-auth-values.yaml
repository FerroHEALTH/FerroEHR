# A Basic-auth deployment, which is the mount-heavy shape: the user's Argon2id hash
# arrives through `secrets:` and the chart injects `password_hash_file` into the
# rendered TOML, so the hash is in neither the ConfigMap nor the environment.
#
# This replaced an earlier "config-in-secret" case. That case existed because
# `password_hash` had no `*_file` sibling and therefore forced the whole rendered
# ferroehr.toml into the Secret; with `password_hash_file` in the server, no secret
# the chart models is unroutable any more, so that branch has no reachable input.
# It is still exercised — by the secret-leak gate in validate.sh, which probes it
# with a secret-shaped key that does not exist in the config tree at all.
database:
  existingSecret: ferroehr-db
  existingSecretKey: FERROEHR__DATABASE__URL

secrets:
  basicUserPasswordHashes:
    # The Argon2id hash of the password "ferroehr" — the same published
    # development fixture docker/ferroehr.dev.toml and the quickstart compose
    # file ship, reused here so no new credential-shaped string enters the tree.
    # It has to be a REAL PHC string: the server parses every password_hash at
    # boot and refuses the file otherwise, so a "$argon2id$…$hash" placeholder
    # renders fine and deploys nothing.
    clinician: "$argon2id$v=19$m=19456,t=2,p=1$ZmVycm9laHJEZXZTYWx0$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"

config:
  # The chart has no default posture and refuses to render without one.
  deployment_profile: sandbox
  # The in-instance EHR index, the opt-in of a FerroEHR run on its own:
  # this overlay renders another surface and runs no identity source.
  ehr_index:
    provider: local
  auth:
    enabled: true
    # The issuer the Basic users bind under. It signs nothing: its key set,
    # which every FerroEHR image carries, is the public half of a key pair
    # whose private key was discarded, for local lanes only.
    issuer:
      - issuer: https://basic-users.ferroehr.invalid
        kind: persons
        audience: [ferroehr-basic-users]
        jwks_file: /opt/sandbox-posture/basic-users-jwks.json
      # The machines issuer of the SCIM client that provisions `clinician`
      # (docs/conformance/party/scim/README.md: COMMITTED TEST key, never
      # production); its public key set is `files.scim-jwks.json` below.
      - issuer: https://scim.ferroehr.invalid
        kind: machines
        audience: [ferroehr-scim]
        token_types: [at+jwt]
        jwks_file: /etc/ferroehr/scim-jwks.json
    party:
      - issuer: https://basic-users.ferroehr.invalid
        identifier_issuer: urn:ferroehr:basic-user
        identifier_type: login
    basic:
      users:
        # No password_hash here — only the identity and the scopes. The hash is
        # a secret and lives in `secrets:` above.
        - user: clinician
          scopes: [user/composition-*.cruds, user/template-*.cruds, user/aql-*.cruds, __ferroehr.platform]
          roles: [USER]
  authz:
    party_binding:
      # The healthcare provider this deployment acts for (an example id
      # under the OID arc 2.999).
      provider: { issuer: "urn:oid:2.999.7.9", id: "basic-auth" }
      basic_user:
        - user: clinician
          key_issuer: urn:ferroehr:basic-user
          key: clinician
      # The party mapping over the professional PERSON and ROLE pair
      # `definitions.files` loads before the server starts.
      person:
        template:
          - template_id: openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1.0.0
            default: true
            key: { path: "/details[id2]/items[id3]", type: login }
            user_name: { path: "/details[id2]/items[id3]", type: scim_user_name }
            external_id: { path: "/details[id2]/items[id3]", type: scim_external_id }
      professional_role:
        template_id: openEHR-DEMOGRAPHIC-ROLE.healthcare_professional.v1.0.0
  # The SCIM endpoint `clinician` is provisioned through before the deploy
  # probe logs in (scripts/deploy-probes/kubernetes.sh).
  scim:
    enabled: true
    public_base_url: http://127.0.0.1:18081
    client:
      - issuer: https://scim.ferroehr.invalid
        client_id: basic-users
        scope: ferroehr/scim
        binding_issuer: urn:ferroehr:basic-user
  files:
    scim-jwks.json: |
      {
        "keys": [
          {
            "kty": "RSA",
            "kid": "scim-test",
            "use": "sig",
            "alg": "RS256",
            "n": "vgOrk9QbohTB1FlxrUrvS-CUvC6tIbIgTzvh-Y0whaMhBqyAmrMDvUMzfAAUGzNbrRuibj_ysB0XQWSOMsv4pkxQc2vOxxsbroenbeSi2AaQLjZegenAeNKIyb02-FVb6YTCjewxpxHeUNLycZOmtUFgwwr80sA5VcAlcGCoBb73Boy04v9-vi_oEIyH8EJNAI0wzdhkx-xAJnwdbLj5XMnkFQM8cozWs89Vlooxid29nqiae6mwTwtJSTwT7awkwAq3lHswB1WCcQRDD2UW_c9U2hxlMckH2MldwsyL1WIVob3SQf9VGPS-qpbNwl9r5bCdhIUkLG88ojcoCp6f-w",
            "e": "AQAB"
          }
        ]
      }

# No FerroPIX beside it: the local EHR index above.
ferropix:
  enabled: false

# The professional PERSON and ROLE templates the party mapping names, stored
# by the init container before the server starts: copies of
# deploy/definitions/professional/ (CC-BY-SA 3.0, adapted from openEHR CKM
# archetypes; that directory's PROVENANCE.md names each source and change),
# held equal to the files by a test of the loader.
definitions:
  files:
    - name: openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1.0.0.adls
      content: |
        archetype (adl_version=2.0.6; rm_release=1.1.0)
            openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1.0.0

        language
            original_language = <[ISO_639-1::en]>

        description
            original_author = <
                ["name"] = <"FerroEHR">
                ["organisation"] = <"Cadasto B.V.">
            >
            lifecycle_state = <"unmanaged">
            details = <
                ["en"] = <
                    language = <[ISO_639-1::en]>
                    purpose = <"A healthcare professional's PERSON, whose login identifiers bind the person to their sign-ins.">
                    use = <"Adapted from the openEHR CKM archetypes the derived_from entry names: the person's identifiers in details, the name in identities and a work email in contacts, every element optional so a person provisioned without one is complete.">
                    copyright = <"© openEHR Foundation">
                >
            >
            other_details = <
                ["licence"] = <"This work is licensed under the Creative Commons Attribution-ShareAlike 3.0 License. To view a copy of this license, visit http://creativecommons.org/licenses/by-sa/3.0/.">
                ["derived_from"] = <"openEHR-DEMOGRAPHIC-PERSON.person.v0, openEHR-DEMOGRAPHIC-CLUSTER.person_identifier.v0, openEHR-DEMOGRAPHIC-PARTY_IDENTITY.person_name.v0, openEHR-DEMOGRAPHIC-ADDRESS.electronic_communication.v0 (openEHR CKM)">
            >

        definition
            PERSON[id1] matches {
                details matches {
                    ITEM_TREE[id2] matches {
                        items matches {
                            ELEMENT[id3] occurrences matches {0..*} matches {
                                value matches { DV_IDENTIFIER[id13] }
                            }
                        }
                    }
                }
                identities matches {
                    PARTY_IDENTITY[id4] matches {
                        details matches {
                            ITEM_TREE[id5] matches {
                                items matches {
                                    ELEMENT[id6] occurrences matches {0..1} matches {
                                        value matches { DV_TEXT[id14] }
                                    }
                                    ELEMENT[id7] occurrences matches {0..1} matches {
                                        value matches { DV_TEXT[id15] }
                                    }
                                    ELEMENT[id8] occurrences matches {0..1} matches {
                                        value matches { DV_TEXT[id16] }
                                    }
                                }
                            }
                        }
                    }
                }
                contacts matches {
                    CONTACT[id9] occurrences matches {0..1} matches {
                        addresses matches {
                            ADDRESS[id10] matches {
                                details matches {
                                    ITEM_TREE[id11] matches {
                                        items matches {
                                            ELEMENT[id12] occurrences matches {0..1} matches {
                                                value matches { DV_TEXT[id17] }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }

        terminology
            term_definitions = <
                ["en"] = <
                    ["id1"] = <text = <"Healthcare professional"> description = <"A person who provides healthcare.">>
                    ["id2"] = <text = <"Person identifiers"> description = <"The identifiers of the person.">>
                    ["id3"] = <text = <"Identifier main data"> description = <"An identifier of the person, such as a login identifier.">>
                    ["id4"] = <text = <"Person name"> description = <"The name of the person.">>
                    ["id5"] = <text = <"Name"> description = <"The structure of the name.">>
                    ["id6"] = <text = <"Full name"> description = <"The name as it is written in full.">>
                    ["id7"] = <text = <"Given name"> description = <"The given name of the person.">>
                    ["id8"] = <text = <"Family name"> description = <"The family name of the person.">>
                    ["id9"] = <text = <"Contacts"> description = <"The contacts of the person.">>
                    ["id10"] = <text = <"Electronic communication"> description = <"An electronic address of the person.">>
                    ["id11"] = <text = <"Electronic communication details"> description = <"The structure of the address.">>
                    ["id12"] = <text = <"Email address"> description = <"The work email address of the person.">>
                >
            >
    - name: openEHR-DEMOGRAPHIC-ROLE.healthcare_professional.v1.0.0.adls
      content: |
        archetype (adl_version=2.0.6; rm_release=1.1.0)
            openEHR-DEMOGRAPHIC-ROLE.healthcare_professional.v1.0.0

        language
            original_language = <[ISO_639-1::en]>

        description
            original_author = <
                ["name"] = <"FerroEHR">
                ["organisation"] = <"Cadasto B.V.">
            >
            lifecycle_state = <"unmanaged">
            details = <
                ["en"] = <
                    language = <[ISO_639-1::en]>
                    purpose = <"The professional ROLE a healthcare professional's PERSON performs, which makes the person bindable.">
                    use = <"Adapted from the openEHR CKM archetype the derived_from entry names, with its name the only content and that optional.">
                    copyright = <"© openEHR Foundation">
                >
            >
            other_details = <
                ["licence"] = <"This work is licensed under the Creative Commons Attribution-ShareAlike 3.0 License. To view a copy of this license, visit http://creativecommons.org/licenses/by-sa/3.0/.">
                ["derived_from"] = <"openEHR-DEMOGRAPHIC-ROLE.individual_provider.v0, openEHR-DEMOGRAPHIC-PARTY_IDENTITY.person_name.v0 (openEHR CKM)">
            >

        definition
            ROLE[id1] matches {
                identities matches {
                    PARTY_IDENTITY[id2] matches {
                        details matches {
                            ITEM_TREE[id3] matches {
                                items matches {
                                    ELEMENT[id4] occurrences matches {0..1} matches {
                                        value matches { DV_TEXT[id5] }
                                    }
                                }
                            }
                        }
                    }
                }
            }

        terminology
            term_definitions = <
                ["en"] = <
                    ["id1"] = <text = <"Healthcare professional role"> description = <"The role of a person who provides healthcare.">>
                    ["id2"] = <text = <"Role name"> description = <"The name of the role.">>
                    ["id3"] = <text = <"Name"> description = <"The structure of the name.">>
                    ["id4"] = <text = <"Full name"> description = <"The name of the role as it is written in full.">>
                >
            >
