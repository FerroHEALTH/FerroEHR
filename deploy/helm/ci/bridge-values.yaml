# The FerroBRIDGE overlay: the CDR, FerroTERM and FerroBRIDGE, all three
# rendered. Without it `bridge` is a code path no golden, no restricted-profile
# gate and no selector gate ever sees. FerroTERM is on so the render carries
# FerroBRIDGE's [terminology] wiring, its egress rule to FerroTERM and
# FerroTERM's ingress rule admitting it.
#
# The Basic-auth shape is reused verbatim from basic-auth-values.yaml so no new
# credential-shaped string enters the tree. FerroBRIDGE's own credential is a
# Secret NAME: the chart never takes the credential as a value.
database:
  existingSecret: ferroehr-db
  existingSecretKey: FERROEHR__DB__URL

secrets:
  basicUserPasswordHashes:
    clinician: "$argon2id$v=19$m=19456,t=2,p=1$ZmVycm9laHJEZXZTYWx0$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"

config:
  # The chart has no default posture and refuses to render without one.
  deployment_profile: sandbox
  # The in-instance EHR index, the opt-in of a FerroEHR run on its own:
  # this overlay renders another surface and runs no identity source.
  ehr_index:
    provider: local
  auth:
    enabled: true
    # The issuer the Basic users bind under. It signs nothing: its key set,
    # which every FerroEHR image carries, is the public half of a key pair
    # whose private key was discarded, for local lanes only.
    issuer:
      - issuer: https://basic-users.ferroehr.invalid
        kind: persons
        audience: [ferroehr-basic-users]
        jwks_file: /opt/sandbox-posture/basic-users-jwks.json
    party:
      - issuer: https://basic-users.ferroehr.invalid
        identifier_issuer: urn:ferroehr:basic-user
        identifier_type: login
    basic:
      users:
        - user: clinician
          scopes: [user/composition-*.cruds, user/template-*.cruds, user/aql-*.cruds, __ferroehr.platform]
          roles: [ADMIN]
  authz:
    party_binding:
      # The healthcare provider this deployment acts for (an example id
      # under the OID arc 2.999).
      provider: { issuer: "urn:oid:2.999.7.9", id: "bridge" }
      basic_user:
        - user: clinician
          key_issuer: urn:ferroehr:basic-user
          key: clinician

terminology:
  enabled: true

bridge:
  enabled: true
  cdr:
    existingSecret: ferroehr-bridge-cdr
  # A ConfigMap NAME and two of its keys: the chart mounts each key on its own,
  # which is the branch this overlay exists to render.
  mappings:
    existingConfigMap: ferroehr-bridge-mappings
    files:
      - blood_pressure.context.yml
      - blood_pressure.yml
  # A mapping set turns the FHIRconnect operations on, which FerroBRIDGE starts
  # only with `[auth]` naming an issuer and an audience.
  config:
    auth:
      issuer: https://idp.example.org
      audience: [https://bridge.example.org/fhir]
    operations:
      composition_language: en
      composition_territory: NL
  networkPolicy:
    ingressFrom:
      - podSelector:
          matchLabels:
            ferrobridge.example/client: "true"

# No FerroPIX beside it: the local EHR index above.
ferropix:
  enabled: false
