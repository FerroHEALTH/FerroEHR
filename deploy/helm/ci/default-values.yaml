# Minimal realistic production overlay: chart defaults (all optional
# integrations OFF) plus the only two things every real deployment must supply —
# the app-role DSN from an existing Secret, and an identity provider. Used as
# the "default" golden render, and booted against the image by
# deploy/helm/ci/boot-check.sh.
#
# Nothing here is a credential. The DSN comes from a Secret the operator already
# owns, and the issuer below carries no key material at all: the server reads
# the issuer's metadata and key set at boot, so an issuer URL and the audience
# this deployment answers to are the whole configuration.
database:
  existingSecret: ferroehr-db
  existingSecretKey: FERROEHR__DB__URL

config:
  auth:
    # `auth.enabled` is true in the chart defaults and a server with no
    # mechanism refuses to boot (RFC 9110 §11.6.1 — a 401 challenge must name a
    # scheme the server implements), so an overlay that claims to be
    # production-minimal has to name one. An IdP is the mechanism a real
    # deployment supplies; Basic would mean shipping a password hash, which
    # this file has no business carrying.
    issuer: https://idp.example.com/realms/ferroehr
    audience: [ferroehr]
  # The clinical domain FerroPIX mints pseudonyms in, and the grant the EHR
  # index asks it with; the chart injects the provider and the in-cluster
  # PIXm URL. The client secret is secrets.ehrIndexClientSecret.
  privacy:
    subject_namespaces: [urn:oid:2.999.7.1]
  ehr_index:
    assigning_authority: urn:oid:2.999.7.1
    oauth:
      token_endpoint: https://idp.example.com/realms/pix/protocol/openid-connect/token
      client_id: ferroehr
      scope: system/Patient.rs

# FerroPIX takes only authenticated calls, so the grant needs its client
# secret: the one fixture in this file, low-entropy on purpose.
secrets:
  ehrIndexClientSecret: ci-fixture-not-a-secret

# FerroPIX, the IHE patient identity source the EHR index asks (the chart's
# default). Its PostgreSQL URL and sealing key come from Secrets the operator
# owns; the issuer carries no key material; the pseudonymisation domain names
# FerroEHR's client as its consumer, so FerroPIX mints the pseudonym on the
# first ask.
ferropix:
  database:
    existingSecret: ferropix-db
  dataKey:
    existingSecret: ferropix-data-key
  config:
    server:
      public_base_url: https://pix.example.com
    auth:
      audience: [https://pix.example.com/fhir]
      issuer:
        - issuer: https://idp.example.com/realms/pix
          clients: [hospital-source]
    domain:
      - system: urn:oid:2.999.1.1
        name: Hospital
        kind: local
        source_client_id: hospital-source
    pseudonym_domain:
      - namespace: urn:oid:2.999.7.1
        name: Clinical domain
        consumer_client_id: ferroehr
