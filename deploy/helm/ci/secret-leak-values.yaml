# Secret-leak gate overlay (deploy/helm/validate.sh, step "secret-leak gate").
#
# Every secret this chart can carry, set to a unique sentinel so a leak is
# unambiguously attributable, plus the non-secret declarations each one needs.
# The gate renders ONLY templates/configmap.yaml from this file and fails if any
# sentinel appears in it. Not a golden case — it exists to be searched.
database:
  # The DSN is the one secret whose sentinel legitimately reaches a Secret's
  # stringData; it must still never reach the ConfigMap.
  url: postgres://ferroehr_clinical:SENTINEL_DB_9a1c@db.internal:5432/ferroehr

secrets:
  basicUserPasswordHashes:
    clinician: $argon2id$SENTINEL_BASICHASH_7b2d
  signingKeyPassphrase: SENTINEL_PASSPHRASE_1d5a
  auditFhirFeedUrl: https://arr:SENTINEL_ARR_3b8c@arr.example.com/fhir
  multimediaAccessKeyId: AKIA_PUBLIC_ID
  multimediaSecretAccessKey: SENTINEL_S3_8c6b
  terminologyClientSecret: SENTINEL_TXCLIENT_5f2a
  ehrIndexClientSecret: SENTINEL_PIXCLIENT_6e3d

config:
  # The chart has no default posture and refuses to render without one.
  deployment:
    profile: sandbox
  # An identity source outside the release, with the grant whose secret is
  # the sentinel above.
  auth:
    enabled: true
    basic:
      users:
        # Identity and scopes only; the hash is in `secrets:` above.
        - user: clinician
          scopes: [user/composition-*.cruds, user/template-*.cruds, user/aql-*.cruds, __ferroehr.platform]
    issuer:
      # One table per issuer: `kind` says whose tokens it signs, `profile`
      # the preset of their shape, and a persons token is admitted only
      # through a client in `first_party_clients`.
      - issuer: https://idp.example.org/realms/ferroehr
        kind: persons
        profile: rfc9068
        audience: [ferroehr]
        first_party_clients: [ferroehr-viewer]
    # The issuer's logins bind to the PERSON carrying their `sub` under this
    # identifier issuer.
    party:
      - issuer: https://idp.example.org/realms/ferroehr
        identifier_issuer: urn:example:ferroehr-login
        identifier_type: uuid
  authz:
    rbac:
      role_issuers: [https://idp.example.org/realms/ferroehr]
    party_binding:
      # The healthcare provider this deployment acts for (an example id
      # under the OID arc 2.999).
      provider: { issuer: "urn:oid:2.999.7.9", id: "secret-leak" }
      basic_user:
        - user: clinician
          key_issuer: urn:example:ferroehr-login
          key: 3f2b0c1e-0000-4000-8000-000000000001
  audit:
    enabled: true
    fhir_feed: {}
  files:
    # A PGP private key is file-shaped secret material: it belongs to the config
    # Secret, never to the ConfigMap, so the gate searches for it too.
    signing.asc: |
      -----BEGIN PGP PRIVATE KEY BLOCK-----
      SENTINEL_PGPKEY_7d4e
      -----END PGP PRIVATE KEY BLOCK-----
  record:
    subject_index: pixm
    signing:
      enabled: true
      mode: pgp
      key_file: /etc/ferroehr/signing.asc
    multimedia:
      enabled: true
  pixm:
    url: https://pix.example.org/fhir
    assigning_authority: urn:oid:2.999.7.1
    oauth:
      token_endpoint: https://idp.example.org/token
      client_id: ferroehr
  terminology:
    url: https://tx.example.com/fhir
    oauth:
      token_endpoint: https://idp.example.org/realms/ts/protocol/openid-connect/token
      client_id: ferroehr

# No FerroPIX beside it: the identity source above.
ferropix:
  enabled: false
