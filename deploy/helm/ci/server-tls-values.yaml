# The server's own TLS overlay: `[server.tls]` on, with every in-chart client
# of the CDR enabled beside it (the viewer, FerroBRIDGE, and the ServiceMonitor
# scraping the API port). Without it the TLS branch of the origin and trust
# helpers is one no golden and no gate sees, and the clients' URLs went on
# saying `http://` while the listener spoke TLS.
#
# The key pair comes from a Secret in the shape a cert-manager Certificate
# writes (`tls.crt`, `tls.key`), mounted into the server with extraVolumes; the
# clients are named a CA-only Secret (`ca.crt`) through
# service.tls.caExistingSecret, so no client mounts the private key.
# The Basic-auth shape is reused verbatim from basic-auth-values.yaml so no new
# credential-shaped string enters the tree.
database:
  existingSecret: ferroehr-db
  existingSecretKey: FERROEHR__DB__URL

secrets:
  basicUserPasswordHashes:
    clinician: "$argon2id$v=19$m=19456,t=2,p=1$ZmVycm9laHJEZXZTYWx0$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"

config:
  # The in-instance EHR index, the opt-in of a FerroEHR run on its own:
  # this overlay renders another surface and runs no identity source.
  ehr_index:
    provider: local
  auth:
    enabled: true
    basic:
      users:
        - user: clinician
          scopes: [user/composition-*.cruds, user/template-*.cruds, user/aql-*.cruds, __ferroehr.platform]
          roles: [ADMIN]
  server:
    tls:
      enabled: true
      cert_file: /etc/ferroehr-tls/tls.crt
      key_file: /etc/ferroehr-tls/tls.key

extraVolumes:
  - name: server-tls
    secret:
      secretName: ferroehr-server-tls
      defaultMode: 0440
      items:
        - key: tls.crt
          path: tls.crt
        - key: tls.key
          path: tls.key
extraVolumeMounts:
  - name: server-tls
    mountPath: /etc/ferroehr-tls
    readOnly: true

service:
  tls:
    caExistingSecret: ferroehr-server-ca

metrics:
  # The pod annotations too, so the gate reads their scheme beside the
  # ServiceMonitor's.
  enabled: true
  serviceMonitor:
    enabled: true

viewer:
  enabled: true

bridge:
  enabled: true
  cdr:
    existingSecret: ferroehr-bridge-cdr
  networkPolicy:
    ingressFrom:
      - podSelector:
          matchLabels:
            ferrobridge.example/client: "true"

# The Ingress in front of a TLS listener names the backend protocol for its
# controller; with server TLS off the annotation is not rendered.
ingress:
  enabled: true
  backendTlsAnnotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS

# No FerroPIX beside it: the local EHR index above.
ferropix:
  enabled: false
