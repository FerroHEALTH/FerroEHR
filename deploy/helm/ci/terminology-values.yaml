# The terminology overlay: the CDR plus FerroTERM, both rendered and both
# booted by the acceptance lane. Without this, `terminology` is a code path only
# `helm template` ever exercises, and FerroTERM's pod-security posture is never
# checked against the restricted profile — the same hole the viewer overlay
# closed for the viewer.
#
# The Basic-auth shape is reused verbatim from basic-auth-values.yaml so no new
# credential-shaped string enters the tree: the hash arrives through `secrets:`
# and the chart injects `password_hash_file`, keeping it out of the ConfigMap
# and out of the environment.
database:
  existingSecret: ferroehr-db
  existingSecretKey: FERROEHR__DB__URL

secrets:
  basicUserPasswordHashes:
    clinician: "$argon2id$v=19$m=19456,t=2,p=1$ZmVycm9laHJEZXZTYWx0$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"

config:
  auth:
    enabled: true
    basic:
      users:
        - user: clinician
          scopes: [user/composition-*.cruds, user/template-*.cruds, user/aql-*.cruds, __ferroehr.platform]
  authz:
    rbac:
      basic_roles:
        clinician: [ADMIN]
  # The CDR's own terminology extension API, so the routes that answer FROM
  # FerroTERM are mounted in this render. `config.terminology.external` is NOT
  # declared here: the chart injects it, and declaring the `default` provider
  # beside that is refused (the refusal is probed in validate.sh).
  terminology:
    api_enabled: true

terminology:
  enabled: true
  # A claim NAME, not a claim: the chart provisions no storage, so this is a
  # render fixture exactly as the backup overlays' claims are. It exercises the
  # branch that mounts a built index and renders FERROTERM_INDEX; the
  # all-features overlay covers the other branch, where the shaped seed is
  # served alone.
  index:
    persistentVolumeClaim: ferroehr-terminology-index
