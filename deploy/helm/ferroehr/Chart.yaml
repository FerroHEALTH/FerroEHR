apiVersion: v2
name: ferroehr
description: >-
  Pure-Rust, openEHR-conformant clinical data repository (ITS-REST 1.1.0 + AQL
  1.1). A single static binary deployed with a hardened-by-default security posture:
  runs as a non-root, read-only-rootfs workload whose NetworkPolicy admits its
  serving port only, and that
  connects to an EXTERNAL PostgreSQL 18 as an unprivileged app role, with schema
  preparation on its own credential. A stock install runs the sandbox deployment
  profile, which must not hold real patient data; set config.deployment_profile
  for a production holder.
type: application

# Chart versioning is independent of the application version, and is SemVer 2
# over the CHART's own contract — its values schema and its rendered output
# (https://helm.sh/docs/topics/charts/#charts-and-versioning). A major bump means
# a values file that used to install may now be refused, or the objects it
# renders changed shape; the release narrative for each version is in
# CHANGELOG.md, not here.
#
# A published OCI version is immutable by refusal rather than by the registry —
# `helm push` over an existing tag replaces it silently — so a correction always
# ships as a NEW version and the published one stands as it was.
version: 11.1.0
# The DEFAULT container image tag (overridable via image.tag). Equals the
# workspace version in Cargo.toml, bumped in the release PR beside the
# docker-compose.yml image tags — one version sweep, the compose treatment
# (#2890; scripts/checks/chart-appversion.sh enforces the equality). The
# publish lane still injects `helm package --app-version ${TAG#v}` and rewrites
# the `artifacthub.io/images` tags below at package time (#2779) — the same
# value the tree now carries for a release, and what keeps the between-releases
# `publish-chart.yml` dispatch correct.
#
# The accepted window (adjudicated on #2890): between a release PR's merge and
# the tag's Containers leg publishing the images, a from-tree install
# references tags that do not exist yet — the window docker-compose.yml has
# always accepted.
#
# It is NOT a promise that this tag accepts the chart's current `config`
# defaults: values track development between releases, so the publish lane
# re-checks the pairing against an image, and the `chart-boot` CI job replays it
# against the image built from the tree.
appVersion: "4.3.6"

# A COMPATIBILITY floor, and a real one: 1.36 is the release where the newest
# field this chart renders became stable.
#
# Every field this chart renders, with the KEP that states its stable
# milestone (keps/<sig>/<kep>/kep.yaml is the authority — a docs page drops the
# version note once a feature goes GA, so it cannot answer this question):
#
#   hostUsers: false            KEP-127   stable v1.36  ← sets this floor
#   supplementalGroupsPolicy    KEP-3619  stable v1.35
#   preStop.sleep               KEP-3960  stable v1.34
#   Service.trafficDistribution KEP-4444  stable v1.33
#   PDB.unhealthyPodEvictionPolicy KEP-3017 stable v1.31
#   Job.podFailurePolicy        KEP-3329  stable v1.31
#   HPA autoscaling/v2                    GA     v1.23
#
# So nothing here needs a version gate, which is the point: a gate is a silent
# absence and a floor is a loud refusal, and for a PHI workload the loud one is
# correct. Adding a field newer than this floor means raising the floor or
# gating that field; lowering the floor means gating the rows above.
#
# The floor sits inside the supported window — upstream maintains the three most
# recent minors (https://kubernetes.io/releases/) — at its newest release, which
# is what user namespaces cost: they are the strongest per-pod isolation
# Kubernetes offers a workload holding PHI, and they are stable only here.
kubeVersion: ">=1.36.0-0"

keywords:
  - openehr
  - cdr
  - ehr
  - fhir
  - healthcare
  - rust
home: https://github.com/FerroHEALTH/FerroEHR
sources:
  - https://github.com/FerroHEALTH/FerroEHR
maintainers:
  - name: FerroEHR maintainers
    url: https://github.com/FerroHEALTH/FerroEHR

# The listing logo. Artifact Hub reads `icon` from Chart.yaml, not from an
# annotation, and a chart without one is rendered with a generic placeholder
# beside charts that have theirs.
#
# Served from our own site rather than raw.githubusercontent.com: a raw URL
# carries a branch name in the path, is rate-limited, and is not meant to be a
# CDN. It reuses the existing published mark instead of copying a second brand
# file into the tree — the mark is already square (64x64), which is the shape a
# listing avatar wants.
#
# The IRON variant, which is the dark tile (#21262B) rather than the rust one —
# the brand's own note is that iron is for surfaces where the rust tile is too
# loud, and a package listing sitting in a grid of other charts is one of them.
icon: https://ferroehr.eu/assets/logo-mark-dark.svg

# ─────────────────────────────────────────────────────────────────────────────
# Artifact Hub display metadata (https://artifacthub.io/docs/topics/annotations/helm/).
#
# Three annotations are NOT here because they are per-release facts that would go
# stale the moment they were committed; the publish lane injects them at package
# time from CHANGELOG.md and the tag (deploy/helm/artifacthub-changes.sh):
# `artifacthub.io/changes` and `artifacthub.io/containsSecurityUpdates`, plus
# `artifacthub.io/prerelease` for an `-rc` tag. Committing any of the three is
# refused by scripts/checks/chart-appversion.sh: two declarations of one key make
# the packaged metadata depend on YAML key-collision behaviour.
#
# Deliberately absent, so a later reader does not wonder:
#   operator, operatorCapabilities — this is not an operator.
#   crds, crdsExamples             — the chart defines no CustomResourceDefinition.
#   signKey                        — the chart carries no PGP provenance (`.prov`).
#                                    It is signed keyless with cosign and attested
#                                    through Sigstore, and this annotation cannot
#                                    describe either: its `url` is mandatory and
#                                    would have to point at a public key that does
#                                    not exist. Artifact Hub reports the cosign
#                                    signature from the registry itself, so the
#                                    "Signed" state needs no annotation.
#   alternativeName, recommendations — nothing to name or recommend.
# ─────────────────────────────────────────────────────────────────────────────
annotations:
  # The fixed enum has no health/clinical category. This chart deploys a
  # repository whose substance is stored clinical records over PostgreSQL, so
  # `database` is the closest TRUE statement of the eight; `skip-prediction`
  # would only remove the chart from category browsing without saying anything.
  artifacthub.io/category: database
  artifacthub.io/license: BUSL-1.1
  artifacthub.io/links: |
    - name: source
      url: https://github.com/FerroHEALTH/FerroEHR
    - name: documentation
      url: https://ferroehr.eu/docs/latest/installation/kubernetes.html
    - name: support
      url: https://github.com/FerroHEALTH/FerroEHR/issues
  artifacthub.io/maintainers: |
    - name: Ruben Talstra
      email: me@rubentalstra.nl
  # Every FIRST-PARTY tag here must equal `appVersion`
  # (scripts/checks/chart-appversion.sh checks it), and the publish lane
  # REWRITES those to the released version at package time —
  # deploy/helm/release-facts.sh, because `helm package --app-version` sets the
  # appVersion field and does not touch annotations (#2779). So these committed
  # tags are the between-releases default, like appVersion itself, and never
  # what a published listing shows.
  #
  # WHICH images are first party is DECLARED, not spelled: every entry carries a
  # trailing `# party: first` or `# party: third` marker, and both scripts read
  # that marker rather than matching a repository name. An unmarked entry fails
  # the guard. A name pattern would have classified `ghcr.io/ferrohealth/
  # ferroehr-anything` as ours by accident and a first-party image published
  # under another name as somebody else's, and neither mistake is visible in a
  # render — the tag is simply rewritten, or silently left behind, at the cut.
  #
  # ONLY images this chart actually deploys. Artifact Hub scans every entry here
  # and attributes the findings to this package, so listing an image the chart
  # never installs reports us for software no user runs. `ferroehr-postgres` was
  # once listed for a database this chart has never provisioned, and removed for
  # exactly that reason; it is listed again because the backup CronJobs run
  # pg_dump FROM it when `backup.enabled` is set, which makes it an image the
  # chart installs. The `whitelisted` flag would silence such a scan while
  # leaving a false claim in place, so it is deliberately not used.
  artifacthub.io/images: |
    - name: ferroehr
      image: ghcr.io/ferrohealth/ferroehr:4.3.6  # party: first
      platforms:
        - linux/amd64
        - linux/arm64
    # The viewer — an OPTIONAL companion workload this chart deploys when
    # `viewer.enabled` is set (templates/viewer.yaml renders its Deployment,
    # Service, ServiceAccount, Ingress and NetworkPolicy). Off by default, so
    # the entry describes a surface an operator opts into rather than one every
    # install carries, and it is listed so that surface is scanned.
    - name: ferroehr-viewer
      image: ghcr.io/ferrohealth/ferroehr-viewer:4.3.6  # party: first
      platforms:
        - linux/amd64
        - linux/arm64
    # The per-domain backup CronJobs' image, deployed only when
    # `backup.enabled` is set: it carries pg_dump. The chart still provisions no
    # database — this image runs as a client, on a schedule, and exits.
    - name: ferroehr-postgres
      image: ghcr.io/ferrohealth/ferroehr-postgres:4.3.6  # party: first
      platforms:
        - linux/amd64
        - linux/arm64
    # FerroTERM, deployed when `terminology.enabled` is set
    # (templates/terminology.yaml). Listed because the chart installs it and
    # Artifact Hub must scan it. Its tag is NOT the appVersion and is not
    # rewritten at package time: FerroTERM is a separate product on its own
    # release line.
    #
    # The reference carries the TAG AND THE DIGEST, which is what the chart
    # actually deploys — `terminology.image.digest` is pinned in values.yaml, so
    # a bare tag here would name a mutable pointer while every install runs the
    # digest, and Artifact Hub would scan whatever the tag had moved to.
    # scripts/checks/chart-appversion.sh holds both halves to their single
    # sources: the tag to `ferroehr.terminologyPinnedVersion` in _helpers.tpl,
    # the digest to `terminology.image.digest` in values.yaml. Bumping FerroTERM
    # is those two edits; this line is then checked, not maintained.
    - name: ferroterm
      image: ghcr.io/ferrohealth/ferroterm:0.1.6@sha256:7ec4c9622e88e3028faf7c74a2384fb02e57dc3163c282b21274121a26aa3d5b  # party: third
      platforms:
        - linux/amd64
        - linux/arm64
    # FerroBRIDGE, deployed when `bridge.enabled` is set (templates/bridge.yaml).
    # Marked third party on the FerroTERM reasoning: a separate product on its
    # own release line, so its tag is neither the appVersion nor rewritten at
    # package time. Tag AND digest, held by scripts/checks/chart-appversion.sh
    # to `ferroehr.bridgePinnedVersion` in _helpers.tpl and
    # `bridge.image.digest` in values.yaml.
    - name: ferrobridge
      image: ghcr.io/ferrohealth/ferrobridge:0.0.5@sha256:c92e58dac60d0d1cb94b446e2414ebdc2b209a42c87df3aaf0b18d7c51d5c774  # party: third
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/screenshots: |
    - title: Dashboard
      url: https://ferroehr.eu/docs/latest/viewer/img/dashboard/dashboard.png
    - title: AQL queries
      url: https://ferroehr.eu/docs/latest/viewer/img/queries/queries-admin-delete.png
