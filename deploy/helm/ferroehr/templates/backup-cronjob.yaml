{{- if .Values.backup.enabled }}
{{- /*
Per-domain logical backups: one CronJob per pseudonymisation domain, each
dumping only its own schemas, to its own claim, under its own credential, plus
a third for the audit domain when that domain has a database of its own.

Keeping the clinical record and the identifying data in separate artefacts is the separation pseudonymisation rests on (GDPR Art. 4(5),
https://eur-lex.europa.eu/eli/reg/2016/679/oj); the dumps themselves are the
restore capability of Art. 32(1)(c). `pg_dump --schema` is the mechanism
(https://www.postgresql.org/docs/18/app-pgdump.html). No openEHR spec governs
backups — our own design/extension.

batch/v1 CronJob is stable since v1.21 and `timeZone` since v1.27 (KEP-19 and
KEP-3140), both below this chart's kubeVersion floor, so neither is gated.

The DOMAIN TABLE below is the one enumeration: the render guards, the dump
arguments and the CronJobs all read it, so a domain is one entry rather than a
set of parallel edits that can silently disagree.

THE AUDIT DOMAIN IS CONDITIONAL, and on one condition: `database.audit`
naming a Secret of its own. Co-located, the audit schema sits in the clinical
database and travels with the clinical dump, which is why that job names it.
Given a DSN of its own the schema is in another database, where the clinical
dump cannot reach it and nothing else would take it, so the third CronJob
renders and the clinical job stops naming a schema it would dump empty. An
inline `database.audit.url` does not reach this branch: it is a dev/test value
that lands in the chart-managed Secret beside the others.
*/}}
{{- $root := . }}
{{- $mount := include "ferroehr.backupMountPath" . }}
{{- $secrets := include "ferroehr.secretMountPath" . }}
{{- $auditElsewhere := ne (default "" .Values.database.audit.existingSecret) "" }}
{{- $domains := list
      (dict "name" "clinical"
            "schedule" .Values.backup.clinical.schedule
            "claim" .Values.backup.clinical.persistentVolumeClaim
            "secret" .Values.backup.clinical.existingSecret
            "schemas" (ternary (list "clinical" "ext") (list "clinical" "ext" "audit") $auditElsewhere)
            "claimWhy" "name an EXISTING PersistentVolumeClaim for the clinical dump (schemas clinical and ext, plus audit while the audit domain shares this database). The chart provisions no storage — a dump with nowhere to write is a backup that silently does not exist."
            "secretWhy" "name a Secret holding a BACKUP DSN for the clinical domain — a read-only role on the schemas this job dumps. It cannot be the pool's credential: each domain's runtime role is revoked from the others, so a dump taken through it would be silently partial.")
      (dict "name" "party"
            "schedule" .Values.backup.party.schedule
            "claim" .Values.backup.party.persistentVolumeClaim
            "secret" .Values.backup.party.existingSecret
            "schemas" (list "party")
            "claimWhy" "name an EXISTING PersistentVolumeClaim for the party dump (schema party). It must be a different volume from every other domain's — that separation is what this feature is for (GDPR Art. 4(5))."
            "secretWhy" "name a Secret holding a BACKUP DSN for the party domain — a read-only role on party. Give it its own role, not the clinical backup one: a single credential that dumps two domains re-joins in one identity what the split exists to separate (GDPR Art. 4(5)).") }}
{{- if $auditElsewhere }}
{{- $domains = append $domains
      (dict "name" "audit"
            "schedule" .Values.backup.audit.schedule
            "claim" .Values.backup.audit.persistentVolumeClaim
            "secret" .Values.backup.audit.existingSecret
            "schemas" (list "audit")
            "claimWhy" "name an EXISTING PersistentVolumeClaim for the audit dump (schema audit). database.audit names a Secret of its own, so the audit trail is in another database and the clinical dump cannot reach it: without this claim nothing backs up the access log at all."
            "secretWhy" "name a Secret holding a BACKUP DSN for the audit domain — a read-only role on audit in the database database.audit points at. The clinical backup credential is not it: that DSN names the clinical database, which is not where this trail lives.") }}
{{- end }}
{{- /* Every domain needs a destination of its own, and no two may share one.
       The collision is checked PAIRWISE rather than against the clinical claim
       only: any two domains on one volume are the same re-identification
       artefact. Destinations are checked before credentials
       so an operator enabling the feature is told about every missing claim
       before being sent to look for roles. */}}
{{- range $domain := $domains }}
{{- if not $domain.claim }}
{{- fail (printf "backup.enabled is true but backup.%s.persistentVolumeClaim is empty: %s" $domain.name $domain.claimWhy) }}
{{- end }}
{{- end }}
{{- range $i, $domain := $domains }}
{{- range $j, $other := $domains }}
{{- if and (lt $i $j) (eq $domain.claim $other.claim) }}
{{- fail (printf "backup.%s.persistentVolumeClaim and backup.%s.persistentVolumeClaim name the same claim: one volume carrying two storage domains is the state per-domain backups exist to prevent (GDPR Art. 4(5)). Give each domain its own claim, and the party one the narrower audience." $domain.name $other.name) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $domain := $domains }}
{{- if not $domain.secret }}
{{- fail (printf "backup.enabled is true but backup.%s.existingSecret is empty: %s" $domain.name $domain.secretWhy) }}
{{- end }}
{{- end }}
{{- range $domain := $domains }}
{{- $args := "" }}
{{- range $schema := $domain.schemas }}{{ $args = printf "%s --schema=%s" $args $schema }}{{ end }}
{{- /* The DSN is read from its mounted file at call time: only the PATH is in
       the pod spec, so the credential is never an environment variable an
       operator can read back off the object or a child process inherits
       (https://cheatsheetseries.owasp.org/cheatsheets/Kubernetes_Security_Cheat_Sheet.html).
       `--format=custom` so pg_restore can choose what to restore and in what
       order (https://www.postgresql.org/docs/18/app-pgdump.html). */}}
{{- $command := printf "pg_dump --dbname=\"$(cat %s/db.url)\" --format=custom --no-owner%s --file=%s/%s-$(date -u +%%Y%%m%%dT%%H%%M%%SZ).dump" $secrets $args $mount $domain.name }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ferroehr.backupFullname" (dict "root" $root "domain" $domain.name) }}
  annotations:
    kubernetes.io/description: >-
      Logical backup of the {{ $domain.name }} storage domain: pg_dump of {{ join ", " $domain.schemas }} into the {{ $domain.claim }} claim, under that domain's own backup DSN. Separate claim, separate credential and separate schedule from every other domain, so no one artefact carries two of the clinical record, the identities, the map between them and the access log.
  labels:
    {{- include "ferroehr.backupLabels" (dict "root" $root "domain" $domain.name) | nindent 4 }}
spec:
  schedule: {{ $domain.schedule | quote }}
  {{- with $root.Values.backup.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  {{- /* A second dump of one domain starting while the first still runs adds
         database load and a half-written second artefact, and buys nothing:
         the next schedule takes a complete dump anyway. */}}
  concurrencyPolicy: Forbid
  {{- with $root.Values.backup.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ . }}
  {{- end }}
  jobTemplate:
    spec:
      backoffLimit: {{ $root.Values.backup.backoffLimit }}
      activeDeadlineSeconds: {{ $root.Values.backup.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ $root.Values.backup.ttlSecondsAfterFinished }}
      {{- /* A pod killed by a drain or a preemption never took the dump, so it
             must not spend one of `backoffLimit` — the same rule, for the same
             reason, as the migration Job
             (https://kubernetes.io/docs/tasks/job/pod-failure-policy/). */}}
      podFailurePolicy:
        rules:
          - action: Ignore
            onPodConditions:
              - type: DisruptionTarget
      template:
        metadata:
          labels:
            {{- include "ferroehr.backupSelectorLabels" (dict "root" $root "domain" $domain.name) | nindent 12 }}
            app.kubernetes.io/component: backup
          {{- with $root.Values.backup.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          restartPolicy: Never
          {{- with $root.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "ferroehr.serviceAccountName" $root }}
          automountServiceAccountToken: {{ $root.Values.serviceAccount.automountServiceAccountToken }}
          # pg_dump reads no Service link variable, and the release's other pods
          # disable them, so the posture stays one posture
          # (https://kubernetes.io/docs/concepts/services-networking/service/#environment-variables).
          enableServiceLinks: false
          {{- if not $root.Values.hostUsers }}
          {{- include "ferroehr.hostUsers" $root | nindent 10 }}
          {{- end }}
          securityContext:
            {{- toYaml $root.Values.podSecurityContext | nindent 12 }}
          containers:
            - name: pg-dump
              image: "{{ include "ferroehr.backupImage" $root }}"
              imagePullPolicy: {{ $root.Values.backup.image.pullPolicy }}
              securityContext:
                {{- toYaml $root.Values.securityContext | nindent 16 }}
              command:
                - /bin/sh
                - -ec
              args:
                - {{ $command | quote }}
              volumeMounts:
                # readOnlyRootFilesystem=true → give the process a writable scratch dir.
                - name: tmp
                  mountPath: /tmp
                - name: dsn
                  mountPath: {{ $secrets }}
                  readOnly: true
                - name: backup
                  mountPath: {{ $mount }}
                {{- if $root.Values.database.caConfigMap }}
                {{- include "ferroehr.dbCaMount" $root | nindent 16 }}
                {{- end }}
              resources:
                {{- toYaml $root.Values.backup.resources | nindent 16 }}
          volumes:
            - name: tmp
              emptyDir: {}
            # This domain's DSN, mounted as db.url whichever Secret it came from,
            # so the command is the same for every domain and only the
            # credential differs.
            - name: dsn
              secret:
                secretName: {{ include "ferroehr.backupDsnSecret" (dict "root" $root "domain" $domain.name) }}
                defaultMode: 0440
                items:
                  - key: {{ include "ferroehr.backupDsnSecretKey" (dict "root" $root "domain" $domain.name) }}
                    path: db.url
            - name: backup
              persistentVolumeClaim:
                claimName: {{ $domain.claim }}
            {{- if $root.Values.database.caConfigMap }}
            {{- include "ferroehr.dbCaVolume" $root | nindent 12 }}
            {{- end }}
          {{- with $root.Values.backup.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $root.Values.backup.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
