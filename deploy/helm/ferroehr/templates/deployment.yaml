{{- /*
Refuse at RENDER time what the server would otherwise refuse at boot.

`config.auth.enabled` defaults to true and the server requires at least one
mechanism with it, because a 401 challenge has to name a scheme the server
actually implements (RFC 9110 §11.6.1,
https://www.rfc-editor.org/rfc/rfc9110#section-11.6.1) — so it exits rather
than start as an openEHR API that can only refuse every request.

Correct, but as a chart default it meant `helm install` reported success and
then crash-looped, with the reason only in a pod log. The fix is NOT to ship
`enabled: false`: that would hand a fresh install an unauthenticated CDR
serving PHI, which is a worse failure than a loud one. Instead the operator is
told here, before a single object reaches the cluster, and disabling auth stays
available as an explicit, visible choice.
*/}}
{{- if .Values.config.auth.enabled }}
{{- $basic := (.Values.config.auth.basic).users }}
{{- $issuer := .Values.config.auth.issuer }}
{{- if and (empty $basic) (empty $issuer) }}
{{- fail "config.auth.enabled is true but no authentication mechanism is configured, so the server would refuse to start (RFC 9110 §11.6.1: a 401 challenge must name a scheme the server implements).\n\nConfigure one:\n  config.auth.basic.users  — see deploy/helm/ci/basic-auth-values.yaml\n  config.auth.issuer       — a list of issuer tables, each with its kind and audience\n\nOr, for a development install only, set config.auth.enabled=false to serve every request unauthenticated." }}
{{- end }}
{{- end }}
{{- /* The kubelet's HTTPS probes present no client certificate
       (https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#http-probes),
       so a listener that requires one fails every probe and no pod ever
       becomes Ready while the install itself reports success. */}}
{{- if and (eq (include "ferroehr.serverTls" .) "true") (eq (toString ((.Values.config.server).tls).client_auth) "required") }}
{{- fail "config.server.tls.client_auth is \"required\", but the kubelet's probes present no client certificate, so every pod would stay unready while the install reports success.\n\nUse config.server.tls.client_auth: optional (a presented certificate is still verified), and enforce mutual TLS for the nodes that must present one at the network layer (NetworkPolicy, a service mesh)." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ferroehr.fullname" . }}
  annotations:
    kubernetes.io/description: >-
      The FerroEHR CDR itself: a stateless openEHR ITS-REST API server against an EXTERNAL PostgreSQL 18. It stores nothing locally, so a pod is disposable; readiness reports the database and its schema, liveness does not.
  labels:
    {{- include "ferroehr.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ferroehr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll pods when anything the process reads AT BOOT changes: the rendered
        # ferroehr.toml (wherever it lands), the mounted config files, and the
        # secret values. Hashing the ConfigMap template alone missed the last two,
        # so a rotated passphrase or an edited Cedar policy propagated into the
        # volume while every pod kept running on the value it read at startup.
        checksum/config: {{ printf "%s|%s|%s"
          (include "ferroehr.configToml" .)
          (toYaml .Values.config.files)
          (toYaml .Values.secrets) | sha256sum }}
        {{- if .Values.definitions.files }}
        # A changed definition list rolls the pods, so the init container loads it.
        checksum/definitions: {{ toYaml .Values.definitions.files | sha256sum }}
        {{- end }}
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ include "ferroehr.managementPort" . | quote }}
        prometheus.io/path: {{ printf "%s/prometheus" (.Values.config.management.base_path | trimSuffix "/") | quote }}
        {{- /* The scrape lands on the API listener when no management.port is
               set, and that listener speaks the server's own TLS when it is on;
               kubernetes_sd scrape configs read the scheme from this annotation
               by convention, and default to http without it. */}}
        {{- if and (not (and .Values.config.management.enabled (include "ferroehr.managementOwnPort" .))) (eq (include "ferroehr.serverTls" .) "true") }}
        prometheus.io/scheme: "https"
        {{- end }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ferroehr.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ferroehr.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      # NOT a tunable: the kubelet's per-Service link variables
      # (<SVC>_SERVICE_HOST, <SVC>_PORT_8080_TCP_ADDR, …) land inside the
      # server's reserved FERROEHR_ namespace for any Service named ferroehr*,
      # and the strict boot-time env sweep then refuses to start
      # (https://kubernetes.io/docs/concepts/services-networking/service/#environment-variables).
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if not .Values.hostUsers }}
      {{- include "ferroehr.hostUsers" . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.definitions.files }}
      {{- /* The definitions the party mapping and the deployment name, stored
             before the server starts by the same binary on the same
             configuration, in the order listed (`ferroehr definitions load`). */}}
      initContainers:
        - name: definitions
          image: "{{ include "ferroehr.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - definitions
            - load
            {{- range .Values.definitions.files }}
            - {{ printf "/etc/ferroehr-definitions/%s" .name | quote }}
            {{- end }}
          env:
            {{- include "ferroehr.serverEnv" . | nindent 12 }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "ferroehr.serverVolumeMounts" . | nindent 12 }}
            - name: definitions
              mountPath: /etc/ferroehr-definitions
              readOnly: true
      {{- end }}
      containers:
        - name: ferroehr
          image: "{{ include "ferroehr.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if and .Values.config.management.enabled (include "ferroehr.managementOwnPort" .) }}
            - name: management
              containerPort: {{ include "ferroehr.managementOwnPort" . }}
              protocol: TCP
            {{- end }}
          # Only SECRET config is env; the rest is the mounted ferroehr.toml.
          # The DSN comes from an existing Secret (preferred) or the chart Secret;
          # the env layer overrides the file, so each secret here wins over any
          # matching TOML key.
          # A secret VALUE appears below only where the config key has no
          # `*_file` sibling to point at the mounted volume instead; the rest are
          # `*_FILE` paths, which are not themselves sensitive.
          env:
            {{- include "ferroehr.serverEnv" . | nindent 12 }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /* The health family is always mounted on the main HTTP port and
                 never gated by config, so httpGet probes need no prerequisite.
                 With the server's own TLS on, the kubelet probes over HTTPS
                 and skips certificate verification
                 (https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#http-probes). */}}
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
              {{- if eq (include "ferroehr.serverTls" .) "true" }}
              scheme: HTTPS
              {{- end }}
            {{- with .Values.probes.liveness }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
              {{- if eq (include "ferroehr.serverTls" .) "true" }}
              scheme: HTTPS
              {{- end }}
            {{- with .Values.probes.readiness }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /health/liveness
              port: http
              {{- if eq (include "ferroehr.serverTls" .) "true" }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if gt (int .Values.preStopSleepSeconds) 0 }}
          {{- /*
          Lame-duck delay. Pod deletion removes the pod from its EndpointSlice
          and sends SIGTERM CONCURRENTLY, and the endpoint removal has to reach
          every kube-proxy before it takes effect — so without a pause a pod can
          receive requests it has already begun shutting down on
          (https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/,
          https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#pod-termination).
          `strategy.maxUnavailable: 0` does not help: it keeps CAPACITY up, it
          does not make endpoint propagation instant.

          The native `sleep` action, not an exec hook: this image ships no shell
          and no sleep binary (deliberately — it is what makes runtime intrusion
          detection high-confidence), so `exec` could not run here at all.

          KEP-3960 (keps/sig-node/3960-pod-lifecycle-sleep-action) marks the
          sleep action stable in v1.34, below this chart's kubeVersion floor, so
          it renders unconditionally.
          */}}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ int .Values.preStopSleepSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "ferroehr.serverVolumeMounts" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.definitions.files }}
        - name: definitions
          configMap:
            name: {{ include "ferroehr.fullname" . }}-definitions
            defaultMode: 0440
        {{- end }}
        - name: config
          projected:
            # Same 0440 as the secrets volume, for the same reason: this volume
            # is not only ferroehr.toml. Every `config.files` entry lands here,
            # and that key's documented use includes the PGP signing PRIVATE key
            # (record.signing.key_file), mutual-TLS PEMs and a JWKS blob; when the
            # configuration holds a secret the chart cannot route out of it,
            # ferroehr.toml itself arrives from a Secret too. Without a mode the
            # projection defaults to 0644 — world-readable inside the container.
            # Owner is root, group is fsGroup, so the group bit is what the
            # non-root process reads through
            # (https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod).
            defaultMode: 0440
            sources:
              {{- if ne (include "ferroehr.configInSecret" .) "true" }}
              - configMap:
                  name: {{ include "ferroehr.fullname" . }}
                  items:
                    - key: ferroehr.toml
                      path: ferroehr.toml
              {{- end }}
              {{- if eq (include "ferroehr.hasConfigSecret" .) "true" }}
              # Carries ferroehr.toml itself when the configuration holds a
              # secret the chart cannot route elsewhere (then no ConfigMap
              # exists), plus every config.files entry.
              - secret:
                  name: {{ include "ferroehr.configSecretName" . }}
              {{- end }}
        {{- if eq (include "ferroehr.hasFileSecrets" .) "true" }}
        # File-borne secrets. A projected volume rather than a plain secret volume
        # because the DSN may live in an EXTERNAL Secret the operator created,
        # which has to be projected beside the chart's own — both under one mount,
        # and not a subPath mount, so a rotated Secret still propagates.
        - name: secrets
          projected:
            # Owner is root, group is fsGroup, so the group bit is what the
            # non-root process reads through
            # (https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod).
            defaultMode: 0440
            sources:
              {{- if .Values.database.existingSecret }}
              # The operator's Secret, projected as the file FERROEHR__DATABASE__URL_FILE
              # points at. Its key name is theirs (database.existingSecretKey);
              # only the mounted PATH is fixed.
              - secret:
                  name: {{ .Values.database.existingSecret }}
                  items:
                    - key: {{ .Values.database.existingSecretKey }}
                      path: db.url
              {{- end }}
              {{- range $domain := list "clinical" "party" "audit" }}
              {{- $dsn := index $.Values.database $domain }}
              {{- if $dsn.existingSecret }}
              # One storage domain's own Secret, a different credential from the
              # shared DSN above and projected as its own file.
              - secret:
                  name: {{ $dsn.existingSecret }}
                  items:
                    - key: {{ $dsn.existingSecretKey }}
                      path: storage.{{ $domain }}.url
              {{- end }}
              {{- if $dsn.migrateExistingSecret }}
              # The migration credential of the database this domain lives in.
              - secret:
                  name: {{ $dsn.migrateExistingSecret }}
                  items:
                    - key: {{ $dsn.migrateExistingSecretKey }}
                      path: storage.migrate.{{ $domain }}.url
              {{- end }}
              {{- end }}
              {{- if .Values.database.migrateExistingSecret }}
              # The schema-preparation Secret — usually the same credential the
              # migration Job carries, which is why it is a third source rather
              # than a key of either runtime one.
              - secret:
                  name: {{ .Values.database.migrateExistingSecret }}
                  items:
                    - key: {{ .Values.database.migrateExistingSecretKey }}
                      path: db.migrate_url
              {{- end }}
              {{- if eq (include "ferroehr.hasChartFileSecrets" .) "true" }}
              - secret:
                  name: {{ include "ferroehr.secretName" . }}
                  items:
              {{- if and (not .Values.database.existingSecret) .Values.database.url }}
                    - key: db.url
                      path: db.url
              {{- end }}
              {{- range $domain := list "clinical" "party" "audit" }}
              {{- $dsn := index $.Values.database $domain }}
              {{- if and (not $dsn.existingSecret) $dsn.url }}
                    - key: storage.{{ $domain }}.url
                      path: storage.{{ $domain }}.url
              {{- end }}
              {{- end }}
              {{- if and (not .Values.database.migrateExistingSecret) .Values.database.migrateUrl }}
                    - key: db.migrate_url
                      path: db.migrate_url
              {{- end }}
              {{- if .Values.secrets.signingKeyPassphrase }}
                    - key: signing.key_passphrase
                      path: signing.key_passphrase
              {{- end }}
              {{- if .Values.secrets.multimediaSecretAccessKey }}
                    - key: multimedia.secret_access_key
                      path: multimedia.secret_access_key
              {{- end }}
              {{- range $user, $hash := .Values.secrets.basicUserPasswordHashes }}
                    - key: auth.basic.users.{{ $user }}.password_hash
                      path: auth.basic.users.{{ $user }}.password_hash
              {{- end }}
              {{- if .Values.secrets.terminologyClientSecret }}
                    - key: terminology.server.oauth.client_secret
                      path: terminology.server.oauth.client_secret
              {{- end }}
              {{- if .Values.secrets.ehrIndexClientSecret }}
                    - key: ehr_index.oauth.client_secret
                      path: ehr_index.oauth.client_secret
              {{- end }}
              {{- end }}
        {{- end }}
        {{- if .Values.database.caConfigMap }}
        {{- include "ferroehr.dbCaVolume" . | nindent 8 }}
        {{- end }}
        {{- if .Values.auth.caExistingSecret }}
        - name: issuer-ca
          secret:
            secretName: {{ .Values.auth.caExistingSecret }}
            items:
              - key: {{ .Values.auth.caExistingSecretKey }}
                path: ca.crt
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        {{- include "ferroehr.topologySpreadConstraints" . | nindent 8 }}
