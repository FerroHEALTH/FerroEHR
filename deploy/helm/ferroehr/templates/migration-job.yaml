{{- if .Values.migrations.job.enabled }}
{{- if not .Values.migrations.job.existingSecret }}
{{- fail "migrations.job.enabled requires migrations.job.existingSecret: the migration step authenticates as ferroehr_migrator, which is a DIFFERENT credential from the runtime database.* DSN — that separation is the whole point of the job" }}
{{- end }}
# Out-of-band schema migration, as a Helm pre-install/pre-upgrade hook Job.
#
# Migrations are DDL, so whoever applies them can rewrite the schema. Running
# them here — as `ferroehr_migrator`, in a pod that exits — lets the SERVER run
# as `ferroehr_clinical` with no DDL rights at all, which is what
# config.db.migrate=verify then enforces (it refuses to boot against a database
# this job has not migrated, rather than migrating it itself).
#
# As a hook, Helm creates it before the Deployment and WAITS for it: a failed
# migration fails the release instead of rolling pods against a schema that was
# never applied. Deliberately lean — the migration step needs the DSN and
# nothing else, so it mounts no ConfigMap and runs on the built-in defaults.
#
# Its pod runs under a ServiceAccount of its own, created as a hook one weight
# earlier. The release ServiceAccount is an ordinary resource, and Helm creates
# those only after the pre-install hooks finish, so on a first install a Job
# naming it waits for an account that does not exist yet; a resource a hook
# needs must itself be a hook (https://helm.sh/docs/topics/charts_hooks/).
# The pod calls no Kubernetes API, so the account mounts no token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ferroehr.fullname" . }}-migrate
  labels:
    {{- include "ferroehr.migrationLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ferroehr.fullname" . }}-migrate
  labels:
    {{- include "ferroehr.migrationLabels" . | nindent 4 }}
  annotations:
    kubernetes.io/description: >-
      Applies the schema migrations as ferroehr_migrator — a DIFFERENT credential from the runtime DSN — before the server rolls. A Helm pre-install/pre-upgrade hook, so a failed migration fails the release.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.job.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrations.job.ttlSecondsAfterFinished }}
  activeDeadlineSeconds: {{ .Values.migrations.job.activeDeadlineSeconds }}
  {{- /* A pod killed by a DRAIN or a preemption did not fail the migration —
         it never got to run it. Without this rule that eviction spends one of
         `backoffLimit` retries, so a cluster doing ordinary maintenance during
         a release can exhaust the budget and fail the whole upgrade with no
         migration error anywhere in the logs.

         `Ignore` is the action documented for exactly this case, and it is
         safe here for the reason the docs give: the pod is recreated, so the
         migration still runs — only the retry COUNTER is left alone
         (https://kubernetes.io/docs/tasks/job/pod-failure-policy/).
         KEP-3329 (keps/sig-apps/3329-retriable-and-non-retriable-failures)
         marks this stable in v1.31, below the kubeVersion floor.

         Deliberately no `onExitCodes` rule: `db migrate` exits non-zero for a
         wrong DSN and for a database that is merely not up yet, and those want
         opposite answers. Retrying the second is the whole point of
         `backoffLimit`, and the first is bounded by `activeDeadlineSeconds`. */}}
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
  template:
    metadata:
      labels:
        {{- include "ferroehr.migrationLabels" . | nindent 8 }}
      {{- with .Values.migrations.job.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ferroehr.fullname" . }}-migrate
      automountServiceAccountToken: false
      # Same reason as the Deployment: the kubelet's per-Service link variables
      # land inside the server's reserved FERROEHR_ namespace and the strict
      # boot-time env sweep then refuses to start.
      enableServiceLinks: false
      {{- if not .Values.hostUsers }}
      {{- include "ferroehr.hostUsers" . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ include "ferroehr.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args: ["db", "migrate"]
          env:
            # The migrator DSN, as a mounted file rather than an environment
            # value (readable through /proc/<pid>/environ and inherited by every
            # child process — OWASP Kubernetes Security Cheat Sheet).
            - name: FERROEHR__DB__URL_FILE
              value: {{ printf "%s/db.url" (include "ferroehr.secretMountPath" .) | quote }}
            # This pod's job IS the DDL, whatever the server's posture is.
            - name: FERROEHR__DB__MIGRATE
              value: apply
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: migrator-secret
              mountPath: {{ include "ferroehr.secretMountPath" . }}
              readOnly: true
          resources:
            {{- toYaml .Values.migrations.job.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: migrator-secret
          secret:
            secretName: {{ .Values.migrations.job.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.migrations.job.existingSecretKey }}
                path: db.url
      {{- with .Values.migrations.job.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.job.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
