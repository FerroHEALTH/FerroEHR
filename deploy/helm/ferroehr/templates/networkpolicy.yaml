{{- if .Values.networkPolicy.enabled }}
# Ingress policy for the ferroehr pods, admitting traffic ONLY to the API port
# (and the management port when it runs on its own listener). Every other inbound
# port is denied. A PHI workload should never be reachable on anything but its
# serving port.
#
# PORTS are narrowed unconditionally; SOURCES only when networkPolicy.ingressFrom
# is set. An ingress rule with no `from` admits every source — other namespaces
# and off-cluster clients included
# (https://kubernetes.io/docs/concepts/services-networking/network-policies/ —
# "If no ... from is specified ... it allows all traffic"). So there are three
# states, and the third exists because the first two look identical in every
# summary of the policy:
#   ingressFrom set                              → sources narrowed to those peers
#   ingressFrom empty, ingressAllowAll true      → EVERY source admitted (shipped)
#   ingressFrom empty, ingressAllowAll false     → refused at render, below
{{- if and (not .Values.networkPolicy.ingressFrom) (not .Values.networkPolicy.ingressAllowAll) }}
{{- fail "networkPolicy.ingressAllowAll=false with an empty networkPolicy.ingressFrom: set networkPolicy.ingressFrom to the peers that may reach the API (a namespaceSelector/podSelector for your ingress controller, or an ipBlock), or set networkPolicy.ingressAllowAll=true to admit every source deliberately. An ingress rule with no `from` admits EVERY source — other namespaces and off-cluster clients — while `kubectl get networkpolicy` and every summary of it still read as default-deny, so the mistake is invisible exactly where it would be noticed. The narrowing recipe is in the book, installation/hardening-network-policy.md §Ingress." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ferroehr.fullname" . }}
  annotations:
    {{- /* The description states the posture THIS render has, not the posture the
           chart could produce: a policy object that claims to restrict sources
           when it admits all of them is the trap the ingressAllowAll key closes,
           and `kubectl describe` is where an operator reads it. */}}
    kubernetes.io/description: >-
      {{ if .Values.networkPolicy.ingressFrom }}Ingress for the CDR: only the API port (and the management port when enabled), and only from the networkPolicy.ingressFrom peers.{{ else }}Ingress for the CDR: only the API port (and the management port when enabled), but from EVERY source — this policy narrows ports, NOT sources (networkPolicy.ingressAllowAll=true). Set networkPolicy.ingressFrom for a PHI workload.{{ end }}
  labels:
    {{- include "ferroehr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ferroehr.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: http
          protocol: TCP
        {{- if and .Values.config.management.enabled .Values.config.management.port }}
        - port: management
          protocol: TCP
        {{- end }}
      {{- /* An empty `ingressFrom` renders NO `from`, which admits every source —
             sanctioned only by `ingressAllowAll` (refused above otherwise). Once
             an operator narrows it, the viewer and FerroBRIDGE must still be
             admitted or enabling this policy beside either locks it out of the
             CDR — a failure that looks like the CDR being down. */}}
      {{- if .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- if .Values.viewer.enabled }}
        - podSelector:
            matchLabels:
              {{- include "ferroehr.viewerSelectorLabels" . | nindent 14 }}
        {{- end }}
        {{- if .Values.bridge.enabled }}
        - podSelector:
            matchLabels:
              {{- include "ferroehr.bridgeSelectorLabels" . | nindent 14 }}
        {{- end }}
      {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  {{- /* An egress policy that forgets the database is a total outage presenting
         as a database fault: readiness reports the DB down, the logs show a
         connect timeout, and nothing mentions the network policy. The database is
         the one destination that is never optional, so its absence is refused at
         render time rather than discovered at rollout. */}}
  {{- if and (not .Values.networkPolicy.egress.database.to) (not .Values.networkPolicy.egress.rules) }}
  {{- fail "networkPolicy.egress.enabled=true with no destination for the database: set networkPolicy.egress.database.to (a podSelector/namespaceSelector for an in-cluster database, or an ipBlock for a managed one). DNS alone leaves the server unable to reach its DSN, which fails readiness with a connect timeout and no mention of the policy. The destination table is in the book, installation/hardening-network-policy.md §Egress." }}
  {{- end }}
  egress:
    # DNS is always required: without it every destination below fails name
    # resolution regardless of its own rule.
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.egress.database.to }}
    # The database (never optional — the server cannot pass readiness without it).
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.networkPolicy.egress.database.port }}
          protocol: TCP
    {{- end }}
    {{- if .Values.terminology.enabled }}
    # The in-cluster FerroTERM, by pod selector. Rendered by the chart rather
    # than left to `rules`, because the operator did not choose this
    # destination's address — the chart did, when it wired
    # config.terminology.external at the Service above it. Omitted, a hardened
    # install loses terminology while every other check stays green: a binding
    # the server cannot resolve is ACCEPTED under the shipped fail-open
    # posture, so nothing refuses and nothing logs an error.
    #
    # 8080 is the CONTAINER port, not terminology.service.port: `port`
    # "represents the port on the given protocol. This can either be a
    # numerical or named port on a pod"
    # (https://kubernetes.io/docs/reference/kubernetes-api/policy-resources/network-policy-v1/,
    # NetworkPolicyPort) — the destination pod's, after the Service's
    # translation.
    - to:
        - podSelector:
            matchLabels:
              {{- include "ferroehr.terminologySelectorLabels" . | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.egress.rules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
