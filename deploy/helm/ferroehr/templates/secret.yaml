{{- if eq (include "ferroehr.hasChartSecret" .) "true" }}
# Chart-managed Secret. In production prefer database.existingSecret (and an
# external secret store / IRSA for the rest); anything set here is rendered from
# values, so keep it out of committed values.
#
# Two key shapes live here, and the difference is deliberate. A key spelled
# `<config.path>` is MOUNTED as a read-only file and reached through the config
# tree's `*_file` sibling — the posture the OWASP Kubernetes Security Cheat Sheet
# asks for, since an environment variable is readable through /proc/<pid>/environ
# and inherited by every child process
# (https://cheatsheetseries.owasp.org/cheatsheets/Kubernetes_Security_Cheat_Sheet.html).
# A key spelled `FERROEHR__…` is injected as an environment VALUE. Only two are
# left in that form — `audit.fhir_feed.url` and `multimedia.access_key_id`, the
# remaining config keys with no `*_file` sibling. The DSN and the AMQP URL moved
# to files once the server gained `db.url_file` and `events.url_file`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ferroehr.secretName" . }}
  labels:
    {{- include "ferroehr.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.authOidcHmacSecret }}
  auth.oidc.hmac_secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.signingKeyPassphrase }}
  signing.key_passphrase: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.multimediaSecretAccessKey }}
  multimedia.secret_access_key: {{ . | quote }}
  {{- end }}
  {{- range $user, $hash := .Values.secrets.basicUserPasswordHashes }}
  auth.basic.users.{{ $user }}.password_hash: {{ $hash | quote }}
  {{- end }}
  {{- range $name, $value := .Values.secrets.terminologyOauth2ClientSecrets }}
  terminology.external.oauth2_clients.{{ $name }}.client_secret: {{ $value | quote }}
  {{- end }}
  {{- if and (not .Values.database.existingSecret) .Values.database.url }}
  db.url: {{ .Values.database.url | quote }}
  {{- end }}
  {{- range $domain := list "clinical" "party" "linkage" "audit" }}
  {{- $dsn := index $.Values.database $domain }}
  {{- if and (not $dsn.existingSecret) $dsn.url }}
  storage.{{ $domain }}.url: {{ $dsn.url | quote }}
  {{- end }}
  {{- end }}
  {{- if and (not .Values.database.migrateExistingSecret) .Values.database.migrateUrl }}
  db.migrate_url: {{ .Values.database.migrateUrl | quote }}
  {{- end }}
  {{- with .Values.secrets.eventsUrl }}
  events.url: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.auditFhirFeedUrl }}
  FERROEHR__AUDIT__FHIR_FEED__URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.multimediaAccessKeyId }}
  FERROEHR__MULTIMEDIA__ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if eq (include "ferroehr.hasConfigSecret" .) "true" }}
---
# Mounted config files (TOML/PEM) at /etc/ferroehr — file-shaped material an
# in-TOML `*_path`/`*_file` key points at: the PGP key, Cedar/ABAC policies,
# ATNA PEMs, a JWKS blob. Mounted alongside ferroehr.toml.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ferroehr.configSecretName" . }}
  labels:
    {{- include "ferroehr.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq (include "ferroehr.configInSecret" .) "true" }}
  # ferroehr.toml lives HERE rather than in a ConfigMap because the configuration
  # carries a secret the chart has no `secrets:` route for — today only a Basic
  # user's Argon2id hash, whose config key has no `*_file` sibling. No ConfigMap
  # is rendered in this mode; this is the file the pod reads.
  ferroehr.toml: |
    {{- include "ferroehr.configToml" . | nindent 4 }}
  {{- end }}
  {{- range $name, $content := .Values.config.files }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
