# Default values for ferroehr.
#
# Configuration model: the server reads ONE `ferroehr.toml`. This
# chart renders that file from the `config:` block below (typed values mapped
# 1:1 onto the ferroehr.toml schema) into a ConfigMap mounted at
# /etc/ferroehr/ferroehr.toml, which the Deployment names in FERROEHR_CONFIG
# (the server searches for no file). Secrets never go in the ConfigMap: they come from a Secret (see
# `secrets:` and `database:`) — mounted as read-only FILES wherever the config key
# has a `*_file` sibling, which is now everything except `audit.fhir_feed.endpoint.url` and
# `record.multimedia.access_key_id`; only the mounted PATH is passed as env. `config.files` mounts genuinely file-shaped material
# (Cedar policies, ATNA PEMs, the PGP key, JWKS) that in-TOML `*_path`/`*_file`
# keys point at. `extraEnv` is the escape hatch for anything not surfaced here.
#
# Every feature below defaults to the SAME state as the binary (all optional
# integrations OFF), with one deliberate deployment exception: the management
# surface's master switch is ON, so enabling Prometheus scraping is a one-key
# change (config.management.endpoints.prometheus: public). Every management
# endpoint still defaults to `off`, so nothing is actually exposed. The health
# probes do NOT depend on it: /health, /health/liveness and /health/readiness are
# always served on the HTTP port.
#
# The env-mapping grammar for overrides is FERROEHR_ + the TOML path upper-cased
# with `__` between segments (e.g. config.db.max_connections ⇔
# FERROEHR__DATABASE__MAX_CONNECTIONS). app/ferroehr/assets/ferroehr.default.toml is the
# complete TOML schema with every key and its default.
#
# The database role architecture, the pgaudit/TLS/PITR posture, and the
# optional-integrations security notes are deployment concerns: no openEHR spec
# governs them, so each is summarised inline at the setting it applies to.

# -- Number of replicas (ignored when autoscaling.enabled is true).
replicaCount: 2

# ─────────────────────────────────────────────────────────────────────────────
# Rollout strategy. The OWASP Kubernetes Security Cheat Sheet's upgrade rule is
# that a new version arrives as a rolling update rather than by mutating a
# running container, so the strategy is stated here rather than inherited
# silently from the API server's defaults
# (https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy).
#
# `maxUnavailable: 0` guarantees the served capacity never DROPS during an
# upgrade: a new pod must pass its readiness probe before an old one is removed.
# At the default two replicas this is exactly what Kubernetes already computed
# (25% of 2 rounds down to 0), so it changes nothing here — it only matters above
# two replicas, where the percentage default would take a pod out of service.
# The trade-off, stated because it is real: with no spare scheduling capacity a
# `maxUnavailable: 0` rollout STALLS rather than proceeding at reduced capacity.
# That is the safe direction for a clinical API, and it fails visibly.
# ─────────────────────────────────────────────────────────────────────────────
strategy:
  # -- Rollout strategy. RollingUpdate with maxUnavailable 0 never drops capacity; Recreate takes the service down.
  type: RollingUpdate
  rollingUpdate:
    # -- Extra pods allowed above `replicaCount` while rolling.
    maxSurge: 1
    # -- Pods allowed to be unavailable while rolling. 0 = capacity never drops.
    maxUnavailable: 0

image:
  # -- Image repository. Multi-arch distroless (gcr.io/distroless/cc-debian13:nonroot base).
  repository: ghcr.io/ferrohealth/ferroehr
  # -- Pull policy. IfNotPresent + an immutable pinned tag/digest in production.
  pullPolicy: IfNotPresent
  # -- Image tag. Empty string falls back to .Chart.appVersion. Pin a version in
  # production, never `latest` — and prefer `digest` below, which a tag cannot be
  # substituted for once it is set.
  tag: ""
  # -- Image digest (`sha256:…`). Set it and the pod runs `repository@digest`,
  # ignoring `tag` entirely: a digest is what the provenance attestation is made
  # over, so deploying by digest is what makes verification bind to the running
  # image. A tag can be moved afterwards; a digest cannot.
  digest: ""

# -- imagePullSecrets for private registries.
imagePullSecrets: []
# -- Override the chart name portion of resource names.
nameOverride: ""
# -- Override the full resource name.
fullnameOverride: ""

serviceAccount:
  # -- Create a dedicated ServiceAccount.
  create: true
  # -- Extra annotations (e.g. IRSA/Workload-Identity role bindings for S3).
  annotations: {}
  # -- Name to use; generated when empty.
  name: ""
  # -- The workload never calls the K8s API, so no token is mounted.
  automountServiceAccountToken: false

# ─────────────────────────────────────────────────────────────────────────────
# Database credential (external PostgreSQL 18).
#
# There is NO in-chart PostgreSQL. A clinical data repository stores PHI; its
# database MUST be an externally-managed, backed-up, PITR-capable PostgreSQL 18
# (managed service or an operator-run cluster) — never a chart-side sidecar.
#
# The application connects as the UNPRIVILEGED `ferroehr_clinical` writer role: a
# LOGIN role granted the DML privileges the runtime needs and none of the DDL
# ones, so a compromised app process cannot alter the schema (PostgreSQL 18
# docs, "Database Roles": https://www.postgresql.org/docs/18/user-manag.html).
# The DSN is a SECRET, and the credential that reaches patient data: it is MOUNTED
# from a Secret as /etc/ferroehr-secrets/db.url and reached through
# `FERROEHR__DATABASE__URL_FILE`, so it never enters the pod's environment (an env value
# is readable through /proc/<pid>/environ and inherited by every child process).
# Never the ConfigMap. The non-secret pool bounds live in
# config.database.{max_connections,min_connections,acquire_timeout}.
# ─────────────────────────────────────────────────────────────────────────────
database:
  # -- Reference an existing Secret holding the app-role DSN (STRONGLY preferred
  # for production — keeps the credential out of chart values and git). The
  # secret's value must be a full `postgres://ferroehr_clinical:...@host:5432/ferroehr`
  # (optionally `?sslmode=verify-full`).
  existingSecret: ""
  # -- Key WITHIN existingSecret that holds the DSN. This is a Secret key name,
  # not an environment variable name: the chart mounts that key as a file and
  # passes only its PATH as `FERROEHR__DATABASE__URL_FILE`, so the DSN never enters the
  # pod's environment. The default spelling is kept for compatibility with
  # existing Secrets created for the older env-borne arrangement.
  existingSecretKey: FERROEHR__DATABASE__URL
  # -- Inline DSN (DEV/TEST ONLY — lands in a chart-managed Secret). Leave empty
  # and use existingSecret in production. Ignored when existingSecret is set.
  url: ""
  # -- An existing ConfigMap holding the CA certificate the database servers'
  # certificates chain to, for DSNs carrying
  # `?sslmode=verify-full&sslrootcert=/etc/ferroehr-db-ca/ca.crt`. Mounted
  # read-only at `/etc/ferroehr-db-ca` into the server, the migration Job and
  # the backup CronJobs, every pod that opens a database connection. Empty
  # mounts nothing; a CA the image already trusts needs no ConfigMap.
  caConfigMap: ""
  # -- Key WITHIN caConfigMap holding the PEM CA certificate; it lands as
  # `/etc/ferroehr-db-ca/ca.crt`.
  caConfigMapKey: ca.crt

  # ── one credential per storage domain ──────────────────────────────────────
  # The three storage domains — clinical, party, audit — are separated
  # by schema unconditionally, and the server refuses to boot if a runtime role
  # can read across. What the blocks below add is the CREDENTIAL separation, and
  # with it the ability to move a domain to a database or cluster of its own:
  # each domain's pool connects on `[storage.<domain>].url`, and one leaked
  # connection string then reaches one domain rather than all of them.
  #
  # Leave a domain's block empty and it uses the DSN above, which is the
  # schema-only posture: still separated, still boot-checked, one credential.
  # GDPR Art. 4(5) treats the identifying data as what must be kept apart; the
  # Swiss EPDV Art. 10 Abs. 1 lit. b asks for storage "von anderen Datenbeständen
  # getrennt" and DSV Art. 4 Abs. 5 for the log to be kept "getrennt vom System,
  # in welchem die Personendaten bearbeitet werden" — separations a schema inside
  # one database cannot make, because a base backup, WAL archiving and physical
  # replication carry every schema together. No openEHR spec governs database
  # roles — our own design.
  #
  # The four runtime roles (ferroehr_clinical, ferroehr_party and a read-only
  # twin of each) are created by the migrations ONLY when the migrator holds
  # CREATEROLE; otherwise they are skipped with a NOTICE and provisioning them
  # is yours. The released grant files also name ferroehr_linkage, so a first
  # install without CREATEROLE needs that role too while the migrations run;
  # the last migration drops it, or tells you to when it cannot. `ferroehr db verify` reports whether the
  # boundary holds, and `deployment.profile: production` refuses to boot while a
  # domain role is missing.
  #
  # Set both pseudonymisation domains and no credential the server uses can
  # join an identity to a record in SQL: each domain's roles are revoked from
  # the other's schema. The crossing then happens in the application, over two
  # connections, and every resolution is recorded as a linkage-domain access
  # event.
  #
  # A domain may live in a database or cluster of its own. Such a database is
  # prepared, and verified, on ITS migration credential: give the domain a
  # `migrateExistingSecret` below, and the migration Job and the server both
  # mount it.

  clinical:
    # -- Reference an existing Secret holding the CLINICAL-role DSN
    # (`postgres://ferroehr_clinical:...@host:5432/ferroehr`). Empty uses
    # `database.existingSecret` / `database.url`.
    existingSecret: ""
    # -- Key WITHIN it holding that DSN. Mounted as a file; only its PATH
    # reaches the pod's environment.
    existingSecretKey: FERROEHR__DATABASE__CLINICAL__URL
    # -- Inline clinical DSN (DEV/TEST ONLY — lands in a chart-managed Secret).
    # Ignored when `clinical.existingSecret` is set.
    url: ""
    # -- Reference an existing Secret holding the DSN that PREPARES the database
    # this domain lives in, when it is not the database
    # `database.migrateExistingSecret` reaches (a migrator of THAT database).
    # Mounted into the migration Job, which applies the schema there, and into
    # the server, which verifies it there under `config.db.migrate=verify`.
    # Empty: such a database is prepared on this domain's own DSN, which a
    # DML-only role cannot do.
    migrateExistingSecret: ""
    # -- Key WITHIN migrateExistingSecret holding that DSN. Mounted as a file.
    migrateExistingSecretKey: FERROEHR__DATABASE__CLINICAL__MIGRATE_URL

  party:
    # -- Reference an existing Secret holding the PARTY-role DSN
    # (`postgres://ferroehr_party:...@host:5432/ferroehr`), a different
    # credential from `database.existingSecret`.
    existingSecret: ""
    # -- Key WITHIN it holding that DSN. Mounted as a file.
    existingSecretKey: FERROEHR__DATABASE__PARTY__URL
    # -- Inline party DSN (DEV/TEST ONLY). Ignored when
    # `party.existingSecret` is set.
    url: ""
    # -- Reference an existing Secret holding the DSN that PREPARES the database
    # this domain lives in, when it is not the database
    # `database.migrateExistingSecret` reaches (a migrator of THAT database).
    # Mounted into the migration Job, which applies the schema there, and into
    # the server, which verifies it there under `config.db.migrate=verify`.
    # Empty: such a database is prepared on this domain's own DSN, which a
    # DML-only role cannot do.
    migrateExistingSecret: ""
    # -- Key WITHIN migrateExistingSecret holding that DSN. Mounted as a file.
    migrateExistingSecretKey: FERROEHR__DATABASE__PARTY__MIGRATE_URL

  audit:
    # -- Reference an existing Secret holding the DSN the audit repository is
    # written through. The audit trail is not a pseudonymisation domain — it is
    # the node's security-surveillance record, strictly outside the EHR content
    # — but it is the one domain a deployment most often wants on its own
    # server, which DSV Art. 4 Abs. 5 asks for.
    existingSecret: ""
    # -- Key WITHIN it holding that DSN. Mounted as a file.
    existingSecretKey: FERROEHR__DATABASE__AUDIT__URL
    # -- Inline audit DSN (DEV/TEST ONLY). Ignored when
    # `audit.existingSecret` is set.
    url: ""
    # -- Reference an existing Secret holding the DSN that PREPARES the database
    # this domain lives in, when it is not the database
    # `database.migrateExistingSecret` reaches (a migrator of THAT database).
    # Mounted into the migration Job, which applies the schema there, and into
    # the server, which verifies it there under `config.db.migrate=verify`.
    # Empty: such a database is prepared on this domain's own DSN, which a
    # DML-only role cannot do.
    migrateExistingSecret: ""
    # -- Key WITHIN migrateExistingSecret holding that DSN. Mounted as a file.
    migrateExistingSecretKey: FERROEHR__DATABASE__AUDIT__MIGRATE_URL

  # ── the credential that prepares the schema ────────────────────────────────
  # No domain DSN above can do it. Preparing spans every schema of a database —
  # the DDL of each resident migration set under config.db.migrate=apply, their
  # _sqlx_migrations bookkeeping tables under verify — while each runtime role
  # holds one domain, so a pod on ferroehr_clinical cannot even VERIFY, and is
  # refused on the first set. It prepares every domain whose DSN reaches the
  # same DATABASE it does — all of them in the ordinary posture, where the
  # per-domain credentials sit on one database; a domain relocated to another
  # database is prepared on that domain's `migrateExistingSecret`.
  #
  # Set this whenever the pod's DSN is a domain-scoped role. The server opens
  # it for that one boot step and closes it again: no pool is held on it and no
  # request is served through it. Unset, it falls back to the DSN above, which
  # is what a single-credential deployment runs.
  #
  # It is the same credential migrations.job.existingSecret carries. Pointing
  # both at one Secret is the ordinary arrangement; the Job needs its own copy
  # because it runs before the Deployment exists.

  # -- Reference an existing Secret holding the DSN that PREPARES the schema
  # (`postgres://ferroehr_migrator:...@host:5432/ferroehr`). Required when the
  # runtime DSNs are domain-scoped roles, including under
  # `config.db.migrate=verify`.
  migrateExistingSecret: ""
  # -- Key WITHIN migrateExistingSecret holding that DSN. Mounted as a file;
  # only its PATH reaches the pod's environment.
  migrateExistingSecretKey: FERROEHR__DATABASE__MIGRATE_URL
  # -- Inline schema-preparation DSN (DEV/TEST ONLY — lands in a chart-managed
  # Secret). Ignored when migrateExistingSecret is set.
  migrateUrl: ""

# ─────────────────────────────────────────────────────────────────────────────
# Migrations: who runs the schema.
#
# Migrations are append-only DDL, so whoever applies them can rewrite the
# schema. Two postures, and the choice is yours:
#   (a) The server migrates itself at boot (config.db.migrate=apply, the
#       default). Simplest, and the runtime DSN must then be a member of
#       ferroehr_migrator — i.e. the running process holds DDL rights.
#   (b) A separate migration step under a migrator DSN, with the server on
#       config.db.migrate=verify and a DSN that is ferroehr_clinical ONLY. The server
#       then issues no DDL at all and refuses to boot against a database that
#       has not been migrated. Recommended for production.
# Setting migrations.job.enabled runs (b) for you as a pre-install/pre-upgrade
# hook Job that Helm waits on, so a failed migration fails the release. Point
# its migrator DSN at a short `lock_timeout` (`?options=-c%20lock_timeout%3D5s`)
# so DDL blocked behind live traffic fails fast instead of queueing (PostgreSQL
# 18 docs, "Client Connection Defaults" § lock_timeout:
# https://www.postgresql.org/docs/18/runtime-config-client.html).
# ─────────────────────────────────────────────────────────────────────────────
migrations:
  # -- Purely informational marker rendered into NOTES for the operator.
  runByMigratorRole: true
  job:
    # -- Run the migrations as a pre-install/pre-upgrade hook Job under the
    # migrator DSN. Pair it with config.db.migrate=verify and an app-role-only
    # runtime DSN for the least-privilege posture.
    enabled: false
    # -- REQUIRED when enabled: an existing Secret holding the MIGRATOR DSN
    # (`postgres://ferroehr_migrator:...@host:5432/ferroehr`). Deliberately a
    # different credential from `database.*`, which carries the runtime app-role
    # DSN — rendering fails if it is empty.
    existingSecret: ""
    # -- Key WITHIN existingSecret holding the migrator DSN. Mounted as a file;
    # only its PATH reaches the pod's environment.
    existingSecretKey: FERROEHR__DATABASE__URL
    # -- Retries before the Job (and therefore the release) is declared failed.
    backoffLimit: 3
    # -- How long the finished Job's pod is kept for its logs.
    ttlSecondsAfterFinished: 600
    # -- Hard ceiling on the migration step; a migration blocked behind live
    # traffic must fail the release rather than hang it.
    activeDeadlineSeconds: 600
    # -- Resource requests/limits for the migration pod.
    resources: {}
    # -- Extra annotations on the migration pod.
    podAnnotations: {}
    # -- Node selector for the migration pod.
    nodeSelector: {}
    # -- Tolerations for the migration pod.
    tolerations: []

# ─────────────────────────────────────────────────────────────────────────────
# Definitions loaded before the server starts (off while `files` is empty).
#
# Each file is stored in the definition store by an init container that runs
# `ferroehr definitions load` on the server's own configuration, in the order
# listed, before the server container starts. A deployment that maps its
# professionals to demographic parties needs the templates its party mapping
# names stored before boot, which refuses a mapping whose templates it lacks.
# A definition stored with the same text is left alone, so the step runs at
# every pod start; one stored under the same id with other text fails the
# pod, because a stored definition never changes. The files travel in a
# ConfigMap of their own. No openEHR spec governs loading definitions out of
# band: our own design.
#
# The default is FerroEHR's default demographic definitions, copies of
# deploy/definitions/ held equal to the files by a test of the loader: the
# professional PERSON and ROLE, the care-team GROUP, the membership and
# representation PARTY_RELATIONSHIP archetypes, the patient PERSON, the
# healthcare provider ORGANISATION, and the policy AGENT, ROLEs and acts-for
# PARTY_RELATIONSHIP, adapted from openEHR CKM archetypes (CC-BY-SA 3.0; each directory's PROVENANCE.md names the
# sources). Setting `files` replaces the list, so a deployment that loads its
# own templates lists them, and `files: []` loads none.
# ─────────────────────────────────────────────────────────────────────────────
definitions:
  # -- The definitions to load, in order: each `name` a file name ending in
  # `.opt` (an OPT 1.4 template) or `.adls` (an ADL 2 archetype or template,
  # its parents and slot fillers first) and its `content`.
  # @default -- FerroEHR's thirteen default demographic definitions (the book's "Default demographic definitions" page)
  files:
    - name: openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1.0.0.adls
      content: |
        archetype (adl_version=2.0.6; rm_release=1.1.0)
            openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1.0.0

        language
            original_language = <[ISO_639-1::en]>

        description
            original_author = <
                ["name"] = <"FerroEHR">
                ["organisation"] = <"Cadasto B.V.">
            >
            lifecycle_state = <"unmanaged">
            details = <
                ["en"] = <
                    language = <[ISO_639-1::en]>
                    purpose = <"A healthcare professional's PERSON, whose login identifiers bind the person to their sign-ins.">
                    use = <"Adapted from the openEHR CKM archetypes the derived_from entry names: the person's identifiers in details, the name in identities and a work email in contacts, every element optional so a person provisioned without one is complete.">
                    copyright = <"© openEHR Foundation">
                >
            >
            other_details = <
                ["licence"] = <"This work is licensed under the Creative Commons Attribution-ShareAlike 3.0 License. To view a copy of this license, visit http://creativecommons.org/licenses/by-sa/3.0/.">
                ["derived_from"] = <"openEHR-DEMOGRAPHIC-PERSON.person.v0 (openEHR CKM 1013.1.479, modified 2022-01-20), openEHR-DEMOGRAPHIC-CLUSTER.person_identifier.v0 (openEHR CKM 1013.1.470, modified 2018-12-20), openEHR-DEMOGRAPHIC-PARTY_IDENTITY.person_name.v0 (openEHR CKM 1013.1.477, modified 2019-08-09), openEHR-DEMOGRAPHIC-ADDRESS.electronic_communication.v0 (openEHR CKM 1013.1.486, modified 2019-08-08)">
            >

        definition
            PERSON[id1] matches {
                details matches {
                    ITEM_TREE[id2] matches {
                        items matches {
                            ELEMENT[id3] occurrences matches {0..*} matches {
                                value matches { DV_IDENTIFIER[id13] }
                            }
                        }
                    }
                }
                identities matches {
                    PARTY_IDENTITY[id4] matches {
                        name matches {
                            DV_TEXT[id18]
                            DV_CODED_TEXT[id19] matches {
                                defining_code matches {[ac1]}
                            }
                        }
                        details matches {
                            ITEM_TREE[id5] matches {
                                items matches {
                                    ELEMENT[id6] occurrences matches {0..1} matches {
                                        value matches { DV_TEXT[id14] }
                                    }
                                    ELEMENT[id7] occurrences matches {0..1} matches {
                                        value matches { DV_TEXT[id15] }
                                    }
                                    ELEMENT[id8] occurrences matches {0..1} matches {
                                        value matches { DV_TEXT[id16] }
                                    }
                                }
                            }
                        }
                    }
                }
                contacts matches {
                    CONTACT[id9] occurrences matches {0..1} matches {
                        addresses matches {
                            ADDRESS[id10] matches {
                                name matches {
                                    DV_TEXT[id20]
                                    DV_CODED_TEXT[id21] matches {
                                        defining_code matches {[ac2]}
                                    }
                                }
                                details matches {
                                    ITEM_TREE[id11] matches {
                                        items matches {
                                            ELEMENT[id12] occurrences matches {0..1} matches {
                                                value matches { DV_TEXT[id17] }
                                            }
                                            ELEMENT[id22] occurrences matches {0..1} matches {
                                                value matches {
                                                    DV_TEXT[id23]
                                                    DV_CODED_TEXT[id24] matches {
                                                        defining_code matches {[ac3]}
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }

        terminology
            term_definitions = <
                ["en"] = <
                    ["id1"] = <text = <"Healthcare professional"> description = <"A person who provides healthcare.">>
                    ["id2"] = <text = <"Person identifiers"> description = <"The identifiers of the person.">>
                    ["id3"] = <text = <"Identifier main data"> description = <"An identifier of the person, such as a login identifier.">>
                    ["id4"] = <text = <"Person name"> description = <"The name of the person.">>
                    ["id5"] = <text = <"Name"> description = <"The structure of the name.">>
                    ["id6"] = <text = <"Full name"> description = <"The name as it is written in full.">>
                    ["id7"] = <text = <"Given name"> description = <"The given name of the person.">>
                    ["id8"] = <text = <"Family name"> description = <"The family name of the person.">>
                    ["id9"] = <text = <"Contacts"> description = <"The contacts of the person.">>
                    ["id10"] = <text = <"Electronic communication"> description = <"An electronic address of the person.">>
                    ["id11"] = <text = <"Electronic communication details"> description = <"The structure of the address.">>
                    ["id12"] = <text = <"Email address"> description = <"The work email address of the person.">>
                    ["id22"] = <text = <"Usage"> description = <"What the address is used for.">>
                    ["ac1"] = <text = <"Name usages"> description = <"The usages of a person's name.">>
                    ["ac2"] = <text = <"Electronic address types"> description = <"The types of an electronic address.">>
                    ["ac3"] = <text = <"Address usages"> description = <"What an address is used for.">>
                    ["at20"] = <text = <"Reporting name"> description = <"Reporting name.">>
                    ["at21"] = <text = <"Newborn name"> description = <"Newborn name.">>
                    ["at22"] = <text = <"Professional or business name"> description = <"Professional or business name.">>
                    ["at23"] = <text = <"Maiden name"> description = <"Maiden name.">>
                    ["at24"] = <text = <"Legal name"> description = <"Legal name.">>
                    ["at25"] = <text = <"Other name"> description = <"Other name.">>
                    ["at30"] = <text = <"Telephone"> description = <"Telephone.">>
                    ["at31"] = <text = <"Fax"> description = <"Fax.">>
                    ["at32"] = <text = <"Mobile"> description = <"Mobile.">>
                    ["at33"] = <text = <"Pager"> description = <"Pager.">>
                    ["at34"] = <text = <"E-mail"> description = <"E-mail.">>
                    ["at35"] = <text = <"URL"> description = <"URL.">>
                    ["at40"] = <text = <"Personal"> description = <"Personal.">>
                    ["at41"] = <text = <"Business"> description = <"Business.">>
                    ["at42"] = <text = <"Personal/Business"> description = <"Personal/Business.">>
                    ["at43"] = <text = <"Other use"> description = <"Other use.">>
                >
            >
            value_sets = <
                ["ac1"] = <
                    id = <"ac1">
                    members = <"at20", "at21", "at22", "at23", "at24", "at25">
                >
                ["ac2"] = <
                    id = <"ac2">
                    members = <"at30", "at31", "at32", "at33", "at34", "at35">
                >
                ["ac3"] = <
                    id = <"ac3">
                    members = <"at40", "at41", "at42", "at43">
                >
            >
    - name: openEHR-DEMOGRAPHIC-ROLE.healthcare_professional.v1.0.0.adls
      content: |
        archetype (adl_version=2.0.6; rm_release=1.1.0)
            openEHR-DEMOGRAPHIC-ROLE.healthcare_professional.v1.0.0

        language
            original_language = <[ISO_639-1::en]>

        description
            original_author = <
                ["name"] = <"FerroEHR">
