# ─────────────────────────────────────────────────────────────────────────────
# Per-domain logical backups (off by default).
#
# One CronJob per pseudonymisation domain, each dumping ONLY its own
# schemas into its OWN PersistentVolumeClaim under its OWN credential. A single
# artefact carrying the clinical record and the identifying data together undoes
# the separation pseudonymisation rests on (GDPR Art. 4(5),
# https://eur-lex.europa.eu/eli/reg/2016/679/oj), and the restore capability is
# Art. 32(1)(c). The mechanism is `pg_dump --schema`
# (https://www.postgresql.org/docs/18/app-pgdump.html): the clinical job dumps
# clinical and ext, and the party job dumps party. THE AUDIT DOMAIN IS A THIRD
# JOB, rendered only when
# `database.audit.existingSecret` gives that domain a database of its own: there
# the clinical dump cannot reach the trail and nothing else would take it. While
# the audit domain shares the clinical database it has no job of its own and the
# clinical dump names its schema instead. Each domain's archival tier is a
# partition inside its own schema, so it travels with it. No openEHR spec
# governs backups — our own design/extension.
#
# EACH JOB NEEDS ITS OWN BACKUP CREDENTIAL, and it is not the pool's. Each
# domain's runtime role is revoked from the other domains, so it cannot read a
# whole database and a dump taken through it would be silently partial — that is
# the pseudonymisation boundary working, not a misconfiguration. Give each job a
# role that is read-only on its own domain, through
# `backup.<domain>.existingSecret`. The DSN arrives as a mounted file, never as
# an environment variable.
#
# The chart keeps the dumps apart; ACCESS CONTROL over them is yours. Back the
# claims with different volumes and give the party one the narrower
# audience — any two domains sharing a claim is refused at render, because that
# is the state this whole section exists to prevent.
#
# Off by default: the destination is a claim you provision. Two further things
# this chart does not do, said here rather than assumed: nothing prunes old
# dumps, and no NetworkPolicy of ours selects these pods. And a logical dump is
# not point-in-time recovery — PITR is instance-wide and stays database-side.
# ─────────────────────────────────────────────────────────────────────────────
backup:
  # -- Render the per-domain backup CronJobs: clinical, party, and
  # audit when `database.audit.existingSecret` gives it a database of its own.
  # Each rendered domain then needs its own `persistentVolumeClaim` below, or
  # the render is refused.
  enabled: false
  image:
    # -- Image carrying `pg_dump`. The project's own PostgreSQL 18 image, so the
    # dump is taken by the same major version the server runs against.
    repository: ghcr.io/ferrohealth/ferroehr-postgres
    # -- Pull policy.
    pullPolicy: IfNotPresent
    # -- Image tag. Empty falls back to .Chart.appVersion, as the server's does.
    tag: ""
    # -- Image digest (`sha256:…`); wins over `tag` entirely when set.
    digest: ""
  # -- IANA time zone the schedules below are read in ("Europe/Amsterdam"). Empty
  # leaves the kube-controller-manager's own zone, which is where an unqualified
  # schedule drifts between clusters (KEP-3140, stable v1.27 —
  # https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/).
  timeZone: ""
  # -- Seconds a dump that missed its scheduled time may still start in; past it
  # the run is skipped and the next schedule stands
  # (https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/).
  startingDeadlineSeconds: 3600
  # -- Retries before a dump is declared failed.
  backoffLimit: 2
  # -- Hard ceiling on one dump, so a dump blocked on the database ends rather
  # than overlapping the next schedule.
  activeDeadlineSeconds: 7200
  # -- How long a finished dump's pod is kept for its logs.
  ttlSecondsAfterFinished: 86400
  # -- Resource requests/limits for the dump pods.
  resources: {}
  # -- Extra annotations on the dump pods.
  podAnnotations: {}
  # -- Node selector for the dump pods.
  nodeSelector: {}
  # -- Tolerations for the dump pods.
  tolerations: []
  clinical:
    # -- Cron schedule for the clinical dump (schemas clinical and ext, plus
    # audit while the audit domain shares this database).
    schedule: "15 1 * * *"
    # -- REQUIRED when enabled: Secret holding the clinical BACKUP DSN — a role
    # read-only on the clinical schemas, and not the pool's credential: each
    # domain's runtime role is revoked from the others, so a dump taken through
    # it would be silently partial.
    existingSecret: ""
    # -- Key within `existingSecret` carrying that DSN.
    existingSecretKey: FERROEHR__DATABASE__URL
    # -- REQUIRED when enabled: the name of an EXISTING PersistentVolumeClaim the
    # clinical dumps are written to, mounted at /backup. The chart creates no
    # claim — its storage class, size, retention and who may read it are yours.
    persistentVolumeClaim: ""
  party:
    # -- Cron schedule for the party dump (schema party). Offset from the
    # clinical one by default so no two dumps read the database in the same
    # minute.
    schedule: "45 1 * * *"
    # -- REQUIRED when enabled: Secret holding the party BACKUP DSN — a
    # read-only role on the party schema, and a DIFFERENT role from the clinical
    # one. This credential reads every identity the instance holds; treat it
    # accordingly.
    existingSecret: ""
    # -- Key within `existingSecret` carrying that DSN.
    existingSecretKey: FERROEHR__DATABASE__PARTY__URL
    # -- REQUIRED when enabled: an EXISTING PersistentVolumeClaim for the
    # party dumps, and a DIFFERENT one from every other domain's claim
    # (two domains sharing a claim is refused at render). This is the volume
    # that carries identifying data; give it the narrower audience.
    persistentVolumeClaim: ""
  audit:
    # -- Cron schedule for the audit dump (schema audit). Offset from the other
    # two by default so no two dumps read a database in the same minute. Only
    # read when `database.audit.existingSecret` is set; otherwise the trail
    # travels with the clinical dump and no audit job renders.
    schedule: "45 2 * * *"
    # -- REQUIRED when the audit domain has its own DSN: Secret holding the
    # audit BACKUP DSN — a read-only role on the audit schema in the database
    # `database.audit` points at. The clinical backup DSN is not it: that one
    # names the clinical database, which is not where this trail lives.
    existingSecret: ""
    # -- Key within `existingSecret` carrying that DSN.
    existingSecretKey: FERROEHR__DATABASE__AUDIT__URL
    # -- REQUIRED when the audit domain has its own DSN: an EXISTING
    # PersistentVolumeClaim for the audit dumps, and a DIFFERENT one from every
    # other domain's. The trail names patients and principals; it is the record
    # of who read what, so give its volume its own audience.
    persistentVolumeClaim: ""

# ─────────────────────────────────────────────────────────────────────────────
# Secret values carried by a chart-managed Secret. Anything set here is rendered
# from values (keep it out of committed values — prefer an external secret store
# / IRSA, or set these via `helm --set`/a values overlay from your secret
# manager). Each maps to the matching in-TOML key and wins over the file layer;
# empty = not supplied (the ConfigMap value, if any, stands).
#
# HOW each one reaches the process differs, and the reason is a security one: a
# secret mounted as a read-only FILE is preferred over an environment variable,
# which is readable through /proc/<pid>/environ and inherited by every child
# process (OWASP Kubernetes Security Cheat Sheet,
# https://cheatsheetseries.owasp.org/cheatsheets/Kubernetes_Security_Cheat_Sheet.html).
# So every value whose config key has a `*_file` sibling is MOUNTED at
# /etc/ferroehr-secrets/<config.path> and the chart passes only the PATH as env.
# The one key that has no `*_file` sibling (audit.fhir_feed.endpoint.url) still passes
# its value as env — that is a config-tree gap, not a chart choice.
#
# Setting any of these under `config:` instead REFUSES to render: they would land
# in the ConfigMap, which is not a sensitive object. The refusal names the key
# here that carries it securely.
# ─────────────────────────────────────────────────────────────────────────────
secrets:
  # -- PGP key passphrase (config.signing.mode=pgp). MOUNTED as
  # /etc/ferroehr-secrets/signing.key_passphrase (signing.key_passphrase_file).
  signingKeyPassphrase: ""
  # -- Argon2id password hashes for [[auth.basic.users]], keyed by user-id. Each
  # is MOUNTED as /etc/ferroehr-secrets/auth.basic.users.<user>.password_hash
  # and the chart injects the matching `password_hash_file` into the rendered TOML.
  # Declare the user itself — `user`, `scopes`, `roles` — under
  # config.auth.basic.users; a user-id with no matching entry is a render error. A hash under `config:` is refused: it
  # would reach the ConfigMap.
  basicUserPasswordHashes: {}
  # -- FHIR base URL of the external Audit Record Repository for
  # [audit.fhir_feed.endpoint] (may carry basic-auth credentials in its
  # userinfo) → FERROEHR__AUDIT__FHIR_FEED__ENDPOINT__URL env:
  # audit.fhir_feed.endpoint.url has no `*_file` sibling either.
  auditFhirFeedUrl: ""
  # -- The client secret of the terminology server's OAuth2 grant
  # ([terminology.endpoint.credentials.oauth]). MOUNTED as
  # /etc/ferroehr-secrets/terminology.server.oauth.client_secret, and the chart
  # injects the matching `client_secret_file` into the rendered TOML (a path is
  # not sensitive). Declare the grant itself — token_endpoint or issuer, client_id,
  # scope — under config.terminology.endpoint.credentials.oauth; a secret with no such
  # declaration is a render error.
  terminologyClientSecret: ""
  # -- The client secret of the identity source's OAuth2 grant
  # ([pixm.endpoint.credentials.oauth]). MOUNTED as
  # /etc/ferroehr-secrets/ehr_index.oauth.client_secret, and the chart injects
  # the matching `client_secret_file` into the rendered TOML. Declare the grant
  # itself (token_endpoint or issuer, client_id, scope) under
  # config.pixm.endpoint.credentials.oauth; a secret with no such declaration is
  # a render error.
  ehrIndexClientSecret: ""
  # -- S3 access key id for [multimedia] → FERROEHR__RECORD__MULTIMEDIA__ACCESS_KEY_ID
  # env. Not a secret in the server's own model (it is reported unredacted by
  # /management/env); prefer IRSA/Workload-Identity (leave empty) on cloud.
  multimediaAccessKeyId: ""
  # -- S3 secret access key for [multimedia]. MOUNTED as
  # /etc/ferroehr-secrets/multimedia.secret_access_key
  # (multimedia.secret_access_key_file).
  multimediaSecretAccessKey: ""

# ─────────────────────────────────────────────────────────────────────────────
# The usage report to FerroPULSE, the Cadasto-operated collector (EU). At each
# pod start and once a day per release (not per replica) the server sends a
# small JSON report: a random instance id, version, licence grant type, the
# deployment kind (`helm`, which the chart sets), uptime, coarse CPU/memory
# buckets and latency histograms per route-template group. No patient data,
# request paths, AQL text, licence ids or host names; the collector stores the
# source IP address and its country. Every boot logs one line saying whether it
# is on. Notice: https://ferroehr.eu/docs/latest/usage-report.html
# The chart injects usage_report.enabled and usage_report.deployment into the
# rendered ferroehr.toml, so set the switch here, never under config:. The
# endpoint stays an ordinary config.usage_report key. A pod that reports needs
# egress to report.ferropulse.eu:443 when networkPolicy.egress is on; without
# it the report logs a warning and nothing else is affected.
# ─────────────────────────────────────────────────────────────────────────────
usageReport:
  # -- Send the usage report (on by default). false sends nothing.
  enabled: true

# ─────────────────────────────────────────────────────────────────────────────
# Prometheus scraping. Whichever mechanism you use, the endpoint itself must be
# opened with config.management.endpoints.prometheus (requires
# config.management.enabled) — the chart only arranges DISCOVERY.
#
# Two mechanisms, and they are not interchangeable: the prometheus.io/* pod
# annotations work with a Prometheus that does kubernetes_sd discovery in its own
# scrape config, while an operator-managed Prometheus (kube-prometheus-stack)
# ignores them entirely and selects targets through ServiceMonitor objects
# (https://prometheus-operator.dev/docs/developer/getting-started/).
# ─────────────────────────────────────────────────────────────────────────────
metrics:
  # -- Add prometheus.io scrape annotations to the pods.
  enabled: false
  serviceMonitor:
    # -- Render a Prometheus Operator ServiceMonitor. Needs the
    # monitoring.coreos.com CRDs installed, or the install fails on an unknown kind.
    enabled: false
    # -- Namespace for the ServiceMonitor; empty = the release namespace.
    namespace: ""
    # -- Extra labels, for the `serviceMonitorSelector` your Prometheus matches on.
    labels: {}
    # -- Scrape interval / timeout.
    interval: 30s
    # -- Per-scrape timeout. Must be shorter than the interval.
    scrapeTimeout: 10s
  grafanaDashboard:
    # -- Ship the default "FerroEHR — service overview" Grafana dashboard as a
    # ConfigMap labelled `grafana_dashboard: "1"`, the label the Grafana Helm
    # chart's dashboard sidecar (and therefore kube-prometheus-stack) discovers
    # and auto-imports. The sidecar searches its own release namespace unless
    # its `sidecar.dashboards.searchNamespace` says otherwise.
    enabled: false
    # -- Value for the `grafana_folder` annotation. Applied only when the
    # sidecar's `folderAnnotation` feature is configured; harmless otherwise.
    folder: "FerroEHR"

# ═════════════════════════════════════════════════════════════════════════════
# ferroehr.toml — rendered VERBATIM into the ConfigMap as /etc/ferroehr/ferroehr.toml
# (keys map 1:1 onto the server config schema — app/ferroehr/assets/
# ferroehr.default.toml lists it in full). Secrets are NOT here — see `secrets:` above.
# The `files:` key is NOT part of the TOML (see below); it is mounted separately.
# ═════════════════════════════════════════════════════════════════════════════
config:
  # [deployment] — what this deployment is.
  deployment:
    # The openEHR specification generation set the server runs — one coupled
    # choice: "development" (RM 1.2.0 + BASE 1.3.0 + LANG 1.1.0, the default)
    # or "stable" (the released generations: RM 1.1.0 + BASE 1.2.0 +
    # LANG 1.0.0). stable → development is always safe; development → stable
    # only for data that never used development-only constructs (refused
    # loudly at read otherwise).
    spec_profile: development

  # The declared deployment posture, which the chart REFUSES to render
  # without: there is no default, so every installation says which posture it
  # runs (EHDS Annex II 1.2: installed following the manufacturer's
  # instructions without affecting the product's characteristics).
  # `sandbox` must not hold real patient data: the server names every missing
  # separation on its boot banner, in the log and on /management/status, and
    # GET /ferroehr/rest/status reports the profile. `production` refuses to
    # boot while a separation is missing and not named in `accepts`. These
    # chart defaults leave several open (one DSN for every domain, an empty
    # privacy.subject_namespaces, audit.fail_mode open, the open
    # authz.rbac.ehr_access_default, database.migrations apply on the runtime
    # credential, a plaintext listener behind the ingress), so a deployment
    # holding patient data starts from values-production.yaml, or sets
    # `production` and closes or accepts each one by name, e.g.
    #   profile: production
    #   accepts: [plaintext_listener]   # TLS terminates at the ingress
    # A trial install sets `profile: sandbox`. No openEHR spec governs this;
    # the reasoning is in the book's CRA risk assessment, Annex I Part I(2)(b).
    # The commercial licence token is a signed text file: it travels as a
    # `config.files` entry and `licence_file` names the mounted path.
    #   licence_file: /etc/ferroehr/licence.asc
    # -- (string)
    # @default -- unset: the chart refuses to render
    profile: null

  # [server] — the HTTP listener: the FerroHEALTH family's section, the same
  # keys in every product (the configuration reference lists them all).
  # The server's own defaults are `listen = "0.0.0.0:8080"`, the port the
  # Service, the probes and the NetworkPolicy name, and a 64 MiB
  # `body_limit` for the bulk routes (template upload, the /message
  # imports); the largest operational template in the vendored CKM corpus is
  # 5.4 MB.
  server:
    # The requests served at once; past it a request is answered 503 with
    # Retry-After, and the health probes are never refused.
    max_concurrent_requests: 256
    # [server.caller_rate] — per authenticated caller, refused 429 +
    # Retry-After. Not the same control as max_concurrent_requests (503): this
    # one is per caller over time. The defaults sit above the reference SUT's
    # measured whole-server ceiling (512 req/s); raise them in proportion on
    # server-class hardware. Remove the table before benchmarking, or the
    # benchmark measures the limiter.
    caller_rate:
      requests_per_second: 1024
      burst: 2048

  # [api] — the openEHR REST API.
  api:
    base_path: /ferroehr/rest/openehr/v1
    # Who may read the Swagger UI + the OpenAPI JSON: off, admin_only, private
    # (any authenticated principal) or public. The documents list the whole
    # enabled operation surface, so public discloses it anonymously.
    openapi_ui: private
    # The largest body the clinical surface accepts, below
    # server.body_limit, which the bulk routes keep. Raise it if
    # compositions embed large DV_MULTIMEDIA data. Over-limit is 413.
    body_limit: 16MiB
    # The ADMIN API group (physical, irreversible delete). Off ⇒ routes 405.
    admin: false
    # The terminology extension API; the server it asks is config.terminology.
    terminology: false
    # [api.cors] — absent sends no CORS header. Production lists its origins:
    #   cors:
    #     allow_origins: [https://app.example.com]

  # [database] — pool bounds (the DSN itself is the FERROEHR__DATABASE__URL secret, above).
  database:
    # apply | verify — whether the server runs its embedded migrations at boot.
    # `verify` issues no DDL and refuses to boot against a database that has not
    # been migrated, which is what lets the runtime DSN be ferroehr_clinical only.
    # Pair it with migrations.job.enabled (see the Migrations section above).
    migrations: apply
    max_connections: 10
    min_connections: 0
    acquire_timeout: 30s
    # The backstop the HTTP request timeout cannot be: dropping a handler future
    # does not cancel the statement PostgreSQL is running. Above
    # record.query.timeout so the engine's typed 408 fires first.
    statement_timeout: 1min

  # [telemetry]: the console, the request log and the OpenTelemetry export
  # (the family's shared section). json is correct for cluster log collectors;
  # a [telemetry.otlp] table with an endpoint exports spans and metrics.
  telemetry:
    format: json

  # [auth] — authentication: the FerroHEALTH family's shared section (bearer
  # tokens of the trusted issuers, Basic users). Enabled by default.
  # auth.enabled=true with NO mechanism is REFUSED BY THIS CHART AT RENDER TIME,
  # because the server refuses to boot on it (RFC 9110 §11.6.1: a 401 challenge
  # must name a scheme the server implements) and a crash-loop hides the reason
  # in a pod log. So a stock `helm install` stops with an actionable error rather
  # than appearing to succeed. Add an `issuer` table, an [[auth.basic.users]]
  # entry, or set enabled=false — the last serves EVERY request unauthenticated
  # and is a development-only choice the chart makes you state explicitly.
  # `issuer` is a list of tables, one per trusted issuer, each stating its
  # `kind` (persons | patients | machines | federation) and its `profile`
  # (rfc9068 | entra | keycloak | okta | nl) beside its `audience`; a persons
  # issuer lists its own clients in `first_party_clients` and has its
  # `party` table, the identifier issuer its logins bind under. Every Basic
  # user is a person, mapped by authz.party_binding.basic_user to the binding
  # key its PERSON carries, so a Basic user needs a persons issuer too. The
  # issuer is an https URL with no query/fragment, only asymmetric algorithms
  # are accepted, and every [[auth.basic.users]] password_hash must be
  # argon2id at m>=19456,t=2,p=1. All checked at boot. An issuer with
  # `sender_constraint: required` runs on any number of replicas: they record
  # the DPoP proofs they accept in the one database they share.
  #   issuer:
  #     - issuer: https://idp.example.com/realms/staff
  #       kind: persons
  #       profile: keycloak
  #       audience: [ferroehr]
  #       first_party_clients: [ferroehr-viewer]
  #   party:
  #     - issuer: https://idp.example.com/realms/staff
  #       identifier_issuer: urn:example:staff-login
  #       identifier_type: uuid
  # Every route enforces SMART on openEHR scopes: a Basic user's `scopes` and a
  # token's `scope` claim must grant what it calls; a subject listed in
  # `scopeless_subjects` whose token carries no resource scope meets every
  # SMART on openEHR requirement. `basic.cache_ttl` (default "5min") keeps a
  # verified Basic credential for that long, so a repeat request skips the
  # Argon2id derivation; 0 checks every request.
  # `mode: introspection` checks opaque tokens at the issuer's RFC 7662
  # endpoint, authenticating with an `introspection.client` grant (its
  # `client_secret_file` a mounted secret) instead of the issuer's key set.
  auth:
    enabled: true

  # [authz] — coarse RBAC (on with auth) + ABAC (off).
  authz:
    rbac:
      enabled: true
      admin_role: ADMIN
      # The persons issuers whose role claims may grant admin_role and the
      # other privileged roles; a token of any other issuer never holds them.
      role_issuers: []
    abac:
      enabled: false
    # The party binding. `provider` (issuer and id, in NL the URA) is required
    # once auth admits a credential: every access record of a bound person and
    # every version a person commits name it (EHDS Art. 13(4), Annex II 3.2(a)).
    # basic_user maps each Basic user to the binding key its PERSON carries.
    #   provider: { issuer: "urn:oid:2.16.528.1.1007.3.3", id: "12345678" }
    #   basic_user:
    #     - { user: clinician, key_issuer: urn:example:staff-login, key: "<binding key>" }
    party_binding:
      namespace: demographic
    # Each OAuth client-credentials client that commits: its issuer and
    # client_id, the provider it acts for, the facilities and templates it may
    # commit, and its origins (relay | device).
    #   - issuer: https://idp.example.com/realms/machines
    #     client_id: ferrobridge
    #     provider: { issuer: "urn:oid:2.16.528.1.1007.3.3", id: "12345678" }
    #     facilities: [{ issuer: urn:example:facility, id_prefix: ward- }]
    #     writes: []
    #     origins: [relay]
    system_client: []
    # What a federation issuer's external persons or organisation may do here,
    # one agreement per issuer and accessor (person | organisation), with its
    # legal ground, consent source, patient/ reads, caller_rate and, for an
    # organisation, its access_class (automated | chained). See the
    # configuration reference for every key.
    federation:
      agreement: []

  # [auth.scim] — the SCIM 2.0 service provider at /scim/v2 (RFC 7644),
  # through which an identity provider such as Microsoft Entra ID provisions
  # each professional as a demographic PERSON. Absent by default, and the
  # table's presence serves it. It needs a machines [[auth.issuer]] (the
  # deployment's own authorization server), an [[auth.party]] whose
  # identifier_issuer each client's binding_issuer names, and the person
  # template, attributes and professional_role under authz.party_binding.
  # public_base_url is required, and the Ingress then routes /scim/v2 on every
  # host. Under config.auth:
  #   scim:
  #     public_base_url: https://ferroehr.example.com
  #     max_deactivations: 100           # per client per window, else 429
  #     deactivation_window: 1h
  #     client:
  #       - issuer: https://as.example.com
  #         client_id: entra-provisioning
  #         scope: ferroehr/scim
  #         binding_issuer: urn:example:login

  # [management] — ops-introspection surface (info / prometheus / metrics / env /
  # loggers / flamegraph). The master switch is ON here (unlike the bare binary)
  # so scraping is a one-key change; every endpoint below stays off, so nothing
  # is exposed until you opt in (set prometheus=public + metrics.enabled to
  # scrape). Health probes are NOT part of this surface — /health,
  # /health/liveness and /health/readiness are always served on the HTTP port,
  # whatever this section says.
  management:
    enabled: true
    base_path: /management
    endpoints:
      # off | public | private | admin_only
      info: "off"
      metrics: "off"
      prometheus: "off"
      env: "off"
      loggers: "off"
      # On-demand CPU flamegraph of the running server (pprof sampling; caps
      # under [management.profiling] — see the configuration reference).
      flamegraph: "off"

  # [record] — the record itself: the subject index, signing, the query
  # engine, the change feed and multimedia.
  record:
    # [record.signing] — VERSION signing. On/digest by default (the STANDARD
    # "Signing" capability). pgp mode requires key_file (a mounted
    # config.files key) + the secrets.signingKeyPassphrase secret, and FAILS
    # CLOSED at boot.
    signing:
      enabled: true
      # digest | pgp
      mode: digest
      # off | warn | strict — read-time verification of OUR OWN signatures.
      # Defaults to strict when signing is enabled (a served version whose
      # stored signature no longer recomputes is a 5xx integrity fault); set
      # warn (log + meter, still serve) or off (never check) to opt out.
      # Client-supplied signatures are always stored verbatim and never
      # re-verified.
      verify_on_read: "strict"
    # [record.multimedia] — DV_MULTIMEDIA externalization → S3. Our own
    # extension; no openEHR spec governs it. Off by default (inline behaviour
    # byte-identical). WARNING: offloaded blobs are PHI — bucket must be
    # private, encrypted, HTTPS (an http:// url is plain HTTP, dev only).
    # Credentials are the secrets.multimedia* secrets.
    multimedia:
      enabled: false
      bucket: openehr-multimedia
      region: us-east-1
    # [record.change_feed] — the commit-event outbox and its cursor feed. Our
    # own extension; no openEHR spec governs it. Off until a reader is named:
    # FerroBRIDGE reads the feed (scope __ferroehr.outbox) and delivers the
    # PHI-free events to a message broker.
    #   change_feed:
    #     readers: [ferrobridge]
    # subject_index — who holds the subject-to-EHR cross-reference: "pixm",
    # an IHE patient identity source asked over PIXm (ITI-83, config.pixm), or
    # "local", the in-instance map. With `ferropix.enabled` the chart INJECTS
    # subject_index = "pixm" and config.pixm.endpoint.url (the in-cluster FerroPIX
    # Service), so declaring either is refused while it is on. You still name
    # the clinical domain and the grant:
    #   pixm:                                    # beside record:, under config
    #     assigning_authority: urn:oid:2.999.7.1   # also in privacy.subject_namespaces
    #     endpoint:
    #       credentials:
    #         oauth:
    #           token_endpoint: https://idp.example.org/token
    #           client_id: ferroehr                # FerroPIX's consumer_client_id
    #           scope: system/Patient.rs
    # with the client secret in `secrets.ehrIndexClientSecret`. Another PIX
    # Manager: `ferropix.enabled: false`, subject_index "pixm" and
    # pixm.endpoint.url.
    # A FerroEHR run on its own: `ferropix.enabled: false` and subject_index
    # "local". With neither the render is refused, as the server's boot would
    # be.

  # [audit] — the IHE ATNA audit trail. ON by default with only the local
  # store active (records stay in PostgreSQL, queryable via the ITI-81 FHIR
  # AuditEvent search); forwarding to an external ARR is opt-in per sink
  # ([audit.syslog] classic DICOM/syslog, [audit.fhir_feed] RESTful ATNA).
  audit:
    enabled: true
    store:
      enabled: true
      # How long records are kept, a calendar period (P3Y, P1096D); unset
      # (null) keeps them forever. The server refuses a horizon outside the
      # floors and ceilings of the jurisdictions its identifier rules name
      # (three years EU-wide, five NL, one CH, at most three DE for a declared
      # SGB V § 309 controller, who sets P3Y with sgb_v_309_controller: true).
      # -- (string)
      # @default -- unset
      retention: null
    # [audit.categories] — the EHDS priority category of every access,
    # classified by ehds-logging (FerroAUDIT): which categories each template
    # id, and failing that each root archetype id, holds. A priority category
    # is its HL7 Europe code (Patient-Summaries, Electronic-Prescriptions,
    # Electronic-Dispensations, Medical-Imaging, Laboratory-Reports,
    # Discharge-Reports) or <system>|<code>; a national one is declared under
    # national as <system>|<code>; data of no category map to the word none.
    # EMPTY by default: an access the map cannot classify is recorded
    # "unclassified", never refused. Example:
    #   templates:
    #     "International Patient Summary": [Patient-Summaries]
    #   archetypes:
    #     openEHR-EHR-COMPOSITION.report-result.v1: [Laboratory-Reports]
    #     openEHR-EHR-COMPOSITION.encounter.v1: none
    categories:
      templates: {}
      archetypes: {}

  # [terminology] — the outbound FHIR terminology server; absent, none is
  # asked. Not defaulted here: with `terminology.enabled` +
  # `terminology.wireCdr` the chart INJECTS its `endpoint.url` and `on_error`, and a
  # defaulted key is indistinguishable from one an operator typed — so the
  # render could not tell an agreement from an overwrite. Left out, a
  # declaration of either is visibly the operator's and is refused.

  # ── Mounted config files (NOT part of the TOML above) ──────────────────────
  # Each key becomes /etc/ferroehr/<key> from a chart Secret (opaque, read-only),
  # alongside ferroehr.toml. Use for file-shaped material an in-TOML `*_file`
  # key points at: the PGP key (record.signing.key_file), Cedar policies
  # (authz.abac.cedar.policy_dir), ATNA PEMs, a JWKS file (auth.jwks_file), the commercial
  # licence token (deployment.licence_file).
  files: {}
  # signing.asc: |
  #   -----BEGIN PGP PRIVATE KEY BLOCK-----
  #   ...
  # licence.asc: |
  #   -----BEGIN PGP SIGNED MESSAGE-----
  #   ...

# The server's trust in its `[auth]` issuer, beside the image's own roots.
auth:
  # -- Name of an existing Secret holding a PEM bundle of the certificate
  # authorities the server trusts for its `[auth]` issuer (the metadata and
  # the key set), beside the image's own roots: for an issuer behind a private
  # PKI. The chart mounts the key as a file and points
  # `[auth.tls] trust_roots_file` at it. Empty trusts the image's roots alone.
  caExistingSecret: ""
  # -- Key within `caExistingSecret` carrying the PEM bundle.
  caExistingSecretKey: ca.crt

# -- Extra raw env vars (list of {name,value} or {name,valueFrom}). Escape hatch
# for anything not surfaced above (array-valued keys via comma-separated values,
# one-off FERROEHR_* overrides).
extraEnv: []
# -- Extra envFrom sources (configMapRef/secretRef).
extraEnvFrom: []

# ─────────────────────────────────────────────────────────────────────────────
# Networking.
# ─────────────────────────────────────────────────────────────────────────────
service:
  # -- Service type. ClusterIP + an Ingress/gateway in front is the norm.
  type: ClusterIP
  # -- Public API port.
  port: 8080
  # -- Extra annotations.
  annotations: {}
  # -- Topology preference for how the Service picks an endpoint (KEP-4444,
  # stable v1.33). Empty leaves the API default: spread across every ready
  # endpoint cluster-wide. `PreferSameZone` (`PreferClose` is its older
  # spelling) keeps traffic inside the client's zone while endpoints there are
  # ready, which cuts cross-zone latency and inter-zone egress billing;
  # `PreferSameNode` is stricter still. Both trade EVENNESS for locality — a
  # zone with one replica and most of the callers will take most of the load —
  # so it is off unless you have measured that you want it
  # (https://kubernetes.io/docs/reference/networking/virtual-ips/#traffic-distribution).
  trafficDistribution: ""
  # The trust the chart's own clients of this Service place in the server's own
  # TLS listener. Read only while `config.server.tls` is set: the
  # viewer, FerroBRIDGE and the ServiceMonitor scrape then call
  # `https://<release fullname>:<service.port>`, so the server's certificate
  # (config.server.tls.certificate_file) carries that Service name as a DNS SAN and is
  # checked against the CA named here. The render is refused when one of those
  # clients is enabled and the Secret is not named. The ServiceMonitor reads
  # the Secret from its own namespace (metrics.serviceMonitor.namespace).
  tls:
    # -- Name of an EXISTING Secret holding the CA that signed the server's
    # certificate, in PEM. Give it a Secret that holds the CA certificate ALONE:
    # every pod and the ServiceMonitor that reads it then reads no private key,
    # and a ServiceMonitor in another namespace needs its own copy there. A
    # cert-manager Certificate's Secret also carries `ca.crt`, but beside the
    # server's private key; copy the CA out of it (trust-manager's Bundle, or
    # by hand) rather than naming it here.
    caExistingSecret: ""
    # -- The key in `caExistingSecret` holding the CA.
    caExistingSecretKey: ca.crt

ingress:
  # -- Create an Ingress. TLS termination belongs here (or at a gateway).
  enabled: false
  # -- IngressClass name. Empty leaves the cluster default to apply.
  className: ""
  # -- Ingress annotations (TLS issuer, body size, timeouts — controller-specific).
  annotations: {}
  # -- Annotations added to the Ingress only while config.server.tls is set:
  # how your controller is told the backend speaks HTTPS, which is
  # controller-specific (ingress-nginx:
  # `nginx.ingress.kubernetes.io/backend-protocol: HTTPS`). The render is
  # refused while server TLS and the Ingress are both on and this is empty,
  # because the controller would otherwise send plain HTTP to a TLS listener.
  backendTlsAnnotations: {}
  hosts:
    - host: ferroehr.example.com
      paths:
        - path: /ferroehr
          pathType: Prefix
  # -- TLS blocks, passed through verbatim.
  tls: []

networkPolicy:
  # -- Install a NetworkPolicy that admits inbound traffic to the API (and
  # management) port and nothing else. Strongly recommended for a PHI workload —
  # but it narrows PORTS unconditionally and SOURCES only when `ingressFrom` is
  # set, so "networkPolicy.enabled=true" alone is not a source restriction.
  enabled: true
  # -- Ingress `from` selectors admitted to the API port. Empty means the rule
  # carries no `from` at all, and a NetworkPolicy ingress rule without `from`
  # admits EVERY source — other namespaces and off-cluster clients included, not
  # just this namespace
  # (https://kubernetes.io/docs/concepts/services-networking/network-policies/).
  # Only the port list is narrowed in that state, so SET this to your
  # ingress-controller namespace/pods for a PHI workload.
  ingressFrom: []
  # -- Admit every source while `ingressFrom` is empty — which is the posture
  # this chart SHIPS, stated as a value rather than left implicit in an empty
  # list. Set it to `false` to make "no open ingress" a machine-checked fact:
  # with `ingressFrom` still empty the render is then REFUSED instead of quietly
  # producing a policy that admits everything while reading as default-deny.
  # It only decides the empty case — a non-empty `ingressFrom` always narrows.
  ingressAllowAll: true
  # ── Egress ────────────────────────────────────────────────────────────────
  # Default-deny egress: everything outbound is refused except what is listed
  # here. Off by default, and that is a deliberate choice rather than laziness —
  # every destination below the database is OPTIONAL and switched on by a
  # configuration key, and most are off-cluster, where a NetworkPolicy can only
  # name an `ipBlock` CIDR because **the API has no way to match a DNS name**
  # (https://kubernetes.io/docs/concepts/services-networking/network-policies/
  # — "you cannot … target Services or Pods by name"). So the destination set is
  # deployment-specific by construction, and shipping it on with a guessed set
  # would break features in a way that looks like the feature being broken.
  #
  # The full config-key-to-destination table, with the port each needs and the
  # order to add them in, is in the book: installation/hardening-network-policy.md
  # §Egress. Read it before enabling this.
  #
  # DNS is always allowed when this is on — without it nothing resolves and
  # every destination below fails regardless of its own rule.
  egress:
    # -- Refuse all outbound traffic except DNS, `database` and `rules`.
    enabled: false
    # -- The database, which is NOT optional: the server cannot pass readiness
    # without it. Rendering an egress policy with no database destination is a
    # refusal, not a warning (see the template) — an egress policy that forgets
    # the DSN is a total outage that looks like a database failure.
    # `to` takes raw NetworkPolicyPeer entries: a `podSelector`/
    # `namespaceSelector` for an in-cluster database, or an `ipBlock` for a
    # managed one. `port` is the DSN's port.
    database:
      to: []
      port: 5432
    # -- Every other destination, as raw NetworkPolicyEgressRule entries — one
    # per integration you have switched on. See the book's table.
    rules: []

# ─────────────────────────────────────────────────────────────────────────────
# Pod / container security: the Kubernetes Pod Security Standards "Restricted"
# profile — non-root, no privilege escalation, seccomp RuntimeDefault, all
# capabilities dropped
# (https://kubernetes.io/docs/concepts/security/pod-security-standards/) —
# plus a read-only root filesystem.
# ─────────────────────────────────────────────────────────────────────────────
# The fields below satisfy the Kubernetes "restricted" Pod Security Standard,
# but satisfying it and ENFORCING it are different things: enforcement comes
# from a namespace label the chart cannot set for you —
#   pod-security.kubernetes.io/enforce=restricted
# Without it these values are a convention nothing checks. See the NOTES printed
# on install (https://kubernetes.io/docs/concepts/security/pod-security-admission/).
# -- Run the pods in their own USER NAMESPACE, so container UIDs map to
# unprivileged host UIDs and a container escape lands as nobody rather than as
# the UID it ran under (KEP-127, stable v1.36 — the reason this chart's
# kubeVersion floor is 1.36). `false` here is the Kubernetes field spelling and
# means user namespaces are ON; set it to `true` to share the host's user
# namespace, which is the API default.
#
# Set it to `true` if your nodes cannot support it. The requirement is a
# node-level one the chart cannot check: a Linux node whose container runtime
# implements it (containerd >= 2.0 or CRI-O >= 1.25) with idmap-mount support
# in the kernel. On a node without it the pod does not start — a loud failure,
# not a silent downgrade
# (https://kubernetes.io/docs/tasks/configure-pod-container/user-namespaces/).
# The FerroPIX dependency reads its own `ferropix.hostUsers` (false by
# default), so set that to `true` as well.
hostUsers: false

podSecurityContext:
  # -- Refuse to start as root (pod level). Required by the restricted profile.
  runAsNonRoot: true
  # 65532 = the distroless `nonroot` uid/gid.
  # -- UID to run as (pod level). 65532 is the distroless nonroot user.
  runAsUser: 65532
  # -- GID to run as.
  runAsGroup: 65532
  # -- Supplemental group owning mounted volumes, so a non-root process can read them.
  fsGroup: 65532
  # -- Only chown volumes whose ownership differs, avoiding a full relabel on every mount.
  fsGroupChangePolicy: OnRootMismatch
  # -- Whether the groups in the IMAGE's /etc/group are merged into the
  # process's supplemental groups. `Strict` uses only the groups this manifest
  # names, so a group baked into an image cannot silently widen file access
  # (KEP-3619, stable v1.35;
  # https://kubernetes.io/docs/tasks/configure-pod-container/security-context/).
  supplementalGroupsPolicy: Strict
  seccompProfile:
    # -- Seccomp profile. RuntimeDefault is required by the restricted profile.
    type: RuntimeDefault

securityContext:
  # -- Refuse to start as root (container level). Required by the restricted profile.
  runAsNonRoot: true
  # -- UID to run as (container level). 65532 is the distroless nonroot user.
  runAsUser: 65532
  # -- Block setuid/file-capability escalation. Required by the restricted profile.
  allowPrivilegeEscalation: false
  # -- Never true. A privileged container is effectively root on the node.
  privileged: false
  # -- Immutable root filesystem; writable paths are explicit emptyDir mounts.
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    # -- Seccomp profile at container level. RuntimeDefault is required by the restricted profile.
    type: RuntimeDefault
  # AppArmor (KEP-24, stable v1.31) is a further confinement layer, and it is
  # deliberately NOT set here, because it is not a free win: a node without
  # AppArmor REJECTS the pod outright rather than ignoring the field. Verified
  # on a v1.36.1 node — the pod went to status `AppArmor` with
  # "Cannot enforce AppArmor: AppArmor is not enabled on the host" and never
  # started. Enable it once you know your nodes carry it (most Debian/Ubuntu
  # nodes do; Docker Desktop and several minimal distributions do not):
  #
  #   appArmorProfile:
  #     type: RuntimeDefault
  #
  # https://kubernetes.io/docs/tutorials/security/apparmor/

# -- Resource requests/limits. Sized for a modest API replica; tune for load.
# ephemeral-storage is bounded too: the container writes only logs/tmp (the
# root filesystem is read-only), and an unbounded default would let runaway
# local writes evict the pod's node neighbours
# (https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/#setting-requests-and-limits-for-local-ephemeral-storage).
resources:
  requests:
    cpu: 250m
    memory: 256Mi
    ephemeral-storage: 128Mi
  limits:
    cpu: "2"
    memory: 1Gi
    ephemeral-storage: 1Gi

# ─────────────────────────────────────────────────────────────────────────────
# Probes — three roles, and the split is load-bearing
# (https://kubernetes.io/docs/concepts/workloads/pods/probes/).
#
#   liveness  → /health/liveness, a CONSTANT the server answers by existing. It
#               must never consult a dependency: "Incorrect implementation of
#               liveness probes can lead to cascading failures", and a database
#               blip that restarts every pod is exactly that.
#   readiness → /health/readiness, which DOES consult dependencies (DB ping,
#               migrations applied) and answers 503 when they are down. That is
#               its job: "the readiness probe additionally checks that each
#               required back-end service is available".
#   startup   → the same constant as liveness, with a long failureThreshold, so
#               a cold start (migrations, template cache) is never killed
#               mid-boot by the liveness probe.
#
# A `probes.exec` option once ran `ferroehr healthcheck` for all three. It was
# removed: it passed no --url, so it probed the openEHR status document rather
# than a health endpoint, and READINESS therefore never touched the database —
# a pod with a dead database reported Ready and took clinical traffic.
# ─────────────────────────────────────────────────────────────────────────────
probes:
  liveness:
    # -- Liveness probe: delay before the first check.
    initialDelaySeconds: 10
    # -- Liveness probe: seconds between checks.
    periodSeconds: 15
    # -- Liveness probe: per-check timeout.
    timeoutSeconds: 3
    # -- Liveness probe: consecutive failures before the pod is acted on.
    failureThreshold: 3
  readiness:
    # -- Readiness probe: delay before the first check.
    initialDelaySeconds: 5
    # -- Readiness probe: seconds between checks.
    periodSeconds: 10
    # -- Readiness probe: per-check timeout.
    timeoutSeconds: 3
    # -- Readiness probe: consecutive failures before the pod is acted on.
    failureThreshold: 3
  startup:
    # -- Startup probe. Gives a slow first boot (migrations) room before liveness applies.
    enabled: true
    # -- Startup probe: delay before the first check.
    initialDelaySeconds: 5
    # -- Startup probe: seconds between checks.
    periodSeconds: 5
    # -- Startup probe: per-check timeout.
    timeoutSeconds: 3
    # -- Startup probe: consecutive failures before the pod is acted on.
    failureThreshold: 30

# ─────────────────────────────────────────────────────────────────────────────
# Autoscaling.
# ─────────────────────────────────────────────────────────────────────────────
autoscaling:
  # -- Horizontal pod autoscaling. When on, the chart omits replicas and the HPA owns the count.
  enabled: false
  # -- Lower bound the HPA may scale to.
  minReplicas: 2
  # -- Upper bound the HPA may scale to.
  maxReplicas: 6
  # -- Target average CPU. 0 removes the metric; removing BOTH metrics is refused, since an HPA with none never scales.
  targetCPUUtilizationPercentage: 75
  # -- Target average memory. 0 removes the metric. A CDR is usually CPU-bound, so this is off by default.
  targetMemoryUtilizationPercentage: 0
  # -- Scaling behaviour, passed through verbatim to `spec.behavior`. Empty
  # leaves the documented defaults, which are already asymmetric in the right
  # direction for a clinical API: scale-up is immediate, scale-down waits out a
  # 300-second stabilization window so a traffic trough cannot tear down
  # capacity that is about to be needed. Set this only to make it MORE
  # conservative — e.g. a `scaleDown.policies` entry capping how many pods may
  # go per minute
  # (https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/#configurable-scaling-behavior).
  behavior: {}

# ─────────────────────────────────────────────────────────────────────────────
# PodDisruptionBudget.
# ─────────────────────────────────────────────────────────────────────────────
podDisruptionBudget:
  # -- Protect availability during voluntary disruption (drains, upgrades).
  enabled: true
  # -- Pods that must stay available. Used only when maxUnavailable is unset.
  minAvailable: 1
  # maxUnavailable: ""   # set one of minAvailable / maxUnavailable
  # -- Whether a node drain may evict pods that are already unhealthy.
  # `AlwaysAllow` is the documented recommendation; the alternative,
  # `IfHealthyBudget`, is the API default and makes a drain wait for pods to
  # become healthy first — which never completes when they are unhealthy
  # because of the drain itself.
  unhealthyPodEvictionPolicy: AlwaysAllow

# -- Extra pod labels / annotations.
podLabels: {}
# -- Extra annotations on the pod template. Note a change here rolls the Deployment.
podAnnotations: {}

# -- Scheduling.
nodeSelector: {}
# -- Tolerations for tainted nodes. Empty = none.
tolerations: []
# -- Pod affinity/anti-affinity rules. Empty = none.
affinity: {}
# -- Spread replicas across nodes. Empty does NOT mean "no spreading": it means
# the chart's own default constraint applies — one soft `maxSkew: 1` over
# `kubernetes.io/hostname`, so two replicas prefer two nodes and a node failure
# does not take the whole CDR with it. It is `ScheduleAnyway`, not
# `DoNotSchedule`, so a single-node or capacity-constrained cluster still
# schedules rather than leaving a pod Pending forever.
#
# A non-empty list REPLACES that default entirely — give the full constraint,
# including its own `labelSelector`. Add a `topology.kubernetes.io/zone`
# constraint here if your cluster spans zones; the chart does not assume one
# (https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/).
topologySpreadConstraints: []

# -- Termination grace period (audit/outbox drain has a 5s window in-binary).
terminationGracePeriodSeconds: 30

# -- Lame-duck pause before SIGTERM, in seconds (0 disables). Endpoint removal
# and SIGTERM happen concurrently on pod deletion, so without a pause a
# terminating pod can still be sent requests. Uses the native `preStop.sleep`
# action (this image has no shell, so an exec hook cannot run).
# Must stay comfortably under terminationGracePeriodSeconds: the sleep runs
# INSIDE that budget and the server still needs its own drain window after it.
preStopSleepSeconds: 5

# -- Extra volumes / volumeMounts (e.g. an external secret store for the PGP key).
extraVolumes: []
# -- Mounts for extraVolumes, in the server container.
extraVolumeMounts: []

# ── Viewer (optional companion workload) ──────────────────────────────
# The Leptos viewer. OFF by default: it is a separate product surface
# with its own OCI image and its own attack surface, and a CDR is complete
# without it. Enabling it renders a second Deployment/Service (and optionally an
# Ingress) alongside the server.
#
# It reaches the CDR STRICTLY over ITS-REST — that is the viewer's binding
# mandate, not an implementation detail — so its egress is narrow and the
# NetworkPolicy below enforces it rather than trusting it.
viewer:
  # -- Deploy the viewer alongside the CDR.
  enabled: false
  # -- Replica count. The viewer holds session state in process, so more than
  # one replica needs sticky sessions at the ingress or users get logged out on
  # a reroute; left at 1 deliberately.
  replicaCount: 1
  image:
    # -- Viewer image repository.
    repository: ghcr.io/ferrohealth/ferroehr-viewer
    # -- Pull policy.
    pullPolicy: IfNotPresent
    # -- Image tag. Empty falls back to .Chart.appVersion, so the viewer and
    # the server move together by default.
    tag: ""
    # -- Image digest (`sha256:…`); wins over `tag` when set, exactly as the
    # server's `image.digest` does.
    digest: ""
  service:
    # -- Service type for the viewer.
    type: ClusterIP
    # -- Service port. The container always listens on 3000.
    port: 3000
  ingress:
    # -- Publish the viewer through an Ingress. The viewer is a human-facing
    # web UI, so unlike the API this is the normal way to reach it.
    enabled: false
    # -- IngressClass name.
    className: ""
    # -- Extra annotations for the viewer Ingress.
    annotations: {}
    # -- Hosts and paths.
    hosts: []
    # -- TLS blocks.
    tls: []
  auth:
    oidc:
      # -- Authenticate viewer users through OIDC. Off means the viewer's own
      # session auth is whatever its defaults provide — acceptable for a private
      # cluster, not for anything reachable by a person who should not see PHI.
      enabled: false
      # -- Issuer URL (must be https for anything but local development).
      issuer: ""
      # -- OAuth2 client id.
      clientId: ""
      # -- The viewer's own externally-reachable base URL, used to build the
      # OIDC redirect. Must match what the identity provider has registered.
      publicBaseUrl: ""
      # -- Name of an existing Secret holding a PEM bundle of the certificate
      # authorities the viewer trusts for the issuer, beside the image's own
      # roots: for an issuer behind a private PKI. The chart mounts the key as
      # a file and points `[oidc.tls] trust_roots_file` at it. Empty
      # trusts the image's roots alone.
      caExistingSecret: ""
      # -- Key within `caExistingSecret` carrying the PEM bundle.
      caExistingSecretKey: ca.crt
  # -- Name of an existing Secret holding the viewer's OIDC client secret. The
  # chart mounts that key as a FILE and passes only its path, so the credential
  # never enters the pod's environment — the same discipline the server's DSN
  # uses.
  existingSecret: ""
  # -- Key within `existingSecret` carrying the client secret.
  existingSecretKey: FERROEHR_VIEWER__AUTH__OIDC__CLIENT_SECRET
  networkPolicy:
    # -- Install a NetworkPolicy for the viewer. Egress admits the CDR Service
    # and DNS, and nothing else — the viewer is a REST client of the CDR by
    # mandate, so that half is enforceable rather than aspirational. Ingress
    # narrows the viewer's PORT unconditionally and its SOURCES only when
    # `ingressFrom` is set.
    enabled: true
    # -- Ingress `from` selectors admitted to the viewer port. Empty means the
    # rule carries no `from`, which admits EVERY source — other namespaces and
    # off-cluster clients included
    # (https://kubernetes.io/docs/concepts/services-networking/network-policies/).
    # This is the human-facing login surface, so SET this to your
    # ingress-controller namespace/pods.
    ingressFrom: []
    # -- Admit every source while `ingressFrom` is empty — the posture this chart
    # SHIPS for the viewer, stated as a value rather than left implicit in an
    # empty list. Set it to `false` to have the render REFUSED while `ingressFrom`
    # is empty, instead of quietly exposing the viewer to everything. It only
    # decides the empty case — a non-empty `ingressFrom` always narrows.
    ingressAllowAll: true
  # -- Pod-level security context. Mirrors the server's; a second workload is
  # where a hardened posture is most easily lost. The user-namespace setting is
  # NOT mirrored here — it is the release-wide `hostUsers` key, because a
  # posture that differs between two workloads of one release is a posture
  # nobody can state.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroupsPolicy: Strict
    seccompProfile:
      type: RuntimeDefault
  # -- Container-level security context. Mirrors the server's.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  # -- Termination grace period for the viewer. Shorter than the server's: it
  # holds no write in flight and nothing to drain but in-flight page renders.
  terminationGracePeriodSeconds: 20
  # -- Lame-duck pause before SIGTERM, in seconds (0 disables) — the same
  # endpoint-propagation race the server's `preStopSleepSeconds` covers.
  preStopSleepSeconds: 5
  # -- Resource requests/limits.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # -- Node selector.
  nodeSelector: {}
  # -- Tolerations.
  tolerations: []
  # -- Affinity.
  affinity: {}
  telemetry:
    # -- The viewer's console rendering (`[telemetry] format`): `json` for a
    # cluster log collector, as the server's `config.telemetry.format`.
    format: json
    # -- The viewer's console filter (`[telemetry] filter`). Empty keeps the
    # viewer's default, `info,hyper=warn,tower=warn,h2=warn`.
    filter: ""
  # -- Extra environment for the viewer (escape hatch).
  extraEnv: []

# ─────────────────────────────────────────────────────────────────────────────
# FerroTERM — the FHIR terminology server, beside the CDR (#3305).
#
# The Helm equivalent of docker-compose.terminology.yml: one Deployment, one
# ClusterIP Service, the licence-free shaped seed as a ConfigMap, and the CDR's
# [terminology.server] wired at the Service. Off by default — a CDR resolves
# bindings against its built-in terminology without it.
#
# NO INGRESS is rendered, and no value renders one. The CDR is the only caller,
# which is what the SNOMED CT Affiliate Licence asks of a public deployment:
# clause 2.2.4 permits a public system to serve SNOMED-encoded data provided
# users cannot extract a substantial portion of the release, and clause 2.7
# requires measures so the release cannot be downloaded except by authorised
# users. A published FHIR terminology endpoint answers $expand and $lookup to
# anyone who reaches it, and FerroTERM has neither authentication nor a rate
# limit of its own.
#
# No licensed terminology is distributed with FerroEHR or FerroTERM. The seed is
# synthetic content under the reserved example.test domain; a real release is
# built into an index OFF-CLUSTER and mounted through `index` below.
# ─────────────────────────────────────────────────────────────────────────────
terminology:
  # -- Deploy FerroTERM alongside the CDR.
  enabled: false
  # -- Point the CDR's `config.terminology` at the rendered Service.
  # The chart injects `endpoint.url` and `on_error`, so the Service address and
  # the workload answering it are one decision. Set it to false to run
  # FerroTERM beside a CDR you wire yourself. While it is true the render
  # refuses every values file that contradicts the injection: a
  # `config.terminology.endpoint.url` of your own, and an `on_error`
  # disagreeing with `failOnError` below.
  wireCdr: true
  # -- What the CDR does when the terminology server cannot answer. `false` (the
  # server's own shipped default) accepts the binding; `true` turns an
  # unreachable server into a 422 refusal. No released openEHR text decides
  # between the two.
  failOnError: false
  # -- Replica count. FerroTERM serves a read-only index, so replicas are a
  # throughput choice; each one loads its own copy, so mind the memory limit.
  # Above 1, turn `podDisruptionBudget` below on: the pods spread across nodes
  # by default, and nothing else keeps a drain from taking all of them.
  replicaCount: 1
  # -- Topology spread for FerroTERM's pods. Empty uses the chart's default —
  # one replica per node, `ScheduleAnyway`, scoped to the ReplicaSet being
  # rolled — which is the CDR's policy over this workload's own pods. Set it to
  # replace that wholesale; a merge of two spreading policies is not one.
  topologySpreadConstraints: []
  # -- Deployment update strategy. Empty leaves the API default
  # (`RollingUpdate`), EXCEPT when `index.persistentVolumeClaim` names a claim:
  # a rolling update surges a second pod before the first goes away, and a
  # ReadWriteOnce volume cannot attach to it on another node, so the chart
  # renders `type: Recreate` there. Set `{type: RollingUpdate}` if your index
  # volume is ReadOnlyMany.
  strategy: {}
  image:
    # -- FerroTERM image repository. A separate product on its own release line
    # (https://github.com/FerroHEALTH/FerroTERM), BUSL-1.1 from the same
    # Licensor as FerroEHR.
    repository: ghcr.io/ferrohealth/ferroterm
    # -- Pull policy.
    pullPolicy: IfNotPresent
    # -- Image tag. Empty falls back to the FerroTERM release this chart is
    # pinned to (0.4.5) — never `.Chart.appVersion`, which is FerroEHR's line.
    # A tag other than that pin is REFUSED while `digest` below is non-empty:
    # the digest wins, so the tag would be inert while the values file claimed
    # otherwise. Clear `digest` to deploy a tag.
    tag: ""
    # -- Image digest (`sha256:…`); wins over `tag`. Pinned by default, so an
    # install runs the exact image this chart was validated against.
    digest: sha256:7c20d39e1989fce1dfb92e6ddfd853dfa9a52bb9b7b973fbba42430963ef75bd
  service:
    # -- Service type. ClusterIP deliberately: the CDR is the only caller.
    type: ClusterIP
    # -- Service port. The container always listens on 8080.
    port: 8080
  codeSystems:
    # -- Serve code systems from an existing ConfigMap of FHIR JSON instead of
    # the chart's shaped seed. Empty means the chart renders its own. The pod's
    # rollout annotation hashes the NAME you give here, not the ConfigMap's
    # contents — the chart cannot read an object it does not own — so editing
    # that ConfigMap propagates into the volume while every running pod keeps
    # serving what it read at boot. Restart the workload yourself after such an
    # edit (`kubectl rollout restart deployment/<release>-terminology`).
    existingConfigMap: ""
    # -- Directory the code systems are mounted at, read-only; it is what
    # `FERROTERM__TERMINOLOGY__CODE_SYSTEMS` names.
    mountPath: /etc/ferroterm/codesystems
  index:
    # -- Name of an EXISTING PersistentVolumeClaim holding a built index for a
    # release you hold a licence for. Empty means the shaped seed is served
    # alone. The chart provisions no storage and renders no build Job: build the
    # index off-cluster with `ferroterm-build --rf2 <release.zip> --out <dir>`
    # and fill the claim from that output.
    persistentVolumeClaim: ""
    # -- Directory the index claim is mounted at, read-only. Rendered as
    # `FERROTERM__TERMINOLOGY__INDEX` only when a claim is named.
    mountPath: /data/index
  # -- Display language FerroTERM prefers when a concept carries several.
  defaultLanguage: en
  # -- Log format (`json` or `pretty`), passed as `FERROTERM__TELEMETRY__FORMAT`.
  logFormat: json
  # -- `RUST_LOG` filter for the terminology container.
  logLevel: info
  networkPolicy:
    # -- Install a NetworkPolicy for FerroTERM. Unlike the CDR's and the
    # viewer's, its ingress is narrowed by DEFAULT and there is no
    # admit-everything state: the caller is known — the CDR's pods — so no value
    # offers one. Egress admits DNS only.
    enabled: true
    # -- Further peers admitted to the terminology port, beside the CDR's pods.
    # Raw NetworkPolicyPeer entries, for a caller you deliberately add (a
    # FerroCKM instance, a migration job); read the licence note above first.
    # No boolean opens this port the way `networkPolicy.ingressAllowAll` opens
    # the CDR's — but a peer you add is admitted exactly as written, and an
    # empty `namespaceSelector: {}` means every namespace. The values schema
    # refuses an empty peer and an empty selector inside one for that reason.
    extraIngressFrom: []
  # -- Protect FerroTERM during voluntary disruption (drains, upgrades). Off by
  # default: the shipped `replicaCount` is 1, and a budget over a single pod
  # blocks the drain it exists to survive. Turn it on with more than one
  # replica. Same shape and same defaults as the CDR's `podDisruptionBudget`.
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    # maxUnavailable: ""   # set one of minAvailable / maxUnavailable
    unhealthyPodEvictionPolicy: AlwaysAllow
  # -- Pod-level security context. Mirrors the server's; a second workload is
  # where a hardened posture is most easily lost. The user-namespace setting is
  # NOT mirrored here — it is the release-wide `hostUsers` key.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroupsPolicy: Strict
    seccompProfile:
      type: RuntimeDefault
  # -- Container-level security context. Mirrors the server's.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  # -- Termination grace period. FerroTERM holds no write in flight; there is
  # nothing to drain but in-flight lookups.
  terminationGracePeriodSeconds: 20
  # -- Lame-duck pause before SIGTERM, in seconds (0 disables) — the same
  # endpoint-propagation race the server's `preStopSleepSeconds` covers.
  preStopSleepSeconds: 5
  # -- Resource requests/limits. The 1536Mi limit is the compose overlay's, and
  # it is sized from FerroTERM's own figures: the SNOMED CT Netherlands edition
  # is 889 MB resident, the International edition 702 MB, LOINC 170 MB; the
  # shaped seed is a few megabytes. An index larger than the limit is an OOMKill
  # during startup, so raise it before mounting a bigger edition.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1536Mi
  # -- Node selector.
  nodeSelector: {}
  # -- Tolerations.
  tolerations: []
  # -- Affinity.
  affinity: {}
  # -- Extra environment for FerroTERM (escape hatch).
  extraEnv: []
  usageReport:
    # -- FerroTERM's usage report. Empty follows the top-level
    # `usageReport.enabled`; true or false decides for FerroTERM alone. The
    # chart passes it as `FERROTERM__USAGE_REPORT__ENABLED`, with the
    # deployment `helm`. The chart mounts no state directory for it, and
    # without one the pinned 0.3.3 keeps its report off.
    enabled: null

# ─────────────────────────────────────────────────────────────────────────────
# FerroBRIDGE: the FHIR and openEHR bridge, beside the CDR.
#
# One Deployment, one ClusterIP Service and a NetworkPolicy, with FerroBRIDGE's
# config.toml rendered as a ConfigMap: [cdr] points at this release's CDR
# Service, [cdr.credentials.oauth] reads a file mounted from bridge.cdr.existingSecret,
# and [terminology] points at this release's FerroTERM when terminology.enabled
# is set. Off by default.
#
# CLUSTER-INTERNAL. FerroBRIDGE checks the caller of its FHIRconnect
# operations, FHIR facade and operator API through `[auth]` (`config.auth`
# below), and a caller it admits writes into and reads from the CDR under the
# credential below. So no Ingress
# is rendered and no value renders one, the Service is ClusterIP, and the
# NetworkPolicy admits only the peers named in networkPolicy.ingressFrom: an
# empty list is refused at render, and the schema refuses a peer that selects
# everything.
# ─────────────────────────────────────────────────────────────────────────────
bridge:
  # -- Deploy FerroBRIDGE alongside the CDR. Needs `bridge.cdr.oauth`, a client
  # of a `machines` issuer in `config.auth.issuer`, `bridge.cdr.existingSecret`
  # with its client secret, and at least one `bridge.networkPolicy.ingressFrom`
  # peer; the render is refused without any of them.
  enabled: false
  # -- Replica count. FerroBRIDGE keeps no state of its own while its FHIR
  # facade is off, so replicas are a throughput choice. Above 1, turn
  # `podDisruptionBudget` below on.
  replicaCount: 1
  # -- Topology spread for FerroBRIDGE's pods. Empty uses the chart's default:
  # one replica per node, `ScheduleAnyway`, scoped to the ReplicaSet being
  # rolled. Set it to replace that wholesale.
  topologySpreadConstraints: []
  # -- Deployment update strategy. Empty leaves the API default
  # (`RollingUpdate`). Set `{type: Recreate}` when `extraVolumes` mounts a
  # ReadWriteOnce claim (the FHIR facade's identity store): a rolling update
  # surges a second pod that cannot attach it on another node.
  strategy: {}
  image:
    # -- FerroBRIDGE image repository. A separate product on its own release
    # line (https://github.com/FerroHEALTH/FerroBRIDGE), BUSL-1.1 from the same
    # Licensor as FerroEHR.
    repository: ghcr.io/ferrohealth/ferrobridge
    # -- Pull policy.
    pullPolicy: IfNotPresent
    # -- Image tag. Empty falls back to the FerroBRIDGE release this chart is
    # pinned to (0.0.21), never `.Chart.appVersion`, which is FerroEHR's line.
    # A tag other than that pin is REFUSED while `digest` below is non-empty:
    # the digest wins, so the tag would be inert. Clear `digest` to deploy a tag.
    tag: ""
    # -- Image digest (`sha256:…`); wins over `tag`. Pinned by default, so an
    # install runs the exact image this chart was validated against.
    digest: sha256:83bd9d2cb5e4ef6b19617c9434242f88489b0fd4150b2238a22acf17435c9a35
  service:
    # -- Service port. The Service is always ClusterIP and the container always
    # listens on 8080.
    port: 8080
  cdr:
    # -- Name of an EXISTING Secret holding the client secret of FerroBRIDGE's
    # OAuth client for this release's CDR, under the key `client_secret`.
    # Required. The secret is mounted as a FILE and named by
    # `client_secret_file` in config.toml, so it never enters the ConfigMap or
    # the pod's environment.
    existingSecret: ""
    # FerroBRIDGE reaches the CDR as a machine, under a client credentials
    # token (RFC 6749 §4.4) it obtains and renews itself
    # ([cdr.credentials.oauth]). From ferrohealth-smart 0.9 a Basic credential
    # is a person's and holds no `system/` scope, so there is no Basic mode.
    oauth:
      # -- The issuer identifier of the authorization server, an https URL
      # (RFC 8414 §2); FerroBRIDGE reads its token endpoint from the
      # issuer's metadata. Required, and it must be a `config.auth.issuer`
      # entry with `kind: machines`, or the render is refused: the CDR trusts
      # no token of an issuer it does not list.
      issuer: ""
      # -- The token endpoint (RFC 6749 §3.2), for an authorization server
      # whose metadata FerroBRIDGE cannot read at `issuer`. Set, FerroBRIDGE
      # requests its token here and reads no metadata; `issuer` still names
      # the issuer the CDR trusts.
      tokenEndpoint: ""
      # -- FerroBRIDGE's client identifier at that issuer (RFC 6749 §2.2).
      # Required.
      clientId: ""
      # -- The `scope` FerroBRIDGE asks for (RFC 6749 §3.3), the SMART
      # `system/` scopes the CDR grants it. Empty sends none.
      scope: ""
      # -- An `audience` parameter, for an authorization server that selects
      # the CDR's audience by it. Empty sends none.
      audience: ""
      # -- A `resource` parameter (RFC 8707 §2), for an authorization server
      # that selects the CDR by it. Empty sends none.
      resource: ""
  mappings:
    # -- Name of an EXISTING ConfigMap holding the FHIRconnect mapping files
    # FerroBRIDGE serves `$tofhir` and `$toopenehr` with. Empty means no mapping
    # set: FerroBRIDGE starts, and those two operations answer 503. The
    # templates each context names are fetched from this release's CDR at
    # boot, so a template the CDR does not hold stops the start.
    existingConfigMap: ""
    # -- The keys of `existingConfigMap` to mount, one file each. Required with
    # `existingConfigMap`. Each key is mounted on its own (`subPath`), because a
    # whole ConfigMap volume carries the kubelet's `..data` snapshot
    # directories, which FerroBRIDGE's recursive walk reads as a second
    # and third copy of every file and refuses as duplicate mapping names. A
    # `subPath` mount does not follow later edits to the ConfigMap; the pod's
    # rollout annotation hashes this list, not the ConfigMap's contents, so
    # restart the workload after editing it.
    files: []
  # -- Further FerroBRIDGE configuration, rendered into its config.toml beside
  # the keys the chart writes (FerroBRIDGE's configuration reference:
  # https://ferrobridge.eu/docs/operate/configuration.html). FerroBRIDGE
  # refuses an unknown key at boot, so a typo here is a crash loop, not a
  # silent default. Refused at render: `cdr.base_url`, `cdr.credentials`,
  # `server.listen`, `terminology` while `terminology.enabled` is on,
  # `mappings.directory` while `mappings.existingConfigMap` is set, and any
  # secret-shaped key (a password, a token, `cdm.url`), whose `_file` sibling
  # takes a file you mount with `extraVolumes`. A mapping set turns the
  # FHIRconnect operations on, and FerroBRIDGE then refuses to start until
  # `auth.issuer` and `auth.audience` name the issuer of its callers' tokens,
  # or `auth.enabled` is false.
  config: {}
  networkPolicy:
    # -- The peers admitted to FerroBRIDGE's port. REQUIRED: the render is
    # refused while it is empty, because an ingress rule with no `from` admits
    # every source, and with `config.auth.enabled` false FerroBRIDGE admits every caller. Raw
    # NetworkPolicyPeer entries; the schema refuses an empty peer and an empty
    # selector inside one, which would select every pod or every namespace.
    # There is deliberately no admit-everything key.
    ingressFrom: []
    # -- Egress rules beyond the ones the chart writes (this release's CDR, its
    # FerroTERM when that runs, and DNS). Raw NetworkPolicyEgressRule entries,
    # for an upstream you name in `config`, such as an external terminology
    # server.
    extraEgress: []
  # -- Protect FerroBRIDGE during voluntary disruption. Off by default: the
  # shipped `replicaCount` is 1, and a budget over a single pod blocks the drain
  # it exists to survive.
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    # maxUnavailable: ""   # set one of minAvailable / maxUnavailable
    unhealthyPodEvictionPolicy: AlwaysAllow
  # -- Pod-level security context. Mirrors the server's. The user-namespace
  # setting is NOT mirrored here: it is the release-wide `hostUsers` key.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroupsPolicy: Strict
    seccompProfile:
      type: RuntimeDefault
  # -- Container-level security context. Mirrors the server's.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  # -- Termination grace period. FerroBRIDGE drains in-flight requests on
  # SIGTERM for up to its own `server.shutdown_timeout` (10 s by default).
  terminationGracePeriodSeconds: 20
  # -- Lame-duck pause before SIGTERM, in seconds (0 disables): the same
  # endpoint-propagation race the server's `preStopSleepSeconds` covers.
  preStopSleepSeconds: 5
  # -- Resource requests/limits.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # -- Node selector.
  nodeSelector: {}
  # -- Tolerations.
  tolerations: []
  # -- Affinity.
  affinity: {}
  # -- Extra environment for FerroBRIDGE (escape hatch).
  extraEnv: []
  usageReport:
    # -- FerroBRIDGE's usage report. Empty follows the top-level
    # `usageReport.enabled`; true or false decides for FerroBRIDGE alone. The
    # chart writes it into `[usage_report]` of config.toml, with the deployment
    # `helm`, for a FerroBRIDGE release from 0.0.7 on; a release before it
    # sends no report and refuses the section, so it gets none.
    enabled: null
  # -- Extra volumes for the FerroBRIDGE pod, such as a Secret holding a
  # `_file` credential named in `config`.
  extraVolumes: []
  # -- Extra volume mounts for the FerroBRIDGE container.
  extraVolumeMounts: []

# ─────────────────────────────────────────────────────────────────────────────
# FerroPIX, the IHE patient identity source FerroEHR asks over PIXm (ITI-83),
# taken as the chart dependency `ferropix` from
# oci://ghcr.io/ferrohealth/charts. Every key below is that chart's own value
# (its README lists them all); this chart adds only the injection of its
# in-cluster FHIR base into config.pixm.endpoint.url. FerroPIX needs its own
# PostgreSQL URL and sealing key Secrets, an issuer, and the
# pseudonymisation domain whose consumer is FerroEHR's client:
#   ferropix:
#     database: {existingSecret: ferropix-db}
#     dataKey: {existingSecret: ferropix-data-key}
#     config:
#       public_base_url: https://pix.example.org
#       auth:
#         issuer:
#           - {issuer: https://idp.example.org, kind: machines, audience: [https://pix.example.org/fhir]}
#       trust:
#         issuer: [{issuer: https://idp.example.org, clients: [hospital-source]}]
#       pseudonym_domain:
#         - {namespace: urn:oid:2.999.7.1, name: Clinical domain, consumer_client_id: ferroehr}
# Any conformant PIX Manager can serve instead: set `enabled: false` and
# config.pixm.endpoint.url.
# ─────────────────────────────────────────────────────────────────────────────
ferropix:
  # -- Deploy FerroPIX beside the CDR and point config.pixm at it.
  enabled: true
  image:
    # -- The FerroPIX release the pinned `digest` belongs to. The dependency
    # chart deploys the digest, and the Artifact Hub entry names this tag.
    tag: "0.0.26"
    # -- FerroPIX image digest of release `tag`. Pinned here so
    # the image this chart deploys is stated by this chart.
    digest: "sha256:85d40e6fdcdb39f782007eff91eb059861a4e039ca3f8fb56e37f2fa0f28d78a"
  config:
    server:
      # -- FerroPIX's `[server] base_path`, read here to build the FHIR base the
      # CDR is pointed at.
      base_path: ""
  service:
    # -- FerroPIX's Service port, read here to build the FHIR base the CDR is
    # pointed at.
    port: 8080
  usageReport:
    # -- FerroPIX's own usage report switch, read by the dependency chart. A
    # dependency chart cannot read this chart's `usageReport.enabled`, so with
    # that set to false, set this false too: the render refuses the pair
    # `usageReport.enabled=false` and `ferropix.usageReport.enabled=true`.
    enabled: true

