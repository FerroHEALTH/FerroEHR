apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ferroehr
  annotations:
    kubernetes.io/description: >-
      Keeps the CDR available during voluntary disruption (node drains, cluster upgrades). AlwaysAllow lets a drain evict already-unhealthy pods rather than waiting for them to recover.
  labels:
    helm.sh/chart: ferroehr-11.0.1
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "4.3.6"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
spec:
  unhealthyPodEvictionPolicy: AlwaysAllow
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ferroehr
      app.kubernetes.io/instance: ferroehr

---
# Source: ferroehr/templates/terminology.yaml
# FerroTERM's own budget, over its own pods. The CDR's PDB selects the CDR's
# label pair and nothing else, so without this a drain may evict every
# terminology replica at once while reporting the release as protected.
#
# Off by default, unlike the CDR's: one replica is the shipped count, and a
# budget over a single pod blocks the drain it is meant to survive. Turn it on
# with `terminology.replicaCount` above 1.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ferroehr-terminology
  annotations:
    kubernetes.io/description: >-
      Keeps FerroTERM available during voluntary disruption (node drains, cluster upgrades). AlwaysAllow lets a drain evict already-unhealthy pods rather than waiting for them to recover.
  labels:
    helm.sh/chart: ferroehr-11.0.1
    app.kubernetes.io/name: ferroehr-terminology
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "4.3.6"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
    app.kubernetes.io/component: terminology
spec:
  unhealthyPodEvictionPolicy: AlwaysAllow
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ferroehr-terminology
      app.kubernetes.io/instance: ferroehr
