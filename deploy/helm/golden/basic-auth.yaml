# Source: ferroehr/templates/secret.yaml
# Chart-managed Secret. In production prefer database.existingSecret (and an
# external secret store / IRSA for the rest); anything set here is rendered from
# values, so keep it out of committed values.
#
# Two key shapes live here, and the difference is deliberate. A key spelled
# `<config.path>` is MOUNTED as a read-only file and reached through the config
# tree's `*_file` sibling — the posture the OWASP Kubernetes Security Cheat Sheet
# asks for, since an environment variable is readable through /proc/<pid>/environ
# and inherited by every child process
# (https://cheatsheetseries.owasp.org/cheatsheets/Kubernetes_Security_Cheat_Sheet.html).
# A key spelled `FERROEHR__…` is injected as an environment VALUE. Only two are
# left in that form — `audit.fhir_feed.endpoint.url` and `record.multimedia.access_key_id`, the
# remaining config keys with no `*_file` sibling. The DSN moved to a file once
# the server gained `database.url_file`.
apiVersion: v1
kind: Secret
metadata:
  name: ferroehr-env
  labels:
    helm.sh/chart: ferroehr-25.1.1
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "5.7.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
type: Opaque
stringData:
  auth.basic.users.clinician.password_hash: "$argon2id$v=19$m=19456,t=2,p=1$ZmVycm9laHJEZXZTYWx0$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"
