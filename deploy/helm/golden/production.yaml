# Source: ferroehr/templates/migration-job.yaml
# Out-of-band schema migration, as a Helm pre-install/pre-upgrade hook Job.
#
# Migrations are DDL, so whoever applies them can rewrite the schema. Running
# them here — as `ferroehr_migrator`, in a pod that exits — lets the SERVER run
# as `ferroehr_clinical` with no DDL rights at all, which is what
# config.db.migrate=verify then enforces (it refuses to boot against a database
# this job has not migrated, rather than migrating it itself).
#
# As a hook, Helm creates it before the Deployment and WAITS for it: a failed
# migration fails the release instead of rolling pods against a schema that was
# never applied. Deliberately lean: the migration step needs DSNs and nothing
# else, so it mounts no ConfigMap and runs on the built-in defaults. It holds
# the migrator of the database migrations.job.existingSecret reaches, and the
# migrator of every other database a domain lives in
# (database.<domain>.migrateExistingSecret), and prepares each of them.
#
# When the chart creates the release ServiceAccount, the pod runs under one of
# its own, created as a hook one weight earlier: the release ServiceAccount is
# an ordinary resource, and Helm creates those only after the pre-install hooks
# finish, so on a first install a Job naming it waits for an account that does
# not exist yet; a resource a hook needs must itself be a hook
# (https://helm.sh/docs/topics/charts_hooks/). The pod calls no Kubernetes API,
# so the account mounts no token. Its delete policy is `before-hook-creation`
# only: Helm deletes the `hook-succeeded` hooks that ran before a hook that
# fails, which on a Helm timeout shorter than activeDeadlineSeconds would delete
# the account under a Job still running. A token-less account left behind is
# harmless, and the next release replaces it.
#
# With serviceAccount.create=false the operator names an account that exists
# before any hook runs (and may carry imagePullSecrets), so the Job uses it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ferroehr-migrate
  labels:
    helm.sh/chart: ferroehr-19.0.0
    app.kubernetes.io/name: ferroehr-migration
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "5.4.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
---
# Source: ferroehr/templates/migration-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: ferroehr-migrate
  labels:
    helm.sh/chart: ferroehr-19.0.0
    app.kubernetes.io/name: ferroehr-migration
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "5.4.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
    app.kubernetes.io/component: migration
  annotations:
    kubernetes.io/description: >-
      Applies the schema migrations as ferroehr_migrator — a DIFFERENT credential from the runtime DSN — before the server rolls. A Helm pre-install/pre-upgrade hook, so a failed migration fails the release.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 600
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
  template:
    metadata:
      labels:
        helm.sh/chart: ferroehr-19.0.0
        app.kubernetes.io/name: ferroehr-migration
        app.kubernetes.io/instance: ferroehr
        app.kubernetes.io/version: "5.4.2"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: ferroehr
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: ferroehr-migrate
      automountServiceAccountToken: false
      # Same reason as the Deployment: the kubelet's per-Service link variables
      # land inside the server's reserved FERROEHR_ namespace and the strict
      # boot-time env sweep then refuses to start.
      enableServiceLinks: false
      hostUsers: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
        supplementalGroupsPolicy: Strict
      containers:
        - name: migrate
          image: "ghcr.io/ferrohealth/ferroehr:5.4.2"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          args: ["db", "migrate"]
          env:
            # The migrator DSN, as a mounted file rather than an environment
            # value (readable through /proc/<pid>/environ and inherited by every
            # child process — OWASP Kubernetes Security Cheat Sheet).
            - name: FERROEHR__DB__URL_FILE
              value: "/etc/ferroehr-secrets/db.url"
            # The migrator of the database this domain lives in: the Job applies
            # the schema in every database the configuration places a domain in.
            - name: FERROEHR__STORAGE__MIGRATE__PARTY__URL_FILE
              value: "/etc/ferroehr-secrets/storage.migrate.party.url"
            # The migrator of the database this domain lives in: the Job applies
            # the schema in every database the configuration places a domain in.
            - name: FERROEHR__STORAGE__MIGRATE__LINKAGE__URL_FILE
              value: "/etc/ferroehr-secrets/storage.migrate.linkage.url"
            # The migrator of the database this domain lives in: the Job applies
            # the schema in every database the configuration places a domain in.
            - name: FERROEHR__STORAGE__MIGRATE__AUDIT__URL_FILE
              value: "/etc/ferroehr-secrets/storage.migrate.audit.url"
            # This pod's job IS the DDL, whatever the server's posture is.
            - name: FERROEHR__DB__MIGRATE
              value: apply
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: migrator-secret
              mountPath: /etc/ferroehr-secrets
              readOnly: true
            - name: db-ca
              mountPath: /etc/ferroehr-db-ca
              readOnly: true
          resources:
            {}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: migrator-secret
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: ferroehr-db-migrate
                  items:
                    - key: FERROEHR__DB__MIGRATE_URL
                      path: db.url
              - secret:
                  name: ferroehr-db-party-migrate
                  items:
                    - key: FERROEHR__STORAGE__MIGRATE__PARTY__URL
                      path: storage.migrate.party.url
              - secret:
                  name: ferroehr-db-linkage-migrate
                  items:
                    - key: FERROEHR__STORAGE__MIGRATE__LINKAGE__URL
                      path: storage.migrate.linkage.url
              - secret:
                  name: ferroehr-db-audit-migrate
                  items:
                    - key: FERROEHR__STORAGE__MIGRATE__AUDIT__URL
                      path: storage.migrate.audit.url
        - name: db-ca
          configMap:
            name: ferroehr-db-ca
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt

