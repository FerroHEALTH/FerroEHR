            - name: FERROEHR__DATABASE__PARTY__MIGRATE_URL_FILE
              value: "/etc/ferroehr-secrets/storage.migrate.party.url"
            # The migrator of the database this domain lives in: the Job applies
            # the schema in every database the configuration places a domain in.
            - name: FERROEHR__DATABASE__AUDIT__MIGRATE_URL_FILE
              value: "/etc/ferroehr-secrets/storage.migrate.audit.url"
            # This pod's job IS the DDL, whatever the server's posture is.
            - name: FERROEHR__DATABASE__MIGRATIONS
              value: apply
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: migrator-secret
              mountPath: /etc/ferroehr-secrets
              readOnly: true
            - name: db-ca
              mountPath: /etc/ferroehr-db-ca
              readOnly: true
          resources:
            {}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: migrator-secret
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: ferroehr-db-migrate
                  items:
                    - key: FERROEHR__DATABASE__MIGRATE_URL
                      path: db.url
              - secret:
                  name: ferroehr-db-party-migrate
                  items:
                    - key: FERROEHR__DATABASE__PARTY__MIGRATE_URL
                      path: storage.migrate.party.url
              - secret:
                  name: ferroehr-db-audit-migrate
                  items:
                    - key: FERROEHR__DATABASE__AUDIT__MIGRATE_URL
                      path: storage.migrate.audit.url
        - name: db-ca
          configMap:
            name: ferroehr-db-ca
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt

