# Source: ferroehr/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: ferroehr
  labels:
    helm.sh/chart: ferroehr-25.1.1
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "5.7.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
data:
  # The whole server configuration as one ferroehr.toml, mounted at
  # /etc/ferroehr/ferroehr.toml, which the Deployment names in FERROEHR_CONFIG. Rendered by
  # `ferroehr.configToml`, never from .Values.config verbatim: a ConfigMap is not
  # a sensitive object, so a secret-bearing key is either refused (when a
  # `secrets:` key carries it) or moves this whole file into the Secret, in which
  # case this ConfigMap is not created at all.
  # NOTE: Helm decodes values through JSON, so every number reaches a template as
  # a float64; `ferroehr.integers` turns each whole number back into an integer,
  # since the server refuses a TOML float on an integer key.
  ferroehr.toml: |
    [api]
      admin = false
      base_path = "/ferroehr/rest/openehr/v1"
      body_limit = "16MiB"
      openapi_ui = "private"
      terminology = false
    
    [audit]
      enabled = true
      fail_mode = "closed"
      [audit.categories]
        [audit.categories.archetypes]
        [audit.categories.templates]
      [audit.store]
        enabled = true
    
    [auth]
      enabled = true
    
      [[auth.issuer]]
        audience = ["ferroehr"]
        first_party_clients = ["ferroehr-viewer"]
        issuer = "https://idp.example.com/realms/ferroehr"
        kind = "persons"
        profile = "rfc9068"
    
      [[auth.party]]
        identifier_issuer = "urn:example:ferroehr-login"
        identifier_type = "uuid"
        issuer = "https://idp.example.com/realms/ferroehr"
    
    [authz]
      system_client = []
      [authz.abac]
        enabled = false
      [authz.federation]
        agreement = []
      [authz.party_binding]
        namespace = "demographic"
        [authz.party_binding.person]
    
          [[authz.party_binding.person.template]]
            default = true
            template_id = "openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1.0.0"
            [authz.party_binding.person.template.external_id]
              path = "/details[id2]/items[id3]"
              type = "scim_external_id"
            [authz.party_binding.person.template.key]
              path = "/details[id2]/items[id3]"
              type = "uuid"
            [authz.party_binding.person.template.user_name]
              path = "/details[id2]/items[id3]"
              type = "scim_user_name"
        [authz.party_binding.professional_role]
          template_id = "openEHR-DEMOGRAPHIC-ROLE.healthcare_professional.v1.0.0"
        [authz.party_binding.provider]
          id = "00000000"
          issuer = "urn:oid:2.999.7.9"
      [authz.rbac]
        admin_role = "ADMIN"
        ehr_access_default = "restricted"
        enabled = true
        role_issuers = ["https://idp.example.com/realms/ferroehr"]
    
    [database]
      acquire_timeout = "30s"
      max_connections = 10
      migrations = "verify"
      min_connections = 0
      statement_timeout = "1min"
    
    [deployment]
      accepts = ["plaintext_listener"]
      profile = "production"
      spec_profile = "development"
    
    [management]
      base_path = "/management"
      enabled = true
      [management.endpoints]
        env = "off"
        flamegraph = "off"
        info = "off"
        loggers = "off"
        metrics = "off"
        prometheus = "off"
    
    [pixm]
      assigning_authority = "urn:oid:2.999.7.1"
      [pixm.endpoint]
        url = "http://ferroehr-ferropix.ferroehr.svc:8080/fhir"
        [pixm.endpoint.credentials]
          [pixm.endpoint.credentials.oauth]
            client_id = "ferroehr"
            scope = "system/Patient.rs"
            token_endpoint = "https://idp.example.com/realms/pix/protocol/openid-connect/token"
    
    [privacy]
      subject_namespaces = ["urn:oid:2.999.7.1"]
    
    [record]
      subject_index = "pixm"
      [record.multimedia]
        bucket = "openehr-multimedia"
        enabled = false
        region = "us-east-1"
      [record.signing]
        enabled = true
        mode = "digest"
        verify_on_read = "strict"
    
    [server]
      max_concurrent_requests = 256
      [server.caller_rate]
        burst = 2048
        requests_per_second = 1024
    
    [telemetry]
      format = "json"
    
    [usage_report]
      deployment = "helm"
      enabled = true
    

