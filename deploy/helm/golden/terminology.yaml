# Source: ferroehr/templates/terminology.yaml
# The licence-free shaped seed this repository ships: two code systems and two
# value sets under the reserved example.test domain (IETF RFC 6761 §6.2), the
# same content the conformance lane binds to. No licensed terminology is
# distributed with FerroEHR or FerroTERM.
#
# Delivered as a ConfigMap built from the chart's own files, so a fresh
# `helm install` from the registry serves terminology with no repository
# checkout and no init container. The canonical copy is
# docker/terminology/seed/ and scripts/checks/terminology-seed-drift.sh holds
# the two byte-identical.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ferroehr-terminology-codesystems
  annotations:
    kubernetes.io/description: >-
      Synthetic, licence-free FHIR code systems and value sets under the reserved example.test domain, mounted read-only as FerroTERM's code-system directory. Replace it with terminology.codeSystems.existingConfigMap to serve your own.
  labels:
    helm.sh/chart: ferroehr-10.1.5
    app.kubernetes.io/name: ferroehr-terminology
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "4.3.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
    app.kubernetes.io/component: terminology
data:
  codesystem-lab-shaped.json: |
    {
      "resourceType": "CodeSystem",
      "id": "cnf-lab-shaped",
      "url": "http://cnf.example.test/fhir/CodeSystem/lab-shaped",
      "version": "1.0.0",
      "name": "CnfLabShapedTestCodeSystem",
      "title": "CNF test code system, LOINC-shaped (synthetic)",
      "status": "active",
      "experimental": true,
      "publisher": "ferroehr CNF conformance corpus",
      "description": "SYNTHETIC test content. A flat code system whose codes are SHAPED like LOINC observation codes (NNNNN-N) so the conformance battery can drive a SECOND terminology namespace, routed to a second configured provider, in one running deployment. It contains no LOINC content and is not derived from any licensed terminology: every code and display is invented for this test corpus and lives under the reserved example.test domain (IETF RFC 6761 §6.2).",
      "caseSensitive": true,
      "compositional": false,
      "versionNeeded": false,
      "content": "complete",
      "concept": [
        {
          "code": "99991-1",
          "display": "Test systolic blood pressure (CNF)"
        },
        {
          "code": "99992-9",
          "display": "Test diastolic blood pressure (CNF)"
        },
        {
          "code": "99993-7",
          "display": "Test body temperature (CNF)"
        }
      ]
    }
  codesystem-sct-shaped.json: |
    {
      "resourceType": "CodeSystem",
      "id": "cnf-sct-shaped",
      "url": "http://cnf.example.test/fhir/CodeSystem/sct-shaped",
      "version": "1.0.0",
      "name": "CnfSnomedShapedTestCodeSystem",
      "title": "CNF test code system, SNOMED-CT-shaped (synthetic)",
      "status": "active",
      "experimental": true,
      "publisher": "ferroehr CNF conformance corpus",
      "description": "SYNTHETIC test content. A hierarchical, numerically-coded code system SHAPED like SNOMED CT so the conformance battery can exercise is-a subsumption and value-set membership against a real FHIR R4 terminology server. It contains no SNOMED CT content and is not derived from any licensed terminology: every code and display is invented for this test corpus and lives under the reserved example.test domain (IETF RFC 6761 §6.2).",
      "caseSensitive": true,
      "hierarchyMeaning": "is-a",
      "compositional": false,
      "versionNeeded": false,
      "content": "complete",
      "concept": [
        {
          "code": "1000001",
          "display": "Test disorder (CNF)",
          "concept": [
            {
              "code": "1000002",
              "display": "Test hypertensive disorder (CNF)"
            }
          ]
        },
        {
          "code": "1000003",
          "display": "Test metabolic disorder (CNF)"
        }
      ]
    }
  valueset-lab-shaped-vitals.json: |
    {
      "resourceType": "ValueSet",
      "id": "cnf-lab-shaped-vitals",
      "url": "http://cnf.example.test/fhir/ValueSet/lab-shaped-vitals",
      "version": "1.0.0",
      "name": "CnfLabShapedVitals",
      "title": "CNF test value set, LOINC-shaped vitals (synthetic)",
      "status": "active",
      "experimental": true,
      "publisher": "ferroehr CNF conformance corpus",
      "description": "SYNTHETIC test content. The enumerated value set the LOINC-shaped conformance cases bind to: 99991-1 and 99992-9 are members, 99993-7 is deliberately NOT. This value set exists in a SECOND terminology namespace so a case can prove per-terminology provider selection with two providers configured at the same time.",
      "compose": {
        "include": [
          {
            "system": "http://cnf.example.test/fhir/CodeSystem/lab-shaped",
            "concept": [
              { "code": "99991-1", "display": "Test systolic blood pressure (CNF)" },
              { "code": "99992-9", "display": "Test diastolic blood pressure (CNF)" }
            ]
          }
        ]
      }
    }
  valueset-sct-shaped-disorders.json: |
    {
      "resourceType": "ValueSet",
      "id": "cnf-sct-shaped-disorders",
      "url": "http://cnf.example.test/fhir/ValueSet/sct-shaped-disorders",
      "version": "1.0.0",
      "name": "CnfSnomedShapedDisorders",
      "title": "CNF test value set, SNOMED-CT-shaped disorders (synthetic)",
      "status": "active",
      "experimental": true,
      "publisher": "ferroehr CNF conformance corpus",
      "description": "SYNTHETIC test content. The enumerated value set the SNOMED-CT-shaped conformance cases bind to: 1000001 and 1000002 are members, 1000003 is deliberately NOT, so membership answers differ and a case can prove the value set was really resolved through the terminology server.",
      "compose": {
        "include": [
          {
            "system": "http://cnf.example.test/fhir/CodeSystem/sct-shaped",
            "concept": [
              { "code": "1000001", "display": "Test disorder (CNF)" },
              { "code": "1000002", "display": "Test hypertensive disorder (CNF)" }
            ]
          }
        ]
      }
    }
