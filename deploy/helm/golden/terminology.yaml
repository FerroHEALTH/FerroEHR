# Source: ferroehr/templates/networkpolicy.yaml
# Ingress policy for the ferroehr pods, admitting traffic ONLY to the API port
# (and the management port when it runs on its own listener). Every other inbound
# port is denied. A PHI workload should never be reachable on anything but its
# serving port.
#
# PORTS are narrowed unconditionally; SOURCES only when networkPolicy.ingressFrom
# is set. An ingress rule with no `from` admits every source — other namespaces
# and off-cluster clients included
# (https://kubernetes.io/docs/concepts/services-networking/network-policies/ —
# "If no ... from is specified ... it allows all traffic"). So there are three
# states, and the third exists because the first two look identical in every
# summary of the policy:
#   ingressFrom set                              → sources narrowed to those peers
#   ingressFrom empty, ingressAllowAll true      → EVERY source admitted (shipped)
#   ingressFrom empty, ingressAllowAll false     → refused at render, below
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ferroehr
  annotations:
    kubernetes.io/description: >-
      Ingress for the CDR: only the API port (and the management port when enabled), but from EVERY source — this policy narrows ports, NOT sources (networkPolicy.ingressAllowAll=true). Set networkPolicy.ingressFrom for a PHI workload.
  labels:
    helm.sh/chart: ferroehr-25.0.1-rc3
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "5.7.0-rc2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ferroehr
      app.kubernetes.io/instance: ferroehr
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP

---
# Source: ferroehr/templates/terminology.yaml
# FerroTERM's policy is the one place in this chart where ingress is narrowed by
# DEFAULT rather than by an operator's list: its caller is known — the CDR's
# pods — so there is no state in which admitting every source is the right
# answer, and none is offered. That is the licence posture above expressed as a
# policy object rather than as advice.
#
# Egress carries DNS and nothing else: FerroTERM opens no outbound connection of
# its own, and without DNS a policy'd pod cannot resolve the cluster's own names,
# which fails in a way that reads as the server being wedged.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ferroehr-terminology
  annotations:
    kubernetes.io/description: >-
      Ingress for FerroTERM: only its HTTP port, and only from the CDR's pods. Egress admits DNS only.
  labels:
    helm.sh/chart: ferroehr-25.0.1-rc3
    app.kubernetes.io/name: ferroehr-terminology
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "5.7.0-rc2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
    app.kubernetes.io/component: terminology
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ferroehr-terminology
      app.kubernetes.io/instance: ferroehr
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # The CDR, by pod selector. The CDR carries its own
        # `app.kubernetes.io/name`, so this selects the server's pods and
        # nothing else in the release.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ferroehr
              app.kubernetes.io/instance: ferroehr
      ports:
        # 8080 is the CONTAINER port, not terminology.service.port: `port`
        # "represents the port on the given protocol. This can either be a
        # numerical or named port on a pod"
        # (https://kubernetes.io/docs/reference/kubernetes-api/policy-resources/network-policy-v1/,
        # NetworkPolicyPort) — the pod's, after the Service's translation. The
        # CDR's matching egress rule carries the same number for the same
        # reason.
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

