# Source: ferroehr/templates/viewer.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferroehr-viewer
  annotations:
    kubernetes.io/description: >-
      The FerroEHR Viewer: a Leptos SSR web UI that consumes the CDR strictly over ITS-REST. It never reaches the database, which the viewer NetworkPolicy enforces rather than assumes.
  labels:
    helm.sh/chart: ferroehr-11.0.0
    app.kubernetes.io/name: ferroehr-viewer
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "4.3.4"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
    app.kubernetes.io/component: viewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ferroehr-viewer
      app.kubernetes.io/instance: ferroehr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ferroehr-viewer
        app.kubernetes.io/instance: ferroehr
    spec:
      serviceAccountName: ferroehr-viewer
      automountServiceAccountToken: false
      # Same reason as the server's: the kubelet's per-Service link variables
      # land in the reserved `FERROEHR_` namespace for any Service named
      # `ferroehr*`, and a strict boot-time sweep then refuses to start
      # (https://kubernetes.io/docs/concepts/services-networking/service/#environment-variables).
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      hostUsers: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
        supplementalGroupsPolicy: Strict
      containers:
        - name: viewer
          image: "ghcr.io/ferrohealth/ferroehr-viewer:4.3.4"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # The CDR is addressed by its in-cluster Service — the viewer never
            # talks to the database, and the egress policy below enforces that.
            - name: FERROEHR_VIEWER__CDR__BASE_URL
              value: "http://ferroehr:8080"
            # The viewer's base path mirrors the CDR's own, so shortening
            # config.server.base_path cannot leave the two disagreeing.
            - name: FERROEHR_VIEWER__CDR__BASE_PATH
              value: "/ferroehr/rest/openehr/v1"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 24
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            # `readOnlyRootFilesystem: true` leaves nowhere to write, so the
            # writable scratch the runtime needs is an explicit emptyDir.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
