# Source: ferroehr/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferroehr
  annotations:
    kubernetes.io/description: >-
      The FerroEHR CDR itself: a stateless openEHR ITS-REST API server against an EXTERNAL PostgreSQL 18. It stores nothing locally, so a pod is disposable; readiness reports the database and its schema, liveness does not.
  labels:
    helm.sh/chart: ferroehr-11.0.0
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "4.3.4"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: ferroehr
      app.kubernetes.io/instance: ferroehr
  template:
    metadata:
      annotations:
        # Roll pods when anything the process reads AT BOOT changes: the rendered
        # ferroehr.toml (wherever it lands), the mounted config files, and the
        # secret values. Hashing the ConfigMap template alone missed the last two,
        # so a rotated passphrase or an edited Cedar policy propagated into the
        # volume while every pod kept running on the value it read at startup.
        checksum/config: 184383a0ce9b12825423482bf69ef3568ec9b849190a69e0e94ea70ea6dfc290
      labels:
        app.kubernetes.io/name: ferroehr
        app.kubernetes.io/instance: ferroehr
    spec:
      serviceAccountName: ferroehr
      automountServiceAccountToken: false
      # NOT a tunable: the kubelet's per-Service link variables
      # (<SVC>_SERVICE_HOST, <SVC>_PORT_8080_TCP_ADDR, …) land inside the
      # server's reserved FERROEHR_ namespace for any Service named ferroehr*,
      # and the strict boot-time env sweep then refuses to start
      # (https://kubernetes.io/docs/concepts/services-networking/service/#environment-variables).
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      hostUsers: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
        supplementalGroupsPolicy: Strict
      containers:
        - name: ferroehr
          image: "ghcr.io/ferrohealth/ferroehr:4.3.4"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Only SECRET config is env; the rest is the mounted ferroehr.toml.
          # The DSN comes from an existing Secret (preferred) or the chart Secret;
          # the env layer overrides the file, so each secret here wins over any
          # matching TOML key.
          # A secret VALUE appears below only where the config key has no
          # `*_file` sibling to point at the mounted volume instead; the rest are
          # `*_FILE` paths, which are not themselves sensitive.
          env:
            - name: FERROEHR__DB__URL_FILE
              value: "/etc/ferroehr-secrets/db.url"
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: http
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /health/liveness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            limits:
              cpu: "2"
              ephemeral-storage: 1Gi
              memory: 1Gi
            requests:
              cpu: 250m
              ephemeral-storage: 128Mi
              memory: 256Mi
          volumeMounts:
            # readOnlyRootFilesystem=true → give the process a writable scratch dir.
            - name: tmp
              mountPath: /tmp
            # ferroehr.toml (+ any config.files) mounted read-only at /etc/ferroehr.
            - name: config
              mountPath: /etc/ferroehr
              readOnly: true
            # File-borne secrets, read-only. NOT a subPath mount: a subPath-mounted
            # Secret never receives updates, so a rotation would not propagate
            # (https://kubernetes.io/docs/concepts/storage/volumes/#using-subpath).
            - name: secrets
              mountPath: /etc/ferroehr-secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          projected:
            # Same 0440 as the secrets volume, for the same reason: this volume
            # is not only ferroehr.toml. Every `config.files` entry lands here,
            # and that key's documented use includes the PGP signing PRIVATE key
            # (signing.key_path), mutual-TLS PEMs and a JWKS blob; when the
            # configuration holds a secret the chart cannot route out of it,
            # ferroehr.toml itself arrives from a Secret too. Without a mode the
            # projection defaults to 0644 — world-readable inside the container.
            # Owner is root, group is fsGroup, so the group bit is what the
            # non-root process reads through
            # (https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod).
            defaultMode: 0440
            sources:
              - configMap:
                  name: ferroehr
                  items:
                    - key: ferroehr.toml
                      path: ferroehr.toml
        # File-borne secrets. A projected volume rather than a plain secret volume
        # because the DSN may live in an EXTERNAL Secret the operator created,
        # which has to be projected beside the chart's own — both under one mount,
        # and not a subPath mount, so a rotated Secret still propagates.
        - name: secrets
          projected:
            # Owner is root, group is fsGroup, so the group bit is what the
            # non-root process reads through
            # (https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod).
            defaultMode: 0440
            sources:
              # The operator's Secret, projected as the file FERROEHR__DB__URL_FILE
              # points at. Its key name is theirs (database.existingSecretKey);
              # only the mounted PATH is fixed.
              - secret:
                  name: ferroehr-db
                  items:
                    - key: FERROEHR__DB__URL
                      path: db.url
              - secret:
                  name: ferroehr-env
                  items:
                    - key: auth.basic.users.clinician.password_hash
                      path: auth.basic.users.clinician.password_hash
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ferroehr
              app.kubernetes.io/instance: ferroehr

