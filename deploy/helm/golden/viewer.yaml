---
# Source: ferroehr/templates/networkpolicy.yaml
# Ingress policy for the ferroehr pods, admitting traffic ONLY to the API port
# (and the management port when it runs on its own listener). Every other inbound
# port is denied. A PHI workload should never be reachable on anything but its
# serving port.
#
# PORTS are narrowed unconditionally; SOURCES only when networkPolicy.ingressFrom
# is set. An ingress rule with no `from` admits every source — other namespaces
# and off-cluster clients included
# (https://kubernetes.io/docs/concepts/services-networking/network-policies/ —
# "If no ... from is specified ... it allows all traffic"). So there are three
# states, and the third exists because the first two look identical in every
# summary of the policy:
#   ingressFrom set                              → sources narrowed to those peers
#   ingressFrom empty, ingressAllowAll true      → EVERY source admitted (shipped)
#   ingressFrom empty, ingressAllowAll false     → refused at render, below
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ferroehr
  annotations:
    kubernetes.io/description: >-
      Ingress for the CDR: only the API port (and the management port when enabled), but from EVERY source — this policy narrows ports, NOT sources (networkPolicy.ingressAllowAll=true). Set networkPolicy.ingressFrom for a PHI workload.
  labels:
    helm.sh/chart: ferroehr-11.0.0
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "4.3.4"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ferroehr
      app.kubernetes.io/instance: ferroehr
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP

---
# Source: ferroehr/templates/viewer.yaml
# The viewer's ingress half has the same three states the CDR's policy has, and
# for the same API reason: an ingress rule with no `from` admits every source —
# other namespaces and off-cluster clients included
# (https://kubernetes.io/docs/concepts/services-networking/network-policies/ —
# "If no ... from is specified ... it allows all traffic"). The viewer is the
# HUMAN-facing surface, so an accidentally open rule here is a login page reachable
# from anywhere the cluster network reaches.
#   ingressFrom set                                     → sources narrowed
#   ingressFrom empty, ingressAllowAll true             → EVERY source (shipped)
#   ingressFrom empty, ingressAllowAll false            → refused at render, below
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ferroehr-viewer
  annotations:
    kubernetes.io/description: >-
      Ingress for the viewer: only its HTTP port, but from EVERY source — this policy narrows ports, NOT sources (viewer.networkPolicy.ingressAllowAll=true). Set viewer.networkPolicy.ingressFrom for a PHI workload. Egress admits the CDR Service and DNS only.
  labels:
    helm.sh/chart: ferroehr-11.0.0
    app.kubernetes.io/name: ferroehr-viewer
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "4.3.4"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
    app.kubernetes.io/component: viewer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ferroehr-viewer
      app.kubernetes.io/instance: ferroehr
  policyTypes:
    - Ingress
    - Egress
  ingress:
    -
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # The CDR, by pod selector — the viewer's ONLY application destination.
    #
    # This selects the server's pods exactly: the viewer carries its own
    # `app.kubernetes.io/name`, so the two label sets no longer overlap and
    # this rule cannot admit viewer→viewer traffic.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ferroehr
              app.kubernetes.io/instance: ferroehr
      ports:
        - protocol: TCP
          port: 8080
    # DNS. Without this the Service name above does not resolve and the viewer
    # fails in a way that looks like the CDR being down.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

