# Source: ferroehr/templates/secret.yaml
# Chart-managed Secret. In production prefer database.existingSecret (and an
# external secret store / IRSA for the rest); anything set here is rendered from
# values, so keep it out of committed values.
#
# Two key shapes live here, and the difference is deliberate. A key spelled
# `<config.path>` is MOUNTED as a read-only file and reached through the config
# tree's `*_file` sibling — the posture the OWASP Kubernetes Security Cheat Sheet
# asks for, since an environment variable is readable through /proc/<pid>/environ
# and inherited by every child process
# (https://cheatsheetseries.owasp.org/cheatsheets/Kubernetes_Security_Cheat_Sheet.html).
# A key spelled `FERROEHR__…` is injected as an environment VALUE. Only two are
# left in that form — `audit.fhir_feed.url` and `multimedia.access_key_id`, the
# remaining config keys with no `*_file` sibling. The DSN and the AMQP URL moved
# to files once the server gained `db.url_file` and `events.url_file`.
apiVersion: v1
kind: Secret
metadata:
  name: ferroehr-env
  labels:
    helm.sh/chart: ferroehr-11.0.0
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "4.3.4"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
type: Opaque
stringData:
  auth.basic.users.clinician.password_hash: "$argon2id$v=19$m=19456,t=2,p=1$ZmVycm9laHJEZXZTYWx0$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"

---
# Source: ferroehr/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: ferroehr
  labels:
    helm.sh/chart: ferroehr-11.0.0
    app.kubernetes.io/name: ferroehr
    app.kubernetes.io/instance: ferroehr
    app.kubernetes.io/version: "4.3.4"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: ferroehr
data:
  # The whole server configuration as one ferroehr.toml, mounted at
  # /etc/ferroehr/ferroehr.toml (config search-order position 4). Rendered by
  # `ferroehr.configToml`, never from .Values.config verbatim: a ConfigMap is not
  # a sensitive object, so a secret-bearing key is either refused (when a
  # `secrets:` key carries it) or moves this whole file into the Secret, in which
  # case this ConfigMap is not created at all.
  # NOTE: Helm decodes values through JSON, so every number reaches a template as
  # a float64 and `toToml` writes it back as a TOML float (`10.0`, `1.6777216e+07`)
  # — the server's configuration layer coerces those onto integer keys, which is
  # why the rendered file is accepted as written.
  ferroehr.toml: |
    deployment_profile = "sandbox"
    spec_profile = "development"
    
    [admin]
      enabled = false
    
    [audit]
      enabled = true
      [audit.categories]
        [audit.categories.archetypes]
        [audit.categories.templates]
      [audit.store]
        enabled = true
        retention_days = 0.0
    
    [auth]
      enabled = true
      [auth.basic]
    
        [[auth.basic.users]]
          password_hash_file = "/etc/ferroehr-secrets/auth.basic.users.clinician.password_hash"
          roles = ["ADMIN"]
          username = "clinician"
    
    [authz]
      [authz.abac]
        enabled = false
      [authz.rbac]
        admin_role = "ADMIN"
        enabled = true
        user_role = "USER"
    
    [db]
      acquire_timeout_secs = 30.0
      max_connections = 10.0
      migrate = "apply"
      min_connections = 0.0
      statement_timeout_ms = 60000.0
    
    [events]
      enabled = false
      exchange = "ferroehr.events"
      tls = false
    
    [log]
      format = "json"
    
    [management]
      base_path = "/management"
      enabled = true
      [management.endpoints]
        env = "off"
        flamegraph = "off"
        info = "off"
        loggers = "off"
        metrics = "off"
        prometheus = "off"
    
    [multimedia]
      allow_http = false
      bucket = "openehr-multimedia"
      enabled = false
      region = "us-east-1"
    
    [server]
      base_path = "/ferroehr/rest/openehr/v1"
      bind = "0.0.0.0:8080"
      cors_permissive = false
      swagger_ui = "private"
      [server.connection]
        header_read_timeout_secs = 10.0
        http2_keep_alive_interval_secs = 30.0
        http2_keep_alive_timeout_secs = 10.0
        max_concurrent_streams = 256.0
      [server.limits]
        body_bytes = 1.6777216e+07
        bulk_body_bytes = 6.7108864e+07
      [server.rate_limit]
        address_burst = 4096.0
        address_per_second = 2048.0
        enabled = true
        principal_burst = 2048.0
        principal_per_second = 1024.0
    
    [signing]
      enabled = true
      mode = "digest"
      verify_on_read = "strict"
    
    [terminology]
      api_enabled = false
    
    [usage_report]
      deployment = "helm"
      enabled = true
    

