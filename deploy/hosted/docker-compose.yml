# SPDX-FileCopyrightText: Cadasto B.V.
# SPDX-License-Identifier: BUSL-1.1
#
# What runs on the sandbox box: the CDR, the viewer, and a proxy that
# gets its own certificate (#2974).
#
# The file lives at /opt/ferroehr-sandbox/docker-compose.yml on the host, and
# it gets there from inside the ferroehr image: it is COPYed to
# /opt/sandbox-posture/ (docker/Dockerfile) and the deploy script installs it
# out of the image it just pulled. So an edit here reaches the box with the
# release that carries it, and never before one.
#
# The database is the dedicated DB box (ferroehr-sandbox-postgres, a second
# CX33 provisioned by deploy/hosted/cloud-init-postgres.yaml): `.env` carries
# its private-network connection string as DATABASE_URL, which the config
# alias layer maps to db.url (app/ferroehr/src/config/alias.rs). The database
# has no public port; the app reaches it over the Hetzner private network
# (10.0.0.0/24) alone.
#
# FerroPIX (#4242) is the CDR's IHE patient identity source, with its own
# database on the same DB box (FERROPIX_DATABASE_URL in `.env`). The CDR and
# FerroPIX both accept a plain-http token issuer only on loopback (RFC 8414
# §2), so the development issuer owns one network namespace that the CDR and
# FerroPIX join, the way the quickstart runs them: all three see each other on
# localhost (CDR 8080, FerroPIX 8090, issuer 8180), and the issuer answers to
# the name `ferroehr` on the compose network for Caddy and the viewer.
#
# Memory on the 8 GB box (limits, not use): CDR 3072m, FerroTERM 1536m,
# viewer 1024m, FerroPIX 512m, issuer 256m, Caddy 128m, the SCIM provisioner
# 32m: 6560m, which leaves about 1.1 GiB of the ~7.6 GiB the kernel reports for the OS and Docker.

services:
  ferroehr:
    # The release pointer the image lane moves on real release tags. `.env`
    # names the exact reference so a rollback can pin an older one.
    image: ${FERROEHR_IMAGE:-ghcr.io/ferrohealth/ferroehr:latest}
    container_name: ferroehr-sandbox
    restart: unless-stopped
    # The image is its own health probe (`ferroehr healthcheck`): the
    # distroless base carries no shell and no curl. The deploy lane waits on
    # this before it verifies anything from outside.
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferroehr", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Sized for the box (a CX33: 4 vCPU, 8 GB), not for an aspiration. On a
    # resize this limit and the viewer's move together, and neither is a
    # code change.
    deploy:
      resources:
        limits:
          memory: 3072m
    environment:
      FERROEHR_CONFIG: /etc/ferroehr/ferroehr.toml
      # The DB box's private-network string, interpolated from `.env` (Compose
      # reads `.env` for ${...} substitution regardless), so the ONLY thing the
      # container's environment gains from `.env` is this one key — the config
      # alias layer maps DATABASE_URL to db.url (app/ferroehr/src/config/alias.rs).
      # Not `env_file: .env`: that injected EVERY operator var, including the
      # compose-only FERROEHR_*_IMAGE substitution names, and the CDR's strict
      # boot sweep (app/ferroehr/src/config/strict.rs) rejects any FERROEHR_ name
      # it does not allowlist — so a stale image var in `.env` crashlooped the
      # CDR (a renamed image var and its allowlist entry drifting apart). An
      # explicit key list cannot drift with the operator's file.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in /opt/ferroehr-sandbox/.env}
    volumes:
      - ./ferroehr.sandbox.toml:/etc/ferroehr/ferroehr.toml:ro
    # The issuer's namespace (the header says why); Caddy and the viewer reach
    # the CDR as ferroehr:8080, the name the issuer answers to.
    network_mode: service:identity-issuer
    depends_on:
      identity-issuer:
        condition: service_started
      ferroehr-definitions:
        condition: service_completed_successfully
      ferroterm:
        condition: service_healthy
      # The CDR reads FerroPIX's CapabilityStatement at boot and refuses to
      # start while it does not answer.
      ferropix:
        condition: service_healthy

  # Loads FerroEHR's default demographic definitions into the definition
  # store before the CDR starts (`ferroehr definitions load`), since boot
  # refuses a mapping whose templates the store lacks: the professional PERSON
  # and ROLE the party mapping names, the care-team GROUP, the membership and
  # representation PARTY_RELATIONSHIPs, the patient PERSON and the healthcare
  # provider ORGANISATION. A definition stored with
  # the same text is left alone, so it runs at every deploy. It reads the
  # CDR's own configuration and database string, in the issuer's namespace
  # as the CDR does.
  ferroehr-definitions:
    image: ${FERROEHR_IMAGE:-ghcr.io/ferrohealth/ferroehr:latest}
    command:
      - definitions
      - load
      - /etc/ferroehr/definitions/person.adls
      - /etc/ferroehr/definitions/role.adls
      - /etc/ferroehr/definitions/group.adls
      - /etc/ferroehr/definitions/membership.adls
      - /etc/ferroehr/definitions/representation.adls
      - /etc/ferroehr/definitions/patient.adls
      - /etc/ferroehr/definitions/provider.adls
    environment:
      FERROEHR_CONFIG: /etc/ferroehr/ferroehr.toml
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in /opt/ferroehr-sandbox/.env}
    volumes:
      - ./ferroehr.sandbox.toml:/etc/ferroehr/ferroehr.toml:ro
    configs:
      - source: ferroehr-definition-person
        target: /etc/ferroehr/definitions/person.adls
      - source: ferroehr-definition-role
        target: /etc/ferroehr/definitions/role.adls
      - source: ferroehr-definition-group
        target: /etc/ferroehr/definitions/group.adls
      - source: ferroehr-definition-membership
        target: /etc/ferroehr/definitions/membership.adls
      - source: ferroehr-definition-representation
        target: /etc/ferroehr/definitions/representation.adls
      - source: ferroehr-definition-patient
        target: /etc/ferroehr/definitions/patient.adls
      - source: ferroehr-definition-provider
        target: /etc/ferroehr/definitions/provider.adls
    network_mode: service:identity-issuer
    depends_on:
      identity-issuer:
        condition: service_started
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # The development OpenID Provider (NAV's mock-oauth2-server), and the owner
  # of the network namespace the CDR and FerroPIX join. It signs any client
  # credentials request: the client as `sub` and `client_id`, FerroPIX's FHIR
  # base as the audience, and the scope asked for. It publishes no port, so
  # only the containers on this box can ask it, and FerroPIX, the one server
  # that trusts its tokens, answers on loopback alone.
  identity-issuer:
    image: ${FERROEHR_ISSUER_IMAGE:-ghcr.io/navikt/mock-oauth2-server:6.1.5@sha256:d88e445d55c4ff6eed59b02d86adfece47d985233b1616fb712669b98328c8a2}
    container_name: ferroehr-sandbox-issuer
    restart: unless-stopped
    networks:
      default:
        aliases: [ferroehr]
    deploy:
      resources:
        limits:
          memory: 256m
    environment:
      # The CDR listens on 8080 in this namespace, so the provider moves.
      SERVER_PORT: "8180"
      # A request for the scope ferroehr/scim gets a token for FerroEHR's SCIM
      # endpoint (the ferroehr-provision service below); every other client
      # credentials request gets one for FerroPIX.
      # `$$` is a literal `$` to compose.
      JSON_CONFIG: >-
        {"tokenCallbacks":[{"issuerId":"sandbox",
        "requestMappings":[{"requestParam":"scope","match":"ferroehr/scim",
        "claims":{"sub":"$${clientId}","client_id":"$${clientId}",
        "aud":["ferroehr-scim"],"scope":"$${scope}"}},
        {"requestParam":"grant_type","match":"client_credentials",
        "claims":{"sub":"$${clientId}","client_id":"$${clientId}",
        "aud":["http://localhost:8090/fhir"],"scope":"$${scope}"}}]}]}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Waits until the issuer serves its metadata, at most two minutes. The
  # issuer's distroless image carries no probe of its own to run as a
  # healthcheck, so this one-shot in its namespace is the gate.
  identity-issuer-ready:
    image: ${FERROEHR_CURL_IMAGE:-curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777}
    network_mode: service:identity-issuer
    depends_on:
      identity-issuer:
        condition: service_started
    entrypoint:
      - sh
      - -c
      - >-
        for i in $$(seq 1 120); do
        curl -fsS -o /dev/null http://localhost:8180/sandbox/.well-known/openid-configuration && exit 0;
        sleep 1; done; echo 'the issuer did not answer in 120 s' >&2; exit 1
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Provisions the demo user `ferroehr` as a professional PERSON through the
  # CDR's SCIM endpoint (RFC 7644 §3.3), the way an identity provider
  # provisions people, so the Basic login is bound to the PERSON FerroEHR
  # issues for its binding key: the `sandbox-scim` client takes a client
  # credentials token (RFC 6749 §4.4) for the scope ferroehr/scim from the
  # development issuer, asks for the User by `userName` (RFC 7644 §3.4.2.2)
  # and creates it when it is missing. The nightly reset wipes every PERSON
  # and restarts the CDR alone, so this service keeps asking every 30 seconds
  # instead of exiting: the reseed (scripts/sandbox/reseed.sh) waits for the
  # login to bind before it commits anything.
  ferroehr-provision:
    image: ${FERROEHR_CURL_IMAGE:-curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777}
    container_name: ferroehr-sandbox-provision
    restart: unless-stopped
    network_mode: service:identity-issuer
    depends_on:
      identity-issuer-ready:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 32m
    entrypoint:
      - sh
      - -c
      - >-
        while true; do
        token=$$(curl -fsS -d grant_type=client_credentials -d client_id=sandbox-scim
        -d client_secret=sandbox -d scope=ferroehr/scim
        http://localhost:8180/sandbox/token | sed -n 's/.*"access_token" *: *"\([^"]*\)".*/\1/p');
        if [ -n "$$token" ]; then
        found=$$(curl -sS -H "Authorization: Bearer $$token"
        'http://localhost:8080/scim/v2/Users?filter=userName%20eq%20%22ferroehr%22' |
        sed -n 's/.*"totalResults" *: *\([0-9]*\).*/\1/p');
        if [ "$$found" = 0 ]; then
        status=$$(curl -sS -o /tmp/answer -w '%{http_code}' -X POST
        -H "Authorization: Bearer $$token" -H 'Content-Type: application/scim+json'
        --data '{"schemas":["urn:ietf:params:scim:schemas:core:2.0:User","urn:ietf:params:scim:schemas:extension:ferrohealth:2.0:User"],"userName":"ferroehr","urn:ietf:params:scim:schemas:extension:ferrohealth:2.0:User":{"loginIdentifier":"ferroehr"}}'
        http://localhost:8080/scim/v2/Users);
        echo "provisioning ferroehr answered $$status";
        fi;
        fi;
        sleep 30; done
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # FerroPIX, the IHE patient identity source (#4242): a PIXm Manager that
  # mints the pseudonym EHR_STATUS names each demo patient by. Loopback only
  # in the issuer's namespace: no port, no Caddy route, the CDR and the seed
  # below its only callers. Its database is on the DB box; the URL and the
  # sealing key are compose secrets read from `.env`.
  ferropix:
    image: ${FERROPIX_IMAGE:-ghcr.io/ferrohealth/ferropix:0.0.26@sha256:85d40e6fdcdb39f782007eff91eb059861a4e039ca3f8fb56e37f2fa0f28d78a}
    container_name: ferroehr-sandbox-ferropix
    restart: unless-stopped
    network_mode: service:identity-issuer
    depends_on:
      # FerroPIX reads the issuer's metadata once at start and exits when it
      # cannot, so it starts only after the issuer answers.
      identity-issuer-ready:
        condition: service_completed_successfully
    # The image's own probe (`ferropix healthcheck`, readiness on the listen
    # address), stated here because an OCI-format image carries none to
    # Podman.
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferropix", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      FERROPIX_CONFIG: /etc/ferropix/ferropix.toml
      # The image sets 0.0.0.0:8080, which the CDR binds in this namespace,
      # and the environment wins over the file.
      FERROPIX__SERVER__LISTEN: 127.0.0.1:8090
    configs:
      - source: ferropix-db-url
        target: /etc/ferropix/db-url
      - source: ferropix-data-key
        target: /etc/ferropix/data-key
    volumes:
      - ./ferropix.sandbox.toml:/etc/ferropix/ferropix.toml:ro
      # The audit spool and the usage report's instance id.
      - ferropix_state:/var/lib/ferropix
    # NOT `read_only: true`: Compose copies a secret read from the environment
    # into the container, which a read-only root filesystem refuses.
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  # The one-shot that registers the demo patients with FerroPIX and answers
  # their pseudonyms, started by the deploy script's `identities` verb with
  # the manifest subjects on stdin. Its script travels in the ferroehr image
  # (/opt/sandbox-posture/ferropix-seed.sh), mounted the way FerroTERM's seed
  # is; the `seed` profile keeps `up -d` from starting it.
  ferropix-seed:
    image: ${FERROEHR_CURL_IMAGE:-curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777}
    profiles: [seed]
    network_mode: service:identity-issuer
    depends_on:
      ferropix:
        condition: service_healthy
    entrypoint: ["sh", "/image/opt/sandbox-posture/ferropix-seed.sh"]
    volumes:
      - type: image
        source: ${FERROEHR_IMAGE:-ghcr.io/ferrohealth/ferroehr:latest}
        target: /image
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # FerroTERM, the terminology server, beside the CDR on the same box (#3304):
  # no ports, no Caddy route, viewer off. It is reachable as ferroterm:8080 on
  # the compose network alone, so the only caller is the CDR and a visitor
  # exercises it through binding resolution, AQL TERMINOLOGY() and the CDR's
  # /terminology/* routes. That is the SNOMED CT Affiliate Licence posture
  # (clause 2.2.4: a public system may serve SNOMED-encoded data provided users
  # cannot extract a substantial portion and no fee is charged; clause 2.7:
  # measures so the release cannot be downloaded except by authorised users).
  #
  # Content: the licence-free shaped seed, mounted straight out of the ferroehr
  # image (the posture directory /opt/sandbox-posture/terminology). A real
  # edition is the operator's: build its index off-box with ferroterm-build,
  # place the directories under ./ferroterm-index, and list them in .env as
  # FERROTERM_INDEXES=/data/index/int,/data/index/loinc (env.example). The
  # sandbox loads the SNOMED CT International Edition (owner decision on #3304:
  # one licence step through MLDS, English displays, 702 MB resident); the
  # 1536m cap also fits the Netherlands edition (889 MB).
  # The CDR's cap moved from 4096m to 3072m to make room on the 8 GB box.
  ferroterm:
    image: ${FERROTERM_IMAGE:-ghcr.io/ferrohealth/ferroterm:0.4.5@sha256:7c20d39e1989fce1dfb92e6ddfd853dfa9a52bb9b7b973fbba42430963ef75bd}
    container_name: ferroehr-sandbox-ferroterm
    restart: unless-stopped
    # The image is its own health probe (`ferroterm healthcheck`, readiness
    # since 0.3.1): no shell, no curl in the distroless base. Same cadence as the CDR's above;
    # the start period covers loading a SNOMED CT edition.
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferroterm", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1536m
    # FerroTERM 0.3 reads its configuration tree only (`FERROTERM__…`): a
    # list is comma-separated, so FERROTERM_INDEXES in `.env` names the
    # index directories with commas.
    environment:
      FERROTERM__TERMINOLOGY__CODE_SYSTEMS: /image/opt/sandbox-posture/terminology
      FERROTERM__TERMINOLOGY__INDEX: ${FERROTERM_INDEXES:-}
      FERROTERM__TELEMETRY__FORMAT: json
      RUST_LOG: info
    volumes:
      # The whole ferroehr image, read-only, for the seed directory it carries
      # (a subpath mount needs a newer engine than a box may run).
      - type: image
        source: ${FERROEHR_IMAGE:-ghcr.io/ferrohealth/ferroehr:latest}
        target: /image
        read_only: true
      - type: bind
        source: ${FERROTERM_INDEX_DIR:-./ferroterm-index}
        target: /data/index
        read_only: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"

  viewer:
    image: ${FERROEHR_VIEWER_IMAGE:-ghcr.io/ferrohealth/ferroehr-viewer:latest}
    container_name: ferroehr-sandbox-viewer
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferroehr-viewer", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024m
    environment:
      FERROEHR_VIEWER_CONFIG: /etc/ferroehr/viewer.toml
    volumes:
      - ./ferroehr-viewer.sandbox.toml:/etc/ferroehr/viewer.toml:ro
    depends_on:
      - ferroehr
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: ferroehr-sandbox-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificate and the account key survive a redeploy. Losing them
      # means asking for a new certificate on every deploy, which is how a
      # deploy loop meets a rate limit.
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 128m
    depends_on:
      - ferroehr
      - viewer

configs:
  ferropix-db-url:
    content: ${FERROPIX_DATABASE_URL:?FERROPIX_DATABASE_URL must be set in /opt/ferroehr-sandbox/.env}
  ferropix-data-key:
    content: ${FERROPIX_DATA_KEY:?FERROPIX_DATA_KEY must be set in /opt/ferroehr-sandbox/.env}

  # The professional PERSON and ROLE templates the ferroehr-definitions one-shot
  # loads: copies of deploy/definitions/professional/ (CC-BY-SA 3.0, adapted
  # from openEHR CKM archetypes; that directory's PROVENANCE.md names each
  # source and change), held equal to the files by a test of the loader.
  ferroehr-definition-person:
    content: |
      archetype (adl_version=2.0.6; rm_release=1.1.0)
          openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1.0.0

      language
          original_language = <[ISO_639-1::en]>

      description
          original_author = <
              ["name"] = <"FerroEHR">
              ["organisation"] = <"Cadasto B.V.">
          >
          lifecycle_state = <"unmanaged">
          details = <
              ["en"] = <
                  language = <[ISO_639-1::en]>
                  purpose = <"A healthcare professional's PERSON, whose login identifiers bind the person to their sign-ins.">
                  use = <"Adapted from the openEHR CKM archetypes the derived_from entry names: the person's identifiers in details, the name in identities and a work email in contacts, every element optional so a person provisioned without one is complete.">
                  copyright = <"© openEHR Foundation">
              >
          >
          other_details = <
              ["licence"] = <"This work is licensed under the Creative Commons Attribution-ShareAlike 3.0 License. To view a copy of this license, visit http://creativecommons.org/licenses/by-sa/3.0/.">
              ["derived_from"] = <"openEHR-DEMOGRAPHIC-PERSON.person.v0 (openEHR CKM 1013.1.479, modified 2022-01-20), openEHR-DEMOGRAPHIC-CLUSTER.person_identifier.v0 (openEHR CKM 1013.1.470, modified 2018-12-20), openEHR-DEMOGRAPHIC-PARTY_IDENTITY.person_name.v0 (openEHR CKM 1013.1.477, modified 2019-08-09), openEHR-DEMOGRAPHIC-ADDRESS.electronic_communication.v0 (openEHR CKM 1013.1.486, modified 2019-08-08)">
          >

      definition
          PERSON[id1] matches {
              details matches {
                  ITEM_TREE[id2] matches {
                      items matches {
                          ELEMENT[id3] occurrences matches {0..*} matches {
                              value matches { DV_IDENTIFIER[id13] }
                          }
                      }
                  }
              }
              identities matches {
                  PARTY_IDENTITY[id4] matches {
                      name matches {
                          DV_TEXT[id18]
                          DV_CODED_TEXT[id19] matches {
                              defining_code matches {[ac1]}
                          }
                      }
                      details matches {
                          ITEM_TREE[id5] matches {
                              items matches {
                                  ELEMENT[id6] occurrences matches {0..1} matches {
                                      value matches { DV_TEXT[id14] }
                                  }
                                  ELEMENT[id7] occurrences matches {0..1} matches {
                                      value matches { DV_TEXT[id15] }
                                  }
                                  ELEMENT[id8] occurrences matches {0..1} matches {
                                      value matches { DV_TEXT[id16] }
                                  }
                              }
                          }
                      }
                  }
              }
              contacts matches {
                  CONTACT[id9] occurrences matches {0..1} matches {
                      addresses matches {
                          ADDRESS[id10] matches {
                              name matches {
                                  DV_TEXT[id20]
                                  DV_CODED_TEXT[id21] matches {
                                      defining_code matches {[ac2]}
                                  }
                              }
                              details matches {
                                  ITEM_TREE[id11] matches {
                                      items matches {
                                          ELEMENT[id12] occurrences matches {0..1} matches {
                                              value matches { DV_TEXT[id17] }
                                          }
                                          ELEMENT[id22] occurrences matches {0..1} matches {
                                              value matches {
                                                  DV_TEXT[id23]
                                                  DV_CODED_TEXT[id24] matches {
                                                      defining_code matches {[ac3]}
                                                  }
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

      terminology
          term_definitions = <
              ["en"] = <
                  ["id1"] = <text = <"Healthcare professional"> description = <"A person who provides healthcare.">>
                  ["id2"] = <text = <"Person identifiers"> description = <"The identifiers of the person.">>
                  ["id3"] = <text = <"Identifier main data"> description = <"An identifier of the person, such as a login identifier.">>
                  ["id4"] = <text = <"Person name"> description = <"The name of the person.">>
                  ["id5"] = <text = <"Name"> description = <"The structure of the name.">>
                  ["id6"] = <text = <"Full name"> description = <"The name as it is written in full.">>
                  ["id7"] = <text = <"Given name"> description = <"The given name of the person.">>
                  ["id8"] = <text = <"Family name"> description = <"The family name of the person.">>
                  ["id9"] = <text = <"Contacts"> description = <"The contacts of the person.">>
                  ["id10"] = <text = <"Electronic communication"> description = <"An electronic address of the person.">>
                  ["id11"] = <text = <"Electronic communication details"> description = <"The structure of the address.">>
