#
# The hosted-sandbox posture for the viewer (#2941, #2974,
# sandbox.ferroehr.eu), travelling inside the ferroehr image
# (/opt/sandbox-posture) and bind-mounted by the box's compose file. The
# viewer is the sandbox's landing surface;
# it drives the sandbox CDR strictly over the public REST base, so what it
# shows is exactly what the public API serves. It signs in as the same demo
# user the API takes (ferroehr / ferroehr, USER role): the CDR's admin and
# management surfaces stay OFF, and the viewer's probe-and-hide keeps their
# screens out of the navigation.

[cdr]
# The public REST base — the viewer's BFF calls the same origin a visitor's
# own tooling calls, never a private channel.
base_url = "https://sandbox.ferroehr.eu"

[session]
# TLS terminates at Caddy on the same box.
cookie_secure = true
# The cookie-sealing key, DELIBERATELY public (owner call, #2949): the
# sandbox is a demo whose only credential is itself public, so a forgeable
# demo session protects nothing — and a committed key keeps the deployment
# zero-secret. Every real deployment generates its own and keeps it secret.
secret = "QbcUgnEXEpoyarA0YLvc0Lw1BsTGigAEcFgQQu0Kb8ym1eTJc2ehU96CIQv1YrP0I1J9KjOnSwKaFaTRG89+e/svrxGYsbd4WM2JlgB6WMugNWWUBLPOIyXwkLs1zROR"

# The sign-in card states what a visitor needs (#2941): the demo credentials
# and the free-tier expectations, with the API reference linked underneath.
# The [login] key ships in the viewer image from v4.0.12 on — an older
# :latest refuses it at boot, which the deploy workflow's viewer poll
# catches.
[login]
notice = """
Public demo sandbox. Sign in with ferroehr / ferroehr.
Demo data only, wiped nightly."""

[[login.links]]
label = "API reference (Swagger UI)"
href = "https://sandbox.ferroehr.eu/ferroehr/rest/swagger-ui"

[[login.links]]
label = "Documentation"
href = "https://ferroehr.eu/docs/latest/"
