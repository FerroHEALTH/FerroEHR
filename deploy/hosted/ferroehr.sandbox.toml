#
# The hosted-sandbox posture (#2974, sandbox.ferroehr.eu), served from the
# Hetzner box: the file travels inside the ferroehr image (/opt/sandbox-posture)
# and the deploy script bind-mounts the installed copy. It differs from the
# compose quickstart where a PUBLIC endpoint demands it: the management
# introspection stays OFF (default). The admin API is ON (owner ruling, #2965):
# the sandbox resets nightly, so it is disposable by design — the
# development/testing posture the released admin operations describe — and the
# conformance statement's AdminApi claims are exercisable against this
# deployment. The public bulk delete is accepted: it wipes what the nightly
# reset wipes anyway. The database DSN comes from the box's `.env`, never from
# this file — the DB box's private-network connection string as
# DATABASE_URL, mapped to db.url by the config aliases (#2716).

# The public sandbox holds no real patient data and resets nightly; the
# declaration is explicit so the posture it runs under is read from this file.
[deployment]
profile = "sandbox"

[api]
# The public API reference the documentation links to; the default asks for the
# API credential.
openapi_ui = "public"

admin = true
terminology = true
# The issuer the Basic users bind under. A Basic user is a person and maps to
# the PERSON carrying its binding key, which [[auth.party]] places under the
# identifier issuer of a persons issuer. This one signs nothing: its key set,
# deploy/hosted/basic-users-jwks.json, which every FerroEHR image carries, is
# the public half of a key pair whose private key was discarded, for local
# lanes only, so no token of it exists.
[[auth.issuer]]
issuer = "https://basic-users.ferroehr.invalid"
kind = "persons"
audience = ["ferroehr-basic-users"]
jwks_file = "/opt/sandbox-posture/basic-users-jwks.json"

[[auth.party]]
issuer = "https://basic-users.ferroehr.invalid"
identifier_issuer = "urn:ferroehr:basic-user"
identifier_type = "login"
group_claim = "groups"
group_identifier_issuer = "urn:ferroehr:groups"

# The whole admin group behind the demo credential — no partial enablement,
# no separate admin user (owner ruling, #2965).

# The demo user: ferroehr / ferroehr (the hash is Argon2id of "ferroehr").
# Public by design; the sandbox holds demo data only and is wiped on a
# schedule.
# Its scopes grant every SMART on openEHR resource family, and the product
# scope admits the ADMIN and DEMOGRAPHIC APIs.
[[auth.basic.users]]
user = "ferroehr"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$ZmVycm9laHJEZXZTYWx0$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"
scopes = ["user/composition-*.cruds", "user/template-*.cruds", "user/aql-*.cruds", "__ferroehr.platform"]

# The healthcare provider the sandbox acts for (an example id under the OID
# arc 2.999), and the binding key of the demo user.
[authz.party_binding]
provider = { issuer = "urn:oid:2.999.7.9", id = "sandbox" }

[[authz.party_binding.basic_user]]
user = "ferroehr"
key_issuer = "urn:ferroehr:basic-user"
key = "ferroehr"

# The SCIM endpoint the demo PERSON is provisioned through (RFC 7644 §3.3), as
# an identity provider provisions people: the ferroehr-provision service of the
# box's compose file holds the `sandbox-scim` client's client credentials
# token (RFC 6749 §4.4) from the development issuer, trusted here as a machines
# issuer for that one client, and creates the User whose binding key
# `ferroehr` the Basic user above is mapped by. The issuer publishes no port,
# so only the containers on the box obtain its tokens.
[[auth.issuer]]
issuer = "http://localhost:8180/sandbox"
kind = "machines"
audience = ["ferroehr-scim"]
token_types = ["JWT"]

# The URL clients reach the server at, which every SCIM location names.
[server]
public_base_url = "https://sandbox.ferroehr.eu"

[auth.scim]
[[auth.scim.client]]
issuer = "http://localhost:8180/sandbox"
client_id = "sandbox-scim"
scope = "ferroehr/scim"
binding_issuer = "urn:ferroehr:basic-user"

# Authentication only, no role gate — the one demo user deliberately reaches
# every enabled surface, the admin group included (#2965).
[authz.rbac]
enabled = false

# FerroTERM beside the CDR (#3304). The read-only /terminology/* routes are on so
# the viewer's terminology browser and code picker work; the terminology server
# is FerroTERM at its compose-network name, the only address it answers on, and
# every terminology the bundle does not carry goes to it. The sandbox keeps the
# shipped fail-open default (register AMB-172): a binding the server cannot
# resolve is accepted, a binding it resolves as a non-member is refused with
# 422.

[terminology.endpoint]
url = "http://ferroterm:8080/r4b"

# The pseudonym namespace of the clinical domain (#4242): EHR_STATUS.subject
# names a demo patient by the UUID FerroPIX minted for it there.
[privacy]
subject_namespaces = ["urn:oid:2.999.7.1"]

# FerroPIX beside the CDR as the IHE patient identity source, asked over PIXm
# (ITI-83) on the loopback of the development issuer's network namespace,
# which the CDR, FerroPIX and the issuer share (the compose file says why).
# The client id is the consumer FerroPIX's [[pseudonym_domain]] names, and
# system/Patient.rs the scope its PIXm Manager takes from a Consumer. The
# development issuer checks no client secret, so the one below is no credential.
[record]
subject_index = "pixm"

[pixm]
assigning_authority = "urn:oid:2.999.7.1"

[pixm.endpoint]
url = "http://localhost:8090/fhir"

[pixm.endpoint.credentials.oauth]
token_endpoint = "http://localhost:8180/sandbox/token"
client_id = "ferroehr"
client_secret = "sandbox"
scope = "system/Patient.rs"

# A cohort may name its patients by identifier in any domain, each resolved
# through FerroPIX: the visible path from a hospital identifier to an EHR.
# The small-cell floor stays at its default of 5.
[privacy.cohort]
subjects = true

# Any origin may read responses: development and the demo only.
[api.cors]
allow_origins = ["*"]
