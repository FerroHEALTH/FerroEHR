# FerroEHR behind FerroSMART, the FerroHEALTH family's SMART App Launch 2.x
# authorization server: an overlay of docker-compose.yml, run from a
# checkout with ONE upstream overlay beside it, which names the OpenID
# Connect provider FerroSMART logs people in at:
#
#   bash docker/ferrosmart/secrets.sh
#   docker compose -f docker-compose.yml -f docker-compose.ferrosmart.yml \
#     -f docker-compose.ferrosmart-keycloak.yml up -d --wait
#   # or, with ZITADEL upstream:
#   docker compose -f docker-compose.yml -f docker-compose.ferrosmart.yml \
#     -f docker-compose.ferrosmart-zitadel.yml up -d --wait
#
# FerroSMART issues every token FerroEHR reads under this overlay; the
# provider serves only the login (FerroSMART docs/architecture.md §13.21, A
# product behind FerroSMART). FerroEHR trusts it in the `[auth.issuer.ferrosmart]`
# table: the persons it issues tokens for bind to their PERSONs under their
# FerroSMART subject (the pairwise `sub`, §13.6 item 9), its patient/ grants
# reach the EHR their `ehrId` names, so a standalone launch with
# `launch/patient` through FerroSMART's picker reads the EHR it chose, and
# FerroSMART's registry is the one list of clients.
# FerroEHR starts before FerroSMART answers: it reads FerroSMART's metadata in
# the background and reports ready once it has.
#
# NETWORK. FerroSMART and the provider join the issuer's network namespace,
# as FerroEHR does, so every party reaches every other on `localhost`,
# exactly as the browser does through the published ports:
#   8080  FerroEHR        8280  FerroSMART      8380  Keycloak (upstream)
#   8480  ZITADEL         3300  ZITADEL's login (upstream)
# ferrohealth-smart and FerroSMART admit a plain http issuer on a loopback
# host alone (RFC 8414 §2 as they read it), so this is a local example: a
# deployment serves FerroSMART and its provider over https on their own names.
#
# SECRETS. docker/ferrosmart/secrets.sh makes them under ./secrets/ferrosmart
# (FERROSMART_SECRETS names another directory): FerroSMART's database
# password and URL, its token signing key, its Backend Services key, its
# assertion key at the provider, and the viewer's launch key with its client
# document.
#
# FerroSMART's configuration is docker/ferrosmart/ferrosmart.toml
# (FERROSMART_CONFIG_FILE names another). Its own documentation is
# https://github.com/FerroHEALTH/FerroSMART/blob/ferrosmart-v0.8.0/docs/architecture.md#13-ferrosmart-the-smart-authorization-server

services:
  identity-issuer:
    ports:
      - "${FERROEHR_BIND_HOST:-127.0.0.1}:${FERROSMART_PORT:-8280}:8280"
      # The viewer's port (`--profile viewer`), since the viewer joins this
      # namespace below.
      - "${FERROEHR_BIND_HOST:-127.0.0.1}:${FERROEHR_VIEWER_PORT:-3000}:3000"

  # FerroSMART's own store: every client, grant, launch and token record.
  ferrosmart-postgres:
    image: postgres:19.0@sha256:aaa10f7ba7328b4a221a6c3184d83eef885bd16bf1f6de864757863156b0a4d1
    environment:
      POSTGRES_DB: ferrosmart
      POSTGRES_USER: ferrosmart
      POSTGRES_PASSWORD_FILE: /run/secrets/ferrosmart_postgres_password
    secrets:
      - ferrosmart_postgres_password
    volumes:
      - ferrosmart-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ferrosmart", "-d", "ferrosmart"]
      interval: 5s
      timeout: 5s
      retries: 12
    # The entrypoint starts as root to own the data directory, then drops to
    # the postgres user, so it keeps the capabilities that hand-over needs.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ferrosmart:
    image: ${FERROSMART_IMAGE:-ghcr.io/ferrohealth/ferrosmart:0.8.0@sha256:f86d1422959100c70a464d297b7c559b934dab18becb5b3c566e5d3d61082088}
    network_mode: service:identity-issuer
    depends_on:
      ferrosmart-postgres:
        condition: service_healthy
    environment:
      FERROSMART_CONFIG: /etc/ferrosmart/ferrosmart.toml
      # The image sets 0.0.0.0:8080, FerroEHR's port in this namespace, in its
      # environment, which outranks the file.
      FERROSMART__SERVER__LISTEN: 0.0.0.0:8280
      FERROSMART__FERROSMART__RESOURCE__0__SUBJECT_NAMESPACE: ${FERROSMART_SUBJECT_NAMESPACE:-urn:oid:2.999.7.1}
      FERROSMART__TELEMETRY__FORMAT: ${FERROSMART_LOG_FORMAT:-pretty}
      FERROSMART__TELEMETRY__FILTER: ${FERROSMART_LOG_FILTER:-info}
    secrets:
      - ferrosmart_database_url
      - ferrosmart_signing_key
      - ferrosmart_backend_key
    volumes:
      - type: bind
        source: ${FERROSMART_CONFIG_FILE:-./docker/ferrosmart/ferrosmart.toml}
        target: /etc/ferrosmart/ferrosmart.toml
        read_only: true
    # Every piece of state lives in PostgreSQL and every secret is read once
    # at boot.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # The image's own check, `ferrosmart healthcheck` (healthy once it serves
    # and its database answers), asked every 5 seconds instead of 30.
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferrosmart", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Registers the clients in FerroSMART's database once it serves: the
  # documents under FERROSMART_CLIENTS_DIR (docker/ferrosmart/clients/) and
  # the viewer's, which carries its generated key (`ferrosmart client apply`,
  # FerroSMART docs/architecture.md §13.27). A client that exists is replaced.
  ferrosmart-clients:
    image: ${FERROSMART_IMAGE:-ghcr.io/ferrohealth/ferrosmart:0.8.0@sha256:f86d1422959100c70a464d297b7c559b934dab18becb5b3c566e5d3d61082088}
    network_mode: service:identity-issuer
    depends_on:
      ferrosmart:
        condition: service_healthy
    environment:
      FERROSMART_CONFIG: /etc/ferrosmart/ferrosmart.toml
      FERROSMART__TELEMETRY__FORMAT: ${FERROSMART_LOG_FORMAT:-pretty}
    command: [client, apply, /etc/ferrosmart/clients/example-app.json, /run/secrets/ferrosmart_viewer_client]
    secrets:
      - ferrosmart_database_url
      - ferrosmart_signing_key
      - ferrosmart_backend_key
      - ferrosmart_viewer_client
    volumes:
      - type: bind
        source: ${FERROSMART_CONFIG_FILE:-./docker/ferrosmart/ferrosmart.toml}
        target: /etc/ferrosmart/ferrosmart.toml
        read_only: true
      - type: bind
        source: ${FERROSMART_CLIENTS_DIR:-./docker/ferrosmart/clients}
        target: /etc/ferrosmart/clients
        read_only: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  ferroehr:
    environment: &ferrosmart-trust
      # FerroSMART is the issuer named `ferrosmart`, beside the quickstart's
      # `basic_users` and `quickstart` issuers.
      FERROEHR__AUTH__ISSUER__FERROSMART__ISSUER: http://localhost:8280
      # Its audience is the base the app asked for (RFC 8707 §2), the openEHR
      # base FerroEHR derives from its public URL below. A person binds to the PERSON whose SCIM loginIdentifier is their
      # FerroSMART subject.
      FERROEHR__AUTH__ISSUER__FERROSMART__PARTY__IDENTIFIER_ISSUER: urn:example:ferrosmart-login
      FERROEHR__AUTH__ISSUER__FERROSMART__PARTY__IDENTIFIER_TYPE: login
      # The discovery document describes FerroSMART, so an app that starts at
      # FerroEHR's base finds it; the quickstart's issuer beside it signs only
      # its clients' tokens, so FerroSMART is named.
      FERROEHR__AUTH__SMART__DISCOVERY: "true"
      FERROEHR__AUTH__DESCRIBED_ISSUER: ferrosmart
      FERROEHR__SERVER__PUBLIC_BASE_URL: http://localhost:8080

  # The viewer launches SMART apps from an EHR's page through FerroSMART's
  # EHR launch API (`[launch]`); it joins the namespace to reach
  # http://localhost:8280 as the issuer names it.
  ferroehr-viewer:
    network_mode: service:identity-issuer
    ports: !reset []
    depends_on:
      ferrosmart-clients:
        condition: service_completed_successfully
    environment:
      FERROEHR_VIEWER__CDR__BASE_URL: http://localhost:8080
      FERROEHR_VIEWER__SERVER__LISTEN: 0.0.0.0:3000
      FERROEHR_VIEWER__LAUNCH__ISSUER: http://localhost:8280
      FERROEHR_VIEWER__LAUNCH__CLIENT_ID: ferroehr-viewer
      FERROEHR_VIEWER__LAUNCH__PRIVATE_KEY_FILE: /run/secrets/ferrosmart_viewer_launch_key
      FERROEHR_VIEWER__LAUNCH__KID: ferroehr-viewer
      FERROEHR_VIEWER__LAUNCH__RESOURCE: http://localhost:8080/ferroehr/rest/openehr/v1
      FERROEHR_VIEWER__LAUNCH__APP__0__NAME: Example SMART app
      FERROEHR_VIEWER__LAUNCH__APP__0__CLIENT_ID: example-app
      FERROEHR_VIEWER__LAUNCH__APP__0__LAUNCH_URL: http://localhost:9000/launch
    secrets:
      - ferrosmart_viewer_launch_key

secrets:
  ferrosmart_postgres_password:
    file: ${FERROSMART_SECRETS:-./secrets/ferrosmart}/postgres_password
  ferrosmart_database_url:
    file: ${FERROSMART_SECRETS:-./secrets/ferrosmart}/database_url
  ferrosmart_signing_key:
    file: ${FERROSMART_SECRETS:-./secrets/ferrosmart}/signing_key.pem
  ferrosmart_backend_key:
    file: ${FERROSMART_SECRETS:-./secrets/ferrosmart}/backend_key.pem
  ferrosmart_viewer_launch_key:
    file: ${FERROSMART_SECRETS:-./secrets/ferrosmart}/viewer_launch_key.pem
  ferrosmart_viewer_client:
    file: ${FERROSMART_SECRETS:-./secrets/ferrosmart}/viewer_client.json

volumes:
  ferrosmart-pgdata:
