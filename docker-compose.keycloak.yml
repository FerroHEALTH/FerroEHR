# FerroEHR quickstart, OIDC variant: a STANDALONE overlay on docker-compose.yml
# (the same pattern as docker-compose.observability.yml). Download BOTH files
# into one directory and run:
#
#   docker compose -f docker-compose.yml -f docker-compose.keycloak.yml up
#
# It adds a Keycloak identity provider with a ready-made demo realm (inline
# below, no repo checkout needed), points the CDR's bearer validation at it and
# turns RBAC on. Basic auth from the base file keeps working; the server then
# advertises `Basic, Bearer`.
#
# The CDR accepts a token issuer only over https, or plain http on a loopback
# host (RFC 8414 §3, §6.2), so Keycloak serves its issuer over TLS at
# https://keycloak.localhost:8443, a name the containers resolve through a
# network alias and a browser resolves to the loopback address with no hosts
# entry (RFC 6761 §6.3). The one-shot `keycloak-tls` service generates a
# development CA and a server certificate for that name into the
# `keycloak-tls` volume on the first `up`, and the CDR and the viewer trust
# that CA. The CA's private key is discarded once the certificate is signed.
# `down -v` deletes the volume, and the next `up` generates a new CA.
#
# With `--profile viewer`, the viewer at http://localhost:3000 signs in through
# the realm (any user below). The browser does not trust the development CA,
# so it warns once on the Keycloak page; accept it there, or trust the CA,
# which `docker compose cp keycloak:/opt/keycloak/conf/tls/ca/ca.crt .` copies
# out. A browser that does not resolve `*.localhost` needs
# `127.0.0.1 keycloak.localhost` in its hosts file.
#
# Keycloak also answers plain HTTP on port 8081 for the token call below; the
# tokens it mints there still name the https issuer, so the CDR accepts them.
# Get a bearer token and call the API:
#
#   TOKEN=$(curl -s -d client_id=ferroehr-viewer -d client_secret=ferroehr-viewer-quickstart-secret \
#     -d username=ferroehr -d password=ferroehr -d grant_type=password \
#     http://localhost:8081/auth/realms/ferroehr/protocol/openid-connect/token \
#     | jq -r .access_token)
#   curl -H "Authorization: Bearer $TOKEN" -X POST -i \
#     http://localhost:8080/ferroehr/rest/openehr/v1/ehr
#
# A service with no user behind it takes the client-credentials grant
# (RFC 6749 §4.4) with its own client, `ferroehr-service`, whose service account
# holds USER and whose tokens carry the `system/` scopes:
#
#   TOKEN=$(curl -s -d client_id=ferroehr-service -d client_secret=ferroehr-service-quickstart-secret \
#     -d grant_type=client_credentials \
#     http://localhost:8081/auth/realms/ferroehr/protocol/openid-connect/token \
#     | jq -r .access_token)
#
# Every route checks SMART on openEHR scopes, so the realm puts them in every
# token: `user/composition-*.cruds`, `user/template-*.cruds` and
# `user/aql-*.cruds` (every resource family) for a user, their `system/` twins
# for the service, and `__ferroehr.platform`, the product scope the ADMIN and
# DEMOGRAPHIC APIs need. The roles then decide.
#
# FOUR demo identities, because role separation cannot be shown with one user.
# RBAC is ENABLED in this overlay (the base quickstart leaves it off), so these
# roles decide real outcomes:
#
#   ferroehr  / ferroehr    ADMIN + USER   — the clinical API and the admin surface
#   clinician / clinician   USER           — the clinical API; admin refused 403
#   auditor   / auditor     USER+READONLY  — reads; every write refused 403,
#                                            because READONLY overrides a grant
#   nobody    / nobody      (no roles)     — authenticates, then 403 everywhere
#
# Swap `username=`/`password=` in the token call above to try each one. The
# refusals are the point: a 401 means the credential was not accepted, a 403
# means it was and the caller still may not do this.
#
# QUICKSTART DEFAULTS, do NOT use in production: demo realm, demo secret,
# demo password, a development CA, Keycloak in start-dev mode. For a real
# deployment configure your own https issuer via FERROEHR__AUTH__ISSUER__0__ISSUER
# and its siblings (or an [[auth.issuer]] table) and remove this overlay.
#
# The repo's dev/e2e lanes use their OWN Keycloak (docker-compose.dev.yml,
# `keycloak` profile) with the full exported realm from docker/keycloak/import;
# this overlay's minimal demo realm is deliberately independent of it.

services:
  ferroehr:
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      # The env layer beats the mounted config file, so these ADD bearer trust
      # on top of the base quickstart posture without replacing it. The issuer
      # is the canonical KC_HOSTNAME below: token `iss` claims match it no
      # matter which host the token was requested from.
      # The realm is the third [[auth.issuer]] table (index 2): the first is
      # the issuer the quickstart's Basic user binds under, the second the
      # machines issuer of its SCIM provisioning client.
      FERROEHR__AUTH__ISSUER__2__ISSUER: ${KEYCLOAK_HOSTNAME:-https://keycloak.localhost:8443/auth}/realms/ferroehr
      FERROEHR__AUTH__ISSUER__2__KIND: persons
      # The keycloak preset: `typ: JWT` tokens with `azp` naming the client.
      FERROEHR__AUTH__ISSUER__2__PROFILE: keycloak
      # Required: the audience this CDR answers to (RFC 7519 §4.1.3), which the
      # realm's two clients put in every access token.
      FERROEHR__AUTH__ISSUER__2__AUDIENCE: ferroehr
      # A person signs in through the viewer; the service client's tokens carry
      # its `client_id` session note, which marks them app-only.
      FERROEHR__AUTH__ISSUER__2__FIRST_PARTY_CLIENTS: ferroehr-viewer
      FERROEHR__AUTH__ISSUER__2__APP_ONLY__0__CLAIM: client_id
      FERROEHR__AUTH__ISSUER__2__APP_ONLY__0__VALUE: ferroehr-service
      # Keycloak writes the realm roles under the nested `realm_access.roles`,
      # beside the RFC 9068 claims the shared default reads.
      FERROEHR__AUTH__ISSUER__2__ROLE_CLAIMS: roles,groups,entitlements,realm_access.roles
      # The realm's logins bind under their own identifier issuer, and its
      # role claims may grant the administrator role.
      FERROEHR__AUTH__PARTY__1__ISSUER: ${KEYCLOAK_HOSTNAME:-https://keycloak.localhost:8443/auth}/realms/ferroehr
      FERROEHR__AUTH__PARTY__1__IDENTIFIER_ISSUER: urn:ferroehr:keycloak-quickstart-login
      FERROEHR__AUTH__PARTY__1__IDENTIFIER_TYPE: login
      # The realm's group claim, read under the identifier issuer the Groups
      # its SCIM client provisions are named under.
      FERROEHR__AUTH__PARTY__1__GROUP_CLAIM: groups
      FERROEHR__AUTH__PARTY__1__GROUP_IDENTIFIER_ISSUER: urn:ferroehr:keycloak-quickstart-groups
      FERROEHR__AUTHZ__RBAC__ROLE_ISSUERS: ${KEYCLOAK_HOSTNAME:-https://keycloak.localhost:8443/auth}/realms/ferroehr
      # A person is refused until a demographic party carries their login, so
      # the realm's four users are provisioned through SCIM under that
      # identifier issuer by the ferroehr-provision-keycloak one-shot below,
      # as a second client of the development issuer, which the
      # ferroehr-grant-keycloak one-shot grants scim_provision in the CDR.
      # The development CA, trusted for the issuer's metadata and key set
      # beside the platform roots (`[auth.tls] trust_roots_file`) on every platform. It
      # needs a 5.5.0 or later image: 5.4.2 refuses the key.
      FERROEHR__AUTH__TLS__TRUST_ROOTS_FILE: /run/ferroehr-dev-tls/ca/ca.crt
      # RBAC ON, because an identity provider whose roles decide nothing is a
      # login screen, not authorization. The base quickstart leaves it off so a
      # first run needs no role setup; this overlay exists to show real
      # identities, so the roles have to be load-bearing here. Otherwise every
      # authenticated caller may use every surface and the four users below are
      # decoration.
      FERROEHR__AUTHZ__RBAC__ENABLED: "true"
      # The realm's service client's system/aql-* grant counts only for a
      # client the CDR grants query_system_wide (SMART on openEHR §Resource
      # Scopes), and it creates EHRs only under a commit_composition grant:
      # ferroehr-provision-keycloak writes its AGENT and ROLE, and the ceiling
      # admits both operations beside the SCIM clients' scim_provision.
      FERROEHR__AUTHZ__GRANTS__ALLOWED: commit_composition,query_system_wide,scim_provision
    volumes:
      - keycloak-tls:/run/ferroehr-dev-tls:ro

  # The viewer (`--profile viewer`) signs in through the demo realm with the
  # authorization-code flow and PKCE: the browser and the viewer reach the
  # same issuer URL, `https://keycloak.localhost:8443`, and the viewer trusts
  # the development CA for it (`[oidc.tls] trust_roots_file`, 5.6.0 or
  # later). The secret is the demo realm's, never a production credential.
  ferroehr-viewer:
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      FERROEHR_VIEWER__AUTH__OIDC_ENABLED: "true"
      FERROEHR_VIEWER__OIDC__ISSUER: ${KEYCLOAK_HOSTNAME:-https://keycloak.localhost:8443/auth}/realms/ferroehr
      FERROEHR_VIEWER__OIDC__CLIENT_ID: ferroehr-viewer
      FERROEHR_VIEWER__OIDC__CLIENT_SECRET: ferroehr-viewer-quickstart-secret
      FERROEHR_VIEWER__AUTH__PUBLIC_BASE_URL: http://localhost:${FERROEHR_VIEWER_PORT:-3000}
      FERROEHR_VIEWER__OIDC__TLS__TRUST_ROOTS_FILE: /run/ferroehr-dev-tls/ca/ca.crt
    volumes:
      - keycloak-tls:/run/ferroehr-dev-tls:ro

  # Grants the `quickstart-scim-keycloak` client scim_provision in the CDR
  # for the realm's identifier issuer, on the operator's authority, as the
  # base file's ferroehr-grant does for the Basic user's client.
  ferroehr-grant-keycloak:
    image: ${FERROEHR_IMAGE:-ghcr.io/ferrohealth/ferroehr:main}
    network_mode: service:identity-issuer
    depends_on:
      ferroehr:
        condition: service_healthy
    environment:
      FERROEHR_CONFIG: /etc/ferroehr/ferroehr.toml
      FERROEHR__DATABASE__URL: postgres://${PG_INIT_USER:-ferroehr}:${PG_INIT_PASSWORD:-ferroehr}@ferroehr-postgres:5432/${PG_INIT_DB:-ferroehr}
      FERROEHR__USAGE_REPORT__ENABLED: "false"
    configs:
      - source: ferroehr-config${FERROEHR_EHR_INDEX:+-${FERROEHR_EHR_INDEX}}
        target: /etc/ferroehr/ferroehr.toml
    command:
      - party-binding
      - grant
      - --issuer
      - http://localhost:8180/quickstart
      - --client-id
      - quickstart-scim-keycloak
      - --operation
      - scim_provision
      - --element
      - binding_issuer=urn:ferroehr:keycloak-quickstart-login
      - --element
      - token_scope=ferroehr/scim
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # Provisions the realm's four users as professional PERSONs through
  # FerroEHR's SCIM endpoint (RFC 7644 §3.3), as the base file's
  # ferroehr-provision does for the Basic user: each User's loginIdentifier is
  # the fixed `id` the realm import gives that user, which Keycloak puts in
  # `sub`. The service account is a system client and binds to no party:
  # the quickstart administrator writes its AGENT, which carries its
  # `client_id`, and a ROLE granting `query_system_wide`, so its system/aql-*
  # grant counts, and `commit_composition` with the origin relay and no
  # template, so it creates EHRs and commits no COMPOSITION, for the provider
  # the deployment acts for, through the Demographic API. A User or an AGENT that
  # exists already (409) is kept, and the one-shot then stays up and reports
  # healthy, so `up --wait` returns once every login is bound and the grant is
  # written.
  ferroehr-provision-keycloak:
    image: ${FERROEHR_CURL_IMAGE:-curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777}
    network_mode: service:identity-issuer
    depends_on:
      ferroehr:
        condition: service_healthy
      ferroehr-grant-keycloak:
        condition: service_completed_successfully
      ferroehr-provision:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >-
        set -e;
        token=$$(curl -fsS -d grant_type=client_credentials -d client_id=quickstart-scim-keycloak
        -d client_secret=quickstart -d scope=ferroehr/scim
        http://localhost:8180/quickstart/token | sed -n 's/.*"access_token" *: *"\([^"]*\)".*/\1/p');
        for user in
        'ferroehr dd7f371e-4810-4857-a5aa-2a54cf4aa7cb Ferro EHR'
        'clinician 1d3ed91a-4a4a-467b-a2d6-2be791406456 Clara Clinician'
        'auditor e93246e4-4904-4d1b-b29b-4909ed40dc8b Ada Auditor'
        'nobody 4a1a3a1d-66c5-4860-bd29-4822c6ec9918 Noa Nobody'; do
        set -- $$user;
        status=$$(curl -sS -o /tmp/answer -w '%{http_code}' -X POST
        -H "Authorization: Bearer $$token" -H 'Content-Type: application/scim+json'
        --data "{\"schemas\":[\"urn:ietf:params:scim:schemas:core:2.0:User\",\"urn:ietf:params:scim:schemas:extension:ferrohealth:2.0:User\"],\"userName\":\"keycloak-$$1\",\"name\":{\"formatted\":\"$$3 $$4\"},\"urn:ietf:params:scim:schemas:extension:ferrohealth:2.0:User\":{\"loginIdentifier\":\"$$2\"}}"
        http://localhost:8080/scim/v2/Users);
        case $$status in 201|409) ;; *) echo "provisioning $$1 answered $$status" >&2; cat /tmp/answer >&2; exit 1;; esac;
        done;
        demographic=http://localhost:8080/ferroehr/rest/openehr/v1/demographic;
        printf '%s' '{"_type":"AGENT","archetype_node_id":"openEHR-DEMOGRAPHIC-AGENT.quickstart_service.v1","archetype_details":{"_type":"ARCHETYPED","archetype_id":{"_type":"ARCHETYPE_ID","value":"openEHR-DEMOGRAPHIC-AGENT.quickstart_service.v1"},"rm_version":"1.1.0"},"name":{"_type":"DV_TEXT","value":"Quickstart service"},"details":{"_type":"ITEM_TREE","archetype_node_id":"at0010","name":{"_type":"DV_TEXT","value":"details"},"items":[{"_type":"ELEMENT","archetype_node_id":"at0011","name":{"_type":"DV_TEXT","value":"client"},"value":{"_type":"DV_IDENTIFIER","issuer":"${KEYCLOAK_HOSTNAME:-https://keycloak.localhost:8443/auth}/realms/ferroehr","id":"ferroehr-service","type":"client_id"}}]},"identities":[{"_type":"PARTY_IDENTITY","archetype_node_id":"at0001","name":{"_type":"DV_TEXT","value":"name"},"details":{"_type":"ITEM_TREE","archetype_node_id":"at0002","name":{"_type":"DV_TEXT","value":"details"},"items":[{"_type":"ELEMENT","archetype_node_id":"at0003","name":{"_type":"DV_TEXT","value":"name"},"value":{"_type":"DV_TEXT","value":"ferroehr-service"}}]}}]}' > /tmp/agent.json;
        status=$$(curl -sS -o /tmp/answer -D /tmp/headers -w '%{http_code}' -X POST -u ferroehr:ferroehr
        -H 'Content-Type: application/json' --data @/tmp/agent.json $$demographic/agent);
        case $$status in
        201)
        agent=$$(sed -n 's|^[Ee][Tt][Aa][Gg]:.*"\([0-9a-f-]*\)::.*|\1|p' /tmp/headers);
        printf '%s%s%s' '{"_type":"ROLE","archetype_node_id":"openEHR-DEMOGRAPHIC-ROLE.quickstart_query.v1","archetype_details":{"_type":"ARCHETYPED","archetype_id":{"_type":"ARCHETYPE_ID","value":"openEHR-DEMOGRAPHIC-ROLE.quickstart_query.v1"},"rm_version":"1.1.0"},"name":{"_type":"DV_TEXT","value":"System-wide query"},"identities":[{"_type":"PARTY_IDENTITY","archetype_node_id":"at0001","name":{"_type":"DV_TEXT","value":"name"},"details":{"_type":"ITEM_TREE","archetype_node_id":"at0002","name":{"_type":"DV_TEXT","value":"details"},"items":[{"_type":"ELEMENT","archetype_node_id":"at0003","name":{"_type":"DV_TEXT","value":"name"},"value":{"_type":"DV_TEXT","value":"system-wide query"}}]}}],"performer":{"_type":"PARTY_REF","namespace":"demographic","type":"AGENT","id":{"_type":"HIER_OBJECT_ID","value":"' "$$agent" '"}},"capabilities":[{"_type":"CAPABILITY","archetype_node_id":"at0020","name":{"_type":"DV_TEXT","value":"grant"},"credentials":{"_type":"ITEM_TREE","archetype_node_id":"at0021","name":{"_type":"DV_TEXT","value":"terms"},"items":[{"_type":"ELEMENT","archetype_node_id":"at0022","name":{"_type":"DV_TEXT","value":"operation"},"value":{"_type":"DV_CODED_TEXT","value":"query_system_wide","defining_code":{"_type":"CODE_PHRASE","terminology_id":{"_type":"TERMINOLOGY_ID","value":"ferroehr-operations"},"code_string":"query_system_wide"}}}]}},{"_type":"CAPABILITY","archetype_node_id":"at0020","name":{"_type":"DV_TEXT","value":"grant"},"credentials":{"_type":"ITEM_TREE","archetype_node_id":"at0021","name":{"_type":"DV_TEXT","value":"terms"},"items":[{"_type":"ELEMENT","archetype_node_id":"at0022","name":{"_type":"DV_TEXT","value":"operation"},"value":{"_type":"DV_CODED_TEXT","value":"commit_composition","defining_code":{"_type":"CODE_PHRASE","terminology_id":{"_type":"TERMINOLOGY_ID","value":"ferroehr-operations"},"code_string":"commit_composition"}}},{"_type":"ELEMENT","archetype_node_id":"at0023","name":{"_type":"DV_CODED_TEXT","value":"origin","defining_code":{"_type":"CODE_PHRASE","terminology_id":{"_type":"TERMINOLOGY_ID","value":"ferroehr-operations"},"code_string":"origin"}},"value":{"_type":"DV_TEXT","value":"relay"}}]}}]}' > /tmp/role.json;
        status=$$(curl -sS -o /tmp/answer -w '%{http_code}' -X POST -u ferroehr:ferroehr
        -H 'Content-Type: application/json' --data @/tmp/role.json $$demographic/role);
        case $$status in 201) ;; *) echo "granting ferroehr-service answered $$status" >&2; cat /tmp/answer >&2; exit 1;; esac;;
        409) ;;
        *) echo "writing the ferroehr-service AGENT answered $$status" >&2; cat /tmp/answer >&2; exit 1;;
        esac;
        touch /tmp/provisioned; echo 'the realm users are provisioned and the service client is granted'; exec sleep infinity
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/provisioned"]
      interval: 2s
      timeout: 2s
      retries: 30
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # Generates the development CA and Keycloak's certificate once, into the
  # `keycloak-tls` volume, with the keytool of the Keycloak image itself. It
  # runs as root only because a fresh named volume is root-owned; it holds no
  # capability and exits when done.
  keycloak-tls:
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    image: quay.io/keycloak/keycloak:26.8.2@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
    user: "0"
    entrypoint: ["bash", "/usr/local/bin/keycloak-tls.sh"]
    configs:
      - source: keycloak-tls-script
        target: /usr/local/bin/keycloak-tls.sh
    volumes:
      - keycloak-tls:/tls
    restart: "no"

  keycloak:
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Digest-pinned quay.io/keycloak/keycloak:26.8.2 (current release), resolved
    # 2026-11-09 (docs.docker.com/build/building/best-practices).
    image: quay.io/keycloak/keycloak:26.8.2@sha256:723b1d6e254c0fc96d5cffec860c7e0744d6a3277822b865bb538cf891575e41
    command: ["start-dev", "--import-realm"]
    depends_on:
      keycloak-tls:
        condition: service_completed_successfully
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_RELATIVE_PATH: /auth
      # Plain HTTP for the token call in the header and the healthcheck. In-network
      # port == default host port (8081), so the same port works from the host.
      KC_HTTP_PORT: 8081
      # The issuer the CDR reads, over TLS with the certificate `keycloak-tls`
      # generated.
      KC_HTTPS_PORT: 8443
      KC_HTTPS_KEY_STORE_FILE: /opt/keycloak/conf/tls/keycloak.p12
      KC_HTTPS_KEY_STORE_PASSWORD: ferroehr-dev-tls
      # ONE canonical issuer regardless of which host the caller used: token
      # `iss` claims stay stable, so the CDR validates bearer tokens against
      # the single configured issuer above.
      # NOTE: a URL-form KC_HOSTNAME replaces the whole base — Keycloak does
      # NOT append KC_HTTP_RELATIVE_PATH to it, so /auth must be included.
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-https://keycloak.localhost:8443/auth}
    # `keycloak.localhost` is the issuer's host on both sides: Docker's DNS
    # resolves the alias to this container on the compose network, and a
    # browser resolves every `*.localhost` name to the loopback address (RFC
    # 6761 §6.3), where the published port 8443 lands here. The in-network
    # and host TLS ports must therefore stay equal.
    networks:
      default:
        aliases:
          - keycloak.localhost
    configs:
      - source: keycloak-realm
        target: /opt/keycloak/data/import/ferroehr-realm.json
    volumes:
      - keycloak-tls:/opt/keycloak/conf/tls:ro
    ports:
      - "${FERROEHR_BIND_HOST:-127.0.0.1}:${KEYCLOAK_PORT:-8081}:8081"
      - "${FERROEHR_BIND_HOST:-127.0.0.1}:${KEYCLOAK_TLS_PORT:-8443}:8443"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    # The Keycloak image ships bash (no curl/wget), so probe the imported
    # realm's OIDC discovery doc over bash's /dev/tcp — this makes
    # `depends_on: {keycloak: {condition: service_healthy}}` a valid gate
    # (docs.docker.com/compose/how-tos/startup-order). Readiness here means
    # the realm is imported AND the HTTP listener answers 200.
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/8081; printf 'GET /auth/realms/ferroehr/.well-known/openid-configuration HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '^HTTP/1.1 200' <&3"
      interval: 10s
      timeout: 5s
      # A COLD start is slow and the budget must cover it, because `ferroehr`
      # gates on this probe: Quarkus augmentation plus the dev-database schema
      # import was measured at 9m31s on a busy machine, which overran the
      # previous 30-retry (~5m20s) budget and made `up` fail with "dependency
      # failed to start" — the CDR then never starts at all.
      retries: 90
      start_period: 20s

volumes:
  keycloak-tls:

configs:
  # The development TLS material, generated once per volume: an EC P-256 CA,
  # and a certificate for `keycloak` (SAN keycloak, localhost, 127.0.0.1)
  # signed by it. Keycloak reads the PKCS #12 key store; the CDR reads only
  # the CA certificate under ca/. The CA key never leaves the work directory.
  keycloak-tls-script:
    content: |
      set -eu
      tls=/tls
      if [ -s "$$tls/keycloak.p12" ] && [ -s "$$tls/ca/ca.crt" ] \
        && keytool -list -v -keystore "$$tls/keycloak.p12" -storepass ferroehr-dev-tls | grep -q "DNSName: keycloak.localhost"; then
        echo "development TLS material present"
        exit 0
      fi
      work="$$(mktemp -d)"
      pass=ferroehr-dev-tls
      keytool -genkeypair -alias ca -keyalg EC -groupname secp256r1 -sigalg SHA256withECDSA \
        -dname "CN=FerroEHR development CA" -ext bc:c=ca:true,pathlen:0 -ext ku:c=keyCertSign,cRLSign \
        -validity 825 -storetype PKCS12 -keystore "$$work/ca.p12" -storepass "$$pass"
      keytool -exportcert -rfc -alias ca -keystore "$$work/ca.p12" -storepass "$$pass" -file "$$work/ca.crt"
      keytool -genkeypair -alias keycloak -keyalg EC -groupname secp256r1 -sigalg SHA256withECDSA \
        -dname "CN=keycloak" -validity 825 -storetype PKCS12 -keystore "$$work/keycloak.p12" -storepass "$$pass"
      keytool -certreq -alias keycloak -keystore "$$work/keycloak.p12" -storepass "$$pass" -file "$$work/keycloak.csr"
      keytool -gencert -alias ca -keystore "$$work/ca.p12" -storepass "$$pass" -infile "$$work/keycloak.csr" \
        -outfile "$$work/keycloak.crt" -rfc -validity 825 -sigalg SHA256withECDSA \
        -ext san=dns:keycloak,dns:keycloak.localhost,dns:localhost,ip:127.0.0.1 -ext ku:c=digitalSignature -ext eku=serverAuth
      keytool -importcert -noprompt -alias ca -file "$$work/ca.crt" -keystore "$$work/keycloak.p12" -storepass "$$pass"
      keytool -importcert -noprompt -alias keycloak -file "$$work/keycloak.crt" -keystore "$$work/keycloak.p12" -storepass "$$pass"
      keytool -delete -alias ca -keystore "$$work/keycloak.p12" -storepass "$$pass"
      mkdir -p "$$tls/ca"
      cp "$$work/keycloak.p12" "$$tls/keycloak.p12"
      cp "$$work/ca.crt" "$$tls/ca/ca.crt"
      chmod 0755 "$$tls" "$$tls/ca"
      chmod 0644 "$$tls/keycloak.p12" "$$tls/ca/ca.crt"
      rm -r "$$work"
      echo "development TLS material written"

  # A MINIMAL demo realm, inline so the downloaded overlay is self-sufficient
  # (docs.docker.com/reference/compose-file/configs — the `content` attribute).
  # Two confidential clients and four users. `ferroehr-viewer`
  # (ferroehr-viewer-quickstart-secret) is the viewer's: the authorization-code
  # flow bound to PKCE S256 and to the viewer's origin on port 3000, plus the
  # password grant for curl-friendly token fetching. `ferroehr-service`
  # (ferroehr-service-quickstart-secret) has only the client-credentials grant,
  # a service account holding USER, the `system/` scopes and a `client_id`
  # claim, which its AGENT's `client_id` identifier matches. A realm that declares
  # `clientScopes` gets none of Keycloak's built-in ones, so the two the CDR
  # reads are declared as Keycloak defines them: `basic` (the `sub` claim) and
  # `roles` (the realm roles in `realm_access.roles`, the CDR's default role
  # claim). The SMART scopes are default client scopes, so every token carries
  # them in `scope`.
  # Each client's `oidc-audience-mapper` is LOAD-BEARING, not decoration: the
  # CDR sets FERROEHR__AUTH__ISSUER__2__AUDIENCE=ferroehr above, and Keycloak puts
  # `ferroehr` into `aud` only because the mapper names it. Without it every
  # bearer call is refused 401 (RFC 7519 §4.1.3 audience validation).
  keycloak-realm:
    content: |
      {
        "realm": "ferroehr",
        "enabled": true,
        "displayName": "FerroEHR quickstart",
        "sslRequired": "none",
        "defaultSignatureAlgorithm": "RS256",
        "roles": {
          "realm": [
            {
              "name": "ADMIN",
              "description": "FerroEHR admin-surface role"
            },
            {
              "name": "USER",
              "description": "FerroEHR clinical-API role"
            },
            {
              "name": "READONLY",
              "description": "FerroEHR read-only role, which overrides any grant"
            }
          ]
        },
        "clientScopes": [
          {
            "name": "basic",
            "description": "OpenID Connect scope for add all basic claims to the token",
            "protocol": "openid-connect",
            "attributes": {
              "include.in.token.scope": "false",
              "display.on.consent.screen": "false"
            },
            "protocolMappers": [
              {
                "name": "auth_time",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usersessionmodel-note-mapper",
                "consentRequired": false,
                "config": {
                  "user.session.note": "AUTH_TIME",
                  "id.token.claim": "true",
                  "introspection.token.claim": "true",
                  "access.token.claim": "true",
                  "claim.name": "auth_time",
                  "jsonType.label": "long"
                }
              },
              {
                "name": "sub",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-sub-mapper",
                "consentRequired": false,
                "config": {
                  "introspection.token.claim": "true",
                  "access.token.claim": "true"
                }
              }
            ]
          },
          {
            "name": "roles",
            "description": "OpenID Connect scope for add user roles to the access token",
            "protocol": "openid-connect",
            "attributes": {
              "include.in.token.scope": "false",
              "consent.screen.text": "$${rolesScopeConsentText}",
              "display.on.consent.screen": "true"
            },
            "protocolMappers": [
              {
                "name": "realm roles",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-realm-role-mapper",
                "consentRequired": false,
                "config": {
                  "user.attribute": "foo",
                  "introspection.token.claim": "true",
                  "access.token.claim": "true",
                  "claim.name": "realm_access.roles",
                  "jsonType.label": "String",
                  "multivalued": "true"
                }
              },
              {
                "name": "client roles",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usermodel-client-role-mapper",
                "consentRequired": false,
                "config": {
                  "user.attribute": "foo",
                  "introspection.token.claim": "true",
                  "access.token.claim": "true",
                  "claim.name": "resource_access.$${client_id}.roles",
                  "jsonType.label": "String",
                  "multivalued": "true"
                }
              },
              {
                "name": "audience resolve",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-audience-resolve-mapper",
                "consentRequired": false,
                "config": {
                  "introspection.token.claim": "true",
                  "access.token.claim": "true"
                }
              }
            ]
          },
          {
            "name": "user/composition-*.cruds",
            "description": "SMART on openEHR scope",
            "protocol": "openid-connect",
            "attributes": {
              "include.in.token.scope": "true",
              "display.on.consent.screen": "false"
            }
          },
          {
            "name": "user/template-*.cruds",
            "description": "SMART on openEHR scope",
            "protocol": "openid-connect",
            "attributes": {
              "include.in.token.scope": "true",
              "display.on.consent.screen": "false"
            }
          },
          {
            "name": "user/aql-*.cruds",
            "description": "SMART on openEHR scope",
            "protocol": "openid-connect",
            "attributes": {
              "include.in.token.scope": "true",
              "display.on.consent.screen": "false"
            }
          },
          {
            "name": "system/composition-*.cruds",
            "description": "SMART on openEHR scope",
            "protocol": "openid-connect",
            "attributes": {
              "include.in.token.scope": "true",
              "display.on.consent.screen": "false"
            }
          },
          {
            "name": "system/template-*.cruds",
            "description": "SMART on openEHR scope",
            "protocol": "openid-connect",
            "attributes": {
              "include.in.token.scope": "true",
              "display.on.consent.screen": "false"
            }
          },
          {
            "name": "system/aql-*.cruds",
            "description": "SMART on openEHR scope",
            "protocol": "openid-connect",
            "attributes": {
              "include.in.token.scope": "true",
              "display.on.consent.screen": "false"
            }
          },
          {
            "name": "__ferroehr.platform",
            "description": "FerroEHR product scope",
            "protocol": "openid-connect",
            "attributes": {
              "include.in.token.scope": "true",
              "display.on.consent.screen": "false"
            }
          }
        ],
        "defaultDefaultClientScopes": [
          "basic",
          "roles"
        ],
        "users": [
          {
            "id": "dd7f371e-4810-4857-a5aa-2a54cf4aa7cb",
            "username": "ferroehr",
            "enabled": true,
            "email": "ferroehr@example.test",
            "emailVerified": true,
            "firstName": "Ferro",
            "lastName": "EHR",
            "credentials": [
              {
                "type": "password",
                "value": "ferroehr",
                "temporary": false
              }
            ],
            "realmRoles": [
              "ADMIN",
              "USER"
            ]
          },
          {
            "id": "1d3ed91a-4a4a-467b-a2d6-2be791406456",
            "username": "clinician",
            "enabled": true,
            "email": "clinician@example.test",
            "emailVerified": true,
            "firstName": "Clara",
            "lastName": "Clinician",
            "credentials": [
              {
                "type": "password",
                "value": "clinician",
                "temporary": false
              }
            ],
            "realmRoles": [
              "USER"
            ]
          },
          {
            "id": "e93246e4-4904-4d1b-b29b-4909ed40dc8b",
            "username": "auditor",
            "enabled": true,
            "email": "auditor@example.test",
            "emailVerified": true,
            "firstName": "Ada",
            "lastName": "Auditor",
            "credentials": [
              {
                "type": "password",
                "value": "auditor",
                "temporary": false
              }
            ],
            "realmRoles": [
              "USER",
              "READONLY"
            ]
          },
          {
            "id": "4a1a3a1d-66c5-4860-bd29-4822c6ec9918",
            "username": "nobody",
            "enabled": true,
            "email": "nobody@example.test",
            "emailVerified": true,
            "firstName": "Noa",
            "lastName": "Nobody",
            "credentials": [
              {
                "type": "password",
                "value": "nobody",
                "temporary": false
              }
            ],
            "realmRoles": []
          },
          {
            "username": "service-account-ferroehr-service",
            "enabled": true,
            "serviceAccountClientId": "ferroehr-service",
            "realmRoles": [
              "USER"
            ]
          }
        ],
        "clients": [
          {
            "clientId": "ferroehr-viewer",
            "name": "FerroEHR viewer",
            "enabled": true,
            "protocol": "openid-connect",
            "publicClient": false,
            "secret": "ferroehr-viewer-quickstart-secret",
            "standardFlowEnabled": true,
            "directAccessGrantsEnabled": true,
            "serviceAccountsEnabled": false,
            "redirectUris": [
              "http://localhost:3000/*",
              "http://127.0.0.1:3000/*"
            ],
            "webOrigins": [
              "http://localhost:3000",
              "http://127.0.0.1:3000"
            ],
            "attributes": {
              "pkce.code.challenge.method": "S256"
            },
            "protocolMappers": [
              {
                "name": "ferroehr-audience",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-audience-mapper",
                "config": {
                  "included.custom.audience": "ferroehr",
                  "access.token.claim": "true",
                  "id.token.claim": "false"
                }
              }
            ],
            "defaultClientScopes": [
              "basic",
              "roles",
              "user/composition-*.cruds",
              "user/template-*.cruds",
              "user/aql-*.cruds",
              "__ferroehr.platform"
            ]
          },
          {
            "clientId": "ferroehr-service",
            "name": "FerroEHR service",
            "enabled": true,
            "protocol": "openid-connect",
            "publicClient": false,
            "secret": "ferroehr-service-quickstart-secret",
            "standardFlowEnabled": false,
            "directAccessGrantsEnabled": false,
            "serviceAccountsEnabled": true,
            "protocolMappers": [
              {
                "name": "ferroehr-audience",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-audience-mapper",
                "config": {
                  "included.custom.audience": "ferroehr",
                  "access.token.claim": "true",
                  "id.token.claim": "false"
                }
              },
              {
                "name": "client_id",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-usersessionmodel-note-mapper",
                "config": {
                  "user.session.note": "client_id",
