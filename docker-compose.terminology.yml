# FerroTERM terminology overlay — a STANDALONE companion to docker-compose.yml
# (download both, no repo checkout):
#
#   docker compose -f docker-compose.yml -f docker-compose.terminology.yml up
#   curl 'http://localhost:8090/r4b/metadata?mode=terminology'
#
# It starts FerroTERM (https://github.com/FerroHEALTH/FerroTERM, the Ferro
# family's FHIR terminology server: R4 /r4, R4B /r4b, R5 /r5, no JVM, no
# database) beside the CDR and switches the CDR's external terminology on, so
# archetype value-set bindings resolve against it at commit, AQL TERMINOLOGY()
# expands through it, and the CDR's /terminology/* routes answer from it.
# An overlay rather than a profile, for the same reason as the Keycloak and
# observability overlays: enabling it must MUTATE the ferroehr service's
# environment, which a profile cannot express
# (docs.docker.com/compose/how-tos/multiple-compose-files).
#
# Content. Out of the box FerroTERM serves the licence-free shaped seed this
# repository ships (two code systems and two value sets under the reserved
# example.test domain, the same content the conformance lane binds to),
# mounted read-only straight out of the ferroehr image. No licensed terminology
# is distributed with FerroEHR or FerroTERM. To serve a real release you hold a
# licence for (SNOMED CT, LOINC, ICD, ...), build its index once:
#
#   FERROTERM_RF2=/path/to/SnomedCT_Release.zip \
#     docker compose -f docker-compose.yml -f docker-compose.terminology.yml \
#     --profile terminology-build run --rm ferroterm-build
#   FERROTERM_INDEX=/data/index \
#     docker compose -f docker-compose.yml -f docker-compose.terminology.yml up
#
# The index lands in the named volume below and the second command tells the
# server to open it (unset, the server serves the shaped seed alone). The
# archive is mounted read-only and unpacked to a tmpfs that dies with the
# build container; no release content is written anywhere else. Licensing is
# the operator's: SNOMED CT needs an Affiliate Licence (free in Member
# countries, snomed.org/get-snomed), and the clause 8.3.1 notice belongs on
# every surface that shows its content. FerroTERM itself is BUSL-1.1 from the
# same Licensor as FerroEHR: non-commercial production use is free, any other
# production use needs a commercial licence (its README says which is which).
#
# Ports: FerroTERM's own API is published on the LOOPBACK interface at 8090 so
# a developer can query it directly; a deployment serving other machines puts a
# reverse proxy with authentication and a rate limit in front (FerroTERM has
# neither), or drops the ports: block and lets the CDR be the only caller, the
# posture the hosted sandbox runs (deploy/hosted/docker-compose.yml).
#
# Posture: the CDR keeps its shipped fail-OPEN default (a binding the server
# cannot resolve is accepted); FERROEHR__TERMINOLOGY__EXTERNAL__FAIL_ON_ERROR=true
# turns an unreachable server into a 422 refusal. Register AMB-172 records that
# no released openEHR text decides between the two.

services:
  ferroterm:
    # Digest-pinned FerroTERM 0.1.6 (resolved 2026-10-01); no `:latest`.
    image: ghcr.io/ferrohealth/ferroterm:0.1.6@sha256:7ec4c9622e88e3028faf7c74a2384fb02e57dc3163c282b21274121a26aa3d5b
    environment:
      # The shaped seed, read straight out of the ferroehr image: the whole
      # image is mounted read-only at /image (a Compose `type: image` volume,
      # Compose 2.35+, Docker Engine 28+) and this names the directory in it.
      # Whole-image rather than a subpath mount because subpath support is
      # newer than the engines a runner or a box may carry.
      FERROTERM_CODESYSTEMS: /image/opt/sandbox-posture/terminology
      # Passed through from YOUR shell, declared with no value on purpose: unset
      # it is removed from the container environment and the server serves the
      # shaped seed alone; set to /data/index after a ferroterm-build run.
      FERROTERM_INDEX:
      FERROTERM_UI: ${FERROTERM_UI:-on}
      FERROTERM_LOG_FORMAT: ${FERROTERM_LOG_FORMAT:-pretty}
      FERROTERM_DEFAULT_LANGUAGE: ${FERROTERM_DEFAULT_LANGUAGE:-en}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      # docs.docker.com/reference/compose-file/services/#volumes, type image.
      - type: image
        source: ${FERROEHR_IMAGE:-ghcr.io/ferrohealth/ferroehr:4.3.3}
        target: /image
        read_only: true
      - type: volume
        source: ferroehr-ferroterm-index
        target: /data/index
        read_only: true
    ports:
      - "${FERROEHR_BIND_HOST:-127.0.0.1}:${FERROEHR_TERMINOLOGY_PORT:-8090}:8080"
    # The image is its own health probe (`ferroterm healthcheck`, FerroTERM
    # 0.1.6): the distroless base carries no shell and no HTTP client, so the
    # binary sends the one GET /health itself and exits 0 on 200. The values
    # restate the image's HEALTHCHECK, and the 60 s start period is for a large
    # edition's load; `healthy` means the code systems are served.
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferroterm", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Distroless, uid 65532, writes nothing while serving: read-only root, every
    # capability dropped.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # The SNOMED CT Netherlands edition is 889 MB resident, the
          # International edition 702 MB, LOINC 170 MB (FerroTERM's benchmark
          # table); the shaped seed is a few megabytes.
          memory: ${FERROTERM_MEM:-1536m}

  # The offline index build, one shot, behind its own profile so a plain `up`
  # never starts it. Same image; the release archive you hold a licence for is
  # mounted read-only and the index lands in the volume the server reads.
  ferroterm-build:
    image: ghcr.io/ferrohealth/ferroterm:0.1.6@sha256:7ec4c9622e88e3028faf7c74a2384fb02e57dc3163c282b21274121a26aa3d5b
    profiles: [terminology-build]
    entrypoint: ["/usr/local/bin/ferroterm-build"]
    command: ["--rf2", "/rf2/release.zip", "--out", "/data/index"]
    environment:
      TMPDIR: /tmp
    volumes:
      # Defaults to /dev/null so the plain `up` parses; a build without
      # FERROTERM_RF2 fails at once on an empty archive, which is the intent.
      - type: bind
        source: ${FERROTERM_RF2:-/dev/null}
        target: /rf2/release.zip
        read_only: true
      - type: volume
        source: ferroehr-ferroterm-index
        target: /data/index
    tmpfs:
      - /tmp:size=4g
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  ferroehr:
    environment:
      FERROEHR__TERMINOLOGY__EXTERNAL__ENABLED: "true"
      FERROEHR__TERMINOLOGY__EXTERNAL__FAIL_ON_ERROR: ${FERROEHR__TERMINOLOGY__EXTERNAL__FAIL_ON_ERROR:-false}
    depends_on:
      # The CDR starts once FerroTERM reports healthy, so the first binding a
      # composition carries finds a serving terminology server; the fail posture
      # above still decides what happens if it goes away later.
      ferroterm:
        condition: service_healthy

volumes:
  ferroehr-ferroterm-index:
