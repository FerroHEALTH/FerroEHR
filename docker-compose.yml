# FerroEHR quickstart — a STANDALONE file: download it anywhere and run
#
#   docker compose up
#   curl -u ferroehr:ferroehr -X POST -i \
#     http://localhost:8080/ferroehr/rest/openehr/v1/ehr
#
# It pulls the published images (ghcr.io/ferrohealth/*) and needs NO repo
# checkout, no bind mounts, and no environment variables. This copy, on main,
# pins the `:main` images built from main and carries the configuration main
# reads; the copy attached to each GitHub release pins that release's images. The server configuration travels INLINE as the
# `ferroehr-config` compose config below (requires Docker Compose >= 2.23.1 —
# docs.docker.com/reference/compose-file/configs). The quickstart posture is
# Basic auth with the dev user ferroehr/ferroehr and RBAC disabled — dev
# credentials, NOT for production (see the config block for the ways out).
#
# The release lane writes the release's version in place of `:main` in the
# copy it attaches (scripts/release/quickstart-compose.sh), and
# scripts/checks/compose-image-tags.sh holds this file to `:main` and the
# attached copy to the release.
#
# ── The patient identity source ───────────────────────────────────────────────
# FerroEHR keeps no patient-to-record cross-reference of its own: it asks an IHE
# patient identity source over PIXm (ITI-83) which pseudonym the clinical domain
# holds for a patient. This file runs FerroPIX as that source, with its own
# PostgreSQL and a DEVELOPMENT OpenID Provider (NAV's mock-oauth2-server) that
# signs any client credentials request, so FerroEHR's client `ferroehr` gets a
# token whose scope lets it ask, and FerroPIX mints the pseudonym in the domain
# urn:oid:2.999.7.1 on the first ask. Any conformant PIX Manager can take
# FerroPIX's place: [pixm] below names an endpoint, never a product.
#
# The issuer, FerroPIX and FerroEHR share ONE network namespace, the issuer's.
# A server accepts a plain-http issuer only on loopback (RFC 8414 §2), and the
# mock issuer writes the host it was asked on into every token's `iss`, so all
# three must see it at http://localhost:8180. The issuer service therefore
# publishes the ports of all three and answers to the names `ferroehr` and
# `ferropix` on the compose network. Published on loopback:
#   8080  FerroEHR            8090  FerroPIX           8180  the issuer
# A patient is registered with FerroPIX by its Patient Identity Source, the
# client `quickstart-source` (https://ferropix.eu/docs/integrate/pixm-manager.html).
#
# ── The local EHR index (the subject-id posture) ──────────────────────────────
# The other supported posture keeps the subject-to-EHR cross-reference in
# FerroEHR itself: EHR_STATUS.subject names a patient by its own namespace and
# identifier (`benchmark` / `1793131381`), and GET /ehr?subject_id=&subject_namespace=
# finds it. One variable selects it, with no copy of the config to make:
#   FERROEHR_EHR_INDEX=local docker compose up
# It runs the `ferroehr-config-local` block below, which differs from
# `ferroehr-config` in the subject index and [privacy] alone: no pseudonym namespace,
# so a subject reference is stored as the client sends it. The identity
# services still start; nothing asks them.
#
# ── The two quickstart variants ───────────────────────────────────────────────
# Basic auth only (this file alone):
#   docker compose up
# With a ready-made Keycloak identity provider (download the overlay too):
#   docker compose -f docker-compose.yml -f docker-compose.keycloak.yml up
# With FerroTERM, the terminology server, beside the CDR (download the overlay too):
#   docker compose -f docker-compose.yml -f docker-compose.terminology.yml up
# The observability stack is a third standalone overlay
# (docker-compose.observability.yml): Grafana/OTel beside the server. Overlays
# rather than profiles because they must MUTATE the ferroehr service's env —
# a change profiles cannot express
# (docs.docker.com/compose/how-tos/multiple-compose-files).
#
# ── Profiles (docs.docker.com/compose/how-tos/profiles) ───────────────────────
# Core services (postgres, ferroehr) are profile-less and start on every `up`.
# Optional services are opt-in:
#   --profile viewer          the viewer on port 3000
#   --profile s3              SeaweedFS S3 gateway for DV_MULTIMEDIA (off by default)
#
# ── Container isolation posture ──────────────────────────────────────────────
# Every service drops ALL capabilities and adds back only what its entrypoint
# provably needs, refuses privilege escalation, bounds its file descriptors, and
# restarts unless stopped. Three services additionally run a READ-ONLY root
# filesystem with tmpfs for the paths that must be writable; the two that do not
# say why inline.
#
# The seccomp posture is Docker's DEFAULT profile, and it is deliberately not
# named here: Docker applies `builtin` unless a service overrides it, and that
# profile already blocks ~44 of the ~300+ syscalls, including every one behind a
# capability we drop above (docs.docker.com/engine/security/seccomp). Writing
# `seccomp=unconfined` is the dangerous move, so the guard to keep is the ABSENCE
# of that string. What `scripts/checks/compose-hardening.sh` actually enforces on
# every compose artifact: cap_drop + no-new-privileges on every service, no
# `privileged`, no unconfined seccomp/AppArmor, no daemon-socket mount, and that
# every published port names a host address. The rest of this block (ulimits,
# read-only roots, the loopback address choice) is convention, kept by review.
#
# ── Where the ports are published (security-relevant) ────────────────────────
# Every published port binds the LOOPBACK interface by default
# (127.0.0.1:HOST:CONTAINER). This matters more than it looks: a published port
# is DNAT'd by rules Docker inserts ahead of the host firewall's own chains, so
# `ufw deny 8080` does NOT stop a container port published on 0.0.0.0
# (docs.docker.com/engine/network/packet-filtering-firewalls). The database
# publishes NO host port at all (#2879); host psql/GUI access is the explicit
# docker-compose.db-publish.yml overlay.
#
# To reach the stack from another machine, name the interface explicitly:
#   FERROEHR_BIND_HOST=0.0.0.0 docker compose up      # every interface
#   FERROEHR_BIND_HOST=10.0.0.5 docker compose up     # one address
# Prefer a reverse proxy on the host over publishing the database at all.
#
# Port already in use? Every published port is a variable (#2869) — no edit:
#   FERROEHR_PORT=8081 docker compose up
# (Likewise FERROEHR_DB_PORT / FERROEHR_VIEWER_PORT / FERROEHR_S3_PORT.)
# Defaults stay fixed deliberately: the docs assume localhost:8080, and
# Docker's own auto-allocation exists only for mappings that omit the host
# port entirely (docs.docker.com/engine/network/port-publishing) — a server
# that moved ports silently would break every printed URL.
#
# ── Repo development / CI (never needed by downloaders) ──────────────────────
# The dev overlay is EXPLICIT, never auto-merged (#2868 — the auto-merged
# `override` name made a checkout's bare `docker compose up` build from
# source and reference unpublished `:local` tags, breaking the quickstart):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# It flips the images to `:local` build-from-source tags, swaps the inline
# config below for docker/ferroehr.dev.toml, and defines the dev `keycloak`
# profile (the full exported realm). A bare `docker compose up` in a checkout
# is now the SAME published-images quickstart the downloaded file gives. The conformance lanes never touch this file — they compose
# their own self-contained SUT stack (docker/sut-ferroehr.yml, see its header
# for the lane table). NO hard-coded `name:` (issue #282 D3): each lane picks
# its own project name so the lanes coexist; all lanes share the
# 8080/3000/8081 host port block, so they run one at a time on defaults —
# override the *_PORT env vars for true parallel coexistence.

services:
  ferroehr-postgres:
    image: ${FERROEHR_POSTGRES_IMAGE:-ghcr.io/ferrohealth/ferroehr-postgres:main}
    # Docker's default 64MB /dev/shm starves PostgreSQL's dynamic shared
    # memory under load (parallel workers error `could not resize shared
    # memory segment … No space left on device`), so measured runs keep this
    # floor.
    shm_size: ${BENCH_PG_SHM_SIZE:-1gb}
    environment:
      # Bootstrap superuser (postgres) — dev default; override in production.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # App role/database created by the image's baked-in init script (dev
      # defaults). These configure the DB *container*, not the server binary —
      # the PG_INIT_ prefix keeps them out of the server's reserved FERROEHR_
      # namespace (the strict boot-time env sweep would otherwise reject them).
      PG_INIT_USER: ${PG_INIT_USER:-ferroehr}
      PG_INIT_PASSWORD: ${PG_INIT_PASSWORD:-ferroehr}
      PG_INIT_DB: ${PG_INIT_DB:-ferroehr}
    # pg_stat_statements is loaded so a measured run (`veredictum perf`) can
    # attribute time per statement; negligible overhead, ships in the stock
    # image.
    # The same PG tuning floor the measurement instruments assume, so a local
    # probe measures the tuned configuration.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=${BENCH_PG_SHARED_BUFFERS:-1GB}
      - -c
      - max_wal_size=${BENCH_PG_MAX_WAL_SIZE:-4GB}
      - -c
      - work_mem=${BENCH_PG_WORK_MEM:-16MB}
      # Compressed full-page images halve the WAL a commit fsyncs (measured
      # ~52 KB -> ~24 KB per composition commit) and collapse the post-
      # checkpoint latency tail; lz4's compression CPU is far below the fsync
      # it saves (PostgreSQL docs: Write Ahead Log / wal_compression).
      - -c
      - wal_compression=${BENCH_PG_WAL_COMPRESSION:-lz4}
    volumes:
      - ferroehr-pgdata:/var/lib/postgresql
    # NO host port, deliberately (#2879): the server reaches the database over
    # the compose network, so a host publish serves only host psql/GUI clients
    # — and on Windows the default 5432 collided with the EDB installer's
    # auto-started postgresql-x64-* service, failing the quickstart's first
    # command. Host access is the docker-compose.db-publish.yml overlay;
    # in-stack access needs no port: docker compose exec ferroehr-postgres
    # psql -U postgres -d ferroehr.
    # Isolation floor. The entrypoint starts as root to chown the data directory
    # and then drops to `postgres`, so it needs exactly the capabilities that
    # requires and nothing else — not the ~14 the default set grants.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    read_only: true
    # A read-only root still needs these writable: the unix socket directory, the
    # entrypoint's scratch space, and PostgreSQL's own temp files.
    tmpfs:
      - /tmp
      - /run
      - /var/run/postgresql
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    restart: unless-stopped
    # Resource ceilings (docs.docker.com/reference/compose-file/deploy;
    # docs.docker.com/engine/containers/resource_constraints) — the DB gets
    # headroom above the app for shared_buffers (1GB) + /dev/shm (1gb).
    # Overridable so the measured-record lanes can match the party ixit's
    # documented environment envelope (the committed measurement records are
    # environment-bound; production limits live in the Helm values).
    deploy:
      resources:
        limits:
          cpus: "${FERROEHR_DB_CPUS:-4}"
          memory: ${FERROEHR_DB_MEM:-4G}
    # Over TCP: the image's init runs a temporary server on the Unix socket
    # only (listen_addresses='', docker-library/postgres docker-entrypoint.sh),
    # which a socket check reports healthy before the real start.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${PG_INIT_USER:-ferroehr} -d ${PG_INIT_DB:-ferroehr}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ── Per-domain logical backups (opt-in: `--profile backup`) ────────────────
  # Two one-shot dump jobs, one per pseudonymisation domain, writing to two
  # SEPARATE host directories. Splitting the dump is the point: an artefact
  # carrying the pseudonymised clinical record beside the identities of its
  # subjects re-joins what the schema separation exists to keep apart (GDPR Art. 4(5),
  # https://eur-lex.europa.eu/eli/reg/2016/679/oj; the EDPB reads the
  # separation as defining the pseudonymisation domain in Guidelines 01/2025).
  # Art. 32(1)(c) is why they exist at all. No openEHR spec governs backups —
  # our own design/extension.
  #
  # Run one, or both:
  #   docker compose --profile backup run --rm ferroehr-backup-clinical
  #   docker compose --profile backup run --rm ferroehr-backup-party
  #
  # The two targets are ordinary directories, so they take ordinary
  # permissions: give them different owners, ship them to different buckets,
  # hand the party one to a smaller group. That is the
  # "separately access-controlled" half, and this file cannot enforce it for
  # you — it can only stop them from landing in one file.
  #
  # `--format=custom` (PostgreSQL 18, pg_dump §Options) so the restore side can
  # choose what to restore and in what order; `pg_restore` reads it.
  # `--strict-names` is on every job: without it a `--schema` pattern that
  # matches nothing is not an error, so a dump naming a schema this database
  # does not have writes an artefact missing that half and exits 0 (PostgreSQL
  # 18, pg_dump §Options, --strict-names). That is how a clinical backup ships
  # with no clinical data and nobody finds out until the restore.
  # Point-in-time recovery is a different instrument and stays instance-wide:
  # see the operations page in the documentation.
  #
  # THE DUMP CONNECTS AS THE BOOTSTRAP SUPERUSER, and that is not laziness.
  # Each domain's runtime role is revoked from the other domains, so no runtime
  # credential can read a whole database: that is the pseudonymisation boundary
  # working, and a backup taken through one of them would be silently partial.
  # The operations page says so for deployments that do not share this stack's
  # single credential.
  ferroehr-backup-clinical:
    profiles: [backup]
    image: ${FERROEHR_POSTGRES_IMAGE:-ghcr.io/ferrohealth/ferroehr-postgres:main}
    depends_on:
      ferroehr-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # The target is a directory on the HOST, owned by whoever created it, so
    # the dump has to run as somebody who can write it. Two ways, and the
    # default has to work without the operator arranging anything:
    #
    #   * `FERROEHR_BACKUP_USER="$(id -u):$(id -g)"` — the better posture. The
    #     job runs as you, the file lands owned by you, and DAC_OVERRIDE below
    #     is never used.
    #   * unset — the job runs as root, which needs CAP_DAC_OVERRIDE to write a
    #     directory it does not own. `cap_drop: [ALL]` takes that capability
    #     away, and without it uid 0 is simply "other" against a mode-755
    #     directory (capabilities(7)); root alone does NOT make the write
    #     succeed. So the capability is added back, and only that one.
    user: "${FERROEHR_BACKUP_USER:-0:0}"
    cap_add: [DAC_OVERRIDE]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        pg_dump --host=ferroehr-postgres --username=postgres
        --dbname=${PG_INIT_DB:-ferroehr} --format=custom --no-owner
        --strict-names --schema=clinical --schema=ext --schema=audit
        --file=/backup/clinical-$$(date -u +%Y%m%dT%H%M%SZ).dump
    volumes:
      - ${FERROEHR_BACKUP_CLINICAL_DIR:-./backups/clinical}:/backup
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  ferroehr-backup-party:
    profiles: [backup]
    image: ${FERROEHR_POSTGRES_IMAGE:-ghcr.io/ferrohealth/ferroehr-postgres:main}
    depends_on:
      ferroehr-postgres:
        condition: service_healthy
    # This stack runs one login credential for every domain (the init script
    # says why). A deployment that gives the party domain its own BYPASSRLS
    # backup role points this job at that one instead, and then the
    # job that can read the identities cannot read the clinical record or the
    # map to it.
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Same reason as its clinical twin above.
    user: "${FERROEHR_BACKUP_USER:-0:0}"
    cap_add: [DAC_OVERRIDE]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        pg_dump --host=ferroehr-postgres --username=postgres
        --dbname=${PG_INIT_DB:-ferroehr} --format=custom --no-owner
        --strict-names --schema=party
        --file=/backup/party-$$(date -u +%Y%m%dT%H%M%SZ).dump
    volumes:
      - ${FERROEHR_BACKUP_PARTY_DIR:-./backups/party}:/backup
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # The development OpenID Provider, and the owner of the network namespace
  # FerroPIX and FerroEHR join (the header says why). It signs any client
  # credentials request: the client as `sub` and `client_id`, FerroPIX's FHIR
  # base as the audience, and the scope asked for. NOT for anything real: name
  # your own https issuer in [pixm.endpoint.credentials.oauth] and in FerroPIX's [[auth.issuer]].
  identity-issuer:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.5@sha256:d88e445d55c4ff6eed59b02d86adfece47d985233b1616fb712669b98328c8a2
    networks:
      default:
        aliases: [ferroehr, ferropix]
    ports:
      - "${FERROEHR_BIND_HOST:-127.0.0.1}:${FERROEHR_PORT:-8080}:8080"
      - "${FERROEHR_BIND_HOST:-127.0.0.1}:${FERROEHR_PIX_PORT:-8090}:8090"
      - "${FERROEHR_BIND_HOST:-127.0.0.1}:${FERROEHR_ISSUER_PORT:-8180}:8180"
    environment:
      # FerroEHR listens on 8080 in this namespace, so the provider moves.
      SERVER_PORT: "8180"
      # A request for the scope ferroehr/scim gets a token for FerroEHR's SCIM
      # endpoint (the ferroehr-provision one-shot below); every other client
      # credentials request gets one for FerroPIX.
      # `$$` is a literal `$` to compose.
      JSON_CONFIG: >-
        {"tokenCallbacks":[{"issuerId":"quickstart",
        "requestMappings":[{"requestParam":"scope","match":"ferroehr/scim",
        "claims":{"sub":"$${clientId}","client_id":"$${clientId}",
        "aud":["ferroehr-scim"],"scope":"$${scope}"}},
        {"requestParam":"grant_type","match":"client_credentials",
        "claims":{"sub":"$${clientId}","client_id":"$${clientId}",
        "aud":["http://localhost:8090/fhir"],"scope":"$${scope}"}}]}]}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  # The sealing key of FerroPIX's identifier columns, the base64 of 32 random
  # bytes, written once into its own volume, so this file carries no key.
  ferropix-key:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    entrypoint: ["sh", "-c", "umask 077; [ -s /key/data-key ] || head -c 32 /dev/urandom | base64 > /key/data-key; chown 65532:65532 /key/data-key"]
    volumes:
      - ferropix-key:/key
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt:
      - no-new-privileges:true
    read_only: true

  # FerroPIX's store. The server connects as the `ferropix` role the init
  # script below creates, which owns nothing outside its schema, as FerroPIX's
  # boot gate requires. The password is a quickstart default on a database that
  # publishes no port.
  ferropix-postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_DB: ferropix
      POSTGRES_PASSWORD: ${FERROPIX_POSTGRES_PASSWORD:-postgres}
    configs:
      - source: ferropix-role
        target: /docker-entrypoint-initdb.d/10-ferropix-role.sh
    volumes:
      - ferropix-pgdata:/var/lib/postgresql
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "ferropix"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # FerroPIX, the IHE patient identity source: a PIXm Manager (ITI-83) that
  # mints FerroEHR's pseudonyms (its [[pseudonym_domain]] in the config block
  # below names the client `ferroehr`). Pinned by tag and by the digest of its
  # image index.
  ferropix:
    image: ghcr.io/ferrohealth/ferropix:0.0.26@sha256:85d40e6fdcdb39f782007eff91eb059861a4e039ca3f8fb56e37f2fa0f28d78a
    network_mode: service:identity-issuer
    depends_on:
      identity-issuer:
        condition: service_started
      ferropix-key:
        condition: service_completed_successfully
      ferropix-postgres:
        condition: service_healthy
    environment:
      FERROPIX_CONFIG: /etc/ferropix/ferropix.toml
      # The image sets 0.0.0.0:8080, which FerroEHR binds in this namespace,
      # and the environment wins over the file.
      FERROPIX__SERVER__LISTEN: 0.0.0.0:8090
      # The usage report follows FerroEHR's switch, so one variable stops both.
      FERROPIX__USAGE_REPORT__ENABLED: ${FERROEHR__USAGE_REPORT__ENABLED:-true}
    configs:
      - source: ferropix-config
        target: /etc/ferropix/ferropix.toml
      - source: ferropix-db-url
        target: /etc/ferropix/db-url
    volumes:
      - ferropix-key:/var/lib/ferropix-key:ro
      - ferropix-state:/var/lib/ferropix
    # NOT `read_only: true`, for the reason the ferroehr service gives: Compose
    # refuses an inline config in a read-only service.
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s
    # The image's own HEALTHCHECK, stated here because an OCI-format image
    # carries none to Podman. It asks /health/readiness on 8090.
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferropix", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ferroehr:
    image: ${FERROEHR_IMAGE:-ghcr.io/ferrohealth/ferroehr:main}
    # The issuer's namespace (the header says why); the issuer publishes 8080
    # and answers to `ferroehr` on the compose network.
    network_mode: service:identity-issuer
    depends_on:
      ferroehr-postgres:
        condition: service_healthy
      # FerroEHR reads the identity source's capabilities at boot and refuses
      # to start while it does not answer.
      ferropix:
        condition: service_healthy
      # The professional PERSON and ROLE templates the party mapping names
      # are in the definition store before the server boots, which refuses a
      # mapping whose templates it lacks.
      ferroehr-definitions:
        condition: service_completed_successfully
      # Inert without the s3 profile (required: false). With it, this edge does
      # two jobs: the server starts only after the bucket initializer exits 0,
      # and `up -d --wait` learns the initializer is a one-shot — Compose v5.4
      # otherwise fails --wait on ANY exited container, even a successful one
      # (measured on Docker and Podman alike, 2026-08-24, issue #2636).
      seaweedfs-init:
        condition: service_completed_successfully
        required: false
    environment:
      # FERROEHR_ env overrides use the mechanical `__` mapping (TOML path,
      # upper-cased, `__` between segments); they layer on top of the mounted
      # quickstart config (env beats file).
      # The server reads the file this names and searches for none.
      FERROEHR_CONFIG: /etc/ferroehr/ferroehr.toml
      FERROEHR__DATABASE__URL: postgres://${PG_INIT_USER:-ferroehr}:${PG_INIT_PASSWORD:-ferroehr}@ferroehr-postgres:5432/${PG_INIT_DB:-ferroehr}
      # Connection-pool ceiling; measured comparison runs raise it in lockstep
      # with the upstream stack's HikariCP pool (config parity — the dominant
      # tunable must match across compared SUTs).
      FERROEHR__DATABASE__MAX_CONNECTIONS: ${FERROEHR__DATABASE__MAX_CONNECTIONS:-10}
      # Concurrent-request bound (503 load shed past it). The comparison runs
      # raise it so overload manifests as queueing latency — the same failure
      # mode as upstream's Tomcat admission window — instead of shed errors
      # tripping the stress envelope's error-rate arm.
      FERROEHR__SERVER__MAX_CONCURRENT_REQUESTS: ${FERROEHR__SERVER__MAX_CONCURRENT_REQUESTS:-256}
      # Version-signing toggle pass-through (measured comparison runs disable it
      # for throughput parity — upstream has no signing.)
      FERROEHR__RECORD__SIGNING__ENABLED: ${FERROEHR__RECORD__SIGNING__ENABLED:-true}
      # A commercial licence token (BUSL-1.1 production use in the course of a
      # business). Mount the signed token file read-only and name its path;
      # unset, the server runs under the embedded non-commercial grant and
      # reports which on GET /ferroehr/rest/status.
      #   FERROEHR__DEPLOYMENT__LICENCE_FILE: /etc/ferroehr/licence.asc
      # Quickstart: human-readable colored logs in `docker compose logs`.
      # Production/collector deployments override to `json` (or unset — the
      # `auto` default picks json when stdout is not a TTY).
      FERROEHR__TELEMETRY__FORMAT: ${FERROEHR__TELEMETRY__FORMAT:-pretty}
      # Measurement parity (logging equal and minimal on both SUTs):
      # measured comparison runs set warn on BOTH SUTs; default stays info.
      FERROEHR__TELEMETRY__FILTER: ${FERROEHR__TELEMETRY__FILTER:-info}
      # The usage report (on by default): https://ferroehr.eu/docs/latest/usage-report.html
      # FERROEHR__USAGE_REPORT__ENABLED=false in your shell sends nothing.
      FERROEHR__USAGE_REPORT__ENABLED: ${FERROEHR__USAGE_REPORT__ENABLED:-true}
      FERROEHR__USAGE_REPORT__DEPLOYMENT: compose
      # Multimedia (the `s3` profile), passed through from YOUR shell. These are
      # declared with no value on purpose: "If the value is not resolved, the
      # variable is unset and is removed from the service container environment"
      # (https://docs.docker.com/reference/compose-file/services/#environment).
      # So an unset key reaches the server as ABSENT rather than as an empty
      # string — which matters here, because an empty `endpoint` is a boot
      # refusal, not a synonym for "unset". A `${VAR:-}` default would inject
      # exactly that empty string into every quickstart.
      FERROEHR__RECORD__MULTIMEDIA__ENABLED:
      FERROEHR__RECORD__MULTIMEDIA__URL:
      FERROEHR__RECORD__MULTIMEDIA__BUCKET:
      FERROEHR__RECORD__MULTIMEDIA__REGION:
      FERROEHR__RECORD__MULTIMEDIA__THRESHOLD:
      FERROEHR__RECORD__MULTIMEDIA__ACCESS_KEY_ID:
      FERROEHR__RECORD__MULTIMEDIA__SECRET_ACCESS_KEY:
    configs:
      # Named by FERROEHR_CONFIG above.
      # The inline quickstart posture — see the `configs:` block at the bottom.
      # FERROEHR_EHR_INDEX=local selects `ferroehr-config-local` instead.
      - source: ferroehr-config${FERROEHR_EHR_INDEX:+-${FERROEHR_EHR_INDEX}}
        target: /etc/ferroehr/ferroehr.toml
    # The image is distroless/nonroot and the server binds 8080, so it needs no
    # capability at all — not even NET_BIND_SERVICE (that is for ports < 1024).
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # NOT `read_only: true`, and the reason is a real mutual exclusion rather
    # than an oversight: Compose refuses an INLINE config in a read-only service
    # ("cannot create config … in read-only service …: `file` is the sole
    # supported option"), and the inline `ferroehr-config` below is what makes
    # this file standalone — downloadable and runnable with no repo checkout.
    # Mounting the config from a host file instead would restore a read-only root
    # and break that promise. The Kubernetes path has no such conflict, because
    # the config arrives as a mounted ConfigMap, and
    # `deploy/helm/ferroehr/values.yaml` sets `readOnlyRootFilesystem: true`
    # there. A Compose deployment that wants both mounts a config FILE and adds
    # `read_only: true` + `tmpfs: [/tmp]`.
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    restart: unless-stopped
    # Default sized to the party ixit's documented measurement envelope (the
    # committed measured records are environment-bound to the 8-CPU/8GB
    # docker VM; a 2cpu/1Gi cap halved the measured knee). Production limits
    # are the Helm values' concern (deploy/helm/ferroehr/values.yaml);
    # override via env for a constrained profile.
    # The server's measured resident envelope (#2872 soaks, 4.0.9 image):
    # ~22 MiB at boot, ~70 MiB after hours of idle, ~125 MiB warm steady
    # state under and after sustained load — a designed plateau (caches +
    # pool), zero growth slope. The 4G default is headroom, not a forecast;
    # watch `process_resident_memory_bytes` on the metrics surface.
    deploy:
      resources:
        limits:
          cpus: "${FERROEHR_CPUS:-4}"
          memory: ${FERROEHR_MEM:-4G}
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferroehr", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Loads FerroEHR's default demographic definitions into the definition
  # store, then exits (`ferroehr definitions load`): the professional PERSON
  # and ROLE the party mapping names, the care-team GROUP and the membership
  # and representation PARTY_RELATIONSHIPs a mapping of groups or
  # representation names, the patient PERSON and the healthcare provider
  # ORGANISATION. A definition stored with the same text is left alone, so it
  # runs at every `up`. They travel inline as the seven
  # `ferroehr-definition-*` configs below, copies of deploy/definitions/. The
  # policy definitions come with the binary, which stores them at boot.
  ferroehr-definitions:
    image: ${FERROEHR_IMAGE:-ghcr.io/ferrohealth/ferroehr:main}
    depends_on:
      ferroehr-postgres:
        condition: service_healthy
    command:
      - definitions
      - load
      - /etc/ferroehr/definitions/person.adls
      - /etc/ferroehr/definitions/role.adls
      - /etc/ferroehr/definitions/group.adls
      - /etc/ferroehr/definitions/membership.adls
      - /etc/ferroehr/definitions/representation.adls
      - /etc/ferroehr/definitions/patient.adls
      - /etc/ferroehr/definitions/provider.adls
    environment:
      FERROEHR_CONFIG: /etc/ferroehr/ferroehr.toml
      FERROEHR__DATABASE__URL: postgres://${PG_INIT_USER:-ferroehr}:${PG_INIT_PASSWORD:-ferroehr}@ferroehr-postgres:5432/${PG_INIT_DB:-ferroehr}
      FERROEHR__USAGE_REPORT__ENABLED: "false"
    configs:
      - source: ferroehr-config${FERROEHR_EHR_INDEX:+-${FERROEHR_EHR_INDEX}}
        target: /etc/ferroehr/ferroehr.toml
      - source: ferroehr-definition-person
        target: /etc/ferroehr/definitions/person.adls
      - source: ferroehr-definition-role
        target: /etc/ferroehr/definitions/role.adls
      - source: ferroehr-definition-group
        target: /etc/ferroehr/definitions/group.adls
      - source: ferroehr-definition-membership
        target: /etc/ferroehr/definitions/membership.adls
      - source: ferroehr-definition-representation
        target: /etc/ferroehr/definitions/representation.adls
      - source: ferroehr-definition-patient
        target: /etc/ferroehr/definitions/patient.adls
      - source: ferroehr-definition-provider
        target: /etc/ferroehr/definitions/provider.adls
    # NOT `read_only: true`, for the inline configs (the ferroehr service says why).
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # Provisions the quickstart user `ferroehr` as a professional PERSON through
  # FerroEHR's SCIM endpoint (RFC 7644 §3.3), so the Basic login is bound to
  # a demographic party: the development issuer signs the `quickstart-scim`
  # client a token for the scope ferroehr/scim, and the User is created with
  # the binding key `ferroehr`. A User that exists already (409) is kept. It
  # then stays up and reports healthy, so `up --wait` returns once the login
  # is bound.
  ferroehr-provision:
    image: ${FERROEHR_CURL_IMAGE:-curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777}
    network_mode: service:identity-issuer
    depends_on:
      ferroehr:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >-
        set -e;
        token=$$(curl -fsS -d grant_type=client_credentials -d client_id=quickstart-scim
        -d client_secret=quickstart -d scope=ferroehr/scim
        http://localhost:8180/quickstart/token | sed -n 's/.*"access_token" *: *"\([^"]*\)".*/\1/p');
        status=$$(curl -sS -o /tmp/answer -w '%{http_code}' -X POST
        -H "Authorization: Bearer $$token" -H 'Content-Type: application/scim+json'
        --data '{"schemas":["urn:ietf:params:scim:schemas:core:2.0:User","urn:ietf:params:scim:schemas:extension:ferrohealth:2.0:User"],"userName":"ferroehr","urn:ietf:params:scim:schemas:extension:ferrohealth:2.0:User":{"loginIdentifier":"ferroehr"}}'
        http://localhost:8080/scim/v2/Users);
        case $$status in 201|409) ;; *) echo "provisioning ferroehr answered $$status" >&2; cat /tmp/answer >&2; exit 1;; esac;
        touch /tmp/provisioned; echo 'ferroehr is provisioned'; exec sleep infinity
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/provisioned"]
      interval: 2s
      timeout: 2s
      retries: 30
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # The viewer (ferroehr-viewer): a standalone server-rendered web app +
  # BFF that consumes the CDR strictly over ITS-REST — never the database.
  # Opt-in (`docker compose --profile viewer up`); Basic login proxies the
  # CDR's quickstart user (ferroehr/ferroehr). For OIDC set the
  # FERROEHR_VIEWER__OIDC__* and FERROEHR_VIEWER__AUTH__* variables at your identity provider.
  ferroehr-viewer:
    profiles: [viewer]
    image: ${FERROEHR_VIEWER_IMAGE:-ghcr.io/ferrohealth/ferroehr-viewer:main}
    depends_on:
      ferroehr:
        condition: service_healthy
    environment:
      FERROEHR_VIEWER__CDR__BASE_URL: http://ferroehr:8080
      # The quickstart serves plain HTTP on localhost, so the secure-by-default
      # session cookie flag opts out here; a TLS-fronted deployment (the hosted
      # sandbox, the chart behind an ingress) keeps the default `true`.
      FERROEHR_VIEWER__SESSION__SECURE_COOKIE: "false"
      # The CDR's console in `docker compose logs`: the same section and the
      # same request line; `json` (or unset, `auto`) for a log collector.
      FERROEHR_VIEWER__TELEMETRY__FORMAT: ${FERROEHR_VIEWER__TELEMETRY__FORMAT:-pretty}
      FERROEHR_VIEWER__TELEMETRY__FILTER: ${FERROEHR_VIEWER__TELEMETRY__FILTER:-info}
    ports:
      - "${FERROEHR_BIND_HOST:-127.0.0.1}:${FERROEHR_VIEWER_PORT:-3000}:3000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferroehr-viewer", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # SeaweedFS S3 gateway for DV_MULTIMEDIA externalization — DEV/TEST ONLY,
  # behind the `s3` profile (off by default; externalization is OFF by default,
  # so the app does NOT depend on this). To try it — three steps, none skippable:
  #   1. export these THREE variables — the `ferroehr` service passes
  #      the whole FERROEHR__RECORD__MULTIMEDIA__* set through from your shell:
  #        export FERROEHR__RECORD__MULTIMEDIA__ENABLED=true
  #        export FERROEHR__RECORD__MULTIMEDIA__URL=http://seaweedfs:8333   # dev only; prod S3 is HTTPS
  #        export FERROEHR__RECORD__MULTIMEDIA__BUCKET=openehr-multimedia
  #   2. docker compose --profile s3 up -d --wait ferroehr seaweedfs
  #      `seaweedfs-init` creates the bucket; the gateway ships with none, and an
  #      S3 PUT into a missing bucket answers 403 AccessDenied, which reads as a
  #      credentials problem and is not one.
  #      Verify with `curl -s -u ferroehr:ferroehr localhost:8080/management/env`.
  # With no AWS keys the gateway runs in unauthenticated "allow-all" mode
  # (dev/test only). In production point FERROEHR__RECORD__MULTIMEDIA__* at a real,
  # credentialed, HTTPS S3 endpoint (AWS S3 / MinIO / etc.) instead of this.
  # Creates the bucket the gateway does not create for itself.
  #
  # SeaweedFS starts with NO buckets, and an S3 PUT of an object into a bucket
  # that does not exist answers `403 AccessDenied` — not `404 NoSuchBucket` — so
  # the first multimedia commit failed with what reads as a credentials problem
  # and is not one. This service removes the manual step entirely.
  #
  # A plain S3 CreateBucket (`PUT /<bucket>`), which is idempotent: AWS defines a
  # repeat CreateBucket by the bucket's own owner as a success in the default
  # region rather than an error
  # (https://docs.aws.amazon.com/AmazonS3/latest/API/API_CreateBucket.html), and
  # the gateway runs unauthenticated here, so every re-`up` is a no-op.
  #
  # It reads the SAME bucket variable the server does, so the two cannot drift:
  # override `FERROEHR__RECORD__MULTIMEDIA__BUCKET` and this creates the bucket you
  # actually configured.
  seaweedfs-init:
    profiles: [s3]
    # The GATEWAY's own image, which already ships curl — so this adds no second
    # image to pull, pin or scan, and the initializer can never drift from the
    # gateway it initializes because they are the same digest.
    image: chrislusf/seaweedfs:4.40@sha256:52194fba4fecd0083c842158b3a902ba6e04a63619b2b0efcd08007bdb6a4602
    depends_on:
      seaweedfs:
        condition: service_healthy
    # Retry until the bucket is VERIFIABLY listable, not just until the PUT
    # returns: the gateway's healthcheck only proves the S3 port answers,
    # and the filer behind it can still be warming up — a single-shot
    # CreateBucket against that window failed once and nothing retried
    # (restart "no"), leaving every multimedia commit against a missing
    # bucket (#2420; the create is idempotent per the AWS CreateBucket
    # semantics cited above, so re-PUTting is a no-op). The trailing GET is
    # the same 200-vs-404 read the deployment probe makes, so this service
    # exits 0 only in a state the probe accepts, and `up --wait` gates on
    # that exit.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        bucket="http://seaweedfs:8333/${FERROEHR__RECORD__MULTIMEDIA__BUCKET:-openehr-multimedia}";
        i=0; while [ "$$i" -lt 30 ]; do
        curl -sS -X PUT "$$bucket" >/dev/null;
        if curl -sSf -o /dev/null "$$bucket/?max-keys=0"; then exit 0; fi;
        i=$$((i+1)); sleep 2;
        done;
        echo "bucket never became listable after 30 attempts" >&2; exit 1
    restart: "no"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  seaweedfs:
    profiles: [s3]
    # Digest-pinned chrislusf/seaweedfs:4.40 (current stable), resolved
    # 2026-07-24; no `:latest` (docs.docker.com/build/building/best-practices).
    image: chrislusf/seaweedfs:4.40@sha256:52194fba4fecd0083c842158b3a902ba6e04a63619b2b0efcd08007bdb6a4602
    command: ["server", "-s3", "-dir=/data"]
    volumes:
      - ferroehr-seaweedfs:/data
    ports:
      - "${FERROEHR_BIND_HOST:-127.0.0.1}:${FERROEHR_S3_PORT:-8333}:8333"
    cap_drop: [ALL]
    # The image drops privileges with `su-exec`, which calls setgroups(2) — so
    # SETGID/SETUID are load-bearing here. Verified empirically: without them the
    # container loops on "su-exec: setgroups: Operation not permitted".
    cap_add: [SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    # NOT read_only: the gateway writes its volume store under /data, which is a
    # named volume rather than the container filesystem.
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      # 127.0.0.1, not `localhost`: the name resolves to ::1 first and the S3
      # gateway listens on IPv4 only, so the loopback NAME never connected and
      # this healthcheck could not pass.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8333/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

configs:
  # The quickstart server configuration, inline so the downloaded file is
  # self-sufficient (docs.docker.com/reference/compose-file/configs — the
  # `content` attribute; `$` is escaped as `$$` against compose interpolation).
  # QUICKSTART DEFAULTS — do NOT use in production:
  #   * one Basic-auth user  ferroehr / ferroehr  (Argon2id PHC hash below)
  #   * RBAC disabled (any authenticated caller may use every enabled surface;
  #     flip [authz.rbac] enabled = true and give users explicit roles for the
  #     ADMIN / USER / READONLY separation)
  #   * admin API + management introspection enabled, permissive CORS
  # The repo's dev/CI lanes replace this whole config with
  # docker/ferroehr.dev.toml via docker-compose.dev.yml.
  ferroehr-config:
    content: |
      # The declared posture, explicit because this file is the quickstart: a
      # sandbox must not hold real patient data, names the separations it lacks
      # on the boot banner, and reports its profile on GET /ferroehr/rest/status.
      [deployment]
      profile = "sandbox"

      # Per authenticated caller, refused 429 + Retry-After past it.
      [server.caller_rate]
      requests_per_second = 1024
      burst = 2048

      # Any origin may read responses — quickstart only. Production lists its
      # origins.
      [api.cors]
      allow_origins = ["*"]

      # The issuer the Basic users bind under. A Basic user is a person and
      # maps to the PERSON carrying its binding key, which [[auth.party]]
      # places under the identifier issuer of a persons issuer. This one signs
      # nothing: its key set, in every FerroEHR image, is the public half of a
      # key pair whose private key was discarded, for local lanes only.
      [[auth.issuer]]
      issuer = "https://basic-users.ferroehr.invalid"
      kind = "persons"
      audience = ["ferroehr-basic-users"]
      jwks_file = "/opt/sandbox-posture/basic-users-jwks.json"

      [[auth.party]]
      issuer = "https://basic-users.ferroehr.invalid"
      identifier_issuer = "urn:ferroehr:basic-user"
      identifier_type = "login"
      group_claim = "groups"
      group_identifier_issuer = "urn:ferroehr:groups"

      # The quickstart user: ferroehr / ferroehr (the hash is Argon2id of
      # "ferroehr"). Replace with your own users — or an [auth] issuer — before
      # exposing the server to anything real. Every route checks the SMART on
      # openEHR scopes a user holds: these grant every resource family, and
      # the product scope admits the ADMIN and DEMOGRAPHIC APIs.
      [[auth.basic.users]]
      user = "ferroehr"
      password_hash = "$$argon2id$$v=19$$m=19456,t=2,p=1$$ZmVycm9laHJEZXZTYWx0$$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"
      scopes = ["user/composition-*.cruds", "user/template-*.cruds", "user/aql-*.cruds", "__ferroehr.platform"]
      roles = ["ADMIN", "USER"]

      # The healthcare provider the quickstart acts for (an example id under
      # the OID arc 2.999, which ITU-T X.660 reserves for examples), and the
      # binding key of the quickstart user.
      [authz.party_binding]
      provider = { issuer = "urn:oid:2.999.7.9", id = "quickstart" }

      [[authz.party_binding.basic_user]]
      user = "ferroehr"
      key_issuer = "urn:ferroehr:basic-user"
      key = "ferroehr"

      # The party mapping over the professional PERSON and ROLE pair the
      # ferroehr-definitions one-shot loads (deploy/definitions/professional/):
      # the binding key, `userName` and `externalId` share the identifier element
      # and are told apart by type.
      [[authz.party_binding.person.template]]
      template_id = "openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1.0.0"
      default = true
      key = { path = "/details[id2]/items[id3]", type = "login" }
      user_name = { path = "/details[id2]/items[id3]", type = "scim_user_name" }
      external_id = { path = "/details[id2]/items[id3]", type = "scim_external_id" }

      [[authz.party_binding.person.attribute]]
      scim = "name.formatted"
      name = true
      path = { "openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1.0.0" = "/identities[id4]/details[id5]/items[id6]" }

      [[authz.party_binding.person.attribute]]
      scim = "name.givenName"
      path = { "openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1.0.0" = "/identities[id4]/details[id5]/items[id7]" }

      [[authz.party_binding.person.attribute]]
      scim = "name.familyName"
      path = { "openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1.0.0" = "/identities[id4]/details[id5]/items[id8]" }

      [[authz.party_binding.person.attribute]]
      scim = 'emails[type eq "work"].value'
      path = { "openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1.0.0" = "/contacts[id9]/addresses[id10]/details[id11]/items[id12]" }

      [authz.party_binding.professional_role]
      template_id = "openEHR-DEMOGRAPHIC-ROLE.healthcare_professional.v1.0.0"

      # The care-team GROUP a SCIM Group is provisioned as, the membership its
      # members hold and the representation a representative acts through: the
      # rest of FerroEHR's default demographic definitions (deploy/definitions/),
      # which the ferroehr-definitions one-shot loads.
      [authz.party_binding.group]
      template_id = "openEHR-DEMOGRAPHIC-GROUP.care_team.v1.0.0"
      external_id = { path = "/details[id2]/items[id3]", type = "scim_external_id" }
      display_name = "/identities[id4]/details[id5]/items[id6]"

      [authz.party_binding.membership]
      archetype_id = "openEHR-DEMOGRAPHIC-PARTY_RELATIONSHIP.membership.v1"

      [authz.party_binding.representation]
      archetype_id = "openEHR-DEMOGRAPHIC-PARTY_RELATIONSHIP.representation.v1"
      relationship_codes = { at10 = "254", at11 = "264" }

      # The SCIM endpoint the ferroehr-provision one-shot provisions the quickstart
      # user through, with a client credentials token of the development issuer,
      # trusted here as a machines issuer for that one client.
      [[auth.issuer]]
      issuer = "http://localhost:8180/quickstart"
      kind = "machines"
      audience = ["ferroehr-scim"]
      token_types = ["JWT"]

      [auth.scim]
      public_base_url = "http://localhost:8080"

      [[auth.scim.client]]
      issuer = "http://localhost:8180/quickstart"
      client_id = "quickstart-scim"
      scope = "ferroehr/scim"
      binding_issuer = "urn:ferroehr:basic-user"

      # Quickstart: authentication only, no role gate — the one user above can
      # use the clinical API, the admin API and the management endpoints.
      [authz.rbac]
      enabled = false

      # The admin API (DELETE /admin/...) — on for the quickstart so the
      # optional viewer's panels work; keep off in production unless
      # operationally needed.
      [api]
      admin = true

      # Ops introspection (/management/...) on the main listener, for the
      # optional viewer and for curl-based poking. The health probes
      # (/health, /health/liveness, /health/readiness) are always served and
      # need none of this; they report statuses only, and the detail behind
      # them is /management/health.
      [management]
      enabled = true

      [management.endpoints]
      info = "private"
      metrics = "private"
      prometheus = "public"
      env = "admin_only"
      loggers = "admin_only"
      health = "admin_only"
      status = "admin_only"

      # The pseudonym namespace of the clinical domain: EHR_STATUS.subject
      # names a patient by the UUID FerroPIX mints in it.
      [privacy]
      subject_namespaces = ["urn:oid:2.999.7.1"]

      # The IHE patient identity source FerroEHR asks over PIXm (ITI-83), the
      # FerroPIX service above, with the client credentials grant of the
      # development issuer. The client id is the one FerroPIX's
      # [[pseudonym_domain]] names, and system/Patient.rs is the scope its
      # PIXm Manager takes from a Consumer.
      [record]
      subject_index = "pixm"

      [pixm]
      assigning_authority = "urn:oid:2.999.7.1"

      [pixm.endpoint]
      url = "http://localhost:8090/fhir"

      [pixm.endpoint.credentials.oauth]
      token_endpoint = "http://localhost:8180/quickstart/token"
      client_id = "ferroehr"
      client_secret = "quickstart"
      scope = "system/Patient.rs"

  # The same quickstart configuration on the local EHR index, selected by
  # FERROEHR_EHR_INDEX=local; it differs from `ferroehr-config` in the subject
  # index, [pixm] and [privacy] alone, which a test of the configuration loader holds.
  ferroehr-config-local:
    content: |
      # The declared posture, explicit because this file is the quickstart: a
      # sandbox must not hold real patient data, names the separations it lacks
      # on the boot banner, and reports its profile on GET /ferroehr/rest/status.
      [deployment]
      profile = "sandbox"

      # Per authenticated caller, refused 429 + Retry-After past it.
      [server.caller_rate]
      requests_per_second = 1024
      burst = 2048

      # Any origin may read responses — quickstart only. Production lists its
      # origins.
      [api.cors]
      allow_origins = ["*"]

      # The issuer the Basic users bind under. A Basic user is a person and
      # maps to the PERSON carrying its binding key, which [[auth.party]]
      # places under the identifier issuer of a persons issuer. This one signs
      # nothing: its key set, in every FerroEHR image, is the public half of a
      # key pair whose private key was discarded, for local lanes only.
      [[auth.issuer]]
      issuer = "https://basic-users.ferroehr.invalid"
      kind = "persons"
      audience = ["ferroehr-basic-users"]
      jwks_file = "/opt/sandbox-posture/basic-users-jwks.json"

      [[auth.party]]
      issuer = "https://basic-users.ferroehr.invalid"
      identifier_issuer = "urn:ferroehr:basic-user"
      identifier_type = "login"
      group_claim = "groups"
      group_identifier_issuer = "urn:ferroehr:groups"

      # The quickstart user: ferroehr / ferroehr (the hash is Argon2id of
      # "ferroehr"). Replace with your own users — or an [auth] issuer — before
      # exposing the server to anything real. Every route checks the SMART on
      # openEHR scopes a user holds: these grant every resource family, and
      # the product scope admits the ADMIN and DEMOGRAPHIC APIs.
      [[auth.basic.users]]
      user = "ferroehr"
      password_hash = "$$argon2id$$v=19$$m=19456,t=2,p=1$$ZmVycm9laHJEZXZTYWx0$$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"
      scopes = ["user/composition-*.cruds", "user/template-*.cruds", "user/aql-*.cruds", "__ferroehr.platform"]
      roles = ["ADMIN", "USER"]

      # The healthcare provider the quickstart acts for (an example id under
      # the OID arc 2.999, which ITU-T X.660 reserves for examples), and the
      # binding key of the quickstart user.
      [authz.party_binding]
      provider = { issuer = "urn:oid:2.999.7.9", id = "quickstart" }

      [[authz.party_binding.basic_user]]
      user = "ferroehr"
      key_issuer = "urn:ferroehr:basic-user"
      key = "ferroehr"

      # The party mapping over the professional PERSON and ROLE pair the
      # ferroehr-definitions one-shot loads (deploy/definitions/professional/):
      # the binding key, `userName` and `externalId` share the identifier element
      # and are told apart by type.
      [[authz.party_binding.person.template]]
      template_id = "openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1.0.0"
      default = true
      key = { path = "/details[id2]/items[id3]", type = "login" }
      user_name = { path = "/details[id2]/items[id3]", type = "scim_user_name" }
      external_id = { path = "/details[id2]/items[id3]", type = "scim_external_id" }

      [[authz.party_binding.person.attribute]]
      scim = "name.formatted"
      name = true
      path = { "openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1.0.0" = "/identities[id4]/details[id5]/items[id6]" }

      [[authz.party_binding.person.attribute]]
      scim = "name.givenName"
      path = { "openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1.0.0" = "/identities[id4]/details[id5]/items[id7]" }

      [[authz.party_binding.person.attribute]]
      scim = "name.familyName"
      path = { "openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1.0.0" = "/identities[id4]/details[id5]/items[id8]" }

      [[authz.party_binding.person.attribute]]
      scim = 'emails[type eq "work"].value'
      path = { "openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1.0.0" = "/contacts[id9]/addresses[id10]/details[id11]/items[id12]" }

      [authz.party_binding.professional_role]
      template_id = "openEHR-DEMOGRAPHIC-ROLE.healthcare_professional.v1.0.0"

      # The care-team GROUP a SCIM Group is provisioned as, the membership its
      # members hold and the representation a representative acts through: the
      # rest of FerroEHR's default demographic definitions (deploy/definitions/),
      # which the ferroehr-definitions one-shot loads.
      [authz.party_binding.group]
      template_id = "openEHR-DEMOGRAPHIC-GROUP.care_team.v1.0.0"
      external_id = { path = "/details[id2]/items[id3]", type = "scim_external_id" }
      display_name = "/identities[id4]/details[id5]/items[id6]"

      [authz.party_binding.membership]
      archetype_id = "openEHR-DEMOGRAPHIC-PARTY_RELATIONSHIP.membership.v1"

      [authz.party_binding.representation]
      archetype_id = "openEHR-DEMOGRAPHIC-PARTY_RELATIONSHIP.representation.v1"
      relationship_codes = { at10 = "254", at11 = "264" }

      # The SCIM endpoint the ferroehr-provision one-shot provisions the quickstart
      # user through, with a client credentials token of the development issuer,
      # trusted here as a machines issuer for that one client.
      [[auth.issuer]]
      issuer = "http://localhost:8180/quickstart"
      kind = "machines"
      audience = ["ferroehr-scim"]
      token_types = ["JWT"]

      [auth.scim]
      public_base_url = "http://localhost:8080"

      [[auth.scim.client]]
      issuer = "http://localhost:8180/quickstart"
      client_id = "quickstart-scim"
      scope = "ferroehr/scim"
      binding_issuer = "urn:ferroehr:basic-user"

      # Quickstart: authentication only, no role gate — the one user above can
      # use the clinical API, the admin API and the management endpoints.
      [authz.rbac]
      enabled = false

      # The admin API (DELETE /admin/...) — on for the quickstart so the
      # optional viewer's panels work; keep off in production unless
      # operationally needed.
      [api]
      admin = true

      # Ops introspection (/management/...) on the main listener, for the
      # optional viewer and for curl-based poking. The health probes
      # (/health, /health/liveness, /health/readiness) are always served and
      # need none of this; they report statuses only, and the detail behind
      # them is /management/health.
      [management]
      enabled = true

      [management.endpoints]
      info = "private"
      metrics = "private"
      prometheus = "public"
      env = "admin_only"
      loggers = "admin_only"
      health = "admin_only"
      status = "admin_only"

      # The local EHR index: FerroEHR keeps the subject-to-EHR cross-reference,
      # and EHR_STATUS.subject names a patient by its own namespace and
      # identifier. No [privacy] subject_namespaces, so no pseudonym namespace
      # is in force and a subject reference is stored as the client sends it.
      [record]
      subject_index = "local"

  # FerroPIX's configuration (https://ferropix.eu/docs/operate/configuration.html):
  # the loopback base, the development issuer, one synthetic identifier domain
  # under the OID arc 2.999 (ITU-T X.660 reserves it for examples), and the
  # pseudonymisation domain whose pseudonyms FerroEHR's client mints.
  ferropix-config:
    content: |
      profile = "production"
      public_base_url = "http://localhost:8090"

      [db]
      url_file = "/etc/ferropix/db-url"
      data_key_file = "/var/lib/ferropix-key/data-key"

      # The development issuer signs only client credentials tokens, of the
      # Source and of FerroEHR, so it is a `machines` issuer. It signs plain
      # JWTs (`typ` JWT) rather than the `at+jwt` of RFC 9068 and names the
      # client in `client_id`, so the issuer takes the claims it carries.
      [[auth.issuer]]
      issuer = "http://localhost:8180/quickstart"
      kind = "machines"
      audience = ["http://localhost:8090/fhir"]
      token_types = ["JWT"]
      required_claims = ["iss", "exp", "aud", "sub"]
      client_claims = ["client_id", "azp"]

      # The clients the issuer signs for that may act as a Patient Identity
      # Source.
      [[trust.issuer]]
      issuer = "http://localhost:8180/quickstart"
      clients = ["quickstart-source"]

      [[domain]]
      system = "urn:oid:2.999.1.1"
      name = "Quickstart hospital"
      kind = "local"
      source_client_id = "quickstart-source"

      [[pseudonym_domain]]
      namespace = "urn:oid:2.999.7.1"
      name = "FerroEHR clinical domain"
      consumer_client_id = "ferroehr"

      [usage_report]
      deployment = "compose"
      state_dir = "/var/lib/ferropix"

  # FerroPIX's connection URL, a file because its production profile reads
  # every secret from one.
  ferropix-db-url:
    content: postgresql://ferropix:ferropix@ferropix-postgres:5432/ferropix

  # Creates the `ferropix` role on the first start of ferropix-postgres.
  ferropix-role:
    content: |
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<'SQL'
      CREATE ROLE ferropix LOGIN PASSWORD 'ferropix';
      GRANT CREATE ON DATABASE ferropix TO ferropix;
      SQL

  # The professional PERSON and ROLE templates the ferroehr-definitions one-shot
  # loads: copies of deploy/definitions/professional/ (CC-BY-SA 3.0, adapted
  # from openEHR CKM archetypes; that directory's PROVENANCE.md names each
  # source and change), held equal to the files by a test of the loader.
  ferroehr-definition-person:
    content: |
      archetype (adl_version=2.0.6; rm_release=1.1.0)
          openEHR-DEMOGRAPHIC-PERSON.healthcare_professional.v1.0.0

      language
          original_language = <[ISO_639-1::en]>

      description
          original_author = <
              ["name"] = <"FerroEHR">
              ["organisation"] = <"Cadasto B.V.">
          >
          lifecycle_state = <"unmanaged">
          details = <
              ["en"] = <
                  language = <[ISO_639-1::en]>
                  purpose = <"A healthcare professional's PERSON, whose login identifiers bind the person to their sign-ins.">
                  use = <"Adapted from the openEHR CKM archetypes the derived_from entry names: the person's identifiers in details, the name in identities and a work email in contacts, every element optional so a person provisioned without one is complete.">
                  copyright = <"© openEHR Foundation">
              >
          >
          other_details = <
              ["licence"] = <"This work is licensed under the Creative Commons Attribution-ShareAlike 3.0 License. To view a copy of this license, visit http://creativecommons.org/licenses/by-sa/3.0/.">
              ["derived_from"] = <"openEHR-DEMOGRAPHIC-PERSON.person.v0 (openEHR CKM 1013.1.479, modified 2022-01-20), openEHR-DEMOGRAPHIC-CLUSTER.person_identifier.v0 (openEHR CKM 1013.1.470, modified 2018-12-20), openEHR-DEMOGRAPHIC-PARTY_IDENTITY.person_name.v0 (openEHR CKM 1013.1.477, modified 2019-08-09), openEHR-DEMOGRAPHIC-ADDRESS.electronic_communication.v0 (openEHR CKM 1013.1.486, modified 2019-08-08)">
          >

      definition
          PERSON[id1] matches {
              details matches {
                  ITEM_TREE[id2] matches {
                      items matches {
                          ELEMENT[id3] occurrences matches {0..*} matches {
                              value matches { DV_IDENTIFIER[id13] }
                          }
                      }
                  }
              }
              identities matches {
                  PARTY_IDENTITY[id4] matches {
                      name matches {
                          DV_TEXT[id18]
                          DV_CODED_TEXT[id19] matches {
                              defining_code matches {[ac1]}
                          }
                      }
                      details matches {
                          ITEM_TREE[id5] matches {
                              items matches {
                                  ELEMENT[id6] occurrences matches {0..1} matches {
                                      value matches { DV_TEXT[id14] }
                                  }
                                  ELEMENT[id7] occurrences matches {0..1} matches {
                                      value matches { DV_TEXT[id15] }
                                  }
                                  ELEMENT[id8] occurrences matches {0..1} matches {
                                      value matches { DV_TEXT[id16] }
                                  }
                              }
                          }
                      }
                  }
              }
              contacts matches {
                  CONTACT[id9] occurrences matches {0..1} matches {
                      addresses matches {
                          ADDRESS[id10] matches {
                              name matches {
                                  DV_TEXT[id20]
                                  DV_CODED_TEXT[id21] matches {
                                      defining_code matches {[ac2]}
                                  }
                              }
                              details matches {
                                  ITEM_TREE[id11] matches {
                                      items matches {
                                          ELEMENT[id12] occurrences matches {0..1} matches {
                                              value matches { DV_TEXT[id17] }
                                          }
                                          ELEMENT[id22] occurrences matches {0..1} matches {
                                              value matches {
                                                  DV_TEXT[id23]
                                                  DV_CODED_TEXT[id24] matches {
                                                      defining_code matches {[ac3]}
                                                  }
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

      terminology
          term_definitions = <
              ["en"] = <
                  ["id1"] = <text = <"Healthcare professional"> description = <"A person who provides healthcare.">>
                  ["id2"] = <text = <"Person identifiers"> description = <"The identifiers of the person.">>
                  ["id3"] = <text = <"Identifier main data"> description = <"An identifier of the person, such as a login identifier.">>
                  ["id4"] = <text = <"Person name"> description = <"The name of the person.">>
                  ["id5"] = <text = <"Name"> description = <"The structure of the name.">>
                  ["id6"] = <text = <"Full name"> description = <"The name as it is written in full.">>
                  ["id7"] = <text = <"Given name"> description = <"The given name of the person.">>
                  ["id8"] = <text = <"Family name"> description = <"The family name of the person.">>
                  ["id9"] = <text = <"Contacts"> description = <"The contacts of the person.">>
                  ["id10"] = <text = <"Electronic communication"> description = <"An electronic address of the person.">>
                  ["id11"] = <text = <"Electronic communication details"> description = <"The structure of the address.">>
                  ["id12"] = <text = <"Email address"> description = <"The work email address of the person.">>
                  ["id22"] = <text = <"Usage"> description = <"What the address is used for.">>
                  ["ac1"] = <text = <"Name usages"> description = <"The usages of a person's name.">>
                  ["ac2"] = <text = <"Electronic address types"> description = <"The types of an electronic address.">>
                  ["ac3"] = <text = <"Address usages"> description = <"What an address is used for.">>
                  ["at20"] = <text = <"Reporting name"> description = <"Reporting name.">>
                  ["at21"] = <text = <"Newborn name"> description = <"Newborn name.">>
                  ["at22"] = <text = <"Professional or business name"> description = <"Professional or business name.">>
                  ["at23"] = <text = <"Maiden name"> description = <"Maiden name.">>
                  ["at24"] = <text = <"Legal name"> description = <"Legal name.">>
                  ["at25"] = <text = <"Other name"> description = <"Other name.">>
                  ["at30"] = <text = <"Telephone"> description = <"Telephone.">>
                  ["at31"] = <text = <"Fax"> description = <"Fax.">>
                  ["at32"] = <text = <"Mobile"> description = <"Mobile.">>
                  ["at33"] = <text = <"Pager"> description = <"Pager.">>
                  ["at34"] = <text = <"E-mail"> description = <"E-mail.">>
                  ["at35"] = <text = <"URL"> description = <"URL.">>
                  ["at40"] = <text = <"Personal"> description = <"Personal.">>
                  ["at41"] = <text = <"Business"> description = <"Business.">>
                  ["at42"] = <text = <"Personal/Business"> description = <"Personal/Business.">>
                  ["at43"] = <text = <"Other use"> description = <"Other use.">>
              >
          >
          value_sets = <
              ["ac1"] = <
                  id = <"ac1">
                  members = <"at20", "at21", "at22", "at23", "at24", "at25">
