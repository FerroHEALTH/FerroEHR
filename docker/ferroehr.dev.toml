# Dev-only server configuration for the compose stack.
#
# Mounted into the app container at /etc/ferroehr/ferroehr.toml, which each
# service that mounts it names in FERROEHR_CONFIG (docker-compose.dev.yml
# through docker-compose.yml, docker/sut-ferroehr.yml). Their env vars
# override individual keys on top of this file (layer 3 beats the file).
#
# The out-of-the-box auth posture has authentication ENABLED but no configured
# mechanism, so every API request 401s until a user store is provided. This
# file ships three dev Basic-auth users so the dev lanes authenticate out of
# the box.
#
# DEV DEFAULTS — do NOT use in production. The credentials are:
#   user: ferroehr           password: ferroehr   (Argon2id PHC hash below)
#   user: ferroehr-admin     password: ferroehr   (ADMIN + USER roles)
#   user: ferroehr-readonly  password: ferroehr   (READONLY role; writes 403)
# Each holds every SMART on openEHR scope and the product scope, so the SMART
# layer passes and the RBAC roles decide.

# The declared posture (matches the built-in default; explicit so the dev lanes
# state the posture they test): a sandbox must not hold real patient data.
[deployment]
profile = "sandbox"

[api]
# Dev-only: expose the admin API (`DELETE /admin/...`) so the conformance
# suite's AdminApi cases run against the compose stack (they authenticate as
# the ADMIN-role user below). Production deployments keep this off unless
# operationally needed.
admin = true
terminology = true

# The issuer the Basic users bind under. A Basic user is a person and maps to
# the PERSON carrying its binding key, which [[auth.party]] places under the
# identifier issuer of a persons issuer. This one signs nothing: its key set,
# deploy/hosted/basic-users-jwks.json, which every FerroEHR image carries, is
# the public half of a key pair whose private key was discarded, for local
# lanes only, so no token of it exists.
[[auth.issuer]]
issuer = "https://basic-users.ferroehr.invalid"
kind = "persons"
audience = ["ferroehr-basic-users"]
jwks_file = "/opt/sandbox-posture/basic-users-jwks.json"

[[auth.party]]
issuer = "https://basic-users.ferroehr.invalid"
identifier_issuer = "urn:ferroehr:basic-user"
identifier_type = "login"
group_claim = "groups"
group_identifier_issuer = "urn:ferroehr:groups"

# The issuer of the dev lanes' SCIM provisioning clients: a machines issuer
# over the COMMITTED TEST key set of docs/conformance/party/scim/ (never
# production material), whose private half scripts/scim-provision.sh signs
# with. Each lane mounts the key set at this path. Overlays add their own
# issuers after it (index 2 on).
[[auth.issuer]]
issuer = "https://scim.ferroehr.invalid"
kind = "machines"
audience = ["ferroehr-scim"]
token_types = ["at+jwt"]
jwks_file = "/etc/ferroehr/scim-jwks.json"

# Dev-only: expose the ops-introspection surface (`/management/...`) on the main
# listener so the viewer's Operations panel has something to read and the
# browser E2E battery can exercise it. The surface is OFF by default on the bare
# binary and each endpoint is independently opt-in; production deployments enable
# only what they need, and preferably on a separate internal port
# (`management.port`). The health probes need none of this — `/health`,
# `/health/liveness` and `/health/readiness` are always served, statuses only;
# the detail behind them is `/management/health`.
[management]
enabled = true

# Per-endpoint access levels (dev posture): the read-only introspection an
# authenticated viewer session may see, the Prometheus text left public so a
# scrape needs no credentials, and the sensitive endpoints (the effective
# configuration, the live log-filter control, the health detail and the full
# status document) admin-gated.
[management.endpoints]
info = "private"
metrics = "private"
prometheus = "public"
env = "admin_only"
loggers = "admin_only"
health = "admin_only"
status = "admin_only"

# No token issuer beside the Basic users' one: the CDR reads an issuer's
# metadata at boot, and the dev stack starts Keycloak only under its `keycloak`
# profile. The trust of the
# dev realm (https://keycloak:8443/auth/realms/ferroehr, served with the
# development CA docker-compose.dev.yml generates) rides docker/viewer/e2e-env.yml,
# the overlay the OIDC lanes add beside that profile.

# The read-only terminology extension API (six GETs over the in-process
# openEHR vocabulary bundle) is ON in the dev stack so the viewer's
# terminology browser and code picker work out of the box. Off by default in
# a bare deployment; this flag only mounts reads, never a provider.

# The terminology server for the `terminology` compose profile — absent here
# and added only by an overlay (docker/sut-terminology.yml), so the plain
# quickstart is byte-identical to a deployment without any of this. One server
# answers every terminology the bundled openEHR terminology does not carry:
# BASE docs/architecture_overview/master12-terminology.adoc §"Binding
# Terminology Value-sets to Archetypes" puts the query behind an archetype
# constraint binding in a "terminology query server", and the CDR is its
# client. No openEHR spec governs the client's configuration — our own design.
# [terminology] — present to turn the server on:
# url = "http://terminology:8080/r4b"
# on_error = "accept"

[[auth.basic.users]]
user = "ferroehr"
scopes = ["user/composition-*.cruds", "user/template-*.cruds", "user/aql-*.cruds", "__ferroehr.platform"]
# IMPORTER: the EHR Extract import routes need the import role (#5005).
roles = ["USER", "IMPORTER"]
# Argon2id hash of the password "ferroehr".
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$ZmVycm9laHJEZXZTYWx0$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"

# Dev-only ADMIN account for the admin API (`DELETE /admin/...`) and the
# conformance catalogue's administrative workflows (scripts/conformance.sh
# logs its admin principal in as this user by default). Same dev password "ferroehr" (same hash); ADMIN + USER
# roles. Do NOT use in production.
[[auth.basic.users]]
user = "ferroehr-admin"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$ZmVycm9laHJEZXZTYWx0$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"
scopes = ["user/composition-*.cruds", "user/template-*.cruds", "user/aql-*.cruds", "__ferroehr.platform"]
roles = ["ADMIN", "USER"]

# Dev-only READ-ONLY account for the conformance suite's authorization-
# separation cases: authenticated, but every write operation is
# refused by the RBAC read-only gate. Do NOT use in production.
[[auth.basic.users]]
user = "ferroehr-readonly"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$ZmVycm9laHJEZXZTYWx0$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"
scopes = ["user/composition-*.cruds", "user/template-*.cruds", "user/aql-*.cruds", "__ferroehr.platform"]
roles = ["READONLY"]

# The operations the party store may grant: beside a system client's commit,
# the SCIM provisioning each lane's client is granted in the CDR before it
# provisions (scripts/scim-provision.sh) and the change feed a lane may grant
# a reader.
[authz.grants]
allowed = ["commit_composition", "read_change_feed", "scim_provision"]

# The healthcare provider the dev lanes act for (an example id under the OID
# arc 2.999), and the binding key of each Basic user.
[authz.party_binding]
provider = { issuer = "urn:oid:2.999.7.9", id = "dev" }

[[authz.party_binding.basic_user]]
user = "ferroehr"
key_issuer = "urn:ferroehr:basic-user"
key = "ferroehr"

[[authz.party_binding.basic_user]]
user = "ferroehr-admin"
key_issuer = "urn:ferroehr:basic-user"
key = "ferroehr-admin"

[[authz.party_binding.basic_user]]
user = "ferroehr-readonly"
key_issuer = "urn:ferroehr:basic-user"
key = "ferroehr-readonly"

# The URL clients reach the server at, which every SCIM location names.
[server]
public_base_url = "http://localhost:8080"

# The SCIM endpoint the lanes provision their persons through. Who
# provisions is a scim_provision grant in the CDR: scripts/scim-provision.sh
# grants the `basic-users` client the three Basic users' binding issuer, and
# an overlay that adds a persons issuer has its own client granted, since no
# two clients share a binding_issuer.
[auth.scim]

# The in-instance subject-to-EHR map, the explicit opt-in of a FerroEHR run
# on its own: development, the UI journeys and the conformance lanes ask no
# identity source. Without it the server refuses to start.
[record]
subject_index = "local"

# Any origin may read responses: development and the demo only.
[api.cors]
allow_origins = ["*"]
