# FerroSMART as docker-compose.ferrosmart.yml runs it in front of the
# quickstart's FerroEHR: the SMART App Launch 2.x authorization server that
# issues every token the CDR reads behind it, with an upstream OpenID Connect
# provider for login only. The upstream overlay beside it names the provider
# (docker-compose.ferrosmart-keycloak.yml, docker-compose.ferrosmart-zitadel.yml).
# FerroSMART's own documentation is the reference for every key:
# https://github.com/FerroHEALTH/FerroSMART/blob/ferrosmart-v0.8.0/docs/architecture.md#1310-the-configuration

[server]
# FerroSMART shares the issuer's network namespace with FerroEHR, which holds
# 8080, so it listens on 8280.
listen = "0.0.0.0:8280"

[ferrosmart]
# Plain http on a loopback host, which the family's issuer rule admits
# (RFC 8414 §2 as ferrohealth-smart reads it): a local example. A deployment
# serves FerroSMART over https on its own name.
issuer = "http://localhost:8280"
# The example providers state no eIDAS level of assurance for their logins.
# A deployment in the EU keeps the substantial floor and maps its provider's
# values under [ferrosmart.upstream.assurance] (§13.28).
assurance_minimum = "none"

[ferrosmart.database]
url_file = "/run/secrets/ferrosmart_database_url"
max_connections = 8

[ferrosmart.keys]
private_key_files = ["/run/secrets/ferrosmart_signing_key"]

# FerroSMART's own SMART Backend Services client, which reads a launch
# patient for whom no grant exists yet (§13.33). Its P-384 assertion key is
# its own, never a token key (RFC 8725 §3.12).
[ferrosmart.backend]
algorithm = "ES384"

[ferrosmart.backend.keys]
private_key_file = "/run/secrets/ferrosmart_backend_key"

# FerroEHR's openEHR REST base, the `aud` of every token for it. The patient
# picker looks an EHR up under `subject_namespace`; the overlay sets it from
# FERROSMART_SUBJECT_NAMESPACE.
[[ferrosmart.resource]]
base = "http://localhost:8080/ferroehr/rest/openehr/v1"
kind = "openehr"

# Policy as content (FerroSMART docs/architecture.md §13.6 item 5): the scopes
# a person holding each upstream role may be granted. The SMART on openEHR
# scope families are the ITS-REST draft's (master08 §Resource Scopes).
[[ferrosmart.role]]
name = "CLINICIAN"
scopes = ["user/composition-*.cruds", "user/aql-*.cruds", "user/template-*.r"]

[[ferrosmart.role]]
name = "PATIENT"
scopes = ["patient/composition-*.crs", "patient/aql-*.rs"]

# The clients live in FerroSMART's database: the `ferrosmart-clients` one-shot of
# docker-compose.ferrosmart.yml applies docker/ferrosmart/clients/ and the viewer's
# document docker/ferrosmart/secrets.sh writes (`ferrosmart client apply`, §13.27).
