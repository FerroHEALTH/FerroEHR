# Upstream EHRbase as a CNF system-under-test — composed ONLY by
# `CONF_SUT=ehrbase scripts/conformance.sh` (issue #232: the public CDR
# comparison re-based on the CNF 2.0 pipeline). Fresh volumes per run (the
# exclusive-server ground), its own project network, host port 8091 so it can
# coexist with the ferroehr stack on 8080.
#
# Image + configuration mirror the benchmark harness's upstream side
# (docker/benchmark/docker-compose.yml — the fairness-governed definition):
# the official ehrbase/ehrbase image with its companion ehrbase-v2-postgres,
# Basic auth with a clinical user and a distinct admin user, template
# overwrite allowed for idempotent re-provisioning, and the Admin API active
# (the catalogue's ADMIN chapter drives it).
services:
  ehrbase-db:
    cap_drop: [ALL]
    # The entrypoint starts as root to chown the data directory, then drops to
    # `postgres` — these five are what that needs, against the default fourteen.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    image: ${FERROEHR_EHRBASE_POSTGRES_IMAGE:-ehrbase/ehrbase-v2-postgres:16.2}
    # The same /dev/shm floor as the rs stack (docker/sut-ferroehr.yml
    # ferroehr-postgres) — Docker's default 64MB starves PostgreSQL's dynamic
    # shared memory (`could not resize shared memory segment … No space left
    # on device` during vacuumdb/parallel workers). The resource floor is
    # host environment, not SUT tuning: both comparison sides share it.
    shm_size: ${BENCH_PG_SHM_SIZE:-1gb}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # The image's own contract: its baked createdb.sql reads these EHRBASE_ keys
      # and creates the database `ehrbase` — neither is ours to rename.
      EHRBASE_USER_ADMIN: ehrbase
      EHRBASE_PASSWORD_ADMIN: ehrbase
      EHRBASE_USER: ehrbase_restricted
      EHRBASE_PASSWORD: ehrbase_restricted
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 24

  ehrbase:
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    image: ${FERROEHR_EHRBASE_IMAGE:-ehrbase/ehrbase:2.34.0}
    depends_on:
      ehrbase-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://ehrbase-db:5432/ehrbase
      DB_USER_ADMIN: ehrbase
      DB_PASS_ADMIN: ehrbase
      DB_USER: ehrbase_restricted
      DB_PASS: ehrbase_restricted
      SECURITY_AUTHTYPE: BASIC
      SECURITY_AUTHUSER: ferroehr
      SECURITY_AUTHPASSWORD: ferroehr
      # EHRbase's in-memory user store requires a DISTINCT admin username.
      SECURITY_AUTHADMINUSER: ferroehr-admin
      SECURITY_AUTHADMINPASSWORD: ferroehr
      # The catalogue's admin chapter (physical delete, template admin).
      ADMINAPI_ACTIVE: "true"
      # Duplicate template upload must 409 — a GATING expectation for every
      # server since the 2026-07-28 re-adjudication of register AMB-4 (the
      # released OAS responses/409_template_already_exists.yaml states the
      # trigger where the ITS-REST docs text is silent), no longer an option
      # branch the party statement selects; the runner's provisioning is
      # 409-tolerant, so re-runs stay idempotent.
      SYSTEM_ALLOWTEMPLATEOVERWRITE: "false"
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
    ports:
      - "${FERROEHR_BIND_HOST:-127.0.0.1}:${FERROEHR_EHRBASE_PORT:-8091}:8080"
    # NO container healthcheck: the official image ships no wget/curl, so an
    # in-container probe can never pass and `up --wait` hangs on
    # health:starting forever. Readiness is probed EXTERNALLY by
    # scripts/conformance.sh against /ferroehr/rest/status.
