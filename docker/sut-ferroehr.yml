# The ferroehr CNF SUT stack (compose BASE, self-contained): the conformance
# lanes compose THIS file, never the end-user quickstart docker-compose.yml,
# so the quickstart artifact and the conformance instrument evolve
# independently.
#
# ALL relative paths in this file (and the sut-*.yml overlays stacked on it)
# are REPO-ROOT-relative: the lanes compose with `--project-directory` at the
# repo root (docs.docker.com/reference/cli/docker/compose — relative paths
# resolve against the project directory, which defaults to the first -f
# file's directory and must therefore be pinned explicitly here).
#
# scripts/conformance.sh composes it as the project `ferroehr-cnf`, one
# deployment, with docker/sut-smart.yml + docker/sut-terminology.yml on top
# and `--profile terminology` starting the seeded FHIR R4B server below; the
# instrument logs in with the Basic users of docker/ferroehr.dev.toml.
#
# The SUT builds FROM SOURCE (`runtime-from-source` — a conformance verdict on
# this server is only meaningful against the current sources; SKIP_BUILD pulls
# a published image instead) and mounts docker/ferroehr.dev.toml: three Basic
# users (ferroehr / ferroehr-admin / ferroehr-readonly, password "ferroehr"),
# RBAC ON for the authorization-separation cases, the dev OIDC trust, and the
# disabled terminology providers the sut-terminology overlays switch on.
#
# Build provenance uses the OCI-standard REVISION build-arg only: the server
# Dockerfile bridges it into build.rs so /management/info matches the
# org.opencontainers.image.revision LABEL (scripts/conformance.sh exports it).
#
# Resource ceilings default to the party ixit's documented measurement
# envelope (the committed measured records are environment-bound to the
# 8-CPU/8GB docker VM); the BENCH_* / FERROEHR_* env vars let a measured lane
# match its ixit exactly.

services:
  ferroehr-postgres:
    cap_drop: [ALL]
    # The entrypoint starts as root to chown the data directory, then drops to
    # `postgres` — these five are what that needs, against the default fourteen.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    image: ${FERROEHR_POSTGRES_IMAGE:-ghcr.io/ferrohealth/ferroehr-postgres:local}
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    # Docker's default 64MB /dev/shm starves PostgreSQL's dynamic shared
    # memory under load (parallel workers error `could not resize shared
    # memory segment … No space left on device`), so measured runs keep this
    # floor.
    shm_size: ${BENCH_PG_SHM_SIZE:-1gb}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # App role/database created by the image's init script. The PG_INIT_
      # prefix keeps these out of the server's reserved FERROEHR_ namespace
      # (the strict boot-time env sweep would otherwise reject them).
      PG_INIT_USER: ${PG_INIT_USER:-ferroehr}
      PG_INIT_PASSWORD: ${PG_INIT_PASSWORD:-ferroehr}
      PG_INIT_DB: ${PG_INIT_DB:-ferroehr}
    # The same PG tuning floor the measurement instruments assume
    # (pg_stat_statements so `veredictum aql-probe` can attribute time per
    # statement; negligible overhead, ships in the stock image).
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=${BENCH_PG_SHARED_BUFFERS:-1GB}
      - -c
      - max_wal_size=${BENCH_PG_MAX_WAL_SIZE:-4GB}
      - -c
      - work_mem=${BENCH_PG_WORK_MEM:-16MB}
    volumes:
      - ferroehr-pgdata:/var/lib/postgresql
    ports:
      - "${FERROEHR_BIND_HOST:-127.0.0.1}:${FERROEHR_DB_PORT:-5432}:5432"
    deploy:
      resources:
        limits:
          cpus: "${FERROEHR_DB_CPUS:-4}"
          memory: ${FERROEHR_DB_MEM:-4G}
    # Over TCP: the image's init runs a temporary server on the Unix socket
    # only (listen_addresses='', docker-library/postgres docker-entrypoint.sh),
    # which a socket check reports healthy before the real start.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${PG_INIT_USER:-ferroehr} -d ${PG_INIT_DB:-ferroehr}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ferroehr:
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    image: ${FERROEHR_IMAGE:-ghcr.io/ferrohealth/ferroehr:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
      # Two final targets share one runtime stage; the conformance lanes build
      # the from-source one (CI's prebuilt lane injects FERROEHR_IMAGE).
      target: runtime-from-source
      args:
        REVISION: ${REVISION:-}
        # Lower to 1 on a memory-constrained Docker VM: the release build of
        # the generated spec crates is what exhausts it, and serializing
        # compilation changes no shipped byte (docker/Dockerfile).
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-2}
    depends_on:
      ferroehr-postgres:
        condition: service_healthy
    environment:
      # The server reads the file this names and searches for none.
      FERROEHR_CONFIG: /etc/ferroehr/ferroehr.toml
      FERROEHR__DB__URL: postgres://${PG_INIT_USER:-ferroehr}:${PG_INIT_PASSWORD:-ferroehr}@ferroehr-postgres:5432/${PG_INIT_DB:-ferroehr}
      # Connection-pool ceiling; measured comparison runs raise it in lockstep
      # with the upstream stack's HikariCP pool (config parity — the dominant
      # tunable must match across compared SUTs).
      FERROEHR__DB__MAX_CONNECTIONS: ${FERROEHR__DB__MAX_CONNECTIONS:-10}
      # The openEHR generation set (development | stable) — see the
      # configuration book page for the profile-change contract.
      FERROEHR__SPEC_PROFILE: ${FERROEHR__SPEC_PROFILE:-development}
      # Concurrent-request bound (503 load shed past it). The
      # comparison runs raise it so overload manifests as queueing latency —
      # the same failure mode as upstream's Tomcat admission window — instead
      # of shed errors tripping the stress envelope's error-rate arm.
      FERROEHR__SERVER__MAX_CONCURRENT_REQUESTS: ${FERROEHR__SERVER__MAX_CONCURRENT_REQUESTS:-256}
      # The conformance catalogue uploads operational templates up to 5.4 MB.
      FERROEHR__SERVER__BODY_LIMIT_BYTES: "67108864"
      # Per-caller request-rate limiting ([server.caller_rate]). On, exactly as a
      # production deployment runs it, so the functional catalogue exercises the
      # real posture. The MEASUREMENT overlay (docker/sut-measurement.yml)
      # removes both keys, which switches the limiter off: those instruments
      # offer load past the knee on purpose, and a 429 there would measure the
      # limiter instead of the server.
      FERROEHR__SERVER__CALLER_RATE__REQUESTS_PER_SECOND: ${FERROEHR__SERVER__CALLER_RATE__REQUESTS_PER_SECOND:-1024}
      FERROEHR__SERVER__CALLER_RATE__BURST: ${FERROEHR__SERVER__CALLER_RATE__BURST:-2048}
      # Version-signing toggle pass-through (measured comparison runs disable
      # it for throughput parity — upstream has no signing.)
      FERROEHR__SIGNING__ENABLED: ${FERROEHR__SIGNING__ENABLED:-true}
      FERROEHR__TELEMETRY__FORMAT: ${FERROEHR__TELEMETRY__FORMAT:-pretty}
      # Measurement parity (logging equal and minimal on both SUTs):
      # measured comparison runs set warn on BOTH SUTs; default stays info.
      FERROEHR__TELEMETRY__FILTER: ${FERROEHR__TELEMETRY__FILTER:-info}
      # The conformance SUT reports nothing to FerroPULSE by default: a test
      # harness is not an installation, and outbound traffic would sit inside
      # the measured window.
      FERROEHR__USAGE_REPORT__ENABLED: ${FERROEHR__USAGE_REPORT__ENABLED:-false}
      FERROEHR__USAGE_REPORT__DEPLOYMENT: compose
    volumes:
      # Named by FERROEHR_CONFIG above.
      - ./docker/ferroehr.dev.toml:/etc/ferroehr/ferroehr.toml:ro
    ports:
      - "${FERROEHR_BIND_HOST:-127.0.0.1}:${FERROEHR_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          cpus: "${FERROEHR_CPUS:-4}"
          memory: ${FERROEHR_MEM:-4G}
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferroehr", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # FerroTERM, the FHIR terminology server, behind the `terminology` profile.
  # openEHR models the resolver of an archetype constraint binding as an
  # external "terminology query server" (BASE
  # docs/architecture_overview/master12-terminology.adoc §"Binding Terminology
  # Value-sets to Archetypes": the archetype "simply hold[s] an identifier for
  # a query; the query itself is defined within a 'terminology query server'"),
  # and one server answers for every terminology the bundled openEHR
  # terminology does not carry. This service is that server for the
  # conformance record and for local experimentation; the CDR reaches it
  # through `[terminology.server]` in docker/ferroehr.dev.toml, which stays
  # DISABLED until an overlay enables it:
  #   docker compose -p ferroehr-cnf --profile terminology \
  #     -f docker/sut-ferroehr.yml -f docker/sut-terminology.yml up -d --wait ferroehr
  #
  # The content is the SYNTHETIC shaped seed (docker/terminology/seed/): two
  # code systems shaped like SNOMED CT and LOINC and one value set each, under
  # the reserved example.test domain, mounted READ-ONLY as FerroTERM's FHIR
  # CodeSystem/ValueSet directory. FerroTERM serves what it loads and accepts
  # no writes, so seeding is the mount, never a request. No licensed
  # terminology content is distributed with this repo.
  terminology:
    profiles: [terminology]
    # Digest-pinned FerroTERM 0.1.6, the release docker-compose.terminology.yml
    # and the Helm chart pin; no `:latest`.
    image: ghcr.io/ferrohealth/ferroterm:0.1.6@sha256:7ec4c9622e88e3028faf7c74a2384fb02e57dc3163c282b21274121a26aa3d5b
    environment:
      FERROTERM_CODESYSTEMS: /seed
      FERROTERM_UI: "off"
      FERROTERM_LOG_FORMAT: json
      RUST_LOG: info
      # A test stack is no installation (scripts/checks/usage-report-off.sh).
      FERROTERM__USAGE_REPORT__ENABLED: "false"
    volumes:
      - type: bind
        source: ./docker/terminology/seed
        target: /seed
        read_only: true
    ports:
      - "${FERROEHR_BIND_HOST:-127.0.0.1}:${FERROEHR_TERMINOLOGY_PORT:-8090}:8080"
    # The image is its own health probe (`ferroterm healthcheck`): the
    # distroless base carries no shell and no HTTP client, so the binary sends
    # the one GET /health itself and exits 0 on 200, once the seed is served.
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferroterm", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Distroless, uid 65532, writes nothing while serving: read-only root, every
    # capability dropped.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${FERROEHR_TERMINOLOGY_CPUS:-2}"
          memory: ${FERROEHR_TERMINOLOGY_MEM:-512m}

volumes:
  ferroehr-pgdata:
