# The MEASUREMENT posture overlay — composed on top of docker/sut-ferroehr.yml
# only for the measured-performance (`veredictum perf`) and step-load
# (`veredictum stress`) lanes, which scripts/conformance.sh selects when
# CONF_PERF_CLASS or CONF_STRESS is set.
#
# Why an overlay rather than an environment default: a measurement's posture is
# part of the record, so it must be a file that can be read after the fact, not
# a variable a shell may or may not have exported. Compose merges this onto the
# base service definition (docs.docker.com/compose/how-tos/multiple-compose-files/merge),
# so only the keys below differ from the ordinary SUT — and the base file's
# isolation floor (cap_drop, no-new-privileges) still applies, which is why this
# file must never restate it.
services:
  ferroehr:
    environment:
      # Rate limiting OFF for the duration of a measurement.
      #
      # The instruments deliberately offer load past the server's knee — the
      # step ladder reaches 1024 requests/second, all of it from one principal
      # and one address — so with the limiter on, the ceiling being measured
      # would be `server.caller_rate`, not the server. The functional catalogue
      # keeps the limiter on (the base file's default), so the production
      # posture is still what conformance exercises.
      #
      # This is belt AND braces: both instruments refuse to write a record if
      # the SUT answered any 429, so a measurement can never be silently
      # limiter-shaped even if this overlay is left out.
      #
      # The family section switches the limiter off when the
      # `[server.caller_rate]` table is absent, so the overlay removes both of
      # the base file's keys with Compose's `!reset` tag
      # (docs.docker.com/reference/compose-file/merge/#reset-value), and the
      # server logs `caller rate limiting configured` with `enabled=false` at
      # boot. A huge rate instead truncated the limiter's interval (#4281).
      FERROEHR__SERVER__CALLER_RATE__REQUESTS_PER_SECOND: !reset null
      FERROEHR__SERVER__CALLER_RATE__BURST: !reset null
