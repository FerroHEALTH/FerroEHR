# CNF parallel pgp deployment (compose OVERLAY, stacks LAST).
#
# The conformance pipeline runs BOTH claimed version-signing modes in the ONE
# committed record (RM common master06 §Digital Signature defines digest and
# openPGP as alternative depths of one mechanism, and a running deployment
# realizes exactly one) — so it composes a SECOND deployment of the SAME image
# in the pgp posture, as its own compose project (`-p ferroehr-cnf-pgp`),
# alongside the standard digest stack:
#
#   docker compose -p ferroehr-cnf-pgp --project-directory . \
#     -f docker/sut-ferroehr.yml -f docker/sut-smart.yml \
#     -f docker/sut-signing-pgp.yml -f docker/sut-pgp-parallel.yml \
#     up -d --wait ferroehr
#
# This overlay is the COEXISTENCE half: the project name already isolates
# containers, networks and volumes, but the published HOST ports are global,
# so they are remapped here. `ports` sequences would otherwise be APPENDED by
# compose's merge rules (docs.docker.com/reference/compose-file/merge — "a
# sequence is merged by appending"), which would republish :8080/:5432 and
# collide with the primary stack; the `!override` tag replaces the sequence
# instead (same page, "Replace value with !override").
#
# It never builds: the primary compose builds the image under the SAME
# explicit `image:` tag (docker/sut-ferroehr.yml pins `${FERROEHR_IMAGE}` /
# `${FERROEHR_POSTGRES_IMAGE}`, which are project-independent), so this project
# starts the identical artefact with a different configuration — one build,
# two postures.
services:
  ferroehr-postgres:
    ports: !override
      - "${FERROEHR_BIND_HOST:-127.0.0.1}:${FERROEHR_PGP_DB_PORT:-5433}:5432"

  ferroehr:
    environment:
      # master04 §Services: every advertised services.*.baseUrl is an
      # "Absolute URL to the root of the API", so this deployment must name
      # the origin IT is reached on, not the primary's.
      FERROEHR__SMART__PUBLIC_BASE_URL: "http://localhost:${FERROEHR_PGP_PORT:-8081}"
    ports: !override
      - "${FERROEHR_BIND_HOST:-127.0.0.1}:${FERROEHR_PGP_PORT:-8081}:8080"
