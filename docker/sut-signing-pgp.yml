# CNF pgp-mode signing variant (compose OVERLAY).
#
# Reconfigures the ferroehr SUT to sign committed VERSIONs with an OpenPGP
# (RFC 4880) key instead of the default digest, so the SIG-VERSION `verifiable`
# case exercises real OpenPGP signature verification (RM common master06
# §Digital Signature) — not only the digest recompute.
#
# Usage (overlay on the root stack):
#   docker compose --project-directory . -f docker/sut-ferroehr.yml -f docker/sut-signing-pgp.yml up -d --wait ferroehr
# The reference conformance pipeline composes it UNCONDITIONALLY, as the
# second (parallel) deployment of the same image: scripts/conformance.sh
# stacks it with docker/sut-pgp-parallel.yml under its own project so both
# claimed signing modes are exercised in the ONE committed record, one run.
# The ixit declares that deployment as the `sut_pgp` instance and carries the
# verifying public key in ITS OWN `signing` block; the pgp SIG-VERSION cases
# address it with `on: sut_pgp`.
#
# The mounted key is the committed TEST OpenPGP secret key
# (corpus/keys/cnf-signing.sec.asc) — test-only, no
# passphrase; its paired public key is the pgp ixit's signing.public_key.
services:
  ferroehr:
    environment:
      FERROEHR__SIGNING__MODE: pgp
      FERROEHR__SIGNING__KEY_PATH: /etc/ferroehr/cnf-signing.sec.asc
    volumes:
      - ./corpus/keys/cnf-signing.sec.asc:/etc/ferroehr/cnf-signing.sec.asc:ro
