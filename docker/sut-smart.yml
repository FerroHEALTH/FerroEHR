# CNF SMART on openEHR lane (compose OVERLAY).
#
# Boots the ferroehr SUT in the SMART *resource-server* role so the three
# CDR-side SMART behaviours become executable conformance cases instead of
# statement-declared claims: the service-discovery document
# (ITS-REST docs/smart_app_launch/master04-service_discovery.adoc), the
# master08 resource-scope grammar, and the 403-on-scope-deny discipline.
#
# Usage: this overlay IS the standard conformance posture for ferroehr —
# scripts/conformance.sh composes it on the root stack for every run, so the
# ONE committed record (docs/conformance/ferroehr/) covers the whole
# claimed surface, SMART cases included, in one invocation (owner ruling
# 2026-07-28: no focused lanes, no sidecar artifact directories). The
# instrument logs in with Basic; the SMART documents present RS256 Bearer
# tokens minted from the committed static test issuer.
#
# THE ISSUER IS COMMITTED TEST MATERIAL. `docs/conformance/party/smart/`
# holds a passphrase-less RSA test keypair in public version control, so the
# runner can mint per-case scope-carrying access tokens — the CDR validates
# tokens and never issues them (master06 §Supported Authentication Flows),
# and the conformance stack runs no Authorization Server. Only the PUBLIC
# half is mounted here. Never point a deployment holding real data at this
# issuer: every token it would accept is forgeable by anyone with a checkout.
services:
  ferroehr:
    environment:
      # ── the SMART on openEHR resource-server role ──────────────────────────
      # Every route enforces its SMART on openEHR requirement whenever [auth] is
      # on (master08 §Resource Scopes), so the scope cases run with no switch.
      # The discovery document is built from the issuer's metadata, and the
      # committed test issuer is a key-set FILE with none to read (no
      # Authorization Server runs here), so the committed metadata document
      # supplies the token endpoint SMART App Launch 2.2.0 (Conformance,
      # §Metadata) requires.
      FERROEHR__AUTH__SMART__DISCOVERY: "true"
      FERROEHR__AUTH__SMART__ISSUER_METADATA_FILE: /etc/ferroehr/cnf-smart-issuer-metadata.json
      # master04 §Services: every services.*.baseUrl is an "Absolute URL to the
      # root of the API (required)", so the server needs its public URL.
      FERROEHR__SERVER__PUBLIC_BASE_URL: "http://localhost:8080"
      # ── trust the committed CNF test issuer ───────────────────────────────
      # The lane validates the runner-minted tokens against a STATIC key set, so
      # no Authorization Server has to be running for the scope cases to
      # execute. It is the third [[auth.issuer]] table (index 2), after the
      # issuer the Basic users of docker/ferroehr.dev.toml bind under and its
      # SCIM client's issuer. The
      # runner mints plain RS256 JWTs (`typ` JWT, no `client_id` or `jti`), so
      # the issuer accepts that type and those claims, and its audience stands
      # in for the client the tokens do not name; scripts/conformance.sh grants
      # that client sign_in_persons in the CDR.
      FERROEHR__AUTH__ISSUER__2__ISSUER: "https://as.cnf.test"
      FERROEHR__AUTH__ISSUER__2__KIND: "persons"
      FERROEHR__AUTH__ISSUER__2__AUDIENCE: "cnf-smart-sut"
      FERROEHR__AUTH__ISSUER__2__ALGORITHMS: "RS256"
      FERROEHR__AUTH__ISSUER__2__TOKEN_TYPES: "JWT"
      FERROEHR__AUTH__ISSUER__2__REQUIRED_CLAIMS: "iss,exp,aud,sub"
      FERROEHR__AUTH__ISSUER__2__CLIENT_CLAIMS: "client_id,azp,aud"
      FERROEHR__AUTH__ISSUER__2__JWKS_FILE: /etc/ferroehr/cnf-smart-jwks.json
      FERROEHR__AUTH__PARTY__1__ISSUER: "https://as.cnf.test"
      FERROEHR__AUTH__PARTY__1__IDENTIFIER_ISSUER: "urn:ferroehr:cnf-smart-login"
      FERROEHR__AUTH__PARTY__1__IDENTIFIER_TYPE: "login"
      # The group claim and its identifier issuer, under which a SCIM client's
      # Groups are written once the party mapping provisions Groups.
      FERROEHR__AUTH__PARTY__1__GROUP_CLAIM: "groups"
      FERROEHR__AUTH__PARTY__1__GROUP_IDENTIFIER_ISSUER: "urn:ferroehr:cnf-smart-groups"
    volumes:
      - ./docs/conformance/party/smart/jwks.json:/etc/ferroehr/cnf-smart-jwks.json:ro
      - ./docs/conformance/party/smart/issuer-metadata.json:/etc/ferroehr/cnf-smart-issuer-metadata.json:ro
