# CNF SMART on openEHR lane (compose OVERLAY).
#
# Boots the ferroehr SUT in the SMART *resource-server* role so the three
# CDR-side SMART behaviours become executable conformance cases instead of
# statement-declared claims: the service-discovery document
# (ITS-REST docs/smart_app_launch/master04-service_discovery.adoc), the
# master08 resource-scope grammar, and the 403-on-scope-deny discipline.
#
# Usage: this overlay IS the standard conformance posture for ferroehr —
# scripts/conformance.sh composes it on the root stack for every run, so the
# ONE committed record (docs/conformance/ferroehr/) covers the whole
# claimed surface, SMART cases included, in one invocation (owner ruling
# 2026-07-28: no focused lanes, no sidecar artifact directories). The ixit's
# principals mint scoped RS256 Bearer tokens against the committed static
# test issuer; per-step `scopes:` declarations override the standing grant
# for the SMART boundary cases. The signing lane (sut-signing-pgp.yml)
# STACKS on top of this overlay.
#
# THE ISSUER IS COMMITTED TEST MATERIAL. `docs/conformance/party/smart/`
# holds a passphrase-less RSA test keypair in public version control, so the
# runner can mint per-case scope-carrying access tokens — the CDR validates
# tokens and never issues them (master06 §Supported Authentication Flows),
# and the conformance stack runs no Authorization Server. Only the PUBLIC
# half is mounted here. Never point a deployment holding real data at this
# issuer: every token it would accept is forgeable by anyone with a checkout.
services:
  ferroehr:
    environment:
      # ── the SMART resource-server role ────────────────────────────────────
      FERROEHR__SMART__ENABLED: "true"
      # master04 §Capabilities: advertising `openehr-permission-v1` is the
      # declaration that the scope layer decides an ungranted resource family.
      FERROEHR__SMART__REQUIRE_SMART_SCOPES: "true"
      # master04 §Services: every services.*.baseUrl is an "Absolute URL to the
      # root of the API (required)", so the server needs its external origin.
      # This is the origin the runner reaches the composed SUT on.
      FERROEHR__SMART__PUBLIC_BASE_URL: "http://localhost:8080"
      # ...and that origin is plaintext, because the lane composes over a local
      # bridge network with no TLS anywhere. Boot validation refuses a non-https
      # `public_base_url` or advertised endpoint (RFC 6749 §3.1.2.1, RFC 8414
      # §6.2 — the discovery document tells third-party applications where to
      # get tokens, so a plaintext endpoint exposes the code and the token to
      # anyone on the path), and this flag is the named development escape it
      # points at. It belongs HERE and never in a deployed configuration: a real
      # SMART deployment publishes https endpoints or publishes nothing.
      FERROEHR__SMART__ENDPOINTS__ALLOW_INSECURE_ENDPOINTS: "true"
      # master04 §Authentication Endpoints — the external Authorization
      # Server's endpoints, advertised verbatim. The CDR implements none of
      # them, so example.com literals are the honest declaration for a lane
      # whose tokens are minted by the runner rather than obtained from an AS.
      FERROEHR__SMART__ENDPOINTS__AUTHORIZATION_ENDPOINT: "https://as.cnf.test/authorize"
      FERROEHR__SMART__ENDPOINTS__TOKEN_ENDPOINT: "https://as.cnf.test/token"
      FERROEHR__SMART__ENDPOINTS__JWKS_URI: "https://as.cnf.test/jwks.json"
      # master06 §Deprecated Flows: implicit and resource-owner-password MUST
      # NOT be advertised (SmartConfig::validate rejects them at boot).
      FERROEHR__SMART__ENDPOINTS__GRANT_TYPES_SUPPORTED: "authorization_code,client_credentials"
      FERROEHR__SMART__ENDPOINTS__RESPONSE_TYPES_SUPPORTED: "code"
      # Boot validation refuses an EMPTY list here: a document advertising a
      # token endpoint and no client-authentication method describes an
      # authorization server that authenticates no client at all. RFC 8414 §2
      # marks the field optional with an implied `client_secret_basic`, but the
      # CDR will not guess on an operator's behalf about an AS it does not run.
      # Both listed values are the SMART App Launch ones matching the grants
      # advertised above.
      FERROEHR__SMART__ENDPOINTS__TOKEN_ENDPOINT_AUTH_METHODS_SUPPORTED: "client_secret_basic,private_key_jwt"
      FERROEHR__SMART__ENDPOINTS__CODE_CHALLENGE_METHODS_SUPPORTED: "S256"
      # ── trust the committed CNF test issuer ───────────────────────────────
      # Overrides the dev config's Keycloak issuer: the lane validates the
      # runner-minted tokens against a STATIC JWKS, so no Authorization Server
      # has to be running for the scope cases to execute.
      FERROEHR__AUTH__OIDC__ISSUER: "https://as.cnf.test"
      FERROEHR__AUTH__OIDC__AUDIENCES: "cnf-smart-sut"
      FERROEHR__AUTH__OIDC__ALGORITHMS: "RS256"
      FERROEHR__AUTH__OIDC__JWKS_JSON_FILE: /etc/ferroehr/cnf-smart-jwks.json
    volumes:
      - ./docs/conformance/party/smart/jwks.json:/etc/ferroehr/cnf-smart-jwks.json:ro
