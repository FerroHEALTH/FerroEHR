# Compose override for the E2E runs (scripts/ui-e2e.sh). The composed viewer
# image (UI_E2E_IMAGE=1) receives the same OIDC test wiring the host-mode
# harness passes as process env. The issuer uses the in-network hostname at
# the aligned port (docker-compose.dev.yml keycloak KC_HTTPS_PORT) so the SAME
# URL resolves for the container (docker DNS) and for the E2E browser (a
# chromedriver host-resolver mapping of `keycloak` to 127.0.0.1). The client
# secret is the shipped DEV realm's (docker/keycloak/import), test-only, never
# a production credential.
#
# The CDR trusts the dev realm here, in both modes: Keycloak serves the issuer
# over TLS with the development CA `keycloak-tls` generates
# (docker-compose.dev.yml), and the CDR and the viewer add that CA beside
# their own trust store (the CDR through `[auth] ca_file`, the viewer through
# `[auth.oidc.tls] trust_roots_file`). The CDR reads the issuer's metadata at boot, so it waits for
# Keycloak. Keycloak's access tokens carry `typ: JWT`, outside the RFC 9068
# profile the CDR expects by default, hence `token_profile = "jwt"`.
#
# The CDR block turns two opt-in extensions on for the run, both of which
# answer `404` as if unmounted while they are off — so the viewer's journeys
# over them would otherwise have nothing but a disabled empty state to drive:
# the terminology surface (`[terminology] api_enabled`) and the
# event-subscription admin API (`[events] admin_api`). The mechanical `__` env
# mapping addresses the same TOML keys (app/ferroehr/assets/ferroehr.default.toml).
#
# `[events] admin_api` is deliberately alone: the subscription CRUD is a
# database store, so it needs no broker and no `[events] enabled` — turning the
# publisher on without a reachable AMQP broker would only add a retry loop to
# the run.
services:
  ferroehr:
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      FERROEHR__TERMINOLOGY__API_ENABLED: "true"
      FERROEHR__EVENTS__ADMIN_API: "true"
      FERROEHR__AUTH__ISSUER: https://keycloak:8443/auth/realms/ferroehr
      FERROEHR__AUTH__AUDIENCE: ferroehr
      FERROEHR__AUTH__TOKEN_PROFILE: jwt
      FERROEHR__AUTH__ROLE_CLAIMS: roles,groups,entitlements,realm_access.roles
      FERROEHR__AUTH__CA_FILE: /run/ferroehr-dev-tls/ca/ca.crt
    volumes:
      - keycloak-tls:/run/ferroehr-dev-tls:ro

  ferroehr-viewer:
    environment:
      FERROEHR_VIEWER__CDR__BASE_URL: http://ferroehr:8080
      # The e2e stack serves plain HTTP, so the secure-by-default session
      # cookie flag opts out here (production behind TLS needs nothing).
      FERROEHR_VIEWER__SESSION__COOKIE_SECURE: "false"
      FERROEHR_VIEWER__AUTH__OIDC__ENABLED: "true"
      FERROEHR_VIEWER__AUTH__OIDC__ISSUER: https://keycloak:8443/auth/realms/ferroehr
      FERROEHR_VIEWER__AUTH__OIDC__CLIENT_ID: ferroehr
      FERROEHR_VIEWER__AUTH__OIDC__CLIENT_SECRET: bT5T4oWn3xNdBytQsl2cfpBDi1pp15Va
      FERROEHR_VIEWER__AUTH__OIDC__PUBLIC_BASE_URL: http://127.0.0.1:3000
      FERROEHR_VIEWER__AUTH__OIDC__TLS__TRUST_ROOTS_FILE: /run/ferroehr-dev-tls/ca/ca.crt
    volumes:
      - keycloak-tls:/run/ferroehr-dev-tls:ro
