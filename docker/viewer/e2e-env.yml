# Compose override for the E2E runs (scripts/ui-e2e.sh). The composed viewer
# image (UI_E2E_IMAGE=1) receives the same OIDC test wiring the host-mode
# harness passes as process env. The issuer uses the in-network hostname at
# the aligned port (docker-compose.dev.yml keycloak KC_HTTPS_PORT) so the SAME
# URL resolves for the container (docker DNS) and for the E2E browser (a
# chromedriver host-resolver mapping of `keycloak` to 127.0.0.1). The client
# secret is the shipped DEV realm's (docker/keycloak/import), test-only, never
# a production credential.
#
# The CDR trusts the dev realm here, in both modes: Keycloak serves the issuer
# over TLS with the development CA `keycloak-tls` generates
# (docker-compose.dev.yml), and the CDR and the viewer add that CA beside
# their own trust store (the CDR through `[auth] ca_file`, the viewer through
# `[oidc] ca_file`). The CDR reads the issuer's metadata at
# boot, so it waits for Keycloak. Keycloak's access tokens carry `typ: JWT`,
# outside the RFC 9068 profile the CDR expects by default, hence
# `token_profile = "jwt"`.
#
# The CDR block turns the terminology surface (`[terminology] api_enabled`) on
# for the run; it answers `404` as if unmounted while it is off, so the
# viewer's journeys over it would otherwise have nothing but a disabled empty
# state to drive. The mechanical `__` env mapping addresses the same TOML key
# (app/ferroehr/assets/ferroehr.default.toml).
services:
  ferroehr:
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      FERROEHR__TERMINOLOGY__API_ENABLED: "true"
      # The realm is the second [[auth.issuer]] table (index 1), beside the
      # issuer the Basic users of docker/ferroehr.dev.toml bind under.
      FERROEHR__AUTH__ISSUER__1__ISSUER: https://keycloak:8443/auth/realms/ferroehr
      FERROEHR__AUTH__ISSUER__1__KIND: persons
      FERROEHR__AUTH__ISSUER__1__PROFILE: keycloak
      FERROEHR__AUTH__ISSUER__1__AUDIENCE: ferroehr
      FERROEHR__AUTH__ISSUER__1__FIRST_PARTY_CLIENTS: ferroehr-viewer
      FERROEHR__AUTH__ISSUER__1__APP_ONLY__0__CLAIM: client_id
      FERROEHR__AUTH__ISSUER__1__APP_ONLY__0__VALUE: ferroehr-service
      FERROEHR__AUTH__ISSUER__1__ROLE_CLAIMS: roles,groups,entitlements,realm_access.roles
      FERROEHR__AUTH__PARTY__1__ISSUER: https://keycloak:8443/auth/realms/ferroehr
      FERROEHR__AUTH__PARTY__1__IDENTIFIER_ISSUER: urn:ferroehr:keycloak-dev-login
      FERROEHR__AUTH__PARTY__1__IDENTIFIER_TYPE: uuid
      FERROEHR__AUTHZ__RBAC__ROLE_ISSUERS: https://keycloak:8443/auth/realms/ferroehr
      FERROEHR__AUTH__CA_FILE: /run/ferroehr-dev-tls/ca/ca.crt
      # The realm's service client, whose system/aql-* grant counts only when
      # it is named here (SMART on openEHR §Resource Scopes).
      FERROEHR__SMART__BACKEND_CLIENTS: ferroehr-service
    volumes:
      - keycloak-tls:/run/ferroehr-dev-tls:ro

  ferroehr-viewer:
    environment:
      FERROEHR_VIEWER__CDR__BASE_URL: http://ferroehr:8080
      # The e2e stack serves plain HTTP, so the secure-by-default session
      # cookie flag opts out here (production behind TLS needs nothing).
      FERROEHR_VIEWER__SESSION__SECURE_COOKIE: "false"
      FERROEHR_VIEWER__AUTH__OIDC_ENABLED: "true"
      FERROEHR_VIEWER__OIDC__ISSUER: https://keycloak:8443/auth/realms/ferroehr
      FERROEHR_VIEWER__OIDC__CLIENT_ID: ferroehr-viewer
      FERROEHR_VIEWER__OIDC__CLIENT_SECRET: dev-viewer-Qm7xT2vK9pLw4sNc
      FERROEHR_VIEWER__AUTH__PUBLIC_BASE_URL: http://127.0.0.1:3000
      FERROEHR_VIEWER__OIDC__CA_FILE: /run/ferroehr-dev-tls/ca/ca.crt
    volumes:
      - keycloak-tls:/run/ferroehr-dev-tls:ro
