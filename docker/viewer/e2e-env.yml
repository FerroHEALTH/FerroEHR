# Compose override for the E2E runs (scripts/ui-e2e.sh). The composed viewer
# image (UI_E2E_IMAGE=1) receives the same OIDC test wiring the host-mode
# harness passes as process env. The issuer uses the in-network hostname at
# the aligned port (docker-compose.dev.yml keycloak KC_HTTPS_PORT) so the SAME
# URL resolves for the container (docker DNS) and for the E2E browser (a
# chromedriver host-resolver mapping of `keycloak` to 127.0.0.1). The client
# secret is the shipped DEV realm's (docker/keycloak/import), test-only, never
# a production credential.
#
# The CDR trusts the dev realm here, in both modes: Keycloak serves the issuer
# over TLS with the development CA `keycloak-tls` generates
# (docker-compose.dev.yml), which publishes no revocation service, and the CDR
# and the viewer add that CA beside their own trust store with no revocation
# check (the CDR through `[auth.tls] trust_roots_without_revocation_file`, the
# viewer through `[oidc.tls] trust_roots_without_revocation_file`). The CDR
# reads the issuer's metadata at boot, so it waits for Keycloak. Keycloak's
# access tokens carry `typ: JWT`, outside the RFC 9068 profile the CDR expects
# by default, which the `keycloak` profile admits.
#
# The CDR block turns the terminology surface (`[terminology] api_enabled`) on
# for the run; it answers `404` as if unmounted while it is off, so the
# viewer's journeys over it would otherwise have nothing but a disabled empty
# state to drive. The mechanical `__` env mapping addresses the same TOML key
# (app/ferroehr/assets/ferroehr.default.toml).
services:
  ferroehr:
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      FERROEHR__API__TERMINOLOGY: "true"
      # The purposes of use the viewer's Reading tab offers (#6105).
      FERROEHR__AUDIT__PURPOSE_CODES: TREAT,ETREAT
      # The realm is the issuer named `keycloak`, beside the `basic_users` and
      # `scim` issuers of docker/ferroehr.dev.toml.
      FERROEHR__AUTH__ISSUER__KEYCLOAK__ISSUER: https://keycloak:8443/auth/realms/ferroehr
      FERROEHR__AUTH__ISSUER__KEYCLOAK__AUDIENCE: ferroehr
      # Keycloak signs its access tokens with `typ: JWT`; the realm's mappers put
      # `client_id` in every token and the service client's id in its `sub`.
      FERROEHR__AUTH__ISSUER__KEYCLOAK__PROFILE__TOKEN_TYPES: JWT
      FERROEHR__AUTH__ISSUER__KEYCLOAK__ROLE_CLAIMS: roles,groups,entitlements,realm_access.roles
      FERROEHR__AUTH__ISSUER__KEYCLOAK__PARTY__IDENTIFIER_ISSUER: urn:example:keycloak-dev-login
      FERROEHR__AUTH__ISSUER__KEYCLOAK__PARTY__IDENTIFIER_TYPE: login
      # The group claim and its identifier issuer, under which a SCIM client's
      # Groups are written once the party mapping provisions Groups.
      FERROEHR__AUTH__ISSUER__KEYCLOAK__PARTY__GROUP_CLAIM: groups
      FERROEHR__AUTH__ISSUER__KEYCLOAK__PARTY__GROUP_IDENTIFIER_ISSUER: urn:example:keycloak-dev-groups
      FERROEHR__AUTHZ__RBAC__ROLE_ISSUERS: keycloak
      # The test-only grant ceiling: the dev set of docker/ferroehr.dev.toml,
      # which admits every operation the demo seed's roles grant.
      FERROEHR__AUTHZ__GRANTS__ALLOWED: commit_composition,read_change_feed,scim_provision,hold_roles,hold_scopes,write_access_policy,write_care_relationship,write_representation,access_service,import_ehr
      FERROEHR__AUTH__TLS__TRUST_ROOTS_WITHOUT_REVOCATION_FILE: /run/ferroehr-dev-tls/ca/ca.crt
      # Versions and access-log checkpoints signed with ML-DSA-65+Ed25519, so
      # the viewer draws a real signature: the committed TEST key of
      # docker/signing/, never a production key.
      FERROEHR__RECORD__SIGNING__MODE: pgp
      FERROEHR__RECORD__SIGNING__KEY_FILE: /etc/ferroehr/version-signing-test.key.asc
      # A cohort predicate the cohort journey selects its EHRs by: the city
      # ELEMENT of the PERSON archetype it writes.
      FERROEHR__PRIVACY__COHORT__PREDICATES__CITY__ARCHETYPE: openEHR-DEMOGRAPHIC-PERSON.person.v1
      FERROEHR__PRIVACY__COHORT__PREDICATES__CITY__NODE: at0012
      FERROEHR__PRIVACY__COHORT__PREDICATES__CITY__KIND: text
      # An audit repository that refuses every record (a path the CDR itself
      # answers 404), so the delivery journey finds parked records to act on.
      FERROEHR__AUDIT__FHIR_FEED__ENDPOINT__URL: http://127.0.0.1:8080/no-audit-repository
    volumes:
      - keycloak-tls:/run/ferroehr-dev-tls:ro
    configs:
      - source: ferroehr-version-signing-test-key
        target: /etc/ferroehr/version-signing-test.key.asc

  ferroehr-viewer:
    environment:
      FERROEHR_VIEWER__CDR__BASE_URL: http://ferroehr:8080
      # The e2e stack serves plain HTTP, so the secure-by-default session
      # cookie flag opts out here (production behind TLS needs nothing).
      FERROEHR_VIEWER__SESSION__SECURE_COOKIE: "false"
      FERROEHR_VIEWER__AUTH__OIDC_ENABLED: "true"
      FERROEHR_VIEWER__OIDC__ISSUER: https://keycloak:8443/auth/realms/ferroehr
      FERROEHR_VIEWER__OIDC__CLIENT_ID: ferroehr-viewer
      FERROEHR_VIEWER__OIDC__CLIENT_SECRET: dev-viewer-Qm7xT2vK9pLw4sNc
      FERROEHR_VIEWER__AUTH__PUBLIC_BASE_URL: http://127.0.0.1:3000
      FERROEHR_VIEWER__OIDC__TLS__TRUST_ROOTS_WITHOUT_REVOCATION_FILE: /run/ferroehr-dev-tls/ca/ca.crt
    volumes:
      - keycloak-tls:/run/ferroehr-dev-tls:ro

configs:
  ferroehr-version-signing-test-key:
    file: ./docker/signing/version-signing-test.key.asc
