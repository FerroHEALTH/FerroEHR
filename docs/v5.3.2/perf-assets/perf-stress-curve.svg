.notearned { fill: #b3261e; font-weight: 600; }
.slo { stroke: #b3261e; stroke-width: 1.5; stroke-dasharray: 6 4; }
.slotext { fill: #b3261e; font-size: 11px; }
.sut { stroke: #2a78d6; fill: none; stroke-width: 1.8; }
.db { stroke: #8a8880; fill: none; stroke-width: 1.6; stroke-dasharray: 5 3; }
.warm { fill: #efede8; }
.curve { stroke: #2a78d6; fill: none; stroke-width: 2; }
.cmp { stroke: #8a8880; fill: none; stroke-width: 2; stroke-dasharray: 7 4; }
.cmpfill { fill: #8a8880; }
.knee { stroke: #1baf7a; stroke-width: 2; stroke-dasharray: 2 3; }
@media (prefers-color-scheme: dark) {
text { fill: #c3c2b7; }
.title { fill: #ffffff; }
.muted { fill: #8f8e85; }
.grid { stroke: #3a3a38; }
.p50 { fill: #3d5f82; } .p90 { fill: #3987e5; } .p99 { fill: #9ec7ef; }
.measured { fill: #3987e5; }
.floor { stroke: #8f8e85; }
.earned { fill: #26c78d; }
.notearned { fill: #e5484d; }
.slo { stroke: #e5484d; }
.slotext { fill: #e5484d; }
.sut { stroke: #3987e5; }
.db { stroke: #8f8e85; }
.warm { fill: #2a2a28; }
.curve { stroke: #3987e5; }
.cmp { stroke: #8f8e85; }
.cmpfill { fill: #8f8e85; }
.knee { stroke: #26c78d; }
}
</style>
<text x="24" y="28" class="title">Latency-throughput curve — step-load stress to the maximum sustainable throughput</text>
<text x="24" y="44" class="muted">Short intense load steps (120 s hold) on the cnf.scale.10k corpus · exploration only — never a conformance record</text>
<text x="24" y="59" class="muted">Circles hold the envelope, crosses breach it; the dotted line is the last rate held inside the envelope — the knee.</text>
