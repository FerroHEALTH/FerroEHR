<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" width="640" height="292" role="img">
<style>
text { fill: #52514e; font: 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.title { fill: #0b0b0b; font-weight: 600; }
.muted { fill: #8a8880; font-size: 11px; }
.grid { stroke: #e4e2dd; stroke-width: 1; }
.p50 { fill: #7db4ea; } .p90 { fill: #3d7fd0; } .p99 { fill: #1b5cab; }
.measured { fill: #2a78d6; }
.floor { fill: none; stroke: #8a8880; stroke-width: 1.5; stroke-dasharray: 4 3; }
.earned { fill: #1baf7a; font-weight: 600; }
.notearned { fill: #b3261e; font-weight: 600; }
.slo { stroke: #b3261e; stroke-width: 1.5; stroke-dasharray: 6 4; }
.slotext { fill: #b3261e; font-size: 11px; }
.sut { stroke: #2a78d6; fill: none; stroke-width: 1.8; }
.db { stroke: #8a8880; fill: none; stroke-width: 1.6; stroke-dasharray: 5 3; }
.warm { fill: #efede8; }
.curve { stroke: #2a78d6; fill: none; stroke-width: 2; }
.cmp { stroke: #8a8880; fill: none; stroke-width: 2; stroke-dasharray: 7 4; }
.cmpfill { fill: #8a8880; }
.knee { stroke: #1baf7a; stroke-width: 2; stroke-dasharray: 2 3; }
@media (prefers-color-scheme: dark) {
text { fill: #c3c2b7; }
.title { fill: #ffffff; }
.muted { fill: #8f8e85; }
.grid { stroke: #3a3a38; }
.p50 { fill: #3d5f82; } .p90 { fill: #3987e5; } .p99 { fill: #9ec7ef; }
.measured { fill: #3987e5; }
.floor { stroke: #8f8e85; }
.earned { fill: #26c78d; }
.notearned { fill: #e5484d; }
.slo { stroke: #e5484d; }
.slotext { fill: #e5484d; }
.sut { stroke: #3987e5; }
.db { stroke: #8f8e85; }
.warm { fill: #2a2a28; }
.curve { stroke: #3987e5; }
.cmp { stroke: #8f8e85; }
.cmpfill { fill: #8f8e85; }
.knee { stroke: #26c78d; }
}
</style>
<text x="24" y="28" class="title">Performance class ladder — offered-load floors vs measured sustained load</text>
<text x="24" y="48" class="muted">Floors are the request rate the hospital-simulation workload must sustain against the class corpus.</text>
<text x="24" y="63" class="muted">A class is earned only with p99 &#8804; 1 s on every measured operation and zero errors under that load.</text>
<line x1="170.0" y1="92" x2="170.0" y2="268.0" class="grid"/><text x="170.0" y="284.0" class="muted" text-anchor="middle">1/s</text>
<line x1="264.9" y1="92" x2="264.9" y2="268.0" class="grid"/><text x="264.9" y="284.0" class="muted" text-anchor="middle">10/s</text>
<line x1="359.8" y1="92" x2="359.8" y2="268.0" class="grid"/><text x="359.8" y="284.0" class="muted" text-anchor="middle">100/s</text>
<line x1="454.7" y1="92" x2="454.7" y2="268.0" class="grid"/><text x="454.7" y="284.0" class="muted" text-anchor="middle">1000/s</text>
<text x="24" y="108.0">class POC</text><text x="24" y="122.0" class="muted">floor 2/s</text>
<rect x="170" y="100.0" width="28.6" height="16" rx="4" class="floor"/>
<rect x="170" y="100.0" width="29.3" height="16" rx="4" class="measured"/>
<text x="516" y="113.0" class="earned">EARNED</text>
<text x="24" y="152.0">class S</text><text x="24" y="166.0" class="muted">floor 15/s</text>
<rect x="170" y="144.0" width="111.6" height="16" rx="4" class="floor"/>
<text x="516" y="157.0" class="muted">not measured</text>
<text x="24" y="196.0">class L</text><text x="24" y="210.0" class="muted">floor 150/s</text>
<rect x="170" y="188.0" width="206.5" height="16" rx="4" class="floor"/>
<text x="516" y="201.0" class="muted">not measured</text>
<text x="24" y="240.0">class R</text><text x="24" y="254.0" class="muted">floor 1500/s</text>
<rect x="170" y="232.0" width="301.4" height="16" rx="4" class="floor"/>
<text x="516" y="245.0" class="muted">not measured</text>
</svg>
