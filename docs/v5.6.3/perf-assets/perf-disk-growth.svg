<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" width="640" height="312" role="img">
<style>
text { fill: #52514e; font: 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.title { fill: #0b0b0b; font-weight: 600; }
.muted { fill: #8a8880; font-size: 11px; }
.grid { stroke: #e4e2dd; stroke-width: 1; }
.p50 { fill: #7db4ea; } .p90 { fill: #3d7fd0; } .p99 { fill: #1b5cab; }
.measured { fill: #2a78d6; }
.floor { fill: none; stroke: #8a8880; stroke-width: 1.5; stroke-dasharray: 4 3; }
.earned { fill: #1baf7a; font-weight: 600; }
.notearned { fill: #b3261e; font-weight: 600; }
.slo { stroke: #b3261e; stroke-width: 1.5; stroke-dasharray: 6 4; }
.slotext { fill: #b3261e; font-size: 11px; }
.sut { stroke: #2a78d6; fill: none; stroke-width: 1.8; }
.db { stroke: #8a8880; fill: none; stroke-width: 1.6; stroke-dasharray: 5 3; }
.warm { fill: #efede8; }
.curve { stroke: #2a78d6; fill: none; stroke-width: 2; }
.cmp { stroke: #8a8880; fill: none; stroke-width: 2; stroke-dasharray: 7 4; }
.cmpfill { fill: #8a8880; }
.knee { stroke: #1baf7a; stroke-width: 2; stroke-dasharray: 2 3; }
@media (prefers-color-scheme: dark) {
text { fill: #c3c2b7; }
.title { fill: #ffffff; }
.muted { fill: #8f8e85; }
.grid { stroke: #3a3a38; }
.p50 { fill: #3d5f82; } .p90 { fill: #3987e5; } .p99 { fill: #9ec7ef; }
.measured { fill: #3987e5; }
.floor { stroke: #8f8e85; }
.earned { fill: #26c78d; }
.notearned { fill: #e5484d; }
.slo { stroke: #e5484d; }
.slotext { fill: #e5484d; }
.sut { stroke: #3987e5; }
.db { stroke: #8f8e85; }
.warm { fill: #2a2a28; }
.curve { stroke: #3987e5; }
.cmp { stroke: #8f8e85; }
.cmpfill { fill: #8f8e85; }
.knee { stroke: #26c78d; }
}
</style>
<text x="24" y="28" class="title">Disk growth — database volume across the class POC measured run</text>
<text x="24" y="48" class="muted">The volume's on-disk size at the run's four anchors, probed read-only inside the DB container.</text>
<text x="24" y="63" class="muted">The scale-seed step yields the storage cost per committed composition · measured context, never a verdict input.</text>
<line x1="60" y1="244" x2="580" y2="244" class="grid"/>
<text x="120.0" y="262.0" class="muted" text-anchor="middle">empty</text>
<rect x="78.0" y="242.0" width="84" height="2.0" rx="4" class="measured"/><text x="120.0" y="234.0" text-anchor="middle">133 MB</text>
<text x="260.0" y="262.0" class="muted" text-anchor="middle">after scale seed</text>
<rect x="218.0" y="106.4" width="84" height="137.6" rx="4" class="measured"/><text x="260.0" y="98.4" text-anchor="middle">13 GB</text>
<text x="400.0" y="262.0" class="muted" text-anchor="middle">after ward seed</text>
<rect x="358.0" y="100.0" width="84" height="144.0" rx="4" class="measured"/><text x="400.0" y="92.0" text-anchor="middle">13 GB</text>
<text x="540.0" y="262.0" class="muted" text-anchor="middle">after window</text>
<rect x="498.0" y="100.6" width="84" height="143.4" rx="4" class="measured"/><text x="540.0" y="92.6" text-anchor="middle">13 GB</text>
<text x="260" y="278.0" class="muted" text-anchor="middle">&#8776; 13 KB / composition (1,000,000 committed)</text>
