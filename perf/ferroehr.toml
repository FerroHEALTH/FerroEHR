# The server configuration of the performance gate (scripts/perf/gate.sh):
# the shipped defaults with two Basic users for the request set, bound through
# SCIM as the development configuration binds its users, and the EHR index
# kept local, so the gate measures FerroEHR and no FerroPIX. The background
# workers run as the defaults start them. The administrator seeds the access
# policy, the care relationships and the EHRs' directives through the ADMIN
# and demographic routes, and the clinician reads and writes under them, so
# every clinical group runs the access evaluator with care relationships and
# clearances in force (#5590). The access log signs each link with the OpenPGP
# key scripts/perf/gate.sh generates for the run and mounts where
# [record.signing] names it.

[deployment]
profile = "sandbox"

# The issuer the Basic user binds under. It signs nothing: its key set, which
# every FerroEHR image carries, is the public half of a key pair whose private
# key was discarded.
[[auth.issuer]]
issuer = "https://basic-users.ferroehr.invalid"
kind = "persons"
audience = ["ferroehr-basic-users"]
jwks_file = "/opt/sandbox-posture/basic-users-jwks.json"

[[auth.party]]
issuer = "https://basic-users.ferroehr.invalid"
identifier_issuer = "urn:ferroehr:basic-user"
identifier_type = "login"

# The issuer of the provisioning client scripts/perf/gate.sh binds the Basic
# user through: a machines issuer over the COMMITTED TEST key set of
# docs/conformance/party/scim/ (never production material).
[[auth.issuer]]
issuer = "https://scim.ferroehr.invalid"
kind = "machines"
audience = ["ferroehr-scim"]
token_types = ["at+jwt"]
jwks_file = "/etc/ferroehr/scim-jwks.json"

# ferroehr / ferroehr (Argon2id), the request set's one caller: the first
# administrator, holding ADMIN and the product scope, whose PERSON
# scripts/scim-provision.sh grants its other scopes and the USER role.
[[auth.basic.users]]
user = "ferroehr"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$ZmVycm9laHJEZXZTYWx0$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"

# clinician / clinician (Argon2id), the professional the clinical groups run
# as: no administrator, so a care relationship and a clearance decide.
[[auth.basic.users]]
user = "clinician"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$ZmVycm9laHJQZXJmU2FsdA$3pUvm08CX3uvjvMBwkvqIWbox3KtS9Ih8+IB6CAPfY4"

[authz.rbac]
enabled = false
first_admin = "ferroehr"

# The operations the gate grants in the CDR: its provisioning client's
# scim_provision before it provisions the Basic users, then their scopes and
# roles (scripts/scim-provision.sh), and the administrator's care relationship
# and access policy writes; access_service lets an opt-out be committed, and
# access_demographic carries the clinician's clearance.
[authz.grants]
allowed = ["commit_composition", "scim_provision", "hold_roles", "hold_scopes",
  "write_care_relationship", "write_access_policy", "access_service", "access_demographic"]

[authz.party_binding]
provider = { issuer = "urn:oid:2.999.7.9", id = "perf" }

[[authz.party_binding.basic_user]]
user = "ferroehr"
key_issuer = "urn:ferroehr:basic-user"
key = "ferroehr"

[[authz.party_binding.basic_user]]
user = "clinician"
key_issuer = "urn:ferroehr:basic-user"
key = "clinician"

# The ADMIN group, through which the gate commits the access policy and each
# EHR's directives.
[api]
admin = true

# The URL clients reach the server at, which every SCIM location names.
[server]
public_base_url = "http://127.0.0.1:58080"

# The SCIM endpoint the gate provisions the Basic user through, by the
# `basic-users` client scripts/scim-provision.sh grants scim_provision first.
[auth.scim]

[record]
subject_index = "local"

[record.signing]
mode = "pgp"
key_file = "/etc/ferroehr/signing.asc"
key_passphrase_file = "/etc/ferroehr/signing-passphrase"
