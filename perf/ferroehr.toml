# The server configuration of the performance gate (scripts/perf/gate.sh):
# the shipped defaults with one Basic user for the request set, bound through
# SCIM as the development configuration binds its users, and the EHR index
# kept local, so the gate measures FerroEHR and no FerroPIX. The background
# workers run as the defaults start them.

[deployment]
profile = "sandbox"

# The issuer the Basic user binds under. It signs nothing: its key set, which
# every FerroEHR image carries, is the public half of a key pair whose private
# key was discarded.
[[auth.issuer]]
issuer = "https://basic-users.ferroehr.invalid"
kind = "persons"
audience = ["ferroehr-basic-users"]
jwks_file = "/opt/sandbox-posture/basic-users-jwks.json"

[[auth.party]]
issuer = "https://basic-users.ferroehr.invalid"
identifier_issuer = "urn:ferroehr:basic-user"
identifier_type = "login"

# The issuer of the provisioning client scripts/perf/gate.sh binds the Basic
# user through: a machines issuer over the COMMITTED TEST key set of
# docs/conformance/party/scim/ (never production material).
[[auth.issuer]]
issuer = "https://scim.ferroehr.invalid"
kind = "machines"
audience = ["ferroehr-scim"]
token_types = ["at+jwt"]
jwks_file = "/etc/ferroehr/scim-jwks.json"

# ferroehr / ferroehr (Argon2id), the request set's one caller.
[[auth.basic.users]]
user = "ferroehr"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$ZmVycm9laHJEZXZTYWx0$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"
scopes = ["user/composition-*.cruds", "user/template-*.cruds", "user/aql-*.cruds", "__ferroehr.platform"]
roles = ["ADMIN", "USER"]

[authz.rbac]
enabled = false

[authz.party_binding]
provider = { issuer = "urn:oid:2.999.7.9", id = "perf" }

[[authz.party_binding.basic_user]]
user = "ferroehr"
key_issuer = "urn:ferroehr:basic-user"
key = "ferroehr"

# The SCIM endpoint the gate provisions the Basic user through.
[auth.scim]
public_base_url = "http://127.0.0.1:58080"

[[auth.scim.client]]
issuer = "https://scim.ferroehr.invalid"
client_id = "basic-users"
scope = "ferroehr/scim"
binding_issuer = "urn:ferroehr:basic-user"

[record]
subject_index = "local"
