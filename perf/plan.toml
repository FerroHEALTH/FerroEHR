# The plan of the performance gate, read by ferrohealth-perf through
# scripts/perf/gate.sh (docs/release.md, "The performance gate"). The gate
# seeds the server and fills each upper-case placeholder between at signs with
# what the seed created, so the committed plan names no id. The request set
# reads one seeded EHR whose content never changes and writes into another, so
# the reads are as fast at the end of the window as at its start.
#
# The clinical groups (EHR read, composition commit and read, the AQL queries
# and the export) carry the per-arm clinical credential: in an arm whose tree
# runs the access path that is the clinician, whom the access evaluator judges
# by a care relationship, its role's controller rule and each EHR's
# directives, and every
# access writes a signed access-log entry (#5590); in an older arm it is the
# administrator.
# The administrative groups (EHR create, the template upload, the demographic
# reads and the access-log read) are sent as the administrator.

[idle]
duration_secs = 60
max_cpu_percent = 2.0
max_transactions_per_second = 5.0
settle_secs = 11

[load]
rate = 20.0
warmup_secs = 10
duration_secs = 60
max_in_flight = 256
saturation_ms = 5000
timeout_ms = 10000
max_lag_ms = 10
sample_ms = 100
settle_secs = 11

[[requests]]
group = "ehr_create"
method = "POST"
path = "/ferroehr/rest/openehr/v1/ehr"
status = 201
headers = { authorization = "@AUTH@", prefer = "return=minimal" }

[[requests]]
group = "ehr_read"
method = "GET"
path = "/ferroehr/rest/openehr/v1/ehr/@READ_EHR@"
status = 200
headers = { authorization = "@CLINICAL_AUTH@", accept = "application/json" }

[[requests]]
group = "composition_commit"
method = "POST"
path = "/ferroehr/rest/openehr/v1/ehr/@WRITE_EHR@/composition"
status = 201
body = '''@COMPOSITION@'''
headers = { authorization = "@CLINICAL_AUTH@", content-type = "application/json", prefer = "return=minimal" }

[[requests]]
group = "composition_read"
method = "GET"
path = "/ferroehr/rest/openehr/v1/ehr/@READ_EHR@/composition/@READ_COMPOSITION@"
status = 200
headers = { authorization = "@CLINICAL_AUTH@", accept = "application/json" }

[[requests]]
group = "aql_order_by"
method = "POST"
path = "/ferroehr/rest/openehr/v1/query/aql"
status = 200
body = '''@AQL_ORDER_BY@'''
headers = { authorization = "@CLINICAL_AUTH@", content-type = "application/json", accept = "application/json" }

[[requests]]
group = "aql_unordered"
method = "POST"
path = "/ferroehr/rest/openehr/v1/query/aql"
status = 200
body = '''@AQL_UNORDERED@'''
headers = { authorization = "@CLINICAL_AUTH@", content-type = "application/json", accept = "application/json" }

# A population query over the population the seed writes (PERF_POPULATION in
# scripts/perf/gate.sh): it names no EHR, so the access log writes one entry
# for each EHR it serves (up to its LIMIT), the cost the gate holds against
# the base and counts in the summary (#5126, #5564).
[[requests]]
group = "aql_population"
method = "POST"
path = "/ferroehr/rest/openehr/v1/query/aql"
status = 200
body = '''@AQL_POPULATION@'''
headers = { authorization = "@CLINICAL_AUTH@", content-type = "application/json", accept = "application/json" }

[[requests]]
group = "template_upload"
method = "POST"
path = "/ferroehr/rest/openehr/v1/definition/template/adl1.4"
status = 409
body = '''@TEMPLATE@'''
headers = { authorization = "@AUTH@", content-type = "application/xml" }

[[requests]]
group = "party_read"
method = "GET"
path = "/ferroehr/rest/openehr/v1/demographic/person/@READ_PARTY@"
status = 200
headers = { authorization = "@AUTH@", accept = "application/json" }

[[requests]]
group = "party_version_read"
method = "GET"
path = "/ferroehr/rest/openehr/v1/demographic/versioned_party/@READ_PARTY_VO@"
status = 200
headers = { authorization = "@AUTH@", accept = "application/json" }

# The export of the read EHR as openEHR EXTRACTs (our own route): every
# versioned object of the EHR, judged and recorded as one export.
[[requests]]
group = "export"
method = "GET"
path = "/ferroehr/rest/extensions/v1/message/export/@READ_EHR@"
status = 200
headers = { authorization = "@CLINICAL_AUTH@", accept = "application/json" }

# A read of the access log through the RESTful ATNA ITI-81 retrieval, which
# every arm serves: the newest page of the AuditEvents it renders from the
# stored entries.
[[requests]]
group = "access_log_read"
method = "GET"
path = "/ferroehr/rest/fhir/r4/AuditEvent?date=ge2026-01-01&_count=20"
status = 200
headers = { authorization = "@AUTH@", accept = "application/fhir+json" }
