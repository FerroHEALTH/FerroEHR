# The prose half of the Rust-dependency VEX document.
#
# `security/vex/rust-advisories.openvex.json` is GENERATED from this file joined
# with `deny.toml`, by `scripts/security/vex-generate.sh`. Never hand-edit the
# JSON — `scripts/checks/vex-advisories.sh` regenerates it and fails on any
# difference.
#
# WHY TWO FILES RATHER THAN ONE. The set of accepted advisory ids has exactly
# one authority — the `[advisories].ignore` array in `deny.toml`, which is the
# gate that actually decides whether a build passes. Duplicating that list here
# would create the second list this repository has already been bitten by (a
# stale `.cargo/audit.toml` nothing read). So the ids come from `deny.toml` and
# only the reasoning lives here, and the generator REFUSES to run if the two
# sets disagree in either direction.
#
# The OpenVEX vocabulary is not free text: `status` and `justification` are
# controlled fields from the specification
# (https://github.com/openvex/spec/blob/main/OPENVEX-SPEC.md). A justification
# must be one of `component_not_present`, `vulnerable_code_not_present`,
# `vulnerable_code_not_in_execute_path`,
# `vulnerable_code_cannot_be_controlled_by_adversary`,
# `inline_mitigations_already_exist` — and the `impact` below has to actually
# argue for the one chosen. "Low risk" is not a justification.
#
# Aliases are transcribed from the advisory's own RustSec entry
# (https://rustsec.org/advisories/) so a scanner keyed on a CVE or GHSA
# identifier rather than a RUSTSEC one still matches the statement.
#
# THE DEPENDENCY PATH IS STRUCTURED, NOT ONLY PROSE. Every statement's argument
# rests on WHERE the affected crate enters the build, and an impact statement
# that names the wrong path is a false claim that reads perfectly — that
# happened here: the `rsa` statement asserted the crate was reached only through
# `openidconnect` while `cargo tree -i rsa` had shown a second path through
# `pgp` all along. So each statement declares the path as data, and
# `scripts/checks/vex-reachability.sh` compares it against the graph cargo
# resolves:
#
#   crate            the affected package name
#   version          optional; pins the `cargo tree -i` query when several
#                    versions of the crate coexist in the graph, and states
#                    which one the argument is about
#   carriers         the crates that depend DIRECTLY on it (depth 1 of the
#                    inverted tree) — exhaustive, in both directions
#   workspace_roots  the workspace members it is reachable from — a graph fact
#                    over every feature, target and dependency kind, so test
#                    and tooling crates appear here; it is NOT a claim about
#                    what the shipped artifacts contain (that argument belongs
#                    in `impact`)
#
# Both sets are exhaustive: naming a crate the graph does not have fails, and
# so does a crate in the graph the statement does not name. An empty pair
# asserts the crate is absent from the resolved graph entirely, which is what
# makes a `component_not_present` justification checkable.

[document]
# A stable IRI for the document, and a timestamp that is HAND-SET rather than
# taken from the clock: the generator must be deterministic, or the drift check
# would fail on every run. Bump `version` and `timestamp` together whenever a
# statement changes.
id = "https://ferroehr.eu/vex/rust-dependency-advisories"
author = "Cadasto B.V."
role = "vendor"
timestamp = "2026-10-24T00:00:00Z"
version = 10

# What the statements are about: the released server binary, the container
# image built from it, and the viewer image. The server artifacts carry the
# same Cargo dependency graph; the viewer image carries the viewer's graph,
# which every statement below names in its `workspace_roots` where it applies.
products = [
  "pkg:cargo/ferroehr-server",
  "pkg:oci/ferroehr",
  "pkg:oci/ferroehr-viewer",
]

# ── Accepted by the advisory gate ───────────────────────────────────────────
# Every id here MUST appear in `deny.toml`'s `[advisories].ignore`, and every id
# there MUST appear here. The generator enforces both directions.

[[accepted]]
id = "RUSTSEC-2023-0071"
crate = "rsa"
aliases = ["CVE-2023-49092", "GHSA-c38w-74pg-36hr", "GHSA-4grx-2x9w-596c"]
carriers = ["openidconnect", "pgp"]
workspace_roots = [
  "ferroehr",
  "ferroehr-viewer",
  "ferroehr-ext",
  "ferroehr-rest",
  "ferroehr-server",
  "openehr-adl",
  "openehr-its",
  "openehr-rm",
  "openehr-sdt",
  "testkit",
]
status = "not_affected"
justification = "vulnerable_code_cannot_be_controlled_by_adversary"
impact = """
The Marvin timing sidechannel leaks information about an RSA PRIVATE key \
through the timing of private-key operations, so what matters is whether a \
FerroEHR process performs one. Two paths reach the crate. Through \
`openidconnect`, in the OIDC authentication path, the sole RSA operation is \
verifying an RS256 signature on an ID token with the identity provider's \
PUBLIC key: there is no secret in that computation for a timing observation to \
recover. Through `pgp`, in VERSION signing, an RSA operation would be a \
private-key one — but only in `[signing] mode = "pgp"`, which is not the \
default: the shipped default is `digest` mode (SHA-256 over the canonical \
form), which uses no asymmetric key at all, so the default artifact performs no \
RSA private-key operation. A deployment that does enable `pgp` mode chooses its \
own OpenPGP key, and an ECC/EdDSA signing key keeps `rsa` off the signing path \
entirely; a deployment that enables `pgp` mode with an RSA key is outside this \
statement and should rotate to an ECC key. `ferroehr-ext` reaches the crate \
through the same two carriers as the platform library it extends, so the same \
argument covers it. The viewer (`ferroehr-viewer`) reaches the crate through `openidconnect` alone, \
in its OIDC login, where the only RSA operation is the same PUBLIC-key \
verification of the identity provider's ID-token signature; it does not \
depend on `pgp`. The spec crates (`openehr-rm`, `openehr-its`, \
`openehr-sdt`, `openehr-adl`) reach `rsa` only through their path-only dev-dependency on the \
`testkit` harness (which depends on the platform library): a test-only edge \
cargo strips at packaging, so no published crate ships the code at all. No \
upstream fix exists — `rsa` has no patched release — so this is not a deferred \
upgrade. Re-evaluate if a release beyond rsa 0.9 ships, or if the default \
signing mode changes.\
"""

[[accepted]]
id = "RUSTSEC-2026-0387"
crate = "crypto-bigint"
version = "0.5.5"
carriers = ["cx448", "elliptic-curve"]
workspace_roots = [
  "ferroehr",
  "ferroehr-viewer",
  "ferroehr-ext",
  "ferroehr-rest",
  "ferroehr-server",
  "openehr-adl",
  "openehr-its",
  "openehr-rm",
  "openehr-sdt",
  "testkit",
]
status = "not_affected"
justification = "vulnerable_code_cannot_be_controlled_by_adversary"
impact = """
The advisory concerns crypto-bigint operations meant to be constant-time \
(borrowing subtraction, trailing-zero counting, `div_rem`, `nlimbs`, \
Montgomery multiplication, `UintRef` equality) that can branch on their \
operands, which leaks only when an operand is SECRET. crypto-bigint 0.5.5 is \
reached through `cx448` (Ed448) and `elliptic-curve` 0.13 (the ECDSA curves \
`p256`, `p384`, `p521`, `k256`), all carried by `pgp`, and through `p256` and \
`p384` under `openidconnect`. In VERSION signing (`[signing] mode = "pgp"`, \
not the default `digest` mode), an ECDSA or Ed448 signature would run that \
arithmetic over the private key and the nonce, so `PgpKey::from_parts` in \
`app/ferroehr/src/versioning/signature/key.rs` refuses either algorithm as \
the signing component with `KeyError::RefusedAlgorithm` before the boot check \
makes any signature, and the server does not start (#3965). Ed25519 signs on \
`curve25519-dalek` and RSA on `num-bigint-dig`, neither of which reaches the \
crate. What remains is verification: of VERSION signatures against the \
configured and retired certificates, of the licence token against the \
licensor's certificates, and, in the viewer, of the identity provider's \
ES256 or ES384 ID-token signature. Every operand there is a public key, a \
public signature or a public digest, so a timing observation has no secret \
to recover. Parsing an unencrypted ECDSA secret key file checks the scalar's \
range once before the refusal; that runs at boot over an operator's local \
file and cannot be repeated or timed by an adversary. The spec crates reach \
the crate only through their path-only dev-dependency on `testkit`, which \
cargo strips at packaging. No fix exists on the 0.5 line (only 0.7.6 and \
later are patched), and no release of `pgp` (0.21.0), `cx448` (0.1.1) or \
`openidconnect` (4.0.1) leaves it. Re-evaluate when `pgp` and \
`openidconnect` release on crypto-bigint 0.7.6 or later, and before the \
signing refusal is lifted.\
"""

# ── Reported by lock-file scanners only ─────────────────────────────────────
# Advisories `cargo-deny` never raises, because it resolves FEATURES, while a
# scanner reading `Cargo.lock` alone cannot. These must NOT be in `deny.toml`'s
# ignore list — an ignore for an advisory the gate never raises records nothing
# and would start applying silently if the tool ever became lock-file-based —
# and the generator refuses if one appears there.
#
# This section is the whole reason a consumer needs this document: it is
# precisely the class of finding that reaches a downstream scanner and has no
# explanation attached anywhere in the repository.
#
# The section is EMPTY today. Its one entry, RUSTSEC-2026-0235 (`rkyv` 0.7
# out-of-bounds read), was carried while `rust_decimal` declared an optional
# `rkyv ^0.7.46` that no feature of ours enabled but the lock file still
# pinned; `rust_decimal` 1.43.0 dropped that requirement, `rkyv` left the
# resolved graph and the lock file together, and the statement went with it
# rather than being renewed.
