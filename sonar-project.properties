# SonarQube Cloud project scope (#2630). Advisory instrument — see
# .claude/rules/ai-code-review.md for the standing law.
sonar.projectKey=FerroHEALTH_FerroEHR
sonar.organization=ferrohealth
sonar.projectName=FerroEHR
sonar.sourceEncoding=UTF-8

# Hand-written trees only. The generated spec crates, the generated parts of
# openehr-its, the vendored spec text/corpora/assets, and machine-produced
# records are excluded: findings on bytes a generator or a vendor script owns
# are noise the attribution law forbids acting on in place.
sonar.sources=app,crates,tools,scripts,deploy,website

# Coverage: the sonar.yml lane runs the instrumented nextest suites
# (cargo-llvm-cov) and imports the merged lcov (owner directive 2026-08-24).
# The coverage denominator stays meaningful: test/bench code and the trees no
# unit test can execute (shell scripts, deployment manifests, the website)
# are excluded from the metric — they remain analyzed for findings.
#
# ONE file, deliberately (#3131). The suites run in parallel shards and the
# lane merges their reports with `lcov -a`, which sums hit counts. This
# property does accept a comma-separated list, but the SonarQube Cloud coverage
# documentation says multiple reports are "consumed sequentially without a
# defined strategy for handling conflicts" — and every shard's report carries
# every instrumented line, so a report chosen rather than summed understates
# the number the README badge shows. Never list the shard files here.
sonar.rust.lcov.reportPaths=lcov.info
# The viewer joined the coverage exclusions on #2862: its acceptance
# instrument is the browser journey battery (scripts/ui-e2e.sh, 139 journeys
# against the real stack) plus the published-image login probe — none of
# which an lcov run can see (the viewer executes in a browser/wasm), so the
# metric misstated verified code as uncovered, and unit tests that merely
# execute Leptos view macros are the line-execution-only class testing.md
# forbids. The crate stays fully analyzed for issues and duplication.
sonar.coverage.exclusions=\
  scripts/**,\
  deploy/**,\
  website/**,\
  **/tests/**,\
  **/benches/**,\
  app/ferroehr-viewer/**

# Duplication-only exclusions (sonar.cpd.exclusions — the files stay fully
# analyzed for issues; only the copy-paste detector skips them), adjudicated
# on #2862:
#   - The ITS-REST wire-declaration surface: every `#[utoipa::path]` block
#     deliberately mirrors its released operation file 1:1 so reviewers can
#     hold it against the vendored spec, and the release's own party CRUD is
#     five byte-identical quintets — the repetition IS the notation, and a
#     macro would hide exactly what gets verified. Covers the per-group
#     openapi_routes.rs files and the declaration-dominated handler files
#     (relationship, archetype, the admin archive/report/dump_load/marks
#     quartet, adhoc, and the two extension route files). `marks.rs` joined
#     the quartet on #3410, measured the same way: 212 duplicated lines in 10
#     blocks, 31.8% of the file and the dominant contributor to a 6.9%
#     new-code density. Every block is either a `responses(...)` table or the
#     three-line handler body, and neither can be shared. A response row is
#     the published description of THAT operation, so serving one text for
#     several operations would be worse documentation than the repetition;
#     and the body shape is forced, because `#[utoipa::path]` introspects a
#     real `fn` taking the whole Request (`bytes::Bytes` has no `ToSchema`),
#     so a macro would hide the attribute that IS the route's contract.
#   - The codegen decision maps and generation-twin templates: the plan
#     override map is a declarative spec-cited table, and the per-generation
#     template copies are near-identical BY the #1964 design.
#   - Two pinned expectation TABLES (adjudicated on #2915, the same class as
#     the decision maps): vendor_bmm_schema.rs is the per-fixture
#     adjudication register over all 43 vendored BMM schemas (one Case row
#     per file, each carrying its decided outcome + citation), and
#     model_query.rs pins the model-query report row-for-row — every
#     "duplicated" run is a decided record, and compressing the rows hides
#     the adjudication the file exists to carry.
sonar.cpd.exclusions=\
  app/ferroehr-rest/src/api/*/openapi_routes.rs,\
  app/ferroehr-rest/src/api/demographic/relationship.rs,\
  app/ferroehr-rest/src/api/definition/archetype.rs,\
  app/ferroehr-rest/src/api/admin/archive.rs,\
  app/ferroehr-rest/src/api/admin/report.rs,\
  app/ferroehr-rest/src/api/admin/dump_load.rs,\
  app/ferroehr-rest/src/api/admin/marks.rs,\
  app/ferroehr-rest/src/api/query/adhoc.rs,\
  app/ferroehr-rest/src/extensions/event_subscription.rs,\
  app/ferroehr-rest/src/extensions/tenant_routes.rs,\
  tools/openehr-codegen/src/plan/overrides.rs,\
  tools/openehr-codegen/templates/**,\
  crates/openehr-lang/tests/it/vendor_bmm_schema.rs,\
  tools/openehr-codegen/tests/it/model_query.rs

# SQL is excluded as a language: every .sql here is PostgreSQL (migrations,
# fixtures), and Sonar's PLSQL analyzer assumes Oracle — its Data Dictionary
# rules (S3641 and friends) warn on every analysis and can never apply.
# Correctness for our SQL is owned by sqlx, PostgreSQL itself, and the CNF
# suite.
#
# The lang/term crate-root entries below are the emit-json/module-declaration
# outputs the generator writes OUTSIDE those crates' generation modules
# (`// @generated` headers; openehr-lang's json_serde.rs alone is ~40k lines)
# — they escaped the original generated-tree list (#2656), against this
# file's own stated intent. Their correctness is owned by the emitter
# invariants and the fidelity gates, like every other generated tree here.
sonar.exclusions=\
  **/*.sql,\
  crates/openehr-base/**,\
  crates/openehr-rm/**,\
  crates/openehr-am/**,\
  crates/openehr-lang/src/v1_0/**,\
  crates/openehr-lang/src/v1_1/**,\
  crates/openehr-term/src/v3_1/**,\
  crates/openehr-lang/src/json_serde.rs,\
  crates/openehr-lang/src/lib.rs,\
  crates/openehr-lang/src/prelude.rs,\
  crates/openehr-term/src/json_serde.rs,\
  crates/openehr-term/src/lib.rs,\
  crates/openehr-term/src/prelude.rs,\
  crates/openehr-its/src/aom2/**,\
  crates/openehr-its/src/aom2_model/**,\
  crates/openehr-its/src/json_codec/generated/**,\
  crates/openehr-its/src/opt14/**,\
  crates/openehr-its/src/rest/generated/**,\
  crates/openehr-its/src/xml/generated/**,\
  crates/openehr-adl/tests/corpus/**,\
  crates/openehr-adl/vendor/**,\
  crates/openehr-its/schemas/**,\
  crates/openehr-its/tests/vendor/**,\
  crates/openehr-its/vendor/**,\
  crates/openehr-lang/tests/vendor/**,\
  crates/openehr-lang/vendor/**,\
  crates/openehr-query/vendor/**,\
  crates/openehr-term/assets/**,\
  tools/openehr-codegen/vendor/**,\
  corpus/**,\
  deploy/helm/golden/**,\
  website/book/theme/**,\
  website/book/src/katex/**
