[package]
name = "config-reference"
version.workspace = true
description = "Generates FerroEHR's configuration reference page and default ferroehr.toml from the JSON Schema of its configuration tree"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
ferroehr = { path = "../../app/ferroehr", features = ["schema"] }
schemars.workspace = true
# NOTE: preserve_order keeps the schema's properties in declaration order, the
# order the reference and the default ferroehr.toml list the keys in (#6734).
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
