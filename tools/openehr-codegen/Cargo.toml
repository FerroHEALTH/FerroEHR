[package]
name = "openehr-codegen"
version.workspace = true
description = "BMM-driven code generator: emits the openEHR spec crates from the vendored BMM meta-model"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[[bin]]
name = "openehr-codegen"
path = "src/main.rs"

[dependencies]
# NOTE: preserve_order reads a BMM class's properties, generic parameters and
# constants in document order, the order of every emitted type (#6734).
serde_json = { workspace = true, features = ["preserve_order"] }
roxmltree.workspace = true      # XSD reader (emit-xml)
serde_norway.workspace = true   # OAS YAML reader (emit-rest)
http.workspace = true           # the status registry the emitted client outcomes name (emit-rest)

[lints]
workspace = true
