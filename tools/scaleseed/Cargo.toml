[package]
name = "scaleseed"
version.workspace = true
description = "The scale test's bulk seeder: compositions committed through the service, cloned into a store of millions with COPY, checked against the commit path, and measured"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

# Commits its prototypes through the platform library's own commit path and
# reads them back through its own read path, so the rows it clones are the
# rows the product writes.
[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
ferroehr = { path = "../../app/ferroehr" }
ferrohealth-smart = { workspace = true }
ferrohealth-config = { workspace = true }
futures = { workspace = true }
jiff = { workspace = true }
openehr-its = { path = "../../crates/openehr-its" }
openehr-query = { path = "../../crates/openehr-query" }
openehr-rm = { path = "../../crates/openehr-rm" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
testkit = { path = "../testkit" }

[lints]
workspace = true
