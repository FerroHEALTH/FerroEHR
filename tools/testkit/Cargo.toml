[package]
name = "testkit"
version.workspace = true
description = "Shared test-database harness: one PostgreSQL 18 server + template-database cloning for every DB-backed test"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
# The platform library supplies the pool builder + the embedded migrators
# (`db::connect`, `db::run_migrations`, `db::migration_fingerprint`), so the
# template database is migrated by exactly the code the binary ships. The
# app crates' own tests consume `testkit` as a dev-dependency — a
# dev-dependency cycle, which cargo explicitly permits (dev-dependencies are
# not part of the release dependency graph; see the Cargo book, "Specifying
# Dependencies § Development dependencies").
ferroehr = { path = "../../app/ferroehr" }

# Wall-clock time (the clone-name time base + the sweep's grace window) comes
# from the pinned time library, never `std::time::SystemTime`
# (clippy.toml `disallowed-methods`); monotonic deadlines use `std::time::Instant`.
jiff = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# The startup sweep reports what it reclaimed and why a drop was skipped;
# libraries speak `tracing`, never stdio (the workspace lints deny both print
# macros). No subscriber is installed by the harness — a test binary that wants
# the sweep's log installs one.
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }   # random scratch-database names
# `reusable-containers` (experimental upstream) keeps ONE named PG container
# alive across nextest's process-per-test model and across whole runs.
testcontainers = { workspace = true, features = ["reusable-containers"] }
testcontainers-modules = { workspace = true }
# `syslog_tls`: the in-process syslog-over-TLS repository the audit tests send
# their ATNA trail to, with a CA and leaf `rcgen` mints at bind time.
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }

[lints]
workspace = true
