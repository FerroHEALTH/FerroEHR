[book]
title = "FerroEHR Documentation"
authors = ["Ruben Talstra"]
description = "User documentation for FerroEHR, a pure-Rust openEHR Clinical Data Repository."
language = "en"
src = "src"

[output.html]
default-theme = "rust"
preferred-dark-theme = "coal"
additional-css = ["theme/custom.css"]
additional-js = ["theme/mermaid.min.js", "theme/mermaid-init.js", "theme/version-picker.js"]
git-repository-url = "https://github.com/FerroHEALTH/FerroEHR"
edit-url-template = "https://github.com/FerroHEALTH/FerroEHR/edit/main/website/book/{path}"
smart-punctuation = true

[output.html.search]
enable = true

# The viewer section moved from `admin-ui/` to `viewer/` when the product was
# renamed FerroEHR Viewer. mdBook writes an HTML shim at each old path so links
# already published keep resolving
# (https://rust-lang.github.io/mdBook/format/configuration/renderers.html).
# The two FHIR connector pages were removed with the connector; their old paths
# land on the section index.
[output.html.redirect]
"/admin-ui/index.html" = "../viewer/index.html"
"/admin-ui/queries.html" = "../viewer/queries.html"
"/admin-ui/browsing.html" = "../viewer/browsing.html"
"/admin-ui/demographics.html" = "../viewer/demographics.html"
"/admin-ui/terminology.html" = "../viewer/terminology.html"
"/admin-ui/operations.html" = "../viewer/operations.html"
"/admin-ui/fhir.html" = "../viewer/index.html"
"/viewer/fhir.html" = "index.html"
"/beyond-core/fhir.html" = "index.html"
"/admin-ui/subscriptions.html" = "../viewer/subscriptions.html"
"/admin-ui/dark-mode.html" = "../viewer/dark-mode.html"

[preprocessor.mermaid]
command = "mdbook-mermaid"

# Math is pre-rendered to static HTML at build time — no client-side JS, no
# CDN (the site's zero-external-requests rule). no-css: the KaTeX stylesheet
# is self-hosted (src/katex/, linked from theme/head.hbs) and must stay on
# the same KaTeX release as the renderer — see src/katex/PROVENANCE.md.
[preprocessor.katex]
after = ["links"]
output = "html"
no-css = true

[preprocessor.toc]
command = "mdbook-toc"
renderer = ["html"]
