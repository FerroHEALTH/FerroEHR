#
# The source of the two EHDS pages under website/book/src/compliance/.
# `scripts/render/ehds-pages.sh` renders them; the `ehds-pages` CI job
# re-renders and diffs, so a status typed into a page instead of here fails
# the build.
#
# THE REGULATION IS THE AUTHORITY. Every requirement id, heading and date
# below was read from the Official Journal text vendored at
# docs/law/eu/ehds/text.html (https://eur-lex.europa.eu/eli/reg/2025/327/oj,
# OJ L series, 2025/327, 5.3.2025) on 2026-10-06. The `summary` fields are OUR
# paraphrase for navigation; they are not the requirement, and the page says
# so beside them. Nothing here restates the legal text as if it were binding.
#
# THE POSITION. Cadasto B.V. is the manufacturer of each tagged release, and
# the EHR system is FerroEHR and FerroBRIDGE together: FerroEHR ships the
# European logging software component, FerroBRIDGE the European
# interoperability software component (owner decisions of 2026-10-06, #3606,
# recorded in docs/architecture.md "Regulatory position (EHDS and CRA)").
#
# STATUS VOCABULARY. A status is about the SOFTWARE, never about conformity:
# no conformity assessment has been carried out and no EU declaration of
# conformity exists.
#
#   shipped  — the capability exists in a released version and something
#              committed demonstrates it (`evidence` names what).
#   partial  — part of the capability exists; `gap` says what is missing.
#   planned  — tracked work, not built; `issues` names the tracker items.
#   open     — an open question, legal or technical, that has to be answered
#              before a status can be given at all. `question` states it.
#
# A `partial` or `open` row names its open tracker issue in `issues` where
# one exists.
# Adding a requirement means reading it from the regulation, not from here.

regulation:
  title: >-
    Regulation (EU) 2025/327 of the European Parliament and of the Council of
    11 February 2025 on the European Health Data Space and amending Directive
    2011/24/EU and Regulation (EU) 2024/2847
  url: https://eur-lex.europa.eu/eli/reg/2025/327/oj
  journal: OJ L series, 2025/327, 5.3.2025
  # Every row re-read first-hand against docs/law/eu/ehds/text.html on this
  # date. The verification note on each page names it, so a reader knows how
  # old the reading is.
  read_on: "2026-10-06"

# Article 105, verbatim in substance, paraphrased in wording.
dates:
  - when: "26 March 2027"
    what: The Regulation applies from this date.
  - when: "26 March 2029"
    what: >-
      Articles 25, 26, 27, 47, 48 and 49 apply to the priority categories of
      personal electronic health data in Article 14(1)(a), (b) and (c), and to
      EHR systems the manufacturer intends to process them.
  - when: "26 March 2031"
    what: >-
      The same articles apply to the categories in Article 14(1)(d), (e) and
      (f), and Chapter III applies to EHR systems put into service in the
      Union as described in Article 26(2).

# Article 25(1). The two components Chapter III requires an EHR system to
# include, and which product of the declared EHR system ships each.
components:
  - id: interoperability
    name: European interoperability software component for EHR systems
    status: open
    issues: [3080]
    note: >-
      Shipped by FerroBRIDGE, the other product of the EHR system Cadasto B.V.
      declares, which holds the mappings from openEHR to the European
      electronic health record exchange format and reads FerroEHR over
      ITS-REST. The format itself is set by implementing acts under Article
      15(1) that have not been adopted, so no component can emit it yet.
      FerroEHR's in-tree FHIR connector is to be retired in favour of
      FerroBRIDGE.
  - id: logging
    name: European logging software component for EHR systems
    status: partial
    note: >-
      Shipped by FerroEHR: the access-event model, the audit store with its
      hash chain and the scheduled verification of that chain, the DICOM and
      FHIR renderings and the sinks, the middleware that records and
      classifies every API access, the ITI-81 retrieval, and the retention
      register. All five Annex II 3.2 elements are recorded, and every access
      record outside the demographic domain carries a category; a token that
      names a client application is recorded as that client, together with
      the professional it acts for when the deployment declares the claim
      that names one. The central store and review
      of the log are planned to move to FerroSYS in a later release.

# Annex II, "Essential requirements for the harmonised software components of
# EHR systems and for products for which interoperability with EHR systems has
# been claimed". Ids and group headings are the Annex's own.
requirements:
  - group: "1"
    heading: General requirements
    items:
      - id: "1.1"
        summary: >-
          The components achieve the performance the manufacturer intended and
          are suitable for their intended purpose in normal use, without
          putting patient safety at risk.
        status: partial
        issues: [3682]
        evidence:
          - text: The manufacturer's intended-purpose statement
            href: intended-purpose.md
          - text: The hazard log of the logging component
            href: hazard-log.md
        gap: >-
          Cadasto B.V. states the intended purpose, and the hazard log assesses
          the logging component against it in normal conditions of use, each
          hazard with its control and the test that shows it. H9, an emergency
          access to data restricted under EHDS Art. 8, is controlled by the
          emergency mark; the Art. 8 restriction itself is planned. The
          interoperability component's assessment is FerroBRIDGE's. The
          Regulation names no method for showing performance or safety, and no
          conformity assessment has examined either.
      - id: "1.2"
        summary: >-
          The components can be supplied and installed following the
          manufacturer's instructions without adversely affecting their
          characteristics and performance.
        status: partial
        issues: [3678]
        evidence:
          - text: The instructions for use
            href: instructions-for-use.md
          - text: Deployment artifacts and their documented installation
            href: ../installation/index.md
        gap: >-
          The instructions for use set the production profile, which refuses
          to start while a separation is missing. The Helm chart and the
          Compose files declare the `sandbox` profile explicitly, and the
          chart's values say what a deployment holding patient data sets
          instead, but an installation that follows the quickstart instead of
          the instructions still runs the sandbox posture, which must not hold
          real personal data; the server says so on every boot and on
          `GET /ferroehr/rest/status`. No shipped values file boots under
          `production` yet.
      - id: "1.3"
        summary: >-
          Interoperability, safety and security features uphold the rights of
          natural persons in line with the intended purpose, as set out in
          Chapter II.
        status: partial
        issues: [3682]
        evidence:
          - text: The rights the software can serve, and who must serve the rest
            href: shared-responsibility.md
          - text: One patient's access log, through a subject-scoped grant
            href: ../audit.md#retrieving-audit-records-iti-81
        gap: >-
          Most Chapter II rights are served through the electronic health data
          access services Member States establish (Art. 4(1)) and through the
          deploying organisation; the shared-responsibility page says which
          side each falls on. An access declared with an agreed emergency
          purpose code is marked in its access record and shown to the person
          through the subject-scoped retrieval, as Art. 11(5) asks
          ([emergency access](../audit.md#emergency-access-ehds-art-115)); the
          mark lifts no restriction. FerroEHR does not yet hold the Art. 8
          restriction of access by health professionals, so a Member State
          access service or the deploying organisation enforces it.
      - id: "1.4"
        summary: >-
          Components intended to operate with other products, including
          medical devices, are designed so interoperability and compatibility
          are reliable and secure and data can be shared with the device.
        status: partial
        evidence:
          - text: The access log's IHE ATNA transactions and mutual TLS
            href: ../audit.md#node-authentication-iti-19-mutual-tls
          - text: Medical device purposes are outside the intended purpose
            href: intended-purpose.md#what-the-intended-purpose-excludes
        gap: >-
          The logging component works with other products through IHE ATNA:
          ITI-20 feeds, ITI-81 retrieval, ITI-19 mutual TLS. The syslog feed
          ships with UDP transport when switched on, which delivers no record
          reliably and encrypts none, so `deployment_profile = "production"`
          refuses it unless `audit_syslog_udp` is accepted by name; TLS syslog
          and the outbox-driven FHIR feed are the reliable choices, and the
          instructions for use name them. FerroEHR claims no
          interoperability with a medical device; a device manufacturer that
          claims it carries Art. 27(1).
  - group: "2"
    heading: Requirements for interoperability
    items:
      - id: "2.1"
        summary: >-
          A system that stores or intermediates personal electronic health
          data provides an interface giving access to it in the European
          electronic health record exchange format, through the European
          interoperability software component.
        status: open
        question: >-
          This requirement is carried by FerroBRIDGE, which ships the
          interoperability component of the EHR system and reads FerroEHR over
          ITS-REST. The exchange format is set by implementing acts under
          Art. 15(1) that have not been adopted; the two EHDS implementing
          acts adopted so far, 2026/2083 (Art. 23) and 2026/2099 (Art. 16),
          set neither the format nor the Art. 36 common specifications.
        issues: [3080]
        evidence:
          - text: The interoperability component is FerroBRIDGE's part of the system
            href: intended-purpose.md#what-the-intended-purpose-excludes
      - id: "2.2"
        summary: >-
          Such a system can receive personal electronic health data in that
          format, through the same component.
        status: open
        question: >-
          Carried by FerroBRIDGE, and waiting on the same Art. 15(1)
          implementing acts as 2.1.
        issues: [3080]
      - id: "2.3"
        summary: >-
          A system designed to provide access to personal electronic health
          data can receive it in that format, through the same component.
        status: open
        question: >-
          Carried by FerroBRIDGE, and waiting on the same Art. 15(1)
          implementing acts as 2.1.
        issues: [3080]
      - id: "2.4"
        summary: >-
          A system that lets a user enter structured personal electronic
          health data allows entry with enough granularity to provide it in
          the exchange format.
        status: partial
        evidence:
          - text: Templates and the archetype-constrained entry model
            href: ../templates-validation.md
        gap: >-
          Clinical applications enter structured data through the REST API
          against operational templates, which constrain it to the archetype's
          granularity, finer than an exchange format is likely to need. That
          the granularity suffices cannot be shown until the Art. 15(1)
          implementing acts set the format's datasets.
      - id: "2.5"
        summary: >-
          The components include no feature that prohibits, restricts or
          unduly burdens authorised access, sharing or permitted use.
        status: shipped
        evidence:
          - text: The re-assessment against the authorisation defaults
            href: claims-review.md#annex-ii-25-re-assessed
          - text: The query surface over the whole stored record
            href: ../querying-aql.md
          - text: Authorisation refuses or permits; it adds no commercial gate
            href: ../security.md
      - id: "2.6"
        summary: >-
          The components include no feature that prohibits, restricts or
          unduly burdens exporting the data in order to replace the system
          with another product.
        status: shipped
        evidence:
          - text: Whole-repository dump and load
            href: ../operations-admin-apis.md
          - text: EHR-Extract export
            href: ../beyond-core/messaging.md
  - group: "3"
    heading: Requirements for security and logging
    items:
      - id: "3.1"
        summary: >-
          A system used by health professionals provides reliable
          identification and authentication of them.
        status: shipped
        evidence:
          - text: Basic and OAuth2/OIDC authentication
            href: ../security.md#authentication
          - text: The assurance level and the natural person on patient data
            href: ../security.md#assurance-level-and-the-natural-person-on-patient-data
      - id: "3.2"
        # Both (a) and (b) are about the ACCESSING side: (a) the provider or
        # other entity, (b) the specific natural person. Neither is the data
        # subject, which the element does not name at all.
        summary: >-
          The European logging software component records, for every access
          event or group of events, at least the healthcare provider or other
          individuals who accessed the data, the specific natural person or
          persons who accessed it, the categories of data, the time and date,
          and the origin of the data.
        status: partial
        evidence:
          - text: The five elements mapped onto fields, gaps included
            href: ../audit.md#the-ehds-logging-elements-mapped
          - text: The category map a deployment declares
            href: ../installation/config-audit.md#auditcategories
        gap: >-
          Points (a), (d) and (e) are recorded: the accessing organisation, the
          time, and the origins of the served data read from the FEEDER_AUDIT
          provenance openEHR stamps on content, with the true distinct count
          beside the capped set. Point (b) records the authenticated principal
          and, when the deployment declares how a token names the natural
          person, the acting mode and the professional a client application
          acts for. Point
          (c) is recorded through the `[audit.categories]` map the deployment
          declares from its templates and archetypes to the Art. 14(1)
          priority categories; FerroEHR ships no map, so until one is declared
          every access is recorded unclassified. Records in the demographic
          domain carry no category, because no priority category lives there.
          The FHIR rendering of a read or a query carries the origins of the
          served data. The DICOM rendering
          carries neither the organisation, the declared purpose, the origins
          nor the categories, because PS3.15 A.5 defines no element for them.
      - id: "3.3"
        summary: >-
          The components include tools or mechanisms to review and analyse the
          log data, or support connecting external software that does.
        status: shipped
        evidence:
          - text: Audit retrieval (IHE ATNA ITI-81) and the syslog and FHIR feeds
            href: ../audit.md
      - id: "3.4"
        summary: >-
          Components that store personal electronic health data support
          different retention periods and access rights that take the origin
          and category of the data into account.
        status: partial
        evidence:
          - text: Retention periods keyed on a priority category
            href: retention.md#keying-a-period-on-a-priority-category
          - text: The access-log horizon in calendar years, and its floors
            href: ../installation/config-audit.md#auditstore-the-local-audit-record-repository
          - text: Access rights per EHR, per role and per template
            href: ../security.md#abac-attribute-based-fine-grained
        gap: >-
          A retention period can be keyed on the priority category of clinical
          content, through the category map the deployment declares, and an
          unclassified object takes the longest period configured for its
          kind. The access log's horizon is set in calendar years
          (`retention_years`), with a three-year floor in every EU Member State
          (Art. 9(2)) and a longer national floor where one applies. Access
          rights can be keyed on the template through ABAC; the category is not
          itself an authorisation attribute. Neither retention nor access
          rights are keyed on the ORIGIN of the data. The origins FerroEHR
          records are the `FEEDER_AUDIT` originating-system ids a sending system
          chooses, as free text, and data committed directly carries none, so a
          period keyed on an origin could neither be checked against a declared
          vocabulary, as a category is, nor reach the data without a feeder
          audit; keying on origin first needs a register of the origins a
          deployment recognises. The archival tier moves records without
          expiring them.

