# Annex I, the priority categories of personal electronic health data for
# primary use. The headings are the Annex's own; `characteristics` is the
# count of sub-points the Annex lists under a category, not a paraphrase of
# them.
#
# `template` names a template committed to this repository's curated CKM pack
# that carries that category's data. A category with none is not a category
# FerroEHR cannot store — the CDR stores whatever an operational template
# defines — it is a category with no COMMITTED example, so nothing here can
# demonstrate the export end to end.
#
# `fhir` names the resource type a mapping for that category would target.
# The façade is mapping-driven and resource-agnostic: no mapping set ships,
# and a deployment registers its own. That is the honest state, and the
# matrix says it rather than implying a catalogue exists.
priority_categories:
  - id: "1"
    name: Patient summaries
    template: international-patient-summary
    fhir: Bundle (IPS-shaped) over Patient, Condition, AllergyIntolerance, MedicationStatement
    state: template
  - id: "2"
    name: Electronic prescriptions
    template: eprescription-fhir
    fhir: MedicationRequest
    state: template
  - id: "3"
    name: Electronic dispensations
    template: ""
    fhir: MedicationDispense
    state: no-template
  - id: "4"
    name: Medical imaging studies and related imaging reports
    template: ccta-report
    fhir: DiagnosticReport (+ ImagingStudy for the study itself)
    state: template
    note: >-
      The committed template is a report. The imaging STUDY — the pixel data
      and its DICOM metadata — is not openEHR content and is not stored here;
      a deployment federates it from a PACS.
  - id: "5"
    name: Medical test results, including laboratory and other diagnostic results
    template: generic-lab-test-result
    fhir: DiagnosticReport + Observation
    state: template
  - id: "6"
    name: Discharge reports
    template: ""
    fhir: Composition (discharge summary) + Encounter
    state: no-template

# The owner decisions that settle who carries the manufacturer's duties and
# what the EHR system consists of (#3606, 2026-10-06). Each is a decision, with
# the provisions it rests on.
decisions:
  - id: manufacturer
    text: >-
      **Cadasto B.V. is the manufacturer of each tagged release.** Each tagged
      release (the binaries, the OCI images, the Helm chart and the source
      archive) is one product Cadasto B.V. places on the market. A deployment
      that an organisation runs for itself puts that product into service; it
      does not make the deploying organisation the manufacturer. Cadasto B.V.
      may also host FerroEHR as a service for another organisation; Art. 26(2)
      treats an EHR system "offered as a service" as put into service, and
      Cadasto B.V. is then both the manufacturer and the operator.
    issues: [3606]
  - id: ehr-system
    text: >-
      **The EHR system is FerroEHR and FerroBRIDGE together.** FerroEHR ships
      the European logging software component (Annex II 3), FerroBRIDGE the
      European interoperability software component (Annex II 2.1 to 2.3).
      The two are independent of each other (Art. 2(2)(n) and (o), Art.
      30(1)(b)) because they are separate products that meet only over
      ITS-REST. The technical documentation and the declaration of conformity
      name the pair; FerroBRIDGE declares the interoperability component's
      requirements, FerroEHR the logging component's and the system-level
      ones of Annex II 1.
    issues: [3606]
  - id: one-documentation
    text: >-
      **One documentation set for the EHDS and the CRA.** From 11 December
      2027 one technical documentation set, one EU declaration of conformity
      and one CE marking cover both acts: Article 104 of this Regulation
      inserts CRA Art. 32(5a), which routes the CRA's Annex I conformity
      through the conformity assessment procedure of this Chapter, and
      replaces CRA Art. 31(3) with a single set of technical documentation.
    issues: [3616]
  - id: general-purpose
    text: >-
      **The general-purpose exclusion does not apply.** Article 25(2) excludes
      general purpose software used in a healthcare environment from this
      Chapter. FerroEHR is intended to store the health records of a
      healthcare provider, which is the use Art. 2(2)(k) names, so Cadasto
      B.V. treats it as an EHR system.
    issues: [3606]

# The questions for counsel. Each is a question, and nothing in this
# repository answers it.
counsel:
  - id: modified-source
    question: >-
      Does a deployment that modifies the source and puts the result into
      service become a manufacturer itself (Art. 34 of this Regulation; CRA
      Art. 21 and 22)?
  - id: economic-operators
    question: >-
      What is the scope of the Art. 35 register of economic operators
      supplied: does a download under the public licence supply an economic
      operator?
  - id: cra-latest-version
    question: >-
      Does CRA Art. 13(10), which lets a manufacturer patch only the latest
      version when earlier versions' users get it free of charge, hold for
      commercial licensees under BUSL-1.1?
    issues: [3647]
  - id: hosted-service
    question: >-
      Is a deployment Cadasto B.V. hosts as a service remote data processing
      outside the CRA's product scope (CRA recitals 11 and 12), and is Cadasto
      B.V. then an essential or important entity under NIS2, for example as a
      managed service provider?
  - id: cra-class
    question: >-
      Is FerroEHR an important product with digital elements under CRA Annex
      III and Implementing Regulation (EU) 2025/2392, which decides the
      conformity assessment route for the CRA requirements?
    issues: []
